代への墓制の変化を示す遺跡として評価されています。&#34;},{&#34;name&#34;:&#34;新豊院山古墳群2号墳出土品（三角縁神獣鏡ほか）&#34;,&#34;designation&#34;:&#34;磐田市指定文化財（磐田市観光協会資料による）&#34;,&#34;summary&#34;:&#34;全長約28mの前方後円墳である2号墳から三角縁神獣鏡や鉄製・銅製の鏃などが出土しました。磐田市観光協会の資料では出土品が市指定文化財になっていると記されています。&#34;},{&#34;name&#34;:&#34;新豊院山古墳群出土資料&#34;,&#34;designation&#34;:&#34;磐田市指定文化財（有形・考古資料）&#34;,&#34;summary&#34;:&#34;三角縁神獣鏡、鉄剣・鉄刀・鉄鏃・銅鏃等。&#34;}],&#34;pilgrimage_note&#34;:&#34;磐田郡三十三観音霊場第19番札所&#34;},{&#34;temple_id&#34;:&#34;iwata-0035&#34;,&#34;slug&#34;:&#34;hounji-mukasa&#34;,&#34;name&#34;:&#34;法雲寺&#34;,&#34;name_kana&#34;:&#34;ほううんじ&#34;,&#34;aliases&#34;:[&#34;八幡山&#34;,&#34;磐田あじさい寺&#34;,&#34;法雲庵&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市向笠西374番地&#34;,&#34;district_id&#34;:&#34;koyo&#34;,&#34;area&#34;:&#34;向陽&#34;,&#34;main_deity&#34;:&#34;聖観世音菩薩&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;公開情報調査済み&#34;,&#34;history_summary&#34;:&#34;法雲寺（ほううんじ）は磐田市向笠西にある曹洞宗の寺院で、山号は八幡山、本尊は聖観世音菩薩です。寺伝では寛永11年（1634年）に法雲庵として開創され、8代目の住職のときに法雲寺と改められたとされます。遠州三十三観音霊場第29番札所で、約400株のあじさいが咲く「磐田あじさい寺」として知られます。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9108&#34;},{&#34;title&#34;:&#34;法雲寺（磐田市向笠西・29番札所）遠州三十三観音霊場めぐり&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;霊場会公式サイト。山号八幡山・曹洞宗・本尊聖観世音菩薩、第29番札所、御詠歌、寛永11年（1634）開創・開山観天是音大和尚（新豊院四世）、法地昇格・本堂建立・養心閣建立の縁起を確認。&#34;,&#34;url&#34;:&#34;http://enshu33.com/all-guide/%E6%B3%95%E9%9B%B2%E5%AF%BA/&#34;},{&#34;title&#34;:&#34;磐田北部ありがた歩記（磐田市観光協会パンフレット）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;寛永11年（1634）法雲庵として開創、8代目住職のとき法雲寺に改称、遠州三十三観音29番札所・遠州七福神大黒天札所、境内は向笠城の砦跡との伝承、仏足石・観音像の記述を確認。&#34;,&#34;url&#34;:&#34;https://kanko-iwata.jp/wp2/wp-content/uploads/2023/06/B4_hokubu.pdf&#34;},{&#34;title&#34;:&#34;法雲寺（あじさい）磐田市観光協会&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;「磐田あじさい寺」、約400株のあじさい、見頃6月上旬〜中旬、入園無料、所在地磐田市向笠西374を確認。&#34;,&#34;url&#34;:&#34;https://kanko-iwata.jp/spot/tanoshimu-782/&#34;},{&#34;title&#34;:&#34;遠州三十三観音霊場めぐり 法雲寺（29番札所）&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;八幡山法雲寺（向笠西374）のご本尊が聖観世音菩薩であることを公式ページで確認。&#34;,&#34;url&#34;:&#34;http://enshu33.com/all-guide/%e6%b3%95%e9%9b%b2%e5%af%ba/&#34;},{&#34;title&#34;:&#34;ニッポンの霊場 静岡県の七福神（遠州七福神）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;遠州七福神（昭和期開創・曹洞宗寺院のみで構成）の大黒天＝法雲寺を確認。七福神めぐり資料集（rokumeibunko.com/shichifukujin/22shizuoka/enshu.html）の記載とも一致し、既存注記（磐田市観光協会資料）を裏付け。&#34;,&#34;url&#34;:&#34;https://nippon-reijo.jimdofree.com/%E4%B8%83%E7%A6%8F%E7%A5%9E%E3%82%81%E3%81%90%E3%82%8A/%E9%9D%99%E5%B2%A1%E7%9C%8C%E3%81%AE%E4%B8%83%E7%A6%8F%E7%A5%9E/&#34;}],&#34;research_todos&#34;:[&#34;開山とされる観天是音大和尚と新豊院（向笠竹之内）との本末関係を確認する&#34;,&#34;「8代目住職のときに法雲寺と改称」と霊場会縁起の記述の整合を寺院に確認する&#34;,&#34;向笠城の砦跡と伝わる境内の遺構の有無を現地確認する&#34;,&#34;あじさいの株数・見頃の最新情報を毎年更新する&#34;],&#34;founded_period&#34;:&#34;寛永11年（1634年）に法雲庵として開創されたと伝わる&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;創建と沿革&#34;,&#34;body&#34;:&#34;遠州三十三観音霊場会の縁起によれば、寺の開創は寺伝によると寛永11年（1634年）で、開山は新豊院4世の観天是音大和尚と記されています。磐田市観光協会の資料では、寛永11年（1634年）に法雲庵として開創され、8代目の住職のときに法雲寺と改めたとされています。近代に法地へ昇格し、10世の清巌良規大和尚によって本堂が建立され、開山堂・牌堂・庫裡が増築されました。同縁起には、先代住職が戦後に日曜学校や法雲寺子供会を設けて青少年育成に努め、正力松太郎賞の賞金に私財を加えて坐禅堂「養心閣」を建立したことも記されています。&#34;},{&#34;heading&#34;:&#34;札所と境内の信仰&#34;,&#34;body&#34;:&#34;遠州三十三観音霊場の第29番札所で、御詠歌は「のりのくも あさなゆうなに たなびきて みちびきたもう ただしきわざえ」です。磐田市観光協会の資料では、遠州七福神めぐりの大黒天の札所でもあると記されています。境内は向笠城の砦跡と伝えられています。入口には「仏足石」があり、乗ってお参りすると足が丈夫になると言われています。境内には、足元に老夫婦の像が寄り添う、ぼけずに長生きのご利益があるとされる観音像もあります。&#34;},{&#34;heading&#34;:&#34;磐田あじさい寺&#34;,&#34;body&#34;:&#34;「磐田あじさい寺」と呼ばれ、磐田市観光協会によれば境内には約400株のあじさいが植えられており、見頃は6月上旬から中旬です。境内では早春から初夏にかけて梅・桜・藤・ツツジ・紫陽花が咲き競うと霊場会の資料に記されています。入園は無料です。&#34;}],&#34;pilgrimage_note&#34;:&#34;遠州三十三観音霊場第29番札所（札所本尊聖観世音菩薩）／遠州七福神（大黒天）&#34;},{&#34;temple_id&#34;:&#34;iwata-0036&#34;,&#34;slug&#34;:&#34;anzenji-iwai&#34;,&#34;name&#34;:&#34;安全寺&#34;,&#34;name_kana&#34;:&#34;あんぜんじ&#34;,&#34;aliases&#34;:[&#34;岩井山安全寺&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市岩井1365番地の1&#34;,&#34;district_id&#34;:&#34;koyo&#34;,&#34;area&#34;:&#34;向陽&#34;,&#34;main_deity&#34;:&#34;未確認&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;安全寺は磐田市岩井にある曹洞宗の寺院で、山号は所在地名と同じ岩井山です。『静岡県磐田郡誌』（大正10年）によれば永正10年（1513年）8月の開創で、周智郡久努西村（現袋井市域）の海蔵寺の末寺として、本寺2世の雲山宗越を開山に請じたと伝えられます。本尊など現況の詳細を伝える公開資料は現時点では確認できていません。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9109&#34;},{&#34;title&#34;:&#34;『静岡県磐田郡誌』静岡県磐田郡教育会編（大正10年）コマ463（安全寺の由緒）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション・ログインなしで閲覧可能。全文検索で該当箇所を確認&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680/1/463&#34;},{&#34;title&#34;:&#34;曹洞禅ナビ 磐田市寺院一覧&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;磐田市の公式一覧（全61寺）に「安全寺」として掲載を確認（一覧掲載のみ確認）。詳細ページはサーバー障害で未取得&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_221217.html&#34;},{&#34;title&#34;:&#34;いわた文化財だより第209号&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;令和4年8月1日発行。P3「源平伝説地を訪ねて その4」。鶴ヶ池の由来をめぐる異説として『安全寺記録』を出典に紹介。&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/_res/projects/default_project/_page_/001/007/901/dayori209.pdf&#34;}],&#34;research_todos&#34;:[&#34;創建年代・山号・本尊を『磐田市誌』『磐田郡誌』等の郷土資料で調査する&#34;,&#34;曹洞宗としての本末関係（本寺）を宗派名簿で確認する&#34;,&#34;鶴ヶ池・桶ヶ谷沼周辺（岩井地区）の歴史と寺の関わりを調査する&#34;,&#34;現地の縁起板・石碑・墓域の確認&#34;,&#34;磐田市観光協会「磐田北部ありがた歩記」地図に地点表示があるため、観光協会・ふれあいガイドへの聞き取りを検討する&#34;,&#34;本尊を郡誌コマ420前後の寺院一覧表（表組のためOCR判読困難）または現地・市史資料で確認する&#34;,&#34;本寺海蔵寺（旧周智郡久努西村・現袋井市域）の現況と本末関係を確認する&#34;,&#34;曹洞禅ナビ復旧後に詳細ページ（index_221217）を再確認（調査時サーバー障害で未取得）&#34;],&#34;founded_period&#34;:&#34;永正10年（1513年）&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;磐田郡誌が伝える由緒&#34;,&#34;body&#34;:&#34;『静岡県磐田郡誌』（磐田郡教育会編、大正10年）の向笠村安全寺の項によれば、寺は向笠村岩井字殿か谷（現磐田市岩井）に在り、岩井山と号し、周智郡久努西村の海蔵寺の末寺です。永正10年（1513年）8月の開創で、本寺海蔵寺の2世雲山宗越を請じて開山としました。岩井は太田川中流右岸に位置する集落で、明治の町村制以降は磐田郡向笠村の大字でした。&#34;,&#34;sources_used&#34;:[&#34;静岡県磐田郡誌（大正10年）コマ463&#34;]},{&#34;heading&#34;:&#34;現況と基礎情報&#34;,&#34;body&#34;:&#34;静岡県知事所轄宗教法人名簿に、磐田市岩井1365番地の1の曹洞宗寺院として掲載されています。本尊・伽藍・現在の本末関係などを伝える公開資料は現時点では確認できていません。&#34;,&#34;sources_used&#34;:[&#34;静岡県知事所轄宗教法人名簿&#34;]},{&#34;heading&#34;:&#34;『いわた文化財だより』からの補足&#34;,&#34;body&#34;:&#34;安全寺（磐田市岩井）に伝わる記録「安全寺記録」は、源頼朝が岩井村を訪れた際に鶴ヶ池の名の由来となったとする伝承（寿永2年〈1183年〉3月、頼朝が岩井村で足を痛め、天神社に平癒祈願して鶴の脚に金の札を付けて池に放したところ、以来「鶴ヶ池」と呼ばれるようになったという説）を伝える郷土史料として引用されている。&#34;}],&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0037&#34;,&#34;slug&#34;:&#34;hofukuji-okubo&#34;,&#34;name&#34;:&#34;保福寺&#34;,&#34;name_kana&#34;:&#34;ほうふくじ&#34;,&#34;aliases&#34;:[&#34;大久山&#34;,&#34;保福院&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市大久保361番地&#34;,&#34;district_id&#34;:&#34;koyo&#34;,&#34;area&#34;:&#34;向陽&#34;,&#34;main_deity&#34;:&#34;釈迦如来&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;公開情報調査済み&#34;,&#34;history_summary&#34;:&#34;保福寺（ほうふくじ）は磐田市大久保にある曹洞宗の寺院で、山号は大久山、本尊は釈迦如来です。磐田市観光協会の資料によれば、大藤村開拓の祖とされる栗野林太夫が小庵を開くよう命じて開かれた大久山保福院を前身とし、宝暦2年（1752年）の焼失後に村人と共に再建されて保福寺と改められたと伝えられます。早春の椿寒桜が咲く花の寺として知られます。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9110&#34;},{&#34;title&#34;:&#34;磐田北部ありがた歩記（磐田市観光協会パンフレット）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;山号大久山・曹洞宗・本尊釈迦如来、栗野林太夫（大藤村開拓の祖）による開基、宝暦2年（1752）焼失・再建と改称、『磐田郡誌』の寛永19年（1642）開創説、花の名所としての記述を確認。&#34;,&#34;url&#34;:&#34;https://kanko-iwata.jp/wp2/wp-content/uploads/2023/06/B4_hokubu.pdf&#34;},{&#34;title&#34;:&#34;保福寺（椿寒桜）磐田市観光協会&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;椿寒桜の見頃が2月中旬〜下旬であること、河津桜・修善寺寒桜・おかめ桜も同時期に咲くこと、入園無料、所在地磐田市大久保361を確認。&#34;,&#34;url&#34;:&#34;https://kanko-iwata.jp/spot/tanoshimu-788/&#34;},{&#34;title&#34;:&#34;保福寺（曹洞禅ナビ・曹洞宗公式寺院ポータルサイト）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;曹洞宗寺院として磐田市大久保361に所在することを確認。公式ホームページ・SNSへのリンクが存在する旨の記載あり。&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_221219.html&#34;}],&#34;research_todos&#34;:[&#34;栗野林太夫と大藤村開拓の経緯を郷土資料で確認する&#34;,&#34;『磐田郡誌』の寛永19年（1642年）開創記事の原文を確認する&#34;,&#34;保福院から保福寺への改称時期の裏付けを取る&#34;,&#34;公式サイト・SNS（曹洞禅ナビにリンク表示あり）の所在を特定し公式情報を収集する&#34;,&#34;椿寒桜の植栽の由来を寺院に確認する&#34;,&#34;曹洞禅ナビ復旧後に詳細ページ（index_221219）を再確認（調査時サーバー障害で未取得）&#34;],&#34;founded_period&#34;:&#34;江戸時代前期。『磐田郡誌』では寛永19年（1642年）の開創とも記される。宝暦2年（1752年）焼失後に再建&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;創建と沿革&#34;,&#34;body&#34;:&#34;磐田市観光協会の「磐田北部ありがた歩記」によれば、大藤村開拓の祖とされる栗野林太夫が小庵を開くように命じ、大久山保福院が開かれました。宝暦2年（1752年）に焼失したため、村人と共に再建して大久山保福寺と改めたとされます。『磐田郡誌』によれば寛永19年（1642年）の開創であるとも記されています。曹洞宗公式の寺院ポータルサイトにも磐田市大久保361の曹洞宗寺院として掲載されています。&#34;},{&#34;heading&#34;:&#34;花の寺&#34;,&#34;body&#34;:&#34;早春の桜の名所として知られ、磐田市観光協会によれば2月中旬から下旬にかけて椿寒桜が見頃を迎え、同時期には河津桜・修善寺寒桜・おかめ桜なども咲きます。春から夏にかけては梅やつつじ、あじさいなど色とりどりの花が楽しめ、夏の青モミジ、秋には色づいたモミジやイチョウが目を引きます。山門にはタヌキの置物が置かれ、参拝者を迎えています。入園は無料です。&#34;}]},{&#34;temple_id&#34;:&#34;iwata-0038&#34;,&#34;slug&#34;:&#34;shogenin-kojima&#34;,&#34;name&#34;:&#34;正眼院&#34;,&#34;name_kana&#34;:&#34;しょうげんいん&#34;,&#34;aliases&#34;:[&#34;拈華山&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市小島738番地&#34;,&#34;district_id&#34;:&#34;fukude&#34;,&#34;area&#34;:&#34;福田&#34;,&#34;main_deity&#34;:&#34;千手観世音菩薩&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;公開情報調査済み&#34;,&#34;history_summary&#34;:&#34;正眼院（しょうげんいん）は磐田市小島にある曹洞宗の寺院で、山号は拈華山、本尊は千手観世音菩薩です。寺伝では治承年中（1177〜1181年）に平家の侍大将・平景清（悪七兵衛景清）を開基として建立されたと伝えられ、永正12年（1515年）に雲林寺（森町）8世の孤山堯隣和尚を迎えて曹洞宗寺院として再興されました。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-12&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9111&#34;},{&#34;title&#34;:&#34;正眼院（曹洞禅ナビ・曹洞宗公式寺院ポータルサイト）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;拈華山正眼院・磐田市小島738・曹洞宗・本尊千手観世音菩薩、治承年中の平景清開基伝承、真言宗寺院（十町四方・坊舎数十・寺領95石）からの改宗、永正12年（1515）雲林寺8世孤山堯隣和尚による再興、坐禅会・法話会の開催を確認。&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220927.html&#34;},{&#34;title&#34;:&#34;サーチ寺院 静岡県磐田市の寺院一覧&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;正眼院＝磐田市小島738番地・曹洞宗であることを確認。&#34;,&#34;url&#34;:&#34;https://www.bukyou.com/BukyBukyou/TBukyou22/C22CNo211Detail.html&#34;},{&#34;title&#34;:&#34;ニッポンの霊場 磐田郡三十三観音霊場&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;第3番＝拈華山正眼院（曹洞宗・小島738・千手観世音菩薩）を確認。&#34;,&#34;url&#34;:&#34;https://nippon-reijo.jimdofree.com/%E6%8E%B2%E8%BC%89%E9%9C%8A%E5%A0%B4%E3%81%AE%E4%B8%80%E8%A6%A7/%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/%E7%A3%90%E7%94%B0%E9%83%A1%E4%B8%89%E5%8D%81%E4%B8%89%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/&#34;},{&#34;title&#34;:&#34;ニッポンの霊場 豊田郡三十三観音霊場&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;豊田郡三十三観音第15番＝正眼院を確認。同霊場は正眼院の隠居が始めたと伝わる。&#34;,&#34;url&#34;:&#34;https://nippon-reijo.jimdofree.com/%E6%8E%B2%E8%BC%89%E9%9C%8A%E5%A0%B4%E3%81%AE%E4%B8%80%E8%A6%A7/%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/%E8%B1%8A%E7%94%B0%E9%83%A1%E4%B8%89%E5%8D%81%E4%B8%89%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/&#34;},{&#34;title&#34;:&#34;曹洞禅ナビ 正眼院（2023年8月11日時点アーカイブ）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;本尊・山号・開創（治承年中、平景清開基）・旧真言宗（坊舎数十・寺領95石）・雲林寺末（開山は雲林寺8世孤山堯隣和尚）・坐禅会月1回・公式HPリンクを確認。調査時は本体サイトがサーバー障害のためWayback Machineのスナップショットを使用&#34;,&#34;url&#34;:&#34;https://web.archive.org/web/20230811110842/https://sotozen-navi.com/detail/index_220927.html&#34;},{&#34;title&#34;:&#34;正眼院 公式サイト&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;曹洞禅ナビ経由で坐禅会・法話会・墓地/納骨堂案内の記載を確認&#34;,&#34;url&#34;:&#34;https://www.syougenninn28.com/&#34;},{&#34;title&#34;:&#34;正眼院 磐田市 曹洞宗（Facebook）&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;寺院公式Facebookページの存在を確認（投稿内容の詳細確認には至らず）&#34;,&#34;url&#34;:&#34;https://www.facebook.com/syougenninn/&#34;}],&#34;research_todos&#34;:[&#34;平景清開基伝承の典拠（寺蔵文書・『磐田市誌』等）を確認する&#34;,&#34;真言宗時代の寺名・坊舎の名称が伝わっていないか調査する&#34;,&#34;永正12年（1515年）再興の月日（8月15日との情報あり）を宗派資料で確認する&#34;,&#34;かつて統括していた末寺11か寺の寺名を調査する&#34;,&#34;公式サイト（syougenninn28.com）が404となっているため、公式情報の現況を確認する&#34;,&#34;小島地区と天竜川流路の変遷と寺の関係を調査する&#34;,&#34;曹洞禅ナビの「お寺について・年間行事」下層ページ（article_220927_1〜4）は未アーカイブのため、サイト復旧後に由緒の続き（永正12年の曹洞宗再興の記述等）と年間行事の詳細を確認する&#34;,&#34;公式サイト www.syougenninn28.com は2026年7月時点で404（閉鎖の可能性）。リンク掲載の扱いを要判断&#34;,&#34;正眼院公式サイト内の「お寺について・年間行事」「お役立ち」ページに直接アクセスし、施餓鬼会・彼岸会等の具体的な日程を確認する&#34;,&#34;坐禅会が現在も継続開催されているか（コロナ後の再開状況）を確認する&#34;,&#34;護持会・世話人会など檀家組織の有無を確認する&#34;,&#34;駐車場の有無を現地確認する&#34;],&#34;founded_period&#34;:&#34;治承年中（1177〜1181年）の開創と伝わる&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;創建と平景清の伝承&#34;,&#34;body&#34;:&#34;曹洞宗公式の寺院ポータルサイトに掲載された由緒によれば、治承年中（1177〜1181年）に平家の侍大将・平悪七兵衛景清を開基として建立されたと伝えられます。当初は真言宗の寺院で、10町四方の境内に数十の坊舎があり、寺領も95石あったと伝えられますが、平家滅亡後に寺領は没収され、寺は衰退しました。&#34;},{&#34;heading&#34;:&#34;曹洞宗としての再興&#34;,&#34;body&#34;:&#34;永正12年（1515年）、雲林寺（静岡県森町）8世の孤山堯隣和尚を請して古跡地を開墾し、7町余りを境内と定めて曹洞宗寺院として再興されたと伝えられます。雲林寺の末寺にあたり、かつては末寺11か寺を統括していたとされます。現在は月に1度の坐禅会や法話会が開かれています。&#34;},{&#34;heading&#34;:&#34;平景清を開基と伝える由緒&#34;,&#34;body&#34;:&#34;曹洞宗の公式ポータル「曹洞禅ナビ」の正眼院ページには、治承年中（1177〜1181年）に平家の侍大将悪七兵衛平景清を開基として開創されたとの由緒が掲載されています。往古は真言宗に属し、十町四方の境内に数十の坊舎が立ち並び、寺領も95石を数えたと伝わります。のちに曹洞宗へ改められ、遠江の名刹雲林寺（周智郡森町）の末寺となりました。開山は雲林寺8世の孤山堯隣和尚です。&#34;}],&#34;pilgrimage_note&#34;:&#34;磐田郡三十三観音霊場第3番札所（札所本尊千手観世音菩薩）／豊田郡三十三観音霊場第15番札所（享保年間開創の歴史的霊場・現在は活動していない）&#34;,&#34;danka_info&#34;:{&#34;annual_events&#34;:[{&#34;name&#34;:&#34;年中行事&#34;,&#34;timing&#34;:&#34;&#34;,&#34;note&#34;:&#34;坐禅会を月に1度開催（曹洞禅ナビ掲載。ほかに法話会・ご朱印・七福神の各項目が公式ページに登録されています）&#34;},{&#34;name&#34;:&#34;坐禅会&#34;,&#34;timing&#34;:&#34;月1回&#34;,&#34;note&#34;:&#34;寺院公式サイトに月例開催の記載がある。新型コロナウイルス対策で一時休止していたとする情報もあり、現況は要確認&#34;},{&#34;name&#34;:&#34;法話会&#34;,&#34;timing&#34;:&#34;不明&#34;,&#34;note&#34;:&#34;寺院公式サイトに開催の記載があるが、具体的な時期・頻度は確認できていない&#34;}],&#34;official_site&#34;:{&#34;status&#34;:&#34;あり&#34;,&#34;url&#34;:&#34;https://www.syougenninn28.com/&#34;,&#34;checked_at&#34;:&#34;2026-07-12&#34;},&#34;cemetery&#34;:&#34;公式サイトに「お墓・納骨堂の案内 お気軽にご相談ください」との記載があり、墓地・納骨堂に関する相談を受け付けている。永代供養墓か個別墓かなど詳細は確認できていない&#34;,&#34;parking&#34;:&#34;公式サイト・曹洞禅ナビいずれにも駐車場に関する具体的な記載は確認できなかった&#34;}},{&#34;temple_id&#34;:&#34;iwata-0039&#34;,&#34;slug&#34;:&#34;mannenji-kusasaki&#34;,&#34;name&#34;:&#34;萬然寺&#34;,&#34;name_kana&#34;:&#34;まんねんじ&#34;,&#34;aliases&#34;:[&#34;宝喜山萬然寺&#34;,&#34;万然寺（新字体表記）&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市草崎2430番地の1&#34;,&#34;district_id&#34;:&#34;nanbu&#34;,&#34;area&#34;:&#34;南部&#34;,&#34;main_deity&#34;:&#34;薬師如来&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;萬然寺は磐田市草崎にある曹洞宗の寺院で、山号は宝喜山、本尊は薬師如来です。『静岡県磐田郡誌』（大正10年）が引く寺伝によれば、元亀年間（1570〜1573年）から当地にあった薬師堂を前身とし、慶長18年（1613年）に袖浦村（現磐田市岡）聖寿寺7世全雄の徒である知伝が村民と協力して一寺としました。草崎の光嚴寺などと同じく聖寿寺の末寺です。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9112&#34;},{&#34;title&#34;:&#34;『静岡県磐田郡誌』静岡県磐田郡教育会編（大正10年）コマ455（萬然寺の由緒）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション・ログインなしで閲覧可能。全文検索で該当箇所を確認&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680/1/455&#34;},{&#34;title&#34;:&#34;曹洞禅ナビ 磐田市寺院一覧&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;磐田市の公式一覧（全61寺）に「萬然寺」として掲載を確認（一覧掲載のみ確認）。詳細ページはサーバー障害で未取得&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220944.html&#34;}],&#34;research_todos&#34;:[&#34;創建年代・山号・本尊を『磐田市誌』等の郷土資料で調査する&#34;,&#34;寺名の読み（まんねんじ）と表記（萬然寺／万然寺）の正式形を確認する&#34;,&#34;曹洞宗の本末関係（本寺）を宗派名簿で確認する&#34;,&#34;草崎地区の歴史（天竜川東岸の集落史）と寺の関わりを調査する&#34;,&#34;現地の縁起板・石碑の確認&#34;,&#34;前身の薬師堂の由来と本尊薬師如来の像容・年代を市史・文化財資料で確認する&#34;,&#34;本寺聖寿寺（磐田市岡）との現在の本末関係を確認する&#34;,&#34;曹洞禅ナビ復旧後に詳細ページ（index_220944）を再確認（調査時サーバー障害で未取得）&#34;],&#34;founded_period&#34;:&#34;慶長18年（1613年）（前身の薬師堂は元亀年間から）&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;磐田郡誌が伝える由緒&#34;,&#34;body&#34;:&#34;『静岡県磐田郡誌』（磐田郡教育会編、大正10年）の長野村萬然寺の項によれば、寺は長野村草崎字中雨垂（現磐田市草崎）に在り、宝喜山と号し、袖浦村聖寿寺の末寺で、本尊は薬師如来です。寺伝によれば、初め元亀年間（1570〜1573年）から薬師堂がありましたが、慶長18年（1613年）、聖寿寺7世全雄の徒である知伝が村民と協力してここに一寺を創めたといいます。草崎には萬然寺のほか光嚴寺・徳源庵・良照庵・寿正寺といった聖寿寺末の寺庵が並び、いずれも慶長から寛永にかけて聖寿寺の歴代住持の弟子たちによって開かれています。&#34;,&#34;sources_used&#34;:[&#34;静岡県磐田郡誌（大正10年）コマ455&#34;]},{&#34;heading&#34;:&#34;現況と基礎情報&#34;,&#34;body&#34;:&#34;静岡県知事所轄宗教法人名簿に、磐田市草崎2430番地の1の曹洞宗寺院として掲載されています。伽藍や行事など現況の詳細を伝える公開資料は現時点では確認できていません。&#34;,&#34;sources_used&#34;:[&#34;静岡県知事所轄宗教法人名簿&#34;]}],&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0040&#34;,&#34;slug&#34;:&#34;jushouji-kusasaki&#34;,&#34;name&#34;:&#34;壽正寺&#34;,&#34;name_kana&#34;:&#34;じゅしょうじ&#34;,&#34;aliases&#34;:[&#34;瑞応山&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市草崎691番地の1&#34;,&#34;district_id&#34;:&#34;nanbu&#34;,&#34;area&#34;:&#34;南部&#34;,&#34;main_deity&#34;:&#34;聖観世音菩薩（『静岡県磐田郡誌』による）&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;壽正寺は磐田市草崎にある曹洞宗の寺院です。大正10年（1921年）刊『静岡県磐田郡誌』は、草崎字六所前に在って瑞応山と号し、袖浦村聖寿寺の末寺で本尊は聖観世音菩薩と記し、寺伝として平重盛の建立・七堂伽藍の存在と、文明14年（1482年）2月の如海による再興を伝えます。江戸時代には観音堂領8石2斗余の朱印地を有し、慶安2年（1649年）の朱印状や『遠江国風土記伝』などに記録が残ります。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9113&#34;},{&#34;title&#34;:&#34;静岡県磐田郡誌（磐田郡教育会編、大正10年）寺院由緒「壽正寺（長野村）」&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション（インターネット公開・保護期間満了）コマ455&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680&#34;},{&#34;title&#34;:&#34;細江町史 資料編7（1987年）慶安2年8月17日朱印状&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;NDLデジタルコレクション全文検索スニペットで本文確認&#34;},{&#34;title&#34;:&#34;遠江国風土記伝（内山真竜、郁文舎、明治33年刊本）草崎の項&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;NDL全文検索スニペット「觀音堂壽正寺、朱符之寺田高八石貳」&#34;},{&#34;title&#34;:&#34;元禄高帳による元禄期遠江国石高表（磐田市誌編纂室、1976年）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;草崎村663.056石・8.288石寿正寺観音堂領&#34;},{&#34;title&#34;:&#34;可睡斎史料集 第5巻 僧録司記録1（思文閣出版、1998年）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;「平僧寺遠江国豊田郡草崎村御朱印八石弐斗余寿正寺」&#34;},{&#34;title&#34;:&#34;磐田の民俗（磐田市誌シリーズ第7冊、1984年）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;草崎の5か寺すべて曹洞宗との記述&#34;},{&#34;title&#34;:&#34;寺院大鑑 東海・北陸篇（久遠出版、1982年）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;寿正寺 草崎691 掲載&#34;},{&#34;title&#34;:&#34;曹洞禅ナビ 磐田市寺院一覧&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;公式一覧で名称・住所（〒438-0067 磐田市草崎691-1）を確認し当該寺と同定。磐田市内にはもう1か寺同名の壽正寺（index_221000）が登録されており混同注意。一覧上にコンテンツ登録アイコン・写真なし＝掲載は基本情報のみとみられる。詳細ページ本体はサーバー障害で未取得&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220933.html&#34;}],&#34;research_todos&#34;:[&#34;創建年代・山号・本尊を『磐田市誌』等の郷土資料で調査する&#34;,&#34;表記（壽正寺／寿正寺）の正式形を宗教法人名簿で確認する&#34;,&#34;曹洞宗の本末関係（本寺）を宗派名簿で確認する&#34;,&#34;同じ草崎地区の萬然寺との関係の有無を調査する&#34;,&#34;現地の縁起板・石碑の確認&#34;,&#34;『磐田市郷土資料目録』（1985年）に「寿正寺」の由緒書の存在が記されているが、草崎・蛭池どちらの寿正寺の文書か未確認&#34;,&#34;『磐田市史 史料編2 近世』に見える「禅宗寿正寺薬師堂領」の記録は、境内に薬師堂を持つ蛭池の寿正寺のものである可能性が高く、草崎の壽正寺と混同しないよう要確認&#34;,&#34;『静岡県磐田郡誌』下巻の山号一覧で瑞応山の表記を再確認（複数の復刻版で判読差がある）&#34;],&#34;founded_period&#34;:&#34;寺伝では平安時代末期（平重盛の建立と伝える）。文明14年（1482年）に如海が再興&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;瑞応山壽正寺の由緒—平重盛建立の寺伝と文明14年の再興&#34;,&#34;body&#34;:&#34;大正10年（1921年）刊『静岡県磐田郡誌』の寺院由緒には「壽正寺（長野村）【由緒】長野村草崎字六所前に在り。瑞應山と號す。袖浦村聖壽寺の末にして、本尊は聖觀世音菩薩なり。寺傳に依れば、平重盛の建立にして七堂伽藍ありしが、文明十四年二月、如海師之を再興せしといふ」と記されています。平重盛（小松内大臣）の建立はあくまで寺伝であり、確実な史料で裏づけられるのは室町時代後期の文明14年（1482年）の再興伝承からです。江戸時代後期の地誌『遠江国風土記伝』（内山真竜）も草崎村の寺院を「曹洞宗、聖壽寺の末、平僧住す」と記しており、袖浦村（現磐田市南部）の聖寿寺との本末関係が近世を通じて続いていたことがうかがえます。長野村は明治22年（1889年）に草崎などが合併して成立した村で、現在の磐田市南部に当たります。&#34;},{&#34;heading&#34;:&#34;観音堂領8石2斗余—幕府朱印状に見える近世の壽正寺&#34;,&#34;body&#34;:&#34;壽正寺は江戸時代を通じて観音堂領の朱印地を有していました。『細江町史 資料編7』（1987年）所収の慶安2年（1649年）8月17日付朱印状には「遠江国豊田郡草崎郷寿正寺観音堂領同村之内八石弐斗余事、任先規寄附之訖、全可収納」とあり、3代将軍徳川家光の代に先規に任せて8石2斗余が寄附されたことが分かります。『遠江国風土記伝』も「觀音堂壽正寺、朱符之寺田高八石貳斗（余）」と記し、磐田市誌編纂室『元禄高帳による元禄期遠江国石高表』（1976年）では草崎村663石余のうち8石2斗8升8合が寿正寺観音（堂領）とされています。また可睡斎史料集の僧録司記録にも「平僧寺　遠江国豊田郡草崎村　御朱印八石弐斗余　寿正寺」と見え、可睡斎僧録の管下で朱印を認められた平僧寺として位置づけられていました。清水秀明編著『東海道見付宿の助郷』（1990年）も草崎村の項で寺領8石2斗8升8合の曹洞宗寿正寺の存在を記しています。&#34;},{&#34;heading&#34;:&#34;草崎の曹洞宗寺院群のなかで&#34;,&#34;body&#34;:&#34;『日本歴史地名大系』（平凡社）の草崎村の項によれば、草崎は嘉応3年（1171年）の史料に池田庄の郷名「草前郷」として見える古い土地で、江戸時代は豊田郡に属し、正保郷帳では高515石余の幕府領でした。『磐田の民俗』（磐田市誌シリーズ第7冊、1984年）は、草崎地区の5か寺（寿正寺・光厳寺・良照庵・徳源庵・万然寺）がすべて曹洞宗であると記しており、『静岡県磐田郡誌』でも光厳寺（湯沢山、慶長10年開創）など同地区の諸寺がいずれも聖寿寺末として並んでいます。『寺院大鑑 東海・北陸篇』（1982年）にも草崎691の現在地で掲載されています。なお旧南御厨村蛭池（現磐田市蛭池）にも同名の寿正寺（松龍山・松秀寺末・本尊地蔵菩薩）があり、両者は別の寺院なので史料利用の際には注意が必要です。&#34;}],&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0041&#34;,&#34;slug&#34;:&#34;zenkaiji-nishijima&#34;,&#34;name&#34;:&#34;全海寺&#34;,&#34;name_kana&#34;:&#34;ぜんかいじ&#34;,&#34;aliases&#34;:[&#34;広福山&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市西島452番地の1&#34;,&#34;district_id&#34;:&#34;nanbu&#34;,&#34;area&#34;:&#34;南部&#34;,&#34;main_deity&#34;:&#34;地蔵菩薩（『静岡県磐田郡誌』による）&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;全海寺は磐田市西島にある曹洞宗の寺院で、山号は広福山です。『静岡県磐田郡誌』（大正10年）によれば天文11年（1542年）の草創で、上野部（現磐田市上野部）天龍院の末寺、本尊は地蔵菩薩とされます。江戸時代には朱印寺領3石余を有して正保郷帳や『東海道宿村大概帳』に記録され、西島村の檀那寺として宗門改帳にも見える東海道沿いの寺院です。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9114&#34;},{&#34;title&#34;:&#34;静岡県磐田郡誌（磐田郡教育会編、大正10年）寺院由緒（「金海寺（田原村）」として掲載）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;コマ448。原本画像で由緒全文を確認&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680&#34;},{&#34;title&#34;:&#34;日本歴史地名大系「西島村」（平凡社、コトバンク）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;正保郷帳の全海寺領3石余・菅谷氏陣屋の記載&#34;,&#34;url&#34;:&#34;https://kotobank.jp/word/西島村&#34;},{&#34;title&#34;:&#34;遠江国風土記伝（内山真竜、郁文舎、明治33年刊本）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;「全海寺在西島(曹洞宗)大年派、朱符田高三石貳斗」&#34;},{&#34;title&#34;:&#34;遠淡海地誌（山中豊平編著、1991年復刻）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;広福山・天竜院末の記載（NDL全文検索スニペット）&#34;},{&#34;title&#34;:&#34;静岡県文化財調査報告書第20集 静岡県歴史の道調査報告書 東海道（静岡県教育委員会、1980年）&#34;,&#34;type&#34;:&#34;学術資料&#34;,&#34;note&#34;:&#34;『大概帳』朱印高3石5斗&#34;},{&#34;title&#34;:&#34;可睡斎史料集 第2巻 僧録司文書1（思文閣出版、1991年）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;天和・元禄年中の全海寺・全久寺争論一件&#34;},{&#34;title&#34;:&#34;秘められた遠州の史話と伝承 下（神谷昌志、明文出版社、1988年）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;「菅谷鱗之助と全海寺」の項&#34;},{&#34;title&#34;:&#34;ニッポンの霊場 磐田郡三十三観音霊場&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;第21番＝広福山全海寺（曹洞宗・西島452）を確認。寺名・宗派・住所がDBと一致。&#34;,&#34;url&#34;:&#34;https://nippon-reijo.jimdofree.com/%E6%8E%B2%E8%BC%89%E9%9C%8A%E5%A0%B4%E3%81%AE%E4%B8%80%E8%A6%A7/%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/%E7%A3%90%E7%94%B0%E9%83%A1%E4%B8%89%E5%8D%81%E4%B8%89%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/&#34;},{&#34;title&#34;:&#34;曹洞禅ナビ 磐田市寺院一覧&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;磐田市の公式一覧（全61寺）に「全海寺」として掲載を確認（一覧掲載のみ確認）。詳細ページはサーバー障害で未取得&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_221212.html&#34;}],&#34;research_todos&#34;:[&#34;創建年代・山号・本尊を『磐田市誌』等の郷土資料で調査する&#34;,&#34;曹洞宗の本末関係（本寺）を宗派名簿で確認する&#34;,&#34;西島地区の歴史（天竜川下流域・掛塚湊周辺の集落史）と寺の関わりを調査する&#34;,&#34;磐田市指定天然記念物「須賀神社クス」（西島）など周辺文化財との位置関係を整理する&#34;,&#34;現地の縁起板・石碑の確認&#34;,&#34;『磐田ものがたり』（1988年）「全海寺の下馬地蔵」の全文閲覧（送信サービス限定のため未読）と下馬地蔵の伝承内容の確認&#34;,&#34;可睡斎史料集第2巻所収の全海寺・全久寺争論文書の詳細確認&#34;,&#34;『静岡県磐田郡誌』の寺名表記「金海寺」が誤植か旧表記かの確認（現行名・近世史料はいずれも全海寺）&#34;,&#34;曹洞禅ナビ復旧後に詳細ページ（index_221212）を再確認（調査時サーバー障害で未取得）&#34;],&#34;founded_period&#34;:&#34;天文11年（1542年）草創（『静岡県磐田郡誌』）&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;天文11年草創—天龍院末の広福山全海寺&#34;,&#34;body&#34;:&#34;大正10年（1921年）刊『静岡県磐田郡誌』の寺院由緒は、田原村西島字鍛冶海道に在って広福山と号し、野部村上野部（現磐田市上野部）天龍院の末寺で本尊は地蔵菩薩、天文11年（1542年）の草創で天龍院2世真超和尚を請じて開山とし、明暦2年（1656年）に同院9世連鯨和尚が起立して伝法始祖となり、以来法地に列したと記します（同書ではこの由緒が「金海寺」の寺名で掲載されていますが、所在地・山号・本末関係が他史料の全海寺と一致します）。江戸後期の地誌『遠淡海地誌』も西島の全海寺を広福山・天竜院末と記し、『遠江国風土記伝』（内山真竜）は「全海寺在西島（曹洞宗）大年派、朱符田高三石貳斗」と記録しています。&#34;},{&#34;heading&#34;:&#34;朱印寺領3石余と西島村の檀那寺&#34;,&#34;body&#34;:&#34;『日本歴史地名大系』（平凡社）の西島村の項によれば、西島村は山名郡に属し、東海道三ヶ野橋の東の東海道沿いにあった村で、正保郷帳（正保年間、1644〜1648年）には村高563石余のうち「全海（ぜんかい）寺（現曹洞宗）領三石余・牛頭天王領四石余」が記されています。静岡県教育委員会『静岡県歴史の道調査報告書 東海道』（1980年）は『東海道宿村大概帳』により全海寺の朱印高を3石5斗と記し、磐田史談会編『磐田ものがたり』（1988年）の「全海寺の下馬地蔵」の項にも『大概帳』の「禅宗全海寺西島村往還より小々引込朱印（地）」という記述が引かれています。『静岡県磐田郡誌』所収の西島村宗門改帳には「代々曹洞宗當村全海寺檀那」と繰り返し見え、村民の檀那寺として機能していたことが分かります。また明治12年（1879年）6月には川井小学校の出張所が全海寺に設けられました（同郡誌）。&#34;},{&#34;heading&#34;:&#34;全久寺との争論と菅谷陣屋&#34;,&#34;body&#34;:&#34;可睡斎史料集 第2巻（僧録司文書1、1991年）には「天和・元禄年中遠州山名郡西嶋村全海寺と全久寺と、村内廃寺照明院・堂光庵につき争論一件」と題する一連の文書が収録されており、江戸時代前期に村内の廃寺の権利をめぐって近隣寺院と争論があったことが知られます。また『日本歴史地名大系』によれば西島村は元禄郷帳の頃には旗本菅谷氏の知行地で、須賀神社に隣接して菅谷氏の陣屋がありました。神谷昌志『秘められた遠州の史話と伝承 下』（1988年）には「菅谷鱗之助と全海寺」の項があり、旗本菅谷家と全海寺の関わりを伝えています。&#34;}],&#34;cultural_assets&#34;:[],&#34;pilgrimage_note&#34;:&#34;磐田郡三十三観音霊場第21番札所&#34;},{&#34;temple_id&#34;:&#34;iwata-0042&#34;,&#34;slug&#34;:&#34;toshoji-higashikaizuka&#34;,&#34;name&#34;:&#34;東昌寺&#34;,&#34;name_kana&#34;:&#34;とうしょうじ&#34;,&#34;aliases&#34;:[&#34;招宝山&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市東貝塚1291番地&#34;,&#34;district_id&#34;:&#34;mikuriya&#34;,&#34;area&#34;:&#34;御厨&#34;,&#34;main_deity&#34;:&#34;薬師如来（『静岡県磐田郡誌』による）&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;東昌寺は磐田市東貝塚にある曹洞宗の寺院で、山号は招宝山です。『静岡県磐田郡誌』（大正10年）は東貝塚字中原に在り、西貝塚の福王寺の末寺で本尊は薬師如来、法地格に列すと記します。正保郷帳に「東昌寺領二石」と記録されるなど、江戸時代前期から寺領を有したことが確認できます。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9115&#34;},{&#34;title&#34;:&#34;静岡県磐田郡誌（磐田郡教育会編、大正10年）寺院由緒「東昌寺（御厨村）」&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;コマ449〜450&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680&#34;},{&#34;title&#34;:&#34;日本歴史地名大系「東貝塚村」（平凡社、コトバンク）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;正保郷帳の東昌寺領2石&#34;,&#34;url&#34;:&#34;https://kotobank.jp/word/東貝塚村&#34;},{&#34;title&#34;:&#34;可睡斎史料集 第1巻 寺誌史料（思文閣出版、1989年）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;山名郡東貝塚村御黒印高2石東昌寺（NDL全文検索スニペット）&#34;},{&#34;title&#34;:&#34;旧高旧領取調帳 中部編（木村礎校訂）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;東貝塚村 東昌寺除地2.000石&#34;},{&#34;title&#34;:&#34;昭和初期農村の子供：自然に学ぶ（袴田和夫、1992年）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;目次に「東昌寺」「東昌寺由緒」の章を確認（未読・要調査）&#34;},{&#34;title&#34;:&#34;ニッポンの霊場 遠江四十九薬師霊場&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;第47番＝招宝山東昌寺（曹洞宗・磐田市東貝塚・御本尊薬師如来）を確認。寺名・宗派・町名がDBと一致。&#34;,&#34;url&#34;:&#34;https://nippon-reijo.jimdofree.com/%E6%8E%B2%E8%BC%89%E9%9C%8A%E5%A0%B4%E3%81%AE%E4%B8%80%E8%A6%A7/%E8%96%AC%E5%B8%AB%E9%9C%8A%E5%A0%B4/%E9%81%A0%E6%B1%9F%E5%9B%9B%E5%8D%81%E4%B9%9D%E8%96%AC%E5%B8%AB%E9%9C%8A%E5%A0%B4/&#34;},{&#34;title&#34;:&#34;曹洞禅ナビ 磐田市寺院一覧&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;磐田市の公式一覧（全61寺）に「東昌寺」として掲載を確認（一覧掲載のみ確認）。詳細ページはサーバー障害で未取得&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220999.html&#34;}],&#34;research_todos&#34;:[&#34;山号・本尊・開山を現地の由緒書きや磐田市誌で確認する&#34;,&#34;『日本歴史地名大系』（磐田市東貝塚の項）に記載がないか図書館で確認する&#34;,&#34;曹洞宗静岡県宗務所または本寺との関係（本末関係）を調査する&#34;,&#34;東貝塚地区の郷土資料（区誌・自治会誌）での言及を探す&#34;,&#34;袴田和夫『昭和初期農村の子供：自然に学ぶ』（1992年）に「東昌寺由緒」の章があることをNDL全文検索で確認済み（送信サービス限定のため未読）。創建伝承や近代の沿革が記されている可能性が高い&#34;,&#34;東貝塚村の庄屋後藤家文書（同書所収「区有文書」）と東昌寺の関係の確認&#34;,&#34;曹洞禅ナビ復旧後に詳細ページ（index_220999）を再確認（調査時サーバー障害で未取得）。他県の同名寺（index_80171等）と混同しないこと&#34;],&#34;founded_period&#34;:&#34;創建年不詳（正保郷帳（1644〜1648年）に寺領2石の記録があり、江戸時代前期には存在）&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;招宝山東昌寺—福王寺末の薬師の寺&#34;,&#34;body&#34;:&#34;大正10年（1921年）刊『静岡県磐田郡誌』の寺院由緒には「東昌寺（御厨村）【由緒】御厨村東貝塚字中原に在り。招寳山と號す。當郡西貝村福王寺の末寺にして、本尊は藥師如來なり。法地格に列す」と記されています。本寺の福王寺（磐田市城之崎）は徳川家康から寺領の朱印状を受けた西貝塚の曹洞宗寺院で、東昌寺はその末寺として東貝塚の集落に位置してきました。創建の年代や開山については同郡誌にも記載がなく、現時点で確認できる公開資料はありません。&#34;},{&#34;heading&#34;:&#34;正保郷帳の寺領2石—近世の東昌寺&#34;,&#34;body&#34;:&#34;『日本歴史地名大系』（平凡社）の東貝塚村の項によれば、東貝塚村は山名郡に属し、天正17年（1589年）7月7日の徳川家七ヵ条定書写に「東かい塚百姓等」と見える村で、正保郷帳（正保年間、1644〜1648年）には村高205石余の幕府領のうち「東昌（とうしよう）寺（現曹洞宗）領二石」が記されています。可睡斎史料集 第1巻（寺誌史料、1989年）にも遠江国山名郡の御黒印高として東貝塚村の東昌寺2石が見え、幕末から明治初年の状況を示す『旧高旧領取調帳』中部編でも東貝塚村に「東昌寺除地2石」が記録されており、江戸時代を通じて2石の寺領（除地）を維持したことが分かります。&#34;}],&#34;cultural_assets&#34;:[],&#34;pilgrimage_note&#34;:&#34;遠江四十九薬師霊場第47番札所（札所本尊薬師如来）&#34;},{&#34;temple_id&#34;:&#34;iwata-0043&#34;,&#34;slug&#34;:&#34;renjoji-shingai&#34;,&#34;name&#34;:&#34;連城寺&#34;,&#34;name_kana&#34;:&#34;れんじょうじ&#34;,&#34;aliases&#34;:[&#34;三白山&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市新貝1556番地の1&#34;,&#34;district_id&#34;:&#34;mikuriya&#34;,&#34;area&#34;:&#34;御厨&#34;,&#34;main_deity&#34;:&#34;未確認&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;公開情報調査済み&#34;,&#34;history_summary&#34;:&#34;連城寺は磐田市新貝にある曹洞宗の寺院で、山号は三白山です。寺伝では平重盛が遠江守であったときに建立されたと伝えられ、もとは天台宗の寺院でした。江戸時代に中泉代官の大草太郎左衛門政信により曹洞宗寺院として再興され、境内墓地には平清盛・平重盛の供養塔と大草家代々の墓が祀られています。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-12&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9116&#34;},{&#34;title&#34;:&#34;曹洞宗 三白山 連城寺（公式サイト）&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;山号三白山、もと天台宗、平重盛建立の寺伝、大草太郎左衛門政信による曹洞宗再興、平清盛・平重盛供養塔、大草家代々の墓、経塚古墳出土の県指定文化財の鏡、裏手の稲荷山・秋葉山・経塚古墳を確認。&#34;,&#34;url&#34;:&#34;https://iwata-renjyoji.com/&#34;},{&#34;title&#34;:&#34;県指定文化財｜磐田市公式ウェブサイト&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;「三角縁四神四獣鏡」（考古資料・古墳時代・新貝・昭和33年9月2日指定）の掲載を確認。&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/sports_midokoro/bunkazai/bunkazainitsuite/1002038.html&#34;},{&#34;title&#34;:&#34;曹洞禅ナビ 磐田市寺院一覧&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;磐田市の公式一覧（全61寺）に「連城寺」として掲載を確認（一覧掲載のみ確認）。詳細ページはサーバー障害で未取得&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220993.html&#34;},{&#34;title&#34;:&#34;永代供養・墓地 - 連城寺公式サイト&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;永代供養塔「ありが塔」・墓地区画・費用の詳細を確認&#34;,&#34;url&#34;:&#34;https://iwata-renjyoji.com/kuyou/&#34;},{&#34;title&#34;:&#34;アクセス - 連城寺公式サイト&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;駐車場・地域史跡情報を確認&#34;,&#34;url&#34;:&#34;https://iwata-renjyoji.com/access/&#34;}],&#34;research_todos&#34;:[&#34;本尊を寺院への確認または由緒書きで特定する&#34;,&#34;平重盛の遠江守在任時期と創建伝承の関係を史料で確認する&#34;,&#34;大草太郎左衛門政信による再興の年代を磐田市誌等で確認する&#34;,&#34;経塚古墳出土鏡の正式指定名称（県教育委員会資料）を確認する&#34;,&#34;稲荷山・秋葉山・経塚古墳の発掘調査報告書を確認する&#34;,&#34;曹洞禅ナビ復旧後に詳細ページ（index_220993）を再確認（調査時サーバー障害で未取得）&#34;,&#34;登記上の地番（磐田市新貝1556番地の1）と寺院公式サイト記載の住所（磐田市新貝一丁目29-2）の相違の確認&#34;,&#34;山門大施食会の具体的な開催時期の現地確認&#34;],&#34;founded_period&#34;:&#34;平安時代末期（寺伝では平重盛が遠江守であったときの建立と伝わる）&#34;,&#34;heritage_status&#34;:&#34;静岡県指定文化財あり&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;創建と曹洞宗への再興&#34;,&#34;body&#34;:&#34;寺院公式サイトによれば、連城寺はもと天台宗の寺院として創建されました。寺伝では、平重盛が遠江守であったときに建立されたと伝えられています。その後、江戸時代に中泉代官を務めた大草太郎左衛門政信によって曹洞宗の寺院として再興されました。以来、大草家の菩提寺として同家代々の墓を祀っています。&#34;},{&#34;heading&#34;:&#34;平家ゆかりの供養塔&#34;,&#34;body&#34;:&#34;境内の墓地には、平清盛・平重盛の供養塔が祀られています。創建伝承に平重盛の名が残ることとあわせて、平家とのゆかりを伝える寺院です。ただしこれらは寺伝にもとづく伝承であり、同時代史料での裏付けは今後の調査課題です。&#34;},{&#34;heading&#34;:&#34;経塚古墳出土の銅鏡と境内周辺の古墳&#34;,&#34;body&#34;:&#34;寺の裏手には稲荷山古墳・秋葉山古墳・経塚古墳があります。このうち経塚古墳から出土した銅鏡は静岡県指定文化財となっており、連城寺が保管しています。磐田市の県指定文化財一覧では「三角縁四神四獣鏡」（考古資料・古墳時代・昭和33年9月2日指定）として記載され、寺院公式サイトでは「三角縁唐草文帯四神四獣鏡」と紹介されています。&#34;}],&#34;cultural_assets&#34;:[{&#34;name&#34;:&#34;三角縁四神四獣鏡&#34;,&#34;designation&#34;:&#34;静岡県指定文化財（考古資料）&#34;,&#34;summary&#34;:&#34;新貝の経塚古墳から出土した古墳時代の銅鏡で、昭和33年（1958年）9月2日に県指定文化財に指定されました。連城寺が保管しており、寺院公式サイトでは「三角縁唐草文帯四神四獣鏡」の名称で紹介されています。&#34;}],&#34;danka_info&#34;:{&#34;official_site&#34;:{&#34;status&#34;:&#34;あり&#34;,&#34;url&#34;:&#34;https://iwata-renjyoji.com/&#34;,&#34;checked_at&#34;:&#34;2026-07-12&#34;},&#34;annual_events&#34;:[{&#34;name&#34;:&#34;新年祈祷会&#34;,&#34;timing&#34;:&#34;1月&#34;,&#34;note&#34;:&#34;寺院公式サイトによる&#34;},{&#34;name&#34;:&#34;山門大施食会&#34;,&#34;timing&#34;:&#34;時期の詳細は公式サイト上では明記されていない&#34;,&#34;note&#34;:&#34;寺院公式サイトに特別行事として記載&#34;}],&#34;cemetery&#34;:&#34;永代供養塔「ありが塔」があり、檀家にならなくても利用できる（個人20万円、納骨から1年間は個別安置、その後は合祀。春彼岸・お盆・秋彼岸の年3回合同供養）。別途、檀家になることを条件に高台墓地（一区画10万円、秋葉山古墳上の高台）と平地墓地（一区画20万円、車での乗り付け可能で段差なし）の2種の墓地区画がある。寺院公式サイトによる。&#34;,&#34;organization&#34;:&#34;護持会があり、護持会総会や墓地奉仕作業などの活動が行われている。墓地購入者の年会費（護持会費・管理費）の目安は8,000円程度。寺院公式サイトによる。&#34;,&#34;community_role&#34;:&#34;境内周辺の稲荷山・秋葉山・経塚古墳などの地域史跡や、平重盛・中泉代官大草太郎左衛門といった郷土の歴史的人物との関わりを、寺院公式サイトで紹介している。&#34;,&#34;parking&#34;:&#34;駐車場があり、公式サイトのアクセスページに墓地までの案内が掲載されている。&#34;}},{&#34;temple_id&#34;:&#34;iwata-0044&#34;,&#34;slug&#34;:&#34;zenkyuin-kamada&#34;,&#34;name&#34;:&#34;全久院&#34;,&#34;name_kana&#34;:&#34;ぜんきゅういん&#34;,&#34;aliases&#34;:[&#34;護国山&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市鎌田2546番地&#34;,&#34;district_id&#34;:&#34;mikuriya&#34;,&#34;area&#34;:&#34;御厨&#34;,&#34;main_deity&#34;:&#34;虚空蔵菩薩&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;公開情報調査済み&#34;,&#34;history_summary&#34;:&#34;全久院は磐田市鎌田にある曹洞宗の寺院で、山号は護国山、本尊は虚空蔵菩薩です。寺伝ではもと真言宗に属し、永禄元年（1558年）に松秀寺2世経庵を請じて改宗開山としたと伝えられます。江戸時代には代々の住職による寺子屋教育が行われたことで知られます。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9117&#34;},{&#34;title&#34;:&#34;全久院（ぜんきゆういん）とは？ 意味や使い方 - コトバンク（『日本歴史地名大系』平凡社）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;護国山・本尊虚空蔵菩薩・永禄元年改宗の寺伝・朱印高2石（正保郷帳）・寛永2年寺子屋開創・寛文10年頃から明治初年までの寺子屋教育・安政地震倒壊・文久元年火災・慶応4年再建を確認。&#34;,&#34;url&#34;:&#34;https://kotobank.jp/word/%E5%85%A8%E4%B9%85%E9%99%A2-3064027&#34;},{&#34;title&#34;:&#34;全久院 - 曹洞禅ナビ（曹洞宗公式 寺院ポータルサイト）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;曹洞宗寺院として磐田市鎌田2546に所在することを確認。&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220990.html&#34;},{&#34;title&#34;:&#34;ニッポンの霊場 遠江四十九薬師霊場&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;第45番＝護国山全久院（曹洞宗・磐田市鎌田・御本尊虚空蔵菩薩）を確認。&#34;,&#34;url&#34;:&#34;https://nippon-reijo.jimdofree.com/%E6%8E%B2%E8%BC%89%E9%9C%8A%E5%A0%B4%E3%81%AE%E4%B8%80%E8%A6%A7/%E8%96%AC%E5%B8%AB%E9%9C%8A%E5%A0%B4/%E9%81%A0%E6%B1%9F%E5%9B%9B%E5%8D%81%E4%B9%9D%E8%96%AC%E5%B8%AB%E9%9C%8A%E5%A0%B4/&#34;},{&#34;title&#34;:&#34;ニッポンの霊場 磐田郡三十三観音霊場&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;第25番＝護国山全久院（鎌田2546）を確認。&#34;,&#34;url&#34;:&#34;https://nippon-reijo.jimdofree.com/%E6%8E%B2%E8%BC%89%E9%9C%8A%E5%A0%B4%E3%81%AE%E4%B8%80%E8%A6%A7/%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/%E7%A3%90%E7%94%B0%E9%83%A1%E4%B8%89%E5%8D%81%E4%B8%89%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/&#34;},{&#34;title&#34;:&#34;曹洞禅ナビ 全久院（2022年1月27日時点アーカイブ）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;掲載は基本情報のみ（名称・フリガナ「ゼンキュウイン」・〒438-0038 磐田市鎌田2546）。「お寺について・年間行事」等のタブは未作成（no-link）、由緒・本尊・公式サイトの掲載なし。調査時は本体サイトがサーバー障害のためWayback Machineのスナップショットを使用&#34;,&#34;url&#34;:&#34;https://web.archive.org/web/20220127140110/https://sotozen-navi.com/detail/index_220990.html&#34;}],&#34;research_todos&#34;:[&#34;改宗前（真言宗時代）の草創年代について磐田市誌・寺院由緒を確認する&#34;,&#34;松秀寺（本寺とみられる）との本末関係を確認する&#34;,&#34;寺子屋関係の資料（筆子塚・教科書等）が現存するか調査する&#34;,&#34;鎌田の医王寺など周辺寺院との歴史的関係を調べる&#34;],&#34;founded_period&#34;:&#34;創建年代は不詳。寺伝ではもと真言宗に属し、永禄元年（1558年）に曹洞宗へ改宗したと伝わる&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;創建と曹洞宗への改宗&#34;,&#34;body&#34;:&#34;『日本歴史地名大系』によれば、全久院は磐田原台地鎌田丘陵の南端に位置し、護国山と号します。本尊は虚空蔵菩薩です。寺伝ではもと真言宗に属していましたが、永禄元年（1558年）に松秀寺2世の経庵を請じて改宗開山とし、曹洞宗の寺院となったと伝えられます。江戸時代には朱印高2石を与えられていたことが正保郷帳などに記されています。&#34;},{&#34;heading&#34;:&#34;寺子屋教育と近世の全久院&#34;,&#34;body&#34;:&#34;寛永2年（1625年）に厳祝黄梅により当寺に寺子屋が開かれ、寛文10年（1670年）の頃から明治初年に至るまで、代々の住職による寺子屋教育が続けられました。幕末には安政地震のため諸堂が倒壊し、文久元年（1861年）には火災で焼失しましたが、慶応4年（1868年）に本堂などが再建されました。&#34;}],&#34;pilgrimage_note&#34;:&#34;遠江四十九薬師霊場第45番札所／磐田郡三十三観音霊場第25番札所&#34;},{&#34;temple_id&#34;:&#34;iwata-0045&#34;,&#34;slug&#34;:&#34;fukuoji-jonosaki&#34;,&#34;name&#34;:&#34;福王寺&#34;,&#34;name_kana&#34;:&#34;ふくおうじ&#34;,&#34;aliases&#34;:[&#34;風祭山&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市城之崎4丁目2722番地の1&#34;,&#34;district_id&#34;:&#34;mitsuke&#34;,&#34;area&#34;:&#34;見付&#34;,&#34;main_deity&#34;:&#34;聖観世音菩薩&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;現地写真あり&#34;,&#34;detail_status&#34;:&#34;公開情報調査済み&#34;,&#34;history_summary&#34;:&#34;福王寺は磐田市城之崎にある曹洞宗の寺院で、山号は風祭山、本尊は聖観世音菩薩です。寺伝では1000年を超える歴史を持ち、真言宗高野山の末寺として建立された後、1444年に永平寺直系の天翁義一禅師を迎えて曹洞宗寺院として再興されたと伝えられます。遠州三十三観音霊場第18番札所です。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-12&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9118&#34;},{&#34;title&#34;:&#34;福王寺 - 曹洞禅ナビ（曹洞宗公式 寺院ポータルサイト）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;山号風祭山、本尊聖観世音菩薩、磐田市城之崎4-2722-1、認可参禅道場・梅花講・坐禅会を確認。&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220988.html&#34;},{&#34;title&#34;:&#34;福王寺 | 磐田市観光協会&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;千年を超える歴史・真言宗高野山末派として建立・1444年に天翁義一禅師を迎えて再興し曹洞宗に改宗・安倍晴明の祈祷旧跡と山号由来・今川範国公の墓所・大庭園「萬両園」を確認。&#34;,&#34;url&#34;:&#34;https://kanko-iwata.jp/tanoshimu/tanoshimu-776&#34;},{&#34;title&#34;:&#34;市指定文化財｜磐田市公式ウェブサイト&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;聖観音菩薩立像（彫刻・平安時代・城之崎）、アキザキヤツシロラン群生地（天然記念物・城之崎）、福王寺のケヤキ（天然記念物・推定樹齢200〜300年）の掲載を確認。&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/sports_midokoro/bunkazai/bunkazainitsuite/1002039.html&#34;},{&#34;title&#34;:&#34;遠州三十三観音霊場 - Wikipedia&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;第18番札所・風祭山福王寺・曹洞宗・聖観世音菩薩・磐田市城之崎4-2722-1を確認。霊場は昭和59年（1984年）5月開創。&#34;,&#34;url&#34;:&#34;https://ja.wikipedia.org/wiki/%E9%81%A0%E5%B7%9E%E4%B8%89%E5%8D%81%E4%B8%89%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4&#34;},{&#34;title&#34;:&#34;遠州三十三観音霊場めぐり 札所一覧（霊場会公式サイト）&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;第18番＝風祭山福王寺（磐田市城之崎4-2722-1）を確認。札所本尊はWikipedia「遠州三十三観音霊場」でも聖観世音菩薩と一致。&#34;,&#34;url&#34;:&#34;http://enshu33.com/all-guide/&#34;},{&#34;title&#34;:&#34;ニッポンの霊場 遠江四十九薬師霊場&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;客番＝風祭山福王寺（城之崎）を確認。&#34;,&#34;url&#34;:&#34;https://nippon-reijo.jimdofree.com/%E6%8E%B2%E8%BC%89%E9%9C%8A%E5%A0%B4%E3%81%AE%E4%B8%80%E8%A6%A7/%E8%96%AC%E5%B8%AB%E9%9C%8A%E5%A0%B4/%E9%81%A0%E6%B1%9F%E5%9B%9B%E5%8D%81%E4%B9%9D%E8%96%AC%E5%B8%AB%E9%9C%8A%E5%A0%B4/&#34;},{&#34;title&#34;:&#34;ニッポンの霊場 静岡県の七福神（遠州七福神）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;遠州七福神の福禄寿＝福王寺、かつ霊場会事務局が福王寺であることを確認。七福神めぐり資料集（rokumeibunko.com/shichifukujin/22shizuoka/enshu.html）の記載とも一致。磐田郡三十三観音第23番は同サイト磐田郡三十三観音霊場ページで確認。&#34;,&#34;url&#34;:&#34;https://nippon-reijo.jimdofree.com/%E4%B8%83%E7%A6%8F%E7%A5%9E%E3%82%81%E3%81%90%E3%82%8A/%E9%9D%99%E5%B2%A1%E7%9C%8C%E3%81%AE%E4%B8%83%E7%A6%8F%E7%A5%9E/&#34;},{&#34;title&#34;:&#34;中遠昔ばなし 福王寺［風祭山と安倍晴明］（磐田市）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;中遠地域広域行政組合運営サイト。風祭り・安倍晴明伝承の内容を確認&#34;,&#34;url&#34;:&#34;https://www.chuen.net/mukashi/mukashi_125.html&#34;},{&#34;title&#34;:&#34;福王寺 (磐田市城之崎・18番札所) | 遠州三十三観音霊場めぐり&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;風祭りの開催日（3月8日）を確認。中遠昔ばなしの内容と整合し裏付けとした&#34;,&#34;url&#34;:&#34;http://enshu33.com/all-guide/%E7%A6%8F%E7%8E%8B%E5%AF%BA/&#34;}],&#34;research_todos&#34;:[&#34;磐田市森本にも「福王寺」の名の曹洞宗寺院が名簿に掲載されており、城之崎の当寺との関係（別寺院か旧地か）を確認する&#34;,&#34;安倍晴明の祈祷故事の年代（永観2年とする資料の有無）を郷土資料で確認する&#34;,&#34;今川範国の墓所伝承の典拠を磐田市誌等で確認する&#34;,&#34;天翁義一禅師と再興の経緯を曹洞宗の宗門資料で確認する&#34;,&#34;市指定文化財の指定年月日を市教育委員会資料で確認する&#34;,&#34;曹洞禅ナビ復旧後に詳細ページ（index_220988）を確認し、霊場（札所）名と坐禅会の詳細を取得する&#34;,&#34;公式サイト・SNSの有無を再確認（「fukuouji.or.jp」は長野県佐久市の真言宗智山派の別の福王寺であり、磐田市城之崎の当寺とは無関係。混同に厳重注意）&#34;,&#34;風祭りが現在も檀家・地域住民参列の行事として継続しているかの現地確認&#34;],&#34;founded_period&#34;:&#34;寺伝では1000年以上前に真言宗高野山の末寺として開かれ、1444年（文安元年）に曹洞宗寺院として再興されたと伝わる&#34;,&#34;heritage_status&#34;:&#34;磐田市指定文化財あり&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;創建と曹洞宗への改宗&#34;,&#34;body&#34;:&#34;磐田市観光協会の紹介によれば、福王寺は千年を超える歴史を持つ古刹とされ、真言宗高野山の末派として建立されました。1444年に永平寺直系の天翁義一禅師を迎えて再興され、このとき真言宗から曹洞宗に改宗されたと伝えられます。現在も曹洞宗の認可参禅道場として坐禅会が開かれています。&#34;},{&#34;heading&#34;:&#34;山号「風祭山」と安倍晴明の故事&#34;,&#34;body&#34;:&#34;山号の「風祭山」は、平安時代の陰陽師安倍晴明にちなむと伝えられます。寺伝では、晴明が当地で祈祷をして暴風を鎮めたことからこの山号になったとされ、境内には安倍晴明の「ご祈祷旧跡」が伝わっています。あくまで寺伝にもとづく故事であり、年代等の史料的裏付けは今後の調査課題です。&#34;},{&#34;heading&#34;:&#34;今川範国の墓所と境内&#34;,&#34;body&#34;:&#34;境内には今川家初代の範国公の墓所と伝えられる場所があり、大庭園「萬両園」や春の桜でも知られます。また境内には磐田市指定文化財の聖観音菩薩立像（平安時代の彫刻）が伝わるほか、市指定天然記念物のアキザキヤツシロラン群生地と福王寺のケヤキがあります。&#34;},{&#34;heading&#34;:&#34;文化財資料からの補足&#34;,&#34;body&#34;:&#34;福王寺の本尊である聖観音菩薩立像は平安時代の作で、ヒノキ材の寄木造、一部に漆箔がみられます。保存状態が良好で、磐田市指定有形文化財（彫刻）に指定されています。 境内にはラン科の希少種アキザキヤツシロランが自生し、その群生地が磐田市指定天然記念物となっています。また高さ27.5メートル、推定樹齢200年から300年のケヤキも「福王寺のケヤキ」として市指定天然記念物です。&#34;},{&#34;heading&#34;:&#34;檀家向け情報の補足&#34;,&#34;body&#34;:&#34;山号「風祭山」は、永観2年（984年）の暴風の際に諸国行脚中であった陰陽師・安倍晴明が祈祷して嵐を鎮めたという伝承に由来すると伝えられる。境内には晴明が祈祷したと伝わる旧跡（安倍晴明堂）が残る。&#34;}],&#34;cultural_assets&#34;:[{&#34;name&#34;:&#34;聖観音菩薩立像&#34;,&#34;designation&#34;:&#34;磐田市指定文化財（彫刻）&#34;,&#34;summary&#34;:&#34;平安時代の作とされる観音像で、磐田市の市指定文化財一覧に城之崎所在の彫刻として掲載されています。&#34;},{&#34;name&#34;:&#34;アキザキヤツシロラン群生地&#34;,&#34;designation&#34;:&#34;磐田市指定天然記念物&#34;,&#34;summary&#34;:&#34;城之崎の福王寺境内に所在する腐生植物アキザキヤツシロランの群生地で、市の天然記念物に指定されています。&#34;},{&#34;name&#34;:&#34;福王寺のケヤキ&#34;,&#34;designation&#34;:&#34;磐田市指定天然記念物&#34;,&#34;summary&#34;:&#34;推定樹齢200〜300年とされるケヤキの古木で、市の天然記念物に指定されています。&#34;}],&#34;pilgrimage_note&#34;:&#34;遠州三十三観音霊場第18番札所（札所本尊聖観世音菩薩）／遠江四十九薬師霊場客番札所／磐田郡三十三観音霊場第23番札所／遠州七福神（福禄寿・霊場会事務局）&#34;,&#34;danka_info&#34;:{&#34;annual_events&#34;:[{&#34;name&#34;:&#34;年中行事&#34;,&#34;timing&#34;:&#34;&#34;,&#34;note&#34;:&#34;曹洞禅ナビの公式一覧で「坐禅」カテゴリの登録あり（開催日等の詳細は未取得）&#34;},{&#34;name&#34;:&#34;風祭り&#34;,&#34;timing&#34;:&#34;3月8日&#34;,&#34;note&#34;:&#34;永観2年（984年）に遠州一帯を襲った暴風を陰陽師・安倍晴明の祈祷で鎮めたという伝承に由来する行事とされる。中遠地域広域行政組合の紹介ページおよび遠州三十三観音霊場めぐりサイトの双方で同内容が確認できる。&#34;}],&#34;community_role&#34;:&#34;山号「風祭山」の由来となった安倍晴明の暴風鎮めの伝承が地域の言い伝えとして伝わり、境内には晴明が祈祷したと伝わる「安倍晴明堂」の旧跡が残るとされる。&#34;}},{&#34;temple_id&#34;:&#34;iwata-0046&#34;,&#34;slug&#34;:&#34;gasshoji-nakaizumi&#34;,&#34;name&#34;:&#34;合掌寺&#34;,&#34;name_kana&#34;:&#34;がっしょうじ&#34;,&#34;aliases&#34;:[],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市中泉1239番地の3&#34;,&#34;district_id&#34;:&#34;nakaizumi&#34;,&#34;area&#34;:&#34;中泉&#34;,&#34;main_deity&#34;:&#34;未確認&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;合掌寺は磐田市中泉にある曹洞宗の寺院です。曹洞宗公式ポータルサイト「曹洞禅ナビ」に掲載されているほか、『寺院大鑑 東海・北陸篇』（1982年）にも中泉1239-3の現在地で収載されています。一方、江戸時代の郷帳・地誌類や『静岡県磐田郡誌』（大正10年）には合掌寺の名が見えず、創建・沿革を伝える公開資料は現時点では確認できていません。現地確認では、合掌寺はお堂などがなく、小さな祠がありました。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9119&#34;},{&#34;title&#34;:&#34;曹洞禅ナビ（曹洞宗公式寺院ポータル）合掌寺&#34;,&#34;type&#34;:&#34;公式&#34;,&#34;note&#34;:&#34;所在地・寺名の確認のみ。由緒記載なし&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220305.html&#34;},{&#34;title&#34;:&#34;寺院大鑑 東海・北陸篇（久遠出版、1982年）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;合掌寺 中泉1239-3 掲載（NDL全文検索スニペット）&#34;},{&#34;title&#34;:&#34;国立国会図書館デジタルコレクション全文検索「合掌寺 中泉」&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;磐田の合掌寺に関する近世・近代史料のヒットなし（伊豆国・秋田等の同名寺院のみ）&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/&#34;}],&#34;research_todos&#34;:[&#34;山号・本尊・沿革を寺院公式ホームページ（曹洞禅ナビからリンクあり）または現地の由緒書きで確認する&#34;,&#34;『日本歴史地名大系』や磐田市誌の中泉の項に記載がないか確認する&#34;,&#34;中泉御殿・中泉代官所との歴史的関係の有無を郷土資料で調べる&#34;,&#34;寺院公式SNS（Facebook・Instagram）の発信内容を確認する&#34;,&#34;曹洞禅ナビからリンクされる公式ホームページ・SNS（Facebook・Instagram）の内容確認（今回の検索では到達できず）&#34;,&#34;磐田市誌・磐田市史の中泉地区寺院一覧での掲載有無の確認&#34;,&#34;宗教法人設立（認証）年の確認（静岡県公報など）&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;基礎情報と現況&#34;,&#34;body&#34;:&#34;合掌寺は磐田市中泉1239番地の3に所在する曹洞宗の寺院で、曹洞宗の公式寺院ポータルサイト「曹洞禅ナビ」に登録されています。『寺院大鑑 東海・北陸篇』（久遠出版、1982年）にも同じ所在地で掲載されており、昭和後期には現在地に存在していたことが確認できます。一方、中泉地区の近世寺院を記す『日本歴史地名大系』や『静岡県磐田郡誌』（大正10年）の中泉町の寺院由緒、江戸時代の郷帳・地誌類には合掌寺の名が確認できず、国立国会図書館デジタルコレクションの全文検索でも近世〜大正期の磐田関係郷土資料に合掌寺（磐田）の記録は見いだせませんでした。創建の時期や経緯を伝える公開資料は現時点では確認できていません。比較的新しい時代に建立ないし改称された寺院である可能性も含めて、今後の調査が必要です。現地確認では、合掌寺はお堂などがなく、小さな祠がありました。&#34;}],&#34;cultural_assets&#34;:[],&#34;visit_notes&#34;:&#34;現地では、合掌寺はお堂などがなく、小さな祠がありました。石碑、石仏、手水鉢を現地写真で確認しています。&#34;},{&#34;temple_id&#34;:&#34;iwata-0047&#34;,&#34;slug&#34;:&#34;jurinji-kamiohnogo&#34;,&#34;name&#34;:&#34;十輪寺&#34;,&#34;name_kana&#34;:&#34;じゅうりんじ&#34;,&#34;aliases&#34;:[],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市上大之郷606番地の1&#34;,&#34;district_id&#34;:&#34;nanbu&#34;,&#34;area&#34;:&#34;南部&#34;,&#34;main_deity&#34;:&#34;未確認&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;公開情報調査済み&#34;,&#34;history_summary&#34;:&#34;十輪寺は磐田市上大之郷にある曹洞宗の寺院です。磐田市の市指定文化財一覧には、上大之郷所在の彫刻として鎌倉時代の薬師如来立像が掲載されており、十輪寺に伝わる仏像とされています。創建年代などの沿革は公開Web上では確認できませんでした。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9120&#34;},{&#34;title&#34;:&#34;十輪寺 - 曹洞禅ナビ（曹洞宗公式 寺院ポータルサイト）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;曹洞宗寺院として磐田市上大之郷606-1に所在することを確認。沿革の記載はなし。&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220925.html&#34;},{&#34;title&#34;:&#34;市指定文化財｜磐田市公式ウェブサイト&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;薬師如来立像（彫刻・鎌倉時代・上大之郷）が市指定文化財一覧に掲載され、十輪寺関係の文化財として確認。&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/sports_midokoro/bunkazai/bunkazainitsuite/1002039.html&#34;},{&#34;title&#34;:&#34;ニッポンの霊場 磐田郡三十三観音霊場&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;大正8年開創の磐田郡三十三ヶ所観音霊場第2番＝宝蔵山十輪寺（曹洞宗・上大之郷606）を確認。寺名・宗派・住所がDBと一致。&#34;,&#34;url&#34;:&#34;https://nippon-reijo.jimdofree.com/%E6%8E%B2%E8%BC%89%E9%9C%8A%E5%A0%B4%E3%81%AE%E4%B8%80%E8%A6%A7/%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/%E7%A3%90%E7%94%B0%E9%83%A1%E4%B8%89%E5%8D%81%E4%B8%89%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/&#34;},{&#34;title&#34;:&#34;曹洞禅ナビ 十輪寺（2024年12月2日時点アーカイブ）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;掲載は基本情報のみ（名称・フリガナ「ジュウリンジ」・〒438-0051 磐田市上大之郷606-1）。「お寺について・年間行事」等のタブは未作成、由緒・本尊・公式サイトの掲載なし。調査時は本体サイトがサーバー障害のためWayback Machineのスナップショットを使用&#34;,&#34;url&#34;:&#34;https://web.archive.org/web/20241202165329/https://sotozen-navi.com/detail/index_220925.html&#34;},{&#34;title&#34;:&#34;磐田市文化財一覧オープンデータ（LinkData・CC BY）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;磐田市公開の文化財一覧オープンデータ。名称・よみ・所在地により寺院と文化財の対応を照合&#34;,&#34;url&#34;:&#34;http://linkdata.org/work/rdf1s10219i&#34;}],&#34;research_todos&#34;:[&#34;本尊と山号を寺院公式情報または現地で確認する&#34;,&#34;薬師如来立像の指定年月日・像高・公開状況を磐田市教育委員会資料で確認する&#34;,&#34;遠江四十九薬師霊場など薬師系霊場の札所になっていないか札所資料で確認する&#34;,&#34;創建・沿革を磐田市誌や大之郷地区の郷土資料で調べる&#34;],&#34;heritage_status&#34;:&#34;磐田市指定文化財あり&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;寺院の概要と文化財&#34;,&#34;body&#34;:&#34;十輪寺は曹洞宗公式の寺院ポータル「曹洞禅ナビ」に掲載されている磐田市上大之郷の寺院です。磐田市の市指定文化財一覧には、上大之郷の彫刻として鎌倉時代の薬師如来立像が掲載されており、十輪寺の所蔵とされています。寺号の「十輪」は地蔵信仰の根本経典『地蔵十輪経』に由来する寺名として各地の寺院に見られますが、当寺の創建事情や本尊については公開情報が乏しく、今後の確認が必要です。&#34;},{&#34;heading&#34;:&#34;文化財資料からの補足&#34;,&#34;body&#34;:&#34;十輪寺が所蔵する薬師如来立像は鎌倉時代の作で、もと長応寺にあったものが十輪寺に移されました。磐田市指定有形文化財（彫刻）に指定されています。&#34;}],&#34;cultural_assets&#34;:[{&#34;name&#34;:&#34;薬師如来立像&#34;,&#34;designation&#34;:&#34;磐田市指定文化財（彫刻）&#34;,&#34;summary&#34;:&#34;鎌倉時代の作とされる薬師如来像で、磐田市の市指定文化財一覧に上大之郷所在の彫刻として掲載されています。指定年月日や像高などの詳細は市教育委員会資料での確認が必要です。&#34;}],&#34;pilgrimage_note&#34;:&#34;磐田郡三十三観音霊場第2番札所&#34;},{&#34;temple_id&#34;:&#34;iwata-0048&#34;,&#34;slug&#34;:&#34;senkoji-mitsuke&#34;,&#34;name&#34;:&#34;宣光寺&#34;,&#34;name_kana&#34;:&#34;せんこうじ&#34;,&#34;aliases&#34;:[&#34;珠玉山&#34;,&#34;身代わり地蔵&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市見付1340番地の1&#34;,&#34;district_id&#34;:&#34;mitsuke&#34;,&#34;area&#34;:&#34;見付&#34;,&#34;main_deity&#34;:&#34;十一面観世音菩薩&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;現地写真あり&#34;,&#34;detail_status&#34;:&#34;公開情報調査済み&#34;,&#34;history_summary&#34;:&#34;宣光寺は旧見付宿にある曹洞宗の寺院で、山号は珠玉山、遠州三十三観音霊場第17番札所です。延命地蔵菩薩への信仰で知られ、天正15年（1587年）に徳川家康が施主となって地蔵菩薩のために寄進した梵鐘（市指定文化財）が伝わります。平安時代の木造地蔵菩薩坐像・木造毘沙門天立像は静岡県指定文化財です。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-12&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9121&#34;},{&#34;title&#34;:&#34;県指定文化財｜磐田市公式ウェブサイト&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;木造地蔵菩薩坐像・木造毘沙門天立像（彫刻・平安時代・見付・昭和59年11月30日指定）を確認。&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/sports_midokoro/bunkazai/bunkazainitsuite/1002038.html&#34;},{&#34;title&#34;:&#34;市指定文化財｜磐田市公式ウェブサイト&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;梵鐘（工芸品・安土桃山時代・天正15年徳川家康寄進）、子育如来像・子育地蔵菩薩像（彫刻・江戸時代）、和算額（歴史資料・江戸時代・安永5年奉納）の掲載を確認。&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/sports_midokoro/bunkazai/bunkazainitsuite/1002039.html&#34;},{&#34;title&#34;:&#34;宣光寺 | 磐田市観光協会&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;戦国時代に戦死した武将のため延命地蔵菩薩に冥福を祈って寄進された釣鐘が境内にあることを確認。所在地見付1340-1。&#34;,&#34;url&#34;:&#34;https://kanko-iwata.jp/spot/tanoshimu-771/&#34;},{&#34;title&#34;:&#34;宣光寺の梵鐘（徳川家康公ゆかりの地 出世の街 浜松）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;天正15年（1587）に家康が施主となり宣光寺地蔵菩薩のために寄進した梵鐘であること、中泉御殿造営期の遠江支配との関連、見付在住の大工が鋳造に携わった記録を確認。&#34;,&#34;url&#34;:&#34;https://hamamatsu-daisuki.net/ieyasu/yukari/detail.html?p=1445&#34;},{&#34;title&#34;:&#34;遠州三十三観音霊場 - Wikipedia&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;第17番札所・珠玉山宣光寺・曹洞宗・札所本尊十一面観世音菩薩・磐田市見付1340-1を確認。&#34;,&#34;url&#34;:&#34;https://ja.wikipedia.org/wiki/%E9%81%A0%E5%B7%9E%E4%B8%89%E5%8D%81%E4%B8%89%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4&#34;},{&#34;title&#34;:&#34;宣光寺（アソビュー）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;県指定文化財の木造地蔵菩薩坐像・木造毘沙門天立像、家康寄進の釣鐘、東海道から続く「地蔵小路」の呼称を確認。&#34;,&#34;url&#34;:&#34;https://www.asoview.com/spot/22211ag2130010249/&#34;},{&#34;title&#34;:&#34;宣光寺（いこーよ）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;釣鐘に「家康」の刻印があること、戦時中の供出を免れて現存すると言われること、地蔵小路の由来を確認。&#34;,&#34;url&#34;:&#34;https://iko-yo.net/facilities/56045&#34;},{&#34;title&#34;:&#34;遠州三十三観音霊場めぐり 札所一覧（霊場会公式サイト）&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;第17番＝珠玉山宣光寺（見付1340-1）を確認（既存注記どおり）。&#34;,&#34;url&#34;:&#34;http://enshu33.com/all-guide/&#34;},{&#34;title&#34;:&#34;ニッポンの霊場 磐田郡三十三観音霊場&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;大正8年開創の磐田郡三十三ヶ所観音霊場第22番＝珠玉山宣光寺（見付1340・霊場御本尊十一面観世音菩薩）を確認。&#34;,&#34;url&#34;:&#34;https://nippon-reijo.jimdofree.com/%E6%8E%B2%E8%BC%89%E9%9C%8A%E5%A0%B4%E3%81%AE%E4%B8%80%E8%A6%A7/%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/%E7%A3%90%E7%94%B0%E9%83%A1%E4%B8%89%E5%8D%81%E4%B8%89%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/&#34;},{&#34;title&#34;:&#34;磐田市文化財一覧オープンデータ（LinkData・CC BY）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;磐田市公開の文化財一覧オープンデータ。名称・よみ・所在地により寺院と文化財の対応を照合&#34;,&#34;url&#34;:&#34;http://linkdata.org/work/rdf1s10219i&#34;},{&#34;title&#34;:&#34;しずおか文化財ナビ 木造地蔵菩薩坐像（磐田市）&#34;,&#34;type&#34;:&#34;文化財データベース&#34;,&#34;note&#34;:&#34;静岡県の文化財データベース。県指定有形文化財（彫刻）、指定日1984年11月30日、所有者は宗教法人宣光寺、像高140.1センチメートル・永暦元年銘の解説を確認。&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/kankosports/bunkageijutsu/bunkazai/1002825/1041003/1041884/1004985/1021401.html&#34;},{&#34;title&#34;:&#34;しずおか文化財ナビ 木造毘沙門天立像（磐田市）&#34;,&#34;type&#34;:&#34;文化財データベース&#34;,&#34;note&#34;:&#34;県指定有形文化財（彫刻）、指定日1984年11月30日、像高165.5センチメートル、平安後期の天部形像との解説を確認。&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/kankosports/bunkageijutsu/bunkazai/1002825/1041003/1041884/1004985/1021402.html&#34;},{&#34;title&#34;:&#34;県指定文化財 木造地蔵菩薩坐像・毘沙門天立像｜磐田市公式ウェブサイト&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;磐田市の個別解説ページ。延命地蔵の呼称、鮮やかな彩色などの記述を確認。&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/sports_midokoro/bunkazai/kenshitei/1002056.html&#34;},{&#34;title&#34;:&#34;宣光寺 - 曹洞禅ナビ寺院検索&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;名称・フリガナ・住所（磐田市見付1340-1）・地図のみ掲載。「お寺について・年間行事」「見どころ」等の詳細欄は全てno-link（未記入）で、由緒・本尊・年中行事の記載なし。&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220991.html&#34;},{&#34;title&#34;:&#34;いわた文化財だより第247号&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;令和7年10月発行。磐田市歴史文書館第29回企画展関連イベント「見付宿を歩こう」の予定コースに宣光寺を掲載。&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/_res/projects/default_project/_page_/001/002/024/dayori247.pdf&#34;},{&#34;title&#34;:&#34;宣光寺 境内案内板（磐田市文化財課設置）&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;現地写真で確認。宗派・本尊「十一面観世音菩薩」・創立年不詳・浜松市普済寺末の由緒、県指定文化財（木造地蔵菩薩座像・木造毘沙門天立像）と市指定文化財（梵鐘）の詳細を記載。&#34;,&#34;url&#34;:&#34;&#34;}],&#34;research_todos&#34;:[&#34;開創年（慶長元年〈1596年〉と紹介する資料あり）と開山（豊川・妙厳寺25世大淵龍堂とする資料あり）を霊場公式資料等の本文で確認する&#34;,&#34;「身代わり地蔵」の伝承（武田軍との戦火から人々を救ったとされる話）の典拠を郷土資料で確認する&#34;,&#34;地蔵堂の延命地蔵菩薩と県指定の木造地蔵菩薩坐像が同一の像かを確認する&#34;,&#34;梵鐘の銘文全文を市教育委員会資料で確認する&#34;],&#34;heritage_status&#34;:&#34;静岡県指定文化財・磐田市指定文化財あり&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;地蔵信仰と地蔵小路&#34;,&#34;body&#34;:&#34;宣光寺は延命地蔵菩薩への信仰で知られる寺院です。磐田市観光協会の紹介では、戦国時代に戦死した多くの武将のために、徳川家康の信仰の厚かった延命地蔵菩薩にその冥福を祈って寄進された釣鐘が境内に伝わるとされています。旧東海道（見付宿の通り）から宣光寺へ続く小路は「地蔵小路」と呼ばれ、地蔵信仰の門前としての歴史を今に伝えています。&#34;},{&#34;heading&#34;:&#34;徳川家康寄進の梵鐘&#34;,&#34;body&#34;:&#34;境内の梵鐘は、天正15年（1587年）に徳川家康が施主となり、宣光寺の地蔵菩薩のために寄進されたものです。銘文から、当時中泉御殿が造営されていた時期にあたり、家康の遠江支配との関わりの中で寄進されたと考えられています。鋳造に携わった大工が見付在住の職人であったことも記録されており、磐田市指定文化財（工芸品・安土桃山時代）となっています。戦時中の金属供出を免れて現存すると伝えられます。&#34;},{&#34;heading&#34;:&#34;県指定の平安仏&#34;,&#34;body&#34;:&#34;宣光寺には平安時代の木造地蔵菩薩坐像と木造毘沙門天立像が伝わり、いずれも昭和59年（1984年）11月30日に静岡県指定文化財（彫刻）に指定されています。このほか市指定文化財として、江戸時代の子育如来像・子育地蔵菩薩像（彫刻）と、安永5年（1776年）奉納の和算額（歴史資料）が伝わります。&#34;},{&#34;heading&#34;:&#34;文化財資料からの補足&#34;,&#34;body&#34;:&#34;宣光寺の木造地蔵菩薩坐像は像高140.1センチメートル、桧材の寄木造で、像内の墨書から永暦元年（1160年）の記録が確認されています。製作年代を明らかにできる平安時代後期の延命地蔵の遺例として、昭和59年（1984年）11月30日に静岡県指定有形文化財（彫刻）に指定されました。 木造毘沙門天立像は像高165.5センチメートル、桧材の一木割矧造で、邪鬼を踏まえる姿の平安時代後期の天部形像の佳品です。地蔵菩薩坐像と同日に静岡県指定有形文化財に指定されています。 梵鐘は天正15年（1587年）に徳川家康が宣光寺へ寄進した釣鐘で、徳川氏の遠江支配を知る資料として磐田市指定有形文化財（工芸品）に指定されています。 安永5年（1776年）8月に見付宿の上村和吉が奉納した和算額を所蔵し、当時としては高度な問題を記す歴史資料として磐田市の指定を受けています。&#34;},{&#34;heading&#34;:&#34;『いわた文化財だより』からの補足&#34;,&#34;body&#34;:&#34;宣光寺（磐田市見付）は、旧東海道見付宿の歴史をたどる磐田市歴史文書館主催のウォーキングイベント「見付宿を歩こう」（令和7年〈2025年〉10月実施）のコースにおいて、大見寺・旧見付学校・淡海国玉神社・見付宿脇本陣大三河屋門などとともに巡られる史跡の一つとして紹介されている。&#34;}],&#34;cultural_assets&#34;:[{&#34;name&#34;:&#34;木造地蔵菩薩坐像&#34;,&#34;designation&#34;:&#34;静岡県指定文化財（彫刻）&#34;,&#34;summary&#34;:&#34;平安時代の作とされる地蔵菩薩の坐像で、昭和59年（1984年）11月30日に県指定文化財に指定されました。宣光寺の地蔵信仰の中心となってきた仏像です。&#34;},{&#34;name&#34;:&#34;木造毘沙門天立像&#34;,&#34;designation&#34;:&#34;静岡県指定文化財（彫刻）&#34;,&#34;summary&#34;:&#34;平安時代の作とされる毘沙門天像で、木造地蔵菩薩坐像と同日の昭和59年（1984年）11月30日に県指定文化財に指定されました。&#34;},{&#34;name&#34;:&#34;梵鐘&#34;,&#34;designation&#34;:&#34;磐田市指定文化財（工芸品）&#34;,&#34;summary&#34;:&#34;天正15年（1587年）に徳川家康が施主となって宣光寺の地蔵菩薩のために寄進した安土桃山時代の梵鐘です。中泉御殿造営期の家康の遠江支配を物語る資料とされ、鋳造には見付在住の大工が携わったと記録されています。&#34;},{&#34;name&#34;:&#34;子育如来像・子育地蔵菩薩像&#34;,&#34;designation&#34;:&#34;磐田市指定文化財（彫刻）&#34;,&#34;summary&#34;:&#34;江戸時代の作とされる子育て信仰の仏像で、磐田市の市指定文化財一覧に見付所在の彫刻として掲載されています。&#34;},{&#34;name&#34;:&#34;和算額&#34;,&#34;designation&#34;:&#34;磐田市指定文化財（歴史資料）&#34;,&#34;summary&#34;:&#34;江戸時代の安永5年（1776年）に奉納された和算の算額で、磐田市の市指定文化財一覧に見付所在の歴史資料として掲載されています。&#34;}],&#34;pilgrimage_note&#34;:&#34;遠州三十三観音霊場第17番札所（札所本尊十一面観世音菩薩）／磐田郡三十三観音霊場第22番札所&#34;},{&#34;temple_id&#34;:&#34;iwata-0049&#34;,&#34;slug&#34;:&#34;eifukuji-nishikaizuka&#34;,&#34;name&#34;:&#34;永福寺&#34;,&#34;name_kana&#34;:&#34;えいふくじ&#34;,&#34;aliases&#34;:[&#34;今浦山&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市西貝塚1519番地の1&#34;,&#34;district_id&#34;:&#34;mikuriya&#34;,&#34;area&#34;:&#34;御厨&#34;,&#34;main_deity&#34;:&#34;阿弥陀如来（阿弥陀三尊）。札所本尊は十一面観世音菩薩&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;永福寺は磐田市西貝塚にある曹洞宗の寺院で、山号は今浦山、遠州三十三観音霊場第20番札所です。霊場公式サイトの縁起および『静岡県磐田郡誌』によれば、永正元年（1504年）に金室竜公和尚が開創し、福王寺2世命泉義竜大和尚を勧請開山として、金室和尚の守り本尊であった阿弥陀如来三尊を本堂に安置したと伝えます。本堂は安政6年（1859年）の暴風災害で壊滅した後、明治15年（1882年）に檀信徒の浄財で再建され、平成9年（1997年）に現在の本堂が建立されました。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9122&#34;},{&#34;title&#34;:&#34;遠州三十三観音霊場 - Wikipedia&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;第20番札所・今浦山永福寺・曹洞宗・十一面観世音菩薩・磐田市西貝塚1519-1を確認。&#34;,&#34;url&#34;:&#34;https://ja.wikipedia.org/wiki/%E9%81%A0%E5%B7%9E%E4%B8%89%E5%8D%81%E4%B8%89%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4&#34;},{&#34;title&#34;:&#34;西貝塚 (磐田市) - Wikipedia&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;西貝塚地区の宗教施設として永福寺の名称掲載を確認（詳細記述なし）。地区は縄文後期〜晩期の西貝塚遺跡で知られる。&#34;,&#34;url&#34;:&#34;https://ja.wikipedia.org/wiki/%E8%A5%BF%E8%B2%9D%E5%A1%9A_(%E7%A3%90%E7%94%B0%E5%B8%82)&#34;},{&#34;title&#34;:&#34;永福寺 (磐田市西貝塚・20番札所) | 遠州三十三観音霊場めぐり&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;ページタイトルで第20番札所であることを確認。本文はSSL証明書エラーのため未確認。&#34;,&#34;url&#34;:&#34;http://enshu33.com/all-guide/%E6%B0%B8%E7%A6%8F%E5%AF%BA/&#34;},{&#34;title&#34;:&#34;全都道府県の寺院・仏閣検索（磐田市119カ寺一覧）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;曹洞宗・磐田市西貝塚1519番地の1として掲載を確認。&#34;,&#34;url&#34;:&#34;https://www.bukyou.com/BukyBukyou/TBukyou22/C22CNo211Detail.html&#34;},{&#34;title&#34;:&#34;遠州三十三観音霊場公式サイト「永福寺（磐田市西貝塚・20番札所）」&#34;,&#34;type&#34;:&#34;公式&#34;,&#34;note&#34;:&#34;縁起全文をcurlで取得・確認&#34;,&#34;url&#34;:&#34;http://enshu33.com/all-guide/永福寺/&#34;},{&#34;title&#34;:&#34;静岡県磐田郡誌（磐田郡教育会編、大正10年）寺院由緒「永福寺（西貝村）」&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;コマ453&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680&#34;},{&#34;title&#34;:&#34;野口・マカダ近世墳墓群遺跡発掘調査報告書（磐田市埋蔵文化財センター、1998年）&#34;,&#34;type&#34;:&#34;学術資料&#34;,&#34;note&#34;:&#34;江戸時代初めの西貝塚の寺院として永福寺を列挙&#34;},{&#34;title&#34;:&#34;東海道見付宿の助郷（清水秀明編著、1990年）西貝塚村の項&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;永福寺除地1石5斗&#34;},{&#34;title&#34;:&#34;旧高旧領取調帳 中部編（木村礎校訂）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;西貝塚村 永福寺除地1.500石&#34;},{&#34;title&#34;:&#34;静岡県史料 第5輯（静岡県編、昭和16年）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;永福寺文書（慶安2年2月17日）収録&#34;},{&#34;title&#34;:&#34;遠州三十三観音霊場めぐり 札所一覧（霊場会公式サイト）&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;第20番＝今浦山永福寺（西貝塚1519-1）を確認（既存注記どおり）。&#34;,&#34;url&#34;:&#34;http://enshu33.com/all-guide/&#34;},{&#34;title&#34;:&#34;ニッポンの霊場 磐田郡三十三観音霊場&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;第24番＝今浦山永福寺（西貝塚1519）を確認。&#34;,&#34;url&#34;:&#34;https://nippon-reijo.jimdofree.com/%E6%8E%B2%E8%BC%89%E9%9C%8A%E5%A0%B4%E3%81%AE%E4%B8%80%E8%A6%A7/%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/%E7%A3%90%E7%94%B0%E9%83%A1%E4%B8%89%E5%8D%81%E4%B8%89%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/&#34;},{&#34;title&#34;:&#34;永福寺 - 曹洞禅ナビ寺院検索&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;名称・フリガナ（エイフクジ）・住所（磐田市西貝塚1519-1）のみ掲載。由緒・本尊・年中行事欄は未記入。&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220994.html&#34;}],&#34;research_todos&#34;:[&#34;山号「今浦山」が見付の金剛寺と同一表記である点を確認する（どちらか一方の誤記の可能性を含めて）&#34;,&#34;寺院本尊と創建・沿革を由緒書きや磐田市誌で確認する&#34;,&#34;遠州三十三観音霊場公式サイト（enshu33.com）の当寺ページ本文を確認する（今回SSL証明書エラーで取得不可）&#34;,&#34;西貝塚地区の郷土資料での言及を探す&#34;,&#34;『静岡県史料 第5輯』所収「永福寺文書」（慶安2年2月17日）の内容確認（朱印状か寄進状か）&#34;,&#34;十王像の制作年代・指定状況の確認（磐田市文化財課資料）&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;遠州三十三観音霊場の札所として&#34;,&#34;body&#34;:&#34;永福寺は、昭和59年（1984年）5月に開創された遠州三十三観音霊場の第20番札所です。宗派は曹洞宗、本尊は阿弥陀如来、札所本尊は十一面観世音菩薩で、御詠歌は「ただたのめ　いまうらやまの　くさもきも　とうのちかいの　あらんかぎりは」と定められています。観音堂には十一面観世音菩薩と三十三観音が祀られ、堂の脇には鎌倉時代後期の作と伝えられる十王像が安置されています（霊場公式サイトによる）。近隣の札所は第19番正醫寺（下万能）と第21番観音寺（福田）で、同じ西貝塚地区の第18番福王寺（城之崎）は永福寺の本寺に当たります。&#34;},{&#34;heading&#34;:&#34;永正元年開創の縁起—寺号と山号の由来&#34;,&#34;body&#34;:&#34;遠州三十三観音霊場公式サイトの縁起によれば、永福寺は永正元年（1504年）2月1日、金室竜公和尚によって開創され、福王寺2世命泉義竜大和尚を勧請開山として請じ、開創時に金室和尚の守り本尊であった阿弥陀如来三尊を本堂に安置して今日に至っています。「永福」の寺号は開創当時の年号である永正の「永」と、万民の幸せを願う「福」を合わせたものと言われ、山号の「今浦山」は寺の所在地一帯の「今の浦」の地名にちなみます。大正10年（1921年）刊『静岡県磐田郡誌』の由緒も「西貝村西貝塚字中小路に在り。今浦山と號す。當村福王寺の末にして、本尊は阿彌陀如來なり。永正元年、福王寺の命泉和尙之れを建設すといふ」と記しており、縁起と一致します。本堂は安政6年（1859年）8月の暴風災害（安政の大風災）で壊滅しましたが、明治15年（1882年）8月に檀信徒の浄財により再建され、さらに平成9年（1997年）10月に現在の本堂が建立されました。&#34;},{&#34;heading&#34;:&#34;近世の記録—除地1石5斗と慶安2年の文書&#34;,&#34;body&#34;:&#34;西貝塚地区の江戸時代の寺院構成について、磐田市埋蔵文化財センター『野口・マカダ近世墳墓群遺跡発掘調査報告書』（1998年）は、江戸時代の初めの西貝塚に福王寺、隣浦庵（のち林宝院）、永福寺、長泉庵などがあったと記しています。清水秀明編著『東海道見付宿の助郷』（1990年）は西貝塚村の項で福王寺の末寺として永福寺に除地1石5斗があったと記し、幕末から明治初年の『旧高旧領取調帳』中部編にも西貝塚村に「永福寺除地1石5斗」が見えます。また『静岡県史料 第5輯』（静岡県編、昭和16年）には「永福寺文書」として慶安2年（1649年）2月17日付の文書が収録されており、江戸時代前期の寺の存在を示す文書が伝来していたことが分かります。所在地の西貝塚は縄文時代後期から晩期の貝塚遺跡（西貝塚遺跡）で知られる地区です。&#34;}],&#34;pilgrimage_note&#34;:&#34;遠州三十三観音霊場第20番札所（札所本尊十一面観世音菩薩）／磐田郡三十三観音霊場第24番札所&#34;,&#34;founded_period&#34;:&#34;永正元年（1504年）開創&#34;,&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0050&#34;,&#34;slug&#34;:&#34;kongoji-mitsuke&#34;,&#34;name&#34;:&#34;金剛寺&#34;,&#34;name_kana&#34;:&#34;こんごうじ&#34;,&#34;aliases&#34;:[&#34;今浦山&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市見付2749番地の1&#34;,&#34;district_id&#34;:&#34;mitsuke&#34;,&#34;area&#34;:&#34;見付&#34;,&#34;main_deity&#34;:&#34;未確認&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;現地写真あり&#34;,&#34;detail_status&#34;:&#34;公開情報調査済み&#34;,&#34;history_summary&#34;:&#34;金剛寺は磐田市見付にある曹洞宗の寺院です。民間の寺院紹介記事では山号を今浦山、本尊を釈迦牟尼仏とし、1424年に開創され1610年代に再興されたと紹介されていますが、一次資料での確認はできていません。幕末の侠客で清水次郎長の兄貴分とされる大和田友蔵の墓があると伝えられます。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-12&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9123&#34;},{&#34;title&#34;:&#34;金剛寺（静岡県磐田市）: お寺の風景と陶芸&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;山号今浦山・曹洞宗・本尊釈迦牟尼仏・1424年開創・1610年代再興・大和田友蔵（清水次郎長の兄貴分とされる侠客）の墓・所在地見付2749-1という紹介を確認（個人ブログの訪問記のため断定根拠とはしない）。&#34;,&#34;url&#34;:&#34;https://tempsera.seesaa.net/article/201605article_38.html&#34;},{&#34;title&#34;:&#34;今浦山 金剛寺 - 磐田市/静岡県 | Omairi&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;検索結果のページタイトルで「今浦山 金剛寺」の山号表記を確認（複数の民間サイトで山号が一致）。&#34;,&#34;url&#34;:&#34;https://omairi.club/spots/129409&#34;},{&#34;title&#34;:&#34;磐田市 曹洞宗 金剛寺 | Facebook&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;寺院がFacebookで公式に情報発信していることを確認（本文の詳細は未取得）。&#34;,&#34;url&#34;:&#34;https://www.facebook.com/profile.php?id=61550672120412&#34;},{&#34;title&#34;:&#34;全都道府県の寺院・仏閣検索（磐田市119カ寺一覧）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;曹洞宗・磐田市見付2749番地の1として掲載を確認。&#34;,&#34;url&#34;:&#34;https://www.bukyou.com/BukyBukyou/TBukyou22/C22CNo211Detail.html&#34;},{&#34;title&#34;:&#34;磐田市 金剛寺 公式Instagramアカウント（@kongoji_iwata）&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;磐田市見付の曹洞宗寺院であることを住所・宗派の記載で確認。月例坐禅会の実施を確認&#34;,&#34;url&#34;:&#34;https://www.instagram.com/kongoji_iwata/&#34;},{&#34;title&#34;:&#34;金剛寺 - 曹洞禅ナビ寺院検索&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;名称欄に山号「今浦山」が明記され「今浦山　金剛寺」と表記（既存aliasesの今浦山と一致・裏付け）。住所は磐田市見付2749-1で一致。活動・イベント欄に坐禅・写経・ご詠歌・法話会等のカテゴリ項目はあるが、いずれも本文は「詳細については、お問い合わせください」の定型文のみで実質的な由緒・本尊情報なし。&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220992.html&#34;}],&#34;research_todos&#34;:[&#34;1424年開創・1610年代再興という年代の典拠（磐田市誌・寺院由緒）を確認する&#34;,&#34;山号「今浦山」が西貝塚の永福寺と同一表記である点を確認する&#34;,&#34;本尊（釈迦牟尼仏とされる）を寺院公式情報で確認する&#34;,&#34;大和田友蔵（山田友蔵と表記する資料もあり）の墓の実在と人物事績を郷土資料で確認する&#34;,&#34;寺院公式SNS（Facebook・Instagram）の発信内容から沿革情報を収集する&#34;,&#34;Instagram以外の公式サイトの有無の確認&#34;,&#34;月例坐禅会の具体的な開催日・参加方法の現地確認&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;伝えられる沿革&#34;,&#34;body&#34;:&#34;金剛寺は旧東海道見付宿にあたる磐田市見付の曹洞宗寺院です。民間の寺院訪問記録では、山号は今浦山、本尊は釈迦牟尼仏とされ、1424年（応永31年）に開創され、1610年代に再興されたと紹介されています。ただしこれらは民間の二次情報にもとづくもので、寺院の由緒書きや磐田市誌など一次資料での確認が必要です。寺院はFacebook・Instagramで「磐田市 曹洞宗 金剛寺」として情報発信を行っています。&#34;},{&#34;heading&#34;:&#34;大和田友蔵の墓&#34;,&#34;body&#34;:&#34;民間の寺院訪問記録によれば、境内には幕末の侠客で清水次郎長の兄貴分であったとされる大和田友蔵の墓があると紹介されています。見付宿の歴史と重なる人物伝承であり、墓碑の実在と人物の事績については郷土資料での裏付け調査が望まれます。&#34;}],&#34;danka_info&#34;:{&#34;annual_events&#34;:[{&#34;name&#34;:&#34;月例坐禅会&#34;,&#34;timing&#34;:&#34;毎月&#34;,&#34;note&#34;:&#34;寺院公式Instagramアカウントのプロフィールに「毎月坐禅会をおこなっています」と記載&#34;}],&#34;community_role&#34;:&#34;寺院公式Instagramアカウントで坐禅会への参加を呼びかけ、地域住民に開かれた活動を発信している。&#34;}},{&#34;temple_id&#34;:&#34;iwata-0051&#34;,&#34;slug&#34;:&#34;rinpoin-nishikaizuka&#34;,&#34;name&#34;:&#34;林宝院&#34;,&#34;name_kana&#34;:&#34;りんぽういん&#34;,&#34;aliases&#34;:[&#34;西浦山&#34;,&#34;隣浦庵（旧称）&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市西貝塚1423番地&#34;,&#34;district_id&#34;:&#34;mikuriya&#34;,&#34;area&#34;:&#34;御厨&#34;,&#34;main_deity&#34;:&#34;地蔵菩薩（『静岡県磐田郡誌』による）&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;林宝院は磐田市西貝塚にある曹洞宗の寺院で、山号は西浦山です。『静岡県磐田郡誌』（大正10年）によれば永正16年（1519年）嶺宗の開創で、西貝塚の福王寺の末寺、本尊は地蔵菩薩とされます。江戸時代初めには「隣浦庵」と呼ばれ、慶長9年（1604年）の伊奈忠次手形（林宝院文書）が残るほか、明治22年（1889年）には西貝尋常小学校の教室として使われました。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9124&#34;},{&#34;title&#34;:&#34;静岡県磐田郡誌（磐田郡教育会編、大正10年）寺院由緒「林寳院（西貝村）」&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;コマ453。西貝尋常小学校の記事はコマ285&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680&#34;},{&#34;title&#34;:&#34;日本歴史地名大系「西貝塚村」（平凡社、コトバンク）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;慶長9年林宝院宛伊奈忠次手形の記載&#34;,&#34;url&#34;:&#34;https://kotobank.jp/word/西貝塚村&#34;},{&#34;title&#34;:&#34;野口・マカダ近世墳墓群遺跡発掘調査報告書（磐田市埋蔵文化財センター、1998年）&#34;,&#34;type&#34;:&#34;学術資料&#34;,&#34;note&#34;:&#34;「隣浦庵（のち林宝院）」の記載&#34;},{&#34;title&#34;:&#34;東海道見付宿の助郷（清水秀明編著、1990年）西貝塚村の項&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;隣浦庵（のち林宝院）除地3石&#34;},{&#34;title&#34;:&#34;静岡県史料 第5輯（静岡県編、昭和16年）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;林寳院文書（慶長9年伊奈忠次手形・松平親茂添状）収録&#34;},{&#34;title&#34;:&#34;旧高旧領取調帳 中部編（木村礎校訂）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;西貝塚村 林宝院領3.000石&#34;},{&#34;title&#34;:&#34;磐田市誌 上巻（磐田市誌編纂執筆委員会編、1954年）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;西貝塚遺跡が林宝院・須賀神社境内一帯に達するとの記述&#34;},{&#34;title&#34;:&#34;林宝院 - 曹洞禅ナビ寺院検索&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;名称・フリガナ（リンポウイン）・住所（磐田市西貝塚1423）のみ掲載。由緒・本尊・年中行事欄は未記入。&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220998.html&#34;}],&#34;research_todos&#34;:[&#34;山号・本尊・沿革を現地の由緒書きや磐田市誌で確認する&#34;,&#34;西貝塚の永福寺との関係（塔頭・末寺関係の有無）を調べる&#34;,&#34;曹洞宗静岡県宗務所の寺院名簿で正式名称・本末関係を確認する&#34;,&#34;西貝塚地区の郷土資料（区誌等）での言及を探す&#34;,&#34;『静岡県史料 第5輯』所収の林宝院文書（慶長9年辰ノ8月21日伊奈忠次手形・松平親茂添状）の本文確認&#34;,&#34;曹洞宗宗宝調査目録解題集1（東海管区編、1991年）の福王寺・林宝院関係文書の解題確認（開山の姓「後藤」に関する記述の文脈が未確認）&#34;,&#34;旧称「隣浦庵」から林宝院への改称時期の特定&#34;],&#34;founded_period&#34;:&#34;永正16年（1519年）開創（『静岡県磐田郡誌』）&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;永正16年開創—福王寺末の西浦山林宝院&#34;,&#34;body&#34;:&#34;大正10年（1921年）刊『静岡県磐田郡誌』の寺院由緒には「林寳院（西貝村）【由緒】西貝村西貝塚字小野に在り。西浦山と號す。當村福王寺の末寺にして、本尊は地藏菩薩なり。永正十六年、嶺宗の開創に係る」と記されています。永正16年は1519年に当たり、同じ西貝塚の永福寺（永正元年開創）とほぼ同時期に、福王寺の末寺として開かれたことになります。磐田市埋蔵文化財センター『野口・マカダ近世墳墓群遺跡発掘調査報告書』（1998年）や清水秀明編著『東海道見付宿の助郷』（1990年）は、江戸時代初めのこの寺を「隣浦庵（のち林宝院）」と記しており、当初は庵として営まれ、のちに院号を称するようになったとみられます。&#34;},{&#34;heading&#34;:&#34;慶長9年の伊奈忠次手形—林宝院文書&#34;,&#34;body&#34;:&#34;『日本歴史地名大系』（平凡社）の西貝塚村の項は、慶長9年（1604年）の林宝院宛伊奈忠次手形（林宝院文書）に村名が「貝塚村」と記されていることを紹介しており、徳川家康の代官頭伊奈忠次から寺への文書が交付されるほどの寺院として、江戸幕府成立直後には確かな存在が確認できます。この文書は『静岡県史料 第5輯』（静岡県編、昭和16年）に「林寳院文書」として松平親茂添状とともに収録されています。寺領については『東海道見付宿の助郷』が除地3石と記し、幕末から明治初年の『旧高旧領取調帳』中部編にも西貝塚村に「林宝院領3石」が見えます。&#34;},{&#34;heading&#34;:&#34;西貝尋常小学校の教室・西貝塚遺跡&#34;,&#34;body&#34;:&#34;『静岡県磐田郡誌』の教育の章によれば、明治22年（1889年）4月15日、西貝村西貝塚の林宝院を教室として西貝尋常小学校が創立され、従前鎌田校に通学していた西貝塚・西之島、大原学校に通学していた上南田の児童を収容しました。地域の近代教育の出発点となった寺院です。また『磐田市誌 上巻』（1954年）は、縄文時代後期から晩期の西貝塚遺跡（貝塚群）の範囲が磐田東小学校の北に当たる林宝院・須賀神社境内一帯にも達すると記しており、境内地は先史時代以来の遺跡の上に立地しています。&#34;}],&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0052&#34;,&#34;slug&#34;:&#34;honshoji-kounodai&#34;,&#34;name&#34;:&#34;本性寺&#34;,&#34;name_kana&#34;:&#34;ほんしょうじ&#34;,&#34;aliases&#34;:[&#34;常住山&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;日蓮宗&#34;,&#34;address&#34;:&#34;静岡県磐田市国府台441番地の1&#34;,&#34;district_id&#34;:&#34;nakaizumi&#34;,&#34;area&#34;:&#34;中泉&#34;,&#34;main_deity&#34;:&#34;十界諸尊（『静岡県磐田郡誌』による）&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;本性寺は磐田市国府台にある日蓮宗の寺院で、山号は常住山です。『静岡県磐田郡誌』（大正10年）は、寛永3年（1626年）丙寅5月に日遷が開創し、浜名郡馬郡村本徳寺の末寺で、十界諸尊を安置して本尊とすると記します。大正期の所在地は梅原村字中向（東を見付町、南を中泉町に接した村）で、昭和期の寺院名鑑では磐田市高町、現在は国府台に所在します。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9125&#34;},{&#34;title&#34;:&#34;本性寺（曖昧さ回避） - Wikipedia&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;「静岡県磐田市国府台にある日蓮宗の寺院。山号は常住山」との記載を本文で確認。&#34;,&#34;url&#34;:&#34;https://ja.wikipedia.org/wiki/%E6%9C%AC%E6%80%A7%E5%AF%BA&#34;},{&#34;title&#34;:&#34;静岡県磐田市の寺院一覧（いいお墓）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;磐田市の寺院一覧に日蓮宗・国府台441-1の本性寺が掲載されていることを確認。&#34;,&#34;url&#34;:&#34;https://www.e-ohaka.com/temple_list/id22211.html&#34;},{&#34;title&#34;:&#34;静岡県磐田郡誌（磐田郡教育会編、大正10年）寺院由緒「本性寺（梅原村）」&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;コマ471（原本画像で由緒全文を判読）。日蓮宗寺院一覧表はコマ422、梅原村の沿革・一言坂付近の本性寺跡の記述も同書&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680&#34;},{&#34;title&#34;:&#34;寺院大鑑 東海・北陸篇（久遠出版、1982年）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;日蓮宗本性寺 磐田市高町179-1（NDL全文検索スニペット）&#34;},{&#34;title&#34;:&#34;町内史跡めぐり（豊田町郷土を研究する会編、豊田町教育委員会、1989年）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;一言の本性寺跡は「現在高町にある本性寺」とは別と明記（NDL全文検索スニペット）&#34;},{&#34;title&#34;:&#34;ふるさと豊田 改訂版（豊田町郷土を研究する会編、1977年）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;一言付近の「大昔の本性寺」跡の記述&#34;},{&#34;title&#34;:&#34;日蓮宗ポータルサイト 全寺院マップ 静岡県磐田市&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;一覧掲載のみ。「本性寺 〒438-0077 静岡県磐田市国府台441-1」として掲載を確認（住所照合一致）。個別寺院ページ・由緒の掲載なし&#34;,&#34;url&#34;:&#34;https://www.nichiren.or.jp/temple/map/tokai/shizuoka/iwata-shi/&#34;}],&#34;research_todos&#34;:[&#34;山号「常住山」の一次資料（寺号標・宗門名簿等）での確認&#34;,&#34;創建年代・開山の確認（磐田市誌・見付の郷土資料の調査）&#34;,&#34;本尊の現地確認（参拝記録サイトの記載の裏取り）&#34;,&#34;日蓮宗静岡県中部宗務所の寺院名簿での確認&#34;,&#34;見付宿・国府台地区の寺院史における位置づけの調査&#34;,&#34;高町179-1（1982年寺院大鑑）から国府台441-1（現在）への変更が地番変更か移転かの確認&#34;,&#34;本寺とされる浜名郡馬郡村本徳寺（現浜松市域）の現況と本末関係の確認&#34;,&#34;一言の本性寺跡と国府台の本性寺の関係（前身・無関係のいずれか）についての郷土研究の確認&#34;,&#34;日蓮宗公式の全寺院マップには寺名・住所のみで由緒欄がない。山号「常住山」の確認と沿革は磐田市史・寺院資料での調査が必要&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;基礎情報と現況&#34;,&#34;body&#34;:&#34;本性寺は磐田市国府台441番地の1に所在する日蓮宗の寺院です。Wikipediaの同名寺院一覧では「静岡県磐田市国府台にある日蓮宗の寺院。山号は常住山」と記載されています。『寺院大鑑 東海・北陸篇』（1982年）では日蓮宗本性寺の所在地が磐田市高町179-1と記載されており、現在の国府台441-1とは表記が異なります。地番変更によるものか移転によるものかは現時点では確認できていません。&#34;},{&#34;heading&#34;:&#34;寛永3年、日遷の開創—磐田郡誌にみる由緒&#34;,&#34;body&#34;:&#34;大正10年（1921年）刊『静岡県磐田郡誌』の寺院由緒には「本性寺（梅原村）【由緒】梅原村字中向に在り。濱名郡馬郡村本德寺末。十界諸尊を安置して本尊とす。寛永三年丙寅五月、日遷の開創する所なり」と記されています。同郡誌の日蓮宗寺院一覧表でも、妙日寺（貫名山）・玄妙寺（本立山）などとともに本性寺が「常住山」の山号で挙げられており、磐田郡内の日蓮宗寺院は妙日寺・玄妙寺・本性寺・妙満寺・妙雲寺・長石寺の6か寺のみでした。当時の所在地である梅原村は、東を見付町、南を中泉町に接し、西北を井通村に囲まれた磐田原南端の小村で（同郡誌沿革の章）、役場事務は中泉町との組合で処理されていました。現在の国府台・高町一帯に近い、見付宿の南西側に当たる地域です。&#34;},{&#34;heading&#34;:&#34;一言の「本性寺跡」との区別&#34;,&#34;body&#34;:&#34;磐田原の一言坂（旧井通村、現磐田市一言周辺）の近くには、中世にさかのぼるとみられる「本性寺跡」と呼ばれる寺院跡が別に存在します。『静岡県磐田郡誌』の名勝遺跡の章は、古老の伝えとして六右衛門塚の近くに本性寺という寺があり、その仁王門の跡とされる官有地や、小字「寺跡」の地名、畑からの五輪塔の出土を記しています。豊田町郷土を研究する会『町内史跡めぐり』（1989年）も、この本性寺跡が「現在高町にある本性寺」とは別のものであると明記しています。同名のため資料上混同されやすいものの、両者は別個の存在であり、国府台の本性寺の歴史を調べる際には注意が必要です。&#34;}],&#34;founded_period&#34;:&#34;寛永3年（1626年）5月、日遷開創（『静岡県磐田郡誌』）&#34;,&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0053&#34;,&#34;slug&#34;:&#34;genmyoji-mitsuke&#34;,&#34;name&#34;:&#34;玄妙寺&#34;,&#34;name_kana&#34;:&#34;げんみょうじ&#34;,&#34;aliases&#34;:[&#34;本立山&#34;,&#34;本立山玄妙寺&#34;,&#34;得道の寺&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;日蓮宗&#34;,&#34;address&#34;:&#34;静岡県磐田市見付2440番地の1&#34;,&#34;district_id&#34;:&#34;mitsuke&#34;,&#34;area&#34;:&#34;見付&#34;,&#34;main_deity&#34;:&#34;未確認&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;現地写真あり&#34;,&#34;detail_status&#34;:&#34;公開情報調査済み&#34;,&#34;history_summary&#34;:&#34;玄妙寺は元中2年・北朝至徳2年（1385年）、日什門流の開祖・玄妙阿闍梨日什上人によって建立された日蓮宗の由緒寺院で、「本山」の称号を許されています。日什上人が自身の名を寺号とした寺であり、日什上人が生涯で最初に建立した法城として「得道の寺」と呼ばれ、京都妙満寺・会津妙法寺とともに「什門の三本山」と称されます。毎年11月12日の御命講は、子育て草履の御祈祷で近郷近在の人々に親しまれてきました。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-12&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9126&#34;},{&#34;title&#34;:&#34;本立山 玄妙寺｜日蓮宗ポータルサイト 寺院ページ&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;山号本立山、所在地（磐田市見付2440-1）、元中2年（1385年）開創、開山日什、什門三本山の呼称、日蓮宗由緒寺院（本山）であることを確認。&#34;,&#34;url&#34;:&#34;https://temple.nichiren.or.jp/2071026-genmyouji/&#34;},{&#34;title&#34;:&#34;玄妙寺 - Wikipedia&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;元中2年（1385年）開創、顕本法華宗本山であったこと、1941年の日蓮宗との合同、什門四本山、御命講（11月12〜13日）、経蔵・門柱及び塀の登録有形文化財登録を確認。&#34;,&#34;url&#34;:&#34;https://ja.wikipedia.org/wiki/%E7%8E%84%E5%A6%99%E5%AF%BA&#34;},{&#34;title&#34;:&#34;国登録有形文化財｜磐田市公式ウェブサイト&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;「玄妙寺経蔵・門柱及び塀」が平成26年12月19日登録、所在地見付、所有者玄妙寺であることを確認。&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/sports_midokoro/bunkazai/bunkazainitsuite/1002040.html&#34;},{&#34;title&#34;:&#34;玄妙寺経蔵 - 文化遺産オンライン&#34;,&#34;type&#34;:&#34;文化財データベース&#34;,&#34;note&#34;:&#34;経蔵の建設年代（1934年）、構造（鉄筋コンクリート造平屋建・瓦葺・建築面積13㎡）、意匠、登録年月日（2014年12月19日）を確認。&#34;,&#34;url&#34;:&#34;https://online.bunka.go.jp/heritages/detail/233858&#34;},{&#34;title&#34;:&#34;本立山玄妙寺 公式サイト「玄妙寺縁起」&#34;,&#34;type&#34;:&#34;寺院公式サイト&#34;,&#34;note&#34;:&#34;置文・三種の霊宝の故事・什物・准宗宝の御木像・山号扁額（本多日生上人揮毫）を確認。トップページで経蔵等の国登録有形文化財登録（平成28年）も確認&#34;,&#34;url&#34;:&#34;https://honryuzan.genmyouji.nichiren-shu.jp/link01/01_0001.htm&#34;},{&#34;title&#34;:&#
