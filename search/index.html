ions&#34;:[{&#34;heading&#34;:&#34;調査状況&#34;,&#34;body&#34;:&#34;法人番号公表情報に基づく寺院データベースで、磐田市三家332に所在する曹洞宗の宗教法人（法人番号5080405005672）であることが確認できます。同データベースの集計では、全国の寺院のうち「松久院」を名乗るのは本寺院のみとされています。一方、山号・本尊・創建年代など沿革を伝える公開Web情報は現時点では確認できていません。三家は旧豊岡村域の集落です。&#34;},{&#34;heading&#34;:&#34;『静岡県磐田郡誌』にみえる由緒&#34;,&#34;body&#34;:&#34;大正10年（1921年）刊行の『静岡県磐田郡誌』の曹洞宗寺院の項には、「松久院（広瀬村）」として「広瀬村三家字中西に在り。豊田山と号す。小笠郡下垂木永江院の末にして、本尊は釈迦牟尼如来なり。寛永元年8月開創す」と記されています。本寺の永江院は現在の掛川市下垂木にある曹洞宗寺院で、松久院が遠州曹洞宗の掛川方面の法系に連なっていたことがうかがえます。なお、法人番号公表情報に基づく寺院データベースの集計では、全国の寺院のうち「松久院」を名乗るのは本寺院のみとされています。&#34;},{&#34;heading&#34;:&#34;明治初期の学校としての利用&#34;,&#34;body&#34;:&#34;『静岡県磐田郡誌』の教育の章（広瀬尋常高等小学校の沿革）には、明治8年（1875年）、小学野部学校の分校として「三家学校」が三家村58番地の松久院内に設けられ、三家・松木島・下神増の3村の学齢児童を教育したと記されています。三家学校はその後、上神増学校（慈眼寺内）・松ノ木島学校と統合され、明治22年（1889年）に広瀬尋常小学校となりました。三家は旧豊田郡広瀬村、のち豊岡村の大字で、2005年（平成17年）の合併により磐田市の住所表示となりました。&#34;}],&#34;founded_period&#34;:&#34;寛永元年（1624年）8月&#34;,&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0111&#34;,&#34;slug&#34;:&#34;hoonan-kaminobe&#34;,&#34;name&#34;:&#34;法音庵&#34;,&#34;name_kana&#34;:&#34;ほうおんあん&#34;,&#34;aliases&#34;:[&#34;鳳雄山&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市上野部2032番地&#34;,&#34;district_id&#34;:&#34;toyooka&#34;,&#34;area&#34;:&#34;豊岡&#34;,&#34;main_deity&#34;:&#34;十一面観世音菩薩&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;公開情報調査済み&#34;,&#34;history_summary&#34;:&#34;法音庵は磐田市上野部にある曹洞宗の寺院で、山号は鳳雄山、本尊は十一面観世音菩薩です。曹洞宗公式ポータルの寺院情報によると、文明4年（1472年）に川僧慧済禅師によって開創され、令和4年（2022年）に開創550年を迎えました。本堂・位牌堂・庫裡・山門などは平成14年（2002年）に一新されています。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-12&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9382&#34;},{&#34;title&#34;:&#34;法音庵 - 曹洞禅ナビ（曹洞宗公式寺院ポータル）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;鳳雄山法音庵・磐田市上野部2032・本尊十一面観世音菩薩・文明4年（1472年）川僧慧済禅師開創・令和4年開創550年・平成14年に本堂位牌堂庫裡山門等一新・ご詠歌・写経写仏を本文で確認。&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_221244.html&#34;},{&#34;title&#34;:&#34;静岡県磐田市の寺院・御堂一覧（サーチ寺院）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;磐田市上野部2032・曹洞宗の法音庵の登載を本文で確認。&#34;,&#34;url&#34;:&#34;https://www.bukyou.com/BukyBukyou/TBukyou22/C22CNo211Detail.html&#34;},{&#34;title&#34;:&#34;法音庵 - 曹洞禅ナビー寺院検索（沿革・年間行事）&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;六地蔵尊祈願祭の開催日を記載&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/article_221244_1.html&#34;},{&#34;title&#34;:&#34;法音庵 - 曹洞禅ナビー寺院検索（お役立ち）&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;墓地・永代供養塔・樹木葬墓地・駐車場の案内を記載&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/article_221244_4.html&#34;},{&#34;title&#34;:&#34;法音庵 Facebookページ&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;曹洞禅ナビに登録された公式Facebookリンク&#34;,&#34;url&#34;:&#34;https://www.facebook.com/houonan/&#34;}],&#34;research_todos&#34;:[&#34;開山とされる川僧慧済禅師の事績（遠州地方の曹洞宗寺院開創との関係）を宗門資料で確認する&#34;,&#34;「庵」を称する寺格の変遷（庵から寺院への昇格の有無）を確認する&#34;,&#34;本寺と末寺関係を宗門資料で確認する&#34;,&#34;『豊岡村史』での言及を確認する&#34;,&#34;護持会・世話人会等の組織についての公開情報は見つからず。現地での確認が望ましい&#34;],&#34;founded_period&#34;:&#34;文明4年（1472年）川僧慧済禅師開創&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;開創と現在の伽藍&#34;,&#34;body&#34;:&#34;曹洞宗公式の寺院ポータルサイト「曹洞禅ナビ」の法音庵の頁には、文明4年（1472年）に川僧慧済禅師が開創したと記されており、令和4年（2022年）に開創550年を迎えました。本堂・位牌堂・庫裡・山門などは平成14年（2002年）に一新されています。上野部は天竜川左岸の旧豊岡村域にあり、最寄駅は天竜浜名湖鉄道の豊岡駅です。&#34;},{&#34;heading&#34;:&#34;現在の活動&#34;,&#34;body&#34;:&#34;同頁によると、法音庵ではご詠歌や写経・写仏の活動が行われており、ご祈祷やお墓・納骨堂についても相談を受け付けています。&#34;},{&#34;heading&#34;:&#34;開創550年を迎えた古寺&#34;,&#34;body&#34;:&#34;文明4年（1472年）に川僧慧済禅師によって開創され、令和4年（2022年）に開創550年を迎えました。本堂・位牌堂・庫裡・山門などの伽藍は平成14年（2002年）に一新されています。現在はご詠歌や写経・写仏の活動が行われています。&#34;}],&#34;danka_info&#34;:{&#34;annual_events&#34;:[{&#34;name&#34;:&#34;年中行事&#34;,&#34;timing&#34;:&#34;&#34;,&#34;note&#34;:&#34;ご詠歌、写経・写仏&#34;},{&#34;name&#34;:&#34;六地蔵尊祈願祭&#34;,&#34;timing&#34;:&#34;毎年10月24日午後2時より&#34;,&#34;note&#34;:&#34;寺院公式情報（曹洞禅ナビ）による&#34;}],&#34;cemetery&#34;:&#34;境内隣接の墓地のほか、永代供養塔、樹木葬墓地がある。寺院公式情報（曹洞禅ナビ）による&#34;,&#34;parking&#34;:&#34;お参りしやすい平地に立地し、駐車場も完備している。寺院公式情報（曹洞禅ナビ）による&#34;}},{&#34;temple_id&#34;:&#34;iwata-0112&#34;,&#34;slug&#34;:&#34;tenryuin-kaminobe&#34;,&#34;name&#34;:&#34;天龍院&#34;,&#34;name_kana&#34;:&#34;てんりゅういん&#34;,&#34;aliases&#34;:[&#34;神谷山天龍院&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市上野部353番地&#34;,&#34;district_id&#34;:&#34;toyooka&#34;,&#34;area&#34;:&#34;豊岡&#34;,&#34;main_deity&#34;:&#34;未確認&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;天龍院は磐田市上野部にある曹洞宗の寺院で、山号は神谷山です。大正10年（1921年）刊行の『静岡県磐田郡誌』によれば、二俣城主松井氏ゆかりの寺院で、享禄元年（1528年）8月に創立され、城東郡各和村（現掛川市各和）の永源寺第3世一貞和尚を開山に迎えたと記されています。桶狭間の戦いで戦死した松井宗信の首が当寺に葬られたと伝えられ、慶長8年（1603年）には徳川家康から朱印高9石を与えられました。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-12&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9384&#34;},{&#34;title&#34;:&#34;天龍院 - 曹洞禅ナビ（曹洞宗公式寺院ポータルサイト）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;寺院名（テンリュウイン）・住所（磐田市上野部353）・曹洞宗所属を確認。歴史等の詳細記述はページ上になし。&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_221229.html&#34;},{&#34;title&#34;:&#34;旧豊岡村の住所表示｜磐田市公式ウェブサイト&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;上野部が旧豊岡村の大字であり、合併により磐田市の住所表示となったことを確認。&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/kurashi_tetsuzuki/koseki_juuminhyou_inkan/1001311/1001315.html&#34;},{&#34;title&#34;:&#34;上野部 - Wikipedia&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;上野部地区の寺院として天龍院（曹洞宗）・妙満寺（日蓮宗）が記載されていることを本文で確認。&#34;,&#34;url&#34;:&#34;https://ja.wikipedia.org/wiki/%E4%B8%8A%E9%87%8E%E9%83%A8&#34;},{&#34;title&#34;:&#34;天龍院（曹洞宗）｜播磨屋の寺葬儀&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;所在地と、天竜浜名湖鉄道上野部駅から約810mというアクセス情報を確認。寺史の記載はなし。&#34;,&#34;url&#34;:&#34;https://www.harimaya-web.com/temple/shizuoka/ji22211_052.html&#34;},{&#34;title&#34;:&#34;『静岡県磐田郡誌』静岡県磐田郡教育会編（大正10年・1921年）第13章 神社及宗教 曹洞宗寺院の項（185 天龍院・186 保安寺）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション（インターネット公開）。465コマ目の本文画像で由緒全文・風土記伝引用を確認。金海寺（末寺）の記述は448コマ目。&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680/1/465&#34;},{&#34;title&#34;:&#34;太田亮『遠江』磯部甲陽堂（昭和2年・1927年）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;NDLラボ次世代デジタルライブラリーの全文検索スニペットで「天龍院（上野部村）曹洞宗、九石、松井左衛門亮の開基」の記述を確認。&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/1176478&#34;},{&#34;title&#34;:&#34;ニッポンの霊場 磐田郡三十三観音霊場&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;第15番＝神谷山天龍院（曹洞宗・上野部353）を確認。寺名・宗派・住所がDBと一致。&#34;,&#34;url&#34;:&#34;https://nippon-reijo.jimdofree.com/%E6%8E%B2%E8%BC%89%E9%9C%8A%E5%A0%B4%E3%81%AE%E4%B8%80%E8%A6%A7/%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/%E7%A3%90%E7%94%B0%E9%83%A1%E4%B8%89%E5%8D%81%E4%B8%89%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/&#34;},{&#34;title&#34;:&#34;市指定文化財｜磐田市公式ウェブサイト&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;分類・時代・所在地・所有者を一覧表で確認&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/sports_midokoro/bunkazai/bunkazainitsuite/1002039.html&#34;},{&#34;title&#34;:&#34;磐田市文化財一覧オープンデータ（LinkData・CC BY）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;磐田市公開の文化財一覧オープンデータ。名称・よみ・所在地により寺院と文化財の対応を照合&#34;,&#34;url&#34;:&#34;http://linkdata.org/work/rdf1s10219i&#34;}],&#34;research_todos&#34;:[&#34;山号・本尊・創建年代を寺院への現地確認または『磐田市誌』『豊岡村誌』で調査する&#34;,&#34;曹洞禅ナビに掲載されている公式ホームページ・SNSリンクの実URLを確認する&#34;,&#34;本寺（本末関係）と開山・開基の伝承を調査する&#34;,&#34;境内の堂宇・石造物・句碑等の有無を現地確認する&#34;,&#34;本尊の尊格を寺院側資料で確認する（郡誌の由緒には本尊の記載がない）&#34;,&#34;郡誌は二俣城落城を「元亀元年」と記すが、一般的な二俣城攻防戦の年代（元亀3年）との整合を『磐田市誌』等で確認する&#34;,&#34;松井宗信の墓所・碑石の現存状況を確認する&#34;,&#34;曹洞禅ナビの由緒・本尊欄が空欄のため、豊岡村誌等の地域資料で由緒を調査する&#34;,&#34;天龍院の公式ホームページ・SNSアカウントの実在確認（曹洞禅ナビのリンクが機能しているか現地または再クロールで要確認）&#34;,&#34;年中行事・墓地永代供養・護持会・駐車場の現地確認&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;所在地と地域の沿革&#34;,&#34;body&#34;:&#34;天龍院は磐田市北部の上野部にある曹洞宗寺院で、曹洞宗公式の寺院検索サイト「曹洞禅ナビ」に登録されています。上野部は旧豊田郡豊岡村の大字で、磐田市公式ウェブサイトの「旧豊岡村の住所表示」によれば、2005年（平成17年）の合併により磐田市の住所表示となりました。地域紹介ページ「上野部」（Wikipedia）でも、上野部の寺院として妙満寺（日蓮宗）とともに天龍院（曹洞宗）が挙げられています。天竜浜名湖鉄道上野部駅から約810mと案内されています。山号・本尊・創建年代など寺史の詳細は、今回確認できた公開Web資料には記載がありませんでした。&#34;},{&#34;heading&#34;:&#34;二俣城主松井氏と創建&#34;,&#34;body&#34;:&#34;大正10年（1921年）刊行の『静岡県磐田郡誌』には、「天龍院（野部村）」として「野部村上野部字神田に在り。神谷山と号す」とあり、永正11年（1514年）に松井左衛門尉信薫が城東郡平川村から二俣城に移った経緯に続けて、享禄元年（1528年）8月に一寺が創立され、永源寺第3世の一貞和尚が開山に請じられたと記されています。一貞は松井宗信の参禅の師であったためとされます。享禄2年（1529年）2月26日に信薫が没して当寺に葬られ、弘治2年（1556年）に一貞が示寂した後は弟子の貞超が住持しました。宗信は今川氏に従って永禄3年（1560年）5月19日に尾張の桶狭間で戦死し、その首が当寺に葬られたと記されています。同郡誌はその後、武田勝頼の攻撃により二俣城が落城して寺も困弊したとし、慶長8年（1603年）9月15日に徳川家康から朱印高9石を賜ったと記しています。&#34;},{&#34;heading&#34;:&#34;江戸時代の寺格と末寺&#34;,&#34;body&#34;:&#34;『静岡県磐田郡誌』が引く『遠江国風土記伝』には「上野部 天龍院 朱符之寺田高九石。末寺四宇。曹洞宗佐野郡各和村永源寺末。太年派。開基松井氏宗信之墓所。碑石存」とあり、江戸時代には朱印高9石・末寺4宇を有する永源寺末の寺院で、開基松井宗信の墓所の碑石が残ると記録されています。太田亮『遠江』（磯部甲陽堂、1927年）にも上野部村の曹洞宗寺院として9石の朱印高と松井氏の開基が記されています。末寺としては、同郡誌に、上野部字本村の保安寺（天龍山。永禄12年〔1569年〕2月、天龍院第2世貞超が村民の希望により創建）、田原村西島の金海寺（広福山。天文11年〔1542年〕の草創で天龍院第2世を開山に請じたと伝える）が天龍院の末と記されています。&#34;},{&#34;heading&#34;:&#34;文化財資料からの補足&#34;,&#34;body&#34;:&#34;天龍院は、桶狭間の合戦で討死した二俣城主・松井宗信の首塚と供養塔（室町時代）を所有しています。戦国時代を語る史跡として、平成17年（2005年）11月21日に磐田市指定史跡となりました。&#34;}],&#34;founded_period&#34;:&#34;享禄元年（1528年）8月&#34;,&#34;cultural_assets&#34;:[{&#34;name&#34;:&#34;松井氏首塚と供養塔&#34;,&#34;designation&#34;:&#34;磐田市指定文化財（史跡）&#34;,&#34;summary&#34;:&#34;室町時代の史跡で、天龍院が所有します。桶狭間の戦いで戦死した二俣城主・松井宗信の首を葬ったと伝わる塚と供養塔です。&#34;}],&#34;pilgrimage_note&#34;:&#34;磐田郡三十三観音霊場第15番札所&#34;,&#34;danka_info&#34;:{&#34;organization&#34;:&#34;曹洞宗公式寺院ポータル「曹洞禅ナビ」の天龍院ページに「梅花講」のアイコンが表示されており、梅花講（法要儀式で用いる詠讃歌の講）を有するとみられる。&#34;}},{&#34;temple_id&#34;:&#34;iwata-0113&#34;,&#34;slug&#34;:&#34;ichiunsai-shimonobe&#34;,&#34;name&#34;:&#34;一雲斉&#34;,&#34;name_kana&#34;:&#34;いちうんさい&#34;,&#34;aliases&#34;:[&#34;万世山一雲斎&#34;,&#34;萬世山一雲齋&#34;,&#34;一雲斎&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市下野部1776番地&#34;,&#34;district_id&#34;:&#34;toyooka&#34;,&#34;area&#34;:&#34;豊岡&#34;,&#34;main_deity&#34;:&#34;釈迦牟尼仏（『静岡県磐田郡誌』は地蔵菩薩と記載）&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;一雲斎（一雲斉）は磐田市下野部にある曹洞宗の寺院で、山号は万世山です。大正10年（1921年）刊行の『静岡県磐田郡誌』には、応永25年（1418年）に真巌和尚が開創し、大洞院（周智郡森町）2世の如仲和尚を請じて開山としたと記され、江戸時代には朱印高15石を有し、上野部・合代島・横川などに末寺を擁する本寺格の寺院でした。遠州（遠江）四十九薬師霊場の第31番札所で、札所本尊として薬師如来を祀ります。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9386&#34;},{&#34;title&#34;:&#34;遠州四十九薬師霊場 札所一覧（鎌田山医王寺 公式サイト）&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;霊場札所一覧の本文で「第31番 万世山 一雲斎 曹洞宗 釈迦牟尼仏」の行を確認。山号・宗派・本尊・札所番号の根拠。&#34;,&#34;url&#34;:&#34;https://www.iouji.net/visit/46ban/&#34;},{&#34;title&#34;:&#34;旧豊岡村の住所表示｜磐田市公式ウェブサイト&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;下野部が旧豊岡村の大字であることを確認。&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/kurashi_tetsuzuki/koseki_juuminhyou_inkan/1001311/1001315.html&#34;},{&#34;title&#34;:&#34;磐田市下野部大楽地を訪ねる①―「一雲斎」（自然と歴史の中を歩く！）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;検索結果上で門柱「萬世山一雲齋」の刻字と一雲済川に関する記述を確認したが、ページ本文の直接取得は403エラーで不可。補助的情報として扱い、要再確認。&#34;,&#34;url&#34;:&#34;https://arukunodaisuki.hamazo.tv/e9389488.html&#34;},{&#34;title&#34;:&#34;『静岡県磐田郡誌』静岡県磐田郡教育会編（大正10年・1921年）第13章 神社及宗教 曹洞宗寺院の項（188 法音庵・189 一雲斎・190 大養寺・191 東林庵）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション（インターネット公開）。466コマ目の本文画像で由緒・古文書・風土記伝引用の全文を確認。薬王寺・保安寺は465コマ目、江月庵は467コマ目。&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680/1/466&#34;},{&#34;title&#34;:&#34;太田亮『遠江』磯部甲陽堂（昭和2年・1927年）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;NDLラボ次世代デジタルライブラリーの全文検索スニペットで「一雲齊（下野部村）曹洞宗十五石」の記述を確認。&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/1176478&#34;},{&#34;title&#34;:&#34;曹洞禅ナビ 寺院検索「一雲斎」&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;住所（磐田市下野部1776）・フリガナ（イチウンサイ）を照合し当該寺院と確認。宗派公式の登録表記は「一雲斎」（斎の字）。掲載は基本情報のみで、由緒・本尊・行事欄は空欄&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_221226.html&#34;}],&#34;research_todos&#34;:[&#34;「室町時代後期に三河出身の僧により開創」とする参拝記録サイトの記述を『磐田市誌』『豊岡村誌』等の郷土資料で裏取りする&#34;,&#34;門前石柱の刻字（旧字体「萬世山一雲齋」とされる）を現地確認する&#34;,&#34;寺の north を流れる一級河川「一雲済川」の名称と寺号の関係を郷土資料で調査する&#34;,&#34;「斎」「斉」「齋」の表記ゆれの正式名称（宗教法人名）を確認する&#34;,&#34;薬師堂・薬師如来像の由来と安置状況を現地確認する&#34;,&#34;郡誌の本尊（地蔵菩薩）と現行霊場一覧の本尊（釈迦牟尼仏）の相違を寺院側資料で確認する&#34;,&#34;天正7年の掟書の発給者（武田氏か徳川氏か）を『磐田市誌』等で確認する&#34;,&#34;郡誌記載の小字「といか谷口」の現地名（大楽地との関係）を確認する&#34;,&#34;曹洞禅ナビの由緒・本尊欄が空欄のため、釈迦牟尼仏本尊等の既存情報は他資料での裏付けを継続する&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;山号・本尊と薬師霊場の札所&#34;,&#34;body&#34;:&#34;一雲斎は磐田市北部の下野部にある曹洞宗寺院で、山号を万世山と称します。遠州四十九薬師霊場第46番札所・医王寺（掛川市）の公式サイトに掲載された札所一覧では、「第31番 万世山 一雲斎 曹洞宗 釈迦牟尼仏」と記載されており、同霊場の第31番札所であることが確認できます。札所として薬師如来を祀り、下野部は磐田市公式ウェブサイトによれば旧豊岡村の大字で、2005年（平成17年）の合併で磐田市の住所表示となりました。開創の時期や開山については、民間の参拝記録サイトに室町時代後期の開創とする記述が見られますが、本文を直接確認できる一次資料が見つかっていないため、今後の調査課題です。&#34;},{&#34;heading&#34;:&#34;応永の開創と真巌派&#34;,&#34;body&#34;:&#34;大正10年（1921年）刊行の『静岡県磐田郡誌』には、「一雲斎（野部村）」として「野部村下野部字といか谷口に在り。万世山と号す。周智郡可睡斎の末寺にして、本尊は地蔵菩薩なり。応永25年、真巌和尚の開創に係り、大洞院2世如仲和尚を請じて開山となす」と記されています。同郡誌が引く『遠江国風土記伝』には「一雲斎（曹洞宗）在下野部。朱符田高十五石。開山如仲禅師之法嗣真巌和尚」とあり、続いて第3世の川僧慧済（三河国出身）が真巌和尚に謁して席を継ぎ、能登国総持寺に住した後に一雲斎へ帰り、文明7年（1475年）7月9日に示寂した（語録3巻あり）、「真巌派」がここに起こったと記されています。太田亮『遠江』（1927年）にも下野部村の曹洞宗寺院として朱印高15石が記されており、中世に始まり近世を通じて格式を保った寺院であったことが分かります。なお本尊について、郡誌は地蔵菩薩と記す一方、現行の遠州四十九薬師霊場の札所一覧（医王寺公式サイト）は釈迦牟尼仏とし、記載が分かれています。&#34;},{&#34;heading&#34;:&#34;末寺群と古文書&#34;,&#34;body&#34;:&#34;『静岡県磐田郡誌』によれば、一雲斎は周辺に複数の末寺を擁していました。上野部の法音庵（鳳雄山、文明4年〔1472年〕7月）、薬王寺（東方山、文明5年〔1473年〕2月15日）、合代島の東林庵（林光山、文明6年〔1474年〕3月9日）はいずれも第3世川僧和尚の分派開創と記され、下野部の大養寺（龍寿山）は寛永年間に一雲斎第6世宗山を開山とし、光明村横川の江月庵（松風山）も一雲斎末とされています。また同郡誌の古文書欄には、「一雲斎竹木不可伐採之事」として境内竹木の伐採を堅く禁じる天正7年（1579年）8月16日付の掟書が収録されており、戦国末期に寺領の保護を受けていたことがうかがえます。&#34;},{&#34;heading&#34;:&#34;寺名と一雲済川&#34;,&#34;body&#34;:&#34;寺の近くを流れる天竜川支流は一級河川「一雲済川」と表記され、寺の少し上流に「一級河川 一雲済川 起点」の標識が立てられています。寺号の「斎（齋）」と河川名の「済」で表記が分かれていることが、現地を踏査した地域ブログ「自然と歴史の中を歩く！」（2022年3月）で報告されています。寺号は「一雲斉」「一雲斎」の両表記が用いられます。&#34;}],&#34;pilgrimage_note&#34;:&#34;遠州（遠江）四十九薬師霊場第31番札所。札所本尊は薬師如来。&#34;,&#34;founded_period&#34;:&#34;応永25年（1418年）&#34;,&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0114&#34;,&#34;slug&#34;:&#34;saikoji-matsunokijima&#34;,&#34;name&#34;:&#34;最廣寺&#34;,&#34;name_kana&#34;:&#34;さいこうじ&#34;,&#34;aliases&#34;:[&#34;東渓山最広寺&#34;,&#34;最広寺&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市松之木島314番地の1&#34;,&#34;district_id&#34;:&#34;toyooka&#34;,&#34;area&#34;:&#34;豊岡&#34;,&#34;main_deity&#34;:&#34;地蔵菩薩（『静岡県磐田郡誌』による）&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;最廣寺（最広寺、さいこうじ）は磐田市松之木島にある曹洞宗の寺院で、山号は東渓山です。大正10年（1921年）刊行の『静岡県磐田郡誌』には、広瀬村松之木島字上川原に所在し、浜名郡龍池村高薗（現浜松市高薗）の学園寺（旧名覚音寺）の末寺、本尊は地蔵菩薩で、文禄元年（1592年）に満室銀重和尚が開創したと記されています。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9388&#34;},{&#34;title&#34;:&#34;最廣寺 - 曹洞禅ナビ（曹洞宗公式寺院ポータルサイト）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;寺院名（さいこうじ）・住所（磐田市松之木島314-1）・曹洞宗所属を確認。歴史等の詳細記述はページ上になし。&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_221230.html&#34;},{&#34;title&#34;:&#34;旧豊岡村の住所表示｜磐田市公式ウェブサイト&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;松之木島が旧豊岡村の大字であることを確認。&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/kurashi_tetsuzuki/koseki_juuminhyou_inkan/1001311/1001315.html&#34;},{&#34;title&#34;:&#34;『静岡県磐田郡誌』静岡県磐田郡教育会編（大正10年・1921年）第13章 神社及宗教 曹洞宗寺院の項（159 最広寺）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション（インターネット公開）。462コマ目の本文画像で由緒全文を確認。松ノ木島学校の記述は294コマ目。&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680/1/462&#34;},{&#34;title&#34;:&#34;Wikipedia「高薗」（浜松市）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;本寺にあたる曹洞宗学園寺（常照山）が浜松市高薗に現存することの確認に使用。&#34;,&#34;url&#34;:&#34;https://ja.wikipedia.org/wiki/%E9%AB%98%E8%96%97&#34;}],&#34;research_todos&#34;:[&#34;山号・本尊・創建年代を寺院への現地確認または『磐田市誌』『豊岡村誌』で調査する&#34;,&#34;本寺（本末関係）と開山・開基の伝承を調査する&#34;,&#34;寺号の表記（「最廣寺」と新字体「最広寺」）の正式名称を確認する&#34;,&#34;境内の堂宇・石造物の有無を現地確認する&#34;,&#34;郡誌の教育の章は松ノ木島学校の設置場所を「西広寺内」と記すが、寺院一覧の松之木島には最広寺のみが載るため、同一寺院か否か（表記の異同）を『豊岡村史』等で確認する&#34;,&#34;本寺・学園寺（浜松市高薗）側の資料で本末関係を確認する&#34;,&#34;曹洞禅ナビの由緒・本尊欄が空欄のため、豊岡村誌等の地域資料で由緒を調査する&#34;,&#34;最廣寺の公式ホームページ・SNSアカウントの実在確認&#34;,&#34;年中行事・墓地永代供養・護持会・駐車場の現地確認&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;所在地と地域の沿革&#34;,&#34;body&#34;:&#34;最広寺は磐田市北部の松之木島にあり、曹洞宗公式の寺院検索サイト「曹洞禅ナビ」に「最廣寺（さいこうじ）」（松之木島314-1）として登録されています。松之木島は江戸時代の豊田郡松之木島村（松ノ木島村）で、明治22年（1889年）に広瀬村の大字となり、昭和30年（1955年）に豊岡村、2005年（平成17年）の合併により磐田市の住所表示となりました。『静岡県磐田郡誌』の教育の章には、明治17年（1884年）8月に野部学校の分校「松ノ木島学校」が同村の寺院内に創設されたと記されています。&#34;},{&#34;heading&#34;:&#34;『静岡県磐田郡誌』にみえる由緒&#34;,&#34;body&#34;:&#34;大正10年（1921年）刊行の『静岡県磐田郡誌』の曹洞宗寺院の項には、「最広寺（広瀬村）」として「広瀬村松之木島字上川原に在り。東渓山と号す。浜名郡龍池村高薗学園寺（旧名覚音寺）の末にして、本尊は地蔵菩薩なり。文禄元年、満室銀重和尚の開創なり」と記されています。本寺の学園寺は現在の浜松市高薗にある曹洞宗寺院（山号常照山）で、最広寺が天竜川を挟んだ浜名郡側の法系に連なっていたことがうかがえます。&#34;}],&#34;founded_period&#34;:&#34;文禄元年（1592年）&#34;,&#34;cultural_assets&#34;:[],&#34;danka_info&#34;:{}},{&#34;temple_id&#34;:&#34;iwata-0115&#34;,&#34;slug&#34;:&#34;myofukuji-fukude&#34;,&#34;name&#34;:&#34;妙福寺&#34;,&#34;name_kana&#34;:&#34;みょうふくじ&#34;,&#34;aliases&#34;:[],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;日蓮宗&#34;,&#34;address&#34;:&#34;静岡県磐田市福田1723番地&#34;,&#34;district_id&#34;:&#34;fukude&#34;,&#34;area&#34;:&#34;福田&#34;,&#34;main_deity&#34;:&#34;未確認&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;妙福寺は磐田市福田1723番地にある日蓮宗の寺院です。日蓮宗公式ポータルサイトの磐田市寺院一覧に掲載されており、旧福田町域の福田地区に位置します。大正10年（1921年）刊行の『静岡県磐田郡誌』の日蓮宗寺院一覧には当寺の名は見えず、創建年代や山号を伝える公開資料は現時点では確認できていません。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9390&#34;},{&#34;title&#34;:&#34;磐田市｜日蓮宗全寺院マップ（日蓮宗ポータルサイト）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;磐田市の日蓮宗寺院一覧に「妙福寺 〒437-1203 静岡県磐田市福田1723」と掲載されていることを本文で確認。&#34;,&#34;url&#34;:&#34;https://www.nichiren.or.jp/temple/map/tokai/shizuoka/iwata-shi/&#34;},{&#34;title&#34;:&#34;静岡県磐田市の寺院一覧｜いいお墓&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;「妙福寺 日蓮宗 静岡県磐田市福田1723」の掲載を本文で確認。宗派公式情報と一致。&#34;,&#34;url&#34;:&#34;https://www.e-ohaka.com/temple_list/id22211.html&#34;},{&#34;title&#34;:&#34;『静岡県磐田郡誌』静岡県磐田郡教育会編（大正10年・1921年）日蓮宗寺院一覧表&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;422・471コマ目。当時の磐田郡の日蓮宗寺院一覧に妙福寺（福田）の記載がないことを確認（負の証拠）。NDLラボ次世代デジタルライブラリー全文検索でも「妙福寺 磐田郡」「妙福寺 福田村 遠江」はヒットなし。&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680/1/422&#34;}],&#34;research_todos&#34;:[&#34;山号・本尊・創建年代を寺院への現地確認または『福田町史』等の郷土資料で調査する&#34;,&#34;Yahoo!ニュース エキスパート記事（磐田市福田の妙福寺紹介、現在リンク切れ）にあったとされる「昭和初期に福田のしらす漁業関係者が安全祈願に参拝」「2014年に現住職が本堂を整備」等の内容を別資料で裏取りする&#34;,&#34;福田漁港・しらす漁業と寺院の関わりを郷土資料で調査する&#34;,&#34;『福田町史』『磐田市誌』で創建年代・沿革を確認する&#34;,&#34;日蓮宗静岡県中部宗務所の資料で山号・本尊を確認する&#34;,&#34;福田港の漁業関係者との関わりを伝える地域記事（第1弾で存在が示唆）を再探索する&#34;,&#34;日蓮宗公式の全寺院マップには寺名・住所のみで由緒欄がない。山号・沿革は磐田市史・寺院資料での調査が必要&#34;,&#34;同名の妙福寺公式サイト（www.myofukuji.or.jp）は横浜市の寺院であり、磐田市福田の妙福寺とは別寺院（混同注意）&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;所在地と宗派&#34;,&#34;body&#34;:&#34;妙福寺は磐田市南部の福田地区にある日蓮宗寺院です。日蓮宗公式ポータルサイトの全寺院マップ（磐田市）に「妙福寺 〒437-1203 静岡県磐田市福田1723」として掲載されており、日蓮宗所属であることが宗派公式情報で確認できます。妙福寺という寺号の寺院は全国に多数あり、京都・東京・千葉・愛知などの同名寺院とは別の寺院です。地域ニュース記事で漁業関係者の参拝に触れた紹介があったことが検索結果から示唆されますが、記事本文が現在確認できないため、寺史の詳細は今後の調査課題です。&#34;},{&#34;heading&#34;:&#34;郷土資料における記録&#34;,&#34;body&#34;:&#34;大正10年（1921年）刊行の『静岡県磐田郡誌』は当時の磐田郡内の寺院を宗派別一覧と由緒で収録していますが、その日蓮宗寺院一覧（妙日寺・玄妙寺・本性寺・妙満寺・妙雲寺・長石寺など）に福田の妙福寺の名は見えません。国立国会図書館デジタルコレクションの全文検索でも、磐田郡・遠江の郷土資料から当寺に関する記述は確認できておらず、山号・本尊・創建年代など寺史の詳細を伝える公開資料は現時点では確認できていません。&#34;}],&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0116&#34;,&#34;slug&#34;:&#34;chikyoin-shiraha&#34;,&#34;name&#34;:&#34;智教院&#34;,&#34;name_kana&#34;:&#34;ちきょういん&#34;,&#34;aliases&#34;:[],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;日蓮宗&#34;,&#34;address&#34;:&#34;静岡県磐田市白羽546番地&#34;,&#34;district_id&#34;:&#34;ryuyo&#34;,&#34;area&#34;:&#34;竜洋&#34;,&#34;main_deity&#34;:&#34;未確認&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;智教院は磐田市白羽546番地にある日蓮宗の寺院です。日蓮宗公式ポータルサイトの磐田市寺院一覧に掲載されており、旧竜洋町域の白羽地区に位置します。大正10年（1921年）刊行の『静岡県磐田郡誌』の日蓮宗寺院一覧には当寺の名は見えず、創建年代や山号を伝える公開資料は現時点では確認できていません。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9392&#34;},{&#34;title&#34;:&#34;磐田市｜日蓮宗全寺院マップ（日蓮宗ポータルサイト）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;磐田市の日蓮宗寺院一覧に「智教院 〒438-0235 静岡県磐田市白羽546」と掲載されていることを本文で確認。&#34;,&#34;url&#34;:&#34;https://www.nichiren.or.jp/temple/map/tokai/shizuoka/iwata-shi/&#34;},{&#34;title&#34;:&#34;智教院｜お寺メイト（Temple Mate）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;日蓮宗・磐田市白羽546の所在と宗教法人としての法人番号（2080405005527）を本文で確認。寺史の記載はなし。&#34;,&#34;url&#34;:&#34;http://www.bukkyou.com/TSInfo/T_22/Info2755000504082.html&#34;},{&#34;title&#34;:&#34;『静岡県磐田郡誌』静岡県磐田郡教育会編（大正10年・1921年）日蓮宗寺院一覧表・掛塚町白羽の寺院の項&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;422・471コマ目（日蓮宗一覧）および457コマ目（白羽の龍泉寺・幽雲寺等）。当時の磐田郡の日蓮宗寺院一覧に智教院（白羽）の記載がないことを確認（負の証拠）。NDLラボ次世代デジタルライブラリー全文検索でも「智教院 白羽」「智敎院 磐田郡」はヒットなし。&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680/1/422&#34;}],&#34;research_todos&#34;:[&#34;山号・本尊・創建年代を寺院への現地確認または『竜洋町史』等の郷土資料で調査する&#34;,&#34;白羽神社など白羽地区の他の社寺との歴史的関係を調査する&#34;,&#34;本寺（本末関係）と開山の伝承を調査する&#34;,&#34;『竜洋町史』『磐田市誌』で創建年代・沿革を確認する&#34;,&#34;日蓮宗静岡県中部宗務所の資料で山号・本尊を確認する&#34;,&#34;日蓮宗公式の全寺院マップには寺名・住所のみで由緒欄がない。山号・沿革は磐田市史・寺院資料での調査が必要&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;所在地と宗派&#34;,&#34;body&#34;:&#34;智教院は磐田市南部の白羽にある日蓮宗寺院です。日蓮宗公式ポータルサイトの全寺院マップ（磐田市）に「智教院 〒438-0235 静岡県磐田市白羽546」として掲載されており、日蓮宗所属であることが宗派公式情報で確認できます。民間の寺院情報サイトによれば、智教院という院号の寺院は全国に3か所あるとされます。山号・本尊・創建年代など寺史の詳細は、今回確認できた公開Web資料には記載がありませんでした。&#34;},{&#34;heading&#34;:&#34;郷土資料における記録&#34;,&#34;body&#34;:&#34;大正10年（1921年）刊行の『静岡県磐田郡誌』は当時の磐田郡内の寺院を宗派別一覧と由緒で収録しており、白羽地区の寺院としては臨済宗方広寺派の龍泉寺（白羽字勝又）や曹洞宗系の寺院が記されていますが、日蓮宗寺院一覧に白羽の智教院の名は見えません。国立国会図書館デジタルコレクションの全文検索でも当寺に関する記述は確認できておらず、山号・本尊・創建年代など寺史の詳細を伝える公開資料は現時点では確認できていません。&#34;}],&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0117&#34;,&#34;slug&#34;:&#34;myomanji-kaminobe&#34;,&#34;name&#34;:&#34;妙満寺&#34;,&#34;name_kana&#34;:&#34;みょうまんじ&#34;,&#34;aliases&#34;:[],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;日蓮宗&#34;,&#34;address&#34;:&#34;静岡県磐田市上野部738番地&#34;,&#34;district_id&#34;:&#34;toyooka&#34;,&#34;area&#34;:&#34;豊岡&#34;,&#34;main_deity&#34;:&#34;未確認&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;妙満寺は磐田市上野部738番地にある日蓮宗の寺院です。大正10年（1921年）刊行の『静岡県磐田郡誌』には、野部村上野部字栗下に所在し、浜名郡和田村橋羽（現浜松市）の妙恩寺の末寺で、妙恩寺第13世日閑の草創と伝えると記されています。京都市の顕本法華宗総本山妙満寺など全国の同名寺院とは別の寺院です。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9394&#34;},{&#34;title&#34;:&#34;磐田市｜日蓮宗全寺院マップ（日蓮宗ポータルサイト）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;磐田市の日蓮宗寺院一覧に「妙満寺 〒438-0111 静岡県磐田市上野部738」と掲載されていることを本文で確認。&#34;,&#34;url&#34;:&#34;https://www.nichiren.or.jp/temple/map/tokai/shizuoka/iwata-shi/&#34;},{&#34;title&#34;:&#34;上野部 - Wikipedia&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;上野部地区の寺院として妙満寺（日蓮宗）が記載されていることを本文で確認。&#34;,&#34;url&#34;:&#34;https://ja.wikipedia.org/wiki/%E4%B8%8A%E9%87%8E%E9%83%A8&#34;},{&#34;title&#34;:&#34;旧豊岡村の住所表示｜磐田市公式ウェブサイト&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;上野部が旧豊岡村の大字であることを確認。&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/kurashi_tetsuzuki/koseki_juuminhyou_inkan/1001311/1001315.html&#34;},{&#34;title&#34;:&#34;磐田市の寺院一覧｜ホームメイト神社・寺院検索&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;「天竜浜名湖鉄道上野部駅から妙満寺まで徒歩3分」の掲載を本文で確認。&#34;,&#34;url&#34;:&#34;https://www.homemate-research-religious-building.com/bc175/22211/&#34;},{&#34;title&#34;:&#34;『静岡県磐田郡誌』静岡県磐田郡教育会編（大正10年・1921年）第13章 神社及宗教 日蓮宗寺院の項（4 妙満寺）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション（インターネット公開）。471コマ目の本文画像で由緒全文を確認（拡大画像で「寶永十七年」の表記も確認）。&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680/1/471&#34;}],&#34;research_todos&#34;:[&#34;山号・創建年代・開山を寺院への現地確認または『磐田市誌』『豊岡村誌』で調査する&#34;,&#34;同じ上野部の天龍院（曹洞宗）との地区内での位置関係・歴史的関係を調査する&#34;,&#34;境内の堂宇・題目塔等の石造物を現地確認する&#34;,&#34;郡誌刊本の草創年代「宝永十七年」の原拠（応永・寛永等の誤植の可能性）を『磐田市誌』や妙恩寺側の資料で確認する&#34;,&#34;本尊・山号を寺院側資料で確認する&#34;,&#34;日蓮宗公式の全寺院マップには寺名・住所のみで由緒欄がない。山号・沿革は磐田市史・寺院資料での調査が必要&#34;,&#34;顕本法華宗総本山の京都妙満寺（什門三本山の1つ）とは別寺院（混同注意）&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;所在地と宗派&#34;,&#34;body&#34;:&#34;妙満寺は磐田市北部の上野部にある日蓮宗寺院です。日蓮宗公式ポータルサイトの全寺院マップ（磐田市）に「妙満寺 〒438-0111 静岡県磐田市上野部738」として掲載されており、日蓮宗所属であることが宗派公式情報で確認できます。地域紹介ページ「上野部」（Wikipedia）でも、上野部の寺院として天龍院（曹洞宗）とともに妙満寺（日蓮宗）が挙げられています。上野部は磐田市公式ウェブサイトによれば旧豊岡村の大字で、2005年（平成17年）の合併で磐田市の住所表示となりました。民間の寺院情報サイトでは天竜浜名湖鉄道上野部駅から徒歩3分と案内されています。なお、妙満寺という寺号は京都市の顕本法華宗総本山妙満寺をはじめ全国に複数あり、いずれとも別の寺院です。&#34;},{&#34;heading&#34;:&#34;『静岡県磐田郡誌』にみえる由緒&#34;,&#34;body&#34;:&#34;大正10年（1921年）刊行の『静岡県磐田郡誌』の日蓮宗寺院の項には、「妙満寺（野部村）」として「野部村上野部字栗下に在り。浜名郡和田村橋羽妙恩寺末にして」本尊を安置し、「妙恩寺第13世日閑の草創なりといふ」と記されています。本寺の妙恩寺は現在の浜松市にある日蓮宗寺院で、妙満寺が浜松側の日蓮宗法系に連なっていたことが分かります。なお草創年代について同郡誌の刊本は「宝永十七年」と記しますが、宝永は8年（1711年）までしかなく、この年代表記には疑義があります（誤植の可能性）。&#34;},{&#34;heading&#34;:&#34;所在地と地域の沿革&#34;,&#34;body&#34;:&#34;妙満寺は磐田市北部の上野部にある日蓮宗寺院です。日蓮宗公式ポータルサイトの全寺院マップ（磐田市）に「妙満寺 〒438-0111 静岡県磐田市上野部738」として掲載されており、日蓮宗所属であることが宗派公式情報で確認できます。地域紹介ページ「上野部」（Wikipedia）でも、上野部の寺院として天龍院（曹洞宗）とともに妙満寺（日蓮宗）が挙げられています。上野部は江戸時代の豊田郡上野部村で、明治22年（1889年）に野部村の大字となり、昭和30年（1955年）に豊岡村、2005年（平成17年）の合併で磐田市の住所表示となりました。民間の寺院情報サイトでは天竜浜名湖鉄道上野部駅から徒歩3分と案内されています。なお、妙満寺という寺号は京都市の顕本法華宗総本山妙満寺をはじめ全国に複数あり、いずれとも別の寺院です。&#34;}],&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0118&#34;,&#34;slug&#34;:&#34;honmyoin-iwai&#34;,&#34;name&#34;:&#34;本妙院&#34;,&#34;name_kana&#34;:&#34;ほんみょういん&#34;,&#34;aliases&#34;:[],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;単立&#34;,&#34;address&#34;:&#34;静岡県磐田市岩井2081番地の1&#34;,&#34;district_id&#34;:&#34;koyo&#34;,&#34;area&#34;:&#34;向陽&#34;,&#34;main_deity&#34;:&#34;未確認&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;基礎情報のみ&#34;,&#34;history_summary&#34;:&#34;静岡県知事所轄宗教法人名簿に掲載されている基礎情報をもとに初期登録しています。創建、沿革、ご本尊、現地確認情報は今後追記します。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9412&#34;}],&#34;research_todos&#34;:[&#34;静岡県の宗教法人名簿・国税庁法人番号公表サイトで宗教法人「本妙院」（磐田市岩井2081-1）の登録情報を確認する&#34;,&#34;単立寺院とされる経緯（元の所属宗派の有無）を調査する&#34;,&#34;『磐田市誌』や向陽地区の郷土資料で岩井の寺院の記載を確認する&#34;,&#34;現地確認で山門・本堂・掲示等から寺号・宗旨を確認する&#34;,&#34;東京都大田区の本妙院（日蓮宗）など全国の同名寺院と混同しないよう注意する&#34;]}]" data-districts="[{&#34;district_id&#34;:&#34;mitsuke&#34;,&#34;name&#34;:&#34;見付&#34;,&#34;slug&#34;:&#34;mitsuke&#34;,&#34;summary&#34;:&#34;遠江国府や東海道見付宿の記憶を受け継ぐ、磐田の政治・文化の中心地。&#34;},{&#34;district_id&#34;:&#34;nakaizumi&#34;,&#34;name&#34;:&#34;中泉&#34;,&#34;slug&#34;:&#34;nakaizumi&#34;,&#34;summary&#34;:&#34;国分寺・国分尼寺、中泉御殿、鉄道開通後の玄関口としての歴史を持つ地区。&#34;},{&#34;district_id&#34;:&#34;mikuriya&#34;,&#34;name&#34;:&#34;御厨&#34;,&#34;slug&#34;:&#34;mikuriya&#34;,&#34;summary&#34;:&#34;鎌田御厨や御厨古墳群など、磐田原台地東縁の古代史を伝える地区。&#34;},{&#34;district_id&#34;:&#34;toyoda&#34;,&#34;name&#34;:&#34;豊田&#34;,&#34;slug&#34;:&#34;toyoda&#34;,&#34;summary&#34;:&#34;天竜川左岸と池田の渡し、熊野御前ゆかりの行興寺などの記憶が残る地区。&#34;},{&#34;district_id&#34;:&#34;nanbu&#34;,&#34;name&#34;:&#34;南部&#34;,&#34;slug&#34;:&#34;nanbu&#34;,&#34;summary&#34;:&#34;天竜川と原野谷川に挟まれ、旧村ごとの歴史と治水の記憶を持つ地区。&#34;},{&#34;district_id&#34;:&#34;koyo&#34;,&#34;name&#34;:&#34;向陽&#34;,&#34;slug&#34;:&#34;koyo&#34;,&#34;summary&#34;:&#34;岩田・大藤・向笠など、磐田原台地の丘陵地に古代からの遺跡が残る地区。&#34;},{&#34;district_id&#34;:&#34;ryuyo&#34;,&#34;name&#34;:&#34;竜洋&#34;,&#34;slug&#34;:&#34;ryuyo&#34;,&#34;summary&#34;:&#34;天竜川と遠州灘に抱かれ、掛塚湊や掛塚まつりの記憶を伝える地区。&#34;},{&#34;district_id&#34;:&#34;fukude&#34;,&#34;name&#34;:&#34;福田&#34;,&#34;slug&#34;:&#34;fukude&#34;,&#34;summary&#34;:&#34;太田川河口の港町として開け、海辺の暮らしと織物産業の記憶を持つ地区。&#34;},{&#34;district_id&#34;:&#34;toyooka&#34;,&#34;name&#34;:&#34;豊岡&#34;,&#34;slug&#34;:&#34;toyooka&#34;,&#34;summary&#34;:&#34;磐田市北部の山間・丘陵に、古代から中世の記憶が残る地区。&#34;}]"> <form id="search-form" class="search-form"> <label>

<select name="status"> <option value="">すべて</option> <option value="existing">existing</option><option value="unknown">unknown</option> </select> </label> <button type="submit">検索</button> </form> <p id="result-count" class="result-count" aria-live="polite"></p> <div id="results" class="card-grid"></div> </section> <script>
    // @ts-nocheck
    const panel = document.querySelector("[data-temples]");
    const form = document.querySelector("#search-form");
    const results = document.querySelector("#results");
    const resultCount = document.querySelector("#result-count");

    if (!panel || !form || !results || !resultCount || !panel.dataset.temples || !panel.dataset.districts) {
      throw new Error("Search UI failed to initialize.");
    }

    const temples = JSON.parse(panel.dataset.temples);
    const districts = JSON.parse(panel.dataset.districts);
    const districtNames = new Map(districts.map((district) => [district.district_id, district.name]));

    function districtNameOf(temple) {
      return districtNames.get(temple.district_id) || "地区未確定";
    }

    function normalize(value) {
      return String(value || "").toLowerCase().normalize("NFKC").replace(/\s+/g, "");
    }

    function isUnknownValue(value) {
      return ["未確認", "調査中", "対象外"].includes(value);
    }

    function knownValue(value, fallback = "確認中") {
      return isUnknownValue(value) ? fallback : value;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function textOf(temple) {
      return normalize([
        temple.name,
        temple.name_kana,
        temple.aliases.join(" "),
        temple.address,
        temple.area,
        districtNameOf(temple),
        temple.sect,
        temple.status_label,
        temple.main_deity,
        temple.history_summary,
        temple.page_summary,
        temple.visit_notes,
        temple.detail_status,
        temple.sources.map((source) => source.title).join(" "),
      ].join(" "));
    }

    function readParams() {
      const params = new URLSearchParams(window.location.search);
      for (const element of form.elements) {
        if (element instanceof HTMLInputElement || element instanceof HTMLSelectElement) {
          if (element.name) element.value = params.get(element.name) || "";
        }
      }
    }

    function writeParams(values) {
      const params = new URLSearchParams();
      for (const [key, value] of Object.entries(values)) {
        if (typeof value === "string" && value) params.set(key, value);
      }
      const query = params.toString();
      history.replaceState(null, "", query ? `?${query}` : window.location.pathname);
    }

    function card(temple) {
      const kana = isUnknownValue(temple.name_kana) ? "" : `<p class="kana">${escapeHtml(temple.name_kana)}</p>`;
      const districtName = districtNameOf(temple);
      const detailPageAvailable = temple.detail_page !== false;
      const title = detailPageAvailable
        ? `<a href="/temples/${escapeHtml(temple.slug)}/">${escapeHtml(temple.name)}</a>`
        : escapeHtml(temple.name);
      const summary = temple.page_summary || `${districtName}地区に所在する${temple.sect}の寺院です。公式名簿の基礎情報をもとに掲載しています。`;
      const detailNotice = detailPageAvailable
        ? ""
        : `<p class="pending-text">個別ページは公開していません。検索記録として表示しています。</p>`;

      return `
        <article class="temple-card">
          <div class="card-topline">
            <span class="status status-${escapeHtml(temple.status)}">${escapeHtml(temple.status_label)}</span>
            <span>${escapeHtml(districtName)}</span>
          </div>
          <h3>${title}</h3>
          ${kana}
          <dl class="compact-list">
            <div><dt>住所</dt><dd>${escapeHtml(temple.address)}</dd></div>
            <div><dt>地区</dt><dd>${escapeHtml(districtName)}</dd></div>
            <div><dt>宗派</dt><dd>${escapeHtml(temple.sect)}</dd></div>
            <div><dt>ご本尊</dt><dd>${escapeHtml(knownValue(temple.main_deity))}</dd></div>
            <div><dt>創建・年代</dt><dd>${escapeHtml(knownValue(temple.founded_period, "調査中"))}</dd></div>
          </dl>
          <p>${escapeHtml(summary)}</p>` + detailNotice + `
        </article>
      `;
    }

    function render() {
      const values = Object.fromEntries(new FormData(form).entries());
      const keyword = normalize(values.q || "");
      const filtered = temples.filter((temple) => {
        if (keyword && !textOf(temple).includes(keyword)) return false;
        if (values.district && temple.district_id !== String(values.district)) return false;
        if (values.sect && temple.sect !== String(values.sect)) return false;
        if (values.status && temple.status !== String(values.status)) return false;
        return true;
      });

      writeParams(values);
      resultCount.textContent = `${filtered.length}件見つかりました`;
      results.innerHTML = filtered.length
        ? filtered.map(card).join("")
        : `<div class="empty">該当する寺院が見つかりませんでした。地区や宗派の条件を外して再検索してください。</div>`;
    }

    readParams();
    render();
    form.addEventListener("input", render);
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      render();
    });
