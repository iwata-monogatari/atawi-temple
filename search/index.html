御本尊薬師如来）を確認。東名393の大蔵寺（曹洞宗・別寺院）ではなく上岡田の大蔵寺であることを宗派・住所で確認。&#34;,&#34;url&#34;:&#34;https://nippon-reijo.jimdofree.com/%E6%8E%B2%E8%BC%89%E9%9C%8A%E5%A0%B4%E3%81%AE%E4%B8%80%E8%A6%A7/%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/%E8%B1%8A%E7%94%B0%E9%83%A1%E4%B8%89%E5%8D%81%E4%B8%89%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/&#34;},{&#34;title&#34;:&#34;臨黄ネット 寺院検索（静岡県磐田市・妙心寺派）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;一覧掲載のみ。公式検索では旧字体「大藏寺（だいぞうじ）」表記。住所「上岡田329」は台帳と一致。本尊・由緒・行事欄は空欄。&#34;,&#34;url&#34;:&#34;https://rinnou.net/search/?prefectures=%E9%9D%99%E5%B2%A1%E7%9C%8C&#38;address_1=%E7%A3%90%E7%94%B0%E5%B8%82&#38;shuha=%E5%A6%99%E5%BF%83%E5%AF%BA%E6%B4%BE&#34;}],&#34;research_todos&#34;:[&#34;山号・本尊・創建年代を寺院または『磐田市誌』で確認する&#34;,&#34;磐田市東名393番地に曹洞宗の同名寺院「大蔵寺」があるため、記事作成時に絶対に混同しないこと（上岡田329番地・臨済宗妙心寺派が本寺院）&#34;,&#34;旧上岡田村の郷土資料（日本歴史地名大系・磐田市誌）での言及の有無を図書館で調査する&#34;,&#34;読み（だいぞうじ）の確認（サーチ寺院では「大藏寺」の旧字表記）&#34;,&#34;旧磐田郡内の同名寺院（旧富岡村匂坂中の曹洞宗・福寿山大蔵寺、郡誌461コマ）との混同防止（本寺・宗派が異なる別寺院）&#34;,&#34;山号「医王山」と本尊阿弥陀如来の関係（薬師信仰の痕跡の有無）の確認&#34;,&#34;鈴木佐太郎の没年の確定（碑文は「享年50」と記す）&#34;],&#34;founded_period&#34;:&#34;建治3年（1277年）9月15日、南溟の創建（『静岡県磐田郡誌』による）&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;『静岡県磐田郡誌』にみる沿革&#34;,&#34;body&#34;:&#34;『静岡県磐田郡誌』（1921年）の由緒には、大蔵寺は天龍村上岡田字小倉に在り、妙心寺派で見付町見性寺の末葉、本尊は阿弥陀如来であることが記されています。創建は建治3年（1277年）9月15日の南溟によるもので、応安元年（1368年）12月12日に関宗が恢興しました。江戸時代に入ると、俊頴の代の慶長6年（1601年）2月14日に黒印寺領4石5斗を、宗根の代の慶安元年（1648年）10月24日に阿弥陀領として15石を賜っています。明和5年（1768年）2月4日には開山25世の法孫龍戒が分派し珪宝が再興しました。安政元年（1854年）11月4日の地震で堂宇が倒壊し、翌安政2年、関海住職の時に本堂・庫裡・鎮守堂・観音堂を仮設しています。同誌の一覧表では山号は医王山、1921年当時の境内地は632坪です。なお創建者と伝える南溟は、同誌で万正寺の萬勝寺（文永5年開創）の開創者としても記される僧です。&#34;,&#34;sources_note&#34;:&#34;『静岡県磐田郡誌』433コマ（由緒）・413コマ（臨済宗寺院一覧表）&#34;},{&#34;heading&#34;:&#34;教育者・鈴木佐太郎の墓所&#34;,&#34;body&#34;:&#34;『静岡県磐田郡誌』の人物の章には、上岡田に生まれた明治期の教育者・鈴木佐太郎（号は孤山）の碑文が収められています。碑文によれば、鈴木佐太郎は明治19年（1886年）に静岡師範学校を卒業して中泉小学校訓導となり、豊丘・於保・中泉・見付の各小学校で訓導・校長を歴任、磐田郡視学も務め、教えを受けた者は1万人余に及びました。大正2年（1913年）に退職後、磐田郡立高等女学校の教諭となりましたが、病により50歳で没し、葬儀には約500人が列なったと記されます。法名は「学堂光徳居士」で、大蔵寺に葬られました。碑は天龍尋常小学校の校庭に建てられ、碑文は静岡県立三保学院長・池田忠一の撰によります。&#34;,&#34;sources_note&#34;:&#34;『静岡県磐田郡誌』698〜699コマ（第二十一章人物）&#34;}],&#34;cultural_assets&#34;:[],&#34;pilgrimage_note&#34;:&#34;豊田郡三十三観音霊場第5番札所（享保年間開創の歴史的霊場・現在は活動していない）&#34;},{&#34;temple_id&#34;:&#34;iwata-0018&#34;,&#34;slug&#34;:&#34;tenshoji-toyoshima&#34;,&#34;name&#34;:&#34;天正寺&#34;,&#34;name_kana&#34;:&#34;てんしょうじ&#34;,&#34;aliases&#34;:[],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;unknown&#34;,&#34;status_label&#34;:&#34;現地痕跡未確認&#34;,&#34;detail_page&#34;:false,&#34;sect&#34;:&#34;臨済宗妙心寺派&#34;,&#34;address&#34;:&#34;静岡県磐田市豊島905番地&#34;,&#34;district_id&#34;:&#34;nanbu&#34;,&#34;area&#34;:&#34;南部&#34;,&#34;main_deity&#34;:&#34;薬師如来（『静岡県磐田郡誌』による）&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;天正寺は磐田市豊島にある臨済宗妙心寺派の寺院で、『静岡県磐田郡誌』（1921年）によれば見付の見性寺の末寺で、本尊は薬師如来です。同誌は天正元年（1573年）12月12日の黙宗による開創と記しており、寺号は開創年号の天正と重なります。慶長6年（1601年）には黒印高1石を賜りました。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9087&#34;},{&#34;title&#34;:&#34;『静岡県磐田郡誌』（静岡県磐田郡教育会編、1921年）434コマ・414コマ&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション。由緒（434コマ）に本尊薬師如来・天正元年黙宗開創・慶長6年黒印高1石・安政地震被災、一覧表（414コマ）に境内120坪&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680/1/434&#34;},{&#34;title&#34;:&#34;『日本歴史地名大系』上岡田村（遠江国豊田郡）の項（コトバンク）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;隣村として雲雀島村が現れ、天正寺旧所在地の位置関係を確認&#34;,&#34;url&#34;:&#34;https://kotobank.jp/word/上岡田村&#34;},{&#34;title&#34;:&#34;臨黄ネット 寺院検索（静岡県磐田市・妙心寺派）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;一覧掲載のみ。寺名「天正寺（てんしょうじ）」・住所「豊島905」を確認（台帳と一致）。本尊・由緒・行事欄は空欄。&#34;,&#34;url&#34;:&#34;https://rinnou.net/search/?prefectures=%E9%9D%99%E5%B2%A1%E7%9C%8C&#38;address_1=%E7%A3%90%E7%94%B0%E5%B8%82&#38;shuha=%E5%A6%99%E5%BF%83%E5%AF%BA%E6%B4%BE&#34;}],&#34;research_todos&#34;:[&#34;山号・本尊・創建年代を寺院または『磐田市誌』で確認する&#34;,&#34;寺号「天正寺」と年号天正（1573〜1592年）の関係の有無を郷土資料で調査する&#34;,&#34;同じ豊島地区の寳珠寺との位置関係・本末関係の有無を調査する&#34;,&#34;全国に同名寺院（大阪・富山・徳島など）が多いため、引用時は必ず磐田市豊島905番地・臨済宗妙心寺派であることを確認する&#34;,&#34;開創者黙宗について（郡誌は泉蔵寺開山を永正元年黙宗、多聞寺開山を天文22年黙宗分派とも記しており、同名僧の整理が必要）&#34;,&#34;山号の有無の確認（郡誌一覧表は空欄）&#34;,&#34;旧雲雀島村と豊島の合併経緯の確認&#34;],&#34;founded_period&#34;:&#34;天正元年（1573年）12月12日、黙宗の開創（『静岡県磐田郡誌』の由緒による。同誌の一覧表の創立欄は「不詳」）&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;『静岡県磐田郡誌』にみる由緒&#34;,&#34;body&#34;:&#34;『静岡県磐田郡誌』（1921年）の由緒には、天正寺は天龍村豊島（元雲雀島）字西浦に在り、妙心寺派で見付町見性寺の末寺、本尊は薬師如来であることが記されています。開創は天正元年（1573年）12月12日の黙宗によるもので、大節が中興しました。慶長6年（1601年）2月14日には黒印高1石を賜っています。なお『日本歴史地名大系』中野村の項には、同じ慶長6年2月に徳川氏の代官頭・伊奈忠次が隣接する中野の多聞寺へ寺領1石余を寄進する手形を発した記録があります。安政元年（1854年）11月4日の地震で堂宇が倒壊し、翌年11月に本堂・庫裡などを仮建築しました。所在地の「豊島、元雲雀島」という表記から、天正寺の地が豊島のうち旧雲雀島村域にあたることが分かります（『日本歴史地名大系』上岡田村の項にも「西は雲雀島村」と隣村として現れます）。同誌の一覧表では山号の記載がなく、1921年当時の境内地は120坪でした。&#34;,&#34;sources_note&#34;:&#34;『静岡県磐田郡誌』434コマ（由緒）・414コマ（臨済宗寺院一覧表）&#34;}],&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0019&#34;,&#34;slug&#34;:&#34;senjuji-senjudou&#34;,&#34;name&#34;:&#34;千手寺&#34;,&#34;name_kana&#34;:&#34;せんじゅじ&#34;,&#34;aliases&#34;:[&#34;慈眼山&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;unknown&#34;,&#34;status_label&#34;:&#34;現地痕跡未確認&#34;,&#34;detail_page&#34;:false,&#34;sect&#34;:&#34;臨済宗妙心寺派&#34;,&#34;address&#34;:&#34;静岡県磐田市千手堂637番地&#34;,&#34;district_id&#34;:&#34;nanbu&#34;,&#34;area&#34;:&#34;南部&#34;,&#34;main_deity&#34;:&#34;千手十一面観音&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;公開情報調査済み&#34;,&#34;history_summary&#34;:&#34;千手寺は磐田市千手堂にある臨済宗妙心寺派の寺院で、山号は慈眼山です。『日本歴史地名大系』によれば正元2年（1260年）の創建と伝え、もと真言宗で元禄元年（1688年）に臨済宗に転じたとされます。本尊の千手十一面観音は白拍子千手の前の持仏と伝えられ、地名「千手堂」とも深く関わります。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9089&#34;},{&#34;title&#34;:&#34;千手寺（せんじゆじ）とは？ コトバンク（日本歴史地名大系）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;山号慈眼山・臨済宗妙心寺派・本尊千手十一面観音・正元2年（1260年）創建・元禄元年（1688年）臨済宗転宗・本尊は白拍子千手前の持仏と伝えるが後世の結合らしいこと・千手前が当地で尼となり没した伝説を本文で確認。&#34;,&#34;url&#34;:&#34;https://kotobank.jp/word/%E5%8D%83%E6%89%8B%E5%AF%BA-3052265&#34;},{&#34;title&#34;:&#34;千手の前（傾城塚・千手前の墓）磐田市観光協会&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;千手の前が千手寺（磐田市千手堂）の千手観音に祈願して授かった子として名付けられたこと、重衡処刑後に尼となり野箱で菩提を弔ったこと、墓が傾城塚と呼ばれることを本文で確認。&#34;,&#34;url&#34;:&#34;https://kanko-iwata.jp/spot/tanoshimu-716/&#34;},{&#34;title&#34;:&#34;サーチ寺院 静岡県磐田市の寺院一覧&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;千手寺が臨済宗妙心寺派・磐田市千手堂637番地に所在することを一覧本文で確認。&#34;,&#34;url&#34;:&#34;https://www.bukyou.com/BukyBukyou/TBukyou22/C22CNo211Detail.html&#34;},{&#34;title&#34;:&#34;ニッポンの霊場 豊田郡三十三観音霊場&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;第10番＝慈眼山千手寺（臨済宗妙心寺派・千手堂637）を確認。寺名・宗派・住所がDBと一致。&#34;,&#34;url&#34;:&#34;https://nippon-reijo.jimdofree.com/%E6%8E%B2%E8%BC%89%E9%9C%8A%E5%A0%B4%E3%81%AE%E4%B8%80%E8%A6%A7/%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/%E8%B1%8A%E7%94%B0%E9%83%A1%E4%B8%89%E5%8D%81%E4%B8%89%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/&#34;},{&#34;title&#34;:&#34;臨黄ネット 寺院検索（静岡県磐田市・妙心寺派）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;一覧掲載のみ。寺名「千手寺（せんじゅじ）」・住所「千手堂637」を確認（台帳と一致）。本尊・由緒・行事欄は空欄で、台帳既載の本尊（千手十一面観音）・由緒の裏付けは公式検索からは得られない。&#34;,&#34;url&#34;:&#34;https://rinnou.net/search/?prefectures=%E9%9D%99%E5%B2%A1%E7%9C%8C&#38;address_1=%E7%A3%90%E7%94%B0%E5%B8%82&#38;shuha=%E5%A6%99%E5%BF%83%E5%AF%BA%E6%B4%BE&#34;}],&#34;research_todos&#34;:[&#34;本尊千手十一面観音像の制作年代・指定文化財の有無を確認する&#34;,&#34;正元2年創建の典拠（寺伝か記録か）を『磐田市誌』で確認する&#34;,&#34;元禄元年の臨済宗転宗の経緯（本寺との関係）の調査&#34;,&#34;傾城塚（野箱）と千手寺の現在の関係（供養行事等）の現地確認&#34;,&#34;『平家物語』『吾妻鏡』に登場する千手の前と当地伝承の比較整理&#34;],&#34;founded_period&#34;:&#34;『日本歴史地名大系』によれば正元2年（1260年）の創建で、もと真言宗、元禄元年（1688年）に臨済宗に転じたといいます。&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;創建と改宗&#34;,&#34;body&#34;:&#34;『日本歴史地名大系』（コトバンク掲載）によれば、千手寺は正元2年（1260年）の創建とされ、もとは真言宗の寺院でしたが、元禄元年（1688年）に臨済宗に転じたといいます。山号は慈眼山、本尊は千手十一面観音です。所在地の町名「千手堂」は当寺にちなむもので、地元では「せんずどう」とも読み慣わされてきました。&#34;},{&#34;heading&#34;:&#34;千手の前の伝承&#34;,&#34;body&#34;:&#34;本尊の千手十一面観音は、平重衡に仕えた白拍子千手の前の持仏と伝えられています。ただし『日本歴史地名大系』は、後世に千手の前と千手観音の両者が結びつけられたらしいと注記しており、寺伝と史実は区別して考える必要があります。磐田市観光協会の解説によれば、千手の前は駿河国手越の長者の娘で、千手寺（磐田市千手堂）の千手観音に祈願して授かった子であることから「千手」と名付けられたと伝えられます。重衡の処刑後は尼となって当地で菩提を弔い、その墓と伝えられる傾城塚が磐田市野箱に残ります。&#34;}],&#34;pilgrimage_note&#34;:&#34;豊田郡三十三観音霊場第10番札所（享保年間開創の歴史的霊場・現在は活動していない）&#34;},{&#34;temple_id&#34;:&#34;iwata-0020&#34;,&#34;slug&#34;:&#34;manshoji-manshoji&#34;,&#34;name&#34;:&#34;萬勝寺&#34;,&#34;name_kana&#34;:&#34;まんしょうじ&#34;,&#34;aliases&#34;:[&#34;瑞芝山萬勝寺&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;unknown&#34;,&#34;status_label&#34;:&#34;現地痕跡未確認&#34;,&#34;detail_page&#34;:false,&#34;sect&#34;:&#34;臨済宗妙心寺派&#34;,&#34;address&#34;:&#34;静岡県磐田市万正寺515番地&#34;,&#34;district_id&#34;:&#34;nanbu&#34;,&#34;area&#34;:&#34;南部&#34;,&#34;main_deity&#34;:&#34;薬師如来（弘法大師の作と伝える。『静岡県磐田郡誌』による）&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;萬勝寺は磐田市万正寺にある臨済宗妙心寺派の寺院で、『静岡県磐田郡誌』（1921年）によれば山号は瑞芝山、見付の見性寺の末寺で、本尊は弘法大師作と伝える薬師如来です。同誌は鎌倉時代の文永5年（1268年）2月、南溟による開創と記します。町名「万正寺」は当寺と関わりが深く、『日本歴史地名大系』の万正寺村の項には正保郷帳に「万正寺（現臨済宗妙心寺派萬勝寺）領三石余」と記録されたことが記されています。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-12&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9091&#34;},{&#34;title&#34;:&#34;万正寺村（まんしようじむら）とは？ コトバンク（日本歴史地名大系）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;遠江国豊田郡万正寺村の項で、正保郷帳の村高319石余（幕府領）・「万正寺領三石余」・万正寺が現臨済宗妙心寺派萬勝寺であること・元禄12年（1699年）浜松藩領を本文で確認。&#34;,&#34;url&#34;:&#34;https://kotobank.jp/word/%E4%B8%87%E6%AD%A3%E5%AF%BA%E6%9D%91-3030756&#34;},{&#34;title&#34;:&#34;萬勝寺（静岡県磐田駅）ホトカミ&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;臨済宗妙心寺派・磐田市万正寺515の所在情報を本文で確認（沿革記載なし）。&#34;,&#34;url&#34;:&#34;https://hotokami.jp/area/shizuoka/Hmmtm/Hmmtmtm/Dzayt/70196/&#34;},{&#34;title&#34;:&#34;サーチ寺院 静岡県磐田市の寺院一覧&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;萬勝寺が臨済宗妙心寺派・磐田市万正寺515番地に所在することを一覧本文で確認。&#34;,&#34;url&#34;:&#34;https://www.bukyou.com/BukyBukyou/TBukyou22/C22CNo211Detail.html&#34;},{&#34;title&#34;:&#34;『静岡県磐田郡誌』（静岡県磐田郡教育会編、1921年）434コマ・414コマ・364コマ・698コマ&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション。由緒（434コマ）に文永5年南溟開創・本尊薬師如来（伝弘法大師作）・明暦2年薬師堂領10石5斗・風土記伝との異同注記、一覧表（414コマ）に山号瑞芝山・境内819坪、神社の部（364コマ）に八王子神社の営繕を寺領から賄った記録、人物章（698コマ）に前住職新羅実禅の救済事業&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680/1/434&#34;},{&#34;title&#34;:&#34;臨黄ネット 寺院検索（静岡県磐田市・妙心寺派）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;一覧掲載のみ。寺名「萬勝寺（まんしょうじ）」・住所「万正寺515」を確認（台帳と一致）。本尊・由緒・行事欄は空欄。&#34;,&#34;url&#34;:&#34;https://rinnou.net/search/?prefectures=%E9%9D%99%E5%B2%A1%E7%9C%8C&#38;address_1=%E7%A3%90%E7%94%B0%E5%B8%82&#38;shuha=%E5%A6%99%E5%BF%83%E5%AF%BA%E6%B4%BE&#34;},{&#34;title&#34;:&#34;万勝寺（まんしょうじ）｜タイキグループ&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;境内墓地の一般墓所の価格帯情報。寺院公式情報ではない点に留意&#34;,&#34;url&#34;:&#34;http://taikigroup.jp/boen/?id=169&#34;}],&#34;research_todos&#34;:[&#34;山号（「瑞芝山」とする検索情報があるが本文確認できず）を寺院または宗派資料で確認する&#34;,&#34;本尊（薬師如来とする検索情報があるが本文確認できず）の確認&#34;,&#34;文永5年（1268年）開創説・見付見性寺末寺説の典拠を『磐田市誌』等で確認する&#34;,&#34;寺号「萬勝寺」と村名「万正寺」（近世初期には満勝寺村とも）の表記変遷の整理&#34;,&#34;境内の墓地・堂宇の現況の現地確認&#34;,&#34;『遠江国風土記伝』が記す「曹洞宗小島村正眼院末」との宗派・本末関係の齟齬の解明&#34;,&#34;寺領高の記録の異同（正保郷帳3石余・明暦2年薬師堂領10石5斗・風土記伝10石6斗）の整理&#34;,&#34;本尊薬師如来像（伝弘法大師作）の現存確認&#34;,&#34;墓地・永代使用料の情報は民間仲介サイトのみが出典のため、寺院への直接確認が必要&#34;,&#34;護持会・年中行事・地域との関わりについては情報を確認できなかった&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;万正寺村と寺領の記録&#34;,&#34;body&#34;:&#34;『日本歴史地名大系』（コトバンク掲載）の万正寺村の項によれば、同村は旧豊田郡に属し、中野村の西、南は鮫島村、北は下岡田村に接していました。正保郷帳には村高319石余の幕府領として村名が見え、その内訳の中に「万正寺領三石余」が記録されています。この万正寺が現在の臨済宗妙心寺派萬勝寺にあたると同書は注記しています。元禄郷帳では村高は354石余に増加し、元禄12年（1699年）の青山忠重領知目録により浜松藩領となったことが確認できます。また『静岡県磐田郡誌』は、江戸時代の地誌『遠江国風土記伝』に「万正寺 朱符之寺田高十石六斗。薬師堂領也。曹洞宗小島村正眼院末。平僧住」とあることを引いた上で、「萬勝寺は、村名の如く万正なりしならむ。何れの時より今の如くなりしか詳かならず。本寺の名も亦風土記伝と合はず」と注記しており（同誌の本文は磐田郡社寺明細帳による）、寺号の表記や本末関係の記録に揺れがあったことが分かります。&#34;,&#34;sources_note&#34;:&#34;『日本歴史地名大系』万正寺村の項＋『静岡県磐田郡誌』434コマ&#34;},{&#34;heading&#34;:&#34;『静岡県磐田郡誌』にみる沿革&#34;,&#34;body&#34;:&#34;『静岡県磐田郡誌』（1921年）の由緒には、萬勝寺は天龍村万正寺字本村に在り、妙心寺派で見付町見性寺の末寺、本尊は薬師如来で弘法大師の作と伝えることが記されています。開創は文永5年（1268年）2月の南溟によるもので、永正元年（1504年）4月に笠岩が中興しました。開創者と伝える南溟は、同誌で上岡田の大蔵寺（建治3年創建）の開創者としても記される僧です。明暦2年（1656年）2月24日には薬師堂領10石5斗を賜っています。安政元年（1854年）11月4日の地震では堂宇・伽藍がことごとく倒壊し、翌安政2年に仮堂を建てました。同誌の一覧表では山号は瑞芝山、1921年当時の境内地は819坪です。また同誌の神社の部によれば、万正寺字北市場の八王子神社（万正寺村の村社）は、明治維新以前は萬勝寺の朱印寺領の内から社殿の営繕や祭典の費用を賄っており、村の鎮守と当寺が一体的に維持されてきたことが分かります。&#34;,&#34;sources_note&#34;:&#34;『静岡県磐田郡誌』434コマ（由緒）・414コマ（臨済宗寺院一覧表）・364コマ（八王子神社）&#34;},{&#34;heading&#34;:&#34;前住職・新羅実禅の救済事業&#34;,&#34;body&#34;:&#34;『静岡県磐田郡誌』の人物の章には、萬勝寺前住職・新羅実禅師の事績が収められています。実禅師は美濃国羽島郡北宿村（現岐阜県）の生まれで、明治維新期に中泉町で救院（困窮者救護施設）が設立された際に常務委員長を務め、貧民児童の撫育に尽力しました。明治2年（1869年）に朝廷から鰥寡孤独・廃疾者を憐れむべき旨の諭達が寺院にも出されると、師はこれを奉じて窮民を集めて薬を与え看護し、男性には草鞋作り、女性には裁縫や洗濯などの手業を身につけさせ、少年には読書や習字を教えたと記されます。この善行は「明治孝節録」にも収載され、同書は師を「遠江国豊田郡萬勝寺の住持」と記しています。師は布教のため土佐国を巡回中に示寂しました。&#34;,&#34;sources_note&#34;:&#34;『静岡県磐田郡誌』698コマ（第二十一章人物）&#34;}],&#34;founded_period&#34;:&#34;文永5年（1268年）2月、南溟の開創（『静岡県磐田郡誌』による）&#34;,&#34;cultural_assets&#34;:[],&#34;danka_info&#34;:{&#34;cemetery&#34;:&#34;民間の墓地・石材仲介サイト「タイキグループ」に、萬勝寺境内墓地の一般墓所が墓石・永代使用料込みで107万円からと案内されている。ただし寺院公式の裏付けは取れていない。&#34;}},{&#34;temple_id&#34;:&#34;iwata-0021&#34;,&#34;slug&#34;:&#34;chusenji-nakaizumi&#34;,&#34;name&#34;:&#34;中泉寺&#34;,&#34;name_kana&#34;:&#34;ちゅうせんじ&#34;,&#34;aliases&#34;:[&#34;大池山&#34;,&#34;大池山中泉寺&#34;,&#34;御殿のお寺&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;臨済宗妙心寺派&#34;,&#34;address&#34;:&#34;静岡県磐田市中泉743番地の1&#34;,&#34;district_id&#34;:&#34;nakaizumi&#34;,&#34;area&#34;:&#34;中泉&#34;,&#34;main_deity&#34;:&#34;虚空蔵菩薩&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;現地写真あり&#34;,&#34;detail_status&#34;:&#34;公開情報調査済み&#34;,&#34;history_summary&#34;:&#34;中泉寺は磐田市中泉にある臨済宗（妙心寺派）の寺院で、山号は大池山、本尊は虚空蔵菩薩です。磐田市観光協会の資料によれば永禄5年（1562年）の創建で、開山は梅翁和尚。中泉御殿を営んだ徳川家康が梅翁和尚に帰依して本堂・庫裡等を寄進し、葵の御紋の使用を許した家康ゆかりの寺です。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-12&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9093&#34;},{&#34;title&#34;:&#34;磐田市観光協会「中泉ありがた歩記」（PDF）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;大池山中泉寺・臨済宗・本尊虚空蔵菩薩・永禄5年（1562年）創建・開山梅翁和尚・家康の帰依と本堂庫裡寄進・葵の御紋・「大池山中泉寺」号下賜・家康の位牌・中野七蔵の子安地蔵尊・平岡彦兵衛良政と岡崎兼三郎春秋の墓をPDF本文で確認。&#34;,&#34;url&#34;:&#34;https://kanko-iwata.jp/wp2/wp-content/uploads/2023/06/B4_nakaizumi.pdf&#34;},{&#34;title&#34;:&#34;中泉寺（和空 修行と宿坊のポータルサイト）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;磐田市中泉御殿町743-1・臨済宗・磐田駅徒歩5分・月例坐禅会の開催を本文で確認。&#34;,&#34;url&#34;:&#34;https://wa-qoo.com/ja/shizuoka/chuusenji/&#34;},{&#34;title&#34;:&#34;サーチ寺院 静岡県磐田市の寺院一覧&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;中泉寺が臨済宗妙心寺派・磐田市中泉743番地の1に所在することを一覧本文で確認。&#34;,&#34;url&#34;:&#34;https://www.bukyou.com/BukyBukyou/TBukyou22/C22CNo211Detail.html&#34;},{&#34;title&#34;:&#34;臨黄ネット 寺院検索（静岡県磐田市・妙心寺派）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;一覧掲載のみ。寺名「中泉寺（ちゅうせんじ）」・住所「中泉743-1」を確認（台帳と一致）。本尊・由緒・行事欄は空欄で、台帳既載の本尊（虚空蔵菩薩）・創建年の裏付けは公式検索からは得られない。&#34;,&#34;url&#34;:&#34;https://rinnou.net/search/?prefectures=%E9%9D%99%E5%B2%A1%E7%9C%8C&#38;address_1=%E7%A3%90%E7%94%B0%E5%B8%82&#38;shuha=%E5%A6%99%E5%BF%83%E5%AF%BA%E6%B4%BE&#34;},{&#34;title&#34;:&#34;中泉寺｜『和空』修行と宿坊のポータルサイト&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;坐禅会の開催日・参加費を確認&#34;,&#34;url&#34;:&#34;https://wa-qoo.com/shizuoka/chuusenji/&#34;},{&#34;title&#34;:&#34;中泉寺 坐禅会カレンダー｜zazenmap.jp&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;坐禅会の存在を別ソースで裏付け&#34;,&#34;url&#34;:&#34;https://zazenmap.jp/calendar/1670/&#34;},{&#34;title&#34;:&#34;磐田市文化財保存活用地域計画（令和6年9月）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;p.54 中泉地区「中泉御殿・代官関係」の項に「中泉寺（中泉代官墓）」と記載&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/_res/projects/default_project/_page_/001/009/747/keikaku202409.pdf&#34;}],&#34;research_todos&#34;:[&#34;元禄14年（1701年）に円覚寺派から妙心寺派へ転じたとする情報（静岡県観光系サイト）の本文裏取り&#34;,&#34;山門と三つ葉葵紋の現況・由来の現地確認&#34;,&#34;開山梅翁和尚の詳細（法諱・出自）の調査&#34;,&#34;家康の位牌・子安地蔵尊の公開状況の確認&#34;,&#34;中泉御殿（御殿遺跡公園）と寺の位置関係の整理&#34;,&#34;月例坐禅会など現在の活動の確認（宿坊ポータル「和空」に坐禅会の記載あり）&#34;,&#34;坐禅会の開催頻度・参加条件を寺院公式情報で裏付ける&#34;,&#34;護持会・永代供養・地域行事との関わりは情報を確認できなかった&#34;,&#34;中泉代官の墓の人物名について、磐田市観光協会資料は「岡崎兼三郎春秋」とするが、他の郷土資料では「岡崎源三郎晴明」とする表記もあり、一次史料での確認が望ましい。&#34;],&#34;founded_period&#34;:&#34;室町時代末期、永禄5年（1562年）創建（磐田市観光協会資料による）&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;創建と徳川家康&#34;,&#34;body&#34;:&#34;磐田市観光協会の資料「中泉ありがた歩記」によれば、中泉寺は室町時代末期の永禄5年（1562年）の創建で、開山は梅翁和尚です。当時、中泉御殿の造営のため浜松城から磐田に往来していた徳川家康は梅翁和尚に帰依し、本堂・庫裡等を寄進して葵の御紋の使用を許し、「大池山中泉寺」の号を与えたのが寺の起源と伝えられています。位牌堂には家康公の位牌が安置されています。&#34;},{&#34;heading&#34;:&#34;中泉代官とのゆかり&#34;,&#34;body&#34;:&#34;中泉は江戸時代に幕府直轄地の拠点として中泉代官所（陣屋）が置かれた町で、同資料によれば境内には中泉代官の平岡彦兵衛良政と岡崎兼三郎春秋の墓があります。また位牌堂には、中泉代官の中野七蔵が子宝を授かったことにちなむ、子供を抱く姿の子安地蔵尊が安置されています。本尊の虚空蔵菩薩は智慧と福徳の仏として信仰されています。&#34;},{&#34;heading&#34;:&#34;発掘調査・考古資料からの補足&#34;,&#34;body&#34;:&#34;中泉寺は永禄5年（1562年）、梅翁和尚を開山として創建されたと伝えられる。中泉御殿造営のため浜松城から磐田へ往来していた徳川家康が梅翁和尚に帰依して本堂・庫裡等を寄進し、大池山中泉寺の号を与えたという。 磐田市文化財保存活用地域計画では、中泉地区の「中泉御殿・代官関係」の文化財として中泉寺が「中泉代官墓」として位置づけられている。&#34;}],&#34;danka_info&#34;:{&#34;annual_events&#34;:[{&#34;name&#34;:&#34;坐禅会&#34;,&#34;timing&#34;:&#34;毎月第3土曜または第4土曜 午後2時&#34;,&#34;note&#34;:&#34;参加費は月200円（老師を招く回は500円）。地域住民が参加できる定例行事として、宿坊・修行体験の紹介サイトと坐禅会情報サイトの2つの独立した情報源で確認できた。寺院公式の裏付けはない。&#34;}]},&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0022&#34;,&#34;slug&#34;:&#34;senzoji-nakaizumi&#34;,&#34;name&#34;:&#34;泉蔵寺&#34;,&#34;name_kana&#34;:&#34;せんぞうじ&#34;,&#34;aliases&#34;:[&#34;無量山&#34;,&#34;泉藏寺&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;臨済宗妙心寺派&#34;,&#34;address&#34;:&#34;静岡県磐田市中泉1557番地の1&#34;,&#34;district_id&#34;:&#34;nakaizumi&#34;,&#34;area&#34;:&#34;中泉&#34;,&#34;main_deity&#34;:&#34;阿弥陀如来&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;現地写真あり&#34;,&#34;detail_status&#34;:&#34;公開情報調査済み&#34;,&#34;history_summary&#34;:&#34;泉蔵寺は磐田市中泉にある臨済宗妙心寺派の寺院で、山号は無量山、本尊は阿弥陀如来です。眼病にご利益があると信仰される薬師（寅薬師）を祀るほか、初代中泉代官を務めた秋鹿氏の菩提寺として知られ、境内には秋鹿氏歴代の五輪塔群が残ります。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9095&#34;},{&#34;title&#34;:&#34;磐田 中泉ありがた歩記（磐田市観光協会パンフレット）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;無量山泉蔵寺・臨済宗・本尊阿弥陀如来。寅薬師（源頼光の念持仏と伝わる）、日光・月光菩薩と十二神将、観音堂・地蔵堂・十王堂、初代中泉代官秋鹿氏の菩提寺で高さ3mほどの歴代五輪塔群があることを本文で確認&#34;,&#34;url&#34;:&#34;https://kanko-iwata.jp/wp2/wp-content/uploads/2023/06/B4_nakaizumi.pdf&#34;},{&#34;title&#34;:&#34;静岡県磐田市の寺院・御堂一覧（サーチ寺院）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;泉蔵寺＝静岡県磐田市中泉1557番地の1・臨済宗妙心寺派（法人番号1080405005395）であることを確認&#34;,&#34;url&#34;:&#34;https://www.bukyou.com/BukyBukyou/TBukyou22/C22CNo211Detail.html&#34;},{&#34;title&#34;:&#34;ニッポンの霊場 遠江四十九薬師霊場&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;第2番＝無量山泉蔵寺（臨済宗妙心寺派・御本尊阿弥陀如来）を確認。一覧の所在地表記は「磐田市中泉石原」（石原町は旧中泉地区の町名）で、市内の臨済宗妙心寺派泉蔵寺は1か寺のみ。&#34;,&#34;url&#34;:&#34;https://nippon-reijo.jimdofree.com/%E6%8E%B2%E8%BC%89%E9%9C%8A%E5%A0%B4%E3%81%AE%E4%B8%80%E8%A6%A7/%E8%96%AC%E5%B8%AB%E9%9C%8A%E5%A0%B4/%E9%81%A0%E6%B1%9F%E5%9B%9B%E5%8D%81%E4%B9%9D%E8%96%AC%E5%B8%AB%E9%9C%8A%E5%A0%B4/&#34;},{&#34;title&#34;:&#34;臨黄ネット 寺院検索（静岡県磐田市・妙心寺派）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;一覧掲載のみ。公式検索では旧字体「泉藏寺（せんぞうじ）」表記。住所「中泉1557-1」は台帳と一致。本尊・由緒・行事欄は空欄。&#34;,&#34;url&#34;:&#34;https://rinnou.net/search/?prefectures=%E9%9D%99%E5%B2%A1%E7%9C%8C&#38;address_1=%E7%A3%90%E7%94%B0%E5%B8%82&#38;shuha=%E5%A6%99%E5%BF%83%E5%AF%BA%E6%B4%BE&#34;},{&#34;title&#34;:&#34;磐田市文化財保存活用地域計画（令和6年9月）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;p.54 中泉地区「中泉御殿・代官関係」の項に「泉蔵寺（中泉代官秋鹿氏墓地）」と記載&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/_res/projects/default_project/_page_/001/009/747/keikaku202409.pdf&#34;}],&#34;research_todos&#34;:[&#34;創建年代・開山の確認（磐田市誌・寺院明細帳などの郷土資料）&#34;,&#34;寅薬師の縁日・御開帳の有無の現地確認&#34;,&#34;秋鹿氏五輪塔群の現況と基数の現地確認&#34;,&#34;西国三十三新霊場の本尊石像の造立年代の調査&#34;,&#34;妙心寺派公式資料（宗派名簿）での登録確認&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;寅薬師と境内の諸堂&#34;,&#34;body&#34;:&#34;磐田市観光協会の資料によれば、泉蔵寺には眼病にご利益があるとされる薬師（寅薬師）が祀られ、両脇に日光菩薩・月光菩薩と十二神将を従えています。この薬師像は源頼光の念持仏と伝えられています。境内には西国三十三新霊場の本尊石像がまつられた観音堂のほか、地蔵堂や十王堂もあり、交通安全を祈念する地蔵尊、健康を祈願する観音像がまつられています。&#34;},{&#34;heading&#34;:&#34;中泉代官秋鹿氏の菩提寺&#34;,&#34;body&#34;:&#34;江戸時代、中泉には幕府直轄地を治める中泉代官所（陣屋）が置かれ、伊奈忠次や大草左衛門、羽倉簡堂、林鶴梁など有能な官僚が代官を務めました。磐田市観光協会の資料によれば、初代の代官を務めた秋鹿氏の墓所は菩提寺である泉蔵寺にあります。秋鹿氏歴代の五輪塔は高さ3mほどあり、磐田市内でこれほどの墓碑群はほかにないといわれています。&#34;},{&#34;heading&#34;:&#34;発掘調査・考古資料からの補足&#34;,&#34;body&#34;:&#34;泉蔵寺は中泉御殿の跡地に居住し初代中泉代官を務めた秋鹿氏の菩提寺で、境内には秋鹿家歴代の大型の五輪塔群がある。高さ約3メートルに及ぶ五輪塔で、磐田市内でこれほどの規模の墓碑群は他にないとされる。&#34;}],&#34;pilgrimage_note&#34;:&#34;遠江四十九薬師霊場第2番札所&#34;,&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0023&#34;,&#34;slug&#34;:&#34;renpukuji-ninomiya&#34;,&#34;name&#34;:&#34;連福寺&#34;,&#34;name_kana&#34;:&#34;れんぷくじ&#34;,&#34;aliases&#34;:[&#34;龍池山&#34;,&#34;弘福密寺（旧称と伝わる）&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;臨済宗妙心寺派&#34;,&#34;address&#34;:&#34;静岡県磐田市二之宮1262番地&#34;,&#34;district_id&#34;:&#34;nakaizumi&#34;,&#34;area&#34;:&#34;中泉&#34;,&#34;main_deity&#34;:&#34;釈迦牟尼仏&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;現地写真あり&#34;,&#34;detail_status&#34;:&#34;公開情報調査済み&#34;,&#34;history_summary&#34;:&#34;連福寺は磐田市二之宮にある臨済宗妙心寺派の寺院で、山号は龍池山、本尊は釈迦牟尼仏です。寺伝では大同2年（807年）に弘法大師空海が開いた真言宗弘福密寺に始まり、平清盛の子・平重盛が伽藍を建てて龍池山連福寺と改称したと伝えられます。閻魔堂には県内最大級とされる木造閻魔大王坐像（磐田市指定文化財）を安置します。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9096&#34;},{&#34;title&#34;:&#34;磐田 中泉ありがた歩記（磐田市観光協会パンフレット）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;龍池山連福寺・臨済宗・本尊釈迦牟尼仏。大同2年（807年）弘法大師開創（弘福密寺）、1156年平重盛による伽藍建立と改称、大師堂の厄除地蔵石仏、県内最大の閻魔大王像、閻魔像の国分寺→十輪寺→明治14年現在地の移転経緯、三連寺と重盛供養塔現存を本文で確認&#34;,&#34;url&#34;:&#34;https://kanko-iwata.jp/wp2/wp-content/uploads/2023/06/B4_nakaizumi.pdf&#34;},{&#34;title&#34;:&#34;市指定文化財｜磐田市公式ウェブサイト&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;木造閻魔大王坐像（彫刻・鎌倉〜室町時代・所有者連福寺・平成17年11月21日指定・像高1.8m・県内最大級）と連福寺古墳出土三角縁神獣鏡（考古資料・古墳時代・所有者磐田市・令和5年4月28日指定）をHTML原文で確認&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/sports_midokoro/bunkazai/bunkazainitsuite/1002039.html&#34;},{&#34;title&#34;:&#34;平重盛と遠州の三連寺（史跡めぐり解説）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;平重盛が磐田市内に三ヶ寺（遠州の三連寺）を建てたという伝承の補足解説を本文で確認&#34;,&#34;url&#34;:&#34;https://www.asa1.net/siseki-meguri/t17-tairanosigemori.html&#34;},{&#34;title&#34;:&#34;ニッポンの霊場 磐田郡三十三観音霊場&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;第8番＝龍池山連福寺（臨済宗妙心寺派・二之宮1262）を確認。寺名・宗派・住所がDBと一致。&#34;,&#34;url&#34;:&#34;https://nippon-reijo.jimdofree.com/%E6%8E%B2%E8%BC%89%E9%9C%8A%E5%A0%B4%E3%81%AE%E4%B8%80%E8%A6%A7/%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/%E7%A3%90%E7%94%B0%E9%83%A1%E4%B8%89%E5%8D%81%E4%B8%89%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/&#34;},{&#34;title&#34;:&#34;臨黄ネット 寺院検索（静岡県磐田市・妙心寺派）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;一覧掲載のみ。寺名「連福寺（れんぷくじ）」・住所「二之宮1262」を確認（台帳と一致）。本尊・由緒・行事欄は空欄で、台帳既載の本尊（釈迦牟尼仏）・大同2年開創伝承の裏付けは公式検索からは得られない。&#34;,&#34;url&#34;:&#34;https://rinnou.net/search/?prefectures=%E9%9D%99%E5%B2%A1%E7%9C%8C&#38;address_1=%E7%A3%90%E7%94%B0%E5%B8%82&#38;shuha=%E5%A6%99%E5%BF%83%E5%AF%BA%E6%B4%BE&#34;},{&#34;title&#34;:&#34;いわた文化財だより第218号&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;令和5年5月1日発行。P3「連福寺古墳出土三角縁神獣鏡が市指定文化財に」。連福寺古墳の所在・規模と、出土鏡の市指定文化財指定（令和5年4月28日）を記載。&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/_res/projects/default_project/_page_/001/007/901/dayori218.pdf&#34;},{&#34;title&#34;:&#34;磐田市文化財保存活用地域計画（令和6年9月）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;p.37 御厨・田原地区古墳配置図に連福寺古墳を記載、p.54 中泉地区「有形（考古資料）連福寺古墳出土三角縁神獣鏡」、御殿・二之宮遺跡の範囲説明&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/_res/projects/default_project/_page_/001/009/747/keikaku202409.pdf&#34;}],&#34;research_todos&#34;:[&#34;真言宗から臨済宗への改宗時期の確認（磐田市誌等）&#34;,&#34;平重盛供養塔（石塔）の形式・年代の現地確認&#34;,&#34;大師堂の厄除地蔵石仏の現況確認&#34;,&#34;閻魔大王坐像の拝観可否・御開帳日の確認&#34;,&#34;連福寺古墳の位置と寺域の関係の確認&#34;,&#34;連福寺古墳と現在の連福寺境内地の位置関係を発掘調査報告書で確認する。&#34;,&#34;いわた文化財だより第45号「思わず人に話したくなる磐田の文化財 第7回 連福寺／木造閻魔大王坐像（市指定文化財）」は総目次のタイトルのみ確認でき、本文（磐田市立図書館の電子書籍サービス収録、ビューアー未読）は未確認。木造閻魔大王坐像の詳細事実は今回未採用。&#34;],&#34;founded_period&#34;:&#34;寺伝では大同2年（807年）開創と伝わる&#34;,&#34;heritage_status&#34;:&#34;市指定文化財あり（木造閻魔大王坐像。ほかに連福寺古墳出土三角縁神獣鏡が磐田市所有で市指定）&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;創建と平重盛の伝承&#34;,&#34;body&#34;:&#34;磐田市観光協会の資料によれば、開創は大同2年（807年）で、弘法大師空海が厄除地蔵の石仏を作り真言宗弘福密寺としたと伝えられます。この石仏は現在も大師堂に安置されています。その後1156年に、遠江国守であった平清盛の子・平重盛が伽藍を建て、龍池山連福寺と改称したと伝わります。重盛は連城寺（磐田市新貝）・連福寺・蓮覚寺（磐田市竜洋中島）の「連」のつく3か寺を建てたといわれ「重盛の三連寺」と呼ばれます。連福寺には重盛の供養塔と伝わる石塔が現存しています。&#34;},{&#34;heading&#34;:&#34;閻魔堂と閻魔大王坐像&#34;,&#34;body&#34;:&#34;境内の閻魔堂には県内最大級の閻魔大王像が安置されています。磐田市の資料によれば、この木造閻魔大王坐像は鎌倉時代末から室町時代初期の作で像高1.8mあり、平成17年（2005年）に磐田市指定文化財（彫刻）に指定されました。磐田市観光協会の資料によれば、この閻魔像は江戸時代までは国分寺にあり、明治初年に十輪寺へ移された後、明治14年（1881年）に現在の場所に移されたものです。&#34;},{&#34;heading&#34;:&#34;連福寺古墳&#34;,&#34;body&#34;:&#34;寺名を冠する連福寺古墳は推定50m以上の前方後円墳で、出土した三角縁三神五獣鏡は令和5年（2023年）4月28日に磐田市指定文化財（考古資料）に指定されました。指定資料の所有者は磐田市です。&#34;},{&#34;heading&#34;:&#34;文化財資料からの補足&#34;,&#34;body&#34;:&#34;連福寺が所蔵する木造閻魔大王坐像は鎌倉時代末から室町時代初期の作で、像高1.8メートルの県内最大級の閻魔像です。磐田市指定有形文化財（彫刻）に指定されています。 推定全長50メートル以上の前方後円墳である連福寺古墳からは三角縁三神五獣鏡が出土しており、「連福寺古墳出土三角縁神獣鏡」として令和5年（2023年）4月28日に磐田市指定有形文化財（考古資料、磐田市所有）となっています。&#34;},{&#34;heading&#34;:&#34;『いわた文化財だより』からの補足&#34;,&#34;body&#34;:&#34;連福寺（磐田市二之宮）の境内には、かつて古墳時代前期（約1600年前）の前方後円墳「連福寺古墳」があったと推定されている。現在、墳丘は残っていないが、かつては全長50メートル以上の高まりがあったとされる。 連福寺古墳から出土した三角縁神獣鏡は、近畿地方の大和王権との結びつきをうかがわせる資料として、令和5年（2023年）4月28日に磐田市指定文化財となった。この指定により市の指定文化財は136件となった。同鏡は磐田市埋蔵文化財センターで展示されている。&#34;},{&#34;heading&#34;:&#34;発掘調査・考古資料からの補足&#34;,&#34;body&#34;:&#34;連福寺が所在する二之宮地区一帯は、弥生時代から中世にかけての大規模遺跡である御殿・二之宮遺跡の範囲に含まれる。境内近くの前方後円墳・連福寺古墳（推定墳長50メートル以上）から出土した三角縁三神五獣鏡は、令和5年（2023年）4月28日に磐田市指定文化財（考古資料）に指定された。 境内の閻魔堂に安置される木造閻魔大王坐像（像高1.8メートル、鎌倉時代末期から室町時代初期の作、県内最大級とされる）は、平成17年（2005年）11月21日に磐田市指定文化財（彫刻）に指定された。 磐田市観光協会の資料によれば、連福寺の閻魔像は江戸時代までは国分寺に安置され、明治初年に十輪寺へ移された後、明治14年（1881年）に現在の連福寺へ移されたと伝えられている。 寺伝によれば、連福寺は大同2年（807年）に弘法大師空海が厄除地蔵の石仏を作り真言宗弘福密寺として開創したのが始まりで、1156年に平重盛が伽藍を建てて龍池山連福寺と改称したという。石仏は現在も大師堂に安置されている。&#34;}],&#34;cultural_assets&#34;:[{&#34;name&#34;:&#34;木造閻魔大王坐像&#34;,&#34;designation&#34;:&#34;磐田市指定文化財（彫刻）&#34;,&#34;summary&#34;:&#34;鎌倉時代末から室町時代初期の作で像高1.8m。県内最大級の閻魔像とされます。平成17年（2005年）11月21日指定。&#34;},{&#34;name&#34;:&#34;連福寺古墳出土三角縁神獣鏡&#34;,&#34;designation&#34;:&#34;磐田市指定文化財（考古資料・所有者は磐田市）&#34;,&#34;summary&#34;:&#34;推定50m以上の前方後円墳である連福寺古墳から出土した三角縁三神五獣鏡です。令和5年（2023年）4月28日指定。&#34;}],&#34;pilgrimage_note&#34;:&#34;磐田郡三十三観音霊場第8番札所&#34;},{&#34;temple_id&#34;:&#34;iwata-0024&#34;,&#34;slug&#34;:&#34;jionji-mitsuke&#34;,&#34;name&#34;:&#34;慈恩寺&#34;,&#34;name_kana&#34;:&#34;じおんじ&#34;,&#34;aliases&#34;:[&#34;大梅山&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;臨済宗妙心寺派&#34;,&#34;address&#34;:&#34;静岡県磐田市見付2431番地の1&#34;,&#34;district_id&#34;:&#34;mitsuke&#34;,&#34;area&#34;:&#34;見付&#34;,&#34;main_deity&#34;:&#34;聖観世音菩薩&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;現地写真あり&#34;,&#34;detail_status&#34;:&#34;公開情報調査済み&#34;,&#34;history_summary&#34;:&#34;慈恩寺は磐田市見付にある臨済宗妙心寺派の寺院で、山号は大梅山です。応永26年（1419年）の銘をもつ雲板（磐田市指定文化財）を所蔵し、遠江四十九薬師霊場の第49番（結願）札所です。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-12&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9097&#34;},{&#34;title&#34;:&#34;市指定文化財｜磐田市公式ウェブサイト&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;雲板（工芸品・室町時代・所有者慈恩寺・平成17年11月21日指定・応永26年銘・滝泉禅寺は掛川市法泉寺と推定）をHTML原文で確認&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/sports_midokoro/bunkazai/bunkazainitsuite/1002039.html&#34;},{&#34;title&#34;:&#34;慈恩寺（臨済宗妙心寺派）・静岡県磐田市見付幸町（寺院探訪記録）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;山号大梅山、本尊聖観世音菩薩、応永年間開創・天文年間と寛永11年中興の寺伝、寺子屋教育、遠州三十三観音霊場第19番・遠江四十九薬師霊場第49番の記載を本文で確認&#34;,&#34;url&#34;:&#34;http://yossy.main.jp/post-5037-5037.html&#34;},{&#34;title&#34;:&#34;慈恩寺｜じゃらんnet観光ガイド&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;口コミに遠州三十三霊場第19番札所である旨の記載（第19番札所情報の複数サイト一致を確認）&#34;,&#34;url&#34;:&#34;https://www.jalan.net/kankou/spt_22211ag2132024685/&#34;},{&#34;title&#34;:&#34;遠州三十三観音霊場めぐり 札所一覧（霊場会公式サイト）&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;【訂正】既存注記の「遠州三十三観音霊場第19番札所」は誤り。霊場会公式の札所一覧では第19番は正醫寺（磐田市下万能1162-1）であり、慈恩寺は全33札所のどこにも含まれない。&#34;,&#34;url&#34;:&#34;http://enshu33.com/all-guide/&#34;},{&#34;title&#34;:&#34;ニッポンの霊場 遠江四十九薬師霊場&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;第49番＝大梅山慈恩寺（臨済宗妙心寺派・磐田市見付）を確認。番号付き最終札所（49番御詠歌に「祈り納むる」とあり結願にあたる）。&#34;,&#34;url&#34;:&#34;https://nippon-reijo.jimdofree.com/%E6%8E%B2%E8%BC%89%E9%9C%8A%E5%A0%B4%E3%81%AE%E4%B8%80%E8%A6%A7/%E8%96%AC%E5%B8%AB%E9%9C%8A%E5%A0%B4/%E9%81%A0%E6%B1%9F%E5%9B%9B%E5%8D%81%E4%B9%9D%E8%96%AC%E5%B8%AB%E9%9C%8A%E5%A0%B4/&#34;},{&#34;title&#34;:&#34;ニッポンの霊場 豊田郡三十三観音霊場&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;第2番＝大梅山慈恩寺（見付2431）を確認。&#34;,&#34;url&#34;:&#34;https://nippon-reijo.jimdofree.com/%E6%8E%B2%E8%BC%89%E9%9C%8A%E5%A0%B4%E3%81%AE%E4%B8%80%E8%A6%A7/%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/%E8%B1%8A%E7%94%B0%E9%83%A1%E4%B8%89%E5%8D%81%E4%B8%89%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/&#34;},{&#34;title&#34;:&#34;臨黄ネット 寺院検索（静岡県磐田市・妙心寺派）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;一覧掲載のみ。寺名「慈恩寺（じおんじ）」・住所「見付2431-1」を確認（台帳と一致）。本尊・由緒・行事欄は空欄。&#34;,&#34;url&#34;:&#34;https://rinnou.net/search/?prefectures=%E9%9D%99%E5%B2%A1%E7%9C%8C&#38;address_1=%E7%A3%90%E7%94%B0%E5%B8%82&#38;shuha=%E5%A6%99%E5%BF%83%E5%AF%BA%E6%B4%BE&#34;},{&#34;title&#34;:&#34;慈恩寺 境内由緒案内板（磐田市文化財課設置）&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;現地写真で確認。本尊「聖観世音菩薩」、応永年間（1394〜1428年）開創、天文年間・寛永11年の中興、雲板の由来（磐田市指定有形文化財・平成17年11月21日指定）を記載。&#34;,&#34;url&#34;:&#34;&#34;}],&#34;research_todos&#34;:[&#34;遠江四十九薬師霊場第49番札所とする情報（民間1件）の霊場公式資料での確認&#34;,&#34;応永年間開創・天文年間中興の典拠（寺伝文書・磐田市誌）の確認&#34;,&#34;寺子屋教育の記録の郷土資料での確認&#34;,&#34;雲板が慈恩寺に伝来した経緯の調査&#34;],&#34;founded_period&#34;:&#34;寺伝では室町時代の応永年間（1394〜1428年）の開創と伝わる（民間二次情報による）&#34;,&#34;heritage_status&#34;:&#34;市指定文化財あり（雲板）&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;創建と沿革&#34;,&#34;body&#34;:&#34;民間の寺院探訪記録によれば、寺伝では室町時代の応永年間（1394〜1428年）の開創と伝えられ、一時衰えた後、戦国時代の天文年間（1532〜1555年）と江戸時代の寛永11年（1634年）に中興されたとされます。同資料では本尊は聖観世音菩薩とされ、江戸時代末から明治時代初期には寺子屋教育が行われていたと紹介されています。これらは行政資料では未確認のため、寺院・市への確認が望まれます。&#34;},{&#34;heading&#34;:&#34;市指定文化財の雲板&#34;,&#34;body&#34;:&#34;磐田市の資料によれば、慈恩寺所有の雲板（うんばん）は室町時代の工芸品で、「遠江上西郷庄滝泉禅寺」「応永26年（1419）」の銘があります。滝泉禅寺は掛川市法泉寺と推定されています。平成17年（2005年）11月21日に磐田市指定文化財に指定されました。雲板は禅宗寺院で時刻などを知らせるために打ち鳴らす鋳銅製の板です。&#34;},{&#34;heading&#34;:&#34;文化財資料からの補足&#34;,&#34;body&#34;:&#34;慈恩寺が所蔵する雲板には「遠江上西郷庄滝泉禅寺」「応永26年（1419年）」の銘があり、磐田市指定有形文化財（工芸品）に指定されています。銘の滝泉禅寺は掛川市の法泉寺と推定されています。&#34;}],&#34;cultural_assets&#34;:[{&#34;name&#34;:&#34;雲板&#34;,&#34;designation&#34;:&#34;磐田市指定文化財（工芸品）&#34;,&#34;summary&#34;:&#34;室町時代の雲板で、「遠江上西郷庄滝泉禅寺」「応永26年（1419）」の銘があります。滝泉禅寺は掛川市法泉寺と推定されています。平成17年（2005年）11月21日指定。&#34;}],&#34;pilgrimage_note&#34;:&#34;遠江四十九薬師霊場第49番札所／豊田郡三十三観音霊場第2番札所（享保年間開創の歴史的霊場・大正8年に磐田郡三十三観音霊場へ再編され現在は活動していない）&#34;},{&#34;temple_id&#34;:&#34;iwata-0025&#34;,&#34;slug&#34;:&#34;kenshoji-mitsuke&#34;,&#34;name&#34;:&#34;見性寺&#34;,&#34;name_kana&#34;:&#34;けんしょうじ&#34;,&#34;aliases&#34;:[&#34;瑞雲山&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;臨済宗妙心寺派&#34;,&#34;address&#34;:&#34;静岡県磐田市見付2896番地&#34;,&#34;district_id&#34;:&#34;mitsuke&#34;,&#34;area&#34;:&#34;見付&#34;,&#34;main_deity&#34;:&#34;未確認&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;現地写真あり&#34;,&#34;detail_status&#34;:&#34;公開情報調査済み&#34;,&#34;history_summary&#34;:&#34;見性寺は磐田市見付にある臨済宗妙心寺派の寺院で、山号は瑞雲山です。不動三尊立像・刺繍十六羅漢図・五鈷鈴の3件の磐田市指定文化財を所蔵し、境内には縄文時代の貝塚や盗賊日本左衛門の墓、松尾芭蕉の句碑があることで知られます。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-12&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9098&#34;},{&#34;title&#34;:&#34;市指定文化財｜磐田市公式ウェブサイト&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;不動三尊立像（彫刻・平安時代・明王寺旧本尊）、刺繍十六羅漢図（工芸品・平安時代・蓮糸刺繍）、五鈷鈴（工芸品・江戸時代・寺伝で隠元の遺品）の3件、いずれも所有者見性寺・平成17年11月21日指定をHTML原文で確認&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/sports_midokoro/bunkazai/bunkazainitsuite/1002039.html&#34;},{&#34;title&#34;:&#34;見性寺｜じゃらんnet観光ガイド（日本観光振興協会作成）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;臨済宗・創建年代不詳・磐田市見付2896。境内に縄文時代の貝塚、日本左衛門の供養塔、松尾芭蕉の句碑があることをHTML原文で確認。口コミに臨済宗妙心寺派・如意輪観音本尊・句碑3基の記載&#34;,&#34;url&#34;:&#34;https://www.jalan.net/kankou/spt_22211ag2130014149/&#34;},{&#34;title&#34;:&#34;見性寺 - Wikipedia（曖昧さ回避）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;静岡県磐田市見付の見性寺＝山号瑞雲山・臨済宗妙心寺派であることを確認&#34;,&#34;url&#34;:&#34;https://ja.wikipedia.org/wiki/%E8%A6%8B%E6%80%A7%E5%AF%BA&#34;},{&#34;title&#34;:&#34;日本左衛門 - Wikipedia&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;関連史跡として「遠州見附・見性寺に墓があり」との記述を本文で確認（首塚は金谷宿宅円庵）&#34;,&#34;url&#34;:&#34;https://ja.wikipedia.org/wiki/%E6%97%A5%E6%9C%AC%E5%B7%A6%E8%A1%9B%E9%96%80&#34;},{&#34;title&#34;:&#34;ニッポンの霊場 豊田郡三十三観音霊場&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;享保年中開創・大正8年に磐田郡三十三観音霊場として再興された旧霊場の第1番＝瑞雲山見性寺（臨済宗妙心寺派・見付2896）を確認。&#34;,&#34;url&#34;:&#34;https://nippon-reijo.jimdofree.com/%E6%8E%B2%E8%BC%89%E9%9C%8A%E5%A0%B4%E3%81%AE%E4%B8%80%E8%A6%A7/%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/%E8%B1%8A%E7%94%B0%E9%83%A1%E4%B8%89%E5%8D%81%E4%B8%89%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/&#34;},{&#34;title&#34;:&#34;臨黄ネット 寺院検索（静岡県磐田市・妙心寺派）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;一覧掲載のみ。寺名「見性寺（けんしょうじ）」・住所「見付一番町2896」を確認（台帳の見付2896と同一地点、公式検索は町名「一番町」まで記載）。本尊・由緒・行事欄は空欄。&#34;,&#34;url&#34;:&#34;https://rinnou.net/search/?prefectures=%E9%9D%99%E5%B2%A1%E7%9C%8C&#38;address_1=%E7%A3%90%E7%94%B0%E5%B8%82&#38;shuha=%E5%A6%99%E5%BF%83%E5%AF%BA%E6%B4%BE&#34;},{&#34;title&#34;:&#34;いわた文化財だより第218号&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;令和5年5月1日発行。P4「『見性寺遺跡第8次発掘調査報告書』を刊行しました」。報告書の仕様と入手方法、平成30年度の第8次発掘調査（ダイハツ磐田見付店建設に伴う）の概要を記載。&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/_res/projects/default_project/_page_/001/007/901/dayori218.pdf&#34;},{&#34;title&#34;:&#34;いわた文化財だより第221号&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;令和5年8月1日発行。企画展関連記事で見性寺遺跡出土の土器・土錘の初公開展示を紹介。&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/_res/projects/default_project/_page_/001/007/901/dayori221.pdf&#34;},{&#34;title&#34;:&#34;いわた文化財だより第251号&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;令和7年2月発行「イワタ深掘り 文化財だよりVer.③ 見性寺遺跡」。貝塚発見の経緯（昭和16年・昭和44年）、丸木舟・鎌倉時代の井戸の出土、遠江国府との関わりなど最も詳しい記述。&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/_res/projects/default_project/_page_/001/002/024/dayroi251.pdf&#34;},{&#34;title&#34;:&#34;遠江見性寺貝塚の研究（磐田市立郷土館報告第I輯、磐田市教育委員会、1974年12月発行）&#34;,&#34;type&#34;:&#34;学術資料&#34;,&#34;note&#34;:&#34;第一章調査の目的、第二章貝塚の位置及び環境（p.2、所在地：磐田市見付2896番地・瑞雲山見性寺境内）、第三章貝塚の調査（p.5〜、発掘区設定・調査経過）。全80ページ。PDF: /files/attach/17/17022/12827_1_遠江見性寺貝塚の研究.pdf&#34;,&#34;url&#34;:&#34;https://sitereports.nabunken.go.jp/ja/12827&#34;},{&#34;title&#34;:&#34;磐田市文化財保存活用地域計画（令和6年9月）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;p.53・p.81-83 見付地区の未指定文化財として「見性寺遺跡（見性寺貝塚）」を地図・一覧に記載&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/_res/projects/default_project/_page_/001/009/747/keikaku202409.pdf&#34;}],&#34;research_todos&#34;:[&#34;本尊（口コミでは如意輪観音とされる）の寺院への直接確認&#34;,&#34;境内の貝塚の正式名称・時代（縄文晩期とする口コミあり）の発掘調査報告での確認&#34;,&#34;日本左衛門の墓（供養塔）の建立経緯の郷土資料での確認&#34;,&#34;芭蕉句碑3基の句と建立年の現地確認&#34;,&#34;刺繍十六羅漢図の年代について市資料（平安時代）と民間情報（中国・明時代）の食い違いの確認&#34;,&#34;明王寺（河原町）廃寺の経緯と不動三尊像の移転時期の調査&#34;,&#34;いわた文化財だより第34号・第171号・第177号（見性寺遺跡関連の初期記事）は磐田市立図書館の電子書籍サービス収録分でビューアー未読のため本文未確認。&#34;],&#34;founded_period&#34;:&#34;創建年代不詳（観光情報データベースによる）&#34;,&#34;heritage_status&#34;:&#34;市指定文化財あり（不動三尊立像・刺繍十六羅漢図・五鈷鈴）&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;沿革と寺宝&#34;,&#34;body&#34;:&#34;臨済宗妙心寺派の寺院で、観光情報データベース（日本観光振興協会）では創建年代は不詳とされています。五鈷鈴などの寺宝を所蔵し、磐田市の資料によれば、不動三尊立像は見付の河原町にあった明王寺の本尊であったものが見性寺に移ったと記されています。刺繍十六羅漢図は江戸時代の文献にも紹介された作品です。&#34;},{&#34;heading&#34;:&#34;境内の史跡&#34;,&#34;body&#34;:&#34;境内には縄文時代の貝塚があり、白浪五人男に登場する盗賊・日本左衛門の供養塔（墓）と松尾芭蕉の句碑があります。日本左衛門（本名浜島庄兵衛）は延享4年（1747年）に見付宿で処刑された盗賊で、Wikipediaでは遠州見附の見性寺に墓があると記されています。参拝記録では山門正面に3基の句碑が並ぶと紹介されています。&#34;},{&#34;heading&#34;:&#34;文化財資料からの補足&#34;,&#34;body&#34;:&#34;見性寺が所蔵する不動三尊立像は平安時代の作で、見付河原町にあった明王寺の本尊でしたが、後に見性寺に移されました。磐田市指定有形文化財（彫刻）です。 蓮の茎や根の繊維から取った糸で刺繍した「刺繍十六羅漢図」を所蔵します。江戸時代の文献にも紹介された工芸品で、磐田市指定有形文化財です。 鋳銅製の五鈷鈴は寺伝では隠元の遺品とされ、地方における密教寺院の状況を示す資料として磐田市指定有形文化財（工芸品）になっています。&#34;},{&#34;heading&#34;:&#34;『いわた文化財だより』からの補足&#34;,&#34;body&#34;:&#34;見性寺（磐田市見付）の境内周辺には「見性寺遺跡」と呼ばれる遺跡が広がり、縄文時代の貝塚として著名である。貝塚は昭和16年（1941年）に発見され、昭和44年（1969年）の調査で貝塚や縄文土器が確認されたことでより広く知られるようになった。 平成30年度（2018年度）、ダイハツ磐田見付店の建設に伴う見性寺遺跡第8次発掘調査がおこなわれ、平安時代末期の丸木舟2艘（いずれも全長5メートル以上、スギ・マキ製）や鎌倉時代の井戸などが出土した。舟は、かつて見付周辺（今之浦地区）に広がっていた潟湖を行き交っていたものと考えられている。 見性寺遺跡からは、遠江国分寺跡と同じ文様の瓦も出土しており、水運の利と東海道による陸運の利が遠江国府が見付に置かれた背景にあったと考える資料の一つとされる。 見性寺遺跡第8次発掘調査の成果をまとめた『見性寺遺跡第8次発掘調査報告書』（A4判、本文195ページ、写真図版27ページ）が刊行され、磐田市内の図書館で閲覧できるほか、磐田市埋蔵文化財センターで1冊2,000円（郵送可）で販売されている。&#34;},{&#34;heading&#34;:&#34;発掘調査・考古資料からの補足&#34;,&#34;body&#34;:&#34;見性寺境内（磐田市見付2896番地、瑞雲山見性寺）には縄文時代後期から晩期を中心とする見性寺貝塚があり、1968年と1969年の2回、遠江考古学研究会（植松章八・尾藤院・平野吾郎ら）により発掘調査がおこなわれた。調査は本堂西側の梅林・竹林一帯を中心に実施され、縄文土器（水神平式期を含む条痕文土器）、弥生土器、古墳時代の土師器、奈良・平安時代の須恵器や布目瓦、獣骨、人骨などが出土した。 調査の結果、貝層の大半は寺院境内の整地作業により後世に攪乱・再堆積したものと判明し、整地は見性寺の建立あるいは再建に伴うものと推定されている。境内では寺院基壇の一部とみられる石敷や堅く突き固めた面も確認された。 見性寺貝塚は昭和16年（1941年）、境内の弘法堂改築に伴う土取り工事の際に貝殻・土器が発見されたのが端緒とされる。&#34;}],&#34;cultural_assets&#34;:[{&#34;name&#34;:&#34;不動三尊立像&#34;,&#34;designation&#34;:&#34;磐田市指定文化財（彫刻）&#34;,&#34;summary&#34;:&#34;平安時代の作。見付の河原町にあった明王寺の本尊でしたが、見性寺に移りました。平成17年（2005年）11月21日指定。&#34;},{&#34;name&#34;:&#34;刺繍十六羅漢図&#34;,&#34;designation&#34;:&#34;磐田市指定文化財（工芸品）&#34;,&#34;summary&#34;:&#34;磐田市の資料では平安時代とされる掛け軸で、蓮の茎や根の繊維から取った糸で衣類や器具類が刺繍されています。江戸時代の文献にも紹介された美術・工芸的に優れた作品です。平成17年（2005年）11月21日指定。&#34;},{&#34;name&#34;:&#34;五鈷鈴&#34;,&#34;designation&#34;:&#34;磐田市指定文化財（工芸品）&#34;,&#34;summary&#34;:&#34;磐田市の資料では江戸時代の鋳銅製品で、寺伝では隠元の遺品とされます。地方での密教寺院の状況を示す資料で、工芸的にも優れるとされます。平成17年（2005年）11月21日指定。&#34;}],&#34;pilgrimage_note&#34;:&#34;豊田郡三十三観音霊場第1番札所（札所本尊如意輪観世音菩薩・享保年間開創の歴史的霊場で現在は活動していない）&#34;},{&#34;temple_id&#34;:&#34;iwata-0026&#34;,&#34;slug&#34;:&#34;shinnyoji-sagisaka&#34;,&#34;name&#34;:&#34;眞如寺&#34;,&#34;name_kana&#34;:&#34;しんにょじ&#34;,&#34;aliases&#34;:[&#34;大雄山眞如寺&#34;,&#34;道休庵（旧号）&#34;,&#34;真如庵（旧号）&#34;,&#34;真如寺&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;unknown&#34;,&#34;status_label&#34;:&#34;現地痕跡未確認&#34;,&#34;detail_page&#34;:false,&#34;sect&#34;:&#34;臨済宗妙心寺派&#34;,&#34;address&#34;:&#34;静岡県磐田市匂坂上210番地の1&#34;,&#34;district_id&#34;:&#34;koyo&#34;,&#34;area&#34;:&#34;向陽&#34;,&#34;main_deity&#34;:&#34;釈迦如来&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;眞如寺は磐田市匂坂上にある臨済宗妙心寺派の寺院で、山号は大雄山、本尊は釈迦如来です。『静岡県磐田郡誌』（大正10年）によれば文明4年（1472年）の創立で、初め道休庵と号し、寛文7年（1667年）に盤珪国師を請じて開山とし、宝永元年（1704年）に大雄山眞如寺と改めて妙心寺の直末となりました。開基は匂坂善兵衛重武と伝えられ、江戸時代の地誌『遠淡海地誌』にも「匂坂家ノ内寺」と記される、戦国期の武家匂坂氏ゆかりの寺院です。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9099&#34;},{&#34;title&#34;:&#34;gBizINFO 法人情報（真如寺）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;宗教法人真如寺の所在地が静岡県磐田市匂坂上210番地の1であることを確認&#34;,&#34;url&#34;:&#34;https://info.gbiz.go.jp/hojin/ichiran?hojinBango=3080405005369&#34;},{&#34;title&#34;:&#34;静岡県磐田市の寺院・御堂一覧（サーチ寺院）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;真如寺＝磐田市匂坂上210番地の1・臨済宗妙心寺派の記載を確認。歴史情報の記載はなし&#34;,&#34;url&#34;:&#34;https://www.bukyou.com/BukyBukyou/TBukyou22/C22CNo211Detail.html&#34;},{&#34;title&#34;:&#34;『静岡県磐田郡誌』静岡県磐田郡教育会編（大正10年）コマ436（眞如寺の由緒）・コマ164（匂坂上村の領主）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション・ログインなしで閲覧可能。全文検索で該当箇所を確認&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680/1/436&#34;},{&#34;title&#34;:&#34;『遠淡海地誌』山中豊平編著（1991年翻刻版）コマ143&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション（送信サービス限定）。全文検索スニペットで「大雄山済家真如寺匂坂家ノ内寺也」を確認&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/13140820&#34;},{&#34;title&#34;:&#34;臨黄ネット 寺院検索（静岡県磐田市・妙心寺派）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;一覧掲載のみ。公式検索では新字体「真如寺（しんにょじ）」表記（台帳は眞如寺）。住所「匂坂上210-1」は台帳と一致。本尊・由緒・行事欄は空欄。&#34;,&#34;url&#34;:&#34;https://rinnou.net/search/?prefectures=%E9%9D%99%E5%B2%A1%E7%9C%8C&#38;address_1=%E7%A3%90%E7%94%B0%E5%B8%82&#38;shuha=%E5%A6%99%E5%BF%83%E5%AF%BA%E6%B4%BE&#34;}],&#34;research_todos&#34;:[&#34;山号・本尊・創建年代の確認（磐田市誌・豊田町誌等の郷土資料）&#34;,&#34;匂坂氏（戦国期の在地武士）との関係の有無の調査&#34;,&#34;妙心寺派公式資料（宗派名簿）での登録確認&#34;,&#34;現地での由緒書・石碑等の確認&#34;,&#34;旧豊田町域の寺院調査資料の確認&#34;,&#34;郡誌にいう開山「盤珪国師」が不生禅で知られる盤珪永琢（1622〜1693年）と同一人物か、妙心寺派関係資料で確認する&#34;,&#34;開基匂坂善兵衛重武と戦国期匂坂氏（匂坂六郎五郎など）との系譜関係を『磐田市史』等で確認する&#34;,&#34;字中通下坪の旧地と現在地の関係（移転の有無）を確認する&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;現況と基礎情報&#34;,&#34;body&#34;:&#34;行政の法人情報（gBizINFO）では、宗教法人真如寺の所在地は静岡県磐田市匂坂上210番地の1と登録されています。民間の寺院一覧では宗派は臨済宗妙心寺派とされています。匂坂の地は戦国期の武家・匂坂氏ゆかりの地として知られますが、眞如寺と匂坂氏の関係を示す資料は現時点では確認できていません。創建年代・山号・本尊等は未確認です。&#34;},{&#34;heading&#34;:&#34;磐田郡誌が伝える創建と沿革&#34;,&#34;body&#34;:&#34;『静岡県磐田郡誌』（磐田郡教育会編、大正10年）の岩田村眞如寺の項によれば、寺は岩田村匂坂上字中通下坪に在り、妙心寺の末葉に属し、本尊は釈迦如来です。文明4年（1472年）中の創立で、当初は道休庵と号しました。寛文7年（1667年）、盤珪国師を請じて開山とし、のち開基の匂坂善兵衛重武が地頭高木九介に願い出て真如庵と改称、さらに宝永元年（1704年）1月、西京花園の四本庵（妙心寺）へ掛け合いの上「大雄山眞如寺」と改めて妙心寺の直末となりました。同郡誌によれば、匂坂上村は江戸時代には旗本4000石高木氏の知行地で、中泉代官所支配地を管轄する高木氏の陣屋も匂坂上村に置かれていました。&#34;,&#34;sources_used&#34;:[&#34;静岡県磐田郡誌（大正10年）コマ436・164&#34;]},{&#34;heading&#34;:&#34;匂坂氏の内寺として&#34;,&#34;body&#34;:&#34;江戸時代の遠江の地誌『遠淡海地誌』は、匂坂の地について「匂坂六郎五郎殿古屋敷」などの匂坂氏関係の旧跡を記す中で、済家（臨済宗）の真如寺を「匂坂家ノ内寺也」と記しています。『静岡県磐田郡誌』の伝える開基匂坂善兵衛重武の名とあわせ、当寺が匂坂の地に土着した武家匂坂氏の一族によって営まれた寺であることが郷土資料から確認できます。&#34;,&#34;sources_used&#34;:[&#34;遠淡海地誌 コマ143&#34;,&#34;静岡県磐田郡誌（大正10年）コマ436&#34;]}],&#34;founded_period&#34;:&#34;文明4年（1472年）&#34;,&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0027&#34;,&#34;slug&#34;:&#34;myosenji-araide&#34;,&#34;name&#34;:&#34;明泉寺&#34;,&#34;name_kana&#34;:&#34;みょうせんじ&#34;,&#34;aliases&#34;:[&#34;龍池山明泉寺&#34;,&#34;全明庵（前身）&#34;,&#34;寿泉庵（前身）&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市新出613番地&#34;,&#34;district_id&#34;:&#34;mikuriya&#34;,&#34;area&#34;:&#34;御厨&#34;,&#34;main_deity&#34;:&#34;聖観世音菩薩・阿弥陀如来&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;明泉寺は磐田市新出にある曹洞宗の寺院で、山号は龍池山、本尊として聖観世音菩薩と阿弥陀如来を安置します。『静岡県磐田郡誌』（大正10年）によれば、もと当地にあった全明庵・寿泉庵の2庵が明治15年（1882年）4月14日に許可を得て合併し、今の明泉寺となりました。前身の両庵は慶長6年（1601年）に徳川氏の代官頭伊奈忠次からそれぞれ寺領約1石を寄進された歴史を持ちます。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9100&#34;},{&#34;title&#34;:&#34;明泉寺 - 曹洞禅ナビ（曹洞宗公式寺院ポータル）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;静岡県磐田市新出613の曹洞宗寺院として登録されていることを確認。歴史情報の掲載はなし&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_221001.html&#34;},{&#34;title&#34;:&#34;gBizINFO 法人情報（明泉寺）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;宗教法人明泉寺の所在地が静岡県磐田市新出613番地であることを確認&#34;,&#34;url&#34;:&#34;https://info.gbiz.go.jp/hojin/ichiran?hojinBango=8080405005471&#34;},{&#34;title&#34;:&#34;『静岡県磐田郡誌』静岡県磐田郡教育会編（大正10年）コマ450（明泉寺の由緒）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション・ログインなしで閲覧可能。全文検索で該当箇所を確認&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680/1/450&#34;},{&#34;title&#34;:&#34;『日本歴史地名大系』新出村（コトバンク）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;慶長6年の伊奈忠次による寿泉庵・全明庵への寺領寄進を確認&#34;,&#34;url&#34;:&#34;https://kotobank.jp/word/新出村&#34;},{&#34;title&#34;:&#34;『寺院大鑑 東海・北陸篇』寺院大鑑刊行会編（久遠出版、1982年）コマ36&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;国立国会図書館内限定。全文検索スニペットで磐田市曹洞宗明泉寺・新出613を確認&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/12265206&#34;}],&#34;research_todos&#34;:[&#34;山号・本尊・創建年代の確認（磐田市誌等の郷土資料）&#34;,&#34;本寺（本山との系譜）の確認&#34;,&#34;現地での由緒書・石碑等の確認&#34;,&#34;新出地区の歴史と寺の関わりの調査&#34;,&#34;年間行事・拝観可否の確認&#34;,&#34;全明庵・寿泉庵それぞれの創建年代と開山を『磐田市史』『福田町史』等で確認する&#34;,&#34;本尊が2体（聖観世音菩薩・阿弥陀如来）併安とされるのは前身2庵の本尊を継承したためか確認する&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;現況と基礎情報&#34;,&#34;body&#34;:&#34;曹洞宗公式の寺院検索サイト「曹洞禅ナビ」に、静岡県磐田市新出613の曹洞宗寺院として登録されています。行政の法人情報（gBizINFO）でも宗教法人明泉寺の所在地が磐田市新出613番地と確認できます。Wikipediaの同名寺院一覧にも「静岡県磐田市にある曹洞宗の寺院」として項目がありますが、山号・本尊・創建年代等の詳細は未確認です。&#34;},{&#34;heading&#34;:&#34;磐田郡誌が伝える由緒&#34;,&#34;body&#34;:&#34;『静岡県磐田郡誌』（磐田郡教育会編、大正10年）の南御厨村明泉寺の項によれば、寺は南御厨村新出字濱井場に在り、龍池山と号し、御厨村鎌田の全久院（現磐田市鎌田）の末寺で、本尊として聖観世音菩薩と阿弥陀如来を安置します。もと当地には全明・寿泉の2庵がありましたが、明治15年（1882年）4月14日に許可を得て合併し、今の明泉寺となりました。なお同郡誌には熊村（現浜松市天竜区）にも同名の明泉寺（方広寺末）が載っており、別の寺院なので資料調査の際は注意が必要です。&#34;,&#34;sources_used&#34;:[&#34;静岡県磐田郡誌（大正10年）コマ450&#34;]},{&#34;heading&#34;:&#34;前身2庵と江戸時代の寺領&#34;,&#34;body&#34;:&#34;『日本歴史地名大系』の新出村の項によれば、慶長6年（1601年）、徳川氏の代官頭伊奈忠次から新出村の寿泉庵に寺領1石、全明庵に寺領1石余が寄進され、正保郷帳にも全明庵領1石余・寿泉庵領1石余が記されています。この両庵が明治期に合併して成立したのが現在の明泉寺です。&#34;,&#34;sources_used&#34;:[&#34;日本歴史地名大系（新出村）&#34;]}],&#34;founded_period&#34;:&#34;明治15年（1882年）合併成立（前身の全明庵・寿泉庵は江戸時代初期以前）&#34;,&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0028&#34;,&#34;slug&#34;:&#34;jokoji-maeno&#34;,&#34;name&#34;:&#34;定光寺&#34;,&#34;name_kana&#34;:&#34;じょうこうじ&#34;,&#34;aliases&#34;:[],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市前野1773番地の1&#34;,&#34;district_id&#34;:&#34;nanbu&#34;,&#34;area&#34;:&#34;南部&#34;,&#34;main_deity&#34;:&#34;未確認&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;公開情報調査済み&#34;,&#34;history_summary&#34;:&#34;定光寺は磐田市前野にある曹洞宗の寺院です。平安時代末から鎌倉時代初期の作とされる木造千手観音菩薩立像（磐田市指定文化財）を所蔵し、令和6〜7年度にはクラウドファンディングによる同像の大規模修復が行われました。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-12&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9101&#34;},{&#34;title&#34;:&#34;市指定文化財｜磐田市公式ウェブサイト&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;木造千手観音菩薩立像（彫刻・平安時代〜鎌倉時代・所有者定光寺・平成17年11月21日指定・全長171cm・県西部で希少）をHTML原文で確認&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/sports_midokoro/bunkazai/bunkazainitsuite/1002039.html&#34;},{&#34;title&#34;:&#34;千手観音像 - 定光寺公式サイト&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;像がもと末寺蓮華寺の本尊で廃寺後に飛び地境内の観音堂に祀られたこと、平成13年調査で脚部の損傷が報告されたこと、クラウドファンディングにより令和6〜7年度に大規模修復を実施したことを本文で確認&#34;,&#34;url&#34;:&#34;https://jokouji.com/senjukannon/&#34;},{&#34;title&#34;:&#34;定光寺 - 曹洞禅ナビ（曹洞宗公式寺院ポータル）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;静岡県磐田市前野1773-1の曹洞宗寺院として登録されていることを確認&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220919.html&#34;},{&#34;title&#34;:&#34;定光寺公式サイト（トップページ）&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;曹洞宗・磐田市前野1773-1。クラウドファンディングの目標額達成（当初300万円・追加450万円）を確認&#34;,&#34;url&#34;:&#34;https://jokouji.com/&#34;},{&#34;title&#34;:&#34;ニッポンの霊場 磐田郡三十三観音霊場&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;第7番＝八王山定光寺（曹洞宗・前野1773・御本尊阿弥陀如来／霊場御本尊十一面観世音菩薩）を確認。敷地の浄光寺（別寺院）ではなく前野の定光寺であることを住所で確認。&#34;,&#34;url&#34;:&#34;https://nippon-reijo.jimdofree.com/%E6%8E%B2%E8%BC%89%E9%9C%8A%E5%A0%B4%E3%81%AE%E4%B8%80%E8%A6%A7/%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/%E7%A3%90%E7%94%B0%E9%83%A1%E4%B8%89%E5%8D%81%E4%B8%89%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/&#34;},{&#34;title&#34;:&#34;永代供養 - 定光寺&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;永代供養の内容・条件（檀家不要、宗旨宗派不問、彼岸・お盆の法要実施）を確認&#34;,&#34;url&#34;:&#34;https://jokouji.com/eitai/&#34;},{&#34;title&#34;:&#34;寺院概要 - 定光寺&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;由緒・沿革・本堂再建時の壇信徒協力・末寺関係の記述を確認&#34;,&#34;url&#34;:&#34;https://jokouji.com/aboutus/&#34;},{&#34;title&#34;:&#34;法事法要 - 定光寺&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;葬儀・法事の受付方針（お布施は「お気持ちで」）を確認、年中行事の記載はなし&#34;,&#34;url&#34;:&#34;https://jokouji.com/houji/&#34;},{&#34;title&#34;:&#34;交通案内 - 定光寺&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;電車・車でのアクセス記載を確認、駐車場情報の明記はなし&#34;,&#34;url&#34;:&#34;https://jokouji.com/access/&#34;}],&#34;research_todos&#34;:[&#34;定光寺自体の山号・本尊・創建年代の確認（公式サイトの寺院概要ページまたは磐田市誌）&#34;,&#34;末寺蓮華寺の所在地と廃寺の時期の調査&#34;,&#34;修復完了後の千手観音像の安置場所・公開状況の確認&#34;,&#34;静岡新聞記事にある「約1000年の歴史」という記述の典拠確認&#34;,&#34;観音堂（飛び地境内）の場所の現地確認&#34;,&#34;曹洞禅ナビ復旧後に詳細ページ（index_220919）を再確認（調査時サーバー障害で未取得）&#34;,&#34;護持会・世話人会の正式名称と活動内容の現地確認&#34;,&#34;駐車場の有無・台数の現地確認&#34;,&#34;施餓鬼会・彼岸会等の具体的な年中行事日程の現地確認（公式サイトに記載なし）&#34;],&#34;heritage_status&#34;:&#34;市指定文化財あり（木造千手観音菩薩立像）&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;木造千手観音菩薩立像&#34;,&#34;body&#34;:&#34;磐田市の資料によれば、定光寺所有の木造千手観音菩薩立像は平安時代末から鎌倉時代初期に作られた全長171cmの菩薩立像で、この時期の菩薩立像は県西部では少ないとされ、平成17年（2005年）11月21日に磐田市指定文化財（彫刻）に指定されました。寺の公式サイトによれば、この像はもと定光寺の末寺であった蓮華寺の本尊として祀られていましたが、蓮華寺の廃寺後は定光寺の飛び地境内の観音堂に安置されています。&#34;},{&#34;heading&#34;:&#34;令和の大修復&#34;,&#34;body&#34;:&#34;定光寺公式サイトによれば、平成13年（2001年）の調査で像の脚部の腐敗・損傷が報告され、クラウドファンディングで資金を募り、令和6年度から令和7年度の2年間をかけた大規模な修復が実施されました。クラウドファンディングは当初目標額300万円と追加目標450万円をいずれも達成しています。この修復は静岡新聞・中日新聞・テレビ静岡などの報道でも取り上げられました。&#34;},{&#34;heading&#34;:&#34;文化財資料からの補足&#34;,&#34;body&#34;:&#34;定光寺が所蔵する木造千手観音菩薩立像は、平安時代末から鎌倉時代初期に作られた全長171センチメートルの菩薩立像です。この時期の菩薩立像は県西部では少なく、磐田市指定有形文化財（彫刻）に指定されています。&#34;},{&#34;heading&#34;:&#34;檀家向け情報の補足&#34;,&#34;body&#34;:&#34;寺院概要ページによれば、定光寺は開創年月日・開基不明ながら、慶長3年（1598年）3月22日に袋井市久能可睡斎18世華亭豚秀和尚が中興し真言宗から曹洞宗に改めたとされる。慶安元年（1648年）9月17日には徳川家光より石高12石9斗の朱印を賜った。当初は字上下にあったが3世元峰和尚の代に現在地へ移転し、昭和53年（1978年）位牌堂、平成3年（1991年）書院庫裡、平成20年（2008年）7月に本堂を再建した。&#34;}],&#34;cultural_assets&#34;:[{&#34;name&#34;:&#34;木造千手観音菩薩立像&#34;,&#34;designation&#34;:&#34;磐田市指定文化財（彫刻）&#34;,&#34;summary&#34;:&#34;平安時代末から鎌倉時代初期に作られた全長171cmの菩薩立像で、この時期の菩薩立像は県西部で少ないとされます。もと末寺蓮華寺の本尊で、現在は飛び地境内の観音堂に祀られています。平成17年（2005年）11月21日指定。&#34;}],&#34;pilgrimage_note&#34;:&#34;磐田郡三十三観音霊場第7番札所（札所本尊十一面観世音菩薩）&#34;,&#34;danka_info&#34;:{&#34;official_site&#34;:{&#34;status&#34;:&#34;あり&#34;,&#34;url&#34;:&#34;https://jokouji.com/&#34;,&#34;checked_at&#34;:&#34;2026-07-12&#34;},&#34;cemetery&#34;:&#34;後継者がいない人向けの永代供養を実施。檀家になる必要はなく、宗旨宗派を問わず、年会費・管理費もかからない。生前予約も可能で、彼岸・お盆には曹洞宗の作法に基づく法要を営む（永代供養料は要問合せ）。&#34;,&#34;organization&#34;:&#34;護持会等の名称は公式サイト上には明記されていないが、平成20年（2008年）7月の本堂再建に際し「壇信徒および関係各位の御理解、御協力」により事業が実施されたことが寺院概要ページに記されており、檀信徒による護持体制がうかがえる。&#34;,&#34;community_role&#34;:&#34;末寺数ヶ寺との関係があり、本堂再建時には末寺の本尊も本堂西室に安座されたと寺院概要ページに記載がある。&#34;,&#34;parking&#34;:&#34;公式サイトの交通案内ページに駐車場に関する記載はなし（要問合せ）&#34;}},{&#34;temple_id&#34;:&#34;iwata-0029&#34;,&#34;slug&#34;:&#34;jissaiji-samejima&#34;,&#34;name&#34;:&#34;実際寺&#34;,&#34;name_kana&#34;:&#34;じっさいじ&#34;,&#34;aliases&#34;:[&#34;真如山実際寺&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市鮫島202番地&#34;,&#34;district_id&#34;:&#34;nanbu&#34;,&#34;area&#34;:&#34;南部&#34;,&#34;main_deity&#34;:&#34;阿弥陀如来&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;実際寺は磐田市鮫島にある曹洞宗の寺院で、山号は真如山、本尊は阿弥陀如来です。『静岡県磐田郡誌』（大正10年）によれば天正年間（1573〜1592年）の初めに存祝という者が開いたと伝えられ、天龍村の十輪寺の末寺（可睡斎の孫末）でした。江戸時代には朱印寺領2石を認められ、可睡斎の僧録司文書にもその名が見えます。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9102&#34;},{&#34;title&#34;:&#34;実際寺 - 曹洞禅ナビ（曹洞宗公式寺院ポータル）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;静岡県磐田市鮫島202の曹洞宗寺院として登録されていることを確認。歴史情報の掲載はなし&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220922.html&#34;},{&#34;title&#34;:&#34;鮫島（磐田市） - Wikipedia&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;鮫島地区の施設一覧に実際寺が記載されていることを確認（歴史記述はなし）&#34;,&#34;url&#34;:&#34;https://ja.wikipedia.org/wiki/%E9%AE%AB%E5%B3%B6_(%E7%A3%90%E7%94%B0%E5%B8%82)&#34;},{&#34;title&#34;:&#34;静岡県磐田市の寺院・御堂一覧（サーチ寺院）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;実際寺＝磐田市鮫島202番地・曹洞宗（法人番号2080405005361）の記載を確認&#34;,&#34;url&#34;:&#34;https://www.bukyou.com/BukyBukyou/TBukyou22/C22CNo211Detail.html&#34;},{&#34;title&#34;:&#34;『静岡県磐田郡誌』静岡県磐田郡教育会編（大正10年）コマ454（実際寺の由緒）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション・ログインなしで閲覧可能。全文検索で該当箇所を確認&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680/1/454&#34;},{&#34;title&#34;:&#34;『可睡斎史料集』第1巻（寺誌史料）コマ161・第4巻（僧録司文書3）コマ188・第5巻（僧録司記録1）コマ250（思文閣出版）&#34;,&#34;type&#34;:&#34;学術資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション（館内限定）の全文検索スニペットで確認。朱印2石・両社領2石・慶安2年家光朱印など&#34;},{&#34;title&#34;:&#34;『日本歴史地名大系』鮫島村（コトバンク）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;実際寺（現曹洞宗）領2石・伊勢神明領1石・天神領1石を確認&#34;,&#34;url&#34;:&#34;https://kotobank.jp/word/鮫島村&#34;}],&#34;research_todos&#34;:[&#34;山号・本尊・創建年代の確認（磐田市誌・福田町史等の郷土資料）&#34;,&#34;鮫島地区の漁業・製塩など地域史との関わりの調査&#34;,&#34;現地での由緒書・石碑等の確認&#34;,&#34;年間行事・拝観可否の確認&#34;,&#34;本寺（本山との系譜）の確認&#34;,&#34;開山（開創者）存祝の伝記的事項を『磐田市史』等で確認する&#34;,&#34;本寺十輪寺（旧天龍村）の現所在地と現在の本末関係を確認する&#34;,&#34;朱印状6通の現存状況を確認する&#34;,&#34;曹洞禅ナビ復旧後に詳細ページ（index_220922）を再確認（調査時サーバー障害で未取得）&#34;,&#34;曹洞禅ナビの実際寺ページ（https://sotozen-navi.com/detail/index_220922.html）は公式ホームページ・Facebookページ・Instagramページの存在を示すリンク項目を掲載しているが、JavaScript経由のリンクのためURLをテキスト取得できなかった。ブラウザで直接開いてURLを確認し、年中行事・墓地・護持会情報を追加調査する必要がある。&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;現況と基礎情報&#34;,&#34;body&#34;:&#34;曹洞宗公式の寺院検索サイト「曹洞禅ナビ」に、静岡県磐田市鮫島202の曹洞宗寺院として登録されています。Wikipediaの鮫島（磐田市）の項でも地区内の施設として実際寺の名が挙げられています。鮫島は磐田市南部の海岸に近い地区で、江戸時代は豊田郡鮫島村、明治の町村制以降は磐田郡長野村の大字でした。&#34;,&#34;sources_used&#34;:[&#34;曹洞禅ナビ&#34;,&#34;Wikipedia&#34;]},{&#34;heading&#34;:&#34;磐田郡誌が伝える由緒&#34;,&#34;body&#34;:&#34;『静岡県磐田郡誌』（磐田郡教育会編、大正10年）の長野村実際寺の項によれば、寺は長野村鮫島（現磐田市鮫島）に在り、真如山と号し、天龍村十輪寺の末寺で、本尊は阿弥陀如来です。天正の初め、存祝という者がこれを創めたと伝えられます。&#34;,&#34;sources_used&#34;:[&#34;静岡県磐田郡誌（大正10年）コマ454&#34;]},{&#34;heading&#34;:&#34;江戸時代の寺領と本末関係&#34;,&#34;body&#34;:&#34;遠州の曹洞宗僧録司であった可睡斎の記録集『可睡斎史料集』第1巻（寺誌史料）には「可睡斎孫末十輪寺末寺 遠江国豊田郡鮫島村実際寺 御朱印弐石 御朱印両社領二石」と記され、第5巻（僧録司記録1）には慶安2年（1649年）11月17日の大猷院（徳川家光）朱印状をはじめ、実際寺が朱印状6通と神明・天神両社領の朱印を所持していたことが記されています。『日本歴史地名大系』の鮫島村の項にも実際寺（現曹洞宗）領2石のほか伊勢神明領1石・天神領1石が記されており、実際寺が両社の別当的な位置にあったことがうかがえます。&#34;,&#34;sources_used&#34;:[&#34;可睡斎史料集 第1巻・第4巻・第5巻&#34;,&#34;日本歴史地名大系（鮫島村）&#34;]}],&#34;founded_period&#34;:&#34;天正年間初頭（1573年頃）&#34;,&#34;cultural_assets&#34;:[],&#34;danka_info&#34;:{}},{&#34;temple_id&#34;:&#34;iwata-0030&#34;,&#34;slug&#34;:&#34;koganji-kusasaki&#34;,&#34;name&#34;:&#34;光嚴寺&#34;,&#34;name_kana&#34;:&#34;こうがんじ&#34;,&#34;aliases&#34;:[&#34;光厳寺（新字体表記）&#34;,&#34;湯沢山光厳寺&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市草崎644番地の1&#34;,&#34;district_id&#34;:&#34;nanbu&#34;,&#34;area&#34;:&#34;南部&#34;,&#34;main_deity&#34;:&#34;薬師如来&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;光嚴寺（光厳寺）は磐田市草崎にある曹洞宗の寺院で、山号は湯沢山、本尊は薬師如来（医王薬師如来）です。『静岡県磐田郡誌』（大正10年）によれば、慶長10年（1605年）12月、袖浦村（現磐田市岡）の聖寿寺7世全雄の弟子儀伝が開創しました。草崎の他の諸寺と同じく聖寿寺の末寺で、この一帯が聖寿寺の教線下にあったことを示しています。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9103&#34;},{&#34;title&#34;:&#34;gBizINFO 法人情報（光嚴寺）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;宗教法人光嚴寺（旧字体表記）の所在地が静岡県磐田市草崎644番地の1であることを確認&#34;,&#34;url&#34;:&#34;https://info.gbiz.go.jp/hojin/ichiran?hojinBango=4080405005343&#34;},{&#34;title&#34;:&#34;静岡県磐田市の寺院・御堂一覧（サーチ寺院）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;光厳寺＝磐田市草崎644番地の1・曹洞宗の記載を確認。歴史情報の記載はなし&#34;,&#34;url&#34;:&#34;https://www.bukyou.com/BukyBukyou/TBukyou22/C22CNo211Detail.html&#34;},{&#34;title&#34;:&#34;『静岡県磐田郡誌』静岡県磐田郡教育会編（大正10年）コマ455（光嚴寺の由緒）・コマ457（聖寿寺の朱印高）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション・ログインなしで閲覧可能。全文検索で該当箇所を確認&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680/1/455&#34;},{&#34;title&#34;:&#34;曹洞禅ナビ 磐田市寺院一覧&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;磐田市の公式一覧（全61寺）に「光嚴寺」として掲載を確認（一覧掲載のみ確認）。詳細ページはサーバー障害で未取得。Web検索で出る寛治5年（1091年）創建の由緒は石巻市の同名寺のもので本寺とは無関係&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220948.html&#34;}],&#34;research_todos&#34;:[&#34;山号・本尊・創建年代の確認（磐田市誌・福田町史等の郷土資料）&#34;,&#34;曹洞禅ナビ（宗派公式）での登録有無の再確認&#34;,&#34;現地での由緒書・石碑等の確認&#34;,&#34;草崎地区の歴史と寺の関わりの調査&#34;,&#34;寺号の正式表記（光嚴寺／光厳寺）の寺院への確認&#34;,&#34;開山儀伝のその後の経歴や寺の近代以降の沿革を『磐田市史』『福田町史』等で確認する&#34;,&#34;本寺聖寿寺（磐田市岡）との現在の本末関係を確認する&#34;,&#34;曹洞禅ナビ復旧後に詳細ページ（index_220948）を再確認（調査時サーバー障害で未取得）。宮城県石巻市の同名寺・光嚴寺（index_40324、寛治5年創建の由緒あり）と混同しないこと&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;現況と基礎情報&#34;,&#34;body&#34;:&#34;行政の法人情報（gBizINFO）では、宗教法人の登録名は旧字体の「光嚴寺」で、所在地は静岡県磐田市草崎644番地の1です。民間の寺院一覧では宗派は曹洞宗とされています。草崎は磐田市南部の地区ですが、寺の山号・本尊・創建年代等の詳細は未確認です。&#34;},{&#34;heading&#34;:&#34;磐田郡誌が伝える由緒&#34;,&#34;body&#34;:&#34;『静岡県磐田郡誌』（磐田郡教育会編、大正10年）の長野村光嚴寺の項によれば、寺は長野村草崎字中村（現磐田市草崎）に在り、湯沢山と号し、袖浦村聖寿寺の末寺で、本尊は医王薬師如来です。聖寿寺7世全雄の弟子儀伝という者が、慶長10年（1605年）12月にこれを開創しました。同郡誌によれば、草崎には光嚴寺のほか萬然寺・徳源庵・良照庵・寿正寺といった聖寿寺末の寺庵が並んでおり、いずれも慶長から寛永にかけて聖寿寺の歴代住持の弟子たちによって開かれています。本寺の聖寿寺は曹洞宗佐野郡奥野長松院末の有力寺院で、慶安元年（1648年）に朱印高12石9斗余を認められ、多くの末寺を有していました。&#34;,&#34;sources_used&#34;:[&#34;静岡県磐田郡誌（大正10年）コマ455・457&#34;]}],&#34;founded_period&#34;:&#34;慶長10年（1605年）&#34;,&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0031&#34;,&#34;slug&#34;:&#34;shokoji-shirabyoshi&#34;,&#34;name&#34;:&#34;正光寺&#34;,&#34;name_kana&#34;:&#34;しょうこうじ&#34;,&#34;aliases&#34;:[&#34;宝用山正光寺&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市白拍子358番地&#34;,&#34;district_id&#34;:&#34;nanbu&#34;,&#34;area&#34;:&#34;南部&#34;,&#34;main_deity&#34;:&#34;虚空蔵菩薩&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;正光寺は磐田市白拍子にある曹洞宗の寺院で、山号は宝用山、本尊は虚空蔵菩薩です。『静岡県磐田郡誌』（大正10年）によれば、慶長7年（1602年）に当所の鈴木藤右衛門が開基となって創建され、甲州八代郡にある正光寺と有縁であったことからこの寺号にしたと伝えられます。正保元年（1644年）には本寺である袖浦村（現磐田市岡）聖寿寺の8世月堂の弟子昌堂を迎えています。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9104&#34;},{&#34;title&#34;:&#34;gBizINFO 法人情報（正光寺）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;宗教法人正光寺の所在地が静岡県磐田市白拍子358番地であることを確認&#34;,&#34;url&#34;:&#34;https://info.gbiz.go.jp/hojin/ichiran?hojinBango=8080405005397&#34;},{&#34;title&#34;:&#34;静岡県磐田市の寺院・御堂一覧（サーチ寺院）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;正光寺＝磐田市白拍子358番地・曹洞宗の記載を確認。歴史情報の記載はなし&#34;,&#34;url&#34;:&#34;https://www.bukyou.com/BukyBukyou/TBukyou22/C22CNo211Detail.html&#34;},{&#34;title&#34;:&#34;『静岡県磐田郡誌』静岡県磐田郡教育会編（大正10年）コマ454（正光寺の由緒）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション・ログインなしで閲覧可能。全文検索で該当箇所を確認&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680/1/454&#34;},{&#34;title&#34;:&#34;曹洞禅ナビ 磐田市寺院一覧&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;磐田市の公式一覧（全61寺）に「正光寺」として掲載を確認（一覧掲載のみ確認）。詳細ページはサーバー障害で未取得&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220955.html&#34;}],&#34;research_todos&#34;:[&#34;山号・本尊・創建年代の確認（磐田市誌・福田町史等の郷土資料）&#34;,&#34;曹洞禅ナビ（宗派公式）での登録有無の再確認&#34;,&#34;白拍子という地名の由来と寺の関わりの調査&#34;,&#34;現地での由緒書・石碑等の確認&#34;,&#34;見付の省光寺との資料上の混同がないかの検証&#34;,&#34;正保元年に昌堂を迎えた記事の続き（法地開闢か中興開山か）を郡誌原本の次頁で確認する&#34;,&#34;開基鈴木藤右衛門と甲州八代郡正光寺との縁の内容を確認する&#34;,&#34;曹洞禅ナビ復旧後に詳細ページ（index_220955）を再確認（調査時サーバー障害で未取得）&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;現況と基礎情報&#34;,&#34;body&#34;:&#34;行政の法人情報（gBizINFO）では、宗教法人正光寺の所在地は静岡県磐田市白拍子358番地と登録されています。民間の寺院一覧では宗派は曹洞宗とされています。磐田市内には見付に読みの同じ省光寺があるため、資料調査の際は白拍子の正光寺との混同に注意が必要です。山号・本尊・創建年代等の詳細は未確認です。&#34;},{&#34;heading&#34;:&#34;磐田郡誌が伝える由緒&#34;,&#34;body&#34;:&#34;『静岡県磐田郡誌』（磐田郡教育会編、大正10年）の長野村正光寺の項によれば、寺は長野村白拍子字宮北（現磐田市白拍子）に在り、宝用山と号し、袖浦村聖寿寺の末寺で、本尊は虚空蔵菩薩です。伝えによれば、当寺は慶長7年（1602年）、当所の鈴木藤右衛門という者の開基で、甲州八代郡に正光寺と称する寺があり、有縁の寺であることから当寺の寺号としたといいます。正保元年（1644年）には聖寿寺8世月堂の弟子昌堂を迎えたことが記されています。&#34;,&#34;sources_used&#34;:[&#34;静岡県磐田郡誌（大正10年）コマ454&#34;]}],&#34;founded_period&#34;:&#34;慶長7年（1602年）&#34;,&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0032&#34;,&#34;slug&#34;:&#34;taigetsuan-sagisaka&#34;,&#34;name&#34;:&#34;太月庵&#34;,&#34;name_kana&#34;:&#34;たいげつあん&#34;,&#34;aliases&#34;:[&#34;大月庵&#34;,&#34;観田山太月庵&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市匂坂上59番地の1&#34;,&#34;district_id&#34;:&#34;koyo&#34;,&#34;area&#34;:&#34;向陽&#34;,&#34;main_deity&#34;:&#34;地蔵菩薩&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;太月庵（たいげつあん）は磐田市匂坂上にある曹洞宗の寺院で、山号は観田山、本尊は地蔵菩薩です。『静岡県磐田郡誌』（大正10年）によれば文亀2年（1502年）に字西通下坪に開かれ、のち現在地に移りました。匂坂中の増参寺の末寺で、慶長6年（1601年）には徳川氏の代官頭伊奈忠次から寺領1石を寄進され、その証文の写しは「太月庵文書」として『静岡県史料』などの史料集に収録されています。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9105&#34;},{&#34;title&#34;:&#34;磐田北部ありがた歩記（磐田市観光協会パンフレット）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;地図帳に匂坂地区の寺院「大月庵」として掲載。大月庵の交差点に面したところに時計台がある旨の記述を確認。&#34;,&#34;url&#34;:&#34;https://kanko-iwata.jp/wp2/wp-content/uploads/2023/06/B4_hokubu.pdf&#34;},{&#34;title&#34;:&#34;サーチ寺院 静岡県磐田市の寺院一覧&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;太月庵＝磐田市匂坂上59番地の1・曹洞宗であることを確認。&#34;,&#34;url&#34;:&#34;https://www.bukyou.com/BukyBukyou/TBukyou22/C22CNo211Detail.html&#34;},{&#34;title&#34;:&#34;太月庵（静岡県磐田市）お寺情報（やさしいお葬式）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;磐田市匂坂上59-1の曹洞宗寺院であることを確認。由緒・本尊の記載なし。&#34;,&#34;url&#34;:&#34;https://y-osohshiki.com/obousan/sizuoka/temple/1614&#34;},{&#34;title&#34;:&#34;『静岡県磐田郡誌』静岡県磐田郡教育会編（大正10年）コマ461〜462（太月庵の由緒）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション・ログインなしで閲覧可能。全文検索で該当箇所を確認&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680/1/461&#34;},{&#34;title&#34;:&#34;『日本歴史地名大系』匂坂上村（コトバンク）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;慶長6年（1601年）伊奈忠次による太月庵への寺領1石寄進を確認&#34;,&#34;url&#34;:&#34;https://kotobank.jp/word/匂坂上村&#34;},{&#34;title&#34;:&#34;『静岡県史料』第5輯（静岡県編、昭和16年）コマ213〜215「太月庵文書」&#34;,&#34;type&#34;:&#34;学術資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクションの全文検索スニペットで「太月庵文書」の収録を確認&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/13131505&#34;},{&#34;title&#34;:&#34;『伊奈忠次文書集成』和泉清司編（文献出版、1981年）コマ90「寺領證文（写）〔太月庵文書〕」&#34;,&#34;type&#34;:&#34;学術資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション（送信サービス限定）の全文検索スニペットで確認&#34;},{&#34;title&#34;:&#34;『東海道見付宿の助郷』清水秀明編著（1990年）コマ108&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;匂坂上村の除地1石の曹洞宗太月庵の記述。送信サービス限定&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/13318467&#34;},{&#34;title&#34;:&#34;『旧高旧領取調帳 中部編』木村礎校訂（東京堂出版、1995年）コマ75&#34;,&#34;type&#34;:&#34;学術資料&#34;,&#34;note&#34;:&#34;太月菴領1石の記載を全文検索スニペットで確認&#34;},{&#34;title&#34;:&#34;『寺谷用水改良始末一斑』（明治24年）コマ9&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;「太月庵西井口」の地点名を確認。国立国会図書館デジタルコレクション・ログインなしで閲覧可能&#34;},{&#34;title&#34;:&#34;曹洞禅ナビ 磐田市寺院一覧&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;磐田市の公式一覧（全61寺）に「太月庵」として掲載を確認（一覧掲載のみ確認。公式側の表記は「太月庵」）。詳細ページはサーバー障害で未取得&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220969.html&#34;}],&#34;research_todos&#34;:[&#34;「太月庵」と「大月庵」の正式表記を寺院・宗派名簿で確認する&#34;,&#34;創建年代・山号・本尊を『磐田市誌』『磐田郡誌』等の郷土資料で調査する&#34;,&#34;匂坂を本拠とした匂坂氏や匂坂城・匂坂館との関係の有無を調査する&#34;,&#34;本末関係（本寺がどの寺か）を確認する&#34;,&#34;大月庵交差点の時計台の由来と境内の現況を現地確認する&#34;,&#34;郡誌の移転年「文禄十三年」の原本表記を確認する（文禄は5年まで。文禄3年または別年号の誤植の可能性）&#34;,&#34;太月庵文書（伊奈忠次寺領証文写）の現存・所蔵先を確認する&#34;,&#34;本寺増参寺（匂坂中）との現在の本末関係を確認する&#34;,&#34;曹洞禅ナビ復旧後に詳細ページ（index_220969）を再確認（調査時サーバー障害で未取得）&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;所在と確認できる情報&#34;,&#34;body&#34;:&#34;磐田市匂坂上に所在する曹洞宗の寺院です。全国寺院名簿系の資料では「太月庵」（磐田市匂坂上59番地の1・曹洞宗）として掲載されています。磐田市観光協会発行の寺社めぐりパンフレット「磐田北部ありがた歩記」の地図帳には、匂坂地区の寺院として「大月庵」の表記で掲載されています。同資料には、大月庵の交差点に面したところに、いつの頃からか時計台がある、との記述があり、寺名が交差点名として地域に定着していることがうかがえます。『遠淡海地誌』でも「大月庵」の表記が使われており、太月・大月の両表記は江戸時代から併存していたとみられます。&#34;,&#34;sources_used&#34;:[&#34;磐田北部ありがた歩記&#34;,&#34;遠淡海地誌&#34;]},{&#34;heading&#34;:&#34;磐田郡誌が伝える由緒&#34;,&#34;body&#34;:&#34;『静岡県磐田郡誌』（磐田郡教育会編、大正10年）の岩田村太月庵の項によれば、庵は岩田村匂坂上（現磐田市匂坂上）に在り、観田山と号し、当村増参寺（匂坂中の曹洞宗寺院）の末寺で、本尊は地蔵菩薩です。文亀2年（1502年）、字西通下坪に観田山太月庵を開き、のち今の地に移したと記されています。なお郡誌の移転年は「文禄十三年」と印刷されていますが、文禄は5年までしかない年号のため、原本表記の確認が必要です。&#34;,&#34;sources_used&#34;:[&#34;静岡県磐田郡誌（大正10年）コマ461・462&#34;]},{&#34;heading&#34;:&#34;江戸時代の寺領と太月庵文書&#34;,&#34;body&#34;:&#34;『日本歴史地名大系』の匂坂上村の項によれば、慶長6年（1601年）、太月庵は徳川氏の代官頭伊奈忠次により寺領1石を寄進されました。この寺領証文の写しは「太月庵文書」として『静岡県史料』第5輯や『伊奈忠次文書集成』『江戸幕府代官頭文書集成』に収録されています。『東海道見付宿の助郷』も匂坂上村の項で「除地1石の曹洞宗太月庵があった」と記し、明治初年の『旧高旧領取調帳』にも太月菴領1石が載ります。江戸時代の地誌『遠淡海地誌』にも「壱石御除地 曹洞大月庵領」と見え、磐田市誌シリーズ『天竜川流域の暮らしと文化』上巻も近世匂坂上村の除地として太月庵領（1石）を挙げています。また明治24年（1891年）刊の『寺谷用水改良始末一斑』には用水路の地点名として「太月庵西井口」が見え、庵が寺谷用水沿いの目印となっていたことがうかがえます。&#34;,&#34;sources_used&#34;:[&#34;日本歴史地名大系（匂坂上村）&#34;,&#34;静岡県史料 第5輯&#34;,&#34;伊奈忠次文書集成&#34;,&#34;東海道見付宿の助郷&#34;,&#34;旧高旧領取調帳 中部編&#34;,&#34;遠淡海地誌&#34;,&#34;天竜川流域の暮らしと文化 上巻&#34;,&#34;寺谷用水改良始末一斑&#34;]}],&#34;founded_period&#34;:&#34;文亀2年（1502年）&#34;,&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0033&#34;,&#34;slug&#34;:&#34;zosanji-sagisaka&#34;,&#34;name&#34;:&#34;増参寺&#34;,&#34;name_kana&#34;:&#34;ぞうさんじ&#34;,&#34;aliases&#34;:[&#34;岩田山&#34;,&#34;蔵参庵&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市匂坂中586番地&#34;,&#34;district_id&#34;:&#34;koyo&#34;,&#34;area&#34;:&#34;向陽&#34;,&#34;main_deity&#34;:&#34;釈迦牟尼如来&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;公開情報調査済み&#34;,&#34;history_summary&#34;:&#34;増参寺（ぞうさんじ）は磐田市匂坂中にある曹洞宗の寺院で、山号は岩田山、本尊は釈迦牟尼如来です。磐田市観光協会の資料によれば、応仁2年（1468年）に社山城主・匂坂太郎左衛門尉が建立した蔵参庵を前身とし、永禄7年（1564年）にこの地にあった磐田寺と合わせて岩田山増参寺となったと伝えられます。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9106&#34;},{&#34;title&#34;:&#34;磐田北部ありがた歩記（磐田市観光協会パンフレット）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;山号岩田山・宗派曹洞宗・本尊釈迦牟尼如来、応仁2年（1468）蔵参庵建立、永禄7年（1564）磐田寺と合わせて岩田山増参寺となった沿革、ソテツ・力石・神武天皇像の記述を確認。&#34;,&#34;url&#34;:&#34;https://kanko-iwata.jp/wp2/wp-content/uploads/2023/06/B4_hokubu.pdf&#34;},{&#34;title&#34;:&#34;サーチ寺院 静岡県磐田市の寺院一覧&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;増参寺＝磐田市匂坂中586番地・曹洞宗であることを確認。&#34;,&#34;url&#34;:&#34;https://www.bukyou.com/BukyBukyou/TBukyou22/C22CNo211Detail.html&#34;},{&#34;title&#34;:&#34;ニッポンの霊場 磐田郡三十三観音霊場&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;第12番＝岩田山増参寺（曹洞宗・匂坂中586）を確認。なお豊田郡三十三観音の旧札所（観音寺・養生寺・伊清寺、いずれも廃寺）が増参寺に併合されたとの記載あり。&#34;,&#34;url&#34;:&#34;https://nippon-reijo.jimdofree.com/%E6%8E%B2%E8%BC%89%E9%9C%8A%E5%A0%B4%E3%81%AE%E4%B8%80%E8%A6%A7/%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/%E7%A3%90%E7%94%B0%E9%83%A1%E4%B8%89%E5%8D%81%E4%B8%89%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/&#34;},{&#34;title&#34;:&#34;曹洞禅ナビ 増参寺&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;公式一覧掲載を確認。検索エンジンに索引された公式ページ情報で住所（〒438-0004 磐田市匂坂中586）が一致することを確認。詳細ページ本体はサーバー障害で未取得のため、本尊・由緒欄の有無は未確認&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220956.html&#34;},{&#34;title&#34;:&#34;いわた文化財だより第229号&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;令和6年4月1日発行。P1〜2「磐田市指定無形民俗文化財 大めし祭り」。増参寺住職による読経（大般若経・法華経）と、旧東光寺の本寺である旨を記載。&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/_res/projects/default_project/_page_/001/002/024/dayori229.pdf&#34;}],&#34;research_todos&#34;:[&#34;合併したと伝わる「磐田寺」の詳細（読み・宗派・位置）を郷土資料で確認する&#34;,&#34;蔵参庵から増参寺への改称経緯を『磐田市誌』等で裏付ける&#34;,&#34;境内のソテツの現況・樹齢を現地確認する&#34;,&#34;参道横の力石にまつわる昔話の内容を採録する&#34;,&#34;匂坂氏の菩提寺としての位置づけ（匂坂家墓所は近隣の真如寺と伝わる）との関係を整理する&#34;,&#34;曹洞禅ナビ復旧後に詳細ページ（index_220956）を再確認（調査時サーバー障害で未取得）&#34;],&#34;founded_period&#34;:&#34;応仁2年（1468年）に前身の蔵参庵が建立されたと伝わる。永禄7年（1564年）に岩田山増参寺となる&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;創建と沿革&#34;,&#34;body&#34;:&#34;磐田市観光協会の「磐田北部ありがた歩記」によれば、応仁2年（1468年）に社山城（現在の袋井市）の城主・匂坂太郎左衛門尉が蔵参庵を建立したのが始まりと伝えられます。その後、匂坂城の築城の際、この地にあった磐田寺と合わせて、永禄7年（1564年）に岩田山増参寺となったとされます。匂坂は戦国期の土豪・匂坂氏ゆかりの地で、寺の周辺には匂坂城跡碑や匂坂館跡が残ります。宗派は曹洞宗で、寺院名簿でも磐田市匂坂中586番地の曹洞宗寺院として確認できます。&#34;},{&#34;heading&#34;:&#34;境内のソテツと力石&#34;,&#34;body&#34;:&#34;境内には大きなソテツがそびえています。観光協会の資料によれば、このソテツは社山城から匂坂城へ移されたものを、宝暦年間（1751〜1764年）に増参寺へ移したものだと伝えられています。参道横には昔話に登場するという「力石」が置かれ、隣接する戦没者墓地には神武天皇像が立っています。手入れの行き届いた整然とした境内として、同資料の寺社めぐりコースでも紹介されています。&#34;},{&#34;heading&#34;:&#34;『いわた文化財だより』からの補足&#34;,&#34;body&#34;:&#34;増参寺（磐田市匂坂中）は、磐田市指定無形民俗文化財「大めし祭り」において、旧東光寺跡に建つ匂坂西下公会堂（薬師堂）でおこなわれる大般若経・法華経の転読供養で読経をつとめており、旧東光寺の本寺にあたる。 大めし祭りは、磐田市富里の匂坂西下組に伝わる民俗行事で、氏神を祀る諏訪神社の春祭りに続いて薬師堂で大般若経の転読供養がおこなわれ、その後の直会で、嫁いできた「初嫁」を大盛りの飯などでもてなし、子孫繁栄・家内安全・五穀豊穣を祈願する。&#34;}],&#34;pilgrimage_note&#34;:&#34;磐田郡三十三観音霊場第12番札所&#34;,&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0034&#34;,&#34;slug&#34;:&#34;shinpoin-mukasa&#34;,&#34;name&#34;:&#34;新豊院&#34;,&#34;name_kana&#34;:&#34;しんぽういん&#34;,&#34;aliases&#34;:[&#34;鷲渓山&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市向笠竹之内14番地&#34;,&#34;district_id&#34;:&#34;koyo&#34;,&#34;area&#34;:&#34;向陽&#34;,&#34;main_deity&#34;:&#34;能満諸願虚空蔵大菩薩&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;公開情報調査済み&#34;,&#34;history_summary&#34;:&#34;新豊院（しんぽういん）は磐田市向笠竹之内にある曹洞宗の寺院で、山号は鷲渓山、本尊は能満諸願虚空蔵大菩薩です。開創年代は不明ですが文明18年（1486年）よりも以前と伝えられ、天正年間（1573〜1591年）に可睡斎の等膳和尚を招いて曹洞宗に改宗したとされます。裏山には国指定史跡の新豊院山古墳群があります。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9107&#34;},{&#34;title&#34;:&#34;磐田北部ありがた歩記（磐田市観光協会パンフレット）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;山号鷲渓山・本尊能満諸願虚空蔵大菩薩・曹洞宗、文明18年（1486）以前の開創と伝わること、天正年間の曹洞宗改宗（可睡斎等膳和尚）、天正17年の寺領寄進、慶長8年の朱印、八幡大菩薩・向笠城主の戦勝祈願・家康の位牌の伝承、2号墳出土品が市指定文化財である旨を確認。&#34;,&#34;url&#34;:&#34;https://kanko-iwata.jp/wp2/wp-content/uploads/2023/06/B4_hokubu.pdf&#34;},{&#34;title&#34;:&#34;新豊院山古墳群（磐田市公式ウェブサイト・国指定文化財）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;新豊院裏山に所在する国の史跡であること、2号墳が全長約28mの前方後円墳で三角縁神獣鏡等が出土したこと、保護工事のため裏山への立ち入りを控えるよう案内されていることを確認。&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/sports_midokoro/bunkazai/kunishitei/1002048.html&#34;},{&#34;title&#34;:&#34;新豊院山古墳群（文化遺産オンライン・文化庁）&#34;,&#34;type&#34;:&#34;文化財データベース&#34;,&#34;note&#34;:&#34;国指定史跡（史跡名勝天然記念物）、指定年月日1987年7月3日、所在地静岡県磐田市向笠竹之内であることを確認。&#34;,&#34;url&#34;:&#34;https://online.bunka.go.jp/heritages/detail/138484/2&#34;},{&#34;title&#34;:&#34;新豊院（曹洞禅ナビ・曹洞宗公式寺院ポータルサイト）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;曹洞宗寺院として磐田市向笠竹之内14に所在することを確認（山号・由緒の記載はなし）。&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_221203.html&#34;},{&#34;title&#34;:&#34;ニッポンの霊場 磐田郡三十三観音霊場&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;第19番＝鷲渓山新豊院（曹洞宗・向笠竹之内14）を確認。寺名・宗派・住所がDBと一致。&#34;,&#34;url&#34;:&#34;https://nippon-reijo.jimdofree.com/%E6%8E%B2%E8%BC%89%E9%9C%8A%E5%A0%B4%E3%81%AE%E4%B8%80%E8%A6%A7/%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/%E7%A3%90%E7%94%B0%E9%83%A1%E4%B8%89%E5%8D%81%E4%B8%89%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/&#34;},{&#34;title&#34;:&#34;しずおか文化財ナビ 新豊院山古墳群&#34;,&#34;type&#34;:&#34;文化財データベース&#34;,&#34;note&#34;:&#34;国指定史跡、指定日1987年7月3日、所在地向笠竹之内7-39、所有者磐田市、2号墳（前方後円墳・三角縁神獣鏡出土）の解説を確認。&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/kankosports/bunkageijutsu/bunkazai/1002825/1041003/1041884/1004985/1021413.html&#34;},{&#34;title&#34;:&#34;いわた文化財だより第212号&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;令和4年11月1日発行。P1〜3「新たに市指定文化財に！成瀬家文書＆新豊院山古墳群出土資料」。新豊院の所在（向笠竹之内、曹洞宗、山号鷲渓山）と新豊院山古墳群の概要、市指定文化財指定（令和4年9月28日）を記載。&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/_res/projects/default_project/_page_/001/007/901/dayori212.pdf&#34;},{&#34;title&#34;:&#34;いわた文化財だより第213号&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;令和4年12月1日発行。「新磐田市指定文化財 新豊院山古墳群出土資料」特別公開（10月29日〜11月4日、316名来場）の御礼記事。&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/_res/projects/default_project/_page_/001/007/901/dayori213.pdf&#34;},{&#34;title&#34;:&#34;磐田市文化財保存活用地域計画（令和6年9月）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;p.35 新豊院山2号墳の出土品、p.51 B向笠・大藤・岩田地区の国指定・市指定文化財一覧、p.79 p.93 法面保護工事・防災に関する記載&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/_res/projects/default_project/_page_/001/009/747/keikaku202409.pdf&#34;}],&#34;research_todos&#34;:[&#34;山号「鷲渓山」の読みを寺院・宗派資料で確認する&#34;,&#34;伊奈備前守の寺領寄進・慶長8年の朱印に関する原史料の名称を確認する&#34;,&#34;徳川家康の位牌が祀られる経緯・伝承の典拠を調査する&#34;,&#34;向笠城との関係（祈祷所としての位置づけ）を郷土資料で裏付ける&#34;,&#34;2号墳出土品の市指定文化財としての正式名称・指定年月日を磐田市文化財課資料で確認する&#34;,&#34;縁日に配られたという木版のお札の現存状況を確認する&#34;,&#34;曹洞禅ナビ復旧後に詳細ページ（index_221203）を再確認（調査時サーバー障害で未取得）&#34;,&#34;新豊院山古墳群の指定地と新豊院境内地の権利関係（台帳上の所有者は磐田市）を確認する。&#34;,&#34;いわた文化財だより第5号・第13号・第110号（新豊院山古墳群関連の初期記事）は磐田市立図書館の電子書籍サービス（合冊版、ログイン不要だがビューアーが自動化ツールで開けず未読）に収録されており未確認。第250号も新豊院山古墳群出土資料の追加指定に触れているが本文詳細は簡潔なため未採用。&#34;],&#34;founded_period&#34;:&#34;開創年代は不明だが、文明18年（1486年）よりも以前と伝わる。天正年間（1573〜1591年）に曹洞宗に改宗&#34;,&#34;heritage_status&#34;:&#34;裏山の新豊院山古墳群が国指定史跡（昭和62年〈1987年〉7月3日指定）。2号墳出土品は磐田市指定文化財（磐田市観光協会資料による）&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;創建と沿革&#34;,&#34;body&#34;:&#34;磐田市観光協会の資料によれば、いつ頃開創されたかは不明ですが、文明18年（1486年）よりも以前だと伝えられています。天正年間（1573〜1591年）に可睡斎（袋井市）の等膳和尚を招いて曹洞宗に改宗されました。記録によれば天正17年（1589年）に伊奈備前守より寺領を寄進され、慶長8年（1603年）にも諸役免除などの朱印を受けたとされます。本尊の能満諸願虚空蔵大菩薩は、どんな願いも叶えるとされる仏で、かつては縁日に木版のお札を配っていたと伝えられています。&#34;},{&#34;heading&#34;:&#34;向笠城と徳川家康ゆかりの伝承&#34;,&#34;body&#34;:&#34;本尊の横には八幡大菩薩も祀られており、向笠城の城主による祈祷（戦勝祈願など）の場であったとも伝えられています。観光協会の資料には、徳川家康の位牌も祀られていると記されており、「勝」のご利益がある寺として寺社めぐりコースで紹介されています。寺の東側には向笠城跡があり、向笠地区の歴史と関わりの深い寺院です。&#34;},{&#34;heading&#34;:&#34;国指定史跡・新豊院山古墳群&#34;,&#34;body&#34;:&#34;寺の裏山には、弥生時代から古墳時代にかけての墳墓群である新豊院山古墳群があり、昭和62年（1987年）7月3日に国の史跡に指定されています。弥生時代から古墳時代への墓制の移り変わりを知ることができる貴重な遺跡と評価されています。2号墳は全長約28mの前方後円墳で、三角縁神獣鏡や鉄製・銅製の鏃などが出土し、磐田市観光協会の資料によれば出土品は市指定文化財となっています。磐田市の公式サイトでは、古墳保護のための斜面工事が令和9年（2027年）まで行われるため、裏山への立ち入りを控えるよう案内されています。&#34;},{&#34;heading&#34;:&#34;文化財資料からの補足&#34;,&#34;body&#34;:&#34;新豊院の裏山には、寺名を冠した国指定史跡「新豊院山古墳群」があります。昭和62年（1987年）7月3日に指定され、弥生時代から古墳時代にかけての墓制の変化を示す遺跡です。 新豊院山2号墳は全長約34メートルの前方後円墳で県内最古級とされ、三角縁神獣鏡や鉄・銅製の鏃などが出土しています。古墳の上からは太田川の沖積地を挟んで小笠山丘陵を一望できます。&#34;},{&#34;heading&#34;:&#34;『いわた文化財だより』からの補足&#34;,&#34;body&#34;:&#34;新豊院は磐田市向笠竹之内にある曹洞宗の寺院で、山号は鷲渓山（しゅうけいざん）という。新豊院の北側に隣接する磐田原台地の尾根先端には、国指定史跡「新豊院山古墳群」がある。 新豊院山古墳群は、弥生時代中期の土器棺墓・土坑墓群や、古墳時代前期の前方後円墳2基（1号墳・2号墳）などからなる、弥生時代から古墳時代前期にかけての墳墓群である。 新豊院山古墳群から出土した三角縁神獣鏡・銅鏃などの資料は、令和4年（2022年）9月28日に磐田市指定文化財に加えられた。この指定により市内の指定文化財は135件となった。同資料は同年10月29日から11月4日まで磐田市歴史文書館で特別公開され、316名が来場した。&#34;},{&#34;heading&#34;:&#34;発掘調査・考古資料からの補足&#34;,&#34;body&#34;:&#34;新豊院の裏山（向笠竹之内）には弥生時代中期から古墳時代前期の墓群である新豊院山古墳群があり、昭和55年（1980年）8月からの発掘調査で前方後円墳2基（推定）と台状墓1基、弥生時代の土壙・土器棺などが確認された。昭和62年（1987年）7月3日に国の史跡に指定された。 新豊院山2号墳（全長約28メートルの前方後円墳）の石室内および周辺部からは三角縁神獣鏡、鉄剣・鉄刀・鉄鏃・銅鏃、小型鏡などが出土し、県内最古級の前方後円墳の一つと考えられている。出土資料は磐田市指定文化財（有形・考古資料）となっている。 磐田市文化財保存活用地域計画では、新豊院山古墳群は平成19年度（2007年度）に法面保護工事が施工されたが、令和6年（2024年）時点で保存活用計画は未作成であることが記載されている。&#34;}],&#34;cultural_assets&#34;:[{&#34;name&#34;:&#34;新豊院山古墳群&#34;,&#34;designation&#34;:&#34;国指定史跡&#34;,&#34;summary&#34;:&#34;寺の裏山にある弥生時代から古墳時代前期の墳墓群で、昭和62年（1987年）7月3日に国の史跡に指定されました。弥生時代から古墳時
