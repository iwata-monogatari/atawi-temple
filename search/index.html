34;本立山玄妙寺 公式サイト「御命講と玄妙寺」&#34;,&#34;type&#34;:&#34;寺院公式サイト&#34;,&#34;note&#34;:&#34;御命講（11月12日）の内容・子育て草履祈祷・鰐口打ち鳴らしを確認&#34;,&#34;url&#34;:&#34;https://honryuzan.genmyouji.nichiren-shu.jp/link05/05_0001.htm&#34;},{&#34;title&#34;:&#34;文化遺産オンライン 玄妙寺門柱及び塀&#34;,&#34;type&#34;:&#34;文化財データベース&#34;,&#34;note&#34;:&#34;登録有形文化財（建造物）、昭和前期、土塀延長16メートル、三和土ブロック構造、登録日2014年12月19日を確認。&#34;,&#34;url&#34;:&#34;https://online.bunka.go.jp/heritages/detail/289089&#34;},{&#34;title&#34;:&#34;本立山 玄妙寺（公式サイト）&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;由緒・年中行事・寺報等のページ構成を確認&#34;,&#34;url&#34;:&#34;https://honryuzan.genmyouji.nichiren-shu.jp/&#34;},{&#34;title&#34;:&#34;御命講と玄妙寺&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;御命講の由来と檀家参列について&#34;,&#34;url&#34;:&#34;https://honryuzan.genmyouji.nichiren-shu.jp/link07/07_0001.htm&#34;},{&#34;title&#34;:&#34;玄妙寺(静岡県磐田市)の永代供養墓・樹木葬・納骨堂&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;供養・墓地・駐車場に関する記載。公式サイトのページ構成と整合するため採用&#34;,&#34;url&#34;:&#34;https://eitaikuyo.jp/searcht/temple/T-0000037363&#34;},{&#34;title&#34;:&#34;いわた文化財だより第226号&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;令和6年1月4日発行。国登録有形文化財の紹介記事中で「玄妙寺経蔵」を昭和9年建築のコンクリート造経蔵として紹介（非公開）。&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/_res/projects/default_project/_page_/001/002/024/dayori226.pdf&#34;}],&#34;research_todos&#34;:[&#34;本尊（一塔両尊など安置形式）の確認&#34;,&#34;御命講（11月12日〜13日）の現行の実施状況の確認&#34;,&#34;顕本法華宗時代の寺史資料（磐田市誌・寺蔵文書）の調査&#34;,&#34;門柱及び塀の建設年代の確認（文化遺産オンライン該当ページの精査）&#34;,&#34;境内の伽藍配置・什物の現地確認&#34;,&#34;宗祖御木像の開眼年について公式サイト内で元和9年（1623年）と1624年の表記揺れがあり、要確認&#34;,&#34;ご本尊の具体的な奉安形式（宗派公式ページ・公式サイトとも明記なし）&#34;,&#34;公式サイトの「埋葬・埋蔵について」ページが直接アクセス不可（403）だったため、供養・墓地の詳細は現地または再アクセスでの確認が望ましい&#34;,&#34;護持会等の檀家組織に関する公開情報は確認できず&#34;],&#34;founded_period&#34;:&#34;室町時代の元中2年・北朝至徳2年（1385年）、日什門流の開祖・玄妙阿闍梨日什上人による建立&#34;,&#34;heritage_status&#34;:&#34;国登録有形文化財あり（玄妙寺経蔵、玄妙寺門柱及び塀）&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;日什による開創&#34;,&#34;body&#34;:&#34;玄妙寺は、日什門流の開祖である玄妙阿闍梨日什が元中2年・北朝至徳2年（1385年）に開創した寺院です。日蓮宗ポータルサイトの寺院ページには、日什が自らの名を寺号として「玄妙寺」と名付けたこと、遠州見付府内で法華信仰が根付く起点となった寺院であることが記されています。日什の生涯で最初に建立された法城として「得道の寺」と呼ばれ、「転法輪の寺」京都妙満寺、「涅槃の寺」会津妙法寺とともに「什門の三本山」と称されてきました。&#34;},{&#34;heading&#34;:&#34;顕本法華宗本山から日蓮宗へ&#34;,&#34;body&#34;:&#34;玄妙寺は戦前まで顕本法華宗の本山でした。Wikipediaによれば、同宗は政府の意向により昭和16年（1941年）に日蓮宗と合同し、戦後は什門改革派として日蓮宗に残留した「什門四本山」（妙國寺、本興寺、玄妙寺、妙立寺）の一つとなりました。現在は日蓮宗の由緒寺院に指定され、「本山」の称号を許可されています。毎年11月12日から13日にかけて御命講（お会式）が行われることでも知られます。&#34;},{&#34;heading&#34;:&#34;国登録有形文化財の経蔵と門柱・塀&#34;,&#34;body&#34;:&#34;磐田市公式ウェブサイトによれば、「玄妙寺経蔵・門柱及び塀」は平成26年（2014年）12月19日に国の登録有形文化財に登録されました。文化遺産オンラインには、経蔵は昭和9年（1934年）建設の鉄筋コンクリート造平屋建、瓦葺、建築面積13平方メートルで、切妻造のセメント瓦葺、外壁は人造石洗出しで石造風に仕上げられ、耐火性を重視した戦前のコンクリート造経蔵の好例と解説されています。&#34;},{&#34;heading&#34;:&#34;日什上人直建の本寺&#34;,&#34;body&#34;:&#34;玄妙寺は室町時代の元中2年・北朝至徳2年（1385年）、日什門流の開祖・玄妙阿闍梨日什上人によって建立され、遠州見付府内に初めてお題目が根付きました。「師ノ本名ヲ以ッテ寺号トナス」と伝えられる通り、日什上人が自らの名をもって「玄妙寺」と名付け、山号を本立山といいます。日什上人は「日什門徒存知スベキ事」の置文で玄妙寺を門徒の本寺と定め、第1の貫主を大蔵阿闍梨日妙としました。日什上人が法華弘通の生涯で最初に建立した法城であることから「得道の寺」といい、「転法輪の寺」京都妙満寺、「涅槃の寺」会津妙法寺とともに「什門の三本山」と称されています。現在は日蓮宗由緒寺院に指定され、「本山」の称号を許されています。&#34;},{&#34;heading&#34;:&#34;今井浦感得の三種の霊宝&#34;,&#34;body&#34;:&#34;日什上人が68歳の時、遠州見付府内の今井浦（当時は海で、現在は今之浦の地名が残ります）で祈祷をしたところ、海から龍王が現れ、小鰐口・七合鍋・和布の杓子を献上したと伝えられます。これが「日什上人今井浦感得の三個の霊宝」の故事で、その謂れのある什祖御祈祷像が祀られています。什物として伝什祖御曼荼羅1幅・日乗上人御曼荼羅1幅・日宏上人御曼荼羅1幅・大涅槃図などが格護され、本堂の山号扁額は本多日生上人の揮毫によるものです。奉安される宗祖日蓮大聖人の御尊像は元和9年（1623年）開眼の御木像、開山日什上人像は寛永17年（1640年）開眼の御木像で、いずれも准宗宝です。平成28年（2016年）には経蔵と門柱及び塀が国の登録有形文化財に登録されました。&#34;},{&#34;heading&#34;:&#34;御命講（おめいこう）&#34;,&#34;body&#34;:&#34;年中行事のうち毎年11月12日に行われる御命講が有名です。御命講は宗祖日蓮大聖人の御会式で、あわせて子育て母形鬼子母神の大祭があり、赤子が丈夫に育つようにと小さな「子育て草履」の御祈祷が篤く仰がれ、昔から近郷近在の人々に親しまれています。御命講の日には、三種の霊宝に縁のある鰐口を本堂前に掛け下げ、参詣者が打ち鳴らして所願成就を祈る「鰐口の打ち鳴らし」も行われます。&#34;},{&#34;heading&#34;:&#34;文化財資料からの補足&#34;,&#34;body&#34;:&#34;玄妙寺の経蔵は昭和9年（1934年）建築の鉄筋コンクリート造平屋建（建築面積13平方メートル）で、耐火性を重視した戦前のコンクリート造経蔵の好例とされます。平成26年（2014年）12月19日に国の登録有形文化財（建造物）に登録されました。 境内西辺の門柱及び塀（昭和前期）は、モルタル製の三和土ブロックを門柱は5段積、土塀（延長16メートル）は版築基礎上に4段布積とした左官技法を駆使した独特な構造で、経蔵と同日に国の登録有形文化財に登録されています。&#34;}],&#34;cultural_assets&#34;:[{&#34;name&#34;:&#34;玄妙寺経蔵&#34;,&#34;designation&#34;:&#34;国登録有形文化財（建造物）&#34;,&#34;summary&#34;:&#34;昭和9年（1934年）建設の鉄筋コンクリート造平屋建の経蔵です。切妻造セメント瓦葺で、外壁は人造石洗出しにより石造風に仕上げられ、耐火性を重視した戦前のコンクリート造経蔵の好例とされます。平成26年（2014年）12月19日登録。&#34;},{&#34;name&#34;:&#34;玄妙寺門柱及び塀&#34;,&#34;designation&#34;:&#34;国登録有形文化財（建造物）&#34;,&#34;summary&#34;:&#34;経蔵とともに平成26年（2014年）12月19日に国の登録有形文化財に登録されました。所有者は宗教法人玄妙寺です。&#34;}],&#34;danka_info&#34;:{&#34;annual_events&#34;:[{&#34;name&#34;:&#34;年中行事&#34;,&#34;timing&#34;:&#34;&#34;,&#34;note&#34;:&#34;御命講（毎年11月12日。宗祖御会式と子育て母形鬼子母神大祭、子育て草履の御祈祷、鰐口の打ち鳴らし）&#34;},{&#34;name&#34;:&#34;御命講&#34;,&#34;timing&#34;:&#34;11月11日・12日&#34;,&#34;note&#34;:&#34;元中2年（1385年）の日什上人以来続くとされる行事で、子育て草履の祈祷により親が子の健やかな成長を祈願する。檀家が参列し、地域住民にも親しまれてきたとされる。寺院公式サイトによる。&#34;}],&#34;official_site&#34;:{&#34;status&#34;:&#34;あり&#34;,&#34;url&#34;:&#34;https://honryuzan.genmyouji.nichiren-shu.jp/&#34;,&#34;checked_at&#34;:&#34;2026-07-12&#34;},&#34;cemetery&#34;:&#34;永代供養墓・樹木葬・納骨堂等を備え、個別墓と合祀墓の選択肢があるとされる（民間霊園紹介サイトの記載。寺院公式サイトにも「埋葬・埋蔵について」という案内ページが設けられており、内容の方向性は一致する）。&#34;,&#34;community_role&#34;:&#34;御命講は地域住民にも親しまれてきた行事とされる（寺院公式サイトによる）。&#34;,&#34;parking&#34;:&#34;駐車場を備えるとされる（民間情報サイトの記載）。&#34;}},{&#34;temple_id&#34;:&#34;iwata-0054&#34;,&#34;slug&#34;:&#34;senshoji-iwai&#34;,&#34;name&#34;:&#34;宣正寺&#34;,&#34;name_kana&#34;:&#34;せんしょうじ&#34;,&#34;aliases&#34;:[],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;日蓮正宗&#34;,&#34;address&#34;:&#34;静岡県磐田市岩井2324番地の5&#34;,&#34;district_id&#34;:&#34;koyo&#34;,&#34;area&#34;:&#34;向陽&#34;,&#34;main_deity&#34;:&#34;未確認&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;公開情報調査済み&#34;,&#34;history_summary&#34;:&#34;宣正寺は磐田市岩井にある日蓮正宗の寺院です。日蓮正宗公式ホームページの国内寺院案内に掲載されており、静岡西布教区に属します。創建年代や沿革を伝える公開資料は今回のWeb調査では確認できませんでした。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9127&#34;},{&#34;title&#34;:&#34;日蓮正宗公式ホームページ｜日本国内寺院案内&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;静岡県〔静岡西布教区〕の一覧に「宣正寺（磐田市）」が掲載されていることを確認。&#34;,&#34;url&#34;:&#34;https://www.nichirenshoshu.or.jp/jpn/access-j.html&#34;},{&#34;title&#34;:&#34;日蓮正宗寺院｜宣正寺（公式寺院ページ）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;寺院名「宣正寺（せんしょうじ）」、所在地「〒438-0016 静岡県磐田市岩井2324-5」を確認。沿革の記載はなし。&#34;,&#34;url&#34;:&#34;https://www.nichirenshoshu.or.jp/jpn/jptemples/0273.htm&#34;},{&#34;title&#34;:&#34;日蓮正宗寺院一覧 - Wikipedia&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;静岡西布教区（静岡市以西）の寺院として「宣正寺（磐田市）」の記載を確認。&#34;,&#34;url&#34;:&#34;https://ja.wikipedia.org/wiki/%E6%97%A5%E8%93%AE%E6%AD%A3%E5%AE%97%E5%AF%BA%E9%99%A2%E4%B8%80%E8%A6%A7&#34;}],&#34;research_todos&#34;:[&#34;創立年・開基の確認（日蓮正宗の宗門資料・大日蓮等機関誌の調査）&#34;,&#34;山号の有無の確認&#34;,&#34;静岡県知事所轄宗教法人名簿での法人情報の確認&#34;,&#34;岩井地区の郷土資料における記載の調査&#34;,&#34;日蓮正宗公式の寺院ページは所在地・連絡先のみで、創立年・開基・由緒沿革の欄がない。建立年代は寺院への照会または地域資料での調査が必要&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;基礎情報と現況&#34;,&#34;body&#34;:&#34;宣正寺は磐田市岩井2324番地の5に所在する日蓮正宗の寺院です。総本山大石寺（富士宮市）を本山とする日蓮正宗の公式ホームページの国内寺院案内に、所在地とともに掲載されていることが確認できます。Wikipediaの日蓮正宗寺院一覧では、静岡市以西を管轄する静岡西布教区の寺院として記載されています。創建年代・開基などの沿革情報は、公式ページには掲載されていません。&#34;}]},{&#34;temple_id&#34;:&#34;iwata-0055&#34;,&#34;slug&#34;:&#34;nipponzan-myohoji-iwata&#34;,&#34;name&#34;:&#34;日本山妙法寺磐田小僧伽&#34;,&#34;name_kana&#34;:&#34;にっぽんざんみょうほうじいわたしょうそうぎゃ&#34;,&#34;aliases&#34;:[],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;unknown&#34;,&#34;status_label&#34;:&#34;所在地・現況不明&#34;,&#34;sect&#34;:&#34;日本山妙法寺大僧伽&#34;,&#34;address&#34;:&#34;所在地不明&#34;,&#34;district_id&#34;:null,&#34;area&#34;:&#34;地区未確定&#34;,&#34;main_deity&#34;:&#34;未確認&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;訪問済み・場所不明&#34;,&#34;detail_status&#34;:&#34;現地確認継続中&#34;,&#34;history_summary&#34;:&#34;静岡県知事所轄宗教法人名簿には「日本山妙法寺磐田小僧伽」の名称と磐田市中泉3734番地の4の住所が掲載されています。しかし、2026年7月12日に名簿記載地周辺を訪問したものの、寺院・道場に該当する場所を確認できませんでした。このため、所在地と現況は不明として掲載しています。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-12&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;「日本山妙法寺磐田小僧伽」と磐田市中泉3734番地の4の記載を確認。ただし、2026年7月12日の現地訪問では該当する場所を確認できなかった。&#34;},{&#34;title&#34;:&#34;ATAWI TEMPLE現地確認記録&#34;,&#34;type&#34;:&#34;現地調査&#34;,&#34;note&#34;:&#34;2026年7月12日、名簿記載地周辺を訪問したが、寺院・道場の場所を確認できなかった。&#34;}],&#34;research_todos&#34;:[&#34;名簿記載住所と現在の地番・住居表示の対応を確認する&#34;,&#34;移転・活動休止・廃止の有無を教団または関係機関に確認する&#34;,&#34;過去の所在地や活動を知る地域の方から情報を募る&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;2026年7月12日の現地確認&#34;,&#34;body&#34;:&#34;静岡県知事所轄宗教法人名簿に掲載された磐田市中泉3734番地の4の周辺を訪問しましたが、日本山妙法寺磐田小僧伽に該当する寺院・道場を確認できませんでした。住所表記の変更、移転、活動休止、廃止などの可能性がありますが、現時点では判断できる資料がありません。&#34;},{&#34;heading&#34;:&#34;情報提供のお願い&#34;,&#34;body&#34;:&#34;日本山妙法寺磐田小僧伽の正確な所在地、過去の所在、移転・廃止の時期、地域での活動をご存じの方は、ATAWI TEMPLEの情報提供掲示板からお知らせください。確認できた情報は、出典や現地状況を照合したうえで更新します。&#34;}],&#34;page_summary&#34;:&#34;2026年7月12日に名簿記載地周辺を訪問しましたが、場所を確認できませんでした。日本山妙法寺磐田小僧伽の所在地、移転・廃止、現在の活動などをご存じの方は、情報提供掲示板からお知らせください。&#34;,&#34;founded_period&#34;:&#34;未確認&#34;,&#34;heritage_status&#34;:&#34;未確認&#34;,&#34;visit_notes&#34;:&#34;2026年7月12日、名簿記載地周辺を現地訪問しましたが、寺院・道場の場所を確認できませんでした。所在地や現況をご存じの方からの情報をお待ちしています。&#34;,&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0056&#34;,&#34;slug&#34;:&#34;shinshinkyo-mitsuke&#34;,&#34;name&#34;:&#34;神心教&#34;,&#34;name_kana&#34;:&#34;しんしんきょう&#34;,&#34;aliases&#34;:[],&#34;record_type&#34;:&#34;temple&#34;,&#34;sta izuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9144&#34;}],&#34;research_todos&#34;:[&#34;静岡県知事所轄宗教法人名簿での「神心教本部」の登載内容確認&#34;,&#34;包括宗教法人「神心教」（見付243番地）との関係（本部施設か被包括法人か）の整理&#34;,&#34;見付206番地の施設の現地確認&#34;,&#34;創始者・設立年・祭神ないし本尊の調査（磐田市誌・見付の郷土資料）&#34;]},{&#34;temple_id&#34;:&#34;iwata-0058&#34;,&#34;slug&#34;:&#34;rendaiji-yashiroyama&#34;,&#34;name&#34;:&#34;蓮台寺&#34;,&#34;name_kana&#34;:&#34;れんだいじ&#34;,&#34;aliases&#34;:[],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;真言宗智山派&#34;,&#34;address&#34;:&#34;静岡県磐田市社山576番地&#34;,&#34;district_id&#34;:&#34;toyooka&#34;,&#34;area&#34;:&#34;豊岡&#34;,&#34;main_deity&#34;:&#34;薬師如来&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;蓮台寺は磐田市社山にある真言宗智山派の寺院で、『静岡県磐田郡誌』（1921年）には鎌田（旧御厨村）の医王寺の末寺、本尊は薬師如来と記されています。同郡誌によれば、往古は社山の字天神ヶ谷にありましたが、武田氏の兵燹（戦火）により本堂が灰燼に帰し、慶長年間（1596〜1615年）に現在地の字上之平へ移転再建されたと伝えられます。社山は戦国期に今川・斯波・徳川・武田各氏の抗争の舞台となった社山城跡のある地区です。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9274&#34;},{&#34;title&#34;:&#34;『静岡県磐田郡誌』静岡県磐田郡役所編（1921年）第13章 神社及宗教&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション。次世代デジタルライブラリー全文検索コマ772付近に「10蓮台寺（広瀬村）」の由緒記載&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680&#34;},{&#34;title&#34;:&#34;コトバンク「社山村」（日本歴史地名大系）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;文亀元年（1501年）の今川氏・斯波氏合戦、孕石光尚の知行に関する記述&#34;,&#34;url&#34;:&#34;https://kotobank.jp/word/社山村&#34;},{&#34;title&#34;:&#34;磐田市観光協会「社山城跡」&#34;,&#34;type&#34;:&#34;公的情報&#34;,&#34;note&#34;:&#34;社山城の沿革（15世紀末成立、今川・徳川・武田の抗争、元亀3年の武田遠州侵入）&#34;,&#34;url&#34;:&#34;https://kanko-iwata.jp/tanoshimu/tanoshimu-9817/&#34;},{&#34;title&#34;:&#34;ニッポンの霊場 遠江四十九薬師霊場&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;第32番＝城谷山蓮台寺（真言宗智山派・磐田市社山・御本尊薬師如来）を確認。寺名・宗派・町名がDBと一致。&#34;,&#34;url&#34;:&#34;https://nippon-reijo.jimdofree.com/%E6%8E%B2%E8%BC%89%E9%9C%8A%E5%A0%B4%E3%81%AE%E4%B8%80%E8%A6%A7/%E8%96%AC%E5%B8%AB%E9%9C%8A%E5%A0%B4/%E9%81%A0%E6%B1%9F%E5%9B%9B%E5%8D%81%E4%B9%9D%E8%96%AC%E5%B8%AB%E9%9C%8A%E5%A0%B4/&#34;}],&#34;research_todos&#34;:[&#34;真言宗智山派総本山智積院の末寺名簿・智山派宗務庁資料での蓮台寺の確認&#34;,&#34;創建年代・本尊・山号の調査（旧豊岡村誌・磐田市誌北部地区資料）&#34;,&#34;社山城跡との歴史的関係の有無の調査&#34;,&#34;遠江四十九薬師霊場・遠州三十三観音霊場等の札所該当の有無の確認&#34;,&#34;現地確認（本堂・境内・縁起板・石造物）&#34;,&#34;山号の確認（『静岡県磐田郡誌』の寺院一覧表は活字の判読が難しい）&#34;,&#34;焼失・移転の年代を伝える寺伝・棟札等の確認&#34;,&#34;医王寺との本末関係の現況確認&#34;],&#34;founded_period&#34;:&#34;不詳（慶長年間〈1596〜1615年〉に現在地へ移転再建と伝わる）&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;『静岡県磐田郡誌』にみる由緒&#34;,&#34;body&#34;:&#34;大正10年（1921年）刊行の『静岡県磐田郡誌』は、真言宗寺院の一つとして蓮台寺を挙げ、「広瀬村社山字上之平に在り。御厨村医王寺の末にして、本尊は薬師如来なり。往古は字天神ヶ谷に在り。武田氏の兵燹に罹りて本堂灰燼に帰せり。慶長年間、今の地に移転再建せりと云ふ」と記しています。本寺とされる医王寺は磐田市鎌田の真言宗智山派の古刹で、この本末関係は蓮台寺の現在の宗派とも一致します。焼失をもたらした「武田氏の兵燹」の具体的な年代は、郡誌には記されていません。&#34;},{&#34;heading&#34;:&#34;戦乱の舞台・社山&#34;,&#34;body&#34;:&#34;所在地の社山には標高約130メートルの丘陵に築かれた社山城跡があり、磐田市観光協会によれば、築城年代は不明ながら15世紀末には存在し、16世紀初頭に斯波氏と今川氏の抗争の地となった後に今川氏が支配し、桶狭間の戦いののちは徳川氏の統治下に移り、元亀3年（1572年）の武田氏の遠州侵入により徳川・武田両氏の抗争の場となりました。『日本歴史地名大系』の社山村の項にも、文亀元年（1501年）の今川氏と斯波氏の合戦に関する記述がみえます。武田氏の戦火で本堂を失ったと伝える蓮台寺の由緒は、こうした戦乱の舞台であった社山の歴史の中に位置づけられます。&#34;}],&#34;cultural_assets&#34;:[],&#34;pilgrimage_note&#34;:&#34;遠江四十九薬師霊場第32番札所（札所本尊薬師如来）&#34;},{&#34;temple_id&#34;:&#34;iwata-0059&#34;,&#34;slug&#34;:&#34;saikoji-kaketsuka&#34;,&#34;name&#34;:&#34;西光寺&#34;,&#34;name_kana&#34;:&#34;さいこうじ&#34;,&#34;aliases&#34;:[&#34;稱名山&#34;,&#34;称名山西光寺&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;浄土宗&#34;,&#34;address&#34;:&#34;静岡県磐田市掛塚1079番地&#34;,&#34;district_id&#34;:&#34;ryuyo&#34;,&#34;area&#34;:&#34;竜洋&#34;,&#34;main_deity&#34;:&#34;未確認&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;公開情報調査済み&#34;,&#34;history_summary&#34;:&#34;西光寺は磐田市掛塚にある浄土宗の寺院で、山号は稱名山です。永正18年（1521年）に稱蓮社名誉上人正行西光大和尚を開山として創建されたと伝えます。明治の大書家成瀬氏の筆と伝える「稱名山」の山号額を寺宝とし、年間を通じて多くの法要が営まれています。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-12&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9276&#34;},{&#34;title&#34;:&#34;147 西光寺 磐田市掛塚｜静岡教区浄土宗青年会&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;山号「稱名山」、永正18年（1521年）開基、開山「稱蓮社名誉上人正行西光大和尚」、山号額（明治の大書家成瀬氏筆）、彼岸・施餓鬼の戸別訪問念仏会を確認。&#34;,&#34;url&#34;:&#34;https://jodo-ss.com/temple_list/147%E3%80%80%E8%A5%BF%E5%85%89%E5%AF%BA%E3%80%80%E7%A3%90%E7%94%B0%E5%B8%82%E6%8E%9B%E5%A1%9A/&#34;},{&#34;title&#34;:&#34;西光寺｜浄土宗 寺院検索&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;寺院名・山号「稱名山」・所在地「〒438-0234 静岡県磐田市掛塚1079番地」（寺院番号20-147）を確認。&#34;,&#34;url&#34;:&#34;http://otera.jodo.or.jp/temple/20-147/&#34;},{&#34;title&#34;:&#34;浄土宗 寺院検索（寺院紹介Navi） 西光寺&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;寺院番号20-147。山号=稱名山、所在地=磐田市掛塚1079番地を確認。本尊・由緒の記載欄はなく基本情報のみ掲載&#34;,&#34;url&#34;:&#34;https://otera.jodo.or.jp/temple/20-147/&#34;}],&#34;research_todos&#34;:[&#34;本尊（阿弥陀如来かどうか）の確認&#34;,&#34;山号額の筆者「明治の大書家成瀬氏」の特定（成瀬大域か等）&#34;,&#34;掛塚湊の繁栄と寺院の関わりについての郷土資料調査&#34;,&#34;開基以降の堂宇再建・移転など沿革の詳細調査（磐田市誌・竜洋町史）&#34;,&#34;本尊は宗派公式資料に明記なし。現地確認または市誌で補完する&#34;,&#34;山号額の筆者「明治の大書家成瀬氏」が成瀬大域を指すか確認する&#34;,&#34;永代供養・納骨堂等の墓地情報は確認できず&#34;,&#34;護持会等の組織名称・地域防災との関わりは未確認&#34;],&#34;founded_period&#34;:&#34;永正18年（1521年）創建。開山は稱蓮社名誉上人正行西光大和尚（静岡教区浄土宗青年会の寺院紹介による）&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;創建と沿革&#34;,&#34;body&#34;:&#34;静岡教区浄土宗青年会の寺院紹介ページによれば、西光寺は永正18年（1521年）の開基で、開山は稱蓮社名誉上人正行西光大和尚とされます。山号は稱名山で、浄土宗の寺院検索にも磐田市掛塚1079番地の寺院（寺院番号20-147）として登録されています。なお、磐田市内には見付に時宗の東福山西光寺（大クスで知られる寺院）がありますが、掛塚の西光寺とは宗派・所在地とも異なる別の寺院です。&#34;},{&#34;heading&#34;:&#34;山号額と現在の活動&#34;,&#34;body&#34;:&#34;本堂に掲げられる「稱名山」の山号額は、明治の大書家成瀬氏の筆によるものと静岡教区浄土宗青年会のページに紹介されています。同ページによれば、春秋の彼岸と施餓鬼の時期には檀家への戸別訪問による先祖供養と念仏会を行うことが同寺の特色とされています。&#34;},{&#34;heading&#34;:&#34;永正18年開山の掛塚の念仏寺院&#34;,&#34;body&#34;:&#34;浄土宗の公式寺院検索には、山号を稱名山として登録されています。静岡教区浄土宗青年会の寺院紹介によると、開山は稱蓮社名誉上人正行西光大和尚で、永正18年（1521年）の創建です。寺号の西光は開山の名にちなむものです。寺宝として「稱名山」の山号額があり、明治の大書家成瀬氏の筆と伝えられています。&#34;},{&#34;heading&#34;:&#34;月ごとの法要と戸別の念仏勧化&#34;,&#34;body&#34;:&#34;年中行事は1月の修正会、2月の涅槃会、3月の善導会、4月の宗祖降誕会と灌仏会、5月の御忌会、3月・9月の彼岸会、7月の寺施餓鬼会、11月の十夜会、12月の成道会と、月ごとに切れ目なく営まれています。春・秋の彼岸と施餓鬼には檀家を戸別に訪問して先祖供養を行い、称名念仏を勧める活動を続けています。&#34;}],&#34;danka_info&#34;:{&#34;annual_events&#34;:[{&#34;name&#34;:&#34;年中行事&#34;,&#34;timing&#34;:&#34;&#34;,&#34;note&#34;:&#34;修正会（1月）、涅槃会（2月）、善導会（3月）、宗祖降誕会（4月）、灌仏会（4月）、御忌会（5月）、彼岸会（3月・9月）、寺施餓鬼会（7月）、十夜会（11月）、成道会（12月）&#34;},{&#34;name&#34;:&#34;修正会&#34;,&#34;timing&#34;:&#34;1月&#34;,&#34;note&#34;:&#34;&#34;}],&#34;organization&#34;:&#34;春・秋の彼岸会や盂蘭盆会の時期に檀家宅を巡回し、祖先供養と念仏を勧める活動を行っているとされる（静岡教区浄土宗青年会の寺院紹介による）。&#34;,&#34;parking&#34;:&#34;駐車場ありとされる（浄土宗公式の寺院検索サイトによる）。&#34;}},{&#34;temple_id&#34;:&#34;iwata-0060&#34;,&#34;slug&#34;:&#34;kokuseiji-kaketsuka&#34;,&#34;name&#34;:&#34;國清寺&#34;,&#34;name_kana&#34;:&#34;こくせいじ&#34;,&#34;aliases&#34;:[&#34;松林山&#34;,&#34;観智院&#34;,&#34;松林山観智院国清寺&#34;,&#34;国清寺&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;浄土宗&#34;,&#34;address&#34;:&#34;静岡県磐田市掛塚643番地&#34;,&#34;district_id&#34;:&#34;ryuyo&#34;,&#34;area&#34;:&#34;竜洋&#34;,&#34;main_deity&#34;:&#34;阿弥陀如来坐像&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;公開情報調査済み&#34;,&#34;history_summary&#34;:&#34;国清寺は磐田市掛塚にある浄土宗の寺院で、正式には松林山観智院国清寺と号します。元和元年（1615年）ごろ、貞蓮社源誉上人普光観智国師を開山として創建されたと伝えます。本尊は阿弥陀如来坐像で、院号の観智院は開山の国師号と同じ名を持ちます。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-12&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9278&#34;},{&#34;title&#34;:&#34;国清寺｜浄土宗 寺院検索&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;山号「松林山」、院号「観智院」、所在地「〒438-0234 静岡県磐田市掛塚643番地」（寺院番号20-148）、別時会・写経会・法話会・詠唱（吉水流）・除夜の鐘等の行事を確認。&#34;,&#34;url&#34;:&#34;https://otera.jodo.or.jp/temple/20-148/&#34;},{&#34;title&#34;:&#34;浄土宗 寺院検索（磐田市一覧）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;磐田市の浄土宗寺院6か寺（善導寺・慶岩寺・大見寺・徳翁院・西光寺・国清寺）の中に国清寺が掲載されていることを確認。&#34;,&#34;url&#34;:&#34;http://otera.jodo.or.jp/temple/shizuoka/a/iwata/&#34;},{&#34;title&#34;:&#34;静岡教区浄土宗青年会 寺院紹介「148 国清寺 磐田市掛塚」&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;開山=貞蓮社源誉上人普光観智国師、創建=元和元年（1615年）ごろ、本尊・寺宝=阿弥陀如来坐像、年中行事5件、西遠組所属を確認&#34;,&#34;url&#34;:&#34;https://jodo-ss.com/temple_list/148%E3%80%80%E5%9B%BD%E6%B8%85%E5%AF%BA%E3%80%80%E7%A3%90%E7%94%B0%E5%B8%82%E6%8E%9B%E5%A1%9A/&#34;}],&#34;research_todos&#34;:[&#34;創建年代・開山・開基の調査（磐田市誌・竜洋町史・掛塚の郷土資料）&#34;,&#34;本尊（阿弥陀如来かどうか）の確認&#34;,&#34;掛塚湊・廻船問屋との歴史的関係の調査&#34;,&#34;「國清寺」と「国清寺」の正式表記の確認&#34;,&#34;境内の石造物・堂宇の現地確認&#34;,&#34;開山と伝える普光観智国師（増上寺12世源誉存応の国師号と同名）と当寺の関係（直接開山か勧請開山か）を磐田市誌等で確認する&#34;,&#34;墓地・護持会・地域との関わり・駐車場の情報は確認できず&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;寺号と所在&#34;,&#34;body&#34;:&#34;浄土宗の公式寺院検索によれば、國清寺は山号を松林山、院号を観智院といい、磐田市掛塚643番地に所在します（寺院番号20-148）。磐田市の浄土宗寺院6か寺の一つとして登録されており、旧掛塚湊の町並みが残る竜洋地区の掛塚に位置します。なお、伊豆の国市奈古谷や岡山市にも同名の国清寺がありますが、いずれも別の寺院です。&#34;},{&#34;heading&#34;:&#34;現在の活動&#34;,&#34;body&#34;:&#34;浄土宗公式寺院検索の同寺ページには、別時会、写経会、法話会、詠唱（吉水流）、除夜の鐘などの行事・活動が挙げられており、結婚式や七五三への対応、参拝用駐車場の記載もあります。創建・開山などの由緒については同ページに記載がなく、今後の調査課題です。&#34;},{&#34;heading&#34;:&#34;観智国師を開山と伝える江戸初期の創建&#34;,&#34;body&#34;:&#34;浄土宗の公式寺院検索には、山号を松林山、院号を観智院として登録されています。静岡教区浄土宗青年会の寺院紹介によると、開山は貞蓮社源誉上人普光観智国師で、元和元年（1615年）ごろの創建です。院号の観智院は、この開山の国師号と同じ名を持ちます。本尊は阿弥陀如来坐像です。&#34;},{&#34;heading&#34;:&#34;掛塚に受け継がれる年中行事&#34;,&#34;body&#34;:&#34;年中行事は1月の修正会、3月・9月の彼岸会、4月の御忌会、7月の施餓鬼会、11月の十夜会が営まれ、定例行事として4月中旬の御忌会と7月15日の施餓鬼会が挙げられています。西遠組に属します。&#34;}],&#34;founded_period&#34;:&#34;元和元年（1615年）ごろの創建。開山は貞蓮社源誉上人普光観智国師（静岡教区浄土宗青年会の寺院紹介による）&#34;,&#34;danka_info&#34;:{&#34;annual_events&#34;:[{&#34;name&#34;:&#34;年中行事&#34;,&#34;timing&#34;:&#34;&#34;,&#34;note&#34;:&#34;修正会（1月）、彼岸会（3月・9月）、御忌会（4月中旬）、施餓鬼会（7月15日）、十夜会（11月）&#34;},{&#34;name&#34;:&#34;修正会&#34;,&#34;timing&#34;:&#34;1月&#34;,&#34;note&#34;:&#34;&#34;}]}},{&#34;temple_id&#34;:&#34;iwata-0061&#34;,&#34;slug&#34;:&#34;manpukuji-kaketsuka-819&#34;,&#34;name&#34;:&#34;満福寺&#34;,&#34;name_kana&#34;:&#34;まんぷくじ&#34;,&#34;aliases&#34;:[&#34;亀甲山&#34;,&#34;亀甲山満福寺&#34;,&#34;滿福寺&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;浄土真宗本願寺派&#34;,&#34;address&#34;:&#34;静岡県磐田市掛塚819番地&#34;,&#34;district_id&#34;:&#34;ryuyo&#34;,&#34;area&#34;:&#34;竜洋&#34;,&#34;main_deity&#34;:&#34;未確認&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;満福寺は磐田市掛塚（旧掛塚町字新町）にある浄土真宗本願寺派の寺院で、山号は亀甲山です。『静岡県磐田郡誌』（1921年）には「掛塚町掛塚字新町に在り。西本願寺末にして、天正4年の開基なり」と記され、天正4年（1576年）に開かれた450年の歴史を持つ寺院であることが確認できます。掛塚には真宗大谷派（東本願寺系）の萬福寺（字横町）も並存し、東西両本願寺系の同音の寺院が湊町掛塚に軒を連ねてきました。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9280&#34;},{&#34;title&#34;:&#34;満福寺（曖昧さ回避） - Wikipedia&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;「静岡県磐田市掛塚新町にある浄土真宗本願寺派の寺院。亀甲山滿福寺（龜甲山萬福寺）」との記載を本文で確認。&#34;,&#34;url&#34;:&#34;https://ja.wikipedia.org/wiki/%E6%BA%80%E7%A6%8F%E5%AF%BA&#34;},{&#34;title&#34;:&#34;静岡県磐田市の寺院一覧（いいお墓）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;掛塚に満福寺の掲載を確認。ただし同サイトは「真宗大谷派・掛塚799-1」と表記しており、Wikipediaおよび台帳の「浄土真宗本願寺派・掛塚819」と食い違いがあるため要追加確認。&#34;,&#34;url&#34;:&#34;https://www.e-ohaka.com/temple_list/id22211.html&#34;},{&#34;title&#34;:&#34;『静岡県磐田郡誌』静岡県磐田郡役所編（1921年）第13章 神社及宗教&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション。「6満福寺（掛塚町）」として字新町・西本願寺末・天正4年開基の由緒記載&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680&#34;},{&#34;title&#34;:&#34;『遠江』（1927年刊）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション。コマ201に「万福寺（掛塚村）三石」の寺領記載&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/1176478&#34;},{&#34;title&#34;:&#34;コトバンク「掛塚村」（日本歴史地名大系）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;万福寺領3石・西光寺領・香集寺領等の記載、掛塚が中世・近世を通して湊として繁栄したことの記述&#34;,&#34;url&#34;:&#34;https://kotobank.jp/word/掛塚村&#34;}],&#34;research_todos&#34;:[&#34;創建年代・開基の調査（竜洋町史・掛塚の郷土資料）&#34;,&#34;民間寺院情報サイト（いいお墓）が「真宗大谷派・掛塚799-1」と記載しており、宗派・地番表記に食い違いがあるため正確な情報の確認&#34;,&#34;山号「亀甲山」の由来の調査&#34;,&#34;本願寺派静岡教区の寺院名簿での確認&#34;,&#34;掛塚湊の町組（新町）と寺院の関係の調査&#34;,&#34;開基した僧の名前の確認（『静岡県磐田郡誌』の該当箇所は活字の判読が難しい）&#34;,&#34;本尊の確認（浄土真宗の通例では阿弥陀如来だが当寺についての明記資料は未確認）&#34;,&#34;江戸期の「万福寺領3石」が満福寺・萬福寺のいずれを指すかの検証&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;名称と宗派&#34;,&#34;body&#34;:&#34;Wikipediaの同名寺院一覧には、磐田市の満福寺について「静岡県磐田市掛塚新町にある浄土真宗本願寺派の寺院。亀甲山滿福寺（龜甲山萬福寺）」との記載があり、山号は亀甲山とされています。掛塚新町は旧掛塚町の町組の一つで、現在の住所表記では磐田市掛塚にあたります。創建・沿革や本尊（浄土真宗であれば阿弥陀如来）についての具体的な記録は、現時点では確認できていません。&#34;},{&#34;heading&#34;:&#34;『静岡県磐田郡誌』にみる由緒&#34;,&#34;body&#34;:&#34;大正10年（1921年）刊行の『静岡県磐田郡誌』は、浄土真宗の寺院として「満福寺（掛塚町）　掛塚町掛塚字新町に在り。西本願寺末にして、天正4年の開基なり」と記しています。天正4年（1576年）は戦国末期にあたり、天竜川河口の湊町として発展する掛塚に、西本願寺系の道場・寺院が根づいた時期を示す記録といえます。同じ掛塚には大永7年（1527年）開創と伝える真宗大谷派の萬福寺（字横町）もあり、両寺は宗派（本願寺派と大谷派）・所在の字（新町と横町）で区別されます。&#34;},{&#34;heading&#34;:&#34;江戸期の寺領記録&#34;,&#34;body&#34;:&#34;『日本歴史地名大系』の掛塚村の項には、貴船神社（木船大明神）領5石、西光寺領2石余、香集寺領2石余と並んで「万福寺領3石」の記載があり、1927年刊行の郷土誌『遠江』にも「万福寺（掛塚村）三石」とみえます。ただし掛塚には満福寺（本願寺派）と萬福寺（大谷派）の2か寺があるため、この寺領がいずれの寺を指すのかは現時点の公開資料からは確定できません。&#34;}],&#34;founded_period&#34;:&#34;天正4年（1576年）開基（『静岡県磐田郡誌』）&#34;,&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0062&#34;,&#34;slug&#34;:&#34;manpukuji-kaketsuka-799&#34;,&#34;name&#34;:&#34;萬福寺&#34;,&#34;name_kana&#34;:&#34;まんぷくじ&#34;,&#34;aliases&#34;:[],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;真宗大谷派&#34;,&#34;address&#34;:&#34;静岡県磐田市掛塚799番地の1&#34;,&#34;district_id&#34;:&#34;ryuyo&#34;,&#34;area&#34;:&#34;竜洋&#34;,&#34;main_deity&#34;:&#34;未確認&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;萬福寺は磐田市掛塚（旧掛塚町字横町）にある真宗大谷派の寺院です。『静岡県磐田郡誌』（1921年）には「掛塚町掛塚字横町に在り。東本願寺の末にして、大永7年丁亥、融円師の開創に係る」と記されており、大永7年（1527年）にさかのぼる約500年の歴史を持つことが確認できます。天竜川河口の湊町掛塚には浄土真宗本願寺派の満福寺（字新町）も並存し、東西両本願寺系の同音の寺院が区別されて伝えられてきました。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9282&#34;},{&#34;title&#34;:&#34;サーチ寺院 静岡県磐田市の寺院・御堂一覧&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;萬福寺が真宗大谷派・磐田市掛塚799番地の1の宗教法人として登載されていることを確認（法人コード6080405005548）&#34;,&#34;url&#34;:&#34;https://www.bukyou.com/BukyBukyou/TBukyou22/C22CNo211Detail.html&#34;},{&#34;title&#34;:&#34;静岡県磐田市の寺院一覧（いいお墓）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;萬福寺が真宗大谷派・磐田市掛塚799-1の寺院として掲載されていることを確認。由緒の記載はなし&#34;,&#34;url&#34;:&#34;https://www.e-ohaka.com/temple_list/id22211.html&#34;},{&#34;title&#34;:&#34;『静岡県磐田郡誌』静岡県磐田郡役所編（1921年）第13章 神社及宗教&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション。「5萬福寺（掛塚町）」として字横町・東本願寺末・大永7年融円師開創の由緒記載&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680&#34;},{&#34;title&#34;:&#34;『遠江』（1927年刊）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション。コマ201に「万福寺（掛塚村）三石」の寺領記載&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/1176478&#34;},{&#34;title&#34;:&#34;コトバンク「掛塚村」（日本歴史地名大系）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;万福寺領3石等の寺社領記載&#34;,&#34;url&#34;:&#34;https://kotobank.jp/word/掛塚村&#34;}],&#34;research_todos&#34;:[&#34;山号・院号の確認（現地の寺号標・本堂掲示等）&#34;,&#34;創建年代・開基の確認（『竜洋町史』『磐田市誌』等の郷土資料）&#34;,&#34;掛塚湊の廻船業で栄えた掛塚地区の歴史と当寺の関わりの調査&#34;,&#34;本尊（真宗寺院のため阿弥陀如来と推定されるが未確認）の確認&#34;,&#34;真宗大谷派の教区資料での登録状況確認&#34;,&#34;山号の確認（『静岡県磐田郡誌』の真宗寺院一覧表にみえる「大永山」が当寺を指す可能性の検証）&#34;,&#34;本尊の確認（真宗の通例では阿弥陀如来だが当寺についての明記資料は未確認）&#34;,&#34;江戸期の「万福寺領3石」が萬福寺・満福寺のいずれを指すかの検証&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;所在と宗派&#34;,&#34;body&#34;:&#34;萬福寺は磐田市掛塚に所在する真宗大谷派の寺院です。全国の宗教法人を収録した寺院一覧（サーチ寺院）に磐田市掛塚799番地の1の寺院として登載されており、霊園情報サイト「いいお墓」の磐田市寺院一覧にも真宗大谷派の寺院として掲載されています。『静岡県磐田郡誌』（1921年）の所在記載は「掛塚町掛塚字横町」で、横町は掛塚湊で栄えた旧掛塚町の町組の一つです。&#34;},{&#34;heading&#34;:&#34;『静岡県磐田郡誌』にみる由緒&#34;,&#34;body&#34;:&#34;大正10年（1921年）刊行の『静岡県磐田郡誌』は、浄土真宗の寺院として「萬福寺（掛塚町）　掛塚町掛塚字横町に在り。東本願寺の末にして、大永7年丁亥、融円師の開創に係る」と記しています。大永7年（1527年）は室町時代末期にあたり、掛塚の寺院の中でも古い部類に属する開創伝承です。同じ掛塚には天正4年（1576年）開基と伝える浄土真宗本願寺派の満福寺（字新町）があり、両寺は宗派（大谷派と本願寺派）・所在の字（横町と新町）で区別されます。&#34;},{&#34;heading&#34;:&#34;江戸期の寺領記録&#34;,&#34;body&#34;:&#34;『日本歴史地名大系』の掛塚村の項には「万福寺領3石」の記載があり、1927年刊行の郷土誌『遠江』にも「万福寺（掛塚村）三石」とみえます。ただし掛塚には萬福寺（大谷派）と満福寺（本願寺派）の2か寺があるため、この寺領がいずれの寺を指すのかは現時点の公開資料からは確定できません。&#34;}],&#34;founded_period&#34;:&#34;大永7年（1527年）開創（『静岡県磐田郡誌』）&#34;,&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0063&#34;,&#34;slug&#34;:&#34;gyokoji-ikeda&#34;,&#34;name&#34;:&#34;行興寺&#34;,&#34;name_kana&#34;:&#34;ぎょうこうじ&#34;,&#34;aliases&#34;:[&#34;熊野の長藤の寺&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;時宗&#34;,&#34;address&#34;:&#34;静岡県磐田市池田330番地&#34;,&#34;district_id&#34;:&#34;toyoda&#34;,&#34;area&#34;:&#34;豊田&#34;,&#34;main_deity&#34;:&#34;十一面観世音菩薩&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;現地写真あり&#34;,&#34;detail_status&#34;:&#34;公開情報調査済み&#34;,&#34;history_summary&#34;:&#34;時宗の寺院で、天竜川東岸の磐田市池田330番地に所在します。平安時代末期に池田で生まれ平宗盛の寵愛を受けた熊野御前（ゆやごぜん）ゆかりの寺として知られ、熊野御前が手植えしたと伝わる樹齢800年超の藤「熊野の長フジ」は1932年（昭和7年）に国の天然記念物に指定されています。境内には熊野御前とその母の墓所があります。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-12&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9284&#34;},{&#34;title&#34;:&#34;行興寺/熊野の長藤（磐田市観光協会）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;所在地（池田330）、熊野御前手植え伝承、1932年国天然記念物指定、県指定5株、樹齢850年超、見頃を確認&#34;,&#34;url&#34;:&#34;https://kanko-iwata.jp/spot/tanoshimu-769/&#34;},{&#34;title&#34;:&#34;熊野の長フジ（磐田市公式ウェブサイト・国指定文化財）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;国指定天然記念物1本・県指定天然記念物5本が池田の行興寺に所在すること、熊野御前（平宗盛に仕えた）ゆかりの藤であることを確認&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/sports_midokoro/bunkazai/kunishitei/1002051.html&#34;},{&#34;title&#34;:&#34;熊野の長フジ（Wikipedia）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;国指定1932年7月25日・県指定1972年9月26日の指定年月日、樹齢800〜850年、熊野御前が藤原重徳の娘で1180年上洛の伝承、本堂左側の熊野御前と母の墓所を確認&#34;,&#34;url&#34;:&#34;https://ja.wikipedia.org/wiki/%E7%86%8A%E9%87%8E%E3%81%AE%E9%95%B7%E3%83%95%E3%82%B8&#34;},{&#34;title&#34;:&#34;ニッポンの霊場 豊田郡三十三観音霊場&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;第25番＝摂取山行興寺（時宗・池田330・十一面観世音菩薩、熊野の長藤で著名）を確認。寺名・宗派・住所がDBと一致。&#34;,&#34;url&#34;:&#34;https://nippon-reijo.jimdofree.com/%E6%8E%B2%E8%BC%89%E9%9C%8A%E5%A0%B4%E3%81%AE%E4%B8%80%E8%A6%A7/%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/%E8%B1%8A%E7%94%B0%E9%83%A1%E4%B8%89%E5%8D%81%E4%B8%89%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/&#34;},{&#34;title&#34;:&#34;時宗公式ページ 時宗寺院一覧（時宗宗務所）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;一覧掲載のみ。第17教区に「行興寺（ｷﾞｮｳｺｳｼﾞ）〒438-0805 静岡県磐田市池田330」として掲載。由緒・本尊・行事の記載はない。&#34;,&#34;url&#34;:&#34;http://www.jishu.or.jp/jishu-shumusho/jishu-temples/&#34;},{&#34;title&#34;:&#34;市指定文化財｜磐田市公式ウェブサイト&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;分類・時代・所在地・所有者を一覧表で確認&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/sports_midokoro/bunkazai/bunkazainitsuite/1002039.html&#34;},{&#34;title&#34;:&#34;県指定文化財｜磐田市公式ウェブサイト&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;県指定文化財の分類・指定日・所有者を一覧表で確認&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/sports_midokoro/bunkazai/bunkazainitsuite/1002038.html&#34;},{&#34;title&#34;:&#34;磐田市文化財一覧オープンデータ（LinkData・CC BY）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;磐田市公開の文化財一覧オープンデータ。名称・よみ・所在地により寺院と文化財の対応を照合&#34;,&#34;url&#34;:&#34;http://linkdata.org/work/rdf1s10219i&#34;},{&#34;title&#34;:&#34;国指定文化財等データベース 熊野の長フジ&#34;,&#34;type&#34;:&#34;文化財データベース&#34;,&#34;note&#34;:&#34;文化庁の国指定台帳。天然記念物、指定日昭和7年7月25日、指定説明原文を確認。&#34;,&#34;url&#34;:&#34;https://kunishitei.bunka.go.jp/heritage/detail/401/1328&#34;},{&#34;title&#34;:&#34;しずおか文化財ナビ 熊野の長フジ（磐田市 国指定）&#34;,&#34;type&#34;:&#34;文化財データベース&#34;,&#34;note&#34;:&#34;所在地池田330、所有者行興寺であることを確認。&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/kankosports/bunkageijutsu/bunkazai/1002825/1041003/1041884/1004985/1021418.html&#34;},{&#34;title&#34;:&#34;しずおか文化財ナビ 熊野の長フジ（磐田市 県指定）&#34;,&#34;type&#34;:&#34;文化財データベース&#34;,&#34;note&#34;:&#34;県指定天然記念物5本、指定日1972年9月26日、所有者行興寺を確認。&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/kankosports/bunkageijutsu/bunkazai/1002825/1041003/1041884/1004985/1021420.html&#34;},{&#34;title&#34;:&#34;しずおか文化財ナビ 熊野絵巻&#34;,&#34;type&#34;:&#34;文化財データベース&#34;,&#34;note&#34;:&#34;県指定有形文化財（絵画）、指定日2020年12月8日、室町後期・23紙、謡曲絵巻化の早例との解説を確認。&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/kankosports/bunkageijutsu/bunkazai/1002825/1041003/1041884/1004985/1021400.html&#34;},{&#34;title&#34;:&#34;熊野の長藤について｜磐田市観光協会&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;熊野の長藤まつりの開花情報発信・シャトルバス運行に池田まちづくり協議会が関わっている旨の記載&#34;,&#34;url&#34;:&#34;https://kanko-iwata.jp/2026/04/post-15638/&#34;},{&#34;title&#34;:&#34;池田まちづくり協議会&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;地元地域組織の存在確認（行興寺固有の詳細記載は未確認）&#34;,&#34;url&#34;:&#34;https://ikeda-uk.jp/&#34;},{&#34;title&#34;:&#34;磐田市文化財保存活用地域計画（令和6年9月）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;p.52 C富岡・池田・井通地区「行興寺の宝篋印塔（熊野とその母の墓石）」&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/_res/projects/default_project/_page_/001/009/747/keikaku202409.pdf&#34;}],&#34;research_todos&#34;:[&#34;山号の確認（公開Web情報では未確認）&#34;,&#34;時宗寺院としての創建年代・開山の確認（時宗教団の寺院資料・『磐田市誌』）&#34;,&#34;熊野御前と母の墓の文化財指定の有無（市指定史跡等）の確認&#34;,&#34;毎年開催される「熊野の長藤まつり」の来歴の確認&#34;,&#34;本尊十一面観世音菩薩の像容・年代に関する資料の確認&#34;,&#34;熊野の長藤で著名な寺院だが、時宗公式サイト（jishu.or.jp）・総本山遊行寺サイト（yugyoji.or.jp）のいずれにも個別紹介ページは見当たらない。由緒（熊野御前伝承）は磐田市・観光協会・国指定天然記念物資料で裏取りする。&#34;,&#34;県指定「熊野絵巻」の所有者名義（行興寺か池田地区の団体か）を県告示または磐田市文化財課で確認する。&#34;,&#34;年中行事（施餓鬼会・彼岸会等）の実施有無・時期&#34;,&#34;永代供養・納骨堂等の墓地情報の有無&#34;,&#34;護持会・世話人会等檀家組織の公開情報の有無&#34;,&#34;熊野御前の年忌供養など寺院独自の法要の有無&#34;],&#34;heritage_status&#34;:&#34;国指定天然記念物「熊野の長フジ」（境内、1932年指定）および静岡県指定天然記念物「熊野の長藤」5株（1972年指定）&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;熊野御前の伝承&#34;,&#34;body&#34;:&#34;行興寺は、能楽の演目『熊野（ゆや）』の主人公として知られる熊野御前ゆかりの寺です。熊野御前は平安時代末期に天竜川の渡し場として栄えた池田の地に生まれ、池田庄の庄司藤原重徳の娘と伝えられます。治承4年（1180年）ごろ京へ上り、平清盛の子・平宗盛に仕えてその寵愛を受けましたが、故郷の母の重病を知って遠江国池田へ帰ったと伝えられています。参拝情報サイトでは、本尊の十一面観世音菩薩は熊野御前が信仰したものと伝えられると紹介されています。本堂左手には熊野御前とその母の墓所が並んで保存されています。&#34;},{&#34;heading&#34;:&#34;国指定天然記念物「熊野の長フジ」&#34;,&#34;body&#34;:&#34;境内には熊野御前が生前に手植えしたと伝えられる藤の古木があり、「熊野の長フジ」として1932年（昭和7年）7月25日に国の天然記念物に指定されました。国指定の株は樹齢800年から850年と推定される老樹です。このほか1972年（昭和47年）9月26日には「熊野の長藤」として5株が静岡県指定天然記念物となっており、こちらは樹齢250年ほどとされます。磐田市の資料でも、国指定1本・県指定5本のフジが池田の行興寺に所在すると記されています。&#34;},{&#34;heading&#34;:&#34;藤の見頃と現在&#34;,&#34;body&#34;:&#34;藤は例年4月中旬から下旬に見頃を迎え、花房は長いもので1メートル以上に達します。磐田市観光協会は境内に17本の長藤が植えられていると紹介しており、開花期には多くの観光客が訪れます。行興寺の藤は磐田市を代表する花の名所として、市・観光協会の観光情報で毎年案内されています。&#34;},{&#34;heading&#34;:&#34;文化財資料からの補足&#34;,&#34;body&#34;:&#34;行興寺境内の「熊野の長フジ」は昭和7年（1932年）7月25日に国の天然記念物に指定されました。国指定文化財等データベースの指定説明には「幹ハ根本ヨリ二分シテ二支幹トナル　根元ノ周囲約一．八メートル花總ハ長一．五メートルニ達ス　藤ノ巨樹トシテ有數ノモノナリ」と記されています。 国指定の1本に加え、境内の同種のフジの老木5本が昭和47年（1972年）9月26日に静岡県指定天然記念物となっています。花房の長さは1メートルから1.5メートルに達します。 謡曲「熊野」を絵画化した「熊野絵巻」は室町時代後期の制作で、23紙を継いだ絵巻です。謡曲を絵巻化した全国的にも早い例とされ、令和2年（2020年）12月8日に静岡県指定有形文化財（絵画）に指定されました。 木造十一面観音菩薩坐像は豊田地区唯一の鎌倉時代の仏像で、熊野御前の持仏という伝承があります。磐田市指定有形文化財（彫刻）です。 永禄12年（1569年）前後に発給された池田の渡船に関わる「行興寺文書」は、徳川家康による渡船統制を示す市指定古文書です。また境内の宝篋印塔は形式から14世紀末（南北朝時代）の製作と考えられ、県内でも極めて古い宝篋印塔として市指定史跡になっています。&#34;},{&#34;heading&#34;:&#34;発掘調査・考古資料からの補足&#34;,&#34;body&#34;:&#34;行興寺に伝わる木造十一面観音菩薩坐像（鎌倉時代作）は熊野の持仏との伝承があり、豊田地区唯一の鎌倉時代の仏像として平成17年（2005年）11月21日に磐田市指定文化財（彫刻）に指定された。 境内にある行興寺の宝篋印塔は形式から14世紀末（南北朝時代）の製作と考えられ、熊野とその母の墓石と伝えられる。県内でも古い宝篋印塔として平成17年（2005年）11月21日に磐田市指定史跡に指定された。 行興寺文書は永禄12年（1569年）前後に発給された池田の渡船に関する文書で、平成17年（2005年）11月21日に磐田市指定文化財（古文書）に指定された。&#34;}],&#34;cultural_assets&#34;:[{&#34;name&#34;:&#34;熊野の長フジ&#34;,&#34;designation&#34;:&#34;国指定天然記念物&#34;,&#34;summary&#34;:&#34;1932年（昭和7年）7月25日指定。熊野御前の手植えと伝わる樹齢800〜850年の藤の古木で、花房は1メートル以上に達します。&#34;},{&#34;name&#34;:&#34;熊野の長藤&#34;,&#34;designation&#34;:&#34;静岡県指定天然記念物&#34;,&#34;summary&#34;:&#34;1972年（昭和47年）9月26日指定の藤5株。樹齢はおよそ250年とされ、国指定株とともに境内の藤棚を形成しています。&#34;},{&#34;name&#34;:&#34;熊野絵巻&#34;,&#34;designation&#34;:&#34;静岡県指定文化財（絵画）&#34;,&#34;summary&#34;:&#34;室町時代の絵巻で、行興寺が所有します。熊野御前の伝承を今に伝える寺の性格を示す資料です。&#34;},{&#34;name&#34;:&#34;木造十一面観音菩薩坐像&#34;,&#34;designation&#34;:&#34;磐田市指定文化財（彫刻）&#34;,&#34;summary&#34;:&#34;鎌倉時代の作とされる坐像で、行興寺が所有します。&#34;},{&#34;name&#34;:&#34;行興寺の宝篋印塔&#34;,&#34;designation&#34;:&#34;磐田市指定文化財（史跡）&#34;,&#34;summary&#34;:&#34;室町時代の宝篋印塔です。境内に伝わる石造遺物として市の史跡に指定されています。&#34;},{&#34;name&#34;:&#34;行興寺文書&#34;,&#34;designation&#34;:&#34;磐田市指定文化財（古文書）&#34;,&#34;summary&#34;:&#34;江戸時代の文書群です。市の一覧では所有者は個人と記載されています。&#34;}],&#34;pilgrimage_note&#34;:&#34;豊田郡三十三観音霊場第25番札所（札所本尊十一面観世音菩薩・享保年間開創の歴史的霊場で現在は活動していない）&#34;,&#34;danka_info&#34;:{&#34;community_role&#34;:&#34;境内の藤「熊野の長フジ」（国指定天然記念物）の開花に合わせた地域行事「熊野の長藤まつり」が例年4月中旬から下旬にかけて行われ、開花情報の発信や無料シャトルバスの運行などの運営に地元組織の池田まちづくり協議会が関わっていることが確認できる。&#34;}},{&#34;temple_id&#34;:&#34;iwata-0064&#34;,&#34;slug&#34;:&#34;jigenji-kamikandamasu&#34;,&#34;name&#34;:&#34;慈眼寺&#34;,&#34;name_kana&#34;:&#34;じげんじ&#34;,&#34;aliases&#34;:[],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;unknown&#34;,&#34;status_label&#34;:&#34;現地痕跡未確認&#34;,&#34;detail_page&#34;:false,&#34;sect&#34;:&#34;臨済宗妙心寺派&#34;,&#34;address&#34;:&#34;静岡県磐田市上神増99番地&#34;,&#34;district_id&#34;:&#34;toyooka&#34;,&#34;area&#34;:&#34;豊岡&#34;,&#34;main_deity&#34;:&#34;観世音菩薩&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;慈眼寺は磐田市上神増にある臨済宗妙心寺派の寺院で、『静岡県磐田郡誌』（1921年）には妙心寺末、本尊は観世音菩薩、天正14年（1586年）の開基創建と記されています。延宝4年（1676年）に快源禅師を中興開祖として本堂・庫裏が建立され、明治11年（1878年）に本堂・庫裏が再建されました。江戸末期には多数の筆子を集めた寺子屋が営まれ、明治8年（1875年）には広瀬尋常小学校の前身の一つである上神増学校が境内に置かれるなど、地域の教育の場としても機能してきました。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9286&#34;},{&#34;title&#34;:&#34;慈眼寺｜磐田市上神増｜臨済宗妙心寺派（お寺一覧ナビ）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;宗派（臨済宗妙心寺派）・住所（磐田市上神増99、〒438-0115）を確認。山号・由緒の記載はなし&#34;,&#34;url&#34;:&#34;https://otera-ichiran.com/otera-shizuokaken-iwatashi81/&#34;},{&#34;title&#34;:&#34;上神増（Wikipedia）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;地区の施設として臨済宗妙心寺派慈眼寺が記載されていること、バス停「慈眼寺入口」の存在、上神増村の沿革を確認&#34;,&#34;url&#34;:&#34;https://ja.wikipedia.org/wiki/%E4%B8%8A%E7%A5%9E%E5%A2%97&#34;},{&#34;title&#34;:&#34;サーチ寺院 静岡県磐田市の寺院・御堂一覧&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;慈眼寺が臨済宗妙心寺派・磐田市上神増99番地の宗教法人として登載されていることを確認&#34;,&#34;url&#34;:&#34;https://www.bukyou.com/BukyBukyou/TBukyou22/C22CNo211Detail.html&#34;},{&#34;title&#34;:&#34;『静岡県磐田郡誌』静岡県磐田郡役所編（1921年）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション。第13章 神社及宗教に「23慈眼寺（広瀬村）」の由緒、第12章 教育に寺子屋（筆子140〜150名）と上神増学校（明治8年設置）の記載&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680&#34;},{&#34;title&#34;:&#34;コトバンク「上神増村」（日本歴史地名大系）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;上神増村の位置・石高・中世の呼称「神蔵」・寛文11年検地の記述&#34;,&#34;url&#34;:&#34;https://kotobank.jp/word/上神増村&#34;},{&#34;title&#34;:&#34;ニッポンの霊場 磐田郡三十三観音霊場&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;第13番＝円通山慈眼寺（臨済宗妙心寺派・上神増99）を確認。袋井市高尾の慈眼寺（曹洞宗・遠州三十三観音14番）とは別寺院であることを宗派・住所で確認。&#34;,&#34;url&#34;:&#34;https://nippon-reijo.jimdofree.com/%E6%8E%B2%E8%BC%89%E9%9C%8A%E5%A0%B4%E3%81%AE%E4%B8%80%E8%A6%A7/%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/%E7%A3%90%E7%94%B0%E9%83%A1%E4%B8%89%E5%8D%81%E4%B8%89%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/&#34;},{&#34;title&#34;:&#34;臨黄ネット 寺院検索（静岡県磐田市・妙心寺派）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;一覧掲載のみ。寺名「慈眼寺（じげんじ）」・住所「〒438-0115 上神増99」を確認（台帳と一致）。本尊・由緒・行事欄は空欄。&#34;,&#34;url&#34;:&#34;https://rinnou.net/search/?prefectures=%E9%9D%99%E5%B2%A1%E7%9C%8C&#38;address_1=%E7%A3%90%E7%94%B0%E5%B8%82&#38;shuha=%E5%A6%99%E5%BF%83%E5%AF%BA%E6%B4%BE&#34;}],&#34;research_todos&#34;:[&#34;山号・本尊・創建年代の確認（現地・『豊岡村誌』『磐田市誌』）&#34;,&#34;臨済宗妙心寺派の寺院データベース（妙心寺派宗務本所資料）での登録内容確認&#34;,&#34;遠江の観音霊場・薬師霊場の札所であるかの確認（寺号から観音信仰との関連が想定されるため）&#34;,&#34;「慈眼寺入口」バス停名の由来となった地域との関係史の調査&#34;,&#34;開基者（開山僧）の名前の確認（『静岡県磐田郡誌』の該当箇所は活字の判読が難しい）&#34;,&#34;山号の確認&#34;,&#34;寺子屋の師僧名と閉設時期の確認&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;所在と地域&#34;,&#34;body&#34;:&#34;慈眼寺は磐田市北部の上神増に所在する臨済宗妙心寺派の寺院です。上神増は江戸時代から1889年（明治22年）まで豊田郡上神増村として存在した地域で、隣接する神増の北に位置することが大字名の由来とされます。地区を通る遠鉄バス磐田天竜線には「慈眼寺入口」バス停があり、寺号が地域の目印として定着していることがうかがえます。『日本歴史地名大系』の上神増村の項によれば、この地は天竜川下流域左岸に位置し、中世には「神蔵（かんぞう）」と呼ばれ、寛文11年（1671年）に検地が実施されました。&#34;},{&#34;heading&#34;:&#34;『静岡県磐田郡誌』にみる由緒&#34;,&#34;body&#34;:&#34;大正10年（1921年）刊行の『静岡県磐田郡誌』は、「慈眼寺（広瀬村）　広瀬村上神増字沢下に在り。妙心寺末に属し、本尊は観世音菩薩なり。天正14年、開基創建に係る」と記し、さらに延宝4年（1676年）12月に中興開祖として快源禅師を請じて本堂・庫裏等を建立したこと、元禄15年（1702年）正月に海宗が寺を継いで住したこと、明治11年（1878年）2月に本堂並びに庫裏を再建したことを伝えています。また寛文11年（1671年）9月の成瀬彦兵衛による検地の際、高6斗2升4合が除地（年貢を免除された土地）とされたことも記されています。&#34;},{&#34;heading&#34;:&#34;教育の場としての慈眼寺&#34;,&#34;body&#34;:&#34;『静岡県磐田郡誌』の教育の章には、江戸末期から明治初期の寺子屋として「広瀬村上神増慈眼寺」の師僧のもとに140〜150名もの筆子が学んだことが記されており、郡内でも有数の規模でした。また同郡誌の広瀬尋常高等小学校の沿革には、明治8年（1875年）10月20日に小学野部学校の分校として上神増学校が「上神増村29番地慈眼寺内」に設けられ、上神増・一貫地・社山・神増の4村の学齢児童を教育したこと、明治22年（1889年）に松ノ木島学校と合併して広瀬尋常小学校となったことが記されています。&#34;}],&#34;founded_period&#34;:&#34;天正14年（1586年）開基創建（『静岡県磐田郡誌』）&#34;,&#34;cultural_assets&#34;:[],&#34;pilgrimage_note&#34;:&#34;磐田郡三十三観音霊場第13番札所&#34;},{&#34;temple_id&#34;:&#34;iwata-0065&#34;,&#34;slug&#34;:&#34;entsuji-ohira&#34;,&#34;name&#34;:&#34;圓通寺&#34;,&#34;name_kana&#34;:&#34;えんつうじ&#34;,&#34;aliases&#34;:[&#34;温泉山&#34;,&#34;大平寺&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;unknown&#34;,&#34;status_label&#34;:&#34;現地痕跡未確認&#34;,&#34;detail_page&#34;:false,&#34;sect&#34;:&#34;臨済宗妙心寺派&#34;,&#34;address&#34;:&#34;静岡県磐田市大平530番&#34;,&#34;district_id&#34;:&#34;toyooka&#34;,&#34;area&#34;:&#34;豊岡&#34;,&#34;main_deity&#34;:&#34;聖観世音菩薩&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;圓通寺は磐田市大平にある臨済宗妙心寺派の寺院で、山号は温泉山です。『静岡県磐田郡誌』（1921年）には敷地の永安寺の末寺、本尊は聖観世音菩薩で、寺記によれば陽巌の開創（年代不詳）、延享3年（1746年）に堂宇を再建したと記されています。現地の案内看板は、天平時代に僧行基が開山した大平寺を前身とし、後に円通寺と改められたとの伝承を載せており、鉱泉の湧いた土地柄を映す「温泉山」の山号とあわせて、湯にまつわる伝承を色濃く残す寺院です。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9288&#34;},{&#34;title&#34;:&#34;大平 (磐田市)（Wikipedia）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;施設として「臨済宗妙心寺派 温泉山 円通寺」の記載を確認。敷地村誌による御湯平村からの改称伝承、大平の沿革も確認&#34;,&#34;url&#34;:&#34;https://ja.wikipedia.org/wiki/%E5%A4%A7%E5%B9%B3_(%E7%A3%90%E7%94%B0%E5%B8%82)&#34;},{&#34;title&#34;:&#34;サーチ寺院 静岡県磐田市の寺院・御堂一覧&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;圓通寺が臨済宗妙心寺派・磐田市大平530番地の宗教法人として登載されていることを確認&#34;,&#34;url&#34;:&#34;https://www.bukyou.com/BukyBukyou/TBukyou22/C22CNo211Detail.html&#34;},{&#34;title&#34;:&#34;『静岡県磐田郡誌』静岡県磐田郡役所編（1921年）第13章 神社及宗教&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション。「31圓通寺（敷地村）」の由緒記載&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680&#34;},{&#34;title&#34;:&#34;『妙心寺派寺院録』正法輪協会編（1912年）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション。コマ77に磐田郡敷地村（大平）の妙心寺派寺院として掲載&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/943814&#34;},{&#34;title&#34;:&#34;自然と歴史の中を歩く！「冷泉・鉱泉跡を訪ね、旧磐田郡敷地村へ⑥―温泉山圓通寺」（2021年）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;現地看板「大平の案内」の記載（元大平寺・行基開山伝承・湯沢の湯・大平薬師堂の寅薬師）の紹介&#34;,&#34;url&#34;:&#34;https://arukunodaisuki.hamazo.tv/e9314869.html&#34;},{&#34;title&#34;:&#34;臨黄ネット 寺院検索（静岡県磐田市・妙心寺派）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;一覧掲載のみ。寺名「圓通寺（えんつうじ）」・住所「大平530」を確認（台帳と一致）。本尊・由緒・行事欄は空欄。&#34;,&#34;url&#34;:&#34;https://rinnou.net/search/?prefectures=%E9%9D%99%E5%B2%A1%E7%9C%8C&#38;address_1=%E7%A3%90%E7%94%B0%E5%B8%82&#38;shuha=%E5%A6%99%E5%BF%83%E5%AF%BA%E6%B4%BE&#34;}],&#34;research_todos&#34;:[&#34;本尊・創建年代・開山の確認（『豊岡村誌』『敷地村誌』『磐田市誌』）&#34;,&#34;山号「温泉山」と旧地名「御湯平」・鉱泉湧出伝承との関係の調査&#34;,&#34;妙心寺派宗務本所資料での本末関係の確認&#34;,&#34;近隣の敷地・虫生の妙心寺派寺院群との関係（同一法系かどうか）の調査&#34;,&#34;開創者・陽巌の事績と開創年代の確認&#34;,&#34;前身とされる大平寺から円通寺への改称時期の検証（現地看板の年紀表記には錯誤の可能性がある）&#34;,&#34;大平薬師堂と圓通寺の関係（境外仏堂か否か）の確認&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;山号と地名&#34;,&#34;body&#34;:&#34;圓通寺は磐田市北部の大平（おいだいら）に所在する臨済宗妙心寺派の寺院で、山号を温泉山と称します。所在地の大平について、『敷地村誌』ではかつて御湯平村と呼ばれ、天正年間に徳川家康が光明山に布陣した際に改称を命じたことが地名の由来と記されていると紹介されています。大平は1889年（明治22年）に周辺6村と合併して敷地村となり、1955年（昭和30年）に豊岡村、2005年（平成17年）に磐田市の一部となりました。山号「温泉山」とかつての地名「御湯平」との関係については、裏付けとなる資料は確認できていません。&#34;},{&#34;heading&#34;:&#34;『静岡県磐田郡誌』にみる由緒&#34;,&#34;body&#34;:&#34;大正10年（1921年）刊行の『静岡県磐田郡誌』は、「圓通寺（敷地村）　敷地村大平に在り。当村永安寺の末寺にして、本尊は聖観世音菩薩なり。寺記に依れば、陽巌の開創なるも年代詳かならず。延享3年、堂宇の再建をなせりとあり」と記しています。延享3年は1746年にあたります。また明治45年（1912年）刊行の『妙心寺派寺院録』と大正10年（1921年）刊行の同書改訂版にも、磐田郡敷地村大平の妙心寺派寺院として掲載されており、敷地の永安寺を本寺とする本末関係が近代を通じて確認できます。&#34;},{&#34;heading&#34;:&#34;行基と家康の伝承・大平薬師堂&#34;,&#34;body&#34;:&#34;地域ブログ「自然と歴史の中を歩く！」（2021年）が紹介する現地の案内看板「大平の案内」には、「温泉山円通寺（元大平寺）　天平時代　僧行基大平寺を開山」とあり、後に徳川家康が円通寺と改めさせたとの伝承を載せています。また同看板は、付近の「湯沢の湯」について行基や家康も湯に入り身体を癒したと伝えられることや、大平薬師堂の寅薬師如来が江戸時代中期の宝暦年間（1751〜1764年）に安置されたとされ、12年に一度、寅年の秋に開帳されてきたこと、目などの病に御利益があるとされることを記しています。これらは現地看板の伝承であり、『静岡県磐田郡誌』が伝える由緒（陽巌の開創・年代不詳）とは別系統の寺伝として区別されます。同ブログの探訪時点では無住の寺とみられると記されています。&#34;}],&#34;founded_period&#34;:&#34;不詳（『静岡県磐田郡誌』は陽巌の開創と記す。現地看板の伝承では天平時代に行基が開いた大平寺が前身）&#34;,&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0066&#34;,&#34;slug&#34;:&#34;mushuoji-mushuo&#34;,&#34;name&#34;:&#34;虫生寺&#34;,&#34;name_kana&#34;:&#34;ちゅうしょうじ&#34;,&#34;aliases&#34;:[&#34;むしゅうじ（読み。宗派公式表記との相違あり）&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;unknown&#34;,&#34;status_label&#34;:&#34;現地痕跡未確認&#34;,&#34;detail_page&#34;:false,&#34;sect&#34;:&#34;臨済宗妙心寺派&#34;,&#34;address&#34;:&#34;静岡県磐田市虫生457番地の1&#34;,&#34;district_id&#34;:&#34;toyooka&#34;,&#34;area&#34;:&#34;豊岡&#34;,&#34;main_deity&#34;:&#34;釈迦牟尼如来&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;虫生寺は磐田市虫生にある臨済宗妙心寺派の寺院で、『静岡県磐田郡誌』（1921年）には敷地の永安寺の末寺、本尊は釈迦牟尼如来、政翁の開創と伝えるものの年代は不詳と記されています。地名をそのまま寺号とする寺院で、所在地の虫生（字上の平）は、かつて冷鉱泉が湧き秋葉山参詣の旅人が立ち寄る湯治場として明治の終わり頃まで賑わった山あいの集落です。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9290&#34;},{&#34;title&#34;:&#34;虫生 (磐田市)（Wikipedia）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;地区の寺院として臨済宗妙心寺派の虫生寺が記載されていることを確認。敷地村誌による「蒸湯」転訛説、虫生村の沿革、本宮山・熊野神社の存在も確認&#34;,&#34;url&#34;:&#34;https://ja.wikipedia.org/wiki/%E8%99%AB%E7%94%9F_(%E7%A3%90%E7%94%B0%E5%B8%82)&#34;},{&#34;title&#34;:&#34;サーチ寺院 静岡県磐田市の寺院・御堂一覧&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;虫生寺が臨済宗妙心寺派・磐田市虫生457番地の1の宗教法人として登載されていることを確認&#34;,&#34;url&#34;:&#34;https://www.bukyou.com/BukyBukyou/TBukyou22/C22CNo211Detail.html&#34;},{&#34;title&#34;:&#34;『静岡県磐田郡誌』静岡県磐田郡役所編（1921年）第13章 神社及宗教&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション。「29虫生寺（敷地村）」の由緒記載&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680&#34;},{&#34;title&#34;:&#34;『妙心寺派寺院録』正法輪協会編（1912年）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション。コマ77に磐田郡敷地村虫生の妙心寺派寺院として掲載&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/943814&#34;},{&#34;title&#34;:&#34;自然と歴史の中を歩く！「冷泉・鉱泉跡を訪ね、旧磐田郡敷地村へ⑤―中遠昔ばなし第4話『虫生の湯』」（2021年）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;昔話「虫生の湯」（豊岡物語・中遠昔ばなし）の紹介&#34;,&#34;url&#34;:&#34;https://arukunodaisuki.hamazo.tv/e9314866.html&#34;},{&#34;title&#34;:&#34;自然と歴史の中を歩く！「虫生の冷鉱泉を訪ねる①―虫生湯治旅行記」&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;新居関所史料館企画展資料「虫生湯治旅行記と秋葉道」の紹介、角川『静岡県の地名大辞典』の地名由来説の引用&#34;,&#34;url&#34;:&#34;https://arukunodaisuki.hamazo.tv/e8299202.html&#34;},{&#34;title&#34;:&#34;臨黄ネット 寺院検索（静岡県磐田市・妙心寺派）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;一覧掲載のみ。寺名「虫生寺（ちゅうしょうじ）」・住所「虫生457-1」を確認（住所は台帳と一致）。本尊・由緒・行事欄は空欄。 2026-07-12にATAWI TEMPLE編集部が同ページを再確認し、この読みを正式表記として採用（台帳の旧読み「むしゅうじ」はaliasesへ移動）。&#34;,&#34;url&#34;:&#34;https://rinnou.net/search/?prefectures=%E9%9D%99%E5%B2%A1%E7%9C%8C&#38;address_1=%E7%A3%90%E7%94%B0%E5%B8%82&#38;shuha=%E5%A6%99%E5%BF%83%E5%AF%BA%E6%B4%BE&#34;}],&#34;research_todos&#34;:[&#34;山号・本尊・創建年代の確認（『敷地村誌』『豊岡村誌』『磐田市誌』）&#34;,&#34;寺院の現況（住職常駐か、近隣寺院による兼務か）の現地確認&#34;,&#34;検索結果に妙心寺派寺籍上の扱いに関する未確認情報があったため、宗派公式資料での現況確認&#34;,&#34;地名由来の鉱泉（蒸湯）伝承と寺の関わりの調査&#34;,&#34;虫生の熊野神社との神仏分離以前の関係の調査&#34;,&#34;開創者・政翁の事績と開創年代の確認&#34;,&#34;山号の確認&#34;,&#34;湯治場としての虫生と虫生寺の関わり（宿坊・別当等の有無）の確認&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;所在と地名&#34;,&#34;body&#34;:&#34;虫生寺は磐田市北部の虫生（むしゅう）に所在する臨済宗妙心寺派の寺院で、地名をそのまま寺号とする珍しい名称です。虫生の地名について、『敷地村誌』ではかつて地内から鉱泉が湧出し、当初「蒸湯（むしゆ）」と称したものが後に転訛したという説が紹介されています。虫生は江戸時代から1889年（明治22年）まで豊田郡虫生村として存在し、その後敷地村・豊岡村を経て2005年（平成17年）に磐田市の一部となりました。地区には本宮山や熊野神社があり、虫生寺の山号・本尊・創建年代を記した公開資料は見つかりませんでした。&#34;},{&#34;heading&#34;:&#34;『静岡県磐田郡誌』にみる由緒&#34;,&#34;body&#34;:&#34;大正10年（1921年）刊行の『静岡県磐田郡誌』は、「虫生寺（敷地村）　敷地村虫生字上の平に在り。当村敷地永安寺の末寺にして、本尊は釈迦牟尼如来なり。伝へ云ふ、政翁の開創に係ると。而も其の年代を詳かにせず」と記しています。また明治45年（1912年）刊行の『妙心寺派寺院録』と大正10年（1921年）刊行の同書改訂版にも、磐田郡敷地村虫生の妙心寺派寺院として掲載されており、敷地の永安寺を本寺とする本末関係が近代を通じて確認できます。&#34;},{&#34;heading&#34;:&#34;湯治場虫生と熊野権現の伝承&#34;,&#34;body&#34;:&#34;虫生には「虫生の湯」の昔話が伝わります。『中遠昔ばなし』第4話（「豊岡物語」所収）によれば、皮膚病に悩む虫生の男が紀州の熊野権現に参拝して病を治し、村人のためにと熊野権現に祈ったところ、夢のお告げに従って冷泉を掘り当て、これを沸かした湯で村人たちの病も治り、浴舎ができて江戸時代の終わりまで湯治客で賑わったといいます。虫生に熊野神社が祀られていることは、この伝承と関わる可能性が指摘されています。また新居関所史料館の企画展資料（2003年）には、新居宿の油問屋「若林屋」の高須嘉兵衛が秋葉詣での途中、疥癬治療のため湯治場虫生に逗留したことを記す「虫生湯治旅行記」が紹介されており、虫生の冷鉱泉は明治の終わり頃まで秋葉山参詣の旅人が立ち寄る湯治場として利用されました。&#34;}],&#34;founded_period&#34;:&#34;不詳（『静岡県磐田郡誌』は政翁の開創と伝えると記す）&#34;,&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0067&#34;,&#34;slug&#34;:&#34;jokoji-shikiji&#34;,&#34;name&#34;:&#34;浄光寺&#34;,&#34;name_kana&#34;:&#34;じょうこうじ&#34;,&#34;aliases&#34;:[],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;unknown&#34;,&#34;status_label&#34;:&#34;現地痕跡未確認&#34;,&#34;detail_page&#34;:false,&#34;sect&#34;:&#34;臨済宗妙心寺派&#34;,&#34;address&#34;:&#34;静岡県磐田市敷地1021番地&#34;,&#34;district_id&#34;:&#34;toyooka&#34;,&#34;area&#34;:&#34;豊岡&#34;,&#34;main_deity&#34;:&#34;阿弥陀如来&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;臨済宗妙心寺派の寺院で、磐田市敷地1021番地に所在します。『静岡県磐田郡誌』（1921年）の由緒では、敷地村敷地字門前にあって同地の永安寺の末寺とされ、本尊は阿弥陀如来、永徳元年（1381年）正月5日に宝庵の開創に係ると記されています。敷地には龍壽山永安寺を本寺とする妙心寺派の末寺群が形成されており、浄光寺はその中で最も古い開創年代を伝える末寺の1つです。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9292&#34;},{&#34;title&#34;:&#34;敷地 (磐田市)（Wikipedia）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;地区の施設として「臨済宗妙心寺派 浄光寺」が永安寺・永明寺・龍雲庵とともに記載されていることを確認&#34;,&#34;url&#34;:&#34;https://ja.wikipedia.org/wiki/%E6%95%B7%E5%9C%B0_(%E7%A3%90%E7%94%B0%E5%B8%82)&#34;},{&#34;title&#34;:&#34;サーチ寺院 静岡県磐田市の寺院・御堂一覧&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;浄光寺が臨済宗妙心寺派・磐田市敷地1021番地の宗教法人として登載されていることを確認&#34;,&#34;url&#34;:&#34;https://www.bukyou.com/BukyBukyou/TBukyou22/C22CNo211Detail.html&#34;},{&#34;title&#34;:&#34;静岡県磐田郡教育会編『静岡県磐田郡誌』（1921年）コマ437「淨光寺（敷地村）」&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション（次世代デジタルライブラリー全文検索で本文確認）&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680/1/437&#34;},{&#34;title&#34;:&#34;臨黄ネット 寺院検索（静岡県磐田市・妙心寺派）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;一覧掲載のみ。寺名「浄光寺（じょうこうじ）」・住所「敷地1021」を確認（台帳と一致）。本尊・由緒・行事欄は空欄。&#34;,&#34;url&#34;:&#34;https://rinnou.net/search/?prefectures=%E9%9D%99%E5%B2%A1%E7%9C%8C&#38;address_1=%E7%A3%90%E7%94%B0%E5%B8%82&#38;shuha=%E5%A6%99%E5%BF%83%E5%AF%BA%E6%B4%BE&#34;}],&#34;research_todos&#34;:[&#34;山号・本尊・創建年代の確認（『敷地村誌』『豊岡村誌』『磐田市誌』）&#34;,&#34;敷地地区に妙心寺派4か寺が集中する背景（本寺・庵寺関係）の調査&#34;,&#34;妙心寺派宗務本所資料での本末関係の確認&#34;,&#34;同名の寺院が各地にあるため、他寺（京都の浄光寺等）との情報混同がないかの継続確認&#34;,&#34;『静岡県磐田郡誌』コマ414の寺院一覧表に山号欄があるが、OCRでは列がずれて判読が難しい。並び順からは浄光寺の山号を「金剛山」と読める可能性があり、原本画像ないし現地での確認が必要。&#34;,&#34;開創者「宝庵」の伝記・法系（永安寺との関係）を『磐田市誌』『豊岡村史』等で確認する。&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;所在と地域&#34;,&#34;body&#34;:&#34;浄光寺は磐田市北部の敷地（しきじ）に所在する臨済宗妙心寺派の寺院です。敷地は天竜浜名湖鉄道敷地駅を擁する旧豊岡村域の大字で、Wikipediaの敷地の項には浄光寺のほか永安寺・永明寺・龍雲庵と、いずれも臨済宗妙心寺派の寺院が4か寺記載されており、狭い地区内に同派寺院が集中していることが確認できます。『静岡県磐田郡誌』（1921年）によれば、この寺院群は敷地字寺中の永安寺を本寺とし、浄光寺・永明寺（いずれも字門前）・龍雲庵（字寺中）などがその末寺として組織されていました。&#34;},{&#34;heading&#34;:&#34;『静岡県磐田郡誌』にみる由緒&#34;,&#34;body&#34;:&#34;『静岡県磐田郡誌』（静岡県磐田郡教育会編、1921年）の「神社及宗教」の章には「淨光寺（敷地村）」として由緒が採録されており、「敷地村敷地字門前に在り。當所永安寺の末にして、本尊は阿彌陀如來なり。永德元年正月五日、寶庵の開創する所に係る」と記されています。永徳元年（1381年）は南北朝時代にあたり、本寺永安寺の草創（郡誌は開山を寂室禅師と記す）に続く時期の開創伝承をもつことになります。山号や近代以降の沿革を伝える公開資料は現時点では確認できていません。&#34;}],&#34;founded_period&#34;:&#34;永徳元年（1381年）&#34;,&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0068&#34;,&#34;slug&#34;:&#34;ryounan-shikiji&#34;,&#34;name&#34;:&#34;龍雲庵&#34;,&#34;name_kana&#34;:&#34;りょううんあん&#34;,&#34;aliases&#34;:[&#34;東嶺山龍雲庵&#34;,&#34;りゅううんあん（読み。宗派公式表記との相違あり）&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;unknown&#34;,&#34;status_label&#34;:&#34;現地痕跡未確認&#34;,&#34;detail_page&#34;:false,&#34;sect&#34;:&#34;臨済宗妙心寺派&#34;,&#34;address&#34;:&#34;静岡県磐田市敷地1367番地の1&#34;,&#34;district_id&#34;:&#34;toyooka&#34;,&#34;area&#34;:&#34;豊岡&#34;,&#34;main_deity&#34;:&#34;薬師如来&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;臨済宗妙心寺派の寺院で、磐田市敷地1367番地の1に所在します。『静岡県磐田郡誌』（1921年）の由緒では、敷地村敷地字寺中にあって東嶺山と号し、当初は永安寺の末寺で本尊は薬師如来、元和8年（1622年）10月20日に簾貞の開創に係ると記されています。慶安元年（1648年）10月24日には朱印寺田高2石5斗を与えられました。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9294&#34;},{&#34;title&#34;:&#34;敷地 (磐田市)（Wikipedia）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;地区の施設として「臨済宗妙心寺派 龍雲庵」が記載されていることを確認&#34;,&#34;url&#34;:&#34;https://ja.wikipedia.org/wiki/%E6%95%B7%E5%9C%B0_(%E7%A3%90%E7%94%B0%E5%B8%82)&#34;},{&#34;title&#34;:&#34;サーチ寺院 静岡県磐田市の寺院・御堂一覧&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;龍雲庵が臨済宗妙心寺派・磐田市敷地1367番地の1の宗教法人として登載されていることを確認&#34;,&#34;url&#34;:&#34;https://www.bukyou.com/BukyBukyou/TBukyou22/C22CNo211Detail.html&#34;},{&#34;title&#34;:&#34;静岡県磐田郡教育会編『静岡県磐田郡誌』（1921年）コマ437「龍雲庵（敷地村）」&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション（全文検索で本文確認）&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680/1/437&#34;},{&#34;title&#34;:&#34;太田亮『遠江』（磯部甲陽堂、1927年）コマ178 寺領一覧「藥師堂龍雲庵（敷地村）二石五斗」&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/1176478/1/178&#34;},{&#34;title&#34;:&#34;臨黄ネット 寺院検索（静岡県磐田市・妙心寺派）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;一覧掲載のみ。寺名「龍雲庵（りょううんあん）」・住所「敷地1367-1」を確認（住所は台帳と一致）。本尊・由緒・行事欄は空欄。 2026-07-12にATAWI TEMPLE編集部が同ページを再確認し、この読みを正式表記として採用（台帳の旧読み「りゅううんあん」はaliasesへ移動）。&#34;,&#34;url&#34;:&#34;https://rinnou.net/search/?prefectures=%E9%9D%99%E5%B2%A1%E7%9C%8C&#38;address_1=%E7%A3%90%E7%94%B0%E5%B8%82&#38;shuha=%E5%A6%99%E5%BF%83%E5%AF%BA%E6%B4%BE&#34;}],&#34;research_todos&#34;:[&#34;山号・本尊・創建年代の確認（『敷地村誌』『豊岡村誌』『磐田市誌』）&#34;,&#34;「庵」を称する経緯と、敷地地区の他の妙心寺派寺院（浄光寺・永安寺・永明寺）との本末・兼務関係の調査&#34;,&#34;浜松市の龍雲寺など類似名寺院との混同がないかの継続確認&#34;,&#34;現地での寺号標・掲示の確認&#34;,&#34;開創者「簾貞」の法系（『磐田郡誌』の住職一覧OCRには「簾貞」の名がみえる）と、永安寺歴代との関係を確認する。&#34;,&#34;薬師堂・薬師如来像の現況を現地資料で確認する。&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;所在と地域&#34;,&#34;body&#34;:&#34;龍雲庵は磐田市北部の敷地に所在する臨済宗妙心寺派の寺院で、寺号に「庵」を用いる点が特徴です。Wikipediaの敷地の項には、浄光寺・永安寺・永明寺とともに「臨済宗妙心寺派 龍雲庵」が地区内の寺院として記載されています。宗教法人一覧でも磐田市敷地1367番地の1の法人として確認できます。『静岡県磐田郡誌』（1921年）によれば、所在地の字は「寺中」で、本寺の永安寺と同じ字内に位置していました。&#34;},{&#34;heading&#34;:&#34;『静岡県磐田郡誌』にみる由緒&#34;,&#34;body&#34;:&#34;『静岡県磐田郡誌』（1921年）の由緒には「敷地村敷地字寺中に在り。東嶺山と號す。當初永安寺の末寺にして、本尊は藥師如來なり。元和八年十月二十日、簾貞の開創に係る。慶安元年十月二十四日、朱符寺田高二石五斗を賜はる」とあります。元和8年（1622年）の開創で、慶安元年（1648年）に江戸幕府から朱印寺田高2石5斗を認められた薬師堂をもつ庵でした。太田亮『遠江』（磯部甲陽堂、1927年）の寺領一覧にも「藥師堂龍雲庵（敷地村）二石五斗」とみえ、朱印高2石5斗が薬師堂領として近世を通じて維持されていたことが確認できます。&#34;}],&#34;founded_period&#34;:&#34;元和8年（1622年）&#34;,&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0069&#34;,&#34;slug&#34;:&#34;eimeiji-shikiji&#34;,&#34;name&#34;:&#34;永明寺&#34;,&#34;name_kana&#34;:&#34;ようめいじ&#34;,&#34;aliases&#34;:[&#34;えいめいじ（読み。宗派公式表記との相違あり）&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;unknown&#34;,&#34;status_label&#34;:&#34;現地痕跡未確認&#34;,&#34;detail_page&#34;:false,&#34;sect&#34;:&#34;臨済宗妙心寺派&#34;,&#34;address&#34;:&#34;静岡県磐田市敷地1014番地&#34;,&#34;district_id&#34;:&#34;toyooka&#34;,&#34;area&#34;:&#34;豊岡&#34;,&#34;main_deity&#34;:&#34;阿弥陀如来&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;臨済宗妙心寺派の寺院で、磐田市敷地1014番地に所在します。『静岡県磐田郡誌』（1921年）の由緒では、敷地村敷地字門前にあって永安寺の末寺とされ、本尊は阿弥陀如来、元和2年（1616年）8月20日に立峰の開創に係ると記されています。明治6年（1873年）11月には当寺を仮校舎として敷地学校（後の敷地小学校）が開校しており、近代教育の出発点にもなった寺院です。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9296&#34;},{&#34;title&#34;:&#34;敷地 (磐田市)（Wikipedia）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;地区の施設として「臨済宗妙心寺派 永明寺」が記載されていることを確認&#34;,&#34;url&#34;:&#34;https://ja.wikipedia.org/wiki/%E6%95%B7%E5%9C%B0_(%E7%A3%90%E7%94%B0%E5%B8%82)&#34;},{&#34;title&#34;:&#34;サーチ寺院 静岡県磐田市の寺院・御堂一覧&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;永明寺が臨済宗妙心寺派・磐田市敷地1014番地の宗教法人として登載されていることを確認&#34;,&#34;url&#34;:&#34;https://www.bukyou.com/BukyBukyou/TBukyou22/C22CNo211Detail.html&#34;},{&#34;title&#34;:&#34;静岡県磐田郡教育会編『静岡県磐田郡誌』（1921年）コマ437「永明寺（敷地村）」&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション（全文検索で本文確認）&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680/1/437&#34;},{&#34;title&#34;:&#34;静岡県磐田郡教育会編『静岡県磐田郡誌』（1921年）コマ296-297「敷地尋常小學校」沿革&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;明治6年に永明寺を校舎とした記録&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680/1/296&#34;},{&#34;title&#34;:&#34;臨黄ネット 寺院検索（静岡県磐田市・妙心寺派）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;一覧掲載のみ。寺名「永明寺（ようめいじ）」・住所「敷地1014」を確認（住所は台帳と一致）。本尊・由緒・行事欄は空欄。 2026-07-12にATAWI TEMPLE編集部が同ページを再確認し、この読みを正式表記として採用（台帳の旧読み「えいめいじ」はaliasesへ移動）。&#34;,&#34;url&#34;:&#34;https://rinnou.net/search/?prefectures=%E9%9D%99%E5%B2%A1%E7%9C%8C&#38;address_1=%E7%A3%90%E7%94%B0%E5%B8%82&#38;shuha=%E5%A6%99%E5%BF%83%E5%AF%BA%E6%B4%BE&#34;}],&#34;research_todos&#34;:[&#34;山号・本尊・創建年代の確認（『敷地村誌』『豊岡村誌』『磐田市誌』）&#34;,&#34;隣接する浄光寺・永安寺との本末・兼務関係の調査&#34;,&#34;妙心寺派宗務本所資料での登録内容確認&#34;,&#34;現地での寺号標・掲示の確認&#34;,&#34;『静岡県磐田郡誌』コマ414の寺院一覧表の山号欄は、並び順からは永明寺を「南林山」と読める可能性があるが列ずれのため断定できない。原本画像ないし現地での確認が必要。&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;所在と地域&#34;,&#34;body&#34;:&#34;永明寺は磐田市北部の敷地に所在する臨済宗妙心寺派の寺院です。Wikipediaの敷地の項には、浄光寺・永安寺・龍雲庵とともに「臨済宗妙心寺派 永明寺」が地区内の寺院として記載されています。所在地の敷地1014番地は、同じ妙心寺派の浄光寺（敷地1021番地）・永安寺（敷地1035番地）とごく近接しており、『静岡県磐田郡誌』（1921年）によれば永明寺と浄光寺は字門前、本寺の永安寺と龍雲庵は字寺中に位置し、本寺を核とする寺院群が地区内に形成されていました。&#34;},{&#34;heading&#34;:&#34;『静岡県磐田郡誌』にみる由緒&#34;,&#34;body&#34;:&#34;『静岡県磐田郡誌』（1921年）の由緒には「敷地村敷地字門前に在り。當所永安寺の末寺にして、本尊は阿彌陀如來なり。元和二年八月二十日、立峰の開創に係る」とあります。開創者の立峰は、同郡誌が永安寺の項で慶長2年（1597年）に永安寺を中興したと記す僧と同名で、本末関係の深さがうかがえます。&#34;},{&#34;heading&#34;:&#34;敷地学校の仮校舎&#34;,&#34;body&#34;:&#34;『静岡県磐田郡誌』の教育の章によれば、明治6年（1873年）11月、敷地村・大当所村・家田村・岩室村・大平村（平松以南16戸）の5か村組合を設置区域として、豊田郡敷地村敷地字門前1014番地の永明寺を校舎に充て、野部学校分校敷地学校が開校しました。明治8年（1875年）10月には校舎を字寺中1035番地の永安寺に移して野部学校から分離し、敷地学校と称しています。この字門前1014番地という所在は現在の永明寺の住所（敷地1014番地）と一致します。&#34;}],&#34;founded_period&#34;:&#34;元和2年（1616年）&#34;,&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0070&#34;,&#34;slug&#34;:&#34;eianji-shikiji&#34;,&#34;name&#34;:&#34;永安寺&#34;,&#34;name_kana&#34;:&#34;えいあんじ&#34;,&#34;aliases&#34;:[&#34;龍壽山永安寺&#34;,&#34;永安禅院&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;unknown&#34;,&#34;status_label&#34;:&#34;現地痕跡未確認&#34;,&#34;detail_page&#34;:false,&#34;sect&#34;:&#34;臨済宗妙心寺派&#34;,&#34;address&#34;:&#34;静岡県磐田市敷地1035番地&#34;,&#34;district_id&#34;:&#34;toyooka&#34;,&#34;area&#34;:&#34;豊岡&#34;,&#34;main_deity&#34;:&#34;釈迦牟尼如来&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;臨済宗妙心寺派の寺院で、磐田市敷地1035番地に所在します。『静岡県磐田郡誌』（1921年）によれば龍壽山と号し、妙心寺の末寺で寺格は中本寺、本尊は釈迦牟尼如来、開山は近江永源寺を開いた寂室（勅諡円応禅師、寂室元光）と伝え、慶長6年（1601年）以降は代々徳川家から寺領12石などの朱印を受けました。浄光寺・永明寺・龍雲庵・清凉院など敷地周辺の末寺群を束ねた地域の中核寺院です。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9298&#34;},{&#34;title&#34;:&#34;敷地 (磐田市)（Wikipedia）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;地区の施設として「臨済宗妙心寺派 永安寺」が記載されていることを確認&#34;,&#34;url&#34;:&#34;https://ja.wikipedia.org/wiki/%E6%95%B7%E5%9C%B0_(%E7%A3%90%E7%94%B0%E5%B8%82)&#34;},{&#34;title&#34;:&#34;サーチ寺院 静岡県磐田市の寺院・御堂一覧&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;永安寺が臨済宗妙心寺派・磐田市敷地1035番地の宗教法人として登載されていることを確認（〒438-0106）&#34;,&#34;url&#34;:&#34;https://www.bukyou.com/BukyBukyou/TBukyou22/C22CNo211Detail.html&#34;},{&#34;title&#34;:&#34;静岡県磐田郡教育会編『静岡県磐田郡誌』（1921年）コマ436「永安寺（敷地村）」&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション（全文検索で本文確認）&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680/1/436&#34;},{&#34;title&#34;:&#34;太田亮『遠江』（磯部甲陽堂、1927年）コマ178-179「永安寺（野邊郷敷地村）臨濟宗、拾貳石。開山寂室禪師」&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/1176478/1/178&#34;},{&#34;title&#34;:&#34;コトバンク「岩室村」（日本歴史地名大系）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;天保7年の岩室村家数を「永安寺賄帳」により記載&#34;,&#34;url&#34;:&#34;https://kotobank.jp/word/岩室村&#34;},{&#34;title&#34;:&#34;ニッポンの霊場 磐田郡三十三観音霊場&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;第16番＝龍寿山永安寺（臨済宗妙心寺派・敷地1035）を確認。同じ敷地地区の永明寺（別寺院）ではないことを寺名・番地で確認。&#34;,&#34;url&#34;:&#34;https://nippon-reijo.jimdofree.com/%E6%8E%B2%E8%BC%89%E9%9C%8A%E5%A0%B4%E3%81%AE%E4%B8%80%E8%A6%A7/%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/%E7%A3%90%E7%94%B0%E9%83%A1%E4%B8%89%E5%8D%81%E4%B8%89%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/&#34;},{&#34;title&#34;:&#34;臨黄ネット 寺院検索（静岡県磐田市・妙心寺派）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;一覧掲載のみ。寺名「永安寺（えいあんじ）」・住所「敷地1035」を確認（台帳と一致）。本尊・由緒・行事欄は空欄。&#34;,&#34;url&#34;:&#34;https://rinnou.net/search/?prefectures=%E9%9D%99%E5%B2%A1%E7%9C%8C&#38;address_1=%E7%A3%90%E7%94%B0%E5%B8%82&#38;shuha=%E5%A6%99%E5%BF%83%E5%AF%BA%E6%B4%BE&#34;},{&#34;title&#34;:&#34;市指定文化財｜磐田市公式ウェブサイト&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;分類・時代・所在地・所有者を一覧表で確認&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/sports_midokoro/bunkazai/bunkazainitsuite/1002039.html&#34;},{&#34;title&#34;:&#34;磐田市文化財一覧オープンデータ（LinkData・CC BY）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;磐田市公開の文化財一覧オープンデータ。名称・よみ・所在地により寺院と文化財の対応を照合&#34;,&#34;url&#34;:&#34;http://linkdata.org/work/rdf1s10219i&#34;},{&#34;title&#34;:&#34;文化遺産オンライン 経筒（石室寺経塚出土）&#34;,&#34;type&#34;:&#34;文化財データベース&#34;,&#34;note&#34;:&#34;磐田市岩室廃寺出土の銅製経筒。大治元年（1126年）銘の全文と東京国立博物館所蔵であることを確認。&#34;,&#34;url&#34;:&#34;https://online.bunka.go.jp/heritages/detail/483542&#34;},{&#34;title&#34;:&#34;文化遺産オンライン 石室寺経塚出土品（白磁合子）&#34;,&#34;type&#34;:&#34;文化財データベース&#34;,&#34;note&#34;:&#34;磐田市岩室廃寺出土の白磁合子（中国製、12世紀）。東京国立博物館所蔵を確認。&#34;,&#34;url&#34;:&#34;https://online.bunka.go.jp/heritages/detail/455891&#34;},{&#34;title&#34;:&#34;磐田市文化財保存活用地域計画（令和6年9月）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;p.37-38 岩室廃寺と山岳信仰・国分寺僧修行道場説、p.50 主要市指定文化財一覧、p.68-69 岩室廃寺遺跡測量調査計画&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/_res/projects/default_project/_page_/001/009/747/keikaku202409.pdf&#34;},{&#34;title&#34;:&#34;いわた文化財だより第250号（磐田市教育委員会文化財課、令和8年1月5日発行）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;p.3-4「岩室中世墳墓群遺跡」平成17年度発掘調査の内容（集石墓12基・骨蔵器出土等）&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/_res/projects/default_project/_page_/001/002/024/dayori250.pdf&#34;},{&#34;title&#34;:&#34;岩室廃寺（豊岡村教育委員会、1987年3月31日発行、鷲見昌治・前田庄一編著）&#34;,&#34;type&#34;:&#34;学術資料&#34;,&#34;note&#34;:&#34;副題「集落近郊林整備事業に伴う緊急発掘調査概報」。1986年7月1日〜30日調査、調査面積168平方メートル。遺構：基壇・礎石・柱穴。遺物：陶器・土師器・かわらけ・瓦&#34;,&#34;url&#34;:&#34;https://sitereports.nabunken.go.jp/ja/list/22/22211/p/4/item/44665&#34;}],&#34;research_todos&#34;:[&#34;山号・本尊・創建年代の確認（『敷地村誌』『豊岡村誌』『磐田市誌』）&#34;,&#34;隣接する永明寺・浄光寺との本末・兼務関係の調査&#34;,&#34;妙心寺派宗務本所資料での登録内容確認&#34;,&#34;金沢市の永安寺など同名寺院との混同がないかの継続確認&#34;,&#34;郡誌由緒のOCR翻字は草創の年を「文祿三年甲午三月十五日寂室」とするが、寂室元光の没年（貞治6年・1367年）と文禄3年（1594年）は整合しない。文和3年（1354年）も同じ甲午にあたるため、原本コマ436の年号表記を確認する。&#34;,&#34;慶安元年の朱印状をはじめとする永安寺文書・「永安寺賄帳」の現存状況を『磐田市誌』『豊岡村史』で確認する。&#34;,&#34;岩室廃寺（石室寺）と永安寺の法統上の関係を磐田市誌・発掘調査報告書で確認する。&#34;,&#34;同じ岩室地区にある清凉院（岩室158番地）と岩室廃寺跡との直接的な継承関係を示す公的資料は確認できなかった。現地・寺院への聞き取りでの追加確認が望ましい。&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;所在と地域&#34;,&#34;body&#34;:&#34;永安寺は磐田市北部の敷地に所在する臨済宗妙心寺派の寺院です。Wikipediaの敷地の項には、浄光寺・永明寺・龍雲庵とともに「臨済宗妙心寺派 永安寺」が地区内の寺院として記載されています。地図・電話帳系サイトでは天竜浜名湖鉄道敷地駅から徒歩約19分と案内されており、同じ妙心寺派の永明寺（敷地1014番地）・浄光寺（敷地1021番地）と近接しています。『静岡県磐田郡誌』（1921年）によれば所在の字は「寺中」で、これらの近隣寺院はいずれも永安寺の末寺でした。&#34;},{&#34;heading&#34;:&#34;『静岡県磐田郡誌』にみる由緒と寺格&#34;,&#34;body&#34;:&#34;『静岡県磐田郡誌』（1921年）の由緒には「敷地村敷地字寺中に在り。龍壽山と號す。妙心寺の末寺にして、本尊は釋迦牟尼如來なり」とあり、草創は寂室（勅諡円応禅師）に係ると記されています。草創以来数代の間は末山による輪次住職の時期があり、慶長2年（1597年）3月9日に立峰が中興しました。慶長6年（1601年）8月24日に寺領12石と除地14石9斗2升4合を寄附されて以降、累代徳川家の朱印寺領を受け、寛永10年（1633年）には住職が紫衣着用の勅許を得て本山妙心寺へ輪住するなど、寺格は中本寺とされました。郡誌には慶安元年（1648年）2月24日付の「遠江國豊田郡永安寺領。同郡敷地郷内十二石…」で始まる寺領文書も収録されています。太田亮『遠江』（1927年）の名刹の節にも「永安寺（野辺郷敷地村）臨済宗、拾弐石。開山寂室禅師」とみえます。&#34;},{&#34;heading&#34;:&#34;開山寂室（円応禅師）をめぐる記録&#34;,&#34;body&#34;:&#34;郡誌は『大日本地名辞書』を引き、近江永源寺に伝わる寂室の語録『寂室録』に「遠州野部山中話舊」の一篇があり、「遠州路河村庄龍壽山永安禪院」と細註されていることを紹介しています。寂室元光は康安元年（1361年）に永源寺に入って一派の本寺とし、貞治6年（1367年）に78歳で示寂、応安2年（1369年）に円応禅師の号を宣下された高僧で、敷地一帯（野部・河村庄）との縁が語録からも裏付けられます。また『日本歴史地名大系』の岩室村の項は、天保7年（1836年）の同村の家数12を「永安寺賄帳」によって記しており、近世の永安寺に周辺村々を含む帳簿類が備わっていたことがうかがえます。明治8年（1875年）10月には字寺中1035番地の永安寺が敷地学校の校舎に充てられ、この番地は現在の所在地と一致します。&#34;},{&#34;heading&#34;:&#34;文化財資料からの補足&#34;,&#34;body&#34;:&#34;永安寺は、奈良時代から中世にかけての大寺院跡である岩室廃寺跡（観音堂）の所有者です。山岳仏教を知るうえで重要な遺跡として平成17年（2005年）11月21日に磐田市指定史跡となっており、現在の観音堂は江戸時代に建てられたものです。 岩室廃寺は古くは「石室寺」と呼ばれ、その経塚から出土した銅製経筒（高さ32センチメートル）には「日本國遠江國　石室寺　如法経　大治元年丙午十二月廿一日壬午　奉埋之」などの銘文があります。経塚の造営年・場所・施主が明確に分かる貴重な例とされ、経筒と白磁合子は東京国立博物館に所蔵されています。&#34;},{&#34;heading&#34;:&#34;発掘調査・考古資料からの補足&#34;,&#34;body&#34;:&#34;永安寺が所在する敷地地区の岩室山丘陵には、奈良時代から中世にかけての大寺院跡である岩室廃寺跡があり、平成17年（2005年）11月21日に磐田市指定史跡「岩室廃寺跡（観音堂）」として指定された。市指定文化財一覧では永安寺の項目に含めて掲載されている。現在の観音堂は江戸時代に建てられたものである。 磐田市文化財保存活用地域計画（令和6年9月）では、岩室廃寺は10世紀ごろの山岳信仰との関連が強く、遠江国分寺僧の修行道場としての役割を持っていたとする説が紹介されている。 岩室廃寺跡に隣接する岩室中世墳墓群遺跡では、平成17年度（2005年度）の市道改良工事に伴う発掘調査で13世紀前半（鎌倉時代）ごろの集石墓12基が確認され、瀬戸産陶器の四耳壺・瓶子を骨蔵器に転用した遺物や火葬跡が出土した。僧侶など当時の岩室寺関係者が葬られていたと考えられている。 昭和61年（1986年）の緊急発掘調査（旧豊岡村教育委員会実施）では岩室廃寺の基壇・礎石・柱穴などの遺構が確認され、陶器・土師器・かわらけ・瓦が出土し、奈良・平安から中世にかけての遺跡であることが確かめられた。&#34;}],&#34;founded_period&#34;:&#34;南北朝時代（14世紀、開山は寂室〈勅諡円応禅師〉と伝える）&#34;,&#34;cultural_assets&#34;:[{&#34;name&#34;:&#34;岩室廃寺跡（観音堂）&#34;,&#34;designation&#34;:&#34;磐田市指定文化財（史跡）&#34;,&#34;summary&#34;:&#34;奈良時代から江戸時代にわたる岩室の山寺の跡で、市の一覧では所有者は永安寺と記載されています。&#34;}],&#34;pilgrimage_note&#34;:&#34;磐田郡三十三観音霊場第16番札所&#34;},{&#34;temple_id&#34;:&#34;iwata-0071&#34;,&#34;slug&#34;:&#34;seiryo-in-iwamuro&#34;,&#34;name&#34;:&#34;清凉院&#34;,&#34;name_kana&#34;:&#34;せいりょういん&#34;,&#34;aliases&#34;:[],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;unknown&#34;,&#34;status_label&#34;:&#34;現地痕跡未確認&#34;,&#34;detail_page&#34;:false,&#34;sect&#34;:&#34;臨済宗妙心寺派&#34;,&#34;address&#34;:&#34;静岡県磐田市岩室158番地&#34;,&#34;district_id&#34;:&#34;toyooka&#34;,&#34;area&#34;:&#34;豊岡&#34;,&#34;main_deity&#34;:&#34;聖観世音菩薩&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;臨済宗妙心寺派の寺院で、磐田市岩室158番地に所在します。『静岡県磐田郡誌』（1921年）の由緒では、敷地村岩室字屋敷にあって敷地の永安寺の末寺とされ、本尊は聖観世音菩薩、応永11年（1404年）5月9日に茂林の開創に係り、代々岩室観音堂の別当を務めたと記されています。『遠江国風土記伝』にも「岩室観音堂朱符之田高二石。臨済宗清凉院永安寺末」とみえる、岩室観音信仰と結び付いた寺院です。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9300&#34;},{&#34;title&#34;:&#34;サーチ寺院 静岡県磐田市の寺院・御堂一覧&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;清凉院が臨済宗妙心寺派・磐田市岩室158番地の宗教法人として登載されていることを確認（〒438-0104）&#34;,&#34;url&#34;:&#34;https://www.bukyou.com/BukyBukyou/TBukyou22/C22CNo211Detail.html&#34;},{&#34;title&#34;:&#34;岩室 (磐田市)（Wikipedia）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;岩室地区の記事を確認したが、施設欄に清凉院の記載はなく熊野神社のみ。由緒情報は得られず&#34;,&#34;url&#34;:&#34;https://ja.wikipedia.org/wiki/%E5%B2%A9%E5%AE%A4_(%E7%A3%90%E7%94%B0%E5%B8%82)&#34;},{&#34;title&#34;:&#34;岩室廃寺跡（Bodhisvaha）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;岩室地区に岩室廃寺跡・清瀧寺観音堂が所在することを確認（清凉院とは別寺院。混同防止のため参照）&#34;,&#34;url&#34;:&#34;https://yossy.main.jp/post-4797-4797.html&#34;},{&#34;title&#34;:&#34;静岡県磐田郡教育会編『静岡県磐田郡誌』（1921年）コマ437「清凉院（敷地村）」&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション（全文検索で本文確認）。遠江国風土記伝・大日本地名辞書・吾妻鏡の引用を含む&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680/1/437&#34;},{&#34;title&#34;:&#34;太田亮『遠江』（磯部甲陽堂、1927年）コマ178-179 寺領一覧「觀音堂（岩室村）貳石」&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/1176478/1/179&#34;},{&#34;title&#34;:&#34;コトバンク「岩室村」（日本歴史地名大系）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;岩室村が敷地村の枝郷であること、正保郷帳の観音領2石の記載&#34;,&#34;url&#34;:&#34;https://kotobank.jp/word/岩室村&#34;},{&#34;title&#34;:&#34;臨黄ネット 寺院検索（静岡県磐田市・妙心寺派）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;一覧掲載のみ。寺名「清凉院（せいりょういん）」・住所「岩室158」を確認（台帳と一致）。本尊・由緒・行事欄は空欄。&#34;,&#34;url&#34;:&#34;https://rinnou.net/search/?prefectures=%E9%9D%99%E5%B2%A1%E7%9C%8C&#38;address_1=%E7%A3%90%E7%94%B0%E5%B8%82&#38;shuha=%E5%A6%99%E5%BF%83%E5%AF%BA%E6%B4%BE&#34;}],&#34;research_todos&#34;:[&#34;山号・本尊・創建年代の確認（『豊岡村誌』『磐田市誌』）&#34;,&#34;同じ岩室地内の岩室廃寺跡・清瀧寺観音堂との関係の有無の確認（別寺院のため混同に注意）&#34;,&#34;Wikipediaの岩室の項の施設欄に清凉院の記載がないため、現況（無住・兼務の可能性）の現地確認&#34;,&#34;妙心寺派宗務本所資料での登録内容確認&#34;,&#34;「清凉院」と「清涼院」の表記ゆれの正式表記確認&#34;,&#34;『静岡県磐田郡誌』コマ414の寺院一覧表の山号欄は、並び順からは清凉院を「岩室山」と読める可能性があるが列ずれのため断定できない。原本確認が必要。&#34;,&#34;郡誌のいう「岩室観音堂」と、現在清瀧寺が継承するとされる観音堂の関係（同一の堂か、別当交代の経緯）を『磐田市誌』『豊岡村史』・磐田市文化財資料で整理する。&#34;,&#34;本文中の郡誌考証（寂室録の「繁茂林」＝開山茂林説）の原文表現をコマ437で再確認する。&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;所在と地域&#34;,&#34;body&#34;:&#34;清凉院は磐田市北部の岩室に所在する臨済宗妙心寺派の寺院です。全国の宗教法人を収録した寺院一覧に磐田市岩室158番地の寺院として登載されています。岩室はもと敷地村の枝郷で、『日本歴史地名大系』の岩室村の項によれば敷地川中流左岸の山稜上に位置し、正保郷帳には田方32石余・畑方5石余のほか「観音領二石」が記されていました。岩室地区には平安時代の山岳寺院跡とされる岩室廃寺跡と、その観音堂を継承する清瀧寺（真言宗系）が所在しますが、『静岡県磐田郡誌』は清凉院が代々岩室観音堂の別当であったと記しており、清凉院もまた岩室の観音信仰と深く関わる寺院でした。&#34;},{&#34;heading&#34;:&#34;『静岡県磐田郡誌』にみる由緒&#34;,&#34;body&#34;:&#34;『静岡県磐田郡誌』（1921年）の由緒には「敷地村岩室字屋敷に在り。當村敷地永安寺の末寺にして、本尊は聖觀世音菩薩なり。應永十一年五月九日、茂林の開創に係る。世々岩室觀音堂の別當たり」とあります。応永11年（1404年）は室町時代前期にあたります。郡誌はさらに、永安寺開山と伝える寂室（円応禅師）の語録『寂室録』に「賢姪繁茂林」と遠州野部山中で旧交を温めた趣旨の詩があることを挙げ、この「繁茂林」が当院開山の茂林と同一人ではないかとの考証を載せています。&#34;},{&#34;heading&#34;:&#34;岩室山をめぐる古記録&#34;,&#34;body&#34;:&#34;郡誌が引く『遠江国風土記伝』には「岩室觀音堂朱符之田高二石。臨濟宗清凉院永安寺末」とあり、太田亮『遠江』（1927年）の寺領一覧にも「觀音堂（岩室村）貳石」とみえます。同風土記伝は岩室山について、嶺に仏堂があり地を穿てば仏像が出ること、古老が「昔真言の祖弘法大師開山の地で、後に臨済宗の寂室禅師が登山した」と語ること、延文年間（1356〜1361年）の寂室の看花の詩などを記しています。また郡誌が引く『大日本地名辞書』は「岩室寺は今観音堂のこる。当国の古精舎とす」とし、『吾妻鏡』文治2年（1186年）4月条の、安田義定が「岩室以下の山寺」で源義経を捜索したという記事を挙げています。中世以来の岩室山の観音霊場を、近世には清凉院が別当として守り伝えたことになります。&#34;}],&#34;founded_period&#34;:&#34;応永11年（1404年）&#34;,&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0072&#34;,&#34;slug&#34;:&#34;shorinji-kawabukuro&#34;,&#34;name&#34;:&#34;松林寺&#34;,&#34;name_kana&#34;:&#34;しょうりんじ&#34;,&#34;aliases&#34;:[&#34;松隣庵&#34;,&#34;正林庵&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;臨済宗方広寺派&#34;,&#34;address&#34;:&#34;静岡県磐田市川袋224番地の1&#34;,&#34;district_id&#34;:&#34;ryuyo&#34;,&#34;area&#34;:&#34;竜洋&#34;,&#34;main_deity&#34;:&#34;十一面観世音菩薩&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;松林寺は静岡県磐田市川袋にある臨済宗方広寺派の寺院で、大本山方広寺の公式末寺一覧に「松林寺（川袋）磐田市川袋224」として掲載されています。『静岡県磐田郡誌』（1921年）の由緒では本尊は十一面観世音菩薩で、傍らに長谷川輝貞の護持仏と伝える延命地蔵菩薩を安置し、天文年間（1532〜1555年）に長谷川輝貞が青岩を開基として建立、今川氏の祈願所であったと伝えます。永禄3年（1560年）の今川氏真判物写（松林寺文書）に前身の「松隣庵」領がみえ、戦国期にさかのぼる存在が史料からも確認できる寺院です。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9302&#34;},{&#34;title&#34;:&#34;方広寺派末寺一覧（磐田市・袋井市）｜臨済宗方広寺派大本山方広寺&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;本山公式の末寺一覧に「松林寺（川袋）〒438-0232 磐田市川袋224」として掲載されていることを本文で確認。&#34;,&#34;url&#34;:&#34;https://houkouji.or.jp/matsuji/&#34;},{&#34;title&#34;:&#34;竜洋町 - Wikipedia&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;川袋を含む旧竜洋町が昭和30年（1955年）に発足し、平成17年（2005年）4月1日の合併で磐田市となったことを本文で確認。&#34;,&#34;url&#34;:&#34;https://ja.wikipedia.org/wiki/%E7%AB%9C%E6%B4%8B%E7%94%BA&#34;},{&#34;title&#34;:&#34;静岡県磐田郡教育会編『静岡県磐田郡誌』（1921年）コマ435「松林寺（掛塚町）」&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション（全文検索で本文確認）&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680/1/435&#34;},{&#34;title&#34;:&#34;コトバンク「川袋村」（日本歴史地名大系）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;永禄3年今川氏真判物写（松林寺文書）の松隣庵領、松平忠頼領郷村帳の正林庵領2石の記載&#34;,&#34;url&#34;:&#34;https://kotobank.jp/word/川袋村&#34;},{&#34;title&#34;:&#34;太田亮『遠江』（磯部甲陽堂、1927年）コマ178 寺領一覧「松林寺（川袋村）二石」&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/1176478/1/178&#34;},{&#34;title&#34;:&#34;大本山方広寺 末寺のご案内（磐田市・袋井市）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;一覧掲載のみ。「磐田市川袋 松林寺 〒438-0232 磐田市川袋224」として掲載。分譲可能墓地・永代供養墓ありの表示。由緒・本尊・山号の記載はない。&#34;,&#34;url&#34;:&#34;https://www.houkouji.or.jp/matsuji/&#34;}],&#34;research_todos&#34;:[&#34;『竜洋町史』『磐田市誌』で創建年代・開山・沿革の記事を確認する&#34;,&#34;山号・本尊を現地（寺号標・本堂掲示）で確認する&#34;,&#34;方広寺派の宗派資料で開山の法系・本末関係を確認する&#34;,&#34;無住・兼務の状況を確認する&#34;,&#34;遠江四十九薬師霊場・遠州三十三観音等の札所該当の有無を霊場資料で確認する&#34;,&#34;松林寺文書（今川氏真判物写）の現存状況・翻刻の有無を『竜洋町史』『磐田市誌』で確認する。&#34;,&#34;郡誌一覧表の山号欄は並び順から「富景山」と読める可能性があるが列ずれのため断定できない。原本確認が必要。&#34;,&#34;開基伝承の「長谷川輝貞」について、掛塚周辺の在地領主としての事績を郷土資料で確認する。&#34;,&#34;由緒・本尊は大本山方広寺の末寺一覧に掲載なし。別資料（磐田市誌・竜洋町史等）での調査が必要。&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;所在と宗派&#34;,&#34;body&#34;:&#34;松林寺は臨済宗方広寺派に属し、大本山方広寺の公式末寺一覧に川袋の寺院として掲載されています。所在地の川袋は天竜川下流東岸に位置する旧磐田郡竜洋町の区域です。竜洋町は昭和30年（1955年）に掛塚町・袖浦村などの合併で発足し、平成17年（2005年）4月1日に旧磐田市・福田町・豊田町・豊岡村との合併で現在の磐田市の一部となりました。創建年代・山号・本尊などの沿革情報は、今回確認できた公開Web資料には記載がありません。&#34;},{&#34;heading&#34;:&#34;『静岡県磐田郡誌』にみる由緒&#34;,&#34;body&#34;:&#34;『静岡県磐田郡誌』（1921年）の由緒には「掛塚町川袋に在り。方廣寺派なり。本尊は、十一面觀世音菩薩にして、傍に延命地藏菩薩を安置す。傳へ云ふ、是れ長谷川輝貞の護持佛なりしと。當寺は、天文年中長谷川輝貞靑岩を開基として建立し、當時今川修理太夫氏親の祈願所たりしと云ふ」とあります。天文年間（1532〜1555年）に在地の長谷川輝貞が建立し今川氏の祈願所であったとする寺伝ですが、今川氏親の没年（大永6年・1526年）は天文年間より前にあたるため、祈願所とされた当主の代については伝承に検討の余地があります。&#34;},{&#34;heading&#34;:&#34;戦国期史料にみえる前身「松隣庵」&#34;,&#34;body&#34;:&#34;『日本歴史地名大系』の川袋村の項によれば、永禄3年（1560年）10月5日の今川氏真判物写（松林寺文書）に河匂庄「河袋」がみえ、そこには松隣庵（現松林寺）領があって、天文22年（1553年）の検地で出た増分を免除されています。また江戸時代初頭の松平忠頼領郷村帳には「正林庵（現松林寺）領二石」と記され、太田亮『遠江』（1927年）の寺領一覧にも「松林寺（川袋村）二石」とみえます。寺伝の天文年間建立と、天文22年検地・永禄3年判物という同時代史料の存在は整合的で、当寺が戦国期の川袋に「松隣庵（正林庵）」として実在し、近世には2石の寺領を有したことが確認できます。&#34;}],&#34;founded_period&#34;:&#34;天文年間（1532〜1555年）※寺伝。遅くとも永禄3年（1560年）以前に存在&#34;,&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0073&#34;,&#34;slug&#34;:&#34;hojuin-jurojima&#34;,&#34;name&#34;:&#34;寶珠院&#34;,&#34;name_kana&#34;:&#34;ほうじゅいん&#34;,&#34;aliases&#34;:[&#34;宝珠院&#34;,&#34;如意山宝珠院&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;臨済宗方広寺派&#34;,&#34;address&#34;:&#34;静岡県磐田市十郎島26番地ノ1&#34;,&#34;district_id&#34;:&#34;ryuyo&#34;,&#34;area&#34;:&#34;竜洋&#34;,&#34;main_deity&#34;:&#34;高王観世音菩薩&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;寶珠院（宝珠院）は静岡県磐田市十郎島にある臨済宗方広寺派の寺院で、大本山方広寺の公式末寺一覧に「宝珠院（十郎島）磐田市十郎島26-1」として掲載されています。『静岡県磐田郡誌』（1921年）の由緒では、掛塚町十郎島字居村にあって如意山と号し、本尊は高王観世音菩薩、慶長元年（1596年）3月に心叟の開山に係り、慶長5年（1600年）7月に分派したと記されています。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9304&#34;},{&#34;title&#34;:&#34;方広寺派末寺一覧（磐田市・袋井市）｜臨済宗方広寺派大本山方広寺&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;本山公式の末寺一覧に「宝珠院（十郎島）〒438-0236 磐田市十郎島26-1」として掲載されていることを本文で確認。&#34;,&#34;url&#34;:&#34;https://houkouji.or.jp/matsuji/&#34;},{&#34;title&#34;:&#34;縁起 - 宝珠院（愛知県新城市）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;検索で上位に出る同名寺院サイト。トップページで所在地が愛知県新城市井代大貝津81と確認できたため、磐田市十郎島の寶珠院とは別寺院。同サイトの創建・縁起情報を当寺に転用しないこと（混同防止のための記録）。&#34;,&#34;url&#34;:&#34;http://housyuin.org/guide.html&#34;},{&#34;title&#34;:&#34;竜洋町 - Wikipedia&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;十郎島を含む旧竜洋町の沿革（1955年発足、2005年合併）を本文で確認。&#34;,&#34;url&#34;:&#34;https://ja.wikipedia.org/wiki/%E7%AB%9C%E6%B4%8B%E7%94%BA&#34;},{&#34;title&#34;:&#34;静岡県磐田郡教育会編『静岡県磐田郡誌』（1921年）コマ435「寳珠院（掛塚町）」&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション（全文検索で本文確認）&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680/1/435&#34;},{&#34;title&#34;:&#34;コトバンク「十郎島村」（日本歴史地名大系）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;天正19年の「拾良嶋」高53石余、掛塚輪中内の村況&#34;,&#34;url&#34;:&#34;https://kotobank.jp/word/十郎島村&#34;},{&#34;title&#34;:&#34;大本山方広寺 末寺のご案内（磐田市・袋井市）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;一覧掲載のみ。「磐田市十郎島 宝珠院 〒438-0236 磐田市十郎島26-1」として掲載（新字表記）。連絡先・墓地サービスの掲載なし。由緒・本尊の記載はない。&#34;,&#34;url&#34;:&#34;https://www.houkouji.or.jp/matsuji/&#34;}],&#34;research_todos&#34;:[&#34;愛知県新城市井代にも同名・同派の「宝珠院」（山号神龍山、応永25年（1418年）創建と自院サイトに記載）があり情報が混同されやすい。沿革調査時は必ず所在地（磐田市十郎島）を確認する&#34;,&#34;『竜洋町史』『磐田市誌』で創建年代・開山・沿革の記事を確認する&#34;,&#34;山号・本尊を現地で確認する&#34;,&#34;無住・兼務の状況を確認する（本山公式一覧に連絡先の記載がない）&#34;,&#34;遠江四十九薬師霊場・遠州三十三観音等の札所該当の有無を霊場資料で確認する&#34;,&#34;開山「心叟」の法系（方広寺のどの塔頭・寺院からの分派か）を『竜洋町史』等で確認する。&#34;,&#34;高王観世音菩薩像の現況・伝来を現地資料で確認する。&#34;,&#34;方広寺末寺一覧の表記は新字の「宝珠院」。電話番号欄がなく墓地等の対応欄もすべて「－」のため、無住・兼務の可能性を要確認。&#34;,&#34;由緒・本尊は末寺一覧に掲載なし。別資料での調査が必要。&#34;],&#34;historical_sections&#34;:[{&#34;heading&
