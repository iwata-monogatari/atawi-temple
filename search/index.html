%E8%80%81%E5%B3%B6&#34;},{&#34;title&#34;:&#34;ニッポンの霊場 豊田郡三十三観音霊場&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;第13番＝海松山心月寺（曹洞宗・海老島200）を確認。寺名・宗派・住所がDBと一致。&#34;,&#34;url&#34;:&#34;https://nippon-reijo.jimdofree.com/%E6%8E%B2%E8%BC%89%E9%9C%8A%E5%A0%B4%E3%81%AE%E4%B8%80%E8%A6%A7/%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/%E8%B1%8A%E7%94%B0%E9%83%A1%E4%B8%89%E5%8D%81%E4%B8%89%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/&#34;},{&#34;title&#34;:&#34;サーチ寺院（119カ寺）静岡県磐田市の寺院・御堂&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;住所（磐田市海老島200番地の1、〒438-0212）・宗派（曹洞宗）を確認。&#34;,&#34;url&#34;:&#34;https://www.bukyou.com/BukyBukyou/TBukyou22/C22CNo211Detail.html&#34;},{&#34;title&#34;:&#34;心月寺 - 曹洞禅ナビ寺院検索&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;名称・フリガナ（シンゲツジ）・住所（磐田市海老島200-1）一致確認。由緒・本尊・年中行事欄は未記入。&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220947.html&#34;}],&#34;research_todos&#34;:[&#34;山号の確認（現地の寺号標・本堂扁額など）&#34;,&#34;創建年代・開山・本寺関係を郷土資料（『豊田町誌』『竜洋町史』等、海老島の所属旧町域の確認を含む）で調査&#34;,&#34;本尊の確認&#34;,&#34;牧之原市相良の同名寺院「釘浦山心月寺」との混同防止（公式サイトshingetsuji.amebaownd.comは相良の寺院のもの）&#34;,&#34;天竜川沿いの集落史（水害・移転の有無）と寺の関わりの調査&#34;,&#34;海老島小学校の開校年（明治5年と明治6年の両説が郡誌内に併記）の確定&#34;,&#34;安政東海地震で倒潰した建物のその後の再建年の確認（『ふるさと豊田』原本の参照）&#34;,&#34;現在の本尊が郡誌記載どおり聖観世音菩薩かどうかの現地確認&#34;,&#34;検索でヒットする「心月寺」公式サイト（shingetsuji.amebaownd.com）・Facebook（facebook.com/shingetsuji）は、静岡県牧之原市相良の同名別寺院（釘浦山心月寺、本尊薬師如来）のものであり、磐田市海老島の心月寺とは別寺院と判明。以後の調査でも混同厳禁&#34;,&#34;曹洞禅ナビ上で磐田市海老島の心月寺に該当する個別ページを特定できなかった（青森県・佐賀県の同名別寺院ページのみヒット）&#34;,&#34;既存史料にある「明治期に海老島小学校の仮校舎であった経緯」について、Web検索では追加の裏付け資料を確認できなかった。磐田市教育委員会・磐田市立図書館郷土資料室等での追加確認が必要&#34;,&#34;年中行事、永代供養墓・納骨堂、護持会等の檀家組織、地域自治会・防災との関わり、駐車場情報のいずれも情報が見つからず、現地・電話での確認が必要&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;所在と宗派&#34;,&#34;body&#34;:&#34;心月寺は曹洞宗の寺院で、所在地は磐田市海老島200番地の1です。地図情報サイトの海老島の寺院一覧では心月寺1件のみが掲載されており、集落唯一の寺院であることが確認できます。海老島村は江戸時代には豊田郡に属し、明治22年（1889年）以降は袖浦村、のち竜洋町域となりました。『静岡県磐田郡誌』は寺の所在を「袖浦村海老島字小池方」と記しています。注意すべき点として、静岡県内には牧之原市相良にも同名の曹洞宗「釘浦山心月寺」（公式サイトあり・本尊薬師如来）が存在しますが、これは別の寺院であり、Web検索では両寺の情報が混在しやすい状況です。曹洞宗公式ポータル「曹洞禅ナビ」にも佐賀県唐津市の同名寺院が掲載されているため、同名寺院との混同に注意が必要です。&#34;},{&#34;heading&#34;:&#34;『静岡県磐田郡誌』と江戸時代の記録にみる由緒&#34;,&#34;body&#34;:&#34;大正10年（1921年）刊の『静岡県磐田郡誌』の寺院各説には「心月寺（袖浦村）」として「袖浦村海老島字小池方に在り。海松山と号す。長野村正眼院の末寺にして、本尊は聖観世音菩薩なり。伝へ云ふ、元平氏の頃の開創なりしが、後廃滅に帰し、天正三年に至り、正眼院第二世宗哲を開山として再興せりと」と記されています。平氏の頃の開創は伝承ですが、天正3年（1575年）の再興以降の存続は史料からも裏づけられます。江戸時代初期の寛永10年（1633年）ごろの諸宗末寺帳には海老嶋村の心月寺が寺領2石とともに登載され、寛政年間に内山真龍が著した地誌『遠江国風土記伝』にも「心月寺、除地高弐石、曹洞宗小島村正眼院末、平僧住」とみえます。延享期（1744〜1748年）の曹洞宗寺院本末牒にも御黒印2石の海老島村心月寺が記され、『元禄高帳による元禄期遠江国石高表』でも海老島村高210石余のうち心月寺領2石が除かれています。開山を出した正眼院（磐田市小島）第2世宗哲は、天正13年（1585年）に大中瀬の正全寺の中興にも徒弟を送るなど、天正期のこの地域の曹洞宗展開の中心となった僧です。&#34;},{&#34;heading&#34;:&#34;安政東海地震と海老島小学校&#34;,&#34;body&#34;:&#34;歴史地震研究の論文「寺院の被害記録から見た安政東海地震（1854）の静岡県内の震度分布」（『歴史地震』第21号、2006年）には、『ふるさと豊田』に基づく寺院被害の一覧に磐田市海老島の心月寺が採録されており、嘉永7年11月4日（1854年12月23日）の安政東海地震で建物が倒潰したことが記録されています。また『静岡県磐田郡誌』の教育の章によれば、学制発布を受けて明治6年（1873年）6月19日に海老島村心月寺を仮校舎として海老島小学校が開校しました（郡誌には明治5年6月に第68番海老島小学校を創設したとする記述もあります）。『磐田市教育のあけぼの』（磐田市誌シリーズ第1冊、1973年）も、袖浦村域の小学校が心月寺において開校したことを記しており、当寺は地域の近代教育の出発点となりました。&#34;}],&#34;founded_period&#34;:&#34;伝承では平安時代末期（平氏の頃）の開創、天正3年（1575年）再興&#34;,&#34;cultural_assets&#34;:[],&#34;pilgrimage_note&#34;:&#34;豊田郡三十三観音霊場第13番札所（享保年間開創の歴史的霊場・現在は活動していない）&#34;,&#34;danka_info&#34;:{}},{&#34;temple_id&#34;:&#34;iwata-0092&#34;,&#34;slug&#34;:&#34;fukushoji-nishihiramatsu&#34;,&#34;name&#34;:&#34;福生寺&#34;,&#34;name_kana&#34;:&#34;ふくしょうじ&#34;,&#34;aliases&#34;:[&#34;徳用山福生寺&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市西平松22番地&#34;,&#34;district_id&#34;:&#34;ryuyo&#34;,&#34;area&#34;:&#34;竜洋&#34;,&#34;main_deity&#34;:&#34;虚空蔵菩薩（『静岡県磐田郡誌』大正10年による。現況は要確認）&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;福生寺は磐田市西平松22番地にある曹洞宗の寺院で、山号は徳用山です。『静岡県磐田郡誌』（大正10年）によれば、天正10年（1582年）4月1日に一宇を新築し、岡（袖浦村）の聖寿寺第5世恵才の徒弟宣存を開山に請じて開かれた聖寿寺末の寺院で、本尊は虚空蔵菩薩と記されています。西平松は江戸時代の豊田郡西平松村にあたり、明治22年（1889年）以降は袖浦村、のち竜洋町域となりました。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9342&#34;},{&#34;title&#34;:&#34;『静岡県磐田郡誌』静岡県磐田郡教育会編、大正10年（第13章 寺院各説115「福生寺」）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション（インターネット公開）。457コマの原本画像で由緒本文を確認&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680/1/457&#34;},{&#34;title&#34;:&#34;日本歴史地名大系「西平松村」（コトバンク）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;平松村の三分村による成立と領主変遷の記載&#34;,&#34;url&#34;:&#34;https://kotobank.jp/word/西平松村&#34;},{&#34;title&#34;:&#34;『遠淡海地誌』（山中豊平編著、1991年）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;平松付近に「正寿寺末福正寺」の記載（当寺との関係は未確認のため要調査）&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/search/searchResult?fullText=true&#38;keyword=%E7%A6%8F%E6%AD%A3%E5%AF%BA%20%E6%B5%B7%E8%80%81%E5%B3%B6&#34;},{&#34;title&#34;:&#34;Yahoo!マップ「福生寺（磐田市西平松）」&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;所在地・曹洞宗の確認&#34;,&#34;url&#34;:&#34;https://map.yahoo.co.jp/v3/place/twD4A2Ey1NA&#34;},{&#34;title&#34;:&#34;福生寺 - 曹洞禅ナビ寺院検索&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;名称・フリガナ（フクショウジ）・住所（磐田市西平松22）一致確認。由緒・本尊・年中行事欄は未記入。&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220940.html&#34;}],&#34;research_todos&#34;:[&#34;曹洞禅ナビ（sotozen-navi.com）に掲載が確認できなかったため、宗派側の寺院名簿（『曹洞宗寺院名鑑』等）での正式登録名・読みの確認&#34;,&#34;聖寿寺公式サイトが引用する『竜洋町の寺院巡礼』（竜洋町郷土研究会編）での西平松・福生寺の記載確認（旧竜洋町域の寺院を網羅する郷土資料の可能性が高い）&#34;,&#34;『竜洋町誌』『磐田市誌』での創建年代・山号・本尊の確認&#34;,&#34;現地での山号・本尊・堂宇・石造物の確認&#34;,&#34;全国に同名の福生寺（千葉県館山市・東京都町田市・福島県会津美里町ほか多数）があるため、Web情報利用時は住所（磐田市西平松）との突合を徹底すること&#34;,&#34;『遠淡海地志』（山中豊平編著の翻刻版、1991年）にみえる平松付近の「正寿寺末 福正寺」と当寺の関係の確認&#34;,&#34;『竜洋町史』（未デジタル化）での福生寺の記述確認&#34;,&#34;現在の本尊が郡誌記載どおり虚空蔵菩薩かどうかの現地確認&#34;],&#34;founded_period&#34;:&#34;天正10年（1582年）&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;所在と宗派&#34;,&#34;body&#34;:&#34;福生寺は曹洞宗の寺院で、所在地は磐田市西平松22番地です。静岡県知事所轄宗教法人名簿に掲載されているほか、地図情報サイトにも西平松の曹洞宗寺院として掲載されています。西平松村は正保年間（1644〜1648年）以前に平松村が東・中・西に三分されて成立した村で（『日本歴史地名大系』）、江戸時代は豊田郡に属し、正保郷帳では幕府領、元禄12年（1699年）以降は浜松藩領、弘化3年（1846年）からは陸奥白河藩領と領主が変遷しました。明治22年（1889年）に袖浦村の一部となり、のち竜洋町域を経て現在は磐田市西平松です。&#34;},{&#34;heading&#34;:&#34;『静岡県磐田郡誌』にみる由緒&#34;,&#34;body&#34;:&#34;大正10年（1921年）刊の『静岡県磐田郡誌』の寺院各説には「福生寺（袖浦村）」として「袖浦村西平松字西中に在り。徳用山と号す。当村岡聖寿寺の末にして、本尊は虚空蔵菩薩なり。天正十年四月一日、一宇を新築し聖寿寺第五世恵才の徒弟宣存を請じて開山とす」と記されています。本寺の聖寿寺は袖浦村岡（現磐田市岡）の天龍山聖寿寺で、慶安元年（1648年）に朱印高12石9斗余を受け門末24か寺を有した小本寺でした。福生寺はその門末として戦国時代末期に開かれた寺院で、同じ聖寿寺5世恵才の門下からは平間の願成寺の開基明堂も出ています。なお、江戸時代の地誌『遠淡海地志』の平松三か村周辺の記載には「正寿寺末 福正寺」とみえる寺があり、当寺との関係が注目されますが、表記・本末関係が郡誌の記載と異なるため、同一寺院かどうかは確認できていません。&#34;}],&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0093&#34;,&#34;slug&#34;:&#34;shojuji-oka&#34;,&#34;name&#34;:&#34;聖寿寺&#34;,&#34;name_kana&#34;:&#34;しょうじゅじ&#34;,&#34;aliases&#34;:[&#34;天龍山聖寿寺&#34;,&#34;岡のお寺&#34;,&#34;崗本山聖寿軒&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市岡330番地&#34;,&#34;district_id&#34;:&#34;ryuyo&#34;,&#34;area&#34;:&#34;竜洋&#34;,&#34;main_deity&#34;:&#34;阿弥陀三尊（阿弥陀如来・観音菩薩・勢至菩薩）&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;公開情報調査済み&#34;,&#34;history_summary&#34;:&#34;聖寿寺は磐田市岡にある曹洞宗の寺院で、山号は天龍山、地元では「岡のお寺」と呼ばれています。文明10年（1478年）に教之一訓大和尚が草庵を結んだことに始まり、当初は「崗本山聖寿軒」と称しました。本堂には阿弥陀三尊が祀られ、磐田郡三十三ヶ所観音霊場第4番などの地域霊場に列しています。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-12&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9344&#34;},{&#34;title&#34;:&#34;天龍山聖寿寺公式サイト「聖寿寺について」&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;文明10年（1478年）開創、開山教之一訓大和尚、旧称崗本山聖寿軒、寺伝（今川義元の叔父）、開基門奈美作守正重（54石寄付）、本寺長松院（掛川市大野）、霊場札番・御詠歌（『竜洋町の寺院巡礼』引用）を本文で確認。&#34;,&#34;url&#34;:&#34;https://www.shoujyuji.com/about/&#34;},{&#34;title&#34;:&#34;天龍山聖寿寺公式サイト「境内・施設案内」&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;本尊阿弥陀三尊、本堂の規模、開山堂のうぐいす張り、一照殿（良照庵本尊如意輪観音、令和4年落慶）、量光臺仮夢阿弥陀如来（草崎御堂由来・台風被災と修繕）を本文で確認。&#34;,&#34;url&#34;:&#34;https://www.shoujyuji.com/guide/&#34;},{&#34;title&#34;:&#34;曹洞禅ナビ 聖寿寺&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;曹洞宗公式ポータルに磐田市岡330-1の寺院として掲載。フリガナ「ショウジュジ」を確認。&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220921.html&#34;},{&#34;title&#34;:&#34;静岡県磐田市にある「岡のお寺」【天龍山聖寿寺】公式サイト トップ&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;寺院概要・SNS・年間行事等への導線を確認&#34;,&#34;url&#34;:&#34;https://www.shoujyuji.com/&#34;},{&#34;title&#34;:&#34;聖寿寺 年間行事&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;年中行事の名称・時期・内容を確認&#34;,&#34;url&#34;:&#34;https://www.shoujyuji.com/events/&#34;},{&#34;title&#34;:&#34;聖寿寺 永代納骨・ペット供養&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;永代供養・永代納骨・ペット供養の内容を確認&#34;,&#34;url&#34;:&#34;https://www.shoujyuji.com/cineration-memorial-service/&#34;}],&#34;research_todos&#34;:[&#34;国・県・市の指定文化財は確認できなかったため、未指定の寺宝（開山袈裟＝島田市養勝寺より平成25年に受領と公式サイトに記載）の詳細調査&#34;,&#34;寺伝「一訓和尚は今川義元の叔父」の年代整合性の検証（文明10年開創と義元の生年1519年の関係）※寺伝として紹介するに留めること&#34;,&#34;開基・門奈美作守正重と今川氏・天龍村（旧竜洋町域）の関係を『竜洋町誌』等で確認&#34;,&#34;磐田郡三十三ヶ所観音霊場・阿弥陀巡礼四十八ヶ所の全札所リストの入手&#34;,&#34;現地での桜並木・境内景観の確認&#34;,&#34;護持会・世話人会等の運営組織の有無を現地確認する&#34;],&#34;founded_period&#34;:&#34;室町時代／文明10年（1478年）開創&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;創建と開山・開基&#34;,&#34;body&#34;:&#34;公式サイトによれば、聖寿寺は文明10年（1478年）に開創され、開山の教之一訓大和尚が草庵を結んだことに始まります。当初は「崗本山聖寿軒」と称していました。寺伝では一訓和尚は今川義元の叔父とされています。開基は寺の近く天龍村の門奈美作守正重で、今川家の家人であり、54石を寄付して聖寿寺を菩提寺とし、寺院経営にもあたったと伝えられます。本寺（親寺）は掛川市大野の深澤山長松院で、一訓和尚は長松院の2世にあたります。一訓和尚は聖寿寺開創ののち島田市湯日の金龍山養勝寺も開創し、その地で示寂しました。&#34;},{&#34;heading&#34;:&#34;地域霊場と御詠歌&#34;,&#34;body&#34;:&#34;『竜洋町の寺院巡礼』（竜洋町郷土研究会編）によれば、聖寿寺は地元の阿弥陀巡礼四十八ヶ所の第15番、磐田郡三十三ヶ所観音霊場の第4番に列し、それぞれ御詠歌が今に伝わっています。観音霊場の御詠歌には「みのあだを　ほどけて岡の　ひじりでら　たがてで光し　慈悲のすがた」と、「岡のひじりでら（聖寺）」の名が詠み込まれています。&#34;},{&#34;heading&#34;:&#34;境内の堂宇と近年の整備&#34;,&#34;body&#34;:&#34;本堂は幅7間半・奥行6間で、正面の須弥壇に阿弥陀三尊（阿弥陀如来と観音・勢至両菩薩）を祀ります。開山堂（位牌堂）には開山と全檀家先祖の位牌を祀り、床には「うぐいす張り」が施されています。令和4年（2022年）9月には一照殿が落慶し、寛永元年（1624年）に聖寿寺9世声岩和尚の弟子龍松和尚が開創したと伝わる良照庵（旧磐田市草崎）の本尊如意輪観世音菩薩像を迎えています。また草崎の御堂に安置されていた阿弥陀如来像は、平成29年（2017年）の台風で御堂ごと倒壊したのち修繕され、令和4年（2022年）11月に「量光臺仮夢阿弥陀如来」として本寺に仮安座されました。この草崎御堂は磐田郡阿弥陀霊場四十八ヶ所の第14番にあたります。&#34;},{&#34;heading&#34;:&#34;檀家向け情報の補足&#34;,&#34;body&#34;:&#34;寺伝によれば開山の教之一訓大和尚は今川義元の叔父とされ、開基とされる天龍村の門奈美作守正重は今川家家人として54石を寄付し聖寿寺を菩提寺としたと伝わる。聖寿寺の本寺は掛川市大野の深澤山長松院で、一訓和尚は同院第2代住職を務めた後、島田市湯日の金龍山養勝寺も開創したと伝えられる。&#34;}],&#34;pilgrimage_note&#34;:&#34;磐田郡三十三ヶ所観音霊場第4番・阿弥陀巡礼四十八ヶ所第15番（『竜洋町の寺院巡礼』竜洋町郷土研究会編による）&#34;,&#34;danka_info&#34;:{&#34;official_site&#34;:{&#34;status&#34;:&#34;あり&#34;,&#34;url&#34;:&#34;https://www.shoujyuji.com/&#34;,&#34;checked_at&#34;:&#34;2026-07-12&#34;},&#34;annual_events&#34;:[{&#34;name&#34;:&#34;降誕会花祭り（ごうたんえはなまつり）&#34;,&#34;timing&#34;:&#34;4月8日&#34;,&#34;note&#34;:&#34;お釈迦様の誕生仏に甘茶をかける。寺院公式サイトによる&#34;},{&#34;name&#34;:&#34;盂蘭盆会大施食会（うらぼんえだいせじきえ）&#34;,&#34;timing&#34;:&#34;8月13日、午後3時より&#34;,&#34;note&#34;:&#34;お盆の法要。寺院公式サイトによる&#34;},{&#34;name&#34;:&#34;両祖忌（りょうそき）&#34;,&#34;timing&#34;:&#34;9月29日&#34;,&#34;note&#34;:&#34;永平寺開山道元禅師・總持寺開山瑩山禅師の命日法要。寺院公式サイトによる&#34;},{&#34;name&#34;:&#34;達磨忌（だるまき）&#34;,&#34;timing&#34;:&#34;10月5日&#34;,&#34;note&#34;:&#34;達磨大師の命日法要。寺院公式サイトによる&#34;},{&#34;name&#34;:&#34;成道会（じょうどうえ）&#34;,&#34;timing&#34;:&#34;12月8日（本堂に『出山之釋迦像』の掛物を12月1日〜8日展示）&#34;,&#34;note&#34;:&#34;お釈迦様が悟りを開いた日の法要。寺院公式サイトによる&#34;},{&#34;name&#34;:&#34;涅槃会（ねはんえ）&#34;,&#34;timing&#34;:&#34;2月1日〜15日、命日は2月15日&#34;,&#34;note&#34;:&#34;涅槃図の掛物を掲示。15日参拝者には涅槃団子を配布。寺院公式サイトによる&#34;},{&#34;name&#34;:&#34;開山忌法要（かいさんきほうよう）&#34;,&#34;timing&#34;:&#34;2月11日&#34;,&#34;note&#34;:&#34;開山・教之一訓大和尚の命日法要。寺院公式サイトによる&#34;},{&#34;name&#34;:&#34;手作り品フェア「ぽかぽか市」&#34;,&#34;timing&#34;:&#34;半年に1回&#34;,&#34;note&#34;:&#34;磐田（旧竜洋）地域住民向けの手作り品市。境内・駐車場を会場に開催。寺院公式サイトによる&#34;}],&#34;cemetery&#34;:&#34;檀家の墓地を境内に有し、出入り口に六地蔵を祀る。永代供養（自身の葬儀料・年回忌供養料を予納）と永代納骨（一霊ごと50年間後合祀。当山墓地所有者・住職兼務寺墓地所有者・新規結縁者で料金区分あり）を受け付けている。ペットの葬儀・納骨・彼岸法要にも対応。寺院公式サイトによる&#34;,&#34;organization&#34;:&#34;確認できず&#34;,&#34;community_role&#34;:&#34;令和4年（2022年）、旧良照庵（磐田市草崎公会堂の場所にあった聖寿寺の末庵）の境内地を地元の草崎自治会に移管し、良照庵の本尊・如意輪観世音菩薩像を聖寿寺境内の一照殿に遷座した。寺院公式サイトによる&#34;,&#34;parking&#34;:&#34;境内に広い駐車場があり、参拝のほか「ぽかぽか市」などのイベント会場としても利用されている。近年駐車スペースの補修工事が完了し、奥まで駐車しやすくなった。寺院公式サイトによる&#34;}},{&#34;temple_id&#34;:&#34;iwata-0094&#34;,&#34;slug&#34;:&#34;kinzoji-toyooka&#34;,&#34;name&#34;:&#34;金藏寺&#34;,&#34;name_kana&#34;:&#34;こんぞうじ&#34;,&#34;aliases&#34;:[&#34;玉運山&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市豊岡4517番地の1&#34;,&#34;district_id&#34;:&#34;ryuyo&#34;,&#34;area&#34;:&#34;竜洋&#34;,&#34;main_deity&#34;:&#34;薬師如来（『静岡県磐田郡誌』による）&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;金藏寺は磐田市豊岡（旧磐田郡竜洋町域、江戸期の金洗村）にある曹洞宗の寺院で、曹洞宗公式ポータル「曹洞禅ナビ」では読みを「コンゾウジ」としています。『静岡県磐田郡誌』（1921年）によると山号は玉運山、本尊は薬師如来で、天正15年（1587年）に同じ豊岡（旧江口村）の守増寺を開いた全雄の法嗣・嶺岳が草創した守増寺の末寺であり、慶安2年（1649年）8月17日に朱印3石8斗を寄附されました。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9346&#34;},{&#34;title&#34;:&#34;曹洞禅ナビ 金藏寺&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;曹洞宗公式ポータルに磐田市豊岡4517-1の寺院として掲載。フリガナ「コンゾウジ」を本文で確認。山号・本尊・由緒の記載はなし。&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220932.html&#34;},{&#34;title&#34;:&#34;曹洞宗 白澤山 金蔵寺（宮城県石巻市）公式サイト&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;検索上位に出る同名寺院。本文確認の結果、宮城県石巻市南境の寺院（慶長6年開創）であり磐田市の金藏寺とは無関係と判明。混同防止のため記録。&#34;,&#34;url&#34;:&#34;https://kinzouji.jp/about/&#34;},{&#34;title&#34;:&#34;『静岡県磐田郡誌』静岡県磐田郡編（1921年）第13章 神社及宗教・寺院の部「117 金藏寺（掛塚町）」p.696-697&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション（コマ457）。原本画像で由緒全文を確認&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/info:ndljp/pid/965680&#34;},{&#34;title&#34;:&#34;『遠江国風土記伝』内山真龍著（郁文舎、1900年）金洗村の項&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;NDL次世代デジタルライブラリー全文検索で本文断片を確認&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/info:ndljp/pid/765205&#34;},{&#34;title&#34;:&#34;磐田市公式サイト「旧竜洋町の住所表示」&#34;,&#34;type&#34;:&#34;行政資料&#34;,&#34;note&#34;:&#34;竜洋町豊岡→磐田市豊岡（438-0231）を確認。旧豊岡村域ではない&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/kurashi_tetsuzuki/koseki_juuminhyou_inkan/1001311/1001313.html&#34;}],&#34;research_todos&#34;:[&#34;読み仮名の確定（既存データは「きんぞうじ」だが、曹洞宗公式の曹洞禅ナビは「コンゾウジ」と表記。寺院への確認または『豊岡村史』での確認が必要）&#34;,&#34;『豊岡村史』『磐田市誌』での創建年代・山号・本尊の確認&#34;,&#34;本寺・末寺関係（旧豊岡村域の曹洞宗寺院の法系）の調査&#34;,&#34;現地での山門・本堂・石造物の確認&#34;,&#34;同名の宮城県石巻市「白澤山金蔵寺」（kinzouji.jp）等との混同防止（検索上位に出るが別寺院）&#34;,&#34;『磐田郡誌』の由緒（1921年時点）と現在の本尊・伽藍の対応関係を現地または寺院への確認で裏付ける&#34;,&#34;『竜洋町史』等での嶺岳・朱印状関係記事の確認&#34;,&#34;山号「玉運山」の現行表記（玉運山か玉雲山か）を現地の山号額等で確認&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;確認できる記録の現状&#34;,&#34;body&#34;:&#34;曹洞宗公式ポータル「曹洞禅ナビ」には、磐田市豊岡4517-1に所在する曹洞宗寺院として掲載され、フリガナは「コンゾウジ」と表記されています。一方、創建年代・山号・本尊などの沿革情報は同ポータルにも記載がなく、公開Webでは確認できませんでした。なお全国には宮城県石巻市の白澤山金蔵寺（公式サイトkinzouji.jp）や京都市の金蔵寺など同名寺院が多数あり、Web検索ではこれらの情報が混入しやすいため、磐田市豊岡の金藏寺の情報として利用しないよう注意が必要です。&#34;},{&#34;heading&#34;:&#34;『静岡県磐田郡誌』にみえる由緒&#34;,&#34;body&#34;:&#34;大正10年（1921年）刊の『静岡県磐田郡誌』は、当寺を「金藏寺（掛塚町）」として立項し、「掛塚町豊岡元金洗に在り。玉運山と號す。當所守増寺の末にして、本尊は藥師如來なり。天正十五年、守増寺全雄の法嗣嶺岳の草創する所にして、慶安二年八月十七日、朱印三石八斗を寄附せらる」と記しています。すなわち天正15年（1587年）、豊岡の守増寺を開山した聖寿寺7世全雄の法嗣にあたる嶺岳が開いた寺で、慶安2年（1649年）に江戸幕府から朱印地3石8斗を認められました。江戸中期の地誌『遠江国風土記伝』（内山真龍著）にも金洗村の項に「金藏寺、朱符之寺田高三石八斗、曹洞宗江口村守増寺末、平僧住」とみえ、両資料の石高は一致します。昭和9年（1934年）刊『日本国勢総攬』の掛塚町の社寺欄にも「金藏寺（曹）」として掲載されています。&#34;},{&#34;heading&#34;:&#34;所在地「豊岡」の変遷&#34;,&#34;body&#34;:&#34;現住所の磐田市豊岡は、2005年の合併前は磐田郡竜洋町豊岡であり（磐田市公式サイト「旧竜洋町の住所表示」）、さらに遡ると明治期には磐田郡掛塚町の大字豊岡でした。『磐田郡誌』が「豊岡元金洗」と記すように、豊岡は江戸期の金洗村・江口村・西堀村などが合併して成立した地名で、金藏寺は旧金洗村の寺院にあたります。天竜川北部の旧磐田郡豊岡村（下野部・敷地など、2005年合併）とは別の地域です。&#34;},{&#34;heading&#34;:&#34;同名寺院との混同に注意&#34;,&#34;body&#34;:&#34;曹洞宗公式ポータル「曹洞禅ナビ」には、磐田市豊岡4517-1に所在する曹洞宗寺院として掲載され、フリガナは「コンゾウジ」と表記されています。全国には宮城県石巻市の白澤山金蔵寺（公式サイトkinzouji.jp）や京都市の金蔵寺など同名寺院が多数あり、Web検索ではこれらの情報が混入しやすいため、磐田市豊岡の金藏寺の情報として利用しないよう注意が必要です。&#34;}],&#34;founded_period&#34;:&#34;天正15年（1587年）草創（『静岡県磐田郡誌』による）&#34;,&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0095&#34;,&#34;slug&#34;:&#34;yushoji-toyooka&#34;,&#34;name&#34;:&#34;雄照寺&#34;,&#34;name_kana&#34;:&#34;ゆうしょうじ&#34;,&#34;aliases&#34;:[&#34;神宮山&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市豊岡1053番地の1&#34;,&#34;district_id&#34;:&#34;ryuyo&#34;,&#34;area&#34;:&#34;竜洋&#34;,&#34;main_deity&#34;:&#34;地蔵菩薩（『静岡県磐田郡誌』による）&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;雄照寺は磐田市豊岡（旧磐田郡竜洋町域、江戸期の西堀村）にある曹洞宗の寺院です。『静岡県磐田郡誌』（1921年）によると山号は神宮山、本尊は地蔵菩薩で、同じ豊岡の守増寺の末寺として、正保2年（1645年）正月に守増寺開祖全雄の嗣・全唐が村民とはかって堂宇を創立したと伝えます。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9348&#34;},{&#34;title&#34;:&#34;『静岡県磐田郡誌』静岡県磐田郡編（1921年）第13章 神社及宗教・寺院の部「118 雄照寺（掛塚町）」p.697&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション（コマ457）。原本画像で由緒全文を確認&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/info:ndljp/pid/965680&#34;},{&#34;title&#34;:&#34;曹洞禅ナビ 寺院検索「雄照寺」&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;住所（磐田市豊岡1053-1）・フリガナ（ユウショウジ）を照合し当該寺院と確認。掲載は基本情報のみで、由緒・本尊・行事欄は空欄&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220950.html&#34;}],&#34;research_todos&#34;:[&#34;曹洞禅ナビ（sotozen-navi.com）で掲載ページが発見できなかったため、宗派側の寺院名簿での正式登録名・読みの確認&#34;,&#34;『豊岡村史』『磐田市誌』での創建年代・山号・本尊の確認&#34;,&#34;旧豊岡村域の曹洞宗寺院（金藏寺・守増寺等）との本末関係の調査&#34;,&#34;現地での山号額・本堂・石造物の確認&#34;,&#34;寺院一覧サイト（サーチ寺院等）には磐田市119ヶ寺の1つとして含まれるとみられるため、法人番号公表サイトでの宗教法人登録名の確認&#34;,&#34;現在の本尊・伽藍の現況確認（郡誌記載は1921年時点）&#34;,&#34;開祖名「全唐」の表記確認（郡誌原本の活字による判読）&#34;,&#34;『竜洋町史』等での沿革記事の確認&#34;,&#34;曹洞禅ナビの由緒・本尊欄が空欄のため、磐田市誌・豊岡村誌等の地域資料で由緒を調査する&#34;],&#34;founded_period&#34;:&#34;正保2年（1645年）正月創立（『静岡県磐田郡誌』による）&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;『静岡県磐田郡誌』にみえる由緒&#34;,&#34;body&#34;:&#34;大正10年（1921年）刊の『静岡県磐田郡誌』は、当寺を「雄照寺（掛塚町）」として立項し、「掛塚町豊岡元西堀に在り。神宮山と號す。當豊岡守増寺の末寺にして、本尊は地藏菩薩なり。正保二年乙酉正月、守増寺開祖全雄の嗣全唐村民と謀りて堂宇を創立す」と記しています。すなわち正保2年（1645年）正月、豊岡の中核寺院であった守増寺（大宝山）の開祖全雄の法嗣・全唐が、村民とともに建立した守増寺の末寺です。大正2年（1913年）刊『曹洞宗寺院名鑒』の磐田郡の部にも寺名がみえ、昭和9年（1934年）刊『日本国勢総攬』の掛塚町の社寺欄にも「雄照寺（曹）」として掲載されています。&#34;},{&#34;heading&#34;:&#34;所在地「豊岡」の変遷&#34;,&#34;body&#34;:&#34;現住所の磐田市豊岡は、2005年の合併前は磐田郡竜洋町豊岡であり（磐田市公式サイト「旧竜洋町の住所表示」）、明治期には磐田郡掛塚町の大字豊岡でした。『磐田郡誌』が「豊岡元西堀」と記すように、雄照寺は豊岡のうち江戸期の西堀村にあたる地区の寺院です。本寺の守増寺（旧江口村）、同じ守増寺末の金藏寺（旧金洗村）とともに、豊岡地区の曹洞宗寺院群を構成しています。&#34;}],&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0096&#34;,&#34;slug&#34;:&#34;shuzoji-toyooka&#34;,&#34;name&#34;:&#34;守増寺&#34;,&#34;name_kana&#34;:&#34;しゅぞうじ&#34;,&#34;aliases&#34;:[&#34;大宝山&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市豊岡2648番地&#34;,&#34;district_id&#34;:&#34;ryuyo&#34;,&#34;area&#34;:&#34;竜洋&#34;,&#34;main_deity&#34;:&#34;地蔵菩薩（『静岡県磐田郡誌』による）&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;守増寺は磐田市豊岡（旧磐田郡竜洋町域、江戸期の江口村）にある曹洞宗の寺院で、曹洞宗公式ポータル「曹洞禅ナビ」では読みを「シュゾウジ」としています。『静岡県磐田郡誌』（1921年）によると山号は大宝山、本尊は地蔵菩薩で、天正15年（1587年）2月、元吹上村の郷士三浦甚三郎重員（大宝院殿安心居士）を開基、袖浦村岡の聖寿寺7世全雄を開山として創建されました。江戸期には朱印寺領13石6斗と7か寺の末寺を有する、この地域の中核的な寺院でした。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9352&#34;},{&#34;title&#34;:&#34;曹洞禅ナビ 守増寺&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;曹洞宗公式ポータルに磐田市豊岡2648の寺院として掲載。フリガナ「シュゾウジ」を本文で確認。山号・本尊・由緒の記載はなし。&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220924.html&#34;},{&#34;title&#34;:&#34;全国寺院ドットコム 守増寺&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;静岡県磐田市豊岡2648の曹洞宗寺院として登載されていることを本文で確認。山号・本尊・由緒の記載はなし。&#34;,&#34;url&#34;:&#34;https://jiin.jpn.com/%e5%ae%88%e5%a2%97%e5%af%ba/&#34;},{&#34;title&#34;:&#34;お寺メイト（サーチ寺院） 静岡県磐田市 守増寺&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;宗教法人守増寺の法人番号6080405005507（2015年10月5日指定）、住所磐田市豊岡2648番地、曹洞宗であることを本文で確認。&#34;,&#34;url&#34;:&#34;https://www.bukkyou.com/TSInfo/T_22/Info0755000504086.html&#34;},{&#34;title&#34;:&#34;『静岡県磐田郡誌』静岡県磐田郡編（1921年）第13章 神社及宗教・寺院の部「116 守増寺（掛塚町）」p.696&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション（コマ457）。原本画像で由緒全文を確認&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/info:ndljp/pid/965680&#34;},{&#34;title&#34;:&#34;『遠江国風土記伝』内山真龍著（郁文舎、1900年）江口村・金洗村等の項&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;NDL次世代デジタルライブラリー全文検索で本文断片を確認&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/info:ndljp/pid/765205&#34;},{&#34;title&#34;:&#34;『寺社奉行一件書類』第4冊（江戸幕府文書、国立国会図書館蔵）&#34;,&#34;type&#34;:&#34;史料&#34;,&#34;note&#34;:&#34;天明4年可睡斎住職遷化時に役僧守増寺出府の記事&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/info:ndljp/pid/2532944&#34;},{&#34;title&#34;:&#34;『千郷村史』第15編（1929年）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;遠州江口守増寺に閑居した僧の記録&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/info:ndljp/pid/1101795&#34;},{&#34;title&#34;:&#34;ニッポンの霊場 磐田郡三十三観音霊場&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;第5番＝大宝山守増寺（曹洞宗・豊岡2648）を確認。寺名・宗派・住所がDBと一致。&#34;,&#34;url&#34;:&#34;https://nippon-reijo.jimdofree.com/%E6%8E%B2%E8%BC%89%E9%9C%8A%E5%A0%B4%E3%81%AE%E4%B8%80%E8%A6%A7/%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/%E7%A3%90%E7%94%B0%E9%83%A1%E4%B8%89%E5%8D%81%E4%B8%89%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/&#34;}],&#34;research_todos&#34;:[&#34;『豊岡村史』『磐田市誌』での創建年代・山号・本尊の確認&#34;,&#34;民間サイトには「もりますじ」という読みの表記もあるが、宗派公式（曹洞禅ナビ）は「シュゾウジ」であり、寺院への直接確認が望ましい&#34;,&#34;旧豊岡村域の曹洞宗寺院（金藏寺・雄照寺等）との本末関係の調査&#34;,&#34;現地での山号額・本堂・石造物の確認&#34;,&#34;開基三浦甚三郎重員（大宝院殿安心居士）に関する郷土資料の追加確認&#34;,&#34;嘉永期『吟味伺書進達留』にみえる守増寺関係一件の内容精査（幕末の寺院間紛議の詳細）&#34;,&#34;『竜洋町史』での沿革記事の確認&#34;,&#34;曹洞禅ナビの由緒・本尊欄が空欄のため、磐田市誌・豊岡村誌等の地域資料で由緒を調査する&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;確認できる記録の現状&#34;,&#34;body&#34;:&#34;曹洞宗公式ポータル「曹洞禅ナビ」には、磐田市豊岡2648に所在する曹洞宗寺院として掲載され、フリガナは「シュゾウジ」と表記されています。全国寺院ドットコムにも静岡県磐田市豊岡2648の曹洞宗寺院として登載されています。また寺院情報サイト「お寺メイト（サーチ寺院）」には宗教法人としての法人番号（6080405005507、2015年10月5日指定）が記載されています。なお現住所の磐田市豊岡は2005年合併前の磐田郡竜洋町豊岡（明治期は掛塚町大字豊岡）であり、守増寺はそのうち江戸期の江口村にあたる地区に所在します。&#34;},{&#34;heading&#34;:&#34;『静岡県磐田郡誌』にみえる由緒&#34;,&#34;body&#34;:&#34;大正10年（1921年）刊の『静岡県磐田郡誌』は、当寺を「守増寺（掛塚町）」として立項し、「掛塚町豊岡元江口に在り。大寶山と號す。袖浦村岡聖壽寺の末にして、本尊は地藏菩薩なり。天正十五年二月、元吹上村郷士三浦甚三郎重員大寶院殿安心居士の開基にして、聖壽寺第七世全雄開創の道場なり」と記しています。本寺の聖寿寺（岡村）は文明10年（1478年）開創・門末24か寺を有した小本寺格の寺院で、守増寺はその7世全雄が天正15年（1587年）に開いた道場に始まります。山号の大宝山は開基三浦甚三郎重員の法名「大宝院殿安心居士」と対応しています。&#34;,&#34;note&#34;:&#34;&#34;},{&#34;heading&#34;:&#34;江戸期の寺格と末寺&#34;,&#34;body&#34;:&#34;江戸中期の地誌『遠江国風土記伝』（内山真龍著）には「守増寺、朱符之寺田高拾三石六斗、末寺七宇、曹洞宗岡村聖壽寺末」とみえ、朱印寺領13石6斗と7か寺の末寺を有したことがわかります。同書には江口村守増寺の末寺として友泉寺・泉重寺・照善庵・金藏寺（金洗村）などが挙げられ、『磐田郡誌』では豊岡元金洗の金藏寺（天正15年草創）と豊岡元西堀の雄照寺（正保2年創立）が守増寺の末寺として立項されています。また国立国会図書館所蔵の江戸幕府寺社奉行関係文書（『寺社奉行一件書類』）には、天明4年（1784年）に本山格の可睡斎住職が遷化した際、役僧として「守増寺」が江戸へ出府した記録がみえるほか、嘉永年間の『吟味伺書進達留』にも遠州の曹洞宗寺院間の懸案に関わる寺院として名が現れており、江戸後期の寺社行政記録にもその存在が確認できます。昭和4年（1929年）刊の『千郷村史』（愛知県）には、「遠州江口守増寺」に閑居し安政3年（1856年）に示寂した僧の記録もみえます。&#34;}],&#34;founded_period&#34;:&#34;天正15年（1587年）2月開創（『静岡県磐田郡誌』による）&#34;,&#34;cultural_assets&#34;:[],&#34;pilgrimage_note&#34;:&#34;磐田郡三十三観音霊場第5番札所&#34;},{&#34;temple_id&#34;:&#34;iwata-0097&#34;,&#34;slug&#34;:&#34;shokoji-miyanoshiki&#34;,&#34;name&#34;:&#34;松向寺&#34;,&#34;name_kana&#34;:&#34;しょうこうじ&#34;,&#34;aliases&#34;:[&#34;神宮山&#34;,&#34;松向庵&#34;,&#34;正光庵&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市宮之一色413番地&#34;,&#34;district_id&#34;:&#34;toyoda&#34;,&#34;area&#34;:&#34;豊田&#34;,&#34;main_deity&#34;:&#34;十一面観世音菩薩（『静岡県磐田郡誌』の松向庵の項による）&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;現地写真あり&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;松向寺は磐田市宮之一色にある曹洞宗の寺院です。『静岡県磐田郡誌』（1921年）には「松向庵」として立項され、山号は神宮山、本尊は十一面観世音菩薩、下万能の正医寺開山の徒弟林鶴による元和5年（1619年）8月28日の創立と記されています。慶長6年（1601年）2月14日に黒印高1石を拝領し、明治7年（1874年）9月には地元の真言宗地蔵寺を合併しました。『日本歴史地名大系』の宮之一色村の項には江戸期の寺領として「正光庵（現松向寺）領一石」がみえます。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-12&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9354&#34;},{&#34;title&#34;:&#34;曹洞禅ナビ 松向寺&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;曹洞宗公式ポータルに磐田市宮之一色413の寺院として掲載。フリガナ「ショウコウジ」を本文で確認。公式HP・Facebook・Instagramのリンク枠があるが遷移先は未確認。山号・本尊・由緒の記載はなし。&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220973.html&#34;},{&#34;title&#34;:&#34;NAVITIME 松向寺（磐田市-寺院）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;磐田市宮之一色413所在、豊田町駅から徒歩約16分であることを検索結果で確認（補助情報）。&#34;,&#34;url&#34;:&#34;https://www.navitime.co.jp/poi?spot=00011-050255265&#34;},{&#34;title&#34;:&#34;『静岡県磐田郡誌』静岡県磐田郡編（1921年）第13章 神社及宗教・寺院の部「130 松向庵（井通村）」p.700&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション（コマ459）。原本画像で由緒全文を確認&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/info:ndljp/pid/965680&#34;},{&#34;title&#34;:&#34;コトバンク「宮之一色村」（日本歴史地名大系）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;「正光庵（現松向寺）領一石」の記載&#34;,&#34;url&#34;:&#34;https://kotobank.jp/word/宮之一色村&#34;},{&#34;title&#34;:&#34;ニッポンの霊場 豊田郡三十三観音霊場&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;第21番＝神宮山松向寺（曹洞宗・宮之一色413）を確認。寺名・宗派・住所がDBと一致。&#34;,&#34;url&#34;:&#34;https://nippon-reijo.jimdofree.com/%E6%8E%B2%E8%BC%89%E9%9C%8A%E5%A0%B4%E3%81%AE%E4%B8%80%E8%A6%A7/%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/%E8%B1%8A%E7%94%B0%E9%83%A1%E4%B8%89%E5%8D%81%E4%B8%89%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/&#34;}],&#34;research_todos&#34;:[&#34;曹洞禅ナビに公式ホームページ・SNS保有の表示があるため、公式サイト・SNSアカウントの特定&#34;,&#34;『豊田町誌』『磐田市誌』での創建年代・山号・本尊の確認&#34;,&#34;旧東海道宮之一色村における寺の位置づけ（一里塚・秋葉山常夜燈との関係）の郷土資料調査&#34;,&#34;見付の省光寺（時宗）と読みが同じため、資料引用時の混同防止を徹底&#34;,&#34;現地での山号額・本堂・石造物の確認&#34;,&#34;「正光庵」から「松向庵」「松向寺」への改称時期の確認（『磐田市誌』『豊田町誌』等）&#34;,&#34;明治7年に合併した真言宗地蔵寺の旧地・沿革の確認&#34;,&#34;山号「神宮山」の現行使用の確認（郡誌では豊岡の雄照寺も同じ神宮山と号する）&#34;,&#34;曹洞禅ナビの由緒・本尊欄が空欄のため、磐田市誌等の地域資料で由緒を調査する&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;確認できる記録の現状&#34;,&#34;body&#34;:&#34;曹洞宗公式ポータル「曹洞禅ナビ」には、磐田市宮之一色413に所在する曹洞宗寺院として掲載され、フリガナは「ショウコウジ」と表記されています。同ポータルのページには公式ホームページ・Facebook・Instagramへのリンク枠が設けられていますが、リンク先の実体は確認できませんでした。NAVITIMEでは豊田町駅から徒歩約16分の寺院として案内されています。創建年代・山号・本尊などの沿革情報は公開Webでは確認できませんでした。なお磐田市見付には同じ読みの省光寺（しょうこうじ・時宗）があり、混同に注意が必要です。&#34;},{&#34;heading&#34;:&#34;『静岡県磐田郡誌』にみえる松向庵&#34;,&#34;body&#34;:&#34;大正10年（1921年）刊の『静岡県磐田郡誌』は、当寺を「松向庵（井通村）」として立項し、「井通村宮の一色村字折戸に在り。神宮山と號す。當村正醫寺の末にして、本尊は十一面觀世音菩薩なり。元和五年八月二十八日の創立にして、正醫寺開山の徒弟林鶴の草創する所なり。慶長六年二月十四日、黑印高壹石を賜はる。明治七年九月、當所眞言宗地藏寺を合併す」と記しています。本寺の正医寺（東光山、下万能）は掛川の真如寺末で末寺9か寺を有した寺院で、松向寺はその末寺群のひとつです。なお同誌の記載では創立（元和5年＝1619年）より黒印拝領（慶長6年＝1601年）の方が早く、前後関係は資料の記載のまま示します。&#34;},{&#34;heading&#34;:&#34;江戸期の寺領と名称の変遷&#34;,&#34;body&#34;:&#34;『日本歴史地名大系』（平凡社）の宮之一色村の項には、江戸期の寺領として「正光庵（現松向寺）領一石」とみえ、『磐田郡誌』の「黒印高一石」と石高が一致します。名称は資料により「正光庵」「松向庵」と異なりますが、いずれも現在の松向寺にあたる庵寺を指しており、江戸期には庵として存続し、のちに寺号を松向寺と改めたことがうかがえます。旧東海道の宮之一色一里塚で知られる宮之一色の集落において、寺領1石を認められた由緒ある庵でした。&#34;}],&#34;founded_period&#34;:&#34;元和5年（1619年）8月28日創立（『静岡県磐田郡誌』による。同誌には慶長6年（1601年）黒印拝領の記載もある）&#34;,&#34;cultural_assets&#34;:[],&#34;pilgrimage_note&#34;:&#34;豊田郡三十三観音霊場第21番札所（享保年間開創の歴史的霊場・現在は活動していない）&#34;},{&#34;temple_id&#34;:&#34;iwata-0098&#34;,&#34;slug&#34;:&#34;chionsai-hitokoto&#34;,&#34;name&#34;:&#34;智恩齋&#34;,&#34;name_kana&#34;:&#34;ちおんさい&#34;,&#34;aliases&#34;:[&#34;智恩斎&#34;,&#34;一言観音&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市一言797番地&#34;,&#34;district_id&#34;:&#34;toyoda&#34;,&#34;area&#34;:&#34;豊田&#34;,&#34;main_deity&#34;:&#34;未確認&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;公開情報調査済み&#34;,&#34;history_summary&#34;:&#34;智恩齋（智恩斎）は磐田市一言にある曹洞宗の寺院です。山門脇には「一言観音」と呼ばれる観音像を安置する観音堂があり、元亀3年（1572年）の一言坂の戦いの際に徳川家康が祈願したという伝承で知られます。「一言」という地名自体がこの観音に由来すると伝えられています。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9356&#34;},{&#34;title&#34;:&#34;中遠昔ばなし 第68話「一言観音（豊田町）」&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;智恩斎の山門脇に一言観音が安置されていること、一言坂の戦いでの家康祈願の言い伝え、一言村の地名由来を本文で確認。出典は『豊田町誌 別編 民俗文化史』と明記。&#34;,&#34;url&#34;:&#34;https://www.chuen.net/mukashi/mukashi_068.html&#34;},{&#34;title&#34;:&#34;一言坂の戦跡・一言観音（全国家康公ネットワーク・静岡商工会議所）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;「一言坂の戦跡・一言観音」の所在地が磐田市一言797（智恩斎）であること、家康の勝利祈願伝承を本文で確認。&#34;,&#34;url&#34;:&#34;http://www.ieyasu-net.com/shiseki/shizuoka/02iwatashi/0002.html&#34;},{&#34;title&#34;:&#34;岡部英一ブログ「(19) 一言観音堂」&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;一言観音堂がもとは本坂道（姫街道）沿いの台地にあり後に智恩斎の前に移されたと伝わること、興福寺南円堂の一言観音信仰との関係を本文で確認。&#34;,&#34;url&#34;:&#34;https://ameblo.jp/sakaisouga/entry-12672078309.html&#34;},{&#34;title&#34;:&#34;いわたスペシャリスト認定試験 問題（磐田おんぱく掲載PDF）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;問49で一言坂の戦い・一言観音の伝承が取り上げられ、安置先を問う選択肢に智恩斎が含まれることを本文で確認（設問のため断定根拠には使用せず補助情報）。&#34;,&#34;url&#34;:&#34;https://iwata-onpaku.jp/wp-onpaku/wp-content/uploads/2025/10/6f47b3a5937f1466a5ffb31158a25d7e.pdf&#34;},{&#34;title&#34;:&#34;曹洞禅ナビ 寺院検索「智恩齋」&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;住所（磐田市一言797）・フリガナ（チオンサイ）を照合し当該寺院と確認。公式表記は「智恩齋」。掲載は基本情報のみで、由緒・本尊・行事欄は空欄&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220959.html&#34;}],&#34;research_todos&#34;:[&#34;智恩齋自体の創建年代・山号・本尊の確認（『豊田町誌』本編・『磐田市誌』の確認）&#34;,&#34;「齋（斎）」を称する寺院形態（庵・斎）としての成立経緯の調査&#34;,&#34;一言観音堂の現状（堂宇・案内板の有無）の現地確認&#34;,&#34;一言観音の像容（観音の種類・製作年代）の確認&#34;,&#34;一言坂古戦場碑・磐田市による戦跡案内と智恩齋の位置関係の整理&#34;,&#34;曹洞禅ナビに掲載が確認できなかったため、宗派側名簿での登録確認&#34;,&#34;曹洞禅ナビの由緒・本尊欄が空欄のため、一言観音として知られる由緒や札所情報を地域資料で調査する&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;一言観音の伝承&#34;,&#34;body&#34;:&#34;中遠地域広域行政事務組合系サイトの「中遠昔ばなし」第68話（出典は『豊田町誌 別編 民俗文化史』）によれば、豊田町一言（現磐田市一言）の智恩斎の山門脇に安置されている観音様には次のような言い伝えがあります。武田信玄の軍勢に追われた徳川家康の軍は磐田原台地の西のはずれで追いつかれ、戦況不利とみた家康は、一生に一度一言だけ願いを聞いてくださるという観音様に「どうかこの戦いに勝たせてください」と祈願しました。殿軍を守る本多平八郎忠勝の奮戦もあり、徳川軍は無事浜松城へ撤退できたと伝えられます。その後この観音様は「一言観音」と呼ばれるようになり、観音様のある村を一言村と呼ぶようになったということです。&#34;},{&#34;heading&#34;:&#34;一言坂の戦いと観音堂&#34;,&#34;body&#34;:&#34;全国家康公ネットワーク（静岡商工会議所）のサイトでは、「一言坂の戦跡・一言観音」として磐田市一言797（智恩斎の所在地）が案内されており、三方ヶ原合戦の前哨戦で敗走する徳川軍と追撃する武田軍が再び合戦になった地が一言坂であること、家康公が一言観音に立ち寄り勝利を祈願したと伝えられることが記されています。また郷土史研究者のブログによれば、一言観音堂はもとは本坂道（姫街道）沿いの台地にあり、のちに智恩斎の前に移されたと伝わり、その信仰の起源は奈良・興福寺南円堂の一言観音信仰が遠江国に伝わったものとされています（民間二次情報）。磐田市観光協会が関わる「いわたスペシャリスト認定試験」の問題（2025年度）でも、一言観音が現在安置される寺を問う設問が出題されています。&#34;}]},{&#34;temple_id&#34;:&#34;iwata-0099&#34;,&#34;slug&#34;:&#34;anrakuji-tateno&#34;,&#34;name&#34;:&#34;安楽寺&#34;,&#34;name_kana&#34;:&#34;あんらくじ&#34;,&#34;aliases&#34;:[],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市立野477番地&#34;,&#34;district_id&#34;:&#34;toyoda&#34;,&#34;area&#34;:&#34;豊田&#34;,&#34;main_deity&#34;:&#34;未確認&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;公開情報調査済み&#34;,&#34;history_summary&#34;:&#34;安楽寺は磐田市立野にある曹洞宗の寺院です。磐田市指定文化財の「紙本著色十六羅漢画像」（絵画）と「伊奈忠次判物」（古文書）の2件を所有しており、特に慶長6年（1601年）の伊奈忠次判物は近世初期の中泉代官による行政を示す史料として知られます。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9358&#34;},{&#34;title&#34;:&#34;市指定文化財｜磐田市公式ウェブサイト&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;所有者「安楽寺」・所在地「立野」の市指定文化財2件（紙本著色十六羅漢画像＝大須賀陶山作、伊奈忠次判物＝慶長6年2月11日付）の名称・種別・指定年月日・解説を本文で確認。&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/sports_midokoro/bunkazai/bunkazainitsuite/1002039.html&#34;},{&#34;title&#34;:&#34;曹洞禅ナビ 寺院検索「安楽寺」&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;住所（磐田市立野477）・フリガナ（アンラクジ）を照合し当該寺院と確認。掲載は基本情報のみで、由緒・本尊・行事欄は空欄&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220961.html&#34;}],&#34;research_todos&#34;:[&#34;安楽寺自体の創建年代・山号・本尊の確認（『豊田町誌』『磐田市誌』の確認）&#34;,&#34;伊奈忠次判物の内容（宛先・安堵内容）と安楽寺への伝来経緯の調査&#34;,&#34;十六羅漢画像の筆者・大須賀陶山に関する郷土資料の調査&#34;,&#34;曹洞禅ナビに掲載が確認できなかったため、宗派側名簿での登録確認&#34;,&#34;全国の著名な同名寺院（長野県上田市別所温泉の安楽寺＝国宝八角三重塔など）との混同防止&#34;,&#34;曹洞禅ナビの由緒・本尊欄が空欄のため、磐田市誌等の地域資料で由緒を調査する&#34;],&#34;heritage_status&#34;:&#34;磐田市指定文化財あり（2件所有）&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;寺と市指定文化財&#34;,&#34;body&#34;:&#34;磐田市公式ウェブサイトの市指定文化財一覧によれば、安楽寺（所在地・立野）は2件の磐田市指定文化財を所有しています。いずれも平成17年（2005年）11月21日の指定です。「紙本著色十六羅漢画像」は江戸時代の人・大須賀陶山の作で、筆者が明らかな十六羅漢像は少なく、貴重な資料とされています。「伊奈忠次判物」は慶長6年（1601年）2月11日付の、初代中泉代官・伊奈忠次の文書で、近世初期の行政の在り方を示す貴重な史料と評価されています。同日付近の伊奈忠次判物は市内の上万能・池田などにも伝来しており、徳川政権初期の中泉代官支配を示す一連の史料群の1つといえます。&#34;},{&#34;heading&#34;:&#34;文化財資料からの補足&#34;,&#34;body&#34;:&#34;安楽寺が所蔵する紙本著色十六羅漢画像は江戸時代の大須賀陶山の作です。筆者が明らかな十六羅漢像は少なく、磐田市指定有形文化財（絵画）に指定されています。 慶長6年（1601年）2月11日付の初代中泉代官・伊奈忠次の判物を所蔵し、近世初期の行政の在り方を示す史料として磐田市指定有形文化財（古文書）になっています。&#34;}],&#34;cultural_assets&#34;:[{&#34;name&#34;:&#34;紙本著色十六羅漢画像&#34;,&#34;designation&#34;:&#34;磐田市指定文化財（絵画）&#34;,&#34;summary&#34;:&#34;江戸時代の人・大須賀陶山の作。筆者が明らかな十六羅漢像は少なく、貴重な資料とされています。平成17年（2005年）11月21日指定。&#34;},{&#34;name&#34;:&#34;伊奈忠次判物&#34;,&#34;designation&#34;:&#34;磐田市指定文化財（古文書）&#34;,&#34;summary&#34;:&#34;慶長6年（1601年）2月11日付の、初代中泉代官・伊奈忠次の文書。近世初期の行政の在り方を示す貴重な史料とされています。平成17年（2005年）11月21日指定。&#34;}]},{&#34;temple_id&#34;:&#34;iwata-0100&#34;,&#34;slug&#34;:&#34;toyodain-kegojima&#34;,&#34;name&#34;:&#34;豊田院&#34;,&#34;name_kana&#34;:&#34;ほうでんいん&#34;,&#34;aliases&#34;:[&#34;万年山&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市気子島324番地&#34;,&#34;district_id&#34;:&#34;toyoda&#34;,&#34;area&#34;:&#34;豊田&#34;,&#34;main_deity&#34;:&#34;地蔵菩薩（『静岡県磐田郡誌』による）&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;豊田院は磐田市気子島（旧豊田町域）にある曹洞宗の寺院で、曹洞宗公式ポータル「曹洞禅ナビ」では読みを「ホウデンイン」としています。『静岡県磐田郡誌』（1921年）によると山号は万年山、本尊は地蔵菩薩で、下万能の正医寺（東光山）の末寺として、慶長元年（1596年）5月18日に正医寺2世の徒弟によって開創されたと伝えます。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9360&#34;},{&#34;title&#34;:&#34;曹洞禅ナビ 豊田院&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;曹洞宗公式ポータルに磐田市気子島324の寺院として掲載。フリガナ「ホウデンイン」を本文で確認。山号・本尊・由緒の記載はなし。&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220960.html&#34;},{&#34;title&#34;:&#34;市指定文化財｜磐田市公式ウェブサイト&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;気子島所在の市指定文化財「徳川七カ条定書」（所有者は個人）を本文で確認。豊田院所有の指定文化財は記載なし。&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/sports_midokoro/bunkazai/bunkazainitsuite/1002039.html&#34;},{&#34;title&#34;:&#34;『静岡県磐田郡誌』静岡県磐田郡編（1921年）第13章 神社及宗教・寺院の部「135 豊田院（井通村）」p.700-701&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション（コマ459）。原本画像で由緒全文を確認&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/info:ndljp/pid/965680&#34;},{&#34;title&#34;:&#34;コトバンク「気子島村」（日本歴史地名大系）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;明応2年の大般若経書写の記録&#34;,&#34;url&#34;:&#34;https://kotobank.jp/word/気子島村&#34;}],&#34;research_todos&#34;:[&#34;読み仮名の確定（既存データは「とよだいん」だが、曹洞宗公式の曹洞禅ナビは「ホウデンイン」と表記。寺院への確認または『豊田町誌』での確認が必要）&#34;,&#34;『豊田町誌』『磐田市誌』での創建年代・山号・本尊の確認&#34;,&#34;院号を称する寺院としての成立経緯（本寺との関係）の調査&#34;,&#34;現地での山号額・本堂・石造物の確認&#34;,&#34;開創者の僧名（郡誌活字では「齢嫩」）の正確な表記・読みの確認&#34;,&#34;現在の本尊・伽藍の現況確認（郡誌記載は1921年時点）&#34;,&#34;同じ気子島にあった海円寺・伝心寺のその後（現存か廃寺か）の確認&#34;,&#34;曹洞禅ナビの由緒・本尊欄が空欄のため、磐田市誌等の地域資料で由緒を調査する&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;確認できる記録の現状&#34;,&#34;body&#34;:&#34;曹洞宗公式ポータル「曹洞禅ナビ」には、磐田市気子島324に所在する曹洞宗寺院として掲載され、フリガナは「ホウデンイン」と表記されています。創建年代・山号・本尊などの沿革情報は同ポータルにも記載がなく、公開Webでは確認できませんでした。所在地の気子島には、磐田市指定文化財（古文書）として個人所有の「徳川七カ条定書」（徳川家康が三遠駿甲信の領地に出した農民支配に関わる文書）が伝来しており、近世初期からの集落の歴史がうかがえますが、豊田院との直接の関係は確認できていません。&#34;},{&#34;heading&#34;:&#34;『静岡県磐田郡誌』にみえる由緒&#34;,&#34;body&#34;:&#34;大正10年（1921年）刊の『静岡県磐田郡誌』は、当寺を「豊田院（井通村）」として立項し、「井通村氣子島字宮前に在り。萬年山と號す。當村正醫寺の末寺にして、本尊は地藏菩薩なり。慶長元年五月十八日、本寺第二世の徒弟齡嫩の開創に係る」と記しています（開創者の僧名は同誌の活字で「齢嫩」と判読されます）。本寺の正医寺（東光山、下万能）は掛川の真如寺末で、慶長5年（1600年）に伽藍を建立し末寺9か寺を有した寺院であり、豊田院はその末寺群のひとつとして江戸時代初頭に開かれました。&#34;},{&#34;heading&#34;:&#34;気子島の寺院群と中世の仏教活動&#34;,&#34;body&#34;:&#34;『磐田郡誌』には、同じ気子島の字宮前に慶長6年（1601年）創建の海円寺（青林山・本尊地蔵菩薩）、字上川田に慶長8年（1603年）創建の伝心寺（高野山・本尊虚空蔵菩薩）も正医寺末として立項されており、江戸初期の気子島には正医寺の末寺が相次いで開かれたことがわかります。さらに『日本歴史地名大系』の気子島村の項には、明応2年（1493年）に「池田庄気子島」の住僧周勢が大般若波羅蜜多経を書写した記録（日枝神社蔵）がみえ、中世末のこの集落にすでに僧侶の活動があったことが知られますが、豊田院との直接の関係は確認できていません。&#34;},{&#34;heading&#34;:&#34;所在地・気子島の歴史環境&#34;,&#34;body&#34;:&#34;所在地の気子島には、磐田市指定文化財（古文書）として個人所有の「徳川七カ条定書」（徳川家康が三遠駿甲信の領地に出した農民支配に関わる文書）が伝来しており、『静岡県史料』第5輯には天正17年（1589年）9月17日付で伊奈熊蔵家次が「氣子嶋惣領方百姓中」に奉じた文書として収録されています。近世初期からの集落の歴史がうかがえますが、豊田院との直接の関係は確認できていません。&#34;}],&#34;founded_period&#34;:&#34;慶長元年（1596年）5月18日開創（『静岡県磐田郡誌』による）&#34;,&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0101&#34;,&#34;slug&#34;:&#34;shoi-ji-shimoban-no&#34;,&#34;name&#34;:&#34;正医寺&#34;,&#34;name_kana&#34;:&#34;しょういじ&#34;,&#34;aliases&#34;:[&#34;東光山正醫寺&#34;,&#34;正醫寺&#34;,&#34;萬能観音&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市下万能1162番地の1&#34;,&#34;district_id&#34;:&#34;toyoda&#34;,&#34;area&#34;:&#34;豊田&#34;,&#34;main_deity&#34;:&#34;薬師如来&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;公開情報調査済み&#34;,&#34;history_summary&#34;:&#34;正医寺（正醫寺）は磐田市下万能にある曹洞宗の寺院で、山号は東光山、本尊は薬師如来です。寺伝では延暦元年（782年）の草創と伝えられ、慶長5年（1600年）に巨山宗鯨大和尚により曹洞宗寺院として開山されました。遠州三十三観音霊場第19番札所（札所本尊・如意輪観世音菩薩）であり、観音堂は「萬能観音」の名で親しまれています。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-12&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9362&#34;},{&#34;title&#34;:&#34;遠州三十三観音霊場めぐり「正醫寺（磐田市下万能・19番札所）」&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;霊場会（事務局・可睡斎）公式サイト。山号東光山、曹洞宗、本尊薬師如来、札所本尊如意輪観世音菩薩、延暦元年草創の寺伝、慶長5年3月10日巨山宗鯨大和尚開山・曹洞宗改宗、慶応4年本堂建立、昭和61年観音堂再建と安置仏、萬能観音の別名、3月・9月の供養祭、御詠歌を本文で確認。&#34;,&#34;url&#34;:&#34;http://enshu33.com/all-guide/%E6%AD%A3%E9%86%AB%E5%AF%BA/&#34;},{&#34;title&#34;:&#34;ニッポンの霊場「遠江四十九薬師霊場」札所一覧&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;第5番「東光山 正医寺 薬師如来 曹洞宗 磐田市下万能（備考・遠州33観音）」の記載を本文で確認。&#34;,&#34;url&#34;:&#34;https://nippon-reijo.jimdofree.com/%E6%8E%B2%E8%BC%89%E9%9C%8A%E5%A0%B4%E3%81%AE%E4%B8%80%E8%A6%A7/%E8%96%AC%E5%B8%AB%E9%9C%8A%E5%A0%B4/%E9%81%A0%E6%B1%9F%E5%9B%9B%E5%8D%81%E4%B9%9D%E8%96%AC%E5%B8%AB%E9%9C%8A%E5%A0%B4/&#34;},{&#34;title&#34;:&#34;遠州三十三観音霊場めぐり 札所一覧（霊場会公式サイト）&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;第19番＝東光山正醫寺（下万能1162-1）を公式一覧で確認（既存注記どおり）。&#34;,&#34;url&#34;:&#34;http://enshu33.com/all-guide/&#34;},{&#34;title&#34;:&#34;ニッポンの霊場 磐田郡三十三観音霊場&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;第9番＝東光山正医寺（下万能1162・霊場御本尊如意輪観世音菩薩）を確認。なお豊田郡三十三観音第32番正林寺（海老塚・廃寺）は正医寺に併合されたとの記載あり。&#34;,&#34;url&#34;:&#34;https://nippon-reijo.jimdofree.com/%E6%8E%B2%E8%BC%89%E9%9C%8A%E5%A0%B4%E3%81%AE%E4%B8%80%E8%A6%A7/%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/%E7%A3%90%E7%94%B0%E9%83%A1%E4%B8%89%E5%8D%81%E4%B8%89%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/&#34;},{&#34;title&#34;:&#34;曹洞禅ナビ 寺院検索「正医寺」&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;住所（磐田市下万能1162-1）・フリガナ（ショウイジ）を照合し当該寺院と確認。公式登録表記は新字の「正医寺」。掲載は基本情報のみで、由緒・本尊・行事欄は空欄&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220962.html&#34;}],&#34;research_todos&#34;:[&#34;延暦元年（782年）草創という寺伝の典拠（『磐田市誌』等の記載）の確認&#34;,&#34;曹洞宗改宗以前の宗派・寺名の調査&#34;,&#34;観音堂安置の江戸前期仏像群の詳細（製作年代・仏師）の調査&#34;,&#34;遠江四十九薬師霊場第5番としての札所活動の現状確認（霊場会公式資料での裏取り）&#34;,&#34;曹洞禅ナビ掲載ページの特定（今回の検索では未発見）&#34;,&#34;曹洞禅ナビの由緒欄が空欄のため、萬能観音・薬師如来に関する既存情報は他資料での裏付けを継続する&#34;,&#34;寺院独自の公式サイト・SNSの有無を現地確認する&#34;,&#34;護持会・世話人会等の運営組織の有無を確認する&#34;],&#34;founded_period&#34;:&#34;延暦元年（782年）草創と伝えられる（慶長5年〈1600年〉に曹洞宗寺院として開山）&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;創建と沿革&#34;,&#34;body&#34;:&#34;遠州三十三観音霊場公式サイトの縁起によれば、正醫寺は延暦元年（782年）の草創であると伝えられています。その約800年後の慶長5年（1600年）3月10日に巨山宗鯨大和尚によって開山され、寺は曹洞宗に改宗されました。現在の本堂は慶応4年（1868年）に建てられたもので、本尊の薬師如来が祀られています。&#34;},{&#34;heading&#34;:&#34;観音堂（萬能観音）と諸仏&#34;,&#34;body&#34;:&#34;昭和61年（1986年）に観音堂が再建され、如意輪観音、大日如来、阿弥陀如来、延命地蔵、虚空蔵菩薩、不動明王、毘沙門天など江戸時代前期の仏像が安置されています。この観音堂は別名「萬能観音」と呼ばれ、毎年3月と9月に供養祭が行われます。札所本尊の如意輪観世音菩薩は救世観音とも呼ばれる六臂の観音で、延命・安産・災難除けなどの功徳があるとして信仰されています。御詠歌は「よをてらす　じひのひかりを　よろづよに　いつもかわらで　ひとぞみちびく」です。&#34;},{&#34;heading&#34;:&#34;霊場札所として&#34;,&#34;body&#34;:&#34;正醫寺は遠州三十三観音霊場の第19番札所です（第17番宣光寺・第18番福王寺・第20番永福寺など磐田市内の札所が周辺に連なります）。また、浜松市・磐田市・袋井市にまたがる遠江四十九薬師霊場の第5番札所（東光山正医寺・本尊薬師如来）としても紹介されています（民間の霊場紹介サイトによる）。&#34;},{&#34;heading&#34;:&#34;檀家向け情報の補足&#34;,&#34;body&#34;:&#34;現在の本堂は慶応4年（1868年）に建てられたもので、本尊の薬師如来を祀る。観音堂は昭和61年（1986年）に再建され、如意輪観音・大日如来・阿弥陀如来・延命地蔵・虚空蔵菩薩・不動明王・毘沙門天など江戸時代前期の仏像が安置されていると伝わる。&#34;}],&#34;pilgrimage_note&#34;:&#34;遠州三十三観音霊場第19番札所（札所本尊如意輪観世音菩薩）／遠江四十九薬師霊場第5番札所（札所本尊薬師如来）／磐田郡三十三観音霊場第9番札所&#34;,&#34;danka_info&#34;:{&#34;annual_events&#34;:[{&#34;name&#34;:&#34;供養祭&#34;,&#34;timing&#34;:&#34;毎年3月・9月&#34;,&#34;note&#34;:&#34;本堂脇の観音堂（通称「萬能観音」）で行われる。遠州三十三観音霊場会サイトによる&#34;}],&#34;cemetery&#34;:&#34;確認できず&#34;,&#34;organization&#34;:&#34;確認できず&#34;,&#34;community_role&#34;:&#34;確認できず&#34;,&#34;parking&#34;:&#34;境内に駐車場があり、大型バス3台分の駐車が可能。遠州三十三観音霊場会サイトによる&#34;}},{&#34;temple_id&#34;:&#34;iwata-0102&#34;,&#34;slug&#34;:&#34;fukuoji-morimoto&#34;,&#34;name&#34;:&#34;福王寺&#34;,&#34;name_kana&#34;:&#34;ふくおうじ&#34;,&#34;aliases&#34;:[&#34;慈現山&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市森本287番地&#34;,&#34;district_id&#34;:&#34;toyoda&#34;,&#34;area&#34;:&#34;豊田&#34;,&#34;main_deity&#34;:&#34;十一面観世音菩薩（『静岡県磐田郡誌』による）&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;磐田市森本の福王寺は曹洞宗の寺院で、『静岡県磐田郡誌』（1921年）によると山号は慈現山、本尊は十一面観世音菩薩です。弘治年間（1555〜1558年）に臨済宗の寺として開創され、文禄2年（1593年）に駿河国井川村龍泉院5世の大鯨によって曹洞宗に改められて法地格に列し、慶長6年（1601年）に黒印高3石、慶安元年（1648年）には朱印高を与えられました。城之崎の同名寺院（風祭山福王寺）とは別の寺院です。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9364&#34;},{&#34;title&#34;:&#34;福王寺 - 曹洞禅ナビ（曹洞宗公式寺院ポータル）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;磐田市森本287の曹洞宗寺院として登載。由緒・本尊の記載はなし。&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220964.html&#34;},{&#34;title&#34;:&#34;静岡県磐田市の寺院・御堂一覧（サーチ寺院）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;磐田市内に福王寺が2か寺（森本287と城之崎4-2722-1）あることを確認。いずれも曹洞宗。&#34;,&#34;url&#34;:&#34;https://www.bukyou.com/BukyBukyou/TBukyou22/C22CNo211Detail.html&#34;},{&#34;title&#34;:&#34;中遠昔ばなし 福王寺［風祭山と安倍晴明］&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;風祭山の安倍晴明伝承は今之浦東方（城之崎）の福王寺のものであり、森本の福王寺ではないことを本文で確認。&#34;,&#34;url&#34;:&#34;https://www.chuen.net/mukashi/mukashi_125.html&#34;},{&#34;title&#34;:&#34;『静岡県磐田郡誌』静岡県磐田郡編（1921年）第13章 神社及宗教・寺院の部「127 福王寺（井通村）」p.698-699&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション（コマ458）。原本画像で由緒全文を確認&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/info:ndljp/pid/965680&#34;},{&#34;title&#34;:&#34;コトバンク「森本村」（日本歴史地名大系）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;正保郷帳「福王寺領三石」、旧称押切村の記載&#34;,&#34;url&#34;:&#34;https://kotobank.jp/word/森本村&#34;}],&#34;research_todos&#34;:[&#34;『豊田町誌』『磐田市誌』で森本の福王寺の創建年代・山号・本尊を確認する&#34;,&#34;本寺と末寺関係（本寺がどの寺院か）を宗門資料で確認する&#34;,&#34;現地で山門・堂宇・石造物の銘文を確認する&#34;,&#34;城之崎の福王寺との寺号の由来上の関係の有無を調べる&#34;,&#34;慶安元年の朱印高「二十七石二斗」（郡誌の記載）と正保郷帳の「福王寺領三石」の関係の精査&#34;,&#34;開創者「繁德」・中興「大鯨」に関する龍泉院側の記録の確認&#34;,&#34;現在の本尊・伽藍の現況確認（郡誌記載は1921年時点）&#34;,&#34;曹洞禅ナビの由緒・本尊欄が空欄のため、磐田市誌等の地域資料で由緒を調査する&#34;,&#34;年中行事・永代供養・護持会等の情報は曹洞禅ナビ含め見つからず。現地掲示・檀家への聞き取りでの確認が必要&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;同名寺院との区別&#34;,&#34;body&#34;:&#34;磐田市内には福王寺を名乗る曹洞宗寺院が2か寺あります。本寺院は森本287に所在する福王寺です。一方、城之崎4丁目の福王寺は山号を風祭山といい、安倍晴明の風鎮めの伝承や遠州三十三観音霊場第18番札所として知られる別の寺院です。安倍晴明伝承や今川範国墓所などの情報は城之崎の福王寺に関するものであり、森本の福王寺の沿革を伝える公開Web情報は現時点では確認できていません。&#34;},{&#34;heading&#34;:&#34;『静岡県磐田郡誌』にみえる由緒&#34;,&#34;body&#34;:&#34;大正10年（1921年）刊の『静岡県磐田郡誌』は、当寺を「福王寺（井通村）」として立項し、「井通村森本字宮東に在り。慈現山と號す。駿河國安倍郡井川村龍泉院の末寺にして、本尊は十一面觀世音菩薩なり。當寺は弘治年間の開創にして、最初は臨濟宗に屬し、繁德といふ者之れを開創したりしが、後龍泉寺第五世大鯨此の地に來りて敎化し、文祿二年二月十二日、曹洞宗に改め、法地格に列することゝなれり。慶長六年二月十一日、先規に任せ黑印高三石を賜はりしが、慶安元年二月二十四日、朱印高二十七石二斗となり、幷寺中門前・山林・竹木・諸役を免除せらる」と記しています。戦国期に臨済宗寺院として始まり、文禄2年（1593年）に曹洞宗へ転じた寺で、本寺が駿河の山間・井川（現静岡市葵区）の龍泉院である点が特徴です。&#34;},{&#34;heading&#34;:&#34;江戸期の寺領と末寺&#34;,&#34;body&#34;:&#34;『日本歴史地名大系』（平凡社）の森本村の項には、正保郷帳の寺社領として「福王寺領三石」がみえ、『磐田郡誌』の慶長6年黒印高3石と対応します（同誌は慶安元年＝1648年に朱印高27石2斗となったと記しますが、この石高の典拠は未確認です）。また同項によると森本村は古くは押切村と称し、寛文〜延宝期（1661〜1681年）に森本村と改称されました。『磐田郡誌』には旧十束村域（現磐田市南西部）の養福寺（下本郷）・自清庵（上本郷）・幸勝院（赤池）などが「森本福王寺の末」として立項されており、福王寺が複数の末寺・庵を擁する寺院であったことがわかります。大正2年（1913年）刊『曹洞宗寺院名鑒』の磐田郡の部にも寺名がみえます。&#34;}],&#34;founded_period&#34;:&#34;弘治年間（1555〜1558年）開創、文禄2年（1593年）曹洞宗に改宗（『静岡県磐田郡誌』による）&#34;,&#34;cultural_assets&#34;:[],&#34;danka_info&#34;:{}},{&#34;temple_id&#34;:&#34;iwata-0103&#34;,&#34;slug&#34;:&#34;rinshoji-kodateno&#34;,&#34;name&#34;:&#34;林昌寺&#34;,&#34;name_kana&#34;:&#34;りんしょうじ&#34;,&#34;aliases&#34;:[],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市小立野241番地の1&#34;,&#34;district_id&#34;:&#34;toyoda&#34;,&#34;area&#34;:&#34;豊田&#34;,&#34;main_deity&#34;:&#34;未確認&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;公開情報調査済み&#34;,&#34;history_summary&#34;:&#34;林昌寺は磐田市小立野にある曹洞宗の寺院です。同寺が所蔵する木造薬師三尊仏は安土桃山時代（戦国時代末）の製作で、平成17年（2005年）11月21日に磐田市指定文化財（彫刻）に指定されています。磐田市はこの像を、寺がもと真言宗であった歴史を伝える資料と位置づけています。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9366&#34;},{&#34;title&#34;:&#34;市指定文化財｜磐田市公式ウェブサイト&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;木造薬師三尊仏（彫刻・平成17年11月21日指定・安土桃山時代・所在地小立野・所有者林昌寺）。解説「戦国時代末の製作で、保存状態が良好。寺が元真言宗であった歴史を伝える資料である」を本文で確認。&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/sports_midokoro/bunkazai/bunkazainitsuite/1002039.html&#34;},{&#34;title&#34;:&#34;静岡県磐田市の寺院・御堂一覧（サーチ寺院）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;磐田市小立野241-1・曹洞宗の林昌寺の登載を確認。岐阜県恵那市・群馬県中之条町等の同名寺院とは別。&#34;,&#34;url&#34;:&#34;https://www.bukyou.com/BukyBukyou/TBukyou22/C22CNo211Detail.html&#34;},{&#34;title&#34;:&#34;ニッポンの霊場 遠江四十九薬師霊場&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;第6番＝士石山林昌寺（曹洞宗・磐田市小立野）を確認。寺名・宗派・町名がDBと一致。&#34;,&#34;url&#34;:&#34;https://nippon-reijo.jimdofree.com/%E6%8E%B2%E8%BC%89%E9%9C%8A%E5%A0%B4%E3%81%AE%E4%B8%80%E8%A6%A7/%E8%96%AC%E5%B8%AB%E9%9C%8A%E5%A0%B4/%E9%81%A0%E6%B1%9F%E5%9B%9B%E5%8D%81%E4%B9%9D%E8%96%AC%E5%B8%AB%E9%9C%8A%E5%A0%B4/&#34;},{&#34;title&#34;:&#34;曹洞禅ナビ 寺院検索「林昌寺」&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;住所（磐田市小立野241-1）・フリガナ（リンショウジ）を照合し当該寺院と確認。掲載は基本情報のみで、由緒・本尊・行事欄は空欄&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220967.html&#34;}],&#34;research_todos&#34;:[&#34;『磐田市誌』等で真言宗から曹洞宗への改宗時期・経緯を確認する&#34;,&#34;山号・本尊（薬師三尊が本尊かどうか）を寺院または宗門資料で確認する&#34;,&#34;木造薬師三尊仏の公開状況（拝観可否・開帳日）を確認する&#34;,&#34;遠江四十九薬師霊場との関係の有無を札所資料で確認する&#34;,&#34;現地で境内の石造物・棟札等を確認する&#34;,&#34;曹洞禅ナビの由緒・本尊欄が空欄のため、磐田市誌等の地域資料で由緒を調査する&#34;],&#34;heritage_status&#34;:&#34;磐田市指定文化財あり（木造薬師三尊仏）&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;元真言宗の歴史を伝える薬師三尊&#34;,&#34;body&#34;:&#34;磐田市公式ウェブサイトの市指定文化財一覧によると、林昌寺所有の木造薬師三尊仏は安土桃山時代の製作で、戦国時代末の作ながら保存状態が良好とされています。市の解説では、この像は寺がもと真言宗であった歴史を伝える資料であると記されています。すなわち林昌寺は、現在は曹洞宗ですが、かつて真言宗寺院であった時期があると市の文化財解説から読み取れます。改宗の時期や経緯を伝える公開Web情報は現時点では確認できていません。&#34;},{&#34;heading&#34;:&#34;文化財資料からの補足&#34;,&#34;body&#34;:&#34;林昌寺が所蔵する木造薬師三尊仏は戦国時代末（安土桃山時代）の製作で保存状態が良く、同寺がもと真言宗であった歴史を伝える資料として磐田市指定有形文化財（彫刻）に指定されています。&#34;}],&#34;cultural_assets&#34;:[{&#34;name&#34;:&#34;木造薬師三尊仏&#34;,&#34;designation&#34;:&#34;磐田市指定文化財（彫刻・平成17年11月21日指定）&#34;,&#34;summary&#34;:&#34;安土桃山時代（戦国時代末）の製作で、保存状態が良好とされます。磐田市の解説では、林昌寺がもと真言宗であった歴史を伝える資料と位置づけられています。&#34;}],&#34;pilgrimage_note&#34;:&#34;遠江四十九薬師霊場第6番札所&#34;},{&#34;temple_id&#34;:&#34;iwata-0104&#34;,&#34;slug&#34;:&#34;kotokuji-morishita&#34;,&#34;name&#34;:&#34;興徳寺&#34;,&#34;name_kana&#34;:&#34;こうとくじ&#34;,&#34;aliases&#34;:[&#34;長松山&#34;,&#34;岡本山弘徳寺&#34;,&#34;光得寺&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市森下612番地&#34;,&#34;district_id&#34;:&#34;toyoda&#34;,&#34;area&#34;:&#34;豊田&#34;,&#34;main_deity&#34;:&#34;虚空蔵菩薩（『静岡県磐田郡誌』・現地探訪記事による）&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;興徳寺は磐田市森下にある曹洞宗の寺院で、山号は長松山、本尊は虚空蔵菩薩です。『静岡県磐田郡誌』（1921年）によると建久年間（1190〜1199年）の草創と伝え、初めは真言宗の岡本山弘徳寺と号しましたが、慶長4年（1599年）3月9日に見付の金剛寺2世によって長松山興徳寺と改められ、法地格の曹洞宗寺院となりました。現地探訪記事では遠州六地蔵の札所として紹介されています。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9368&#34;},{&#34;title&#34;:&#34;興徳寺 - 曹洞禅ナビ（曹洞宗公式寺院ポータル）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;磐田市森下612の曹洞宗寺院として登載されていることを本文で確認。由緒の記載はなし。&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220958.html&#34;},{&#34;title&#34;:&#34;静岡県磐田市の寺院・御堂一覧（サーチ寺院）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;磐田市森下612・曹洞宗の興徳寺の登載を確認。&#34;,&#34;url&#34;:&#34;https://www.bukyou.com/BukyBukyou/TBukyou22/C22CNo211Detail.html&#34;},{&#34;title&#34;:&#34;『静岡県磐田郡誌』静岡県磐田郡編（1921年）第13章 神社及宗教・寺院の部「126 興徳寺（井通村）」p.698&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション（コマ458）。原本画像で由緒全文を確認&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/info:ndljp/pid/965680&#34;},{&#34;title&#34;:&#34;コトバンク「森下村」（日本歴史地名大系）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;建久年間創建伝承、「光得寺（現興徳寺）領一石」の記載&#34;,&#34;url&#34;:&#34;https://kotobank.jp/word/森下村&#34;},{&#34;title&#34;:&#34;駿遠路気まぐれブログ「遠州六地蔵の興徳寺 in 磐田市」（2016年）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;伽藍の再建史・遠州六地蔵・境内の様子&#34;,&#34;url&#34;:&#34;https://ameblo.jp/life-7g1k/entry-12156090872.html&#34;}],&#34;research_todos&#34;:[&#34;『豊田町誌』『磐田市誌』で興徳寺の山号・本尊・創建年代を確認する&#34;,&#34;本寺と末寺関係を宗門資料で確認する&#34;,&#34;現地で本堂・石造物・掲示の由緒書を確認する&#34;,&#34;地元自治会・豊田地区の郷土資料での言及を探す&#34;,&#34;遠州六地蔵霊場の構成寺院・札所番号の一次資料確認&#34;,&#34;郡誌にみえる金剛寺2世の僧名（活字では「開岩久田」）の正確な表記の確認&#34;,&#34;前身「岡本山弘徳寺」の旧地（森下の字寺之越と岡本の関係）の確認&#34;,&#34;曹洞禅ナビの由緒・本尊欄が空欄のため、磐田市誌等の地域資料で由緒を調査する&#34;,&#34;年中行事・永代供養・護持会等の情報は見つからず。現地掲示・檀家への聞き取りでの確認が必要&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;調査状況&#34;,&#34;body&#34;:&#34;曹洞宗公式の曹洞禅ナビおよび複数の寺院データベースで、磐田市森下612に所在する曹洞宗寺院であることが確認できます。一方、山号・本尊・創建年代など沿革を伝える公開Web情報は現時点では確認できていません。会津若松市・大阪市・瑞浪市などに同名の興徳寺がありますが、いずれも別の寺院です。&#34;},{&#34;heading&#34;:&#34;『静岡県磐田郡誌』にみえる由緒&#34;,&#34;body&#34;:&#34;大正10年（1921年）刊の『静岡県磐田郡誌』は、当寺を「興徳寺（井通村）」として立項し、「井通村森下字寺之越に在り。長松山と號す。見付町金剛寺の末寺にして、本尊は虚空藏菩薩なり。當山は、建久年度の草創にして、初は岡本山弘德寺と號し、眞言宗なりしが、慶長四年三月九日、金剛寺第二世開岩久田山號を長松山興德寺と改め、法地格となせり」と記しています。鎌倉時代初頭にさかのぼる草創伝承を持ち、戦国末〜江戸初頭に見付の金剛寺（曹洞宗）の末寺となって改宗した寺です。『日本歴史地名大系』の森下村の項にも「曹洞宗興徳寺は建久年間（1190-99）の創建と伝える」とあり、江戸期の寺領として「光得寺（現興徳寺）領一石」がみえます（寺名の表記は資料により光得寺とも記されます）。&#34;},{&#34;heading&#34;:&#34;末寺と近世以降の伽藍&#34;,&#34;body&#34;:&#34;『磐田郡誌』には、上万能の長福寺（万能山・本尊正観世音菩薩）が「森下興徳寺の末寺」として立項され、寛文11年（1671年）に興徳寺2世を分派開山としたと記されており、興徳寺が末寺を持つ寺格であったことがわかります。現地を訪ねた個人の探訪記事（2016年）は、寺伝として慶長9〜10年（1604〜1605年）に本堂・伽藍が建立され、安政の大地震（1854年）で倒壊した後、文久3年（1863年）に再建、平成23年（2011年）に本堂・位牌堂が新築されたと紹介しています。同記事によると入口に六地蔵が並び、本堂には山号額と龍の彫物があります。&#34;},{&#34;heading&#34;:&#34;遠州六地蔵の札所&#34;,&#34;body&#34;:&#34;現地探訪記事では、興徳寺は遠州六地蔵の札所（札所本尊は地蔵菩薩）として紹介されており、遠州六地蔵霊場の全体像を伝える公式の一次資料は現時点では確認できておらず、札所番号等の詳細は今後の確認課題です。なお会津若松市・大阪市・瑞浪市などに同名の興徳寺がありますが、いずれも別の寺院です。&#34;}],&#34;founded_period&#34;:&#34;建久年間（1190〜1199年）草創と伝わる（初め真言宗岡本山弘徳寺）。慶長4年（1599年）曹洞宗に改宗&#34;,&#34;cultural_assets&#34;:[],&#34;pilgrimage_note&#34;:&#34;遠州六地蔵札所（個人探訪記事による。札所番号は未確認）&#34;,&#34;danka_info&#34;:{}},{&#34;temple_id&#34;:&#34;iwata-0105&#34;,&#34;slug&#34;:&#34;yofukuji-shimohongo&#34;,&#34;name&#34;:&#34;養福寺&#34;,&#34;name_kana&#34;:&#34;ようふくじ&#34;,&#34;aliases&#34;:[&#34;龍祥山&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市下本郷1363番地の1&#34;,&#34;district_id&#34;:&#34;toyoda&#34;,&#34;area&#34;:&#34;豊田&#34;,&#34;main_deity&#34;:&#34;阿弥陀如来&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;公開情報調査済み&#34;,&#34;history_summary&#34;:&#34;養福寺は磐田市下本郷にある曹洞宗の寺院で、山号は龍祥山、本尊は阿弥陀如来です。慶長4年（1599年）に阿弥陀如来を祀る小さな庵室として始まり、享保9年（1724年）に同地に本寺が建立されたと伝えられます。江戸後期に火災や安政東海地震による倒壊などの災厄を重ねながら、そのたびに再建されてきました。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-12&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9370&#34;},{&#34;title&#34;:&#34;養福寺 (磐田市) - Wikipedia&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;山号龍祥山・本尊阿弥陀如来・慶長4年（1599年）庵室起源・享保9年（1724年）建立・文化元年と文化13年の火災・安政東海地震での倒壊・東海道の通行人への勧募による再建・2014年10月5日本堂位牌堂新築落慶法要を本文で確認。&#34;,&#34;url&#34;:&#34;https://ja.wikipedia.org/wiki/養福寺_(磐田市)&#34;},{&#34;title&#34;:&#34;養福寺 - 曹洞禅ナビ（曹洞宗公式寺院ポータル）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;磐田市下本郷の曹洞宗寺院としての登載（検索結果で確認）。&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220923.html&#34;},{&#34;title&#34;:&#34;磐田市(静岡県)の寺院墓地｜寺院墓地.com&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;「曹洞宗 龍祥山 養福寺」磐田市下本郷1363-1の掲載を本文で確認。山号表記の傍証。&#34;,&#34;url&#34;:&#34;https://www.jiin-bochi.com/area/shizuoka-22211.html&#34;},{&#34;title&#34;:&#34;養福寺 - 曹洞禅ナビー寺院検索（沿革・年間行事）&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;寺院自身が登録する公式ポータルページ。年間行事・由緒を記載&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/article_220923_1.html&#34;},{&#34;title&#34;:&#34;養福寺 - 曹洞禅ナビー寺院検索（お役立ち）&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;永代供養塔・動物供養墓の案内を記載&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/article_220923_4.html&#34;},{&#34;title&#34;:&#34;養福寺 公式ホームページ&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;曹洞禅ナビに登録された公式サイトURL（今回は直接閲覧不可のためURL記録のみ）&#34;,&#34;url&#34;:&#34;http://youfukuji.web.fc2.com/&#34;}],&#34;research_todos&#34;:[&#34;Wikipedia記事の典拠（『磐田市誌』等）を確認し、慶長4年起源説の出典を裏取りする&#34;,&#34;開山・開基の僧名を宗門資料で確認する&#34;,&#34;安政東海地震後の再建年代を確認する&#34;,&#34;坐禅会など現行行事の開催状況を寺院に確認する&#34;,&#34;既存情報の「慶長4年（1599年）庵室として開創」と曹洞禅ナビの「1724年に開かれた」の関係（庵室草創と本寺建立の区別）を寺伝・地域資料で確認する&#34;,&#34;公式サイト（fc2.com）は環境上直接閲覧できなかったため、駐車場情報・護持会の有無は現地または電話での追加確認が望ましい&#34;],&#34;founded_period&#34;:&#34;享保9年（1724年）に開かれた（曹洞禅ナビの公式紹介文に「1724年に開かれた」と明記）&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;創建と沿革&#34;,&#34;body&#34;:&#34;日本語版Wikipediaの記事によると、養福寺の起源は慶長4年（1599年）に遡り、当初は阿弥陀如来を祀る小さな庵室でした。享保9年（1724年）に同地に本寺が建立されたと記されています。その後、文化元年（1804年）に火災に遭い、文化13年（1816年）には再び全焼、さらに安政元年（1854年）の安政東海地震では倒壊しました。住職と村人たちが協力し、東海道を通りかかった人々にも寄付を募って再建にこぎつけたと伝えられています。&#34;},{&#34;heading&#34;:&#34;現代の伽藍&#34;,&#34;body&#34;:&#34;平成26年（2014年）10月5日には本堂と位牌堂の新築落慶法要が行われました。現在は坐禅会が開かれるほか、永代供養墓やペット霊園なども設けられています。墓地情報サイトでも「曹洞宗 龍祥山 養福寺」として紹介されています。&#34;},{&#34;heading&#34;:&#34;境内の不動明王像と稲荷社&#34;,&#34;body&#34;:&#34;境内には古くから伝わる不動明王像が安置されているほか、伏見稲荷大明神をまつる稲荷社が建立されています。曹洞宗の本山は福井県の永平寺と神奈川県の總持寺で、養福寺もこの両大本山に連なる寺院です。&#34;},{&#34;heading&#34;:&#34;開かれた寺づくりの活動&#34;,&#34;body&#34;:&#34;幅広い世代が参拝できるよう、毎月1回の坐禅会（初心者対象）をはじめ、写経会・文化講演会・ベビーマッサージ（タッチケア）などが開催されています。仏前結婚式や祈祷、悩み相談にも応じており、地域に開かれた寺院活動を続けています。&#34;}],&#34;danka_info&#34;:{&#34;annual_events&#34;:[{&#34;name&#34;:&#34;年中行事&#34;,&#34;timing&#34;:&#34;&#34;,&#34;note&#34;:&#34;毎月1回の坐禅会（初心者対象）、写経会、文化講演会、ベビーマッサージ（タッチケア）&#34;},{&#34;name&#34;:&#34;降誕会&#34;,&#34;timing&#34;:&#34;4月8日&#34;,&#34;note&#34;:&#34;お釈迦様の誕生を祝う法要。甘茶をかけ誕生仏に参拝。寺院公式情報（曹洞禅ナビ掲載）による&#34;},{&#34;name&#34;:&#34;山門大施食会（盂蘭盆会）&#34;,&#34;timing&#34;:&#34;8月11日午前7時&#34;,&#34;note&#34;:&#34;お盆の大法要。檀信徒が参列すると案内されている。寺院公式情報による&#34;},{&#34;name&#34;:&#34;両祖忌&#34;,&#34;timing&#34;:&#34;9月29日&#34;,&#34;note&#34;:&#34;道元禅師・瑩山禅師の命日法要。寺院公式情報による&#34;},{&#34;name&#34;:&#34;達磨忌&#34;,&#34;timing&#34;:&#34;10月5日&#34;,&#34;note&#34;:&#34;達磨大師の命日法要。寺院公式情報による&#34;},{&#34;name&#34;:&#34;成道会&#34;,&#34;timing&#34;:&#34;12月8日&#34;,&#34;note&#34;:&#34;お釈迦様が悟りを開いた日を記念する法要。寺院公式情報による&#34;}],&#34;official_site&#34;:{&#34;status&#34;:&#34;あり&#34;,&#34;url&#34;:&#34;http://youfukuji.web.fc2.com/&#34;,&#34;checked_at&#34;:&#34;2026-07-12&#34;},&#34;cemetery&#34;:&#34;本堂隣接の墓地のほか、様々な事情でお墓を持てない方のための永代供養塔（観音様を奉安）、動物供養墓（ペット供養墓）がある。朝の勤行やお盆に檀信徒・永代供養利用者への読経供養を行っている。寺院公式情報（曹洞禅ナビ）による&#34;,&#34;organization&#34;:&#34;「檀信徒」という語で檀家層への言及があるが、護持会・世話人会等の名称を持つ組織についての公開情報は確認できなかった&#34;,&#34;community_role&#34;:&#34;現住職は長年高校教師を務めた経歴を持ち、坐禅会・写経会・文化講演会・ベビーマッサージ（タッチケア）など幅広い世代向けの活動を通じて「地域の皆さんに愛されるお寺」を目指すと公式サイトで述べている&#34;}},{&#34;temple_id&#34;:&#34;iwata-0106&#34;,&#34;slug&#34;:&#34;myohoji-ikeda&#34;,&#34;name&#34;:&#34;妙法寺&#34;,&#34;name_kana&#34;:&#34;みょうほうじ&#34;,&#34;aliases&#34;:[&#34;瑞雲山&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市池田743番地&#34;,&#34;district_id&#34;:&#34;toyoda&#34;,&#34;area&#34;:&#34;豊田&#34;,&#34;main_deity&#34;:&#34;薬師如来&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;現地写真あり&#34;,&#34;detail_status&#34;:&#34;公開情報調査済み&#34;,&#34;history_summary&#34;:&#34;妙法寺は磐田市池田にある曹洞宗の寺院で、山号は瑞雲山、本尊は薬師如来です。池田まちづくり協議会の資料によると、応永19年（1412年）に日蓮宗の寺として草創され、慶長7年（1602年）に曹洞宗に改宗して現在に至ります。新四国八十八ヵ所第14番など複数の札所を兼ねています。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-12&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9372&#34;},{&#34;title&#34;:&#34;【3】妙法寺｜池田まちづくり協議会&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;「瑞雲山妙法寺は、応永19年（1412年）に日蓮宗として草創。慶長七年（1602年）に曹洞宗に改宗し現在に至る。本尊は薬師如来」「新四国八十八ヵ所第十四番札所、遠江四十九薬師めぐり第七番札所、観世音菩薩三十三所霊場第十番」を本文で確認。&#34;,&#34;url&#34;:&#34;https://ikeda-uk.jp/e6037668.html&#34;},{&#34;title&#34;:&#34;妙法寺 - 曹洞禅ナビ（曹洞宗公式寺院ポータル）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;磐田市池田743の曹洞宗寺院としての登載を本文で確認。&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220963.html&#34;},{&#34;title&#34;:&#34;池田 (磐田市) - Wikipedia&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;池田地区の施設として妙法寺・誓渡院が挙げられていること、池田が徳川家康から天竜川渡船の朱印状を与えられ渡船場として賑わったことを確認。&#34;,&#34;url&#34;:&#34;https://ja.wikipedia.org/wiki/%E6%B1%A0%E7%94%B0_(%E7%A3%90%E7%94%B0%E5%B8%82)&#34;},{&#34;title&#34;:&#34;ニッポンの霊場 遠江四十九薬師霊場&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;第7番＝瑞雲山妙法寺（曹洞宗・池田・御本尊薬師如来）を確認（既存注記どおり）。&#34;,&#34;url&#34;:&#34;https://nippon-reijo.jimdofree.com/%E6%8E%B2%E8%BC%89%E9%9C%8A%E5%A0%B4%E3%81%AE%E4%B8%80%E8%A6%A7/%E8%96%AC%E5%B8%AB%E9%9C%8A%E5%A0%B4/%E9%81%A0%E6%B1%9F%E5%9B%9B%E5%8D%81%E4%B9%9D%E8%96%AC%E5%B8%AB%E9%9C%8A%E5%A0%B4/&#34;},{&#34;title&#34;:&#34;ニッポンの霊場 磐田郡三十三観音霊場&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;第10番＝瑞雲山妙法寺（池田743）を確認。既存注記の「観世音菩薩三十三所霊場第10番（池田まちづくり協議会資料）」は、番号が一致するため磐田郡三十三観音霊場第10番を指すとみられる。新四国八十八ヵ所第14番は既存注記（池田まちづくり協議会資料）を踏襲。&#34;,&#34;url&#34;:&#34;https://nippon-reijo.jimdofree.com/%E6%8E%B2%E8%BC%89%E9%9C%8A%E5%A0%B4%E3%81%AE%E4%B8%80%E8%A6%A7/%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/%E7%A3%90%E7%94%B0%E9%83%A1%E4%B8%89%E5%8D%81%E4%B8%89%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/&#34;}],&#34;research_todos&#34;:[&#34;応永19年草創・慶長7年改宗の典拠（『磐田市誌』等の郷土史料）を確認する&#34;,&#34;日蓮宗から曹洞宗への改宗の経緯を調べる&#34;,&#34;境内の地蔵尊・稲荷堂の由来を現地確認する&#34;,&#34;曹洞禅ナビの由緒欄が空欄のため、日蓮宗からの改宗伝承等の既存情報は他資料での裏付けを継続する&#34;,&#34;年中行事・永代供養・護持会等の情報は見つからず。地元の池田まちづくり協議会や現地掲示での確認が必要&#34;],&#34;founded_period&#34;:&#34;応永19年（1412年）に日蓮宗寺院として草創、慶長7年（1602年）に曹洞宗へ改宗と伝わる&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;創建と改宗&#34;,&#34;body&#34;:&#34;天竜川左岸の池田地区の歴史をまとめた池田まちづくり協議会の資料には、瑞雲山妙法寺は応永19年（1412年）に日蓮宗として草創され、慶長7年（1602年）に曹洞宗に改宗して現在に至ると記されています。寺号の「妙法寺」は日蓮宗寺院に多い名称であり、草創時の宗旨の名残と考えられますが、改宗の経緯を伝える資料は現時点では確認できていません。本尊は薬師如来で、境内には地蔵尊や稲荷堂があると同資料に記されています。&#34;},{&#34;heading&#34;:&#34;池田の集落と札所&#34;,&#34;body&#34;:&#34;池田は近世に徳川家康から天竜川渡船の朱印状を与えられ、渡船場として賑わった集落で、妙法寺は誓渡院・行興寺などとともに池田地区の寺院として紹介されています。同協議会の資料によると、妙法寺は新四国八十八ヵ所第14番札所、遠江四十九薬師めぐり第7番札所、観世音菩薩三十三所霊場第10番を兼ねています。&#34;}],&#34;pilgrimage_note&#34;:&#34;遠江四十九薬師霊場第7番札所（札所本尊薬師如来）／磐田郡三十三観音霊場第10番札所／新四国八十八ヵ所第14番札所（池田地区）&#34;,&#34;danka_info&#34;:{}},{&#34;temple_id&#34;:&#34;iwata-0107&#34;,&#34;slug&#34;:&#34;seidoin-ikeda&#34;,&#34;name&#34;:&#34;誓渡院&#34;,&#34;name_kana&#34;:&#34;せいどいん&#34;,&#34;aliases&#34;:[&#34;済縁山&#34;,&#34;誓渡庵&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市池田356番地&#34;,&#34;district_id&#34;:&#34;toyoda&#34;,&#34;area&#34;:&#34;豊田&#34;,&#34;main_deity&#34;:&#34;地蔵菩薩&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;現地写真あり&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;誓渡院は磐田市池田にある曹洞宗の寺院で、山号は済縁山、本尊は地蔵菩薩です。『静岡県磐田郡誌』（1921年）によると永正元年（1504年）8月20日の創立で、当時は誓渡庵と号し、正徳2年（1712年）8月16日に可睡斎18世東州真海を請じて中興開山とし、誓渡院と改称、以後綸旨を拝戴し色衣の着用を許されました。天竜川の渡船場として栄えた池田の集落にあり、本堂には池田渡船の船玉大明神が祀られていると伝わります。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-12&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9374&#34;},{&#34;title&#34;:&#34;【2】誓渡院｜池田まちづくり協議会&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;「済縁山誓渡院は永正元年(1504年)の開創で、当時は誓渡庵と号した。曹洞宗である本尊は地蔵菩薩。本堂には護法拈茎帝釈天、池田渡船船玉大明神を奉っている。新四国八十八ヵ所第五番札所である」を本文で確認。&#34;,&#34;url&#34;:&#34;https://ikeda-uk.jp/e6037674.html&#34;},{&#34;title&#34;:&#34;池田 (磐田市) - Wikipedia&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;池田地区の施設として誓渡院が挙げられていることを確認。&#34;,&#34;url&#34;:&#34;https://ja.wikipedia.org/wiki/%E6%B1%A0%E7%94%B0_(%E7%A3%90%E7%94%B0%E5%B8%82)&#34;},{&#34;title&#34;:&#34;誓渡院｜磐田市池田｜曹洞宗（お寺一覧ナビ）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;磐田市池田356・曹洞宗であることを本文で確認。&#34;,&#34;url&#34;:&#34;https://otera-ichiran.com/otera-shizuokaken-iwatashi107/&#34;},{&#34;title&#34;:&#34;『静岡県磐田郡誌』静岡県磐田郡編（1921年）第13章 神社及宗教・寺院の部「141 誓渡院（池田村）」p.702&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション（コマ460）。原本画像で由緒全文を確認&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/info:ndljp/pid/965680&#34;},{&#34;title&#34;:&#34;『遠江国風土記伝』内山真龍著（郁文舎、1900年）池田村の項&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;可睡斎末・真巌派・寺中除地・末寺観蔵寺の記載&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/info:ndljp/pid/765205&#34;},{&#34;title&#34;:&#34;コトバンク「池田村」（日本歴史地名大系）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;正保郷帳の行興寺領16石・妙法寺領3石&#34;,&#34;url&#34;:&#34;https://kotobank.jp/word/池田村&#34;},{&#34;title&#34;:&#34;曹洞禅ナビ 寺院検索「誓渡院」&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;住所（磐田市池田356）・フリガナ（セイドイン）を照合し当該寺院と確認。掲載は基本情報のみで、由緒・本尊・行事欄は空欄&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220966.html&#34;}],&#34;research_todos&#34;:[&#34;永正元年開創の典拠（『磐田市誌』等）を確認する&#34;,&#34;誓渡庵から誓渡院への改称時期を調べる&#34;,&#34;船玉大明神と池田渡船の関係を郷土史料で確認する&#34;,&#34;本堂に祀られる帝釈天の正確な尊名・由来を現地確認する（資料の表記に不明瞭な箇所あり）&#34;,&#34;末寺であった観蔵寺（『遠江国風土記伝』）のその後（現存か廃寺か）の確認&#34;,&#34;正徳2年の綸旨拝戴・色衣着用許可に関する可睡斎側の記録の確認&#34;,&#34;曹洞禅ナビの由緒欄が空欄のため、永正元年開創伝承等の既存情報は他資料での裏付けを継続する&#34;],&#34;founded_period&#34;:&#34;永正元年（1504年）8月20日創立（当時は誓渡庵と号した。正徳2年（1712年）に誓渡院と改称）&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;開創と池田渡船とのかかわり&#34;,&#34;body&#34;:&#34;池田地区の歴史をまとめた池田まちづくり協議会の資料には、済縁山誓渡院は永正元年（1504年）の開創で、当時は誓渡庵と号したと記されています。本尊は地蔵菩薩です。本堂には護法の帝釈天とともに、池田渡船の船玉大明神が祀られていると同資料に記されており、徳川家康から天竜川渡船の朱印状を与えられ渡船場として賑わった池田の歴史と結びついた寺院であることがうかがえます。同資料によると、新四国八十八ヵ所第5番札所でもあります。&#34;},{&#34;heading&#34;:&#34;『静岡県磐田郡誌』にみえる由緒&#34;,&#34;body&#34;:&#34;大正10年（1921年）刊の『静岡県磐田郡誌』は、当寺を「誓渡院（池田村）」として立項し、「池田村字北浦に在り。濟緣山と號す。周智郡久努西村可睡齋の末寺にして、本尊は地藏菩薩なり。永正元年甲子八月二十日の創立にして、當時は誓渡庵と號せり。後正德二年壬辰八月十六日、可睡齋第十八世東州眞海を請じて中興開山となし、誓渡院と改稱す。それより綸旨拜戴、色衣着用を許さる」と記しています。池田まちづくり協議会の資料が伝える永正元年（1504年）開創・旧称誓渡庵という沿革は、この郡誌の記載と一致し、加えて正徳2年（1712年）の中興と院号への改称、綸旨拝戴の寺格が確認できます。&#34;},{&#34;heading&#34;:&#34;『遠江国風土記伝』と江戸期の池田村&#34;,&#34;body&#34;:&#34;江戸中期の地誌『遠江国風土記伝』（内山真龍著）の池田村の項には、誓渡院は「（寺中除地）曹洞宗可睡齋末、眞巖派」で末寺1宇を有すとみえ、その末寺として「觀藏寺、曹洞宗誓渡院末」が挙げられています。正保郷帳に基づく『日本歴史地名大系』の池田村の項では、朱印寺領として行興寺領16石・妙法寺領3石がみえ、誓渡院の境内地は除地（年貢免除地）として扱われていたことが風土記伝からうかがえます。また同じ池田村には可睡斎末の曹洞宗寺院として瑞雲山妙法寺（応永19年＝1412年草創、慶長7年＝1602年に可睡斎14世恵策により中興）があり、誓渡院とともに東海道池田渡の集落の曹洞宗寺院群を構成していました。大正2年（1913年）刊『曹洞宗寺院名鑒』の磐田郡の部にも誓渡院の名がみえます。&#34;}],&#34;pilgrimage_note&#34;:&#34;新四国八十八ヵ所第5番札所（池田まちづくり協議会資料による）&#34;,&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0108&#34;,&#34;slug&#34;:&#34;daienji-kamo&#34;,&#34;name&#34;:&#34;大圓寺&#34;,&#34;name_kana&#34;:&#34;だいえんじ&#34;,&#34;aliases&#34;:[&#34;久松山&#34;,&#34;大円寺&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市加茂123番地&#34;,&#34;district_id&#34;:&#34;toyoda&#34;,&#34;area&#34;:&#34;豊田&#34;,&#34;main_deity&#34;:&#34;未確認&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;現地写真あり&#34;,&#34;detail_status&#34;:&#34;公開情報調査済み&#34;,&#34;history_summary&#34;:&#34;大圓寺（大円寺）は磐田市加茂にある曹洞宗の寺院で、山号は久松山です。起源は神亀3年（726年）と伝えられ、寛永15年（1638年）に現在の寺号に改められました。寺谷用水を開いた平野重定の墓所であり、市指定文化財の豊臣秀吉朱印状を所蔵しています。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-12&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9376&#34;},{&#34;title&#34;:&#34;市指定文化財｜磐田市公式ウェブサイト&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;豊臣秀吉朱印状（古文書・平成17年11月21日指定・安土桃山時代・所在地加茂・所有者大円寺）「天正17年12月、小田原攻めに先立ち各地に出された禁制文書」を本文で確認（市ページの年表記「15989」は1589年の誤植とみられる）。&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/sports_midokoro/bunkazai/bunkazainitsuite/1002039.html&#34;},{&#34;title&#34;:&#34;寺谷用水の歩み｜寺谷用水土地改良区&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;1588年（天正16年）大圦樋建設、1590年大井堀12km完成、1624年（寛永元年）平野重定没・「久松山大円寺に葬る」、毎年10月8日の例祭を本文で確認。&#34;,&#34;url&#34;:&#34;https://teradani.com/about/history/&#34;},{&#34;title&#34;:&#34;大円寺｜じゃらんnet観光ガイド&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;「起源は神亀3年(726)といわれ、天慶5年（942)円光寺が再建、臥竜山大淵寺と命名された。その寺跡は賀茂神社に近い台地の西縁と伝えられる。寺谷用水開祖、平野重定公を開基に推戴し、平野家二代重政・大円寺五世久岩全良が寛永15年（1638)に久松山大円寺に改め現在に至っている」（所在地：磐田市加茂123）を本文で確認。&#34;,&#34;url&#34;:&#34;https://www.jalan.net/kankou/spt_22211ag2132024689/&#34;},{&#34;title&#34;:&#34;ニッポンの霊場 磐田郡三十三観音霊場&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;第11番＝久松山大円寺（曹洞宗・加茂123）を確認。DBの大圓寺（加茂123）と住所が完全一致。&#34;,&#34;url&#34;:&#34;https://nippon-reijo.jimdofree.com/%E6%8E%B2%E8%BC%89%E9%9C%8A%E5%A0%B4%E3%81%AE%E4%B8%80%E8%A6%A7/%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/%E7%A3%90%E7%94%B0%E9%83%A1%E4%B8%89%E5%8D%81%E4%B8%89%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/&#34;},{&#34;title&#34;:&#34;曹洞禅ナビ 寺院検索「大圓寺」&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;住所（磐田市加茂123）・フリガナ（ダイエンジ）を照合し当該寺院と確認。公式登録表記は旧字の「大圓寺」。掲載は基本情報のみで、由緒・本尊・行事欄は空欄&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220957.html&#34;},{&#34;title&#34;:&#34;磐田市文化財一覧オープンデータ（LinkData・CC BY）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;磐田市公開の文化財一覧オープンデータ。名称・よみ・所在地により寺院と文化財の対応を照合&#34;,&#34;url&#34;:&#34;http://linkdata.org/work/rdf1s10219i&#34;}],&#34;research_todos&#34;:[&#34;神亀3年起源・臥竜山大淵寺の伝承の典拠（『磐田市誌』等）を確認する&#34;,&#34;本尊を寺院または宗門資料で確認する&#34;,&#34;豊臣秀吉朱印状の宛所・内容の詳細を市文化財課の資料で確認する&#34;,&#34;平野重定の墓の形態と市指定史跡等の指定有無を確認する&#34;,&#34;毎年10月8日の平野重定追悼例祭の現況を確認する&#34;,&#34;曹洞禅ナビの由緒欄が空欄のため、神亀3年起源伝承等の既存情報は他資料での裏付けを継続する&#34;,&#34;要確認（文化財DB照合）: address: 磐田市の文化財台帳では所有者表記は「大円寺」（台帳寺名「大圓寺」の新字体）。&#34;,&#34;寺院独自の公式サイト・SNSの有無、永代供養・護持会の有無は未確認。現地または電話での追加確認が望ましい&#34;],&#34;founded_period&#34;:&#34;起源は神亀3年（726年）と伝わり、寛永15年（1638年）に久松山大円寺と改めた&#34;,&#34;heritage_status&#34;:&#34;磐田市指定文化財あり（豊臣秀吉朱印状）&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;創建と寺号の変遷&#34;,&#34;body&#34;:&#34;観光情報サイトじゃらんnetの解説によると、大円寺の起源は神亀3年（726年）といわれ、天慶5年（942年）に円光寺が再建されて臥竜山大淵寺と命名されたと伝えられます。その寺跡は賀茂神社に近い台地の西縁と伝えられています。その後、寺谷用水の開祖である平野重定を開基に推戴し、平野家二代重政と大円寺五世久岩全良が寛永15年（1638年）に久松山大円寺と改めて現在に至ると記されています。&#34;},{&#34;heading&#34;:&#34;寺谷用水開祖・平野重定の墓所&#34;,&#34;body&#34;:&#34;寺谷用水土地改良区の沿革資料によると、平野重定は天正16年（1588年）に寺谷村地先に大圦樋（取入口）を建設し、天正18年（1590年）には寺谷から浜部村までの大井堀（用水路）約12キロメートルを完成させました。重定は寛永元年（1624年）に没し、久松山大円寺に葬られたと同資料に記されています。毎年10月8日には命日を追悼する例祭が同寺で執り行われています。寺谷用水は徳川家康の時代から磐田原台地西側の米づくりを支えてきた用水です。&#34;},{&#34;heading&#34;:&#34;文化財資料からの補足&#34;,&#34;body&#34;:&#34;大圓寺は、天正17年（1589年）12月に豊臣秀吉が小田原攻めに先立ち各地へ出した禁制文書「豊臣秀吉朱印状」を所蔵しています。磐田市指定有形文化財（古文書）です。 江戸時代中期頃の加茂東十王堂十王像群を所有し、十王信仰に関わる像が全て揃っている点が重要とされ、磐田市指定有形民俗文化財になっています。 磐田市指定無形民俗文化財の「加茂大念仏」は、大圓寺の寺施餓鬼の夜から始まり初盆の家々を回る民俗芸能で、戦後に復興されました。&#34;}],&#34;cultural_assets&#34;:[{&#34;name&#34;:&#34;豊臣秀吉朱印状&#34;,&#34;designation&#34;:&#34;磐田市指定文化財（古文書・平成17年11月21日指定）&#34;,&#34;summary&#34;:&#34;安土桃山時代の古文書で、磐田市の解説によると天正17年（1589年）12月に小田原攻めに先立ち各地に出された禁制文書です。歴史史料として貴重とされています。&#34;},{&#34;name&#34;:&#34;加茂東十王堂十王像群&#34;,&#34;designation&#34;:&#34;磐田市指定文化財（有形民俗文化財）&#34;,&#34;summary&#34;:&#34;江戸時代の十王像群で、大円寺が所有します。加茂東の十王堂に安置されてきた冥界の十王をかたどった像です。&#34;}],&#34;pilgrimage_note&#34;:&#34;磐田郡三十三観音霊場第11番札所&#34;,&#34;danka_info&#34;:{&#34;community_role&#34;:&#34;当寺は寺谷用水（世界かんがい施設遺産）を天正16年（1588年）に開削した代官・平野重定の墓所であり、命日にあたる毎年10月8日に「用水祭」（例祭）が営まれている。寺谷用水土地改良区の役員・総代、県・磐田市の関係者等が参列し、用水開発に貢献した先人を偲ぶ供養が行われる。2023年（令和5年）10月には「平野重定公400年祭」が営まれた。寺谷用水土地改良区公式サイトによる&#34;}},{&#34;temple_id&#34;:&#34;iwata-0109&#34;,&#34;slug&#34;:&#34;daizoji-tomei&#34;,&#34;name&#34;:&#34;大蔵寺&#34;,&#34;name_kana&#34;:&#34;だいぞうじ&#34;,&#34;aliases&#34;:[&#34;福寿山大蔵寺&#34;,&#34;大藏寺&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市東名393番地&#34;,&#34;district_id&#34;:&#34;toyoda&#34;,&#34;area&#34;:&#34;豊田&#34;,&#34;main_deity&#34;:&#34;観世音菩薩（『静岡県磐田郡誌』による）&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;大蔵寺は磐田市東名にある曹洞宗の寺院で、山号は福寿山です。大正10年（1921年）刊行の『静岡県磐田郡誌』には、富岡村匂坂中之郷字蔵西（現在の東名にあたる地）に所在し、岩田村の増参寺の末寺、本尊は観世音菩薩で、明応6年（1497年）9月に増参寺第6世恵慶の開創と記されています。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9378&#34;},{&#34;title&#34;:&#34;静岡県磐田市の寺院・御堂一覧（サーチ寺院）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;磐田市東名393・曹洞宗の大蔵寺の登載を本文で確認。それ以外の由緒情報は見つからなかった。&#34;,&#34;url&#34;:&#34;https://www.bukyou.com/BukyBukyou/TBukyou22/C22CNo211Detail.html&#34;},{&#34;title&#34;:&#34;『静岡県磐田郡誌』静岡県磐田郡教育会編（大正10年・1921年）第13章 神社及宗教 曹洞宗寺院の項（152 大蔵寺）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション（インターネット公開）。461コマ目の本文画像で由緒全文を確認。増参寺の由緒は462コマ目。&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680/1/461&#34;},{&#34;title&#34;:&#34;コトバンク「匂坂中之郷村」（日本歴史地名大系）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;匂坂中之郷村の現在地名が豊田町東名（現磐田市東名）にあたることを確認。&#34;,&#34;url&#34;:&#34;https://kotobank.jp/word/%E5%8C%82%E5%9D%82%E4%B8%AD%E4%B9%8B%E9%83%B7%E6%9D%91&#34;},{&#34;title&#34;:&#34;ニッポンの霊場 豊田郡三十三観音霊場&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;第26番＝大蔵寺（東名393・匂坂中之郷公民館隣接）を確認。上岡田329の大蔵寺（臨済宗妙心寺派・同霊場第5番）とは別寺院であることを住所で確認。&#34;,&#34;url&#34;:&#34;https://nippon-reijo.jimdofree.com/%E6%8E%B2%E8%BC%89%E9%9C%8A%E5%A0%B4%E3%81%AE%E4%B8%80%E8%A6%A7/%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/%E8%B1%8A%E7%94%B0%E9%83%A1%E4%B8%89%E5%8D%81%E4%B8%89%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/&#34;},{&#34;title&#34;:&#34;曹洞禅ナビ 寺院検索「大蔵寺」&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;住所（磐田市東名393）・フリガナ（ダイゾウジ）を照合し当該寺院と確認。掲載は基本情報のみで、由緒・本尊・行事欄は空欄&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220965.html&#34;}],&#34;research_todos&#34;:[&#34;『豊田町誌』『磐田市誌』で大蔵寺の山号・本尊・創建年代を確認する&#34;,&#34;曹洞禅ナビ（sotozen-navi.com）での登載ページを特定する&#34;,&#34;本寺と末寺関係を宗門資料で確認する&#34;,&#34;現地で堂宇・石造物・由緒書を確認する&#34;,&#34;『磐田市誌』『豊田町誌』で明治以降の沿革（現住職体制・堂宇の変遷）を確認する&#34;,&#34;郡誌記載の字名「蔵西」と現在の東名393番地の位置関係を確認する&#34;,&#34;曹洞禅ナビの由緒・本尊欄が空欄のため、磐田市誌等の地域資料で由緒を調査する&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;調査状況&#34;,&#34;body&#34;:&#34;全国の寺院を集成したデータベースで、磐田市東名393に所在する曹洞宗寺院であることが確認できます。一方、山号・本尊・創建年代など沿革を伝える公開Web情報は現時点では確認できていません。福島市（臨済宗・小倉寺観音）や奈良県宇陀市（真言宗）など全国に同名の大蔵寺が多数ありますが、いずれも別の寺院です。&#34;},{&#34;heading&#34;:&#34;『静岡県磐田郡誌』にみえる由緒&#34;,&#34;body&#34;:&#34;大正10年（1921年）刊行の『静岡県磐田郡誌』の曹洞宗寺院の項には、「大蔵寺（富岡村）」として「富岡村匂坂中之郷字蔵西に在り。福寿山と号す。岩田村増参寺の末寺にして、本尊は観世音菩薩なり。明応6年9月、増参寺第6世恵慶の開創とす」と記されています。本寺の増参寺（岩田山、現磐田市匂坂中）は、同郡誌によれば応仁2年（1468年）に社山城主の匂坂六郎左衛門尉が見取村に建立した蔵参庵に始まり、永禄7年（1564年）に磐田寺と合併して増参寺と改称した寺院で、大蔵寺はその末寺群の1つに数えられていました。&#34;},{&#34;heading&#34;:&#34;所在地「東名」の地名変遷&#34;,&#34;body&#34;:&#34;寺の所在する大字東名は、江戸時代の匂坂中之郷村にあたります。「日本歴史地名大系」の匂坂中之郷村の項には、天竜川下流左岸に位置し西は七蔵新田村に接する村で、現在の地名は豊田町東名（2005年〔平成17年〕の合併以降は磐田市東名）にあたると記されています。明治22年（1889年）の町村制施行で匂坂中之郷は磐田郡富岡村の大字となり、その後の豊田村（のち豊田町）を経て磐田市域となりました。全国寺院データベースにも磐田市東名393の曹洞宗寺院として登載されています。福島市（臨済宗・小倉寺観音）や奈良県宇陀市（真言宗）など全国に同名の大蔵寺が多数ありますが、いずれも別の寺院です。&#34;}],&#34;founded_period&#34;:&#34;明応6年（1497年）9月&#34;,&#34;cultural_assets&#34;:[],&#34;pilgrimage_note&#34;:&#34;豊田郡三十三観音霊場第26番札所（享保年間開創の歴史的霊場・現在は活動していない）&#34;},{&#34;temple_id&#34;:&#34;iwata-0110&#34;,&#34;slug&#34;:&#34;shokyuin-mitsue&#34;,&#34;name&#34;:&#34;松久院&#34;,&#34;name_kana&#34;:&#34;しょうきゅういん&#34;,&#34;aliases&#34;:[&#34;豊田山松久院&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市三家332番地&#34;,&#34;district_id&#34;:&#34;toyooka&#34;,&#34;area&#34;:&#34;豊岡&#34;,&#34;main_deity&#34;:&#34;釈迦牟尼如来（『静岡県磐田郡誌』による）&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;松久院は磐田市三家にある曹洞宗の寺院で、山号は豊田山です。大正10年（1921年）刊行の『静岡県磐田郡誌』には、広瀬村三家字中西に所在し、小笠郡下垂木村（現掛川市下垂木）の永江院の末寺、本尊は釈迦牟尼如来で、寛永元年（1624年）8月の開創と記されています。明治8年（1875年）には小学野部学校の分校「三家学校」が院内に設けられ、近代教育の場としても使われました。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9380&#34;},{&#34;title&#34;:&#34;寺院リサーチ【松久院】静岡県磐田市三家332番地&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;磐田市三家332・曹洞宗・法人番号5080405005672（2015年10月5日指定）、全国で唯一の松久院という記載を本文で確認。&#34;,&#34;url&#34;:&#34;https://jpinf.sakura.ne.jp/TS3Buk/TS3BukNO22/InfTS3Buk5672050008045.html&#34;},{&#34;title&#34;:&#34;静岡県磐田市の寺院・御堂一覧（サーチ寺院）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;磐田市三家332・曹洞宗の松久院の登載を本文で確認。&#34;,&#34;url&#34;:&#34;https://www.bukyou.com/BukyBukyou/TBukyou22/C22CNo211Detail.html&#34;},{&#34;title&#34;:&#34;『静岡県磐田郡誌』静岡県磐田郡教育会編（大正10年・1921年）第13章 神社及宗教 曹洞宗寺院の項（160 松久院）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション（インターネット公開）。462コマ目の本文画像で由緒全文を確認。&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680/1/462&#34;},{&#34;title&#34;:&#34;『静岡県磐田郡誌』第12章 教育（広瀬尋常高等小学校の沿革）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;294コマ目。明治8年に三家学校が松久院内に設置された記述を本文画像で確認。&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680/1/294&#34;},{&#34;title&#34;:&#34;曹洞禅ナビ 寺院検索「松久院」&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;住所（磐田市三家332）・フリガナ（ショウキュウイン）を照合し当該寺院と確認。掲載は基本情報のみで、由緒・本尊・行事欄は空欄&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_221234.html&#34;}],&#34;research_todos&#34;:[&#34;『豊岡村史』等で松久院の山号・本尊・創建年代を確認する&#34;,&#34;曹洞禅ナビ（sotozen-navi.com）での登載ページを特定する&#34;,&#34;本寺と末寺関係を宗門資料で確認する&#34;,&#34;現地で堂宇・石造物・由緒書を確認する&#34;,&#34;永江院側の末寺帳などで本末関係の成立時期を確認する&#34;,&#34;『豊岡村史』で近代以降の沿革を確認する&#34;,&#34;曹洞禅ナビの由緒・本尊欄が空欄のため、豊岡村誌等の地域資料で由緒を調査する&#34;],&#34;historical_sect
