<!DOCTYPE html><html lang="ja"> <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>寺院検索｜ATAWI TEMPLE</title><meta name="description" content="寺院名、読み方、住所、地区、宗派、状態から磐田市のお寺を検索できます。"><meta name="theme-color" content="#2f4b2b"><link rel="canonical" href="https://temple.atawi.link/search/"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="manifest" href="/site.webmanifest"><script defer src="https://fujigaoka-analytics-worker.hiroyukio0122.workers.dev/tracker.js" data-site="atawi-temple" data-fujigaoka-analytics="true"></script><link rel="stylesheet" href="/_astro/index.BO_GKdsR.css"></head> <body> <header class="site-header"> <a class="brand" href="/"> <img src="/assets/brand/atawi-temple-mark.svg" alt="" width="48" height="48"> <span> <small>磐田市のお寺・寺院データベース</small> <strong>ATAWI TEMPLE</strong> </span> </a> <nav aria-label="主要ナビゲーション"> <a href="/temples/">寺院一覧</a> <a href="/areas/">9地区</a> <a href="/sects/">宗派</a> <a href="/status/">調査状況</a> <a href="/search/">検索</a> <a href="/editorial-policy/">編集方針</a> <a href="/correction/">情報提供掲示板</a> </nav> </header> <main>  <section class="page-title"> <p class="eyebrow">Search</p> <h1>寺院検索</h1> <p>検索条件はURLに残るため、そのまま共有できます。</p> </section> <section class="search-panel" data-temples="[{&#34;temple_id&#34;:&#34;iwata-0001&#34;,&#34;slug&#34;:&#34;daijoin-nakaizumi&#34;,&#34;name&#34;:&#34;大乗院&#34;,&#34;name_kana&#34;:&#34;だいじょういん&#34;,&#34;aliases&#34;:[&#34;三仭坊&#34;,&#34;大乗院三仭坊&#34;,&#34;観広山大乗院&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;真言宗醍醐派&#34;,&#34;address&#34;:&#34;静岡県磐田市中泉1丁目10番地6&#34;,&#34;district_id&#34;:&#34;nakaizumi&#34;,&#34;area&#34;:&#34;中泉&#34;,&#34;main_deity&#34;:&#34;大青面金剛（大乗院本尊・室町時代作の一面三眼六臂の夜叉神像）。並立する小笠寺の本尊は三仭坊大権現（室町時代作・烏天狗の姿）&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;公開情報調査済み&#34;,&#34;history_summary&#34;:&#34;大乗院三仭坊は、磐田駅北口近くの庚申塚古墳の上に建つ真言宗醍醐派の寺院で、観広山大乗院と小笠山小笠寺の2寺が1つの境内に並び立ちます。大乗院は平行盛の次男行次の菩提追悼のため京都愛宕山から愛宕将軍地蔵菩薩を勧請して創設され、江戸時代初期には総本山醍醐寺三宝院から三河以東関東までの山伏の吟味役に任ぜられました。小笠寺は大宝年間（701〜704年）創立と伝わる祐厳寺を前身とし、徳川家康の中泉御殿の鬼門除け別当を担って「遠州の七坊」に数えられました。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-12&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9053&#34;},{&#34;title&#34;:&#34;大乗院 三仭坊 公式サイト「歴史と本尊」&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;山号（観広山・小笠山）、2寺院並立の構成、本尊（大青面金剛・三仭坊大権現）、創建伝承、家康の鬼門除け別当、遠州の七坊、修験道禁止令と中興を確認&#34;,&#34;url&#34;:&#34;https://mihirobo.or.jp/history/&#34;},{&#34;title&#34;:&#34;磐田市観光協会「まちなか歴史と文化の新発見 ありがた歩記 中泉編」（PDF）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;本堂2つ・本尊2体、庚申塚古墳の上に建つこと、遠州の七坊、家康戦勝祈願と蘇鉄の記述を確認（PDF本文を抽出して確認）&#34;,&#34;url&#34;:&#34;https://kanko-iwata.jp/wp2/wp-content/uploads/2023/06/B4_nakaizumi.pdf&#34;},{&#34;title&#34;:&#34;ニッポンの霊場 豊田郡三十三観音霊場&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;第4番＝観広山大乗院・小笠山小笠寺（真言宗醍醐派・中泉1丁目10-6・2寺同境内）を確認。宗派・住所がDBと完全一致。&#34;,&#34;url&#34;:&#34;https://nippon-reijo.jimdofree.com/%E6%8E%B2%E8%BC%89%E9%9C%8A%E5%A0%B4%E3%81%AE%E4%B8%80%E8%A6%A7/%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/%E8%B1%8A%E7%94%B0%E9%83%A1%E4%B8%89%E5%8D%81%E4%B8%89%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/&#34;},{&#34;title&#34;:&#34;大乗院三仭坊 公式サイト「年中行事」&#34;,&#34;type&#34;:&#34;寺院公式サイト&#34;,&#34;note&#34;:&#34;初護摩・大祭（4月第3日曜、火渡修行）・万灯会等の年中行事を確認。所在地は磐田市中泉一丁目10-6（旧中泉516）で照合一致&#34;,&#34;url&#34;:&#34;https://mihirobo.or.jp/%e5%b9%b4%e4%b8%ad%e8%a1%8c%e4%ba%8b/&#34;},{&#34;title&#34;:&#34;大乗院 三仭坊 公式サイト&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;由緒・祈祷・永代供養等を確認&#34;,&#34;url&#34;:&#34;https://mihirobo.or.jp/&#34;},{&#34;title&#34;:&#34;令和五年火渡り大祭[4月16日]&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;火渡り大祭・おてら市の開催内容を確認&#34;,&#34;url&#34;:&#34;https://mihirobo.or.jp/%E4%BB%A4%E5%92%8C%E4%BA%94%E5%B9%B4%E7%81%AB%E6%B8%A1%E3%82%8A%E5%A4%A7%E7%A5%AD4%E6%9C%8816%E6%97%A5/&#34;}],&#34;research_todos&#34;:[&#34;境内の庚申塚古墳について発掘調査記録・市の遺跡台帳を確認する&#34;,&#34;「遠州の七坊」の他の6坊と典拠史料を調べる&#34;,&#34;醍醐寺三宝院との本末関係を示す史料の有無を確認する&#34;,&#34;家康お手植えと伝わる蘇鉄の現況を現地確認する&#34;,&#34;明治の修験道禁止令による廃寺と大正の中興の経緯を市誌等で裏付ける&#34;,&#34;真言宗醍醐派（総本山醍醐寺）の公式サイトには末寺一覧・寺院検索がなく、宗派側資料での照合は未了&#34;,&#34;「遠州七坊」の他の6坊と吟味役任命の年代を宗派資料・市史で確認&#34;,&#34;護持会等の檀家組織の詳細は未確認&#34;,&#34;駐車場の有無は寺院公式サイト上で確認できなかった&#34;],&#34;founded_period&#34;:&#34;寺院公式サイトでは開山1300年前と紹介。大乗院は平行盛の次男行次の菩提追悼のため京都愛宕山から愛宕将軍地蔵菩薩を勧請して創設。小笠寺の前身・祐厳寺は大宝年間（701〜704年）の創立と伝わる&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;創建と修験道の道場&#34;,&#34;body&#34;:&#34;寺院公式サイトによれば、大乗院は平家一門が衰退した際、平行盛の次男行次の菩提供養のため愛宕将軍地蔵菩薩を勧請して創立されたと伝えられます。並立する小笠寺は、大宝年間（701〜704年）創立と伝わる祐厳寺を前身とし、後に小笠寺と改称されました。当山は当山派修験道（山伏）の祈祷道場で、江戸時代初期には醍醐寺三宝院より山伏吟味役に任命されたと伝えられます。江戸時代には幕府より格式を与えられ「遠州の七坊」に数えられましたが、明治の修験道禁止令で一時廃寺となり、大正時代に中興されました。&#34;},{&#34;heading&#34;:&#34;徳川家康と中泉御殿の鬼門除け&#34;,&#34;body&#34;:&#34;徳川家康が磐田中泉に御殿を造営するにあたり、当山はその鬼門除け別当を命ぜられ、御殿の東北に境内を構えてその任にあたったと伝えられます。家康自身もしばしば参詣して戦勝祈願を受け、勝利をおさめた折に送られた蘇鉄の子孫が今も境内に植えられています。磐田市観光協会の寺社案内でも、庚申塚古墳の上に建つ山伏寺院として、古くから悩み相談や占い・祈祷を行ってきたことが紹介されています。&#34;},{&#34;heading&#34;:&#34;並立する2つの寺・大乗院と小笠寺&#34;,&#34;body&#34;:&#34;境内には観広山大乗院と小笠山小笠寺の2寺が並び立ちます。大乗院の本尊は室町時代作の大青面金剛で、一面三眼六臂の夜叉神像です。あらゆる病気を完治させる功徳があるとされます。小笠寺の本尊は同じく室町時代作の三仭坊大権現で、烏天狗の姿をとり、全ての困難を打ち破り大願を果たす功徳があるとされます。弘法大師が伝えた真言密教と、役行者を開祖とする修験道の流れを汲む山伏の寺です。&#34;},{&#34;heading&#34;:&#34;山伏の吟味役と徳川家康ゆかりの寺&#34;,&#34;body&#34;:&#34;大乗院は平行盛の次男行次の菩提追悼のため、京都愛宕山から愛宕将軍地蔵菩薩を勧請して創設されたと伝わります。江戸時代初期には総本山醍醐寺三宝院から、三河から関東までの山伏の吟味役（改め役）に任ぜられました。小笠寺は大宝年間（701〜704年）創立と伝わる祐厳寺を前身とし、小笠神社から三仭坊大権現を勧請しました。徳川家康が磐田の中泉に御殿を築いた際には鬼門除けの別当を担い、「遠州の七坊」に数えられました。明治の修験道禁止令で小笠寺は廃寺となりましたが、大正期に中興され、昭和17年（1942年）に大乗院と合併して現在に至ります。&#34;}],&#34;pilgrimage_note&#34;:&#34;豊田郡三十三観音霊場第4番札所（小笠寺と2寺同境内・享保年間開創の歴史的霊場で現在は活動していない）&#34;,&#34;danka_info&#34;:{&#34;annual_events&#34;:[{&#34;name&#34;:&#34;年中行事&#34;,&#34;timing&#34;:&#34;&#34;,&#34;note&#34;:&#34;初護摩祈祷祭（1月1日）、寒行護摩（小寒〜立春の毎朝、家内安全・火災消除祈願）、厄除け星祭り祈祷祭（1〜2月）、大乗院三仭坊大祭（毎年4月第3日曜。庚申様御法楽・内陣護摩・餅投げ・柴灯護摩・火渡修行）、祈りの万灯会（毎年10月27日）、月並み護摩祈祷祭（毎月27日）、読経会・供養会（毎月第2日曜）&#34;},{&#34;name&#34;:&#34;火渡り大祭&#34;,&#34;timing&#34;:&#34;4月&#34;,&#34;note&#34;:&#34;素足で残り火の上を渡る祈祷行事。檀家以外も参加可能とされる。寺院公式サイトによる&#34;},{&#34;name&#34;:&#34;おてら市&#34;,&#34;timing&#34;:&#34;火渡り大祭当日の午後(14時〜18時)&#34;,&#34;note&#34;:&#34;地域の農産物・軽食・雑貨等を扱う市。地域住民との交流の場となっている。寺院公式サイトによる&#34;}],&#34;official_site&#34;:{&#34;status&#34;:&#34;あり&#34;,&#34;url&#34;:&#34;https://mihirobo.or.jp/&#34;,&#34;checked_at&#34;:&#34;2026-07-12&#34;},&#34;cemetery&#34;:&#34;永代供養を実施しているとされる。事情によりお墓参りができない人やお墓を持てない人に代わり、寺院が責任をもって永代にわたり供養・管理するとされる(寺院公式サイトによる)&#34;,&#34;community_role&#34;:&#34;「おてら市」の開催等を通じ、地域住民との交流の場を設けている(寺院公式サイトによる)&#34;}},{&#34;temple_id&#34;:&#34;iwata-0002&#34;,&#34;slug&#34;:&#34;ioji-kamada&#34;,&#34;name&#34;:&#34;醫王寺&#34;,&#34;name_kana&#34;:&#34;いおうじ&#34;,&#34;aliases&#34;:[&#34;鎌田山医王寺&#34;,&#34;鎌田山金剛院医王寺&#34;,&#34;医王寺&#34;,&#34;鎌田の薬師様&#34;,&#34;鎌田薬師&#34;,&#34;鎌田山金剛院醫王寺&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;真言宗智山派&#34;,&#34;address&#34;:&#34;静岡県磐田市鎌田2065番地の1&#34;,&#34;district_id&#34;:&#34;mikuriya&#34;,&#34;area&#34;:&#34;御厨&#34;,&#34;main_deity&#34;:&#34;薬師如来（行基菩薩が山内の名木で一刃三礼のもとに敬刻したと伝わる）&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;公開情報調査済み&#34;,&#34;history_summary&#34;:&#34;醫王寺は正式には鎌田山金剛院醫王寺と称する真言宗智山派の寺院で、天平6年〜20年（734〜748年）に聖武天皇の勅命を奉じた行基菩薩が薬師如来像を刻んで祀ったのが始まりと伝わります。平安時代には嵯峨天皇の帰依を受けて七堂伽藍が整う真言密教の根本道場となり、江戸時代には徳川家光から135石の朱印を与えられ「鎌田薬師」の名で親しまれました。明治27年（1894年）に京都智積院の末寺となり、真言宗智山派の寺院として今日に至ります。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-12&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9055&#34;},{&#34;title&#34;:&#34;真言宗智山派 鎌田山医王寺 公式サイト「医王寺の歴史について」&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;山号寺号（鎌田山金剛院医王寺）、本尊薬師如来、行基開山伝承、嵯峨天皇帰依、武田兵火、家康援助、家光朱印状、明治の再興、智山派所属、遠州四十九薬師第46番を確認&#34;,&#34;url&#34;:&#34;https://www.iouji.net/about/&#34;},{&#34;title&#34;:&#34;鎌田山医王寺 公式サイト「磐田市 重要指定文化財」&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;三十六歌仙図・和算額・中教院扁額・大般若経六百巻・医王寺文書・庭園及び参道の6件の解説を確認&#34;,&#34;url&#34;:&#34;https://www.iouji.net/visit/treasure/&#34;},{&#34;title&#34;:&#34;磐田市公式ウェブサイト「市指定文化財」&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;医王寺文書（古文書・鎌田）、大般若経（書跡・鎌田）、和算額（書跡・鎌田）、中教院扁額（歴史資料・鎌田）、医王寺庭園及び参道（名勝・鎌田）の市指定を確認&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/sports_midokoro/bunkazai/bunkazainitsuite/1002039.html&#34;},{&#34;title&#34;:&#34;日本各地の巡礼・巡拝霊場の紹介「遠江四十九薬師霊場」&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;第46番「鎌田山 金剛院 医王寺（薬師如来・真言宗智山派・磐田市鎌田）」の記載を確認（寺院公式サイトの記載とも一致）&#34;,&#34;url&#34;:&#34;https://nippon-reijo.jimdofree.com/掲載霊場の一覧/薬師霊場/遠江四十九薬師霊場/&#34;},{&#34;title&#34;:&#34;鎌田山医王寺 公式サイト「年間行事・イベント」&#34;,&#34;type&#34;:&#34;寺院公式サイト&#34;,&#34;note&#34;:&#34;年中行事一覧を確認。サイト内に「遠州四十九薬師 第四十六番札所」「医王寺の宝物」（市指定文化財）ページあり&#34;,&#34;url&#34;:&#34;https://www.iouji.net/event&#34;},{&#34;title&#34;:&#34;真言宗智山派 総本山智積院 公式サイト&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;2026年7月時点でサイト全体がメンテナンス中のため、宗派公式の寺院一覧（/chishakuin/matsuji/）は確認不可&#34;,&#34;url&#34;:&#34;https://chisan.or.jp/&#34;},{&#34;title&#34;:&#34;真言宗智山派 鎌田山医王寺 公式サイト&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;由緒等を確認&#34;,&#34;url&#34;:&#34;https://www.iouji.net/&#34;},{&#34;title&#34;:&#34;年間行事・イベント&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;年中行事の日程・檀家以外参加可の案内を確認&#34;,&#34;url&#34;:&#34;https://www.iouji.net/event/&#34;},{&#34;title&#34;:&#34;醫王寺(静岡県磐田市)の永代供養墓・樹木葬・納骨堂&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;永代供養墓等の取扱いカテゴリのみ確認。詳細未確認のため参考情報にとどめた&#34;,&#34;url&#34;:&#34;https://eitaikuyo.jp/searcht/temple/T-0000037049&#34;}],&#34;research_todos&#34;:[&#34;庭園の作庭者に関する諸説（小堀遠州説・智積院第7世運敞説）を公式ページ本文と現地資料で確認する&#34;,&#34;昭和44年の中根金作による庭園復興指導の典拠を確認する&#34;,&#34;徳川家光の朱印状135石の原史料（朱印状写）の所在を確認する&#34;,&#34;紙本金地著色三十六歌仙図の市指定区分（絵画）を磐田市の指定台帳で確認する&#34;,&#34;廃仏毀釈期（明治初年）の寺院の状況を市誌で確認する&#34;,&#34;宗派公式（総本山智積院 chisan.or.jp）はサイト全体がメンテナンス中で「全国の智山派寺院」ページを確認できず。メンテナンス明けに末寺掲載を再確認&#34;,&#34;要確認（文化財DB照合）: address: 磐田市の文化財台帳では寺名表記は「医王寺」（名簿の「醫王寺」の新字体）。所在地表記は鎌田。&#34;,&#34;永代供養・納骨堂の具体的な内容は寺院公式サイトで直接の記載を確認できず、要追加確認&#34;,&#34;護持会等の檀家組織の詳細は未確認&#34;],&#34;founded_period&#34;:&#34;天平6年〜20年（734〜748年）、聖武天皇の勅命を奉じた行基菩薩の開基と伝わる&#34;,&#34;heritage_status&#34;:&#34;磐田市指定文化財あり（名勝「医王寺庭園及び参道」ほか古文書・書跡・歴史資料など複数）&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;創建と沿革&#34;,&#34;body&#34;:&#34;寺院公式サイトによれば、天平6年〜20年（734〜748年）に聖武天皇の勅命を奉じた行基菩薩が当地を訪れ、薬師如来の尊像を刻んで祀ったのが始まりと伝えられます。平安時代の弘仁年間（810〜822年）には嵯峨天皇の帰依を受けて七堂伽藍が整い、真言密教の道場となったと伝わります。元亀3年（1572年）に武田信玄勢の兵火で寺塔が灰燼に帰しましたが、天正12年（1584年）には徳川家康の援助で再興されました。慶長9年（1604年）の火災後も幕府の寄進で復興し、寛永12年（1635年）には徳川家光から135石の朱印状を与えられたと記されています。明治8年（1875年）に医王寺として再興され、明治27年（1894年）から真言宗智山派に属しています。&#34;},{&#34;heading&#34;:&#34;庭園と参道&#34;,&#34;body&#34;:&#34;境内には約1,000平方メートルの枯山水庭園があり、参道とともに磐田市指定名勝「医王寺庭園及び参道」となっています。江戸時代初期の作庭とされる古庭園で、寺に伝わる文化財とあわせて公開情報が整理されています。市指定文化財一覧にも名勝として「医王寺庭園及び参道」（鎌田）が掲載されています。&#34;},{&#34;heading&#34;:&#34;行基開基と真言密教の根本道場&#34;,&#34;body&#34;:&#34;寺伝では、天平6年〜20年（734〜748年）に聖武天皇の勅命を奉じた行基菩薩が当地を訪れ、この地に薬師如来の霊験ありとして、山内の名木で薬師如来の尊像を一刃三礼のもとに刻み、本尊として祀ったのが始まりとされます。平安時代の弘仁年間（810〜822年）には嵯峨天皇の厚い帰依を受けて七堂伽藍が整い、真言密教の根本道場となりました。当時は広大な境内に本堂・金堂・講堂・五重塔・三重塔・鐘楼堂・仁王門と36ヶ坊の末寺が配置されていました。&#34;},{&#34;heading&#34;:&#34;武田信玄の兵火と徳川家の庇護&#34;,&#34;body&#34;:&#34;元亀3年（1572年）、武田信玄勢の兵火により寺塔はことごとく灰燼に帰しました。天正12年（1584年）に徳川家康が自ら浄財を出して再興を援助し、慶長9年（1604年）の失火の後も徳川幕府の寄進を受けて復興を遂げました。寛永12年（1635年）には3代将軍徳川家光が祖父家康の与えた黒印を改めて135石の朱印を与え、江戸時代末期まで代々135石を領して栄えました。当時の隆盛をしのぶ大名駕籠が現存します。「鎌田薬師」の名称で親しまれ、金剛院を本寺として多くの塔頭を擁し、坊のあった一帯は今も「坊中」の地名で呼ばれています。&#34;},{&#34;heading&#34;:&#34;明治の再興と智山派入り&#34;,&#34;body&#34;:&#34;本寺の金剛院が明治維新の廃仏毀釈・神仏分離により寺運が揺らいだため、明治8年（1875年）に塔頭であった醫王寺を再興する形で法灯が守られました。この時、36ヶ坊のほとんどが廃寺となっています。明治27年（1894年）に京都東山七条の智積院の末寺に属し、真言宗智山派の寺院として今日に至ります（それ以前は報恩院の末寺でした）。昭和19年（1944年）には学童疎開で東京の蒲田国民学校の児童108名を受け入れ、これは1ヶ寺の受入人数として磐田市内最大でした。境内には約1,000平方メートルに及ぶ枯山水の古庭園があり、紙本金地著色三十六歌仙図・和算額・中教院扁額・大般若経600巻・医王寺文書・庭園および参道などが磐田市指定文化財となっています。&#34;},{&#34;heading&#34;:&#34;文化財資料からの補足&#34;,&#34;body&#34;:&#34;醫王寺の庭園及び参道は江戸時代初期に作られた枯山水の古庭園で、築山を巧みに配置した芸術的・歴史的価値の高い庭園として、平成17年（2005年）11月21日に磐田市指定名勝となっています。市指定の名勝は市内でこの1件のみです。 江戸時代前期に狩野派の絵師が描いた紙本金地著色三十六歌仙図、松平右衛門太夫が寄進した木活版字印刷の大般若経600巻など、磐田市指定文化財を計6件所蔵しています。 安永8年（1779年）3月に長江村の江塚平兵衛時之が奉納した和算額は、地方における学問普及の状況を伝える市指定歴史資料です。また浜松の五社神社境内に設置されていた浜松県中教院の扁額も市指定歴史資料として伝わります。 戦国期から近世への移行期の文書群「医王寺文書」は、磐田市指定有形文化財（古文書）に指定されています。&#34;}],&#34;cultural_assets&#34;:[{&#34;name&#34;:&#34;医王寺庭園及び参道&#34;,&#34;designation&#34;:&#34;磐田市指定名勝&#34;,&#34;summary&#34;:&#34;約1,000平方メートルの枯山水庭園と山門へ続く参道。磐田市の市指定文化財一覧に名勝（鎌田）として掲載されています。&#34;},{&#34;name&#34;:&#34;医王寺文書&#34;,&#34;designation&#34;:&#34;磐田市指定文化財（古文書）&#34;,&#34;summary&#34;:&#34;戦国期の穴山信君（武田信君）の禁制文書を含む古文書群。寺院公式サイトでは天正3年（1575年）以前のものと解説されています。&#34;},{&#34;name&#34;:&#34;大般若経六百巻&#34;,&#34;designation&#34;:&#34;磐田市指定文化財（書跡）&#34;,&#34;summary&#34;:&#34;正保2年（1645年）に松平正綱から寄進されたと伝わる大般若経。市の指定文化財一覧に書跡「大般若経」（鎌田）として掲載されています。&#34;},{&#34;name&#34;:&#34;和算額&#34;,&#34;designation&#34;:&#34;磐田市指定文化財（書跡）&#34;,&#34;summary&#34;:&#34;数学の問題と解法を記して奉納された算額。市の指定文化財一覧に書跡「和算額」（鎌田）として掲載されています。&#34;},{&#34;name&#34;:&#34;中教院扁額&#34;,&#34;designation&#34;:&#34;磐田市指定文化財（歴史資料）&#34;,&#34;summary&#34;:&#34;明治5年（1872年）の教部省による教導職制度に関わる扁額で、書院・客殿正面に掲げられています。市の指定文化財一覧に歴史資料（鎌田）として掲載されています。&#34;},{&#34;name&#34;:&#34;紙本金地著色三十六歌仙図&#34;,&#34;designation&#34;:&#34;磐田市指定文化財（寺院公式サイトによる）&#34;,&#34;summary&#34;:&#34;江戸時代前期の狩野派絵師による三十六歌仙図。寺院公式サイトの文化財紹介ページに掲載されています。&#34;},{&#34;name&#34;:&#34;大般若経&#34;,&#34;designation&#34;:&#34;磐田市指定有形文化財（書跡）&#34;,&#34;summary&#34;:&#34;江戸時代前期に松平右衛門太夫が医王寺へ寄進した大般若経600巻。木活版字印刷で珍しい。平成17年（2005年）11月21日指定。&#34;}],&#34;pilgrimage_note&#34;:&#34;遠州四十九薬師霊場（遠江四十九薬師霊場）第46番札所&#34;,&#34;danka_info&#34;:{&#34;annual_events&#34;:[{&#34;name&#34;:&#34;年中行事&#34;,&#34;timing&#34;:&#34;&#34;,&#34;note&#34;:&#34;元旦特別大護摩供（1月1日）、節分大般若厄除御祈祷（2月3日）、涅槃会（2月15日）、お彼岸醫王寺会「落語会ほか」（春分の日・秋分の日）、花まつり（4月8日）、大師堂御供養（4月12日）、盆寺施餓鬼供養（7月13日・8月13日）、地蔵盆供養（8月24日）、戦没者慰霊法要（10月中旬・忠霊塔）、薬師堂御供養（12月12日）、毎月8日は薬師如来縁日の大護摩供&#34;},{&#34;name&#34;:&#34;元旦特別大護摩供&#34;,&#34;timing&#34;:&#34;1月1日&#34;,&#34;note&#34;:&#34;寺院公式サイトによる&#34;},{&#34;name&#34;:&#34;涅槃会&#34;,&#34;timing&#34;:&#34;2月15日&#34;,&#34;note&#34;:&#34;釈迦の命日の法要。寺院公式サイトによる&#34;},{&#34;name&#34;:&#34;お彼岸醫王寺会&#34;,&#34;timing&#34;:&#34;3月・9月(彼岸)&#34;,&#34;note&#34;:&#34;落語会等をあわせて実施。寺院公式サイトは「お檀家さま以外でもご参加頂けます」と案内している&#34;},{&#34;name&#34;:&#34;戦没者慰霊法要&#34;,&#34;timing&#34;:&#34;10月中旬&#34;,&#34;note&#34;:&#34;境内の忠霊塔にて実施。寺院公式サイトによる&#34;}],&#34;official_site&#34;:{&#34;status&#34;:&#34;あり&#34;,&#34;url&#34;:&#34;https://www.iouji.net/&#34;,&#34;checked_at&#34;:&#34;2026-07-12&#34;},&#34;cemetery&#34;:&#34;永代供養墓・樹木葬・納骨堂を取り扱うとの記載が民間の寺院検索サイトにあるが、具体的な形態・費用等は寺院公式サイト上では確認できなかった(参考情報)&#34;,&#34;community_role&#34;:&#34;境内の忠霊塔で10月中旬に戦没者慰霊法要を実施し、地域の慰霊行事の一端を担っている(寺院公式サイトによる)&#34;}},{&#34;temple_id&#34;:&#34;iwata-0003&#34;,&#34;slug&#34;:&#34;kokubunji-mitsuke&#34;,&#34;name&#34;:&#34;国分寺&#34;,&#34;name_kana&#34;:&#34;こくぶんじ&#34;,&#34;aliases&#34;:[&#34;遠江国分寺&#34;,&#34;遠江国分寺跡&#34;,&#34;特別史跡遠江国分寺跡&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;新義真言宗&#34;,&#34;address&#34;:&#34;静岡県磐田市見付3046番地&#34;,&#34;district_id&#34;:&#34;mitsuke&#34;,&#34;area&#34;:&#34;見付&#34;,&#34;main_deity&#34;:&#34;未確認&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;現地写真あり&#34;,&#34;detail_status&#34;:&#34;写真・史跡情報あり&#34;,&#34;history_summary&#34;:&#34;見付地区に所在する新義真言宗の寺院です。周辺には奈良時代に聖武天皇の詔で整備された遠江国分寺跡が残り、金堂・講堂・七重塔・回廊などの伽藍配置が発掘調査で確認されています。現在のページでは、現地写真、文化財説明板、公的資料をもとに、現寺院の基礎情報と遠江国分寺跡の史跡情報を分けて整理します。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9057&#34;},{&#34;title&#34;:&#34;磐田市「遠江国分寺跡」&#34;,&#34;type&#34;:&#34;行政・文化財情報&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/sports_midokoro/bunkazai/kunishitei/1002046.html&#34;,&#34;note&#34;:&#34;伽藍配置、寺域規模、七重塔跡、特別史跡としての概要を参照。&#34;},{&#34;title&#34;:&#34;磐田市「遠江国分寺跡整備事業」&#34;,&#34;type&#34;:&#34;行政・整備事業情報&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/sports_midokoro/bunkazai/bunkazainitsuite/1002035.html&#34;,&#34;note&#34;:&#34;史跡公園再整備の方針と経緯を参照。&#34;},{&#34;title&#34;:&#34;文化遺産オンライン「遠江国分寺跡」&#34;,&#34;type&#34;:&#34;文化財データベース&#34;,&#34;url&#34;:&#34;https://online.bunka.go.jp/heritages/detail/172155&#34;,&#34;note&#34;:&#34;特別史跡指定の解説と学術上の価値を参照。&#34;},{&#34;title&#34;:&#34;現地写真・説明板（2026年添付写真）&#34;,&#34;type&#34;:&#34;現地確認&#34;,&#34;note&#34;:&#34;堂宇、境内、石標、手水石、文化財説明板、霊場案内図の写真をページ作成モデルとして整理。&#34;},{&#34;title&#34;:&#34;添付資料「磐田市の国分寺調査」&#34;,&#34;type&#34;:&#34;調査メモ&#34;,&#34;note&#34;:&#34;天平期の背景、伽藍配置、木装基壇、整備事業の要約に使用。&#34;}],&#34;page_summary&#34;:&#34;国分寺は、現在の寺院情報と、古代遠江国の中枢を示す特別史跡「遠江国分寺跡」の情報をあわせて確認できるページです。写真は本堂・境内・石標・説明板・手水石・霊場案内図に分類して掲載します。&#34;,&#34;founded_period&#34;:&#34;奈良時代（遠江国分寺跡）／現寺院の沿革は調査中&#34;,&#34;heritage_status&#34;:&#34;国指定特別史跡（遠江国分寺跡）&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;遠江国分寺の成立&#34;,&#34;body&#34;:&#34;天平13年（741年）、聖武天皇が国ごとに国分寺・国分尼寺を建立するよう命じた詔を背景に、遠江国にも国分寺が整備されました。遠江国府に近接するこの一帯は、古代遠江国の政治・文化の中心地でした。&#34;},{&#34;heading&#34;:&#34;伽藍と寺域&#34;,&#34;body&#34;:&#34;発掘調査では、金堂を中心に北へ講堂、南へ中門を置き、回廊で囲む伽藍構成が確認されています。寺域は東西約180メートル、南北約250メートルに及び、七重塔跡には礎石が残ります。&#34;},{&#34;heading&#34;:&#34;発掘調査と保存整備&#34;,&#34;body&#34;:&#34;昭和26年（1951年）に発掘調査が行われ、翌昭和27年に国の特別史跡へ指定されました。近年は遺構を地下に保存しながら、木装基壇などを実物大で示す史跡整備が進められています。&#34;},{&#34;heading&#34;:&#34;現在の国分寺&#34;,&#34;body&#34;:&#34;このページで扱う現存寺院の国分寺は新義真言宗です。古代寺院の遠江国分寺跡とは情報の性格が異なるため、現寺院の創建・沿革・ご本尊については、寺院資料や聞き取りで確認できるまで調査中として区別します。&#34;}],&#34;cultural_assets&#34;:[{&#34;name&#34;:&#34;遠江国分寺跡&#34;,&#34;designation&#34;:&#34;国指定特別史跡&#34;,&#34;summary&#34;:&#34;奈良時代の国分寺の伽藍配置と寺域を伝える史跡。金堂・講堂・中門・回廊・七重塔などの遺構が確認されています。&#34;},{&#34;name&#34;:&#34;七重塔跡の礎石&#34;,&#34;designation&#34;:&#34;史跡構成要素&#34;,&#34;summary&#34;:&#34;遠江国分寺の七重塔を支えた礎石が残り、古代寺院の規模を現地で確かめられます。&#34;},{&#34;name&#34;:&#34;境内の手洗石&#34;,&#34;designation&#34;:&#34;現地確認資料&#34;,&#34;summary&#34;:&#34;現地説明板では天正年間の銘が紹介されています。年代や伝来の詳細は追加調査中です。&#34;}],&#34;visit_notes&#34;:&#34;堂宇、境内、入口石標、文化財説明板を現地写真で確認しています。拝観時間、駐車場、寺院への問い合わせ方法は未確認のため、現地の表示と寺院関係者への配慮を優先してください。&#34;,&#34;research_todos&#34;:[&#34;現存寺院としての創建年代・沿革&#34;,&#34;ご本尊と脇侍&#34;,&#34;住職の常駐状況と参拝可能時間&#34;,&#34;駐車場・公共交通からの参拝動線&#34;,&#34;手洗石の銘文と伝来&#34;],&#34;research_highlights&#34;:[&#34;天平13年（741年）、聖武天皇の国分寺建立の詔により、遠江国にも国分僧寺・国分尼寺が整備されたとされます。&#34;,&#34;遠江国分寺跡は、金堂を中心に北側へ講堂、南側へ中門を配し、金堂と中門を回廊がつなぐ伽藍構成が確認されています。&#34;,&#34;寺域は東西約180m、南北約250mに及ぶ大規模な範囲で、周辺には国府・国分尼寺・府八幡宮など古代遠江国の中枢機能が集まりました。&#34;,&#34;昭和26年の発掘調査後、昭和27年に国の特別史跡に指定されました。&#34;,&#34;近年の整備事業では、遺構を地下に保存したうえで、木装基壇などを1/1スケールで復元表示する方針が採られています。&#34;],&#34;page_rules&#34;:[&#34;主写真は堂宇または境内全景を使用する。&#34;,&#34;説明板写真は本文の根拠に使えるため、文字が読める状態で掲載する。&#34;,&#34;史跡情報は「遠江国分寺跡」、現代寺院情報は「国分寺」として見出しを分ける。&#34;,&#34;写真は本堂・堂宇、境内全景、入口・石標、説明板・案内板、石造物・手水、地図・札所案内に分類する。&#34;,&#34;地域の呼び方や読み方が異なる可能性がある情報は、情報提供・訂正導線から更新する。&#34;]},{&#34;temple_id&#34;:&#34;iwata-0004&#34;,&#34;slug&#34;:&#34;tokuoin-mitsuke&#34;,&#34;name&#34;:&#34;徳翁院&#34;,&#34;name_kana&#34;:&#34;とくおういん&#34;,&#34;aliases&#34;:[&#34;江東山徳翁院&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;浄土宗&#34;,&#34;address&#34;:&#34;静岡県磐田市見付568番地&#34;,&#34;district_id&#34;:&#34;mitsuke&#34;,&#34;area&#34;:&#34;見付&#34;,&#34;main_deity&#34;:&#34;十一面観音菩薩立像&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;現地写真あり&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;徳翁院は磐田市見付にある浄土宗（鎮西白旗派）の寺院で、山号は江東山、本尊は十一面観音菩薩立像です。『静岡県磐田郡誌』（1921年）によれば、同じ見付の大見寺の末寺で、大見寺11世・呑誉禿翁上人が退院後の天和元年（1681年）2月に分派創建しました。禿翁上人は良純法親王（後陽成天皇第8皇子）の弟子で、法親王の分骨石塔がはじめ当院に置かれていたことでも知られます。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-12&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9059&#34;},{&#34;title&#34;:&#34;静岡教区浄土宗青年会「146 徳翁院 磐田市見付」&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;山号（江東山）、本尊十一面観音菩薩立像、開山呑誉禿翁上人（大見寺十一世）、開基年次「天和年間(1615~1623)」、観音まつり・稲荷まつりを確認&#34;,&#34;url&#34;:&#34;https://jodo-ss.com/temple_list/146%e3%80%80%e5%be%b3%e7%bf%81%e9%99%a2%e3%80%80%e7%a3%90%e7%94%b0%e5%b8%82%e8%a6%8b%e4%bb%98/&#34;},{&#34;title&#34;:&#34;浄土宗 寺院検索「徳翁院」&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;浄土宗寺院であること、山号「江東山」、所在地（磐田市見付568番地）を確認&#34;,&#34;url&#34;:&#34;https://otera.jodo.or.jp/temple/20-146/&#34;},{&#34;title&#34;:&#34;静岡県：歴史・観光・見所「大見寺（磐田市）」&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;大見寺11代呑誉禿翁が良純親王（後陽成天皇第八皇子）の弟子だったという記述を確認（現地案内板・磐田市教育委員会文化財課を典拠と明記）&#34;,&#34;url&#34;:&#34;https://www.sizutabi.com/iwata/daiken.html&#34;},{&#34;title&#34;:&#34;『静岡県磐田郡誌』（静岡県磐田郡教育会編、1921年）430コマ・413コマ・616コマ&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション。由緒（430コマ）、浄土宗寺院一覧表（413コマ）、大見寺・良純法親王と徳翁院の石塔（616コマ）。次世代デジタルライブラリーの全文検索APIで本文を確認&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680/1/430&#34;},{&#34;title&#34;:&#34;静岡教区浄土宗青年会 寺院紹介「146 徳翁院 磐田市見付」&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;開山=呑誉禿翁上人（大見寺十一世）、創建=「天和年間(1615~1623)」（年号矛盾あり）、本尊・寺宝=十一面観音菩薩立像、行事=観音まつり（4月・8月）・稲荷まつり（2月）を確認&#34;,&#34;url&#34;:&#34;https://jodo-ss.com/temple_list/146%E3%80%80%E5%BE%B3%E7%BF%81%E9%99%A2%E3%80%80%E7%A3%90%E7%94%B0%E5%B8%82%E8%A6%8B%E4%BB%98/&#34;}],&#34;research_todos&#34;:[&#34;開基年次の「天和年間(1615~1623)」表記の正誤（元和年間か天和年間か）を寺院・宗派資料で確認する&#34;,&#34;本尊十一面観音菩薩立像の年代・伝来を確認する&#34;,&#34;境内の稲荷社（稲荷まつりの対象）の由来を確認する&#34;,&#34;見付宿の町並みにおける位置づけ（旧東海道見付宿との関係）を磐田市誌で調べる&#34;,&#34;大見寺との本末・兼務関係の沿革を確認する&#34;,&#34;開山名の表記（呑誉禿翁／秀翁）の確定（『磐田市誌』や寺蔵資料での照合）&#34;,&#34;郡誌の旧字名「見付字三本松」と現住所（見付568番地）の対応確認&#34;,&#34;本尊の尊名（郡誌の救世観世音菩薩と現行資料の十一面観音立像）の関係確認&#34;,&#34;創建年「天和年間(1615~1623)」の年号・西暦の矛盾を磐田市誌等の地誌で確認する&#34;,&#34;年中行事の具体的な日程は宗派公式の寺院検索サイトでは確認できず、現地・寺院への確認が必要&#34;,&#34;永代供養・護持会等の檀家向け情報は未確認&#34;],&#34;founded_period&#34;:&#34;開山は大見寺11世の呑誉禿翁上人。宗派資料の開基年次欄は「天和年間(1615~1623)」と表記されるが、西暦1615〜1623年は元和年間にあたり、天和年間は1681〜1684年であるため年号表記に矛盾があり要確認&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;創建と大見寺との縁&#34;,&#34;body&#34;:&#34;『静岡県磐田郡誌』（1921年）の浄土宗寺院の由緒には、徳翁院は見付町字三本松に在り、鎮西白旗派に属して同町大見寺の末寺であること、本尊は救世観世音菩薩で慈覚大師の作と伝えること、開創は大見寺第11世の呑誉禿翁上人（同誌の由緒欄では「秀翁」とも印字されますが、同誌の大見寺関係記事および静岡教区浄土宗青年会の寺院紹介は「禿翁」と記します）で、退院後に「宮御方御念持仏」の救世観世音菩薩を本尊として天和元年（1681年）2月に当院を分派創建したこと、禿翁上人は元禄3年（1690年）5月27日に示寂したことが記されています。宗派資料の開基年次欄には「天和年間(1615~1623)」とありますが、天和は西暦1681〜1684年にあたり、郡誌の記す天和元年（1681年）2月と整合します。同誌の一覧表では山号は「江朶山」と印字され（現在の資料にみえる「江東山」の誤植とみられます）、1921年当時の境内地は440坪でした。現在も毎年4月と8月の観音まつり、2月の稲荷まつりが行われています。&#34;,&#34;sources_note&#34;:&#34;『静岡県磐田郡誌』430コマ（由緒）・413コマ（浄土宗寺院一覧表）&#34;},{&#34;heading&#34;:&#34;良純法親王の分骨石塔と徳翁院&#34;,&#34;body&#34;:&#34;『静岡県磐田郡誌』の大見寺に関する記事には、開山の呑誉禿翁和尚は良純法親王の弟子で、法親王の配流先の甲州から随従し、後に大見寺住職となったこと、法親王が寛文9年（1669年）4月に66歳で薨去した後、分骨と霊牌の安置を請願して許可を受けたことが記されています。同記事によれば、その石塔ははじめ「三本松なる末寺徳翁院」に置かれ、文政11年（1828年）11月に大見寺へ遷されました。徳翁院の旧地名である見付字三本松に法親王ゆかりの石塔が置かれていたことになり、開山禿翁上人を介した大見寺・良純法親王との深い縁を示しています。&#34;,&#34;sources_note&#34;:&#34;『静岡県磐田郡誌』616コマ（大見寺・良純法親王関係記事）&#34;},{&#34;heading&#34;:&#34;大見寺11世を開山とする観音の寺&#34;,&#34;body&#34;:&#34;浄土宗の公式寺院検索には、山号を江東山、院号を徳翁院として登録されています。静岡教区浄土宗青年会の寺院紹介によると、開山は大見寺11世の呑誉禿翁上人で、創建年次の欄には「天和年間(1615~1623)」と記されています。ただし西暦1615〜1623年は元和年間にあたり、天和年間は1681〜1684年であるため、年号と西暦のどちらが正しいかは資料上確認できません。本尊は十一面観音菩薩立像で、寺宝としても同像が挙げられています。&#34;},{&#34;heading&#34;:&#34;観音まつりと稲荷まつり&#34;,&#34;body&#34;:&#34;静岡教区浄土宗青年会の寺院紹介では、年中行事として毎年4月と8月の観音まつり、2月の稲荷まつりが挙げられています。現住職は大見寺住職の兼務です。&#34;}],&#34;cultural_assets&#34;:[],&#34;danka_info&#34;:{&#34;annual_events&#34;:[{&#34;name&#34;:&#34;年中行事&#34;,&#34;timing&#34;:&#34;&#34;,&#34;note&#34;:&#34;観音まつり（毎年4月と8月）、稲荷まつり（2月）&#34;}],&#34;parking&#34;:&#34;参拝・拝観用駐車場ありとの記載が浄土宗寺院検索(宗派公式)にある&#34;}},{&#34;temple_id&#34;:&#34;iwata-0005&#34;,&#34;slug&#34;:&#34;keiganji-mitsuke&#34;,&#34;name&#34;:&#34;慶岩寺&#34;,&#34;name_kana&#34;:&#34;けいがんじ&#34;,&#34;aliases&#34;:[&#34;松光山慶岩寺&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;浄土宗&#34;,&#34;address&#34;:&#34;静岡県磐田市見付2735番地の1&#34;,&#34;district_id&#34;:&#34;mitsuke&#34;,&#34;area&#34;:&#34;見付&#34;,&#34;main_deity&#34;:&#34;阿弥陀如来（『静岡県磐田郡誌』の由緒および浄土宗寺院一覧表による）&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;現地写真あり&#34;,&#34;detail_status&#34;:&#34;深掘り調査・現地写真あり&#34;,&#34;history_summary&#34;:&#34;慶岩寺は磐田市見付にある浄土宗（鎮西白旗派）の寺院で、山号は松光山、本尊は阿弥陀如来です。『静岡県磐田郡誌』（1921年）によれば京都知恩院の直末で、永禄5年（1562年）2月に能公和尚が開創し、境内には天正年間創立と伝える地蔵堂があります。寺宝として阿弥陀三尊、両大師、釈迦涅槃図絵が伝わります。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-12&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9061&#34;},{&#34;title&#34;:&#34;静岡教区浄土宗青年会「144 慶岩寺 磐田市見付」&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;山号（松光山）、開山金蓮社住誉上人能公大和尚、開基永禄5年（1562）、寺宝（阿弥陀三尊・両大師・釈迦涅槃図絵）、北向地蔵尊大祭を含む年間行事を確認&#34;,&#34;url&#34;:&#34;https://jodo-ss.com/temple_list/144%E3%80%80%E6%85%B6%E5%B2%A9%E5%AF%BA%E3%80%80%E7%A3%90%E7%94%B0%E5%B8%82%E8%A6%8B%E4%BB%98/&#34;},{&#34;title&#34;:&#34;浄土宗 寺院検索「慶岩寺」&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;浄土宗寺院であること、山号「松光山」、所在地（磐田市見付2735番地の1）、別時会・写経会・法話会などの行事を確認&#34;,&#34;url&#34;:&#34;https://otera.jodo.or.jp/temple/20-144/&#34;},{&#34;title&#34;:&#34;『静岡県磐田郡誌』（静岡県磐田郡教育会編、1921年）430コマ・413コマ&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション。由緒（430コマ）に永禄5年2月能公和尚開創・本尊阿弥陀如来・地蔵堂の記録、一覧表（413コマ）に山号松光山・境内693坪&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680/1/430&#34;}],&#34;research_todos&#34;:[&#34;本尊の名称・形式を寺院に確認する（宗派資料には本尊の記載なし）&#34;,&#34;北向地蔵尊の由来と大祭の内容を確認する&#34;,&#34;「両大師」の具体的な尊名を確認する&#34;,&#34;見付宿・旧東海道との関係や江戸時代の寺の様子を磐田市誌で調べる&#34;,&#34;検索結果の要約に「境内に見付端城の土塁が残る・浮田幸吉の墓がある」との記述が出たが、これは大見寺の情報との混同とみられるため、慶岩寺境内の遺構の有無をあらためて確認する&#34;,&#34;郡誌の「宗祖第九世の法孫」能公和尚の系譜（浄土宗第9世聖冏門流か）の確認&#34;,&#34;北向地蔵尊と郡誌記載の天正年間創立の地蔵堂（明治34年再建）の同一性確認&#34;,&#34;旧字名「倉小路」の位置の確認&#34;,&#34;本尊は宗派公式資料に明記なし（寺宝に阿弥陀三尊とあるが本尊とは断定できない）。現地確認または市誌で補完する&#34;,&#34;北向地蔵尊の由来を郷土資料で確認する&#34;,&#34;年中行事の具体的な日程は宗派公式の寺院検索サイトでは確認できず、現地・寺院への確認が必要&#34;,&#34;永代供養・護持会等の檀家向け情報は未確認&#34;],&#34;founded_period&#34;:&#34;永禄5年（1562年）創建。開山は金蓮社住誉上人能公大和尚（静岡教区浄土宗青年会の寺院紹介による）&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;創建と寺宝&#34;,&#34;body&#34;:&#34;『静岡県磐田郡誌』（1921年）の由緒には、慶岩寺は見付町字倉小路に在り、京都知恩院末で鎮西白旗派に属すること、本尊は阿弥陀如来であること、永禄5年（1562年）2月に「宗祖第九世の法孫」能公和尚の開創にかかること、能公和尚は天正5年（1577年）7月10日に寂し、以後累代法脈が連綿と続いたことが記されています。静岡教区浄土宗青年会の寺院紹介が記す開山「金蓮社住誉上人能公大和尚」・開基永禄5年（1562年）と一致します。戦国時代末期、今川氏から徳川氏へ支配が移り変わる時期の見付での開基となります。郡誌の一覧表によれば1921年当時の境内地は693坪でした。寺宝としては阿弥陀三尊、両大師（円光大師・元祖大師などを指すとみられます）、釈迦涅槃図絵が挙げられています。年間行事には御忌会、涅槃会、花まつり、山門大施餓鬼会のほか「北向地蔵尊大祭」があります。&#34;,&#34;sources_note&#34;:&#34;『静岡県磐田郡誌』430コマ（由緒）・413コマ（浄土宗寺院一覧表）&#34;},{&#34;heading&#34;:&#34;境内の地蔵堂&#34;,&#34;body&#34;:&#34;『静岡県磐田郡誌』は、慶岩寺の境内に仏堂1宇があり地蔵菩薩の石像を安置すること、その創立は天正年度（天正年間）にあたること、明治33年（1900年）9月28日に堂宇が倒壊し翌年4月18日に再建されたことを記しています。現在の年間行事に「北向地蔵尊大祭」があることから、境内で祀られる北向地蔵尊とこの地蔵堂の系譜的なつながりがうかがえますが、両者の同一性を明記した資料は現時点では確認できていません。&#34;,&#34;sources_note&#34;:&#34;『静岡県磐田郡誌』430コマ&#34;},{&#34;heading&#34;:&#34;永禄5年創建の見付の念仏道場&#34;,&#34;body&#34;:&#34;浄土宗の公式寺院検索には、山号を松光山として登録されています。静岡教区浄土宗青年会の寺院紹介によると、開山は金蓮社住誉上人能公大和尚で、永禄5年（1562年）の創建です。寺宝として阿弥陀三尊、両大師、釈迦涅槃図絵が挙げられています。&#34;},{&#34;heading&#34;:&#34;北向地蔵尊大祭&#34;,&#34;body&#34;:&#34;年中行事としては、1月の御忌会、2月15日の涅槃会、4月の花まつり、8月10日の山門大施餓鬼会に加え、8月23日に北向地蔵尊大祭が営まれています。境内の北向地蔵尊は地域の信仰を集める存在です。&#34;}],&#34;cultural_assets&#34;:[],&#34;danka_info&#34;:{&#34;annual_events&#34;:[{&#34;name&#34;:&#34;年中行事&#34;,&#34;timing&#34;:&#34;&#34;,&#34;note&#34;:&#34;御忌会（1月）、涅槃会（2月15日）、花まつり（4月）、山門大施餓鬼会（8月10日）、北向地蔵尊大祭（8月23日）&#34;}],&#34;parking&#34;:&#34;参拝・拝観用駐車場ありとの記載が浄土宗寺院検索(宗派公式)にある&#34;},&#34;visit_notes&#34;:&#34;本堂、境内、地蔵堂、説明板、書院案内を現地写真で確認しています。拝観時間や墓地・書院の利用条件は未確認のため、現地の表示と寺院関係者への配慮を優先してください。&#34;},{&#34;temple_id&#34;:&#34;iwata-0006&#34;,&#34;slug&#34;:&#34;daikenji-mitsuke&#34;,&#34;name&#34;:&#34;大見寺&#34;,&#34;name_kana&#34;:&#34;だいけんじ&#34;,&#34;aliases&#34;:[&#34;日照山光明院大見寺&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;浄土宗&#34;,&#34;address&#34;:&#34;静岡県磐田市見付2510番地の1&#34;,&#34;district_id&#34;:&#34;mitsuke&#34;,&#34;area&#34;:&#34;見付&#34;,&#34;main_deity&#34;:&#34;阿弥陀如来立像（宗派資料では「運慶作」と記されるが、伝承の域を出ない可能性があり要確認）&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;現地写真あり&#34;,&#34;detail_status&#34;:&#34;公開情報調査済み&#34;,&#34;history_summary&#34;:&#34;大見寺（日照山光明院大見寺）は磐田市見付にある浄土宗の寺院で、本尊は阿弥陀如来立像です。創建は鎌倉時代に遡ると伝えられ、境内一帯は今川氏時代に遠江支配の拠点となった見付端城の跡地で、周囲に土塁の一部が残ります。江戸時代中期に人力飛行を試みた「鳥人幸吉」こと浮田幸吉の墓があることでも知られます。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-12&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9063&#34;},{&#34;title&#34;:&#34;静岡教区浄土宗青年会「145 大見寺 磐田市見付」&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;山号院号（日照山光明院）、本尊阿弥陀如来立像（運慶作と表記）、開山法蓮社誠誉演甫上人、開基年次「正和四年(1345)」、寺宝の境内絵図面（元禄時代）を確認&#34;,&#34;url&#34;:&#34;https://jodo-ss.com/temple_list/145%E3%80%80%E5%A4%A7%E8%A6%8B%E5%AF%BA%E3%80%80%E7%A3%90%E7%94%B0%E5%B8%82%E8%A6%8B%E4%BB%98/&#34;},{&#34;title&#34;:&#34;浄土宗 寺院検索「大見寺」&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;浄土宗寺院であること、山号「日照山」・院号「光明院」、所在地（磐田市見付2510-1-1）を確認&#34;,&#34;url&#34;:&#34;https://otera.jodo.or.jp/temple/20-145/&#34;},{&#34;title&#34;:&#34;静岡県：歴史・観光・見所「大見寺（磐田市）」&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;鎌倉時代創建の伝承、見付端城と土塁、永禄12年（1569）家康侵攻、11代呑誉禿翁と良純親王供養塔、浮田幸吉の菩提寺、山門・本堂の建築形式を確認（典拠は磐田市教育委員会文化財課の現地案内板と明記）&#34;,&#34;url&#34;:&#34;https://www.sizutabi.com/iwata/daiken.html&#34;},{&#34;title&#34;:&#34;中遠昔ばなし 第89話「鳥人幸吉の墓（磐田市）」（中遠地域広域行政組合系サイト）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;浮田幸吉の経歴（天明6年の滑空、駿府追放、見付宿で飯屋）、弘化4年（1847）8月21日に90歳で死去、二番町大見寺墓地の「演誉清岳信士」の墓石と過去帳記載、境内の2分の1模型を確認（出典『磐田ものがたり』）&#34;,&#34;url&#34;:&#34;https://chuen.net/mukashi/mukashi_089.html&#34;},{&#34;title&#34;:&#34;いわた文化財だより第232号&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;令和6年7月発行。企画展「磐田の城と戦国大名―今川から徳川へ―」の紹介中で「大見寺絵図（見付古城図）【大見寺所蔵】」として掲載。&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/_res/projects/default_project/_page_/001/002/024/dayori232.pdf&#34;},{&#34;title&#34;:&#34;いわた文化財だより第247号&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;令和7年10月発行。磐田市歴史文書館第29回企画展関連イベント「見付宿を歩こう」の予定コースに大見寺を掲載。&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/_res/projects/default_project/_page_/001/002/024/dayori247.pdf&#34;}],&#34;research_todos&#34;:[&#34;宗派資料の開基年次「正和四年(1345)」の表記矛盾（正和4年=1315年）を寺院・宗派資料で確認する&#34;,&#34;本尊阿弥陀如来立像の「運慶作」という記載の典拠と学術的評価を確認する&#34;,&#34;見付端城の土塁遺構の現況と市の遺跡台帳上の扱いを確認する&#34;,&#34;良純法親王供養塔の現地確認と分骨伝承の典拠調査&#34;,&#34;寺宝「境内絵図面（元禄時代）」の内容確認&#34;,&#34;浮田幸吉の見付での事績について磐田市誌・展示資料を確認する&#34;,&#34;創建年「正和四年(1345)」の年号・西暦の矛盾を磐田市誌等の地誌で確認する&#34;,&#34;本尊阿弥陀如来立像の「運慶作」伝承の裏付け（文化財指定の有無等）を確認する&#34;,&#34;年中行事の具体的な日程は宗派公式の寺院検索サイトでは確認できず、現地・寺院への確認が必要&#34;,&#34;永代供養・護持会等の檀家向け情報は未確認&#34;],&#34;founded_period&#34;:&#34;開山は法蓮社誠誉演甫上人。宗派資料の創建年次欄は「正和四年(1345)」と表記されるが、正和4年は西暦1315年にあたり年号と西暦が一致しないため要確認&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;創建と見付端城&#34;,&#34;body&#34;:&#34;現地案内板をもとにした郷土サイトによれば、大見寺の創建は鎌倉時代にまで遡ると伝えられます。今川氏の支配下では当地に見付端城が築かれ、遠江支配の拠点となりました。永禄12年（1569年）に徳川家康が遠江に侵攻するとその役割は終わりましたが、現在でも境内の周囲には土塁の一部が残っています。静岡教区浄土宗青年会の寺院紹介では、開山上人を法蓮社誠誉演甫上人と記し、寺宝として元禄時代の境内絵図面が伝わるとしています。&#34;},{&#34;heading&#34;:&#34;良純法親王供養塔と徳翁院との縁&#34;,&#34;body&#34;:&#34;11世の呑誉禿翁上人は、後陽成天皇の第8皇子である良純法親王の弟子だった人物と伝えられ、親王の死後に分骨を賜り境内に供養塔を建立したと紹介されています。また呑誉禿翁上人は、同じ見付の浄土宗寺院・徳翁院の開山上人でもあります。&#34;},{&#34;heading&#34;:&#34;鳥人幸吉（浮田幸吉）の墓&#34;,&#34;body&#34;:&#34;江戸時代中期の天明6年（1786年）に岡山で日本初期の人力滑空を試みたと伝わる浮田幸吉は、その咎で所払いとなり、駿府でも再び空を飛んで追放された後、見付宿に移り住んで飯屋を営んだと伝えられます。中遠地域の広域行政組合が公開する郷土読み物（『磐田ものがたり』より）によれば、幸吉は弘化4年（1847年）8月21日に90歳で没し、二番町の大見寺墓地に「演誉清岳信士」と刻まれた墓石が現存し、過去帳にも記載されているとされます。境内には幸吉の飛行機の模型（実物の約2分の1）も置かれています。&#34;},{&#34;heading&#34;:&#34;誠誉演甫上人の開山と創建年の謎&#34;,&#34;body&#34;:&#34;浄土宗の公式寺院検索には、山号を日照山、院号を光明院として登録されています。静岡教区浄土宗青年会の寺院紹介によると、開山は法蓮社誠誉演甫上人で、創建年次の欄には「正和四年(1345)」と記されています。ただし正和4年は西暦1315年にあたり、1345年は興国6年・康永4年にあたるため、年号と西暦のどちらが正しいかは資料上確認できません。いずれにしても鎌倉時代末期から南北朝時代にさかのぼる古い草創が伝えられています。&#34;},{&#34;heading&#34;:&#34;運慶作と伝える本尊と元禄の境内絵図面&#34;,&#34;body&#34;:&#34;本尊は阿弥陀如来立像で、宗派資料では運慶作と記されています。寺宝としてはこのほかに元禄時代の境内絵図面が保管されており、江戸時代中期の伽藍の姿を知る手がかりとなっています。年中行事は元旦の修正会、3月の御忌会、8月9日の施餓鬼会、10月の十夜法要で、毎週火曜には吉水流の詠唱が行われています。&#34;},{&#34;heading&#34;:&#34;『いわた文化財だより』からの補足&#34;,&#34;body&#34;:&#34;大見寺（磐田市見付）は、近世の見付の様子を描いた「大見寺絵図（見付古城図）」を所蔵しており、令和6年（2024年）7月27日から8月25日まで磐田市立中央図書館で開催された企画展「磐田の城と戦国大名―今川から徳川へ―」で展示された。 大見寺は、旧東海道見付宿の歴史をたどる磐田市歴史文書館主催のウォーキングイベント「見付宿を歩こう」（令和7年〈2025年〉10月実施）のコースにおいて、宣光寺・旧見付学校・淡海国玉神社・見付宿脇本陣大三河屋門などとともに巡られる史跡の一つとして紹介されている。&#34;}],&#34;danka_info&#34;:{&#34;annual_events&#34;:[{&#34;name&#34;:&#34;年中行事&#34;,&#34;timing&#34;:&#34;&#34;,&#34;note&#34;:&#34;修正会（元旦）、御忌会（3月）、施餓鬼会（8月9日）、十夜法要（10月）、詠唱（毎週火曜）&#34;}],&#34;parking&#34;:&#34;駐車場利用可との記載が浄土宗寺院検索(宗派公式)にある&#34;},&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0007&#34;,&#34;slug&#34;:&#34;zendoji-mitsuke&#34;,&#34;name&#34;:&#34;善導寺&#34;,&#34;name_kana&#34;:&#34;ぜんどうじ&#34;,&#34;aliases&#34;:[&#34;玉光山稱名院善導寺&#34;,&#34;玉光山称名院善導寺&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;浄土宗&#34;,&#34;address&#34;:&#34;静岡県磐田市見付1番地の10&#34;,&#34;district_id&#34;:&#34;mitsuke&#34;,&#34;area&#34;:&#34;見付&#34;,&#34;main_deity&#34;:&#34;未確認&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;現地写真あり&#34;,&#34;detail_status&#34;:&#34;公開情報調査済み&#34;,&#34;history_summary&#34;:&#34;善導寺（玉光山稱名院善導寺）は磐田市見付にある浄土宗の寺院で、南北朝時代の応安年間の開基と伝わります。もとは中泉（現在の磐田駅北口前）に境内を構えていましたが、駅前開発に伴い昭和42年（1967年）に現在地へ移転しました。旧境内に残る推定樹齢700年の大樟は静岡県指定天然記念物で、磐田駅前のシンボルになっています。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-12&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9065&#34;},{&#34;title&#34;:&#34;静岡教区浄土宗青年会「143 善導寺 磐田市見付」&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;山号院号（玉光山稱名院）、開山善蓮社岌誉照山廊道上人、開基応安6年（1373）、寺宝（弥陀三尊・善導大師・法然上人各立像、大涅槃絵軸=元禄2年・宗春輝信兄弟筆）を確認&#34;,&#34;url&#34;:&#34;https://jodo-ss.com/temple_list/143%E3%80%80%E5%96%84%E5%B0%8E%E5%AF%BA%E3%80%80%E7%A3%90%E7%94%B0%E5%B8%82%E8%A6%8B%E4%BB%98/&#34;},{&#34;title&#34;:&#34;浄土宗 寺院検索「善導寺」&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;浄土宗寺院であること、所在地（磐田市見付1番地10号）を確認&#34;,&#34;url&#34;:&#34;https://otera.jodo.or.jp/temple/20-143/&#34;},{&#34;title&#34;:&#34;しずおか文化財ナビ「善導寺の大樟」（静岡県公式）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;県指定天然記念物、指定日1959年4月14日、所在地磐田市中泉596、目通り8.20m・高さ28m・樹勢旺盛、所有者磐田市を確認&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/kankosports/bunkageijutsu/bunkazai/1002825/1041003/1041884/1004985/1021419.html&#34;},{&#34;title&#34;:&#34;静岡県：歴史・観光・見所「善導寺の大樟（磐田市）」&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;応安4年（1371）旭光房開山の伝承、昭和42年（1967）の見付東大久保への移転（磐田駅前開発工事に伴う）、大樟が旧地に残った経緯、遠州一姫・福地蔵第8番札所との記載を確認（典拠は磐田市教育委員会の現地案内板と明記）&#34;,&#34;url&#34;:&#34;https://www.sizutabi.com/iwata/zendou.html&#34;},{&#34;title&#34;:&#34;県指定文化財｜磐田市公式ウェブサイト&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;県指定文化財の分類・指定日・所有者を一覧表で確認&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/sports_midokoro/bunkazai/bunkazainitsuite/1002038.html&#34;},{&#34;title&#34;:&#34;磐田市文化財一覧オープンデータ（LinkData・CC BY）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;磐田市公開の文化財一覧オープンデータ。名称・よみ・所在地により寺院と文化財の対応を照合&#34;,&#34;url&#34;:&#34;http://linkdata.org/work/rdf1s10219i&#34;},{&#34;title&#34;:&#34;県指定文化財 善導寺の大樟｜磐田市公式ウェブサイト&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;磐田市の個別解説。かつての善導寺の墓所の目印として植えられたと伝えられる旨、駅前の賑わいを見守ってきた旨を確認。&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/sports_midokoro/bunkazai/kenshitei/1002065.html&#34;},{&#34;title&#34;:&#34;卍玉光山 称名院 善導寺｜静岡県磐田市&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;聖観世音大祭・朝観音祭礼・十夜法要の日程情報(直接アクセス不可のため検索結果経由での参考情報)&#34;,&#34;url&#34;:&#34;https://yaokami.jp/1226545/&#34;}],&#34;research_todos&#34;:[&#34;本尊（阿弥陀如来とみられる）の正式な確認（郷土サイトには本尊阿弥陀如来との記載があるが公式資料未確認）&#34;,&#34;創建年の2説（応安4年/応安6年）と開山名（岌誉照山廊道上人と旭光房の関係）を寺院に確認する&#34;,&#34;郷土サイトに「遠州一姫・福地蔵第8番札所」との記載があるため、霊場公式資料での裏付けを取る&#34;,&#34;「大樟は徳大寺公の墓所の目印として植樹された」という伝承の典拠を調べる&#34;,&#34;大樟の計測値が資料により異なる（県資料: 目通り8.2m・高さ28m／郷土サイト: 樹高18.3m・根元幹周32.9m）ため最新の計測情報を確認する&#34;,&#34;移転前後の境内地の変遷を磐田市誌・駅前開発資料で確認する&#34;,&#34;本尊は宗派公式資料に明記なし（寺宝筆頭に弥陀三尊立像とあるが本尊とは断定できない）。現地確認または市誌で補完する&#34;,&#34;要確認（文化財DB照合）: address: 県指定「善導寺の大樟」の所在地は中泉596（磐田駅前）で、現在の善導寺（見付1番地の10）の境内ではない。寺の旧所在地との関係に注意。&#34;,&#34;善導寺の移転経緯（中泉の旧地から現在地への移転時期）を磐田市誌等で確認する。&#34;,&#34;永代供養・護持会・駐車場等の情報は未確認&#34;,&#34;聖観世音大祭(4/17)・朝観音祭礼(8/10)の日程は原典ページ(yaokami.jp、アクセス不可)を直接確認できておらず、寺院への確認が望ましい&#34;],&#34;founded_period&#34;:&#34;応安6年（1373年）創建。開山は善蓮社岌誉照山廊道上人（静岡教区浄土宗青年会の寺院紹介による）&#34;,&#34;heritage_status&#34;:&#34;旧境内地（磐田駅北口前）の大樟が静岡県指定天然記念物「善導寺の大樟」（1959年4月14日指定）&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;創建&#34;,&#34;body&#34;:&#34;静岡教区浄土宗青年会の寺院紹介では、開山上人を善蓮社岌誉照山廊道上人、開基年次を応安6年（1373年）と記しています。一方、現地案内板をもとにした郷土サイトには、応安4年（1371年）に旭光房が浄土宗の祖師・善導大師の像を背負って当地を訪れた際に開かれたと伝わる、との記述もあり、創建年には資料により幅があります。寺宝としては弥陀三尊・善導大師・法然上人の各立像と、元禄2年（1689年）に絵師の宗春・輝信兄弟が描いた大涅槃絵軸が伝えられています。&#34;},{&#34;heading&#34;:&#34;駅前開発による移転と大樟&#34;,&#34;body&#34;:&#34;善導寺は長く現在の磐田駅北口前（中泉）に境内を構えていましたが、駅前の開発工事に伴い昭和42年（1967年）に見付（東大久保）へ移転しました。境内にあった推定樹齢700年の大樟は移転させることが現実的でなかったため旧地に留まり、昭和34年（1959年）4月14日に静岡県指定天然記念物「善導寺の大樟」に指定されています。県の文化財資料では目通り8.20メートル、高さ28メートル、所有者は磐田市と記されています。大樟は現在も磐田駅前のランドマークとして親しまれています。&#34;},{&#34;heading&#34;:&#34;応安6年開山の古刹&#34;,&#34;body&#34;:&#34;浄土宗の公式寺院検索には、山号を玉光山、院号を称名院として登録されています。静岡教区浄土宗青年会の寺院紹介によると、開山は善蓮社岌誉照山廊道上人で、応安6年（1373年）の創建です。南北朝時代にさかのぼる、見付でも創建年の明確な浄土宗寺院の1つです。&#34;},{&#34;heading&#34;:&#34;元禄2年の大涅槃絵軸&#34;,&#34;body&#34;:&#34;寺宝としては、弥陀三尊・善導大師・法然上人の各立像と、元禄2年（1689年）に絵師の宗春・輝信兄弟が描いた大涅槃絵軸が伝わっています。年中行事は修正会（檀信徒新年会）、御忌会、施餓鬼会、十夜法要で、定例行事として吉水流詠唱が行われています。西遠組に属します。&#34;},{&#34;heading&#34;:&#34;文化財資料からの補足&#34;,&#34;body&#34;:&#34;磐田駅前（中泉596）に立つ「善導寺の大樟」は、目通り周囲約8.2メートルから9メートル、樹高約18メートルから28メートルと記録される大樹で、昭和34年（1959年）4月14日に静岡県指定天然記念物となりました。現在の所有者は磐田市です。 磐田市の解説によれば、この大樟はかつての善導寺の墓所の目印として植えられたと伝えられ、中泉駅（現磐田駅）開設以来、駅前の賑わいを見守り続けてきた木とされています。&#34;}],&#34;cultural_assets&#34;:[{&#34;name&#34;:&#34;善導寺の大樟（善導寺大クス）&#34;,&#34;designation&#34;:&#34;静岡県指定天然記念物&#34;,&#34;summary&#34;:&#34;旧境内地である磐田駅北口前（中泉）に立つ推定樹齢700年のクスノキ。昭和34年（1959年）4月14日指定で、県の文化財資料では目通り8.20メートル、高さ28メートル、樹勢旺盛と記されています。現在の所有者は磐田市です。&#34;},{&#34;name&#34;:&#34;善導寺の大クス（善導寺大樟）&#34;,&#34;designation&#34;:&#34;静岡県指定天然記念物&#34;,&#34;summary&#34;:&#34;昭和34年（1959年）4月14日指定。旧境内地の中泉（磐田駅前）に立ち、現在の所有者は磐田市です。昭和42年（1967年）の寺の移転後も旧地に残り、駅前のシンボルとなっています。&#34;},{&#34;name&#34;:&#34;善導寺の大樟&#34;,&#34;designation&#34;:&#34;静岡県指定天然記念物&#34;,&#34;summary&#34;:&#34;磐田駅前に立つクスノキの大樹。かつての善導寺の墓所の目印として植えられたと伝えられる。指定内容は目通り8.2メートル、高さ28メートル、枝下面積850平方メートル。昭和34年（1959年）4月14日指定。所有者は磐田市。&#34;}],&#34;danka_info&#34;:{&#34;annual_events&#34;:[{&#34;name&#34;:&#34;年中行事&#34;,&#34;timing&#34;:&#34;&#34;,&#34;note&#34;:&#34;修正会（檀信徒新年会）、御忌会、施餓鬼会、十夜法要、吉水流詠唱（定例）&#34;},{&#34;name&#34;:&#34;修正会(檀信徒新年会)&#34;,&#34;timing&#34;:&#34;1月&#34;,&#34;note&#34;:&#34;静岡教区浄土宗青年会の寺院紹介ページによる&#34;},{&#34;name&#34;:&#34;聖観世音大祭&#34;,&#34;timing&#34;:&#34;4月17日&#34;,&#34;note&#34;:&#34;境内観音堂の聖観世音菩薩の祭礼とされる。複数の情報源で日程が一致するが、原典ページ自体は直接確認できず参考情報にとどめる&#34;},{&#34;name&#34;:&#34;朝観音祭礼&#34;,&#34;timing&#34;:&#34;8月10日&#34;,&#34;note&#34;:&#34;早朝参拝で健脚祈願の伝承があるとされる。原典ページは直接確認できず参考情報にとどめる&#34;},{&#34;name&#34;:&#34;施餓鬼会&#34;,&#34;timing&#34;:&#34;11月23日&#34;,&#34;note&#34;:&#34;十夜法要とあわせて実施されるとされる&#34;},{&#34;name&#34;:&#34;十夜法要&#34;,&#34;timing&#34;:&#34;11月21日〜23日&#34;,&#34;note&#34;:&#34;子供会・念佛講とあわせて実施。静岡教区浄土宗青年会の寺院紹介ページによる&#34;}],&#34;organization&#34;:&#34;念佛講(吉水流詠唱)等の講中活動が行われているとされる(静岡教区浄土宗青年会の寺院紹介ページによる)&#34;}},{&#34;temple_id&#34;:&#34;iwata-0008&#34;,&#34;slug&#34;:&#34;mantokuji-nakaizumi&#34;,&#34;name&#34;:&#34;満徳寺&#34;,&#34;name_kana&#34;:&#34;まんとくじ&#34;,&#34;aliases&#34;:[&#34;光恩山満徳寺&#34;,&#34;中泉富士（本堂の通称）&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;真宗大谷派&#34;,&#34;address&#34;:&#34;静岡県磐田市中泉1丁目4番地7&#34;,&#34;district_id&#34;:&#34;nakaizumi&#34;,&#34;area&#34;:&#34;中泉&#34;,&#34;main_deity&#34;:&#34;阿弥陀如来&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;公開情報調査済み&#34;,&#34;history_summary&#34;:&#34;満徳寺（光恩山満徳寺）は磐田市中泉にある真宗大谷派の寺院で、本尊は阿弥陀如来です。屋根の描く線と高さから「中泉富士」と呼ばれた本堂を中心に、享和3年（1803年）建立の経蔵、文政9年（1826年）建立の水屋が歴史を伝えています。本堂には屋台彫刻で知られる彫刻師・早瀬利三郎（朝雲）による龍や牡丹の彫刻が残ります。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9067&#34;},{&#34;title&#34;:&#34;磐田市観光協会「まちなか歴史と文化の新発見 ありがた歩記 中泉編」（PDF）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;山号（光恩山）、宗派（真宗大谷派）、本尊（阿弥陀如来）、本堂の通称「中泉富士」、水屋=文政9年（1826）建立、経蔵=享和3年（1803）建立、早瀬利三郎（朝雲）の彫刻、経蔵天井画81枚、黄檗版一切経、林鶴梁の義母の墓所が満徳寺にあることを確認（PDF本文を抽出して確認）&#34;,&#34;url&#34;:&#34;https://kanko-iwata.jp/wp2/wp-content/uploads/2023/06/B4_nakaizumi.pdf&#34;},{&#34;title&#34;:&#34;国税庁法人番号公表サイト 検索結果（満徳寺／静岡県／磐田市）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;名称「満徳寺」・都道府県「静岡県」・市区町村「磐田市」で部分一致検索し1件ヒット。法人番号5080405005466、商号又は名称「満徳寺」、所在地「静岡県磐田市中泉１丁目４番地７」（全角算用数字表記）を確認。&#34;,&#34;url&#34;:&#34;https://www.houjin-bangou.nta.go.jp/&#34;}],&#34;research_todos&#34;:[&#34;創建年代・開基の確認（公開Web情報では確認できず。真宗大谷派名簿・磐田市誌の確認が必要）&#34;,&#34;本堂の建立年代（「建設当時」の具体年）を確認する&#34;,&#34;彫刻師・早瀬利三郎（朝雲）の事績と本堂彫刻の制作年を調べる&#34;,&#34;黄檗版一切経の現況（所在・保存状態）を確認する&#34;,&#34;林鶴梁の義母の墓の現地確認と、林鶴梁在任期（安政地震対応）との関係整理&#34;,&#34;所在地表記の揺れ（中泉1丁目4-7と中泉545）を登記・名簿で確認する&#34;,&#34;要確認（法人・行政資料照合）: address: 静岡県知事所轄宗教法人名簿（令和5年3月31日現在、meibo4.pdf）磐田市欄の記載は「磐田市中泉一丁目４番地７」で、丁目を漢数字「一」で表記している。DBの表記「静岡県磐田市中泉1丁目4番地7」は算用数字表記で、所在地そのものは同一だが丁目部分の表記方法が異なる。国税庁法人番号公表サイトで確認した登記上の所在地は「静岡県磐田市中泉１丁目４番地７」（全角算用数字）であり、DBの算用数字表記に近い。名称・宗派（真宗大谷派）は名簿・DBとも一致し、相違なし。&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;「中泉富士」と呼ばれた本堂と伽藍&#34;,&#34;body&#34;:&#34;磐田市観光協会の寺社案内によれば、本堂は建設当時、屋根が描く曲線と高さから「中泉富士」と呼ばれました。境内には文政9年（1826年）建立の水屋、享和3年（1803年）建立の経蔵があり、寺の歴史を物語っています。本堂には屋台の彫刻等で有名な早瀬利三郎（朝雲）による、豪快なノミさばきの「龍」や「牡丹」などの彫刻が随所に施されています。また黄檗版一切経を収めていた経蔵の天井には、百合や水仙などの花の絵が81枚描かれ、約200年を経ても鮮やかな色彩が残されています。&#34;},{&#34;heading&#34;:&#34;中泉代官ゆかりの墓所&#34;,&#34;body&#34;:&#34;中泉は江戸時代に幕府直轄領を治める中泉代官所（陣屋）が置かれた町で、満徳寺にはその歴史との接点もあります。磐田市観光協会の寺社案内によれば、幕末の中泉代官を務めた林鶴梁の義母は中泉で病没し、その墓所が満徳寺にあります。&#34;},{&#34;heading&#34;:&#34;発掘調査・考古資料からの補足&#34;,&#34;body&#34;:&#34;満徳寺には、安政の大地震（1854年）の被災者救済にあたった中泉代官・林鶴梁の義母の墓がある。&#34;}],&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0009&#34;,&#34;slug&#34;:&#34;saiganji-nakaizumi&#34;,&#34;name&#34;:&#34;西願寺&#34;,&#34;name_kana&#34;:&#34;さいがんじ&#34;,&#34;aliases&#34;:[&#34;弘誓山西願寺&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;真宗大谷派&#34;,&#34;address&#34;:&#34;静岡県磐田市中泉254番地の1&#34;,&#34;district_id&#34;:&#34;nakaizumi&#34;,&#34;area&#34;:&#34;中泉&#34;,&#34;main_deity&#34;:&#34;阿弥陀如来&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;公開情報調査済み&#34;,&#34;history_summary&#34;:&#34;西願寺（弘誓山西願寺）は磐田市中泉にある真宗大谷派の寺院で、本尊は阿弥陀如来です。山門は徳川家康の別荘であった旧中泉御殿の裏門を移築したもので、磐田市指定有形文化財（建造物）となっています。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9069&#34;},{&#34;title&#34;:&#34;磐田市観光協会「西願寺」&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;真宗大谷派・本尊阿弥陀如来、山門＝旧中泉御殿裏門（市指定文化財）、中泉御殿の廃止と表門=西光寺・裏門=西願寺への移築、薬医門の様式を確認&#34;,&#34;url&#34;:&#34;https://kanko-iwata.jp/spot/tanoshimu-10036/&#34;},{&#34;title&#34;:&#34;静岡県：歴史・観光・見所「西願寺（磐田市）」&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;現地案内板（磐田市教育委員会文化財課）の全文転記を確認。天正12年（1584）の御殿建築、約30年間の使用、寛文年間の廃止、主殿が本堂として使用後に改築で現存しないこと、平成17年11月21日の市指定を確認&#34;,&#34;url&#34;:&#34;https://www.sizutabi.com/iwata/seigan.html&#34;},{&#34;title&#34;:&#34;磐田市公式ウェブサイト「市指定文化財」&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;建造物「旧中泉御殿裏門」（中泉）が市指定文化財一覧に掲載されていることを確認&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/sports_midokoro/bunkazai/bunkazainitsuite/1002039.html&#34;},{&#34;title&#34;:&#34;磐田市観光協会「まちなか歴史と文化の新発見 ありがた歩記 中泉編」（PDF）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;山号「弘誓山」の表記、中泉御殿裏門移築の解説を確認（PDF本文を抽出して確認）&#34;,&#34;url&#34;:&#34;https://kanko-iwata.jp/wp2/wp-content/uploads/2023/06/B4_nakaizumi.pdf&#34;},{&#34;title&#34;:&#34;いわた文化財だより第235号&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;令和6年10月1日発行。P4「市指定文化財 旧中泉御殿裏門（西願寺）」の写真キャプションおよび「文化の秋！親子文化財めぐり」（磐田市中泉周辺・西願寺など）の案内。&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/_res/projects/default_project/_page_/001/002/024/dayori235.pdf&#34;},{&#34;title&#34;:&#34;磐田市文化財保存活用地域計画（令和6年9月）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;p.54 中泉地区「旧中泉御殿裏門（西願寺）」&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/_res/projects/default_project/_page_/001/009/747/keikaku202409.pdf&#34;}],&#34;research_todos&#34;:[&#34;西願寺自体の創建年代・開基を確認する（公開Web情報では確認できず）&#34;,&#34;中泉御殿の主殿が本堂として使われた時期と改築の経緯を磐田市誌で確認する&#34;,&#34;中泉御殿の廃止年について資料間の記述（寛文年間／寛文10年=1670年）を整理する&#34;,&#34;観光協会の中泉寺社マップに「無住」「えん魔さまと奪衣婆の石像」等の記述があるが、どの寺院を指すかレイアウト上判別できなかったため、西願寺の現況（住職の有無・境内石像）を現地確認する&#34;,&#34;いわた文化財だより第84号「ふるさと磐田の指定・登録文化財(8) 西光寺表門と旧中泉御殿裏門」（平成24年3月発行）は総目次のタイトルのみ確認。同一記事内で紹介された「西光寺表門」がsaikoji-mitsuke・saikoji-kaketsukaのいずれの西光寺を指すか本文未読のため特定できず（電子書籍サービス収録分でビューアー未読）。&#34;],&#34;heritage_status&#34;:&#34;市指定文化財あり（山門＝旧中泉御殿裏門が磐田市指定有形文化財・建造物）&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;旧中泉御殿裏門の移築&#34;,&#34;body&#34;:&#34;現地案内板（磐田市教育委員会文化財課）をもとにした資料によれば、西願寺の山門は旧中泉御殿の裏門を移築したものです。旧中泉御殿は、徳川家康が浜松城主であった天正12年（1584年）に現在の磐田駅南の地域に別荘として建築され、以後約30年間使用されて寛文年間に廃止されました。この間、家康は鷹狩りを兼ねて休養のためたびたび磐田を訪れています。御殿の廃止後、表門は見付の西光寺へ、裏門は西願寺へ移築されました。主殿も西願寺に移されて本堂として使用されていましたが、改築され現存しません。山門は切妻・本瓦葺きの薬医門で、桃山から江戸初期の様式に見合う簡素な彫り物が施されており、安土桃山時代の城門建築の遺構として貴重なことから、平成17年（2005年）11月21日に磐田市指定有形文化財（建造物）に指定されています。磐田市の市指定文化財一覧にも建造物「旧中泉御殿裏門」（中泉）として掲載されています。&#34;},{&#34;heading&#34;:&#34;文化財資料からの補足&#34;,&#34;body&#34;:&#34;西願寺が所有する「旧中泉御殿裏門」は、徳川家康が造営した中泉御殿（館）に使われた薬医門で、江戸時代初頭の建造物です。平成17年（2005年）11月21日に磐田市指定有形文化財（建造物）に指定されています。&#34;},{&#34;heading&#34;:&#34;『いわた文化財だより』からの補足&#34;,&#34;body&#34;:&#34;西願寺（磐田市中泉）には、磐田市指定文化財「旧中泉御殿裏門」が現存する。 西願寺は、遠江国府や中泉御殿など磐田の歴史に深く関わる文化財を巡る磐田市文化財課主催の親子向け見学会「文化の秋！親子文化財めぐり」（令和6年〈2024年〉11月実施）のコースにおいて、御殿遺跡公園などとともに紹介されている。&#34;},{&#34;heading&#34;:&#34;発掘調査・考古資料からの補足&#34;,&#34;body&#34;:&#34;西願寺の山門は、寛文10年（1670年）に廃止された中泉御殿の裏門を移築したもので、平成17年（2005年）11月21日に磐田市指定有形文化財（建造物）に指定された。切妻造・本瓦葺・一間一戸の薬医門で、安土桃山時代から江戸時代初期の城門建築の様式を残すとされる。&#34;}],&#34;cultural_assets&#34;:[{&#34;name&#34;:&#34;旧中泉御殿裏門（西願寺山門）&#34;,&#34;designation&#34;:&#34;磐田市指定有形文化財（建造物）&#34;,&#34;summary&#34;:&#34;徳川家康が天正12年（1584年）に建てた中泉御殿の裏門を移築した薬医門。桃山から江戸初期の様式を伝える城門建築の遺構として、平成17年（2005年）11月21日に市指定となりました。&#34;},{&#34;name&#34;:&#34;旧中泉御殿裏門&#34;,&#34;designation&#34;:&#34;磐田市指定有形文化財（建造物）&#34;,&#34;summary&#34;:&#34;徳川家康が造営した中泉御殿に使われた薬医門。江戸時代初頭の建造物。平成17年（2005年）11月21日指定。&#34;}]},{&#34;temple_id&#34;:&#34;iwata-0010&#34;,&#34;slug&#34;:&#34;gyosenji-mitsuke&#34;,&#34;name&#34;:&#34;行泉寺&#34;,&#34;name_kana&#34;:&#34;ぎょうせんじ&#34;,&#34;aliases&#34;:[&#34;飛龍山行泉寺&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;真宗高田派&#34;,&#34;address&#34;:&#34;静岡県磐田市見付3080番地の2&#34;,&#34;district_id&#34;:&#34;mitsuke&#34;,&#34;area&#34;:&#34;見付&#34;,&#34;main_deity&#34;:&#34;阿弥陀如来（『静岡県磐田郡誌』真宗寺院一覧表による）&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;現地写真あり&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;行泉寺は磐田市見付にある真宗高田派の寺院で、『静岡県磐田郡誌』（1921年）によれば山号は飛龍山、三重県津市の高田本山専修寺の末寺です。同誌は天正元年（1573年）に僧龍山が一宇を造立したのを始まりと記しており、本尊は阿弥陀如来です。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9071&#34;},{&#34;title&#34;:&#34;『静岡県磐田郡誌』（静岡県磐田郡教育会編、1921年）470コマ・422コマ&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション。由緒（470コマ）に飛龍山・高田派専修寺末・天正元年僧龍山造立、一覧表（422コマ）に本尊阿弥陀如来・境内513坪・檀徒30戸&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680/1/470&#34;},{&#34;title&#34;:&#34;磐田市観光協会「磐田 中泉ありがた歩記」（寺社散策マップ）&#34;,&#34;type&#34;:&#34;地域資料&#34;,&#34;note&#34;:&#34;地図帖に加茂川近くの旧東海道沿いの寺として行泉寺を掲載&#34;,&#34;url&#34;:&#34;https://kanko-iwata.jp/wp2/wp-content/uploads/2023/06/B4_nakaizumi.pdf&#34;}],&#34;research_todos&#34;:[&#34;真宗高田派本山・専修寺の寺院名簿や宗派資料で行泉寺の由緒を確認する&#34;,&#34;磐田市誌・見付宿関係の郷土資料で行泉寺の記述を探す（磐田市立図書館レファレンス活用）&#34;,&#34;見付本町という所在地から旧東海道見付宿との関係を調べる&#34;,&#34;現地の掲示・過去帳等による創建年代・開基の確認&#34;,&#34;山号・本尊の確認（公開Web情報では確認できず）&#34;,&#34;郡誌の所在地表記「中泉町中泉字南裏」と現住所（見付3080番地の2）の関係（移転の有無）の確認&#34;,&#34;開山龍山と創建期の伝来（高田派としての由緒）に関する追加史料の探索&#34;,&#34;御本尊・堂宇の現況確認&#34;],&#34;founded_period&#34;:&#34;天正元年（1573年）、僧龍山による一宇造立（『静岡県磐田郡誌』による）&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;『静岡県磐田郡誌』にみる由緒&#34;,&#34;body&#34;:&#34;『静岡県磐田郡誌』（1921年）の浄土真宗寺院の由緒には、行泉寺は飛龍山と号し、高田派に属して（伊勢国の）専修寺の末寺であること、天正元年（1573年）に僧龍山が一宇を造立したのを始めとすることが記されています。同誌の真宗寺院一覧表でも山号飛龍山・本尊阿弥陀如来・開山龍山とされ、1921年当時の境内地は513坪、檀徒は30戸でした。磐田市域の真宗寺院は東西本願寺系（大谷派・本願寺派）が多い中で、親鸞の高弟真仏を祖とする高田派に属する点が特徴です。なお同誌は所在地を「中泉町中泉字南裏」と記しており、現在の所在地である見付との異同（移転または大字境の変更の有無）を伝える公開資料は現時点では確認できていません。&#34;,&#34;sources_note&#34;:&#34;『静岡県磐田郡誌』470コマ（由緒）・422コマ（真宗寺院一覧表）&#34;},{&#34;heading&#34;:&#34;旧東海道沿いの寺&#34;,&#34;body&#34;:&#34;磐田市観光協会の寺社散策マップ「磐田 中泉ありがた歩記」の地図帖には、加茂川近くの旧東海道沿いに行泉寺が掲載されています。見付宿から中泉の陣屋町へ向かう旧街道筋にあたる立地で、江戸時代の中泉代官・林鶴梁の日記にも見付宿から中泉へ至る同じ道筋の様子が記されています。&#34;,&#34;sources_note&#34;:&#34;磐田市観光協会「磐田 中泉ありがた歩記」&#34;}],&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0011&#34;,&#34;slug&#34;:&#34;kindaiji-tenryu&#34;,&#34;name&#34;:&#34;金台寺&#34;,&#34;name_kana&#34;:&#34;きんだいじ&#34;,&#34;aliases&#34;:[&#34;嶺松山金台寺&#34;,&#34;金臺寺&#34;,&#34;こんたいじ&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;時宗&#34;,&#34;address&#34;:&#34;静岡県磐田市天竜110番地&#34;,&#34;district_id&#34;:&#34;nanbu&#34;,&#34;area&#34;:&#34;南部&#34;,&#34;main_deity&#34;:&#34;阿弥陀如来（『静岡県磐田郡誌』による。遠江四十九薬師霊場の札所尊は薬師如来です）&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;金台寺は磐田市天竜にある時宗（遊行派）の寺院で、遠江四十九薬師霊場の第3番札所です。『静岡県磐田郡誌』（1921年）によれば見付の時宗寺院・省光寺の末寺で、本尊は阿弥陀如来、同誌の一覧表は文明4年（1472年）9月の創立、開山を連阿と記します。現在は無住で省光寺が管理し、境内には閻魔と奪衣婆の石像があります。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9073&#34;},{&#34;title&#34;:&#34;日本各地の巡礼・巡拝霊場の紹介「遠江四十九薬師霊場」&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;第3番札所「嶺松山 金台寺（時宗・磐田市天竜）」、備考「省光寺の管理」、霊場の開創（享保10年の御詠歌現存・昭和52年奉賛会発足）を本文で確認&#34;,&#34;url&#34;:&#34;https://nippon-reijo.jimdofree.com/掲載霊場の一覧/薬師霊場/遠江四十九薬師霊場/&#34;},{&#34;title&#34;:&#34;磐田市公式ウェブサイト「市指定文化財」&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;書跡「伝一遍上人六字名号」（所在地・見付）が市指定文化財であることを確認。ただし所蔵寺院名は一覧に記載がなく、金台寺との関係は未確認&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/sports_midokoro/bunkazai/bunkazainitsuite/1002039.html&#34;},{&#34;title&#34;:&#34;『静岡県磐田郡誌』（静岡県磐田郡教育会編、1921年）472コマ・423コマ&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション。由緒（472コマ）に遊行派・省光寺末・本尊阿弥陀如来・旧地名天龍字蛭子森、一覧表（423コマ）に山号嶺松山・文明4年9月創立・開山連阿・境内474坪・住職欄空欄&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680/1/472&#34;},{&#34;title&#34;:&#34;磐田市観光協会「磐田 中泉ありがた歩記」（寺社散策マップ）&#34;,&#34;type&#34;:&#34;地域資料&#34;,&#34;note&#34;:&#34;金台寺を無住の寺と紹介し、境内の閻魔・奪衣婆の石像に言及。地図上の位置は諏訪神社近隣&#34;,&#34;url&#34;:&#34;https://kanko-iwata.jp/wp2/wp-content/uploads/2023/06/B4_nakaizumi.pdf&#34;},{&#34;title&#34;:&#34;時宗公式ページ 時宗寺院一覧（時宗宗務所）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;一覧掲載のみ。第17教区に「金台寺（ｺﾝﾀｲｼﾞ）〒438-0075 静岡県磐田市天竜110」として掲載。由緒・本尊・行事の記載はない。読み仮名が公式では「こんたいじ」である点に注意。&#34;,&#34;url&#34;:&#34;http://www.jishu.or.jp/jishu-shumusho/jishu-temples/&#34;}],&#34;research_todos&#34;:[&#34;創建年代・開基・沿革の確認（公開Web情報では確認できず。時宗宗務所の寺院名簿や磐田市誌の確認が必要）&#34;,&#34;山号の確認（霊場資料には「嶺松山」とあるが、これは管理寺院である見付の省光寺の山号と同一表記のため、金台寺自体の山号かどうか要検証）&#34;,&#34;本尊の確認（霊場資料の本尊欄は阿弥陀如来だが民間資料単独のため断定不可。札所本尊の薬師如来との関係も含め要確認）&#34;,&#34;磐田市指定文化財（書跡）「伝一遍上人六字名号」（所在地・見付）と市内時宗寺院（金台寺・省光寺・西光寺）との関係を確認する&#34;,&#34;所在地「磐田市天竜」の地名の由来と旧中泉地区との関係を調べる&#34;,&#34;省光寺による管理（兼帯）の経緯・現況を確認する&#34;,&#34;文明4年（1472年）創立の典拠（磐田郡社寺明細帳）の確認&#34;,&#34;本尊阿弥陀如来と薬師霊場札所尊（薬師如来）の関係・薬師堂の有無の現地確認&#34;,&#34;閻魔・奪衣婆石像の造立年代・由来の確認&#34;,&#34;要確認: 台帳の読み「きんだいじ」と時宗公式一覧の読み「こんたいじ」の相違&#34;,&#34;時宗公式「時宗寺院一覧」（第17教区）の読み仮名は「ｺﾝﾀｲｼﾞ（こんたいじ）」と表記されており、台帳の「きんだいじ」と異なる。正式な読みを寺院・市資料で要確認。&#34;,&#34;公式一覧に電話番号の掲載がない唯一の磐田市内時宗寺院であり、無住・兼務の可能性を要確認。&#34;,&#34;由緒・本尊は宗派公式サイトに掲載なし。別資料（磐田市史等）での調査が必要。&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;遠江四十九薬師霊場の札所として&#34;,&#34;body&#34;:&#34;巡礼霊場を集成した民間資料「遠江四十九薬師霊場」の札所一覧には、第3番として時宗・金台寺（磐田市天竜）が掲載されています。同霊場は享保年間の御詠歌が現存する江戸時代中期以前に遡るとされ、昭和52年（1977年）に霊場奉賛会が発足した、浜松市・磐田市・袋井市に札所が点在する薬師霊場です。同資料の備考には金台寺が「省光寺の管理」と記されています。『静岡県磐田郡誌』が記す本尊は阿弥陀如来であり、薬師霊場の札所尊としての薬師如来との関係（薬師堂の有無など）は現地確認を要します。&#34;,&#34;sources_note&#34;:&#34;既存記載（民間霊場資料・参拝記録）＋『静岡県磐田郡誌』&#34;},{&#34;heading&#34;:&#34;『静岡県磐田郡誌』にみる由緒&#34;,&#34;body&#34;:&#34;『静岡県磐田郡誌』（1921年）の時宗寺院の由緒には、金台寺（金臺寺）は天龍村天龍字蛭子森に在り、遊行派で見付町省光寺の末寺であり、本尊は阿弥陀如来であることが記されています。同誌の時宗寺院一覧表では山号を嶺松山（本寺の省光寺と同じ山号）と記し、創立は文明4年（1472年）9月、開山は連阿、1921年当時の境内地は474坪、檀徒18戸で、住職欄は空欄となっています。大正期にはすでに独立の住職を置かず省光寺の兼帯下にあったことがうかがえ、現在の「省光寺の管理」がこの時期まで遡って確認できます。時宗は鎌倉時代に一遍上人が開いた宗派で、磐田市内には金台寺のほか省光寺（見付）・西光寺（見付）などの時宗寺院があります。なお旧字名の蛭子森には、天竜川の渡船にゆかりを伝える諏訪神社が鎮座しており、金台寺はその近隣に位置します。&#34;,&#34;sources_note&#34;:&#34;『静岡県磐田郡誌』472コマ（由緒）・423コマ（時宗寺院一覧表）・364コマ（諏訪神社）&#34;},{&#34;heading&#34;:&#34;境内の閻魔像と奪衣婆像&#34;,&#34;body&#34;:&#34;磐田市観光協会の寺社散策マップ「磐田 中泉ありがた歩記」は、金台寺を無住の寺と紹介し、境内に閻魔と奪衣婆の石像があることを記しています。同マップでは磐田駅の南西、諏訪神社の近くに位置が示されており、『静岡県磐田郡誌』の記す旧地名「天龍字蛭子森」（諏訪神社と同じ字）と符合します。&#34;,&#34;sources_note&#34;:&#34;磐田市観光協会「磐田 中泉ありがた歩記」&#34;}],&#34;pilgrimage_note&#34;:&#34;遠江四十九薬師霊場第3番札所（民間の霊場資料および参拝記録サイトの記載が一致）&#34;,&#34;founded_period&#34;:&#34;文明4年（1472年）9月（『静岡県磐田郡誌』時宗寺院一覧表による。開山は連阿）&#34;,&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0012&#34;,&#34;slug&#34;:&#34;shokoji-mitsuke&#34;,&#34;name&#34;:&#34;省光寺&#34;,&#34;name_kana&#34;:&#34;しょうこうじ&#34;,&#34;aliases&#34;:[&#34;嶺松山&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;時宗&#34;,&#34;address&#34;:&#34;静岡県磐田市見付2423番地&#34;,&#34;district_id&#34;:&#34;mitsuke&#34;,&#34;area&#34;:&#34;見付&#34;,&#34;main_deity&#34;:&#34;阿弥陀如来&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;現地写真あり&#34;,&#34;detail_status&#34;:&#34;公開情報調査済み&#34;,&#34;history_summary&#34;:&#34;省光寺は磐田市見付にある時宗の寺院です。旧東海道見付宿の一角に位置し、境内のイチョウは磐田市指定天然記念物です。現地の説明板によれば、創立年代は不明なものの鎌倉時代中頃に時宗へ改宗したと伝えられ、六代住職が足利氏出身であったことから室町幕府二代将軍・足利義詮の庇護を受けて栄え、「御所道場」の称号を受けたと伝わります。本尊は阿弥陀如来像（鎌倉時代の作と伝わる）で、観世音菩薩・勢至菩薩の両脇侍を従えています。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-12&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;現地写真・説明板（2026年添付写真）&#34;,&#34;type&#34;:&#34;現地確認&#34;,&#34;note&#34;:&#34;境内の説明板により宗派（時宗）・本尊（阿弥陀如来像、脇侍に観世音菩薩・勢至菩薩）・沿革（鎌倉時代中頃の時宗改宗、六代住職が足利氏出身で足利義詮の庇護を受け「御所道場」の称号を得た伝承、足利尊氏の守り本尊と伝わる天満地蔵尊の存在）を確認。あわせて本堂、鐘楼門、寺号標、イチョウの現況を撮影で記録。&#34;},{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9075&#34;},{&#34;title&#34;:&#34;市指定文化財｜磐田市公式ウェブサイト&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;市指定文化財一覧に「省光寺のイチョウ」（天然記念物・平成23年5月9日指定）が掲載されていることを本文で確認。&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/sports_midokoro/bunkazai/bunkazainitsuite/1002039.html&#34;},{&#34;title&#34;:&#34;省光寺（静岡県磐田市）お寺の風景と陶芸&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;山号嶺松山・時宗・見付2423・創建不詳・1250年頃時宗改宗・足利将軍家庇護・御所道場・中興開山慈海・鐘楼門・イチョウ（推定樹齢約250年）の記述を本文で確認。個人ブログのため補助的情報として扱う。&#34;,&#34;url&#34;:&#34;https://tempsera.seesaa.net/article/201510article_39.html&#34;},{&#34;title&#34;:&#34;サーチ寺院 静岡県磐田市の寺院一覧&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;省光寺が時宗・磐田市見付2423番地であることを一覧本文で確認。&#34;,&#34;url&#34;:&#34;https://www.bukyou.com/BukyBukyou/TBukyou22/C22CNo211Detail.html&#34;},{&#34;title&#34;:&#34;時宗公式ページ 時宗寺院一覧（時宗宗務所）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;一覧掲載のみ。第17教区に「省光寺（ｼｮｳｺｳｼﾞ）〒438-0086 静岡県磐田市見付（二番町）2423」として掲載。所在地表記に「二番町」の注記あり。由緒・本尊・行事の記載はない。&#34;,&#34;url&#34;:&#34;http://www.jishu.or.jp/jishu-shumusho/jishu-temples/&#34;}],&#34;research_todos&#34;:[&#34;境内の天満地蔵尊（足利尊氏の守り本尊と伝わる）の由来・伝来経緯の裏取り&#34;,&#34;民間記事が伝える中興開山「慈海」と、現地説明板が伝える「足利氏出身の六代住職」との関係・時系列の整理&#34;,&#34;六代住職・足利義詮による庇護と「御所道場」の称号について、『磐田市誌』等の学術・行政資料での裏取り&#34;,&#34;鐘楼門の建立年代の確認&#34;,&#34;見付宿の寺町における位置づけ（宿場との関係）の調査&#34;],&#34;founded_period&#34;:&#34;創立年代は不詳。現地の説明板では鎌倉時代中頃（約750年前）に時宗へ改宗したと伝えられており、民間の寺院紹介記事も1250年頃の改宗と紹介しています。&#34;,&#34;heritage_status&#34;:&#34;市指定文化財あり（省光寺のイチョウ・天然記念物）&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;創建と沿革&#34;,&#34;body&#34;:&#34;創立年代は不詳とされています。境内の説明板によれば、鎌倉時代中頃（約750年前）に時宗へ改宗したと伝えられ、六代住職が足利氏の出身であったことから、室町幕府二代将軍・足利義詮の庇護を受けて栄え、「御所道場」の称号を受けたと伝わります。民間の寺院紹介記事では、改宗を1250年頃、中興開山を14世紀の僧・慈海とし、山号は嶺松山と記されています。両者の伝える経緯には食い違いがあり、慈海と六代住職の関係は今後の裏取りを要します。&#34;},{&#34;heading&#34;:&#34;本尊と脇侍&#34;,&#34;body&#34;:&#34;境内の説明板によれば、本尊の阿弥陀如来像（像高97cm）は鎌倉時代の作と伝えられ、向かって右に観世音菩薩像（像高65cm）、左に勢至菩薩像（像高62cm）を従えています。境内にはこのほか、足利尊氏の守り本尊と伝えられる天満地蔵尊や、延命地蔵尊が安置された地蔵堂があります。&#34;},{&#34;heading&#34;:&#34;境内のイチョウと鐘楼門&#34;,&#34;body&#34;:&#34;境内のイチョウは「省光寺のイチョウ」として磐田市指定文化財（天然記念物、平成23年5月9日指定）となっています。市の市指定文化財一覧に天然記念物として掲載されていることが確認できます。また民間の寺院紹介記事では、山門は鐘楼門形式で、磐田市内では例の少ない形式と紹介されています。&#34;},{&#34;heading&#34;:&#34;文化財資料からの補足&#34;,&#34;body&#34;:&#34;省光寺のイチョウは高さ15.4メートル、根回り周囲18.7メートル、推定樹齢240年の古木で、平成23年（2011年）5月9日に磐田市指定天然記念物に指定されました。街中に残るイチョウの古木として数少ない存在です。&#34;}],&#34;cultural_assets&#34;:[{&#34;name&#34;:&#34;省光寺のイチョウ&#34;,&#34;designation&#34;:&#34;磐田市指定文化財（天然記念物）&#34;,&#34;summary&#34;:&#34;磐田市公式サイトの市指定文化財一覧に平成23年5月9日指定の天然記念物として掲載されています。民間の紹介記事では推定樹齢約250年の古木と紹介されています。&#34;}]},{&#34;temple_id&#34;:&#34;iwata-0013&#34;,&#34;slug&#34;:&#34;saikoji-mitsuke&#34;,&#34;name&#34;:&#34;西光寺&#34;,&#34;name_kana&#34;:&#34;さいこうじ&#34;,&#34;aliases&#34;:[&#34;東福山&#34;,&#34;東福山西光寺&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;時宗&#34;,&#34;address&#34;:&#34;静岡県磐田市見付3353番地の1&#34;,&#34;district_id&#34;:&#34;mitsuke&#34;,&#34;area&#34;:&#34;見付&#34;,&#34;main_deity&#34;:&#34;阿弥陀如来&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;現地写真あり&#34;,&#34;detail_status&#34;:&#34;公開情報調査済み&#34;,&#34;history_summary&#34;:&#34;西光寺は磐田市見付にある時宗の寺院で、山号は東福山です。寺院公式サイトによれば文永2年（1265年）の開創で、時宗開祖の一遍上人を開山と称し、本尊は阿弥陀如来です。徳川家康ゆかりの中泉御殿の表門を移築した表門など、7件の磐田市指定文化財を有します。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-12&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9077&#34;},{&#34;title&#34;:&#34;時宗 東福山 西光寺の歴史や文化遺産（寺院公式サイト）&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;文永2年（1265年）開創、一遍上人開山、本尊阿弥陀如来、東福門院（源和子）による寄進と山号下賜、遠江四十九薬師霊場第48番、市指定文化財各件の解説を本文で確認。&#34;,&#34;url&#34;:&#34;https://www.saikouji.pw/history/&#34;},{&#34;title&#34;:&#34;市指定文化財｜磐田市公式ウェブサイト&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;西光寺表門・薬師如来坐像・持蓮華・伝一遍上人六字名号・新勅撰和歌集・大クスとナギの木・イヌマキの7件が平成17年11月21日指定であることを一覧本文で確認。&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/sports_midokoro/bunkazai/bunkazainitsuite/1002039.html&#34;},{&#34;title&#34;:&#34;磐田市観光協会「中泉ありがた歩記」（PDF）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;中泉御殿が寛文10年（1670年）に廃止され、表門が見付の西光寺へ、裏門が西願寺へ移築されたこと、薬医門様式であることをPDF本文で確認。&#34;,&#34;url&#34;:&#34;https://kanko-iwata.jp/wp2/wp-content/uploads/2023/06/B4_nakaizumi.pdf&#34;},{&#34;title&#34;:&#34;時宗公式ページ 時宗寺院一覧（時宗宗務所）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;一覧掲載のみ。第17教区に「西光寺（ｻｲｺｳｼﾞ）〒438-0086 静岡県磐田市見付加茂川通3353-1」として掲載。由緒・本尊・行事の記載はなく、寺院Webリンクもない。&#34;,&#34;url&#34;:&#34;http://www.jishu.or.jp/jishu-shumusho/jishu-temples/&#34;},{&#34;title&#34;:&#34;東福山 西光寺 公式サイト&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;年中行事（花祭り・涅槃会・除夜の鐘・日限地蔵尊大祭）と駐車場案内を確認&#34;,&#34;url&#34;:&#34;https://www.saikouji.pw/&#34;},{&#34;title&#34;:&#34;磐田墓苑オープンのお知らせ｜リーフログ&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;西光寺境内の樹木葬墓苑「リーフログ磐田」の開苑（2023年11月）と運営形態を確認&#34;,&#34;url&#34;:&#34;https://leaflog.jp/news_iwata/5920/&#34;},{&#34;title&#34;:&#34;磐田市文化財保存活用地域計画（令和6年9月）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;p.40 写真49「西光寺表門（旧中泉御殿門、市指定有形文化財）」、p.53 主要市指定文化財一覧に「中泉御殿表門（西光寺）」&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/_res/projects/default_project/_page_/001/009/747/keikaku202409.pdf&#34;}],&#34;research_todos&#34;:[&#34;文永2年開創時の開基僧の名（公式サイト記載の僧名の正確な表記）を現地・寺院資料で確認する&#34;,&#34;東福門院寄進の木造地蔵菩薩立像・木造阿弥陀三尊立像の現況と指定の有無を確認する&#34;,&#34;遠江四十九薬師霊場の霊場会公式資料での札所番号の確認&#34;,&#34;見付と掛塚の2つの西光寺の混同がないか掲載時に再点検する&#34;,&#34;市指定文化財各件の指定理由書・解説の入手&#34;,&#34;宗派公式一覧の住所表記は「磐田市見付加茂川通3353-1」で、町名レベルの表記（加茂川通）が台帳より詳しい。表記整合を確認。&#34;,&#34;寺院自身の公式サイトがあるにもかかわらず、宗派公式一覧には「寺院Web」リンクが付与されていない。寺院公式サイト側の由緒（文永2年開創等）との突合は寺院公式サイト調査で行う。&#34;,&#34;護持会・世話人会など檀家組織の有無を寺院へ直接確認する&#34;,&#34;樹木葬墓苑の詳細（永代供養墓・納骨堂の別）を公式情報で裏付ける&#34;,&#34;「蓮光寺廃寺」の所在地・時期を裏付ける発掘調査報告書等は今回確認できなかった。全国遺跡報告総覧等での追加調査が望ましい。&#34;],&#34;founded_period&#34;:&#34;寺伝（寺院公式サイト）では文永2年（1265年）開創とされます。&#34;,&#34;heritage_status&#34;:&#34;市指定文化財あり（表門・薬師如来坐像・持蓮華・伝一遍上人六字名号・新勅撰和歌集・大クスとナギの木・イヌマキの7件）&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;創建と一遍上人&#34;,&#34;body&#34;:&#34;寺院公式サイトによれば、西光寺は文永2年（1265年）に真言宗の寺として開創されたと伝えられます。弘安年間（1280年頃）に時宗の開祖一遍上人が当寺を訪れて本尊の開眼法要を勤めたことから、一遍上人を開山と称しています。市指定文化財の「伝一遍上人六字名号」は、この一遍上人とのゆかりを伝える書跡です。&#34;},{&#34;heading&#34;:&#34;東福門院と山号の由来&#34;,&#34;body&#34;:&#34;寺院公式サイトによれば、2代将軍徳川秀忠の娘で後水尾天皇の中宮となった東福門院（源和子）が元和6年（1620年）に当寺と関わりを持ち、守り本尊の木造地蔵菩薩立像と木造阿弥陀三尊立像を寄進し、「東福山」の山号を与えたと伝えられます。堂宇の造営にも援助があったとされます。&#34;},{&#34;heading&#34;:&#34;中泉御殿表門の移築&#34;,&#34;body&#34;:&#34;磐田市観光協会の資料によれば、徳川家康が造営した中泉御殿は寛文10年（1670年）に廃止され、その表門が見付の西光寺に、裏門が中泉の西願寺に移築されました。門は薬医門の様式で、簡素な彫り物が施され、桃山から江戸初期の様式に見合う意匠が見られると解説されています。この表門は平成17年11月21日に磐田市指定文化財（建造物）に指定されています。&#34;},{&#34;heading&#34;:&#34;文化財資料からの補足&#34;,&#34;body&#34;:&#34;西光寺の表門は安土桃山時代の薬医門で、中泉御殿の表門を移築したと伝えられます。市内最大級の薬医門として平成17年（2005年）11月21日に磐田市指定有形文化財（建造物）に指定されています。 境内には見付宿本陣を務めた神谷家・鈴木家の墓所があり、江戸時代を通じて連続的に墓標が立てられた歴史的価値の高い墓所として磐田市指定史跡になっています。 境内の大クスは高さ18メートル、根回り周囲23メートル、推定樹齢500年以上で、密接してナギが自生します。イヌマキ（高さ18メートル、推定樹齢200年から250年）とともに磐田市指定天然記念物です。 所蔵する薬師如来坐像は平安時代の作で、もと蓮光寺に安置され、同寺の廃寺に伴い西光寺に移されたと磐田市の文化財台帳に記されています。&#34;},{&#34;heading&#34;:&#34;発掘調査・考古資料からの補足&#34;,&#34;body&#34;:&#34;西光寺の表門（薬医門）は、寛文10年（1670年）に廃止された中泉御殿の表門を移築したと伝えられ、市内最大級の薬医門とされる。平成17年（2005年）11月21日に磐田市指定有形文化財（建造物）に指定された。 本尊脇にまつられる薬師如来坐像（平安時代作）は、もと蓮光寺に安置されていたが、蓮光寺が廃寺となったことに伴い西光寺に移されたもので、平成17年（2005年）11月21日に磐田市指定文化財（彫刻）に指定された。&#34;}],&#34;cultural_assets&#34;:[{&#34;name&#34;:&#34;西光寺表門&#34;,&#34;designation&#34;:&#34;磐田市指定文化財（建造物）&#34;,&#34;summary&#34;:&#34;平成17年11月21日指定。磐田市観光協会の資料によれば、寛文10年（1670年）に廃止された中泉御殿の表門を移築したもので、薬医門の様式です。&#34;},{&#34;name&#34;:&#34;薬師如来坐像&#34;,&#34;designation&#34;:&#34;磐田市指定文化財（彫刻）&#34;,&#34;summary&#34;:&#34;平成17年11月21日指定。寺院公式サイトでは平安時代の作と紹介されています。&#34;},{&#34;name&#34;:&#34;持蓮華&#34;,&#34;designation&#34;:&#34;磐田市指定文化財（工芸品)&#34;,&#34;summary&#34;:&#34;平成17年11月21日指定。寺院公式サイトによれば3本のうち2本は奈良国立博物館所蔵とされます。&#34;},{&#34;name&#34;:&#34;伝一遍上人六字名号&#34;,&#34;designation&#34;:&#34;磐田市指定文化財（書跡）&#34;,&#34;summary&#34;:&#34;平成17年11月21日指定。時宗開祖一遍上人の筆と伝えられる六字名号です。&#34;},{&#34;name&#34;:&#34;新勅撰和歌集&#34;,&#34;designation&#34;:&#34;磐田市指定文化財（典籍）&#34;,&#34;summary&#34;:&#34;平成17年11月21日指定。寺院公式サイトでは鎌倉時代の写本と紹介されています。&#34;},{&#34;name&#34;:&#34;西光寺大クスとナギの木&#34;,&#34;designation&#34;:&#34;磐田市指定文化財（天然記念物）&#34;,&#34;summary&#34;:&#34;平成17年11月21日指定。寺院公式サイトでは大クスは樹齢約500年と紹介され、ナギの葉は裂けにくいことから縁結びの信仰と結びつけられています。&#34;},{&#34;name&#34;:&#34;西光寺のイヌマキ&#34;,&#34;designation&#34;:&#34;磐田市指定文化財（天然記念物）&#34;,&#34;summary&#34;:&#34;平成17年11月21日指定。寺院公式サイトでは樹齢約250年のマキの木として紹介されています。&#34;},{&#34;name&#34;:&#34;見付宿本陣神谷家墓所・見付宿本陣鈴木家墓所&#34;,&#34;designation&#34;:&#34;磐田市指定史跡&#34;,&#34;summary&#34;:&#34;見付宿の本陣家2家の墓所。江戸時代を通じて連続的に墓標が立てられた。平成17年（2005年）11月21日指定。&#34;}],&#34;pilgrimage_note&#34;:&#34;遠江四十九薬師霊場第48番札所（寺院公式サイトによる）&#34;,&#34;danka_info&#34;:{&#34;official_site&#34;:{&#34;status&#34;:&#34;あり&#34;,&#34;url&#34;:&#34;https://www.saikouji.pw/&#34;,&#34;checked_at&#34;:&#34;2026-07-12&#34;},&#34;annual_events&#34;:[{&#34;name&#34;:&#34;涅槃会&#34;,&#34;timing&#34;:&#34;2月15日&#34;,&#34;note&#34;:&#34;寺院公式サイトに記載&#34;},{&#34;name&#34;:&#34;花祭り（灌仏会）&#34;,&#34;timing&#34;:&#34;4月8日&#34;,&#34;note&#34;:&#34;お釈迦さまの誕生を祝う行事。寺院公式サイトに記載&#34;},{&#34;name&#34;:&#34;秘仏日限地蔵尊大祭&#34;,&#34;timing&#34;:&#34;13年に1度&#34;,&#34;note&#34;:&#34;一日限りのご開帳。寺院公式サイトに記載&#34;}],&#34;cemetery&#34;:&#34;境内に樹木葬墓苑「リーフログ磐田」が文明3年（1471年）の開創とは無関係に2023年（令和5年）11月に開苑したと民間の樹木葬仲介事業者リーフログが案内している。寺院帰属の個別墓で、住職が常駐して永代供養を行い、個別参拝が可能な形式とされる。&#34;,&#34;organization&#34;:&#34;護持会等の檀家組織に関する公開情報は確認できなかった。&#34;,&#34;parking&#34;:&#34;境内に駐車場があり、公式サイトに駐車場の案内図が掲載されている。&#34;}},{&#34;temple_id&#34;:&#34;iwata-0014&#34;,&#34;slug&#34;:&#34;myooji-mitsuke&#34;,&#34;name&#34;:&#34;明王寺&#34;,&#34;name_kana&#34;:&#34;みょうおうじ&#34;,&#34;aliases&#34;:[],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;unknown&#34;,&#34;status_label&#34;:&#34;現地痕跡未確認&#34;,&#34;detail_page&#34;:false,&#34;sect&#34;:&#34;臨済宗妙心寺派&#34;,&#34;address&#34;:&#34;静岡県磐田市見付河原町3987番地&#34;,&#34;district_id&#34;:&#34;mitsuke&#34;,&#34;area&#34;:&#34;見付&#34;,&#34;main_deity&#34;:&#34;未確認&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;訪問済み&#34;,&#34;detail_status&#34;:&#34;検索記録のみ公開&#34;,&#34;history_summary&#34;:&#34;明王寺は磐田市見付（河原町）にある臨済宗妙心寺派の寺院です。かつての本尊であった不動三尊立像は磐田市指定文化財（彫刻）で、現在は同市見付の見性寺に移されています。寺号は不動明王を祀ったことにちなむとみられますが、創建など詳しい沿革は現時点では確認できていません。&#34;,&#34;page_summary&#34;:&#34;住所地を訪問しましたが、寺院・堂宇・寺号標など、明王寺の所在を示す痕跡は確認できませんでした。公式資料には名称・宗派・所在地の記録が残るため、個別ページは公開せず検索結果の記録として扱います。&#34;,&#34;visit_notes&#34;:&#34;住所地を訪問しましたが、寺院・堂宇・寺号標など、明王寺の所在を示す痕跡は確認できませんでした。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-12&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9079&#34;},{&#34;title&#34;:&#34;市指定文化財｜磐田市公式ウェブサイト&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;彫刻「不動三尊立像」（平成17年11月21日指定）に「明王寺から見性寺に移管」と注記されていることを一覧本文で確認。&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/sports_midokoro/bunkazai/bunkazainitsuite/1002039.html&#34;},{&#34;title&#34;:&#34;見性寺（磐田市）いこーよ&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;見性寺の市指定文化財として「藤原時代の不動明王二童子立像」が紹介されていることを本文で確認。&#34;,&#34;url&#34;:&#34;https://iko-yo.net/facilities/56166&#34;},{&#34;title&#34;:&#34;明王寺（静岡県磐田市）やさしいお葬式&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;磐田市見付の臨済宗寺院として掲載されていることを確認（沿革情報なし）。&#34;,&#34;url&#34;:&#34;https://y-osohshiki.com/obousan/sizuoka/temple/6486&#34;},{&#34;title&#34;:&#34;サーチ寺院 静岡県磐田市の寺院一覧&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;明王寺が磐田市見付3987番地に所在することを一覧本文で確認。&#34;,&#34;url&#34;:&#34;https://www.bukyou.com/BukyBukyou/TBukyou22/C22CNo211Detail.html&#34;},{&#34;title&#34;:&#34;臨黄ネット 寺院検索（静岡県磐田市・妙心寺派）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;一覧掲載のみ。寺名「明王寺（みょうおうじ）」・住所「見付2896」を確認。本尊・由緒・行事・URL・コメント欄はすべて空欄。妙心寺公式サイト（myoshinji.or.jp）のFAQ300は寺院検索として臨黄ネットを公式に案内している。&#34;,&#34;url&#34;:&#34;https://rinnou.net/search/?prefectures=%E9%9D%99%E5%B2%A1%E7%9C%8C&#38;address_1=%E7%A3%90%E7%94%B0%E5%B8%82&#38;shuha=%E5%A6%99%E5%BF%83%E5%AF%BA%E6%B4%BE&#34;},{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿・国税庁法人番号公表サイトとの突合結果&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;2026-07-12、静岡県宗教法人名簿と国税庁法人番号公表サイトを118寺全件照合した結果、明王寺の名称・宗派・所在地（見付河原町3987番地）は名簿の記載と完全一致することを確認。宗派公式サイト（臨黄ネット）に見性寺と同一の住所が掲載されている点は、行政資料と食い違うため宗派側のデータ誤りの可能性が高いと判断した。&#34;},{&#34;title&#34;:&#34;明王寺 現地確認メモ&#34;,&#34;type&#34;:&#34;現地確認&#34;,&#34;note&#34;:&#34;2026-07-12、住所地を訪問したが、寺院・堂宇・寺号標など、明王寺の所在を示す痕跡は確認できなかった。&#34;}],&#34;research_todos&#34;:[&#34;山号・本尊・創建年代を寺院または『磐田市誌』で確認する&#34;,&#34;不動三尊立像の像高・材質（カヤ材一木造との情報あり）を市の文化財解説で確認する&#34;,&#34;見付宿河原町における寺院の歴史的位置づけの調査&#34;,&#34;住所表記（見付河原町3987番地）と法人登記上の表記の突合&#34;,&#34;宗派公式サイト（臨黄ネット）の住所表記が見性寺と同一になっている理由（データ誤りか、寺院間の何らかの関係か）&#34;],&#34;heritage_status&#34;:&#34;旧本尊の不動三尊立像が磐田市指定文化財（現在は見性寺に移管）&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;旧本尊の不動三尊立像&#34;,&#34;body&#34;:&#34;磐田市公式サイトの市指定文化財一覧には、彫刻の部に「不動三尊立像」が平成17年11月21日指定として掲載され、明王寺から見性寺に移管された旨が注記されています。見性寺を紹介する民間サイトでは、同寺の市指定文化財として藤原時代（平安時代後期）の不動明王二童子立像が挙げられており、この像を指すとみられます。明王寺自体の創建年代や沿革を記した公開資料は現時点では確認できていません。&#34;},{&#34;heading&#34;:&#34;文化財資料からの補足&#34;,&#34;body&#34;:&#34;磐田市の文化財台帳によれば、市指定有形文化財（彫刻）の不動三尊立像（平安時代作、現在は見性寺所蔵）は、もと見付河原町の明王寺の本尊であったと記されています。&#34;}],&#34;cultural_assets&#34;:[{&#34;name&#34;:&#34;不動三尊立像（旧明王寺本尊）&#34;,&#34;designation&#34;:&#34;磐田市指定文化財（彫刻）&#34;,&#34;summary&#34;:&#34;平成17年11月21日指定。磐田市公式サイトの一覧に「明王寺から見性寺に移管」と注記されています。見性寺の紹介記事では藤原時代の不動明王二童子立像として言及されています。&#34;}]},{&#34;temple_id&#34;:&#34;iwata-0015&#34;,&#34;slug&#34;:&#34;hojuji-toyoshima&#34;,&#34;name&#34;:&#34;寳珠寺&#34;,&#34;name_kana&#34;:&#34;ほうしゅうじ&#34;,&#34;aliases&#34;:[&#34;瑞龍山&#34;,&#34;瑞龍山宝珠寺&#34;,&#34;ほうじゅじ（読み。宗派公式表記との相違あり）&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;unknown&#34;,&#34;status_label&#34;:&#34;現地痕跡未確認&#34;,&#34;detail_page&#34;:false,&#34;sect&#34;:&#34;臨済宗妙心寺派&#34;,&#34;address&#34;:&#34;静岡県磐田市豊島668番地&#34;,&#34;district_id&#34;:&#34;nanbu&#34;,&#34;area&#34;:&#34;南部&#34;,&#34;main_deity&#34;:&#34;未確認&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;公開情報調査済み&#34;,&#34;history_summary&#34;:&#34;寳珠寺（宝珠寺）は磐田市豊島にある臨済宗妙心寺派の寺院で、山号は瑞龍山です。庭園専門メディアの解説によれば南北朝時代の観応元年（1350年）の創建で、当初は鎌倉円覚寺派に属し、のちに妙心寺派に転じました。昭和56年（1981年）作庭の中根金作による枯山水庭園「涅槃の庭」があることで知られます。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9081&#34;},{&#34;title&#34;:&#34;宝珠寺庭園“涅槃の庭”（おにわさん）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;瑞龍山宝珠寺・磐田市豊島668・観応元年（1350年）創建・円覚寺派から妙心寺派へ・遠州六ヶ寺・秀吉滞在伝承と朱印状・安政東海地震被災・中根金作作庭「涅槃の庭」（1981年）を本文で確認。&#34;,&#34;url&#34;:&#34;https://oniwa.garden/houshu-ji-temple-garden-%E7%91%9E%E9%BE%8D%E5%B1%B1%E5%AE%9D%E7%8F%A0%E5%AF%BA%E5%BA%AD%E5%9C%92/&#34;},{&#34;title&#34;:&#34;瑞龍山宝珠寺（寺院公式サイト）&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;サイト名で山号「瑞龍山」を確認。掲載電話番号がホトカミ掲載の磐田市豊島668の宝珠寺と一致することを確認（沿革記載は乏しい）。&#34;,&#34;url&#34;:&#34;https://housyuuji.com/&#34;},{&#34;title&#34;:&#34;宝珠寺（静岡県磐田駅）ホトカミ&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;臨済宗妙心寺派・磐田市豊島668の所在情報を本文で確認。&#34;,&#34;url&#34;:&#34;https://hotokami.jp/area/shizuoka/Hmmtm/Hmmtmtm/Dzayt/70194/&#34;},{&#34;title&#34;:&#34;臨黄ネット 寺院検索（静岡県磐田市・妙心寺派）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;一覧掲載のみ。寺名「寳珠寺（ほうしゅうじ）」・住所「豊島668」を確認（台帳住所と一致）。本尊・由緒・行事欄は空欄。 2026-07-12にATAWI TEMPLE編集部が同ページを再確認し、この読みを正式表記として採用（台帳の旧読み「ほうじゅじ」はaliasesへ移動）。&#34;,&#34;url&#34;:&#34;https://rinnou.net/search/?prefectures=%E9%9D%99%E5%B2%A1%E7%9C%8C&#38;address_1=%E7%A3%90%E7%94%B0%E5%B8%82&#38;shuha=%E5%A6%99%E5%BF%83%E5%AF%BA%E6%B4%BE&#34;}],&#34;research_todos&#34;:[&#34;本尊（地蔵菩薩とする検索情報があるが本文確認できず）を寺院に確認する&#34;,&#34;「妙心寺派遠州六ヶ寺」の構成寺院と典拠の調査&#34;,&#34;豊臣秀吉朱印状の伝来・内容の確認（寺蔵・非公開）&#34;,&#34;安政東海地震（嘉永7年）被災と復興過程の記録調査&#34;,&#34;庭園「涅槃の庭」の拝観可否の確認&#34;],&#34;founded_period&#34;:&#34;庭園専門メディアの解説では観応元年（1350年）創建とされます（南北朝時代）。&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;創建と沿革&#34;,&#34;body&#34;:&#34;庭園専門メディア「おにわさん」の解説によれば、寳珠寺は観応元年（1350年）の創建で、当初は鎌倉の円覚寺派に属し、現在は京都の妙心寺派に属しています。かつては「妙心寺派遠州六ヶ寺」に数えられたと紹介されています。嘉永7年（1854年）の安政東海地震で堂宇を失い、その後徐々に復興されたとされます。これらは民間二次情報にもとづくため、寺院資料での裏付けが望まれます。&#34;},{&#34;heading&#34;:&#34;豊臣秀吉滞在の伝承&#34;,&#34;body&#34;:&#34;同解説によれば、羽柴秀吉（豊臣秀吉）が織田信長に仕える前、遠州の松下一族に仕えていた時期に当寺を訪れて滞在したという言い伝えがあり、寺には秀吉から賜ったと伝えられる朱印状が所蔵されている（非公開）と紹介されています。伝承と史料記録の区別を含め、朱印状の内容・年代の確認が今後の課題です。&#34;},{&#34;heading&#34;:&#34;中根金作作庭「涅槃の庭」&#34;,&#34;body&#34;:&#34;境内には昭和56年（1981年）に造園家・中根金作が作庭した枯山水庭園「涅槃の庭」があります。中根金作が大阪芸術大学教授であった時期の作庭で、緩やかな築山に深山を表す石組を設け、川の流れが砂利で表現された大海に注ぐ構成と解説されています。&#34;}]},{&#34;temple_id&#34;:&#34;iwata-0016&#34;,&#34;slug&#34;:&#34;tamonji-nakano&#34;,&#34;name&#34;:&#34;多聞寺&#34;,&#34;name_kana&#34;:&#34;たもんじ&#34;,&#34;aliases&#34;:[&#34;吉祥山多聞寺&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;unknown&#34;,&#34;status_label&#34;:&#34;現地痕跡未確認&#34;,&#34;detail_page&#34;:false,&#34;sect&#34;:&#34;臨済宗妙心寺派&#34;,&#34;address&#34;:&#34;静岡県磐田市中野532番地の1&#34;,&#34;district_id&#34;:&#34;fukude&#34;,&#34;area&#34;:&#34;福田&#34;,&#34;main_deity&#34;:&#34;毘沙門天（聖徳太子の御作と伝える。『静岡県磐田郡誌』による）&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;多聞寺は磐田市中野にある臨済宗妙心寺派の寺院で、『静岡県磐田郡誌』（1921年）によれば山号は吉祥山、見付の見性寺の末寺で、本尊は毘沙門天（多聞天）です。同誌は天文22年（1553年）9月3日の黙宗による分派開山と記します。『日本歴史地名大系』によれば、慶長6年（1601年）に徳川氏の代官頭・伊奈忠次から寺領1石余の寄進を受けました。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9083&#34;},{&#34;title&#34;:&#34;『静岡県磐田郡誌』（静岡県磐田郡教育会編、1921年）434コマ・414コマ&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション。由緒（434コマ）に本尊毘沙門天・天文22年黙宗分派開山・天保4年再建・安政地震被災、一覧表（414コマ）に山号吉祥山・境内593坪&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680/1/434&#34;},{&#34;title&#34;:&#34;『日本歴史地名大系』中野村（遠江国豊田郡）の項（コトバンク）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;慶長6年の伊奈忠次による多聞寺への寺領1石余寄進手形、正保郷帳の多聞寺領1石余の記録&#34;,&#34;url&#34;:&#34;https://kotobank.jp/word/中野村&#34;},{&#34;title&#34;:&#34;臨黄ネット 寺院検索（静岡県磐田市・妙心寺派）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;一覧掲載のみ。寺名「多聞寺（たもんじ）」・住所「中野532-1」を確認（台帳と一致）。本尊・由緒・行事欄は空欄。&#34;,&#34;url&#34;:&#34;https://rinnou.net/search/?prefectures=%E9%9D%99%E5%B2%A1%E7%9C%8C&#38;address_1=%E7%A3%90%E7%94%B0%E5%B8%82&#38;shuha=%E5%A6%99%E5%BF%83%E5%AF%BA%E6%B4%BE&#34;}],&#34;research_todos&#34;:[&#34;山号・本尊・創建年代を寺院または『磐田市誌』で確認する&#34;,&#34;寺号（多聞天＝毘沙門天に由来する可能性）と本尊の関係を現地確認する&#34;,&#34;中野地区の歴史（旧中野村）と寺院の関わりを郷土資料で調査する&#34;,&#34;全国に同名寺院が多いため、引用時は必ず磐田市中野532番地の1・臨済宗妙心寺派であることを確認する&#34;,&#34;開山黙宗と、同じく郡誌に黙宗開創と記される泉蔵寺（永正元年）・天正寺（天正元年）との関係整理&#34;,&#34;境内地蔵堂（伝弘法大師作の地蔵尊）の現況確認&#34;,&#34;本尊毘沙門天像の現存・公開状況の確認&#34;],&#34;founded_period&#34;:&#34;天文22年（1553年）9月3日、黙宗の分派開山（『静岡県磐田郡誌』による）&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;『静岡県磐田郡誌』にみる由緒&#34;,&#34;body&#34;:&#34;『静岡県磐田郡誌』（1921年）の由緒には、多聞寺は天龍村中野字村西に在り、妙心寺派で見付町見性寺の末寺であること、本尊は毘沙門天を安置し聖徳太子の御作と伝えることが記されています。毘沙門天は四天王の一・多聞天と同体であり、寺号と本尊が対応しています。開山は天文22年（1553年）9月3日の黙宗による分派で、覚仙が住職となりました。境内には仏堂1宇があって地蔵尊を安置し、弘法大師の作との伝説がありますが創立年代は不詳とされます。天保4年（1833年）9月に第12世天祐が再建したものの、安政元年（1854年）の地震により堂宇倒壊の被害を受けました。同誌の一覧表では山号は吉祥山、1921年当時の境内地は593坪です。&#34;,&#34;sources_note&#34;:&#34;『静岡県磐田郡誌』434コマ（由緒）・414コマ（臨済宗寺院一覧表）&#34;},{&#34;heading&#34;:&#34;伊奈忠次の寺領寄進と正保郷帳&#34;,&#34;body&#34;:&#34;『日本歴史地名大系』（コトバンク掲載）の中野村の項によれば、慶長6年（1601年）2月、徳川氏の代官頭・伊奈忠次が「中能」の多聞寺（現臨済宗妙心寺派）宛に寺領1石余を寄進する手形を発しています（同年7月には中野村八幡社宛に社領1石を寄進）。江戸時代前期の正保郷帳では中野村の村高233石余のうちに多聞寺領1石余と八幡領1石が含まれており、関ヶ原合戦直後の徳川氏による寺社領安堵が江戸時代を通じて維持されたことが分かります。&#34;,&#34;sources_note&#34;:&#34;『日本歴史地名大系』中野村の項&#34;}],&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0017&#34;,&#34;slug&#34;:&#34;daizoji-kamiokata&#34;,&#34;name&#34;:&#34;大蔵寺&#34;,&#34;name_kana&#34;:&#34;だいぞうじ&#34;,&#34;aliases&#34;:[&#34;医王山大蔵寺&#34;,&#34;大藏寺&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;unknown&#34;,&#34;status_label&#34;:&#34;現地痕跡未確認&#34;,&#34;detail_page&#34;:false,&#34;sect&#34;:&#34;臨済宗妙心寺派&#34;,&#34;address&#34;:&#34;静岡県磐田市上岡田329番地&#34;,&#34;district_id&#34;:&#34;nanbu&#34;,&#34;area&#34;:&#34;南部&#34;,&#34;main_deity&#34;:&#34;阿弥陀如来（『静岡県磐田郡誌』による）&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;大蔵寺は磐田市上岡田にある臨済宗妙心寺派の寺院で、『静岡県磐田郡誌』（1921年）によれば山号は医王山、見付の見性寺の末寺で、本尊は阿弥陀如来です。同誌は鎌倉時代後期の建治3年（1277年）9月15日、南溟による創建と記しており、慶長6年（1601年）には黒印寺領4石5斗、慶安元年（1648年）には阿弥陀領15石を賜りました。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9085&#34;},{&#34;title&#34;:&#34;『静岡県磐田郡誌』（静岡県磐田郡教育会編、1921年）433コマ・413コマ・698〜699コマ&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション。由緒（433コマ）に建治3年南溟創建・慶長6年黒印寺領4石5斗・慶安元年阿弥陀領15石・安政地震被災、一覧表（413コマ）に山号医王山・境内632坪、人物章（698〜699コマ）に鈴木佐太郎の墓所&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680/1/433&#34;},{&#34;title&#34;:&#34;ニッポンの霊場 豊田郡三十三観音霊場&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;第5番＝大蔵寺（臨済宗妙心寺派・上岡田329・
