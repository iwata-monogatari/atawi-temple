#34;:&#34;所在と宗派&#34;,&#34;body&#34;:&#34;寶珠院は臨済宗方広寺派に属し、大本山方広寺の公式末寺一覧に十郎島の寺院として掲載されています。本山公式一覧では「宝珠院」の表記が用いられています。所在地の十郎島は掛塚輪中の中央西側に位置し、『日本歴史地名大系』によれば天正19年（1591年）の四拾七村惣高辻書上（横山家文書）に「拾良嶋」高53石余とみえ、天竜川の流路の変化に伴い村だけで中洲になったこともある低地の村でした。十郎島村は明治22年（1889年）に掛塚村などと合併して掛塚町となり、昭和30年（1955年）に竜洋町、平成17年（2005年）の合併で現在の磐田市の一部となりました。&#34;},{&#34;heading&#34;:&#34;『静岡県磐田郡誌』にみる由緒&#34;,&#34;body&#34;:&#34;『静岡県磐田郡誌』（1921年）の由緒には「掛塚町十郞島字居村に在り。奧山方廣寺派如意山と號す。本尊は、高王觀世音菩薩なり。慶長元年三月、心叟の開山に係り同五年七月分派せらる」とあります。慶長元年（1596年）に心叟が開山し、慶長5年（1600年）に本寺から分派して一寺となった、関ヶ原の戦い前後の時期に成立した寺院です。本尊の高王観世音菩薩は『高王観世音経』に基づく観音で、本尊としては比較的珍しい尊名です。&#34;}],&#34;founded_period&#34;:&#34;慶長元年（1596年）&#34;,&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0074&#34;,&#34;slug&#34;:&#34;senryuji-kawabukuro&#34;,&#34;name&#34;:&#34;潜龍寺&#34;,&#34;name_kana&#34;:&#34;せんりゅうじ&#34;,&#34;aliases&#34;:[],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;臨済宗方広寺派&#34;,&#34;address&#34;:&#34;静岡県磐田市川袋463番地&#34;,&#34;district_id&#34;:&#34;ryuyo&#34;,&#34;area&#34;:&#34;竜洋&#34;,&#34;main_deity&#34;:&#34;満願虚空蔵菩薩（『静岡県磐田郡誌』による）&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;潜龍寺は静岡県磐田市川袋にある臨済宗方広寺派の寺院で、大本山方広寺の公式末寺一覧に「潜龍寺（川袋）磐田市川袋463」として掲載されています。『静岡県磐田郡誌』（1921年）の由緒では、引佐郡奥山村方広寺の末で本尊は満願虚空蔵菩薩、永和3年（1377年）に本寺2世在徳和尚の分派開創に係り、その後廃絶していたところを慶長元年（1596年）に金叔和尚が中興開基となったと記されています。南北朝期の開創伝承と近世初頭の中興をあわせ伝える寺院です。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9306&#34;},{&#34;title&#34;:&#34;方広寺派末寺一覧（磐田市・袋井市）｜臨済宗方広寺派大本山方広寺&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;本山公式の末寺一覧に「潜龍寺（川袋）〒438-0232 磐田市川袋463」として掲載されていることを本文で確認。&#34;,&#34;url&#34;:&#34;https://houkouji.or.jp/matsuji/&#34;},{&#34;title&#34;:&#34;竜洋町 - Wikipedia&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;川袋を含む旧竜洋町の沿革（1955年発足、2005年合併）を本文で確認。&#34;,&#34;url&#34;:&#34;https://ja.wikipedia.org/wiki/%E7%AB%9C%E6%B4%8B%E7%94%BA&#34;},{&#34;title&#34;:&#34;静岡県磐田郡教育会編『静岡県磐田郡誌』（1921年）コマ435「潜龍寺（掛塚町）」&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション（全文検索で本文確認）&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680/1/435&#34;},{&#34;title&#34;:&#34;Wikipedia「掛塚町」&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;明治22年の掛塚町成立（掛塚村・十郎島村・白羽村・豊岡村・川袋村の合併）&#34;,&#34;url&#34;:&#34;https://ja.wikipedia.org/wiki/%E6%8E%9B%E5%A1%9A%E7%94%BA&#34;},{&#34;title&#34;:&#34;大本山方広寺 末寺のご案内（磐田市・袋井市）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;一覧掲載のみ。「磐田市川袋 潜龍寺 〒438-0232 磐田市川袋463」として掲載。分譲可能墓地・永代供養墓ありの表示。由緒・本尊の記載はない。&#34;,&#34;url&#34;:&#34;https://www.houkouji.or.jp/matsuji/&#34;}],&#34;research_todos&#34;:[&#34;『竜洋町史』『磐田市誌』で創建年代・開山・沿革の記事を確認する&#34;,&#34;山号・本尊を現地で確認する&#34;,&#34;本山公式一覧では白羽の龍泉寺と同一の連絡先が記載されており、兼務関係の有無を確認する&#34;,&#34;同じ川袋の松林寺との歴史的関係（本末・兼務等）を確認する&#34;,&#34;遠江四十九薬師霊場・遠州三十三観音等の札所該当の有無を霊場資料で確認する&#34;,&#34;郡誌コマ435の原本画像で、潜龍寺の本尊（満願虚空蔵菩薩）と開創年（永和3年）の記述を確認する。OCRでは隣接する香集寺の記事と行が交錯している。&#34;,&#34;在徳和尚の年代矛盾（永和3年開創説と明応6年示寂説）について『竜洋町史』・方広寺史料で確認する。&#34;,&#34;郡誌が所在を「掛塚町掛塚」とする点と現住所（川袋463）の関係を確認する。&#34;,&#34;郡誌一覧表の山号欄は並び順から「金峯山」と読める可能性があるが列ずれのため断定できない。&#34;,&#34;白羽の龍泉寺と連絡先が共通しており、潜龍寺が龍泉寺を兼務している可能性がある。要確認。&#34;,&#34;由緒・本尊は末寺一覧に掲載なし。別資料での調査が必要。&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;所在と宗派&#34;,&#34;body&#34;:&#34;潜龍寺は臨済宗方広寺派に属し、大本山方広寺の公式末寺一覧に川袋の寺院として掲載されています。川袋には本寺のほか同派の松林寺（川袋224）も所在します。川袋は掛塚輪中内の旧磐田郡竜洋町の区域で、川袋村は明治22年（1889年）に掛塚村・十郎島村などと合併して掛塚町となり、昭和30年（1955年）に竜洋町、平成17年（2005年）4月1日の合併で現在の磐田市の一部となりました。なお『静岡県磐田郡誌』（1921年）の由緒は当寺の所在を「掛塚町掛塚」と記しており、現住所の川袋との関係（大字境の変更か移転か）は確認できていません。&#34;},{&#34;heading&#34;:&#34;『静岡県磐田郡誌』にみる由緒&#34;,&#34;body&#34;:&#34;『静岡県磐田郡誌』（1921年）の由緒には、潜龍寺は引佐郡奥山村方広寺の末で、本尊は満願虚空蔵菩薩、永和3年（1377年）に本寺2世在徳和尚の分派開創に係り、その後廃絶していたが、慶長元年（1596年）に金叔和尚が中興開基となったと記されています。永和3年は方広寺の開創（応安4年・1371年）からわずか6年後にあたります。ただし同郡誌は掛塚の龍泉寺の項で在徳和尚を文明11年（1479年）の分派開創者・明応6年（1497年）示寂と記しており、永和3年という開創年とは年代が合わないため、寺伝の年代には検討の余地があります。また同じ掛塚の香集寺（掛塚の虚空蔵として知られる寺院）の由緒にも満願虚空蔵の本尊が記されており、両寺の記事が隣接するため原本での確認が望まれます。&#34;}],&#34;founded_period&#34;:&#34;永和3年（1377年）※郡誌の由緒。年代には検討の余地あり&#34;,&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0075&#34;,&#34;slug&#34;:&#34;ryusenji-shiraha&#34;,&#34;name&#34;:&#34;竜泉寺&#34;,&#34;name_kana&#34;:&#34;りゅうせんじ&#34;,&#34;aliases&#34;:[&#34;龍泉寺&#34;,&#34;祥雲山龍泉寺&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;臨済宗方広寺派&#34;,&#34;address&#34;:&#34;静岡県磐田市白羽51番地&#34;,&#34;district_id&#34;:&#34;ryuyo&#34;,&#34;area&#34;:&#34;竜洋&#34;,&#34;main_deity&#34;:&#34;釈迦牟尼如来（大正10年刊『静岡県磐田郡誌』による）&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;竜泉寺は静岡県磐田市白羽にある臨済宗方広寺派の寺院で、祥雲山と号します。大正10年（1921年）刊『静岡県磐田郡誌』によれば、寛永元年（1624年）に心叟禅師が草創し、本尊は釈迦牟尼如来です。安政元年（1854年）の地震で本堂が倒壊し、その後再建されました。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9308&#34;},{&#34;title&#34;:&#34;方広寺派末寺一覧（磐田市・袋井市）｜臨済宗方広寺派大本山方広寺&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;本山公式の末寺一覧に「龍泉寺（白羽）〒438-0235 磐田市白羽52」として掲載されていることを本文で確認。&#34;,&#34;url&#34;:&#34;https://houkouji.or.jp/matsuji/&#34;},{&#34;title&#34;:&#34;竜洋町 - Wikipedia&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;白羽を含む旧竜洋町の沿革（1955年発足、2005年合併）を本文で確認。&#34;,&#34;url&#34;:&#34;https://ja.wikipedia.org/wiki/%E7%AB%9C%E6%B4%8B%E7%94%BA&#34;},{&#34;title&#34;:&#34;静岡県磐田郡教育会編『静岡県磐田郡誌』（大正10年刊）652〜653頁（コマ435）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション。第13章「神社及宗教」臨済宗寺院の部「15 龍泉寺（掛塚町）」。由緒・本尊・『遠江国風土記伝』の引用を確認&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680&#34;},{&#34;title&#34;:&#34;『日本歴史地名大系』白羽村の項（コトバンク）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;白羽村に臨済宗方広寺派龍泉寺・清雲寺・白羽神社があり、清雲寺は昭和30年に曹洞宗聖寿寺へ統合と記載&#34;,&#34;url&#34;:&#34;https://kotobank.jp/word/%E7%99%BD%E7%BE%BD%E6%9D%91&#34;},{&#34;title&#34;:&#34;大本山方広寺 末寺のご案内（磐田市・袋井市）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;一覧掲載のみ。「磐田市白羽 龍泉寺 〒438-0235 磐田市白羽52」として掲載（旧字「龍」表記・番地52）。由緒・本尊の記載はない。&#34;,&#34;url&#34;:&#34;https://www.houkouji.or.jp/matsuji/&#34;}],&#34;research_todos&#34;:[&#34;台帳住所（白羽51番地）と本山公式一覧の記載（白羽52）の異同を確認する&#34;,&#34;『竜洋町史』『磐田市誌』で創建年代・開山・沿革の記事を確認する&#34;,&#34;山号・本尊を現地で確認する&#34;,&#34;本山公式一覧では川袋の潜龍寺と同一の連絡先が記載されており、兼務関係の有無を確認する&#34;,&#34;近隣の白羽神社（郷社）との歴史的関係（別当等）の有無を郷土資料で確認する&#34;,&#34;現在の本尊・山号が『磐田郡誌』の記載（釈迦牟尼如来・祥雲山）と同一か寺院側資料で確認する&#34;,&#34;『竜洋町史』で芋瀬からの移転伝承と『遠江国風土記伝』の記載の関係を確認する&#34;,&#34;方広寺末寺一覧の番地は「白羽52」で、台帳の「白羽51」と相違。正しい番地を要確認。&#34;,&#34;末寺一覧の表記は旧字の「龍泉寺」。台帳の見出し表記「竜泉寺」との使い分けを整理。&#34;,&#34;川袋の潜龍寺と連絡先が共通しており兼務寺院の可能性。墓地等の対応欄はすべて「－」。&#34;,&#34;由緒・本尊は末寺一覧に掲載なし。別資料での調査が必要。&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;所在と宗派&#34;,&#34;body&#34;:&#34;竜泉寺は臨済宗方広寺派に属し、大本山方広寺（浜松市浜名区引佐町奥山）の公式末寺一覧に「龍泉寺（白羽）磐田市白羽52」の旧字体表記で掲載されています。『静岡県磐田郡誌』（大正10年＝1921年刊）では所在を「掛塚町白羽字勝又」と記し、祥雲山と号すとあります。所在地の白羽は白羽神社の鎮座地として知られる集落で、『日本歴史地名大系』の白羽村の項にも「臨済宗方広寺派龍泉寺」の名が見え、同村にあった曹洞宗清雲寺が昭和30年（1955年）に聖寿寺へ統合された後も竜泉寺は存続しています。白羽は江戸時代には幕府領の白羽村（天正19年＝1591年の高167石余）で、天竜川渡船の人足役を務めた村でした。明治期以降は掛塚町の大字となり、昭和30年（1955年）4月1日に掛塚町・十束村・袖浦村の合併で竜洋町が発足、平成17年（2005年）4月1日の合併で現在の磐田市の一部となりました。&#34;,&#34;sources_note&#34;:&#34;方広寺公式末寺一覧・『静岡県磐田郡誌』・『日本歴史地名大系』白羽村の項&#34;},{&#34;heading&#34;:&#34;『静岡県磐田郡誌』にみる由緒&#34;,&#34;body&#34;:&#34;『静岡県磐田郡誌』は竜泉寺の由緒について、本尊は釈迦牟尼如来で、寛永元年（1624年）に心叟禅師の草創に係ると記しています。心叟は慶長元年（1596年）に掛塚十郎島の宝珠院を開山した禅僧としても同誌に登場します。安政元年（1854年）の地震（安政東海地震）により本堂が倒壊し、同誌編纂当時に存した堂宇はその後の再建によるものとされています。また同誌は江戸時代の地誌『遠江国風土記伝』に「芋瀬 龍泉寺 除地高一石九斗六升」とあることを引き、芋瀬（当時は浜名郡河輪村、天竜川対岸）に初め寺があって後に白羽へ移転した可能性と、天竜川の河道変化で芋瀬の地が河東に及んでいた可能性を挙げつつ、「暫く書して以て疑を存す」と判断を保留しています。檀家が当時なお芋瀬側に残っていたことも記されており、天竜川河口部の寺院らしい沿革の手がかりです。&#34;,&#34;sources_note&#34;:&#34;『静岡県磐田郡誌』652〜653頁&#34;}],&#34;founded_period&#34;:&#34;寛永元年（1624年）&#34;,&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0076&#34;,&#34;slug&#34;:&#34;koshuji-kaketsuka&#34;,&#34;name&#34;:&#34;香集寺&#34;,&#34;name_kana&#34;:&#34;こうしゅうじ&#34;,&#34;aliases&#34;:[&#34;香乗寺&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;臨済宗方広寺派&#34;,&#34;address&#34;:&#34;静岡県磐田市掛塚1002番地&#34;,&#34;district_id&#34;:&#34;ryuyo&#34;,&#34;area&#34;:&#34;竜洋&#34;,&#34;main_deity&#34;:&#34;満願虚空蔵菩薩（大正10年刊『静岡県磐田郡誌』による）&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;香集寺は静岡県磐田市掛塚にある臨済宗方広寺派の寺院です。大正10年（1921年）刊『静岡県磐田郡誌』によれば、永禄11年（1568年）に方広寺の法園智溢和尚が開創し、本尊は満願虚空蔵菩薩です。江戸時代の記録には「香乗寺」の表記で寺領2石余が見え、安政元年（1854年）の地震で堂宇が倒壊した後に再建されました。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9310&#34;},{&#34;title&#34;:&#34;方広寺派末寺一覧（磐田市・袋井市）｜臨済宗方広寺派大本山方広寺&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;本山公式の末寺一覧に「香集寺（掛塚）〒438-0234 磐田市掛塚1002」として掲載されていることを本文で確認。&#34;,&#34;url&#34;:&#34;https://houkouji.or.jp/matsuji/&#34;},{&#34;title&#34;:&#34;「香集寺」（磐田市-寺院-〒438-0234）の地図/アクセス - NAVITIME&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;磐田市掛塚1002に香集寺が所在することを地図サイトの検索結果で確認（本山公式一覧の記載と一致）。&#34;,&#34;url&#34;:&#34;https://www.navitime.co.jp/poi?spot=00011-050255253&#34;},{&#34;title&#34;:&#34;竜洋町 - Wikipedia&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;掛塚を含む旧竜洋町の沿革（1955年発足、2005年合併）を本文で確認。&#34;,&#34;url&#34;:&#34;https://ja.wikipedia.org/wiki/%E7%AB%9C%E6%B4%8B%E7%94%BA&#34;},{&#34;title&#34;:&#34;静岡県磐田郡教育会編『静岡県磐田郡誌』（大正10年刊）652〜653頁（コマ435）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション。「16 香集寺（掛塚町）」の由緒。永禄11年開創・本尊満願虚空蔵菩薩・安政元年震災倒壊を確認&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680&#34;},{&#34;title&#34;:&#34;『日本歴史地名大系』掛塚村の項（コトバンク）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;「香乗寺（現香集寺）領二石余」の寺領記録と掛塚湊の繁栄を確認&#34;,&#34;url&#34;:&#34;https://kotobank.jp/word/%E6%8E%9B%E5%A1%9A%E6%9D%91&#34;},{&#34;title&#34;:&#34;大本山方広寺 末寺のご案内（磐田市・袋井市）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;一覧掲載のみ。「磐田市掛塚 香集寺 〒438-0234 磐田市掛塚1002」として掲載。分譲可能墓地・永代供養墓ありの表示。由緒・本尊の記載はない。&#34;,&#34;url&#34;:&#34;https://www.houkouji.or.jp/matsuji/&#34;}],&#34;research_todos&#34;:[&#34;掛塚湊（江戸期〜明治期の廻船湊）と寺院の関係を『竜洋町史』等で確認する&#34;,&#34;掛塚の貴船神社・掛塚まつりとの歴史的関わり（別当等）の有無を郷土資料で確認する&#34;,&#34;『竜洋町史』『磐田市誌』で創建年代・開山・沿革の記事を確認する&#34;,&#34;山号・本尊を現地で確認する&#34;,&#34;焼津市の同名寺院（曹洞宗香集寺、日本三大虚空蔵の一つとされる）との混同に注意して資料を精査する&#34;,&#34;現在の本尊・山号を寺院側資料で確認する（『磐田郡誌』は山号を記載せず）&#34;,&#34;開山「法園智溢」の名の表記（智溢／智益）を『竜洋町史』等の活字資料で照合する&#34;,&#34;「香乗寺」表記の寺領記録の典拠（検地帳・郷帳類）を確認する&#34;,&#34;由緒・本尊は末寺一覧に掲載なし。掛塚湊関連の地誌資料での調査が必要。&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;所在と宗派&#34;,&#34;body&#34;:&#34;香集寺は臨済宗方広寺派に属し、大本山方広寺（浜松市浜名区引佐町奥山）の公式末寺一覧に「香集寺（掛塚）磐田市掛塚1002」として掲載されています。『静岡県磐田郡誌』（大正10年＝1921年刊）は所在を「掛塚町掛塚字本町」と記し、無文派（方広寺の開山無文元選に由来する方広寺派の呼称）で引佐郡奥山の方広寺末と明記しています。所在地の掛塚は天竜川河口部東岸の集落で、中世・近世を通じて廻船の湊として繁栄し、貴船神社の掛塚まつりで知られます。昭和30年（1955年）に掛塚町・十束村・袖浦村の合併で竜洋町が発足し、平成17年（2005年）4月1日の合併で現在の磐田市の一部となりました。なお、静岡県焼津市にも同名の香集寺（曹洞宗）がありますが、宗派・所在地とも異なる別寺院です。&#34;,&#34;sources_note&#34;:&#34;方広寺公式末寺一覧・『静岡県磐田郡誌』・『日本歴史地名大系』掛塚村の項&#34;},{&#34;heading&#34;:&#34;『静岡県磐田郡誌』にみる由緒と江戸時代の寺領&#34;,&#34;body&#34;:&#34;『静岡県磐田郡誌』は香集寺の由緒について、本尊は満願虚空蔵菩薩で、永禄11年（1568年）に方広寺の法園智溢和尚が開創したと記しています。虚空蔵菩薩を本尊とする点は、掛塚の潜龍寺（本尊満願虚空蔵菩薩）と共通しており、方広寺派寺院が並び立つ湊町掛塚の信仰の特色がうかがえます。安政元年（1854年）の地震（安政東海地震）で堂宇が倒壊し、同誌編纂当時の堂宇はその後の再建によるものとされています。また『日本歴史地名大系』の掛塚村の項には、江戸時代の掛塚村の朱印地・除地として「木船大明神領五石・西光寺領二石余・香乗寺（現香集寺）領二石余・万福寺領三石」と見え、当時「香乗寺」とも書かれた寺領2石余の寺院であったことが確認できます。&#34;,&#34;sources_note&#34;:&#34;『静岡県磐田郡誌』652〜653頁・『日本歴史地名大系』掛塚村の項&#34;}],&#34;founded_period&#34;:&#34;永禄11年（1568年）&#34;,&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0077&#34;,&#34;slug&#34;:&#34;jorakuji-horinochi&#34;,&#34;name&#34;:&#34;常楽寺&#34;,&#34;name_kana&#34;:&#34;じょうらくじ&#34;,&#34;aliases&#34;:[],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;臨済宗方広寺派&#34;,&#34;address&#34;:&#34;静岡県磐田市堀之内761番地&#34;,&#34;district_id&#34;:&#34;ryuyo&#34;,&#34;area&#34;:&#34;竜洋&#34;,&#34;main_deity&#34;:&#34;観世音菩薩（大正10年刊『静岡県磐田郡誌』による）&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;常楽寺は静岡県磐田市堀之内にある臨済宗方広寺派の寺院です。大正10年（1921年）刊『静岡県磐田郡誌』によれば天正13年（1585年）の草創で、中泉御殿（徳川家康の陣屋）の建物をもって寺とし、汝舟を開山としたと伝えます。江戸時代には堀之内村に寺領2石を有し、安政元年（1854年）の地震で堂宇が倒壊した後に再建されました。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9312&#34;},{&#34;title&#34;:&#34;方広寺派末寺一覧（磐田市・袋井市）｜臨済宗方広寺派大本山方広寺&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;本山公式の末寺一覧に「常楽寺（堀之内）〒438-0205 磐田市堀之内761」として掲載されていることを本文で確認。&#34;,&#34;url&#34;:&#34;https://houkouji.or.jp/matsuji/&#34;},{&#34;title&#34;:&#34;竜洋町 - Wikipedia&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;堀之内を含む旧竜洋町の沿革（1955年発足、2005年合併）を本文で確認。&#34;,&#34;url&#34;:&#34;https://ja.wikipedia.org/wiki/%E7%AB%9C%E6%B4%8B%E7%94%BA&#34;},{&#34;title&#34;:&#34;静岡県磐田郡教育会編『静岡県磐田郡誌』（大正10年刊）653〜654頁（コマ435〜436）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション。「21 常樂寺（十束村）」の由緒および「20 東福寺（十束村）」の項。天正13年草創・中泉御殿転用・汝舟開山を確認&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680&#34;},{&#34;title&#34;:&#34;『日本歴史地名大系』堀之内村の項（コトバンク）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;「常楽寺領二石」の寺領記録と堀之内村の石高・戸口を確認&#34;,&#34;url&#34;:&#34;https://kotobank.jp/word/%E5%A0%80%E4%B9%8B%E5%86%85%E6%9D%91&#34;},{&#34;title&#34;:&#34;大本山方広寺 末寺のご案内（磐田市・袋井市）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;一覧掲載のみ。「磐田市堀之内 常楽寺 〒438-0205 磐田市堀之内761」として掲載。分譲可能墓地・永代供養墓・写経会ありの表示。由緒・本尊の記載はない。&#34;,&#34;url&#34;:&#34;https://www.houkouji.or.jp/matsuji/&#34;}],&#34;research_todos&#34;:[&#34;『竜洋町史』『磐田市誌』で創建年代・開山・沿革の記事を確認する&#34;,&#34;山号・本尊を現地で確認する&#34;,&#34;方広寺派の宗派資料で開山の法系・本末関係を確認する&#34;,&#34;無住・兼務の状況を確認する&#34;,&#34;遠江四十九薬師霊場・遠州三十三観音等の札所該当の有無を霊場資料で確認する&#34;,&#34;中泉御殿の建物転用伝承を『竜洋町史』『磐田市史』の中泉御殿関係記述と照合する&#34;,&#34;現在の本尊・山号を寺院側資料で確認する（『磐田郡誌』は山号を記載せず）&#34;,&#34;末寺一覧の対応欄に「写経会」の記載があり、写経会を実施している寺院である。定例日等の詳細は寺院側の情報で要確認。&#34;,&#34;由緒・本尊は末寺一覧に掲載なし。別資料での調査が必要。&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;所在と宗派&#34;,&#34;body&#34;:&#34;常楽寺は臨済宗方広寺派に属し、大本山方広寺の公式末寺一覧に堀之内の寺院として掲載されています。『静岡県磐田郡誌』（大正10年＝1921年刊）は所在を「十束村堀之内字水洗」と記します。堀之内は江戸時代には幕府領の堀之内村で、天正19年（1591年）の記録に「堀内」として高242石余が見え、享保3年（1718年）には高202石余・家数48・人数239を数えました。明治22年（1889年）以降は磐田郡十束村の大字となり、昭和30年（1955年）4月1日に掛塚町・袖浦村・十束村の合併で竜洋町が発足、平成17年（2005年）4月1日の合併で現在の磐田市の一部となりました。全国に常楽寺は多数あり、鎌倉市・上田市などの著名同名寺院との混同に注意が必要です。&#34;,&#34;sources_note&#34;:&#34;方広寺公式末寺一覧・『静岡県磐田郡誌』・『日本歴史地名大系』堀之内村の項&#34;},{&#34;heading&#34;:&#34;『静岡県磐田郡誌』にみる由緒&#34;,&#34;body&#34;:&#34;『静岡県磐田郡誌』は常楽寺の由緒について、本尊は観世音菩薩で、天正13年（1585年）の草創にして「中泉村御殿山家康公の陣屋を以て寺とし、汝舟を開山とす」と記しています。中泉（現磐田市中泉）には徳川家康が造営した中泉御殿（陣屋）があり、その建物を寺に転用したという伝えです。安政元年（1854年）11月4日の地震（安政東海地震）で堂宇が倒壊し、同誌編纂当時の堂宇はその後の再建によるものとされています。また同誌によれば、天正18年（1590年）5月には常楽寺2世天眼の志願により、同じ堀之内字蔵山に方広寺派の東福寺が角山を開祖として創立されており、常楽寺が近世初頭の堀之内で寺院創立の母体となっていたことがうかがえます。『日本歴史地名大系』の堀之内村の項には「常楽寺領二石・天白領二石」と見え、江戸時代に寺領2石を有していたことが確認できます。&#34;,&#34;sources_note&#34;:&#34;『静岡県磐田郡誌』652〜655頁・『日本歴史地名大系』堀之内村の項&#34;}],&#34;founded_period&#34;:&#34;天正13年（1585年）&#34;,&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0078&#34;,&#34;slug&#34;:&#34;daisenji-toyohamanakano&#34;,&#34;name&#34;:&#34;大泉寺&#34;,&#34;name_kana&#34;:&#34;だいせんじ&#34;,&#34;aliases&#34;:[&#34;明光山大泉寺&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市豊浜中野744番地の1&#34;,&#34;district_id&#34;:&#34;fukude&#34;,&#34;area&#34;:&#34;福田&#34;,&#34;main_deity&#34;:&#34;聖観世音菩薩（大正10年刊『静岡県磐田郡誌』による）&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;大泉寺（だいせんじ）は静岡県磐田市豊浜中野にある曹洞宗の寺院で、明光山と号し、西浅羽村松秀寺（現袋井市）の末寺でした。大正10年（1921年）刊『静岡県磐田郡誌』が引く寺記によれば、慶長19年（1614年）2月に村内の加藤佐太夫が施主となり、大坂塩町の京屋次郎兵衛から譲り受けた聖観世音菩薩を本尊として創建され、松秀寺5世松山門鶴和尚を開山とします。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9314&#34;},{&#34;title&#34;:&#34;【大泉寺】静岡県磐田市豊浜中野744番地の1｜曹洞宗の寺院（サーチ寺院）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;国税庁法人番号公表データに基づく寺院情報。曹洞宗、〒437-1201 磐田市豊浜中野744番地の1、法人番号4080405005525（2015年10月5日指定）を本文で確認。&#34;,&#34;url&#34;:&#34;https://www.bukkyou.com/TSInfo/T_22/Info2555000504084.html&#34;},{&#34;title&#34;:&#34;絹本著色釈迦十六善神画像｜磐田市公式ウェブサイト&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;県指定文化財の同画像（鎌倉時代後期）の所在は豊浜中野の白山神社と本文で確認。当寺の所蔵ではないため、寺院ページに文化財として記載しないこと。&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/sports_midokoro/bunkazai/kenshitei/1002057.html&#34;},{&#34;title&#34;:&#34;福田町（静岡県） - Wikipedia&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;豊浜地区を含む旧福田町の沿革（1896年磐田郡編入、1955年豊浜村と合併、2005年磐田市へ合併）を本文で確認。&#34;,&#34;url&#34;:&#34;https://ja.wikipedia.org/wiki/%E7%A6%8F%E7%94%B0%E7%94%BA_(%E9%9D%99%E5%B2%A1%E7%9C%8C)&#34;},{&#34;title&#34;:&#34;静岡県磐田郡教育会編『静岡県磐田郡誌』（大正10年刊）666〜667頁（コマ442）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション。曹洞宗寺院の部「19 大泉寺（豊浜村）」。明光山・松秀寺末・慶長19年の本尊勧請と松山門鶴開山を確認&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680&#34;},{&#34;title&#34;:&#34;大泉寺 - 曹洞禅ナビ寺院検索&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;名称・フリガナ（ダイセンジ）・住所（磐田市豊浜中野744-1）のみ掲載。由緒・本尊・年中行事欄は未記入。&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220895.html&#34;}],&#34;research_todos&#34;:[&#34;同じ豊浜中野地区の白山神社には県指定文化財「絹本著色釈迦十六善神画像」（鎌倉時代後期）があり、当寺との歴史的関係（管理・法要等）の有無を郷土資料で確認する&#34;,&#34;『福田町史』『磐田市誌』で創建年代・開山・沿革の記事を確認する&#34;,&#34;山号・本尊を現地で確認する&#34;,&#34;曹洞禅ナビ（sotozen-navi.com）への掲載有無を再確認する（今回の検索では確認できず）&#34;,&#34;近接する同地区の西福寺（豊浜中野725番地の1）との関係を確認する&#34;,&#34;現在の本尊・山号が『磐田郡誌』の記載（聖観世音菩薩・明光山）と同一か寺院側資料で確認する&#34;,&#34;『福田町史』で寺記の内容（加藤佐太夫・京屋次郎兵衛）の詳細を確認する&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;所在と宗派&#34;,&#34;body&#34;:&#34;大泉寺は曹洞宗に属し、国税庁の法人番号公表データに基づく寺院情報サイトに磐田市豊浜中野744番地の1の宗教法人として掲載されています。『静岡県磐田郡誌』（大正10年＝1921年刊）は所在を「豊浜村中野字宮下」と記し、同じ字宮下には同宗の西福寺が並んで所在します。中野はもと山名郡中野村で、明治22年（1889年）に豊田郡豊浜村と合併して山名郡豊浜村となり、明治29年（1896年）の郡再編で磐田郡に属しました。昭和30年（1955年）に福田町と豊浜村が合併して福田町の一部となり、福田町は平成17年（2005年）4月1日の合併で現在の磐田市の一部となっています。&#34;,&#34;sources_note&#34;:&#34;法人番号公表データ・『静岡県磐田郡誌』&#34;},{&#34;heading&#34;:&#34;『静岡県磐田郡誌』にみる由緒&#34;,&#34;body&#34;:&#34;『静岡県磐田郡誌』は大泉寺の由緒について、明光山と号し、西浅羽村松秀寺（現袋井市浅羽地区の曹洞宗寺院）の末寺で、本尊は聖観世音菩薩と記しています。寺記によれば、慶長19年（1614年）2月に村内の加藤佐太夫が施主となり、摂州大坂塩町の京屋次郎兵衛から譲り受けた像を本尊とし、松秀寺5世の松山門鶴和尚を開山として創建されました。大坂の商人から本尊を譲り受けたという伝えは、遠州灘沿岸と上方を結ぶ海運のつながりを思わせる記述です。開山の松山門鶴和尚は、永禄2年（1559年）草創と伝える福田村中の観音寺の開山にも名が見える松秀寺の僧です。&#34;,&#34;sources_note&#34;:&#34;『静岡県磐田郡誌』666〜667頁&#34;}],&#34;founded_period&#34;:&#34;慶長19年（1614年）&#34;,&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0079&#34;,&#34;slug&#34;:&#34;saifukuji-toyohamanakano&#34;,&#34;name&#34;:&#34;西福寺&#34;,&#34;name_kana&#34;:&#34;さいふくじ&#34;,&#34;aliases&#34;:[&#34;蔵海山西福寺&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市豊浜中野725番地の1&#34;,&#34;district_id&#34;:&#34;fukude&#34;,&#34;area&#34;:&#34;福田&#34;,&#34;main_deity&#34;:&#34;釈迦牟尼如来（大正10年刊『静岡県磐田郡誌』による）&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;西福寺（さいふくじ）は静岡県磐田市豊浜中野にある曹洞宗の寺院で、蔵海山と号し、西浅羽村松秀寺（現袋井市）の末寺でした。大正10年（1921年）刊『静岡県磐田郡誌』によれば、慶長10年（1605年）5月12日に松秀寺4世耕翁盛舜和尚が開創し、秋野・加藤・山下ら村の家々が殿堂を建立しました。安政元年（1854年）の地震で倒壊した後に再建されています。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9316&#34;},{&#34;title&#34;:&#34;静岡県磐田市 西福寺（サーチ寺院）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;国税庁法人番号公表データに基づく寺院情報。読み「さいふくじ」、〒437-1201 磐田市豊浜中野725番地の1、法人番号2080405005502（2015年10月5日指定）を本文で確認。宗派の明記はこのページでは確認できなかった。&#34;,&#34;url&#34;:&#34;https://www.bukkyou.com/TSInfo/T_22/Info0255000504082.html&#34;},{&#34;title&#34;:&#34;福田町（静岡県） - Wikipedia&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;豊浜地区を含む旧福田町の沿革（1896年磐田郡編入、1955年豊浜村と合併、2005年磐田市へ合併）を本文で確認。&#34;,&#34;url&#34;:&#34;https://ja.wikipedia.org/wiki/%E7%A6%8F%E7%94%B0%E7%94%BA_(%E9%9D%99%E5%B2%A1%E7%9C%8C)&#34;},{&#34;title&#34;:&#34;静岡県磐田郡教育会編『静岡県磐田郡誌』（大正10年刊）666〜667頁（コマ442）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション。曹洞宗寺院の部「20 西福寺（豊浜村）」。蔵海山・慶長10年開創・耕翁盛舜開山・安政元年震災倒壊を確認&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680&#34;},{&#34;title&#34;:&#34;西福寺 - 曹洞禅ナビ寺院検索&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;名称・フリガナ（サイフクジ）・住所（磐田市豊浜中野725-1）のみ掲載。由緒・本尊・年中行事欄は未記入。&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220892.html&#34;}],&#34;research_todos&#34;:[&#34;宗派（曹洞宗）の裏付けを曹洞禅ナビや静岡県宗教法人名簿で確認する（今回のWeb調査では宗派の明記を確認できず）&#34;,&#34;同じ豊浜中野地区の白山神社所蔵の県指定文化財「絹本著色釈迦十六善神画像」と当寺の関係の有無を郷土資料で確認する&#34;,&#34;『福田町史』『磐田市誌』で創建年代・開山・沿革の記事を確認する&#34;,&#34;山号・本尊を現地で確認する&#34;,&#34;近接する大泉寺との関係（本末・兼務等）を確認する&#34;,&#34;現在の本尊・山号が『磐田郡誌』の記載（釈迦牟尼如来・蔵海山）と同一か寺院側資料で確認する&#34;,&#34;『福田町史』で創建時の檀越（秋野・加藤・山下家）と中野村の関係を確認する&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;所在と沿革の手がかり&#34;,&#34;body&#34;:&#34;西福寺は、国税庁の法人番号公表データに基づく寺院情報サイトに磐田市豊浜中野725番地の1の宗教法人として掲載されており、読みは「さいふくじ」と記載されています。所在地の豊浜中野は旧磐田郡福田町の区域です。豊浜地区はもと山名郡に属し、明治29年（1896年）の郡制再編で磐田郡となり、昭和30年（1955年）に福田町と豊浜村が合併して福田町の一部となりました。同地区には曹洞宗の大泉寺（豊浜中野744番地の1）が近接しています。創建年代・山号・本尊などの沿革情報は、今回確認できた公開Web資料には記載がありません。&#34;},{&#34;heading&#34;:&#34;所在と宗派&#34;,&#34;body&#34;:&#34;西福寺は、国税庁の法人番号公表データに基づく寺院情報サイトに磐田市豊浜中野725番地の1の宗教法人として掲載されており、読みは「さいふくじ」と記載されています。『静岡県磐田郡誌』（大正10年＝1921年刊）は所在を「豊浜村中野字宮下」と記し、同じ字宮下には同宗の大泉寺（豊浜中野744番地の1）が近接しています。中野はもと山名郡中野村で、明治22年（1889年）に豊田郡豊浜村と合併して山名郡豊浜村となり、明治29年（1896年）の郡再編で磐田郡に属しました。昭和30年（1955年）に福田町と豊浜村が合併して福田町の一部となり、平成17年（2005年）の合併で現在の磐田市の一部となっています。&#34;,&#34;sources_note&#34;:&#34;法人番号公表データ・『静岡県磐田郡誌』&#34;},{&#34;heading&#34;:&#34;『静岡県磐田郡誌』にみる由緒&#34;,&#34;body&#34;:&#34;『静岡県磐田郡誌』は西福寺の由緒について、蔵海山と号し、西浅羽村松秀寺（現袋井市浅羽地区の曹洞宗寺院）の末寺で、本尊は釈迦牟尼如来と記しています。慶長10年（1605年）5月12日、松秀寺4世の耕翁盛舜和尚の開創で、秋野佐五兵衛・加藤太郎左衛門・六郎右衛門・山下治郎左衛門・加藤孫左衛門・同九郎左衛門らが殿堂を建立したと伝えます。開創者の耕翁盛舜和尚は、慶長9年（1604年）に南御厨村蛭池（現磐田市蛭池）の寿正寺を再興した僧としても同誌に登場し、江戸時代初頭の遠州南部で布教した松秀寺系の禅僧です。安政元年（1854年）の地震（安政東海地震）で堂宇が倒壊し、同誌編纂当時の堂宇はその後の建築によるものとされています。&#34;,&#34;sources_note&#34;:&#34;『静岡県磐田郡誌』666〜667頁・683〜684頁&#34;}],&#34;founded_period&#34;:&#34;慶長10年（1605年）&#34;,&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0080&#34;,&#34;slug&#34;:&#34;ryuunji-toyohama&#34;,&#34;name&#34;:&#34;竜雲寺&#34;,&#34;name_kana&#34;:&#34;りゅううんじ&#34;,&#34;aliases&#34;:[&#34;龍雲寺&#34;,&#34;福寿山龍雲寺&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市豊浜365番地の1&#34;,&#34;district_id&#34;:&#34;fukude&#34;,&#34;area&#34;:&#34;福田&#34;,&#34;main_deity&#34;:&#34;観世音菩薩（大正10年刊『静岡県磐田郡誌』による）&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;竜雲寺は静岡県磐田市豊浜にある曹洞宗の寺院で、福寿山と号し、西浅羽村松秀寺（現袋井市）の末寺でした。大正10年（1921年）刊『静岡県磐田郡誌』によれば、天正6年（1578年）7月6日に松秀寺3世閏室文歳和尚が開創し、本尊は観世音菩薩です。豊浜は旧磐田郡福田町の区域にあたります。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9318&#34;},{&#34;title&#34;:&#34;竜雲寺（磐田市）法人番号検索結果 - opengovjp&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;国税庁法人番号公表データに基づき、〒437-1202 磐田市豊浜365番地の1の宗教法人「竜雲寺」（法人番号4080405005558、2015年10月5日指定）を本文で確認。&#34;,&#34;url&#34;:&#34;https://opengovjp.com/corporate?q=%E7%AB%9C%E9%9B%B2%E5%AF%BA&#34;},{&#34;title&#34;:&#34;福田町（静岡県） - Wikipedia&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;豊浜を含む旧福田町の沿革（1896年磐田郡編入、1955年豊浜村と合併、2005年磐田市へ合併）を本文で確認。&#34;,&#34;url&#34;:&#34;https://ja.wikipedia.org/wiki/%E7%A6%8F%E7%94%B0%E7%94%BA_(%E9%9D%99%E5%B2%A1%E7%9C%8C)&#34;},{&#34;title&#34;:&#34;静岡県磐田郡教育会編『静岡県磐田郡誌』（大正10年刊）666〜667頁（コマ442）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション。曹洞宗寺院の部「18 龍雲寺（豊浜村）」。福寿山・松秀寺末・天正6年開創を確認&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680&#34;},{&#34;title&#34;:&#34;竜雲寺 - 曹洞禅ナビ寺院検索&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;名称・フリガナ（リュウウンジ）・住所（磐田市豊浜365-1）のみ掲載。由緒・本尊・年中行事欄は未記入。&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220915.html&#34;}],&#34;research_todos&#34;:[&#34;宗派（曹洞宗）の裏付けを曹洞禅ナビや静岡県宗教法人名簿で確認する（今回のWeb調査では宗派の明記を確認できず）&#34;,&#34;浜松市の西湖山龍雲寺（曹洞宗・宮家ゆかりの寺として著名）と同名で検索結果が混同しやすいため、資料調査時は所在地（磐田市豊浜）を必ず確認する&#34;,&#34;『福田町史』『磐田市誌』で創建年代・開山・沿革の記事を確認する&#34;,&#34;山号・本尊・表記（竜雲寺／龍雲寺）を現地で確認する&#34;,&#34;無住・兼務の状況を確認する&#34;,&#34;現在の本尊・山号が『磐田郡誌』の記載（観世音菩薩・福寿山）と同一か寺院側資料で確認する&#34;,&#34;開山名の表記（閏室文歳／潤室文歳）を『福田町史』等の活字資料で照合する&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;所在と沿革の手がかり&#34;,&#34;body&#34;:&#34;竜雲寺は、国税庁の法人番号公表データに基づく法人検索サイトで、〒437-1202 磐田市豊浜365番地の1に所在する宗教法人（法人番号4080405005558、2015年10月5日指定）として確認できます。所在地の豊浜は旧磐田郡福田町の区域です。豊浜地区はもと山名郡に属し、明治29年（1896年）の郡制再編で磐田郡となり、昭和30年（1955年）に福田町と豊浜村が合併して福田町の一部となりました。福田町は平成17年（2005年）4月1日の合併で現在の磐田市の一部となっています。創建年代・山号・本尊などの沿革情報は、今回確認できた公開Web資料には記載がありません。&#34;},{&#34;heading&#34;:&#34;所在と宗派&#34;,&#34;body&#34;:&#34;竜雲寺は、国税庁の法人番号公表データに基づく法人検索サイトで、〒437-1202 磐田市豊浜365番地の1に所在する宗教法人（法人番号4080405005558、2015年10月5日指定）として確認できます。『静岡県磐田郡誌』（大正10年＝1921年刊）は所在を「豊浜村豊浜元雁代字一の坪」と記しています。豊浜はもと豊田郡豊浜村の区域で、明治22年（1889年）に山名郡中野村と合併して山名郡豊浜村となり、明治29年（1896年）の郡再編で磐田郡に属しました。昭和30年（1955年）に福田町と豊浜村が合併して福田町の一部となり、福田町は平成17年（2005年）4月1日の合併で現在の磐田市の一部となっています。&#34;,&#34;sources_note&#34;:&#34;法人番号公表データ・『静岡県磐田郡誌』&#34;},{&#34;heading&#34;:&#34;『静岡県磐田郡誌』にみる由緒&#34;,&#34;body&#34;:&#34;『静岡県磐田郡誌』は竜雲寺（同誌では龍雲寺と表記）の由緒について、福寿山と号し、西浅羽村松秀寺（現袋井市浅羽地区の曹洞宗寺院）の末寺で、本尊は観世音菩薩と記しています。天正6年（1578年）7月6日、松秀寺3世の閏室文歳和尚の開創と伝え、今回対象の豊浜・中野地区の曹洞宗寺院（大泉寺・西福寺）の中では最も早い戦国末期の創建となります。松秀寺の歴代（3世閏室文歳・4世耕翁盛舜・5世松山門鶴）が天正から慶長にかけて相次いでこの一帯に末寺を開いており、遠州灘沿岸の村々へ松秀寺系の曹洞宗が広がっていく過程がうかがえます。&#34;,&#34;sources_note&#34;:&#34;『静岡県磐田郡誌』666〜667頁&#34;}],&#34;founded_period&#34;:&#34;天正6年（1578年）&#34;,&#34;cultural_assets&#34;:[]},{&#34;temple_id&#34;:&#34;iwata-0081&#34;,&#34;slug&#34;:&#34;sojiji-minamijima&#34;,&#34;name&#34;:&#34;宗次寺&#34;,&#34;name_kana&#34;:&#34;そうじじ&#34;,&#34;aliases&#34;:[&#34;宗寿寺&#34;,&#34;及光山宗次寺&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市南島149番地の1&#34;,&#34;district_id&#34;:&#34;fukude&#34;,&#34;area&#34;:&#34;福田&#34;,&#34;main_deity&#34;:&#34;聖観世音菩薩（大正10年刊『静岡県磐田郡誌』による）&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;宗次寺（そうじじ）は静岡県磐田市南島にある曹洞宗の寺院で、及光山と号し、西貝村福王寺（現磐田市西貝塚）の末寺でした。大正10年（1921年）刊『静岡県磐田郡誌』によれば、天文年間（1532〜1555年）に真言僧の南山玄甫が開いて宗寿寺と称し、天正16年（1588年）の火災による焼失後、宗次寺と改めて福王寺の天初玄祐和尚が曹洞宗寺院として再興しました。南島は旧南御厨村の大字で、昭和30年（1955年）に福田町へ編入された区域です。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9320&#34;},{&#34;title&#34;:&#34;宗次寺（磐田市）法人番号検索結果 - opengovjp&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;国税庁法人番号公表データに基づき、〒437-1209 磐田市南島149番地の1の宗教法人「宗次寺」（法人番号8080405005521、2015年10月5日指定）を本文で確認。&#34;,&#34;url&#34;:&#34;https://opengovjp.com/corporate?q=%E5%AE%97%E6%AC%A1%E5%AF%BA&#34;},{&#34;title&#34;:&#34;竜洋町 - Wikipedia&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;南島を含む旧竜洋町の沿革（1955年発足、2005年合併）を本文で確認。&#34;,&#34;url&#34;:&#34;https://ja.wikipedia.org/wiki/%E7%AB%9C%E6%B4%8B%E7%94%BA&#34;},{&#34;title&#34;:&#34;静岡県磐田郡教育会編『静岡県磐田郡誌』（大正10年刊）684〜685頁（コマ451）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション。曹洞宗寺院の部「69 宗次寺（南御厨村）」。及光山・天文年間開創・宗寿寺からの改号・天正16年火災・慶応2年再建を確認&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680&#34;},{&#34;title&#34;:&#34;『日本歴史地名大系』南島村の項（コトバンク）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;「宗寿寺（現曹洞宗宗次寺）領二石」の寺領記録と南島村の石高を確認。同項は南島村を磐田郡福田町の区域として立項&#34;,&#34;url&#34;:&#34;https://kotobank.jp/word/%E5%8D%97%E5%B3%B6%E6%9D%91&#34;},{&#34;title&#34;:&#34;Wikipedia「福田町 (静岡県)」&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;昭和30年（1955年）1月1日の南御厨村分割による大字南島・小島・蛭池の福田町編入を確認（従来記載の「旧竜洋町」を訂正）&#34;,&#34;url&#34;:&#34;https://ja.wikipedia.org/wiki/%E7%A6%8F%E7%94%B0%E7%94%BA_(%E9%9D%99%E5%B2%A1%E7%9C%8C)&#34;},{&#34;title&#34;:&#34;ニッポンの霊場 磐田郡三十三観音霊場&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;第33番＝老松山宗次寺（曹洞宗・磐田市南島）を確認。一覧の番地は南島268でDB登録住所（南島149-1）と異なるが、磐田市南島の曹洞宗宗次寺は1か寺のみで同一と判断。納めの御詠歌に「南島」とあり結願所。&#34;,&#34;url&#34;:&#34;https://nippon-reijo.jimdofree.com/%E6%8E%B2%E8%BC%89%E9%9C%8A%E5%A0%B4%E3%81%AE%E4%B8%80%E8%A6%A7/%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/%E7%A3%90%E7%94%B0%E9%83%A1%E4%B8%89%E5%8D%81%E4%B8%89%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/&#34;},{&#34;title&#34;:&#34;宗次寺 - 曹洞禅ナビ寺院検索&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;名称・フリガナ一致確認。住所は磐田市南島268-18と表示され、既存データ（南島149-1）と地番が異なる。由緒・本尊・年中行事欄は未記入。&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220995.html&#34;}],&#34;research_todos&#34;:[&#34;宗派（曹洞宗）の裏付けを曹洞禅ナビや静岡県宗教法人名簿で確認する（今回のWeb調査では宗派の明記を確認できず）&#34;,&#34;曹洞宗大本山總持寺（横浜市鶴見区）と読みが同じ「そうじじ」であり検索時に混同しやすいため、資料調査時は寺名の漢字（宗次寺）と所在地を必ず確認する&#34;,&#34;『竜洋町史』『磐田市誌』で創建年代・開山・沿革の記事を確認する&#34;,&#34;山号・本尊を現地で確認する&#34;,&#34;無住・兼務の状況を確認する&#34;,&#34;山号「及光山」の表記を寺院側資料・『福田町史』で確認する&#34;,&#34;現在の本尊が『磐田郡誌』の記載（聖観世音菩薩）と同一か確認する&#34;,&#34;曹洞禅ナビ掲載の住所は「磐田市南島268-18」で、バッチ指定の住所（磐田市南島149番地の1）と地番が一致しない。名称・フリガナ（ソウジジ）は完全一致のため同一寺院と思われるが、地番の相違は現地確認または別資料での裏取りが望ましい。&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;所在と沿革の手がかり&#34;,&#34;body&#34;:&#34;宗次寺は、国税庁の法人番号公表データに基づく法人検索サイトで、〒437-1209 磐田市南島149番地の1に所在する宗教法人（法人番号8080405005521、2015年10月5日指定）として確認できます。『静岡県磐田郡誌』（大正10年＝1921年刊）は所在を「南御厨村南島字東屋敷」と記しています。南島は江戸時代には幕府領の南島村（正保郷帳に村名が見え、田方442石余・畑方26石余）で、『日本歴史地名大系』には「宗寿寺（現曹洞宗宗次寺）領二石」と寺領の記録が見えます。明治22年（1889年）以降は磐田郡南御厨村の大字となり、昭和30年（1955年）1月1日の南御厨村分割で大字南島・小島・蛭池が福田町へ編入され、福田町は平成17年（2005年）4月1日の合併で現在の磐田市の一部となりました。&#34;,&#34;sources_note&#34;:&#34;法人番号公表データ・『静岡県磐田郡誌』・『日本歴史地名大系』南島村の項・Wikipedia福田町（静岡県）&#34;},{&#34;heading&#34;:&#34;『静岡県磐田郡誌』にみる由緒――真言から曹洞への転宗&#34;,&#34;body&#34;:&#34;『静岡県磐田郡誌』は宗次寺の由緒について、及光山と号し、西貝村福王寺（現磐田市西貝塚の曹洞宗寺院）の末寺で、本尊は聖観世音菩薩と記しています。天文年間（1532〜1555年）に密宗（真言宗）の僧南山玄甫がこの寺を開き、当初は「宗寿寺」と称しました。天正16年（1588年）7月に回禄（火災）にかかって堂宇は一時灰燼に帰し、のちに寺号を宗次寺と改め、福王寺の天初玄祐和尚が曹洞宗寺院として再興したと伝えます。江戸時代の郷帳類に「宗寿寺領二石」と旧号で記録されているのは、この改号の経緯と符合します。安政元年（1854年）の地震（安政東海地震）で堂宇は再び失われ、慶応2年（1866年）に再建されました。&#34;,&#34;sources_note&#34;:&#34;『静岡県磐田郡誌』684〜685頁・『日本歴史地名大系』南島村の項&#34;}],&#34;founded_period&#34;:&#34;天文年間（1532〜1555年）&#34;,&#34;cultural_assets&#34;:[],&#34;pilgrimage_note&#34;:&#34;磐田郡三十三観音霊場第33番札所（結願所）&#34;},{&#34;temple_id&#34;:&#34;iwata-0082&#34;,&#34;slug&#34;:&#34;keishoji-fukude&#34;,&#34;name&#34;:&#34;慶昌寺&#34;,&#34;name_kana&#34;:&#34;けいしょうじ&#34;,&#34;aliases&#34;:[&#34;円福山慶昌寺&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市福田1834番地&#34;,&#34;district_id&#34;:&#34;fukude&#34;,&#34;area&#34;:&#34;福田&#34;,&#34;main_deity&#34;:&#34;馬頭観世音菩薩（大正10年刊『静岡県磐田郡誌』による）&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;慶昌寺は磐田市福田にある曹洞宗の寺院で、円福山と号し、西浅羽村松秀寺（現袋井市）の末寺でした。大正10年（1921年）刊『静岡県磐田郡誌』によれば、享保8年（1723年）2月に松秀寺10世慈眼詳雲を請じて開山とし、本尊は馬頭観世音菩薩で、明治14年（1881年）9月に法地となりました。旧福田町域の福田地区中心部に位置します。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-12&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9322&#34;},{&#34;title&#34;:&#34;慶昌寺 - 曹洞禅ナビ（曹洞宗公式 寺院ポータルサイト）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;曹洞宗公式ポータルに磐田市福田1834の寺院として掲載されていることを本文で確認。山号・由緒の記載はなし。&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220996.html&#34;},{&#34;title&#34;:&#34;卍慶昌寺｜静岡県磐田市 - 八百万の神&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;宗派＝曹洞宗、所在地＝磐田市福田1834を確認。本尊欄は宗派標準（釈迦牟尼仏）の機械的表示のため採用せず。&#34;,&#34;url&#34;:&#34;https://yaokami.jp/1226491/&#34;},{&#34;title&#34;:&#34;静岡県磐田郡教育会編『静岡県磐田郡誌』（大正10年刊）684〜685頁（コマ451）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション。曹洞宗寺院の部「71 慶昌寺（福島村）」。円福山・松秀寺末・享保8年開山・馬頭観世音菩薩・明治14年法地を確認&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680&#34;},{&#34;title&#34;:&#34;Wikipedia「福田町 (静岡県)」&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;明治22年（1889年）福島村成立、大正15年（1926年）10月31日町制施行・福田町改称を確認&#34;,&#34;url&#34;:&#34;https://ja.wikipedia.org/wiki/%E7%A6%8F%E7%94%B0%E7%94%BA_(%E9%9D%99%E5%B2%A1%E7%9C%8C)&#34;},{&#34;title&#34;:&#34;ニッポンの霊場 磐田郡三十三観音霊場&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;第32番＝円福山慶昌寺（曹洞宗・福田1834）を確認。寺名・宗派・住所がDBと一致。&#34;,&#34;url&#34;:&#34;https://nippon-reijo.jimdofree.com/%E6%8E%B2%E8%BC%89%E9%9C%8A%E5%A0%B4%E3%81%AE%E4%B8%80%E8%A6%A7/%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/%E7%A3%90%E7%94%B0%E9%83%A1%E4%B8%89%E5%8D%81%E4%B8%89%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/&#34;},{&#34;title&#34;:&#34;慶昌寺(静岡県磐田市)の永代供養墓・樹木葬・納骨堂&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;永代供養サービス紹介ページ。寺院自身の発信ではなく仲介サイト。&#34;,&#34;url&#34;:&#34;https://eitaikuyo.jp/searcht/temple/T-0000037129&#34;},{&#34;title&#34;:&#34;指定避難所一覧 福田地区｜磐田市公式ウェブサイト&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;福田地区の指定避難所5施設に慶昌寺は含まれないことを確認。&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/bousai_anzen/bousai/hinanjo/1001129.html&#34;}],&#34;research_todos&#34;:[&#34;山号の確認（現地の寺号標・本堂扁額など）&#34;,&#34;創建年代・開山・本寺関係を『福田町史』『磐田市誌』で確認&#34;,&#34;本尊の確認&#34;,&#34;兵庫県川西市の同名寺院「定林山慶昌寺」との情報混同がWeb上で起きやすい点に注意（Jimdo公式サイトは川西市の寺院のもの）&#34;,&#34;境内の石造物・堂宇の現地確認&#34;,&#34;現在の本尊・山号が『磐田郡誌』の記載（馬頭観世音菩薩・円福山）と同一か寺院側資料で確認する&#34;,&#34;『福田町史』で享保8年創建の経緯と開基檀越を確認する&#34;,&#34;Facebook上に「慶昌寺」ページ（facebook.com/pages/慶昌寺/341705992576662）が見つかったが、福田の慶昌寺のものか詳細非公開のため未検証&#34;,&#34;由緒・年中行事・墓地・護持会等の詳細は現地または電話（0538-55-2439）での確認が必要&#34;,&#34;曹洞禅ナビの当該寺院ページは基本情報のみで年間行事欄は未記入&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;所在と宗派&#34;,&#34;body&#34;:&#34;慶昌寺は曹洞宗の寺院で、所在地は磐田市福田1834番地です。曹洞宗公式の寺院検索サイト「曹洞禅ナビ」に磐田市福田の寺院として登録されていることが確認できます。『静岡県磐田郡誌』（大正10年＝1921年刊）は所在を「福島村福田字村中」と記し、同じ字村中には同誌で永禄2年（1559年）草創と伝える曹洞宗の観音寺（遠州三十三観音霊場札所）が所在します。福田を含む一帯は明治22年（1889年）に山名郡福島村となり、大正15年（1926年）10月31日の町制施行で福田町と改称、平成17年（2005年）の合併で現在の磐田市の一部となりました。なお、兵庫県川西市にも同名の曹洞宗「定林山慶昌寺」（公式サイトあり）が存在しますが、これは別の寺院です。&#34;,&#34;sources_note&#34;:&#34;曹洞禅ナビ・『静岡県磐田郡誌』・Wikipedia福田町（静岡県）&#34;},{&#34;heading&#34;:&#34;『静岡県磐田郡誌』にみる由緒&#34;,&#34;body&#34;:&#34;『静岡県磐田郡誌』は慶昌寺の由緒について、円福山と号し、西浅羽村松秀寺（現袋井市浅羽地区の曹洞宗寺院）の末寺で、本尊は馬頭観世音菩薩と記しています。享保8年（1723年）2月、松秀寺10世の慈眼詳雲を請じて開山とし、明治14年（1881年）9月に法地（住職が代々住持する寺格）となりました。今回対象の福田・豊浜地区の松秀寺末寺（竜雲寺・大泉寺・西福寺・観音寺）が戦国末期から江戸時代初頭の創建と伝えるのに対し、慶昌寺は江戸時代中期の享保年間創建で、この一帯の松秀寺末としては新しい寺院にあたります。馬頭観世音菩薩を本尊とする点も、この地区では特色のある信仰です。&#34;,&#34;sources_note&#34;:&#34;『静岡県磐田郡誌』684〜685頁&#34;}],&#34;founded_period&#34;:&#34;享保8年（1723年）&#34;,&#34;cultural_assets&#34;:[],&#34;pilgrimage_note&#34;:&#34;磐田郡三十三観音霊場第32番札所&#34;,&#34;danka_info&#34;:{&#34;cemetery&#34;:&#34;民間の永代供養紹介サイトによれば、永代供養墓・樹木葬・納骨堂の取り扱いがあり、個別墓・合祀墓の選択肢があるとされる。ただし寺院公式発表ではなく仲介事業者による二次情報であり、内容の裏取りが必要。&#34;}},{&#34;temple_id&#34;:&#34;iwata-0083&#34;,&#34;slug&#34;:&#34;chosenji-fukudenakajima&#34;,&#34;name&#34;:&#34;長泉寺&#34;,&#34;name_kana&#34;:&#34;ちょうせんじ&#34;,&#34;aliases&#34;:[&#34;瑞光山長泉寺&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市福田中島445番地&#34;,&#34;district_id&#34;:&#34;fukude&#34;,&#34;area&#34;:&#34;福田&#34;,&#34;main_deity&#34;:&#34;薬師如来（『静岡県磐田郡誌』大正10年による。現況は要確認）&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;長泉寺は磐田市福田中島445番地にある曹洞宗の寺院で、山号は瑞光山です。大正10年（1921年）刊の『静岡県磐田郡誌』によれば、本尊は薬師如来で、蛭池の寿正寺の末寺として僧海雲が建立し、寿正寺開山の盛舜和尚を開祖に請じたと伝えます。盛舜は慶長9年（1604年）に寿正寺を再興し寛永元年（1624年）に示寂した僧であることから、長泉寺の草創も江戸時代初期とみられます。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-12&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9324&#34;},{&#34;title&#34;:&#34;静岡県磐田市福田中島の寺院一覧 - NAVITIME&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;福田中島の寺院として長泉寺（磐田市福田中島445）が掲載されていることを本文で確認。同町内の寺院はこの1件のみ。&#34;,&#34;url&#34;:&#34;https://www.navitime.co.jp/category/0705001/22211146000/&#34;},{&#34;title&#34;:&#34;卍長泉寺｜静岡県磐田市 - 八百万の神&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;宗派＝曹洞宗、所在地＝磐田市福田中島445を確認。&#34;,&#34;url&#34;:&#34;https://yaokami.jp/1226496/&#34;},{&#34;title&#34;:&#34;『静岡県磐田郡誌』静岡県磐田郡教育会編、大正10年（第13章 神社及宗教・寺院各説72「長泉寺」）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション（インターネット公開・保護期間満了）。451コマ&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680/1/451&#34;},{&#34;title&#34;:&#34;日本歴史地名大系「中島村」（コトバンク）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;遠江国（磐田郡福田町域）の中島村の項。鎌田御厨・中嶋新開田の記載&#34;,&#34;url&#34;:&#34;https://kotobank.jp/word/中島村&#34;},{&#34;title&#34;:&#34;ニッポンの霊場 遠江四十九薬師霊場&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;番外1＝瑞光山長泉寺（曹洞宗・磐田市福田町中島・薬師如来）を確認。DBの長泉寺（福田中島445）と一致。番外御詠歌にも「長泉寺」の記載あり。&#34;,&#34;url&#34;:&#34;https://nippon-reijo.jimdofree.com/%E6%8E%B2%E8%BC%89%E9%9C%8A%E5%A0%B4%E3%81%AE%E4%B8%80%E8%A6%A7/%E8%96%AC%E5%B8%AB%E9%9C%8A%E5%A0%B4/%E9%81%A0%E6%B1%9F%E5%9B%9B%E5%8D%81%E4%B9%9D%E8%96%AC%E5%B8%AB%E9%9C%8A%E5%A0%B4/&#34;},{&#34;title&#34;:&#34;仏教寺院の調査【長泉寺】静岡県磐田市福田中島445番地&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;所在地・宗派（曹洞宗）・本尊情報の記載を確認。&#34;,&#34;url&#34;:&#34;https://www.jpinf.com/BukyJpinf/TJpinfNO22/InJPinf0552650400803.html&#34;},{&#34;title&#34;:&#34;寺院名:長泉寺(曹洞宗-静岡県磐田市)の詳細&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;寺院基礎情報のディレクトリ掲載。&#34;,&#34;url&#34;:&#34;https://www.hyakuryudo.com/jiin_search/shizuoka/jiincd22211_106.html&#34;},{&#34;title&#34;:&#34;長泉寺(静岡県磐田市)の永代供養墓・樹木葬・納骨堂&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;永代供養サービス紹介ページ。仲介サイトであり寺院公式情報ではない。&#34;,&#34;url&#34;:&#34;https://eitaikuyo.jp/searcht/temple/T-0000037133&#34;},{&#34;title&#34;:&#34;指定避難所一覧 福田地区｜磐田市公式ウェブサイト&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;福田地区の指定避難所5施設に長泉寺は含まれないことを確認。&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/bousai_anzen/bousai/hinanjo/1001129.html&#34;},{&#34;title&#34;:&#34;長泉寺 - 曹洞禅ナビ寺院検索&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;名称・フリガナ（チョウセンジ）・住所（磐田市福田中島445）一致確認。由緒・本尊・年中行事欄は未記入。&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220997.html&#34;}],&#34;research_todos&#34;:[&#34;山号の確認（現地の寺号標・本堂扁額など）&#34;,&#34;創建年代・開山・本寺関係を『福田町史』『磐田市誌』で確認&#34;,&#34;本尊の確認&#34;,&#34;全国の同名寺院（福井県小浜市の長泉寺など）との混同に注意して資料を精査する&#34;,&#34;福田中島集落と寺の関わり（檀家組織・行事）の現地調査&#34;,&#34;『福田町史』資料編・通史編での長泉寺の記述確認（国立国会図書館デジタルコレクションでは全文検索で該当箇所が10件以上と表示されるがスニペット閲覧不可。図書館での原本確認が必要）&#34;,&#34;現在の本尊が郡誌記載どおり薬師如来かどうかの現地確認&#34;,&#34;山号「瑞光山」の現地表記（山門・扁額等）の確認&#34;,&#34;本尊・秘仏開帳サイクルの記述は複数の民間寺院データベースの又聞き情報であり、寺院への一次確認が必要&#34;,&#34;由緒・年中行事・護持会等の詳細は現地または電話での確認が必要&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;所在と宗派&#34;,&#34;body&#34;:&#34;長泉寺は曹洞宗の寺院で、所在地は磐田市福田中島445番地です。地図情報サイトの福田中島の寺院一覧では長泉寺1件のみが掲載されており、集落唯一の寺院であることが確認できます。中島は今之浦川と僧川の合流点付近に開けた集落で、『日本歴史地名大系』によれば中世には伊勢神宮領鎌田御厨の一部であり、正治2年（1200年）の史料に「遠江国鎌田御厨内字中嶋新開田」とみえる新田開発の地でした。明治22年（1889年）以降は磐田郡福島村に属し、のち福田町を経て現在は磐田市福田中島となっています。全国には秋田市・石川県石川町・福井県小浜市など同名の「長泉寺」が多数あり、曹洞宗公式ポータルの検索でも他県の同名寺院が先に表示されるため、情報の混同に注意が必要です。&#34;},{&#34;heading&#34;:&#34;『静岡県磐田郡誌』にみる由緒&#34;,&#34;body&#34;:&#34;大正10年（1921年）刊の『静岡県磐田郡誌』の寺院各説には「長泉寺（福島村）」として「福島村中島字北浦に在り。瑞光山と号す。本尊は薬師如来にして、当郡南御厨村蛭池寿正寺の末寺なり。僧海雲といふ者之れを建立し、寿正寺盛舜和尚を請じて開祖とせり」と記されています。開祖の耕翁盛舜和尚は慶長9年（1604年）に蛭池の寿正寺を再興し、寛永元年（1624年）4月20日に示寂した僧であるため、長泉寺の建立はその存命中、すなわち江戸時代初期にさかのぼるとみられます。同郡誌の寺院一覧では、蛭池の寿正寺を本寺とする末寺として当寺と常楽寺（福島村下太）が並んで挙げられており、寿正寺を中心とする地域的な本末関係の中に位置づけられていたことがわかります。創建の詳しい年月や近世以降の沿革を伝える公開資料は、現時点では確認できていません。&#34;}],&#34;founded_period&#34;:&#34;江戸時代初期（慶長〜寛永年間か。開祖に請じられた寿正寺盛舜和尚の活動期から推定）&#34;,&#34;cultural_assets&#34;:[],&#34;pilgrimage_note&#34;:&#34;遠江四十九薬師霊場番外札所（札所本尊薬師如来）&#34;,&#34;danka_info&#34;:{&#34;annual_events&#34;:[{&#34;name&#34;:&#34;本尊薬師如来の御開帳&#34;,&#34;timing&#34;:&#34;寅年（12年に1度）&#34;,&#34;note&#34;:&#34;秘仏とされ、寅年に開帳されると伝えられる（民間寺院データベースの記述に基づき、寺院一次情報での裏取りは未了）&#34;}],&#34;cemetery&#34;:&#34;民間の永代供養紹介サイトによれば、永代供養墓・樹木葬・納骨堂の取り扱いがあり、個別墓・合祀墓の選択肢があるとされる。寺院公式発表ではなく仲介事業者による二次情報であり、内容の裏取りが必要。&#34;}},{&#34;temple_id&#34;:&#34;iwata-0084&#34;,&#34;slug&#34;:&#34;kannonji-fukude&#34;,&#34;name&#34;:&#34;観音寺&#34;,&#34;name_kana&#34;:&#34;かんのんじ&#34;,&#34;aliases&#34;:[&#34;円通山観音寺&#34;,&#34;円通院（旧称）&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市福田688番地の1&#34;,&#34;district_id&#34;:&#34;fukude&#34;,&#34;area&#34;:&#34;福田&#34;,&#34;main_deity&#34;:&#34;聖観世音菩薩&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;公開情報調査済み&#34;,&#34;history_summary&#34;:&#34;観音寺は磐田市福田688番地の1にある曹洞宗の寺院で、山号は円通山です。遠州三十三観音霊場の第21番札所で、本尊の聖観世音菩薩は恵心僧都の作と伝えられる秘仏です。寺伝では明応3年（1494年）に開創された円通院を前身とし、永禄2年（1559年）に円通院観音寺と改められたと伝えられます。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-12&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9326&#34;},{&#34;title&#34;:&#34;観音寺（磐田市福田・21番札所）| 遠州三十三観音霊場めぐり&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;霊場公式サイト本文で山号（円通山）、第21番札所、御詠歌、本尊（聖観世音菩薩・恵心僧都作と伝承・秘仏で午年開帳）、縁起（明応3年円通院開創→遷座→永禄2年改称開山）、見どころ（本堂・観音堂・山門・水かけ地蔵・江戸時代の手洗い鉢）を確認。&#34;,&#34;url&#34;:&#34;http://enshu33.com/all-guide/%E8%A6%B3%E9%9F%B3%E5%AF%BA/&#34;},{&#34;title&#34;:&#34;観音寺 - 曹洞禅ナビ（曹洞宗公式 寺院ポータルサイト）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;曹洞宗公式ポータルで所在地（磐田市福田688-1）、坐禅会不定期開催、認可参禅道場・梅花講の設置を確認。&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220989.html&#34;},{&#34;title&#34;:&#34;卍観音寺｜静岡県磐田市 - 八百万の神&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;宗派＝曹洞宗、所在地＝磐田市福田688-1を確認。&#34;,&#34;url&#34;:&#34;https://yaokami.jp/1226492/&#34;},{&#34;title&#34;:&#34;遠州三十三観音霊場めぐり 観音寺（21番札所）&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;円通山観音寺（福田688-1）のご本尊が聖観世音菩薩（恵心僧都作と伝わる秘仏・午年に1週間開帳）であることを公式ページ本文で確認。&#34;,&#34;url&#34;:&#34;http://enshu33.com/all-guide/%e8%a6%b3%e9%9f%b3%e5%af%ba/&#34;},{&#34;title&#34;:&#34;ニッポンの霊場 磐田郡三十三観音霊場&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;第1番＝円通山観音寺（福田688）を確認。&#34;,&#34;url&#34;:&#34;https://nippon-reijo.jimdofree.com/%E6%8E%B2%E8%BC%89%E9%9C%8A%E5%A0%B4%E3%81%AE%E4%B8%80%E8%A6%A7/%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/%E7%A3%90%E7%94%B0%E9%83%A1%E4%B8%89%E5%8D%81%E4%B8%89%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/&#34;},{&#34;title&#34;:&#34;観音寺(磐田市福田・21番札所) - 遠州三十三観音霊場めぐり&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;霊場会公式サイト。縁起・本尊・所在地・電話・FAX・アクセスを確認。&#34;,&#34;url&#34;:&#34;http://enshu33.com/all-guide/観音寺/&#34;},{&#34;title&#34;:&#34;指定避難所一覧 福田地区｜磐田市公式ウェブサイト&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;福田地区の指定避難所5施設に観音寺は含まれないことを確認。&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/bousai_anzen/bousai/hinanjo/1001129.html&#34;}],&#34;research_todos&#34;:[&#34;円通院の旧地（原野谷川上流域のどこか）と移転の経緯を郷土資料で確認&#34;,&#34;大暉霊曜禅師・松山鶴禅師の伝記的事実と大洞院（森町）六派との関係の裏取り&#34;,&#34;秘仏本尊の直近の開帳年（午年）の実績確認&#34;,&#34;江戸時代の手洗い鉢の年紀の現地確認&#34;,&#34;観音堂の建立年代の確認&#34;,&#34;檀家組織・墓地・駐車場の実務情報は現地または電話（0538-55-2309）での確認が必要&#34;,&#34;遠州三十三観音霊場会事務局（可睡斎）経由での行事情報の追加確認が可能&#34;],&#34;founded_period&#34;:&#34;寺伝では明応3年（1494年）開創の円通院を前身とし、永禄2年（1559年）に円通院観音寺と改められたと伝わる&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;創建と沿革&#34;,&#34;body&#34;:&#34;霊場公式サイトに掲載された縁起によれば、明応3年（1494年）に大洞院六派の一人である大暉霊曜禅師が開創した円通院が動乱に遭い、観音像を奉祀する一族とともに原野谷川を南下して当地に遷り、一堂宇を建立して円通院と称したと伝えられます。その後、永禄2年（1559年）に松山鶴禅師が円通院観音寺と改めて開山したと記されています。観音像は福田地方の守り本尊として崇敬され、家内安全・生業繁栄・大漁満足などの祈願が寄せられてきたと伝えられます。本尊の聖観世音菩薩は恵心僧都の作と伝えられる秘仏で、午年に1週間開帳されると紹介されています。&#34;},{&#34;heading&#34;:&#34;境内と現在&#34;,&#34;body&#34;:&#34;霊場公式サイトの見どころ紹介には、本堂・観音堂・山門・水かけ地蔵・江戸時代の手洗い鉢が挙げられています。曹洞宗公式ポータル「曹洞禅ナビ」には認可参禅道場および梅花講を有する寺院として掲載されており、坐禅会は不定期で開催されています。遠州三十三観音霊場第21番札所として巡拝者を迎えており、御詠歌は「ふくしまや いそうつなみの おとたかく ふかきぐぜいの うみとしるらん」と定められています。&#34;},{&#34;heading&#34;:&#34;檀家向け情報の補足&#34;,&#34;body&#34;:&#34;円通山観音寺は、明応3年（1494年）に大洞院六派の一人・大暉霊曜禅師が開創した円通院が動乱により原野谷川を南下し当地に遷座して一堂宇を建立したのが始まりと伝えられ、永禄2年（1559年）に松山鶴禅師が円通院観音寺と改めて開山したとされる。&#34;}],&#34;pilgrimage_note&#34;:&#34;遠州三十三観音霊場第21番札所（札所本尊聖観世音菩薩・午年に開帳される秘仏）／磐田郡三十三観音霊場第1番札所&#34;,&#34;danka_info&#34;:{&#34;annual_events&#34;:[{&#34;name&#34;:&#34;本尊聖観世音菩薩の御開帳&#34;,&#34;timing&#34;:&#34;午年に1週間&#34;,&#34;note&#34;:&#34;秘仏の本尊が午年（12年に1度）に1週間開帳されると伝えられる。遠州三十三観音霊場会公式サイトに記載。&#34;}],&#34;organization&#34;:&#34;梅花講（曹洞宗の詠讃歌講）の活動があると曹洞禅ナビに掲載されている。ただし護持会・世話人会等の檀家組織に関する情報は確認できず。&#34;}},{&#34;temple_id&#34;:&#34;iwata-0085&#34;,&#34;slug&#34;:&#34;ryuhoin-ohara&#34;,&#34;name&#34;:&#34;龍法院&#34;,&#34;name_kana&#34;:&#34;りゅうほういん&#34;,&#34;aliases&#34;:[&#34;潮音山龍法院&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市大原2371番地&#34;,&#34;district_id&#34;:&#34;fukude&#34;,&#34;area&#34;:&#34;福田&#34;,&#34;main_deity&#34;:&#34;十一面観世音菩薩（『静岡県磐田郡誌』大正10年による。現況は要確認）&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;龍法院は磐田市大原2371番地にある曹洞宗の寺院で、山号は潮音山です。『静岡県磐田郡誌』（大正10年）によれば、文禄2年（1593年）に村人が相はかって文甫作公のために建立し、後に荒廃したものを宝永3年（1706年）に御厨村全久院第4世昌室文久和尚が再興して中興開山となり、以来全久院の末寺となりました。明治6年（1873年）には福田学校の分校（大原分校）が当院を仮用して開かれるなど、地域の拠点としての歩みも記録されています。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9328&#34;},{&#34;title&#34;:&#34;静岡県磐田市大原の寺院一覧 - NAVITIME&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;大原地区の寺院として龍法院（磐田市大原2371）が掲載されていることを本文で確認。同地区の寺院はこの1件のみ。&#34;,&#34;url&#34;:&#34;https://www.navitime.co.jp/category/0705001/22211007000/&#34;},{&#34;title&#34;:&#34;卍龍法院｜静岡県磐田市 - 八百万の神&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;宗派＝曹洞宗、所在地＝磐田市大原2371を確認。&#34;,&#34;url&#34;:&#34;https://yaokami.jp/1226517/&#34;},{&#34;title&#34;:&#34;『静岡県磐田郡誌』静岡県磐田郡教育会編、大正10年（第13章 寺院各説77「龍法院」ほか、285コマに大原分校の記事）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション（インターネット公開）。452コマの原本画像で由緒本文を確認&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680/1/452&#34;},{&#34;title&#34;:&#34;『福田町史』資料編3（福田町史編さん委員会編、1997年）所収「安政三年 下大原村龍法院地蔵堂の再建入用払物帳」&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション全文検索のスニペット（目次）で確認&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/search/searchResult?fullText=true&#38;keyword=%E9%BE%8D%E6%B3%95%E9%99%A2&#34;},{&#34;title&#34;:&#34;静岡県磐田市大原の電話帳検索&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;所在地（磐田市大原2371）・電話番号（0538-55-2787）のみ確認できる簡易ディレクトリ。&#34;,&#34;url&#34;:&#34;https://minorusan.net/2007-43-34-89.html&#34;},{&#34;title&#34;:&#34;指定避難所一覧 豊田地区｜磐田市公式ウェブサイト&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;大原を含む豊田地区の指定避難所6施設に龍法院は含まれないことを確認。&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/bousai_anzen/bousai/hinanjo/1001131.html&#34;},{&#34;title&#34;:&#34;龍法院 - 曹洞禅ナビ寺院検索&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;名称・フリガナ（リュウホウイン）・住所（磐田市大原2371）一致確認。由緒・本尊・年中行事欄は未記入。&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_221009.html&#34;}],&#34;research_todos&#34;:[&#34;山号の確認（現地の寺号標・本堂扁額など）&#34;,&#34;創建年代・開山・本寺関係を『磐田市誌』等の郷土資料で確認&#34;,&#34;本尊の確認&#34;,&#34;「院」号を称する経緯（塔頭・隠居寺由来かどうか）の調査&#34;,&#34;大原の浅間神社との歴史的関係（別当など）の有無を確認&#34;,&#34;郡誌の中興年「宝永3年（1706年）」は、同じ昌室文久（全久院第4世）が寛永5年（1628年）に稗原の金泉寺を開山したという同書の記述と年代が整合しないため、原典・他資料での照合が必要&#34;,&#34;「文甫作公」が誰を指すか（開基者の人名か戒名か）の確認&#34;,&#34;延命地蔵・地蔵堂の現存状況の現地確認&#34;,&#34;データベース上の地区分類（現在「南部」）について、大原が旧下大原村→於保村→福田町域である点を踏まえた見直し&#34;,&#34;公式サイト・SNS・宗派ポータル（曹洞禅ナビ）のいずれにも掲載が見つからず、オンライン上の情報が極めて乏しい。由緒・年中行事・墓地・檀家組織・駐車場は現地または電話（0538-55-2787）での確認が必須&#34;,&#34;山号「潮音山」の独立した裏取りソースは確認できなかった&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;所在と宗派&#34;,&#34;body&#34;:&#34;龍法院は曹洞宗の寺院で、所在地は磐田市大原2371番地です。地図情報サイトの大原地区の寺院一覧では龍法院1件のみが掲載されており、地区唯一の寺院であることが確認できます。大原は近世には上大原村・下大原村に分かれており、龍法院は下大原の字四貫野に所在しました。明治22年（1889年）以降は磐田郡於保村に属し、『福田町史』が大原地区の資料を収録しています。大原地区には大正4年（1915年）造営の本殿が磐田市指定文化財となっている浅間神社がありますが、龍法院自体の指定文化財は磐田市の市指定文化財一覧には見当たりません。&#34;},{&#34;heading&#34;:&#34;『静岡県磐田郡誌』にみる由緒&#34;,&#34;body&#34;:&#34;大正10年（1921年）刊の『静岡県磐田郡誌』の寺院各説には「龍法院（於保村）」として「於保村大原、元下大原字四貫野に在り。潮音山と号す。本尊は十一面観世音菩薩にして、当郡御厨村全久院の末寺なり」と記されています。由緒については、文禄2年（1593年）に村人が相はかり「文甫作公」のために一寺を建立したのが始まりで、その後荒廃しましたが、宝永3年（1706年）に全久院第4世昌室文久和尚がこれを恢復して自ら中興開山となり、以来全久院の末寺となったと伝えます。&#34;},{&#34;heading&#34;:&#34;地蔵堂と学校のあゆみ&#34;,&#34;body&#34;:&#34;『福田町史』資料編3（近世）には「安政三年 下大原村龍法院地蔵堂の再建入用払物帳」という文書が収録されており、安政3年（1856年）に境内の地蔵堂が再建されたことがわかります。また『福田町史』資料編民俗には「龍法院の延命地蔵」の項が立てられており、地蔵信仰の場として親しまれてきたことがうかがえます。『静岡県磐田郡誌』の教育の章には、明治6年（1873年）6月1日に福田学校の分校として下大原村の龍法院を仮用して大原分校が設立されたことが記されており、近代初期には地域の学校教育の場ともなりました。&#34;}],&#34;founded_period&#34;:&#34;文禄2年（1593年）&#34;,&#34;cultural_assets&#34;:[],&#34;danka_info&#34;:{}},{&#34;temple_id&#34;:&#34;iwata-0086&#34;,&#34;slug&#34;:&#34;zohonji-ikago&#34;,&#34;name&#34;:&#34;蔵本寺&#34;,&#34;name_kana&#34;:&#34;ぞうほんじ&#34;,&#34;aliases&#34;:[&#34;藏本寺&#34;,&#34;金宝山蔵本寺&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市五十子26番地&#34;,&#34;district_id&#34;:&#34;fukude&#34;,&#34;area&#34;:&#34;福田&#34;,&#34;main_deity&#34;:&#34;地蔵菩薩（『静岡県磐田郡誌』大正10年による。現況は要確認）&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;蔵本寺（藏本寺）は磐田市五十子26番地にある曹洞宗の寺院で、山号は金宝山です。『静岡県磐田郡誌』（大正10年）によれば、慶長2年（1597年）に御厨村全久院第2世潤室文歳の開創で、本尊は地蔵菩薩、全久院の末寺でした。享保7年（1722年）の五十子村の村況文書に「蔵本寺領高反別」が記されるなど、近世を通じて寺領を持つ村の菩提寺として存続したことが古文書からも確認できます。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9330&#34;},{&#34;title&#34;:&#34;卍藏本寺｜静岡県磐田市 - 八百万の神&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;宗派＝曹洞宗、所在地＝磐田市五十子26を本文で確認。旧字体「藏本寺」表記。本尊欄は宗派標準の機械的表示のため採用せず。&#34;,&#34;url&#34;:&#34;https://yaokami.jp/1226497/&#34;},{&#34;title&#34;:&#34;『静岡県磐田郡誌』静岡県磐田郡教育会編、大正10年（第13章 寺院各説79「蔵本寺」）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション（インターネット公開）。452コマの原本画像で由緒本文を確認&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680/1/452&#34;},{&#34;title&#34;:&#34;『磐田市郷土資料目録』磐田市誌編纂委員会、1985年&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション全文検索のスニペットで蔵本寺領高反別の記載を確認&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/search/searchResult?fullText=true&#38;keyword=%E8%94%B5%E6%9C%AC%E5%AF%BA%20%E4%BA%94%E5%8D%81%E5%AD%90&#34;},{&#34;title&#34;:&#34;日本歴史地名大系「五十子村」（コトバンク）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;「伊加子荒野」の初見史料と村の位置の記載&#34;,&#34;url&#34;:&#34;https://kotobank.jp/word/五十子村&#34;},{&#34;title&#34;:&#34;藏本寺(静岡県磐田市)の企業情報&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;宗教法人としての所在地（磐田市五十子26）を確認。行事・墓地等の記載なし。&#34;,&#34;url&#34;:&#34;https://houjin.goo.to/corporations/9080405005520&#34;},{&#34;title&#34;:&#34;曹洞禅ナビ 寺院検索&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;「蔵本寺」名での個別ページを検索したが該当ページを確認できず。&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/&#34;},{&#34;title&#34;:&#34;磐田市の寺院一覧／ホームメイト&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;掲載23寺院に蔵本寺は含まれず。&#34;,&#34;url&#34;:&#34;https://www.homemate-research-religious-building.com/bc175/22211/&#34;},{&#34;title&#34;:&#34;磐田市(静岡県)の寺院墓地｜寺院墓地.com&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;掲載墓地一覧に蔵本寺は含まれず。&#34;,&#34;url&#34;:&#34;https://www.jiin-bochi.com/area/shizuoka-22211.html&#34;},{&#34;title&#34;:&#34;藏本寺 - 曹洞禅ナビ寺院検索&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;名称（藏本寺、既存aliasesの表記と一致）・フリガナ（ゾウホンジ）・住所（磐田市五十子26）一致確認。由緒・本尊・年中行事欄は未記入。&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_221007.html&#34;}],&#34;research_todos&#34;:[&#34;山号の確認（現地の寺号標・本堂扁額など）&#34;,&#34;創建年代・開山・本寺関係を『竜洋町史』『磐田市誌』で確認&#34;,&#34;本尊の確認&#34;,&#34;寺号「蔵本／藏本」の由来（地名・経蔵などとの関係）の調査&#34;,&#34;五十子集落の歴史と寺の関わりの現地調査&#34;,&#34;第3世「林教」の法名表記（OCRでは判読が揺れるため原本での再確認が望ましい）&#34;,&#34;現在の本尊が郡誌記載どおり地蔵菩薩かどうかの現地確認&#34;,&#34;データベース上の地区分類（現在「竜洋」）について、五十子が旧山名郡五十子村→於保村→福田町域である点を踏まえた見直し&#34;,&#34;公式サイト・SNSの有無を現地または電話で確認&#34;,&#34;施餓鬼会・彼岸会等の年中行事の時期・檀家参列可否を確認&#34;,&#34;永代供養墓・納骨堂の有無を確認&#34;,&#34;護持会・世話人会等の檀家組織の有無を確認&#34;,&#34;五十子地区の自治会・防災（避難所指定）との関わりを確認&#34;,&#34;法事参列者向け駐車場情報を確認&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;所在と宗派&#34;,&#34;body&#34;:&#34;蔵本寺は曹洞宗の寺院で、所在地は磐田市五十子26番地です。寺院情報サイトでは旧字体の「藏本寺」の表記で掲載されています。所在地の五十子は「いかご」と読む難読地名で、『日本歴史地名大系』によれば正中2年（1325年）ごろと推定される度会行文譲状写に伊勢神宮領鎌田御厨内の「伊加子荒野」としてみえる古い地名です。五十子村は江戸時代には旧山名郡に属し、明治22年（1889年）以降は磐田郡於保村、のち福田町域となりました。『静岡県磐田郡誌』では蔵本寺の所在を「於保村五十子字東本田」と記しています。&#34;},{&#34;heading&#34;:&#34;『静岡県磐田郡誌』にみる由緒&#34;,&#34;body&#34;:&#34;大正10年（1921年）刊の『静岡県磐田郡誌』の寺院各説には「蔵本寺（於保村）」として「於保村五十子字東本田に在り。金宝山と号す。御厨村全久院末寺にして、本尊は地蔵菩薩なり。慶長二年、全久院第二世潤室文歳の開創なり。宝永五年、第三世林教堂宇を建替へ、造営し自ら中興となる」と記されています。開山の潤室文歳は文禄元年（1592年）に南御厨村和口の龍泉寺も開いた僧で、慶長2年（1597年）の当寺開創はその布教活動の一環とみられます。宝永5年（1708年）には第3世林教が堂宇を建て替えて中興しました。&#34;},{&#34;heading&#34;:&#34;古文書にみえる蔵本寺&#34;,&#34;body&#34;:&#34;磐田市がまとめた『磐田市郷土資料目録』（1985年）には、延宝4年（1676年）の五十子村年貢割付状や、享保7年（1722年）の五十子村の村況を記した文書が採録されており、後者には村の人数（男113人・女134人など）とともに「蔵本寺領高反別」が記されています。また『福田町史』資料編3（近世）に収められた文書には、寺院の住職継承をめぐって「五十子村蔵本寺様世話人ニ頼相済、六月十五日鑑司披露致ス」とみえ、蔵本寺が近隣寺院の人事の世話役を務めたことがわかります。近世の蔵本寺が寺領を持ち、地域の寺院ネットワークの中で一定の役割を担っていたことを示す記録です。&#34;}],&#34;founded_period&#34;:&#34;慶長2年（1597年）&#34;,&#34;cultural_assets&#34;:[],&#34;danka_info&#34;:{}},{&#34;temple_id&#34;:&#34;iwata-0087&#34;,&#34;slug&#34;:&#34;jushouji-hiruike&#34;,&#34;name&#34;:&#34;寿正寺&#34;,&#34;name_kana&#34;:&#34;じゅしょうじ&#34;,&#34;aliases&#34;:[&#34;壽正寺&#34;,&#34;松龍山寿正寺&#34;,&#34;松龍山壽正寺&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市蛭池230番地&#34;,&#34;district_id&#34;:&#34;fukude&#34;,&#34;area&#34;:&#34;福田&#34;,&#34;main_deity&#34;:&#34;地蔵菩薩（『静岡県磐田郡誌』大正10年による。現況は要確認）&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;寿正寺（壽正寺）は磐田市蛭池230番地にある曹洞宗の寺院で、山号は松龍山、本尊は地蔵菩薩です。『静岡県磐田郡誌』（大正10年）によれば、荒廃していた地蔵堂を村の有志が修理し、慶長9年（1604年）に西浅羽村松秀寺の耕翁盛舜和尚を興復の開祖に請じて再興、慶長12年（1607年）に諸堂伽藍を建立しました。近世には寺領4石を有する松秀寺末の法地格寺院で、中島の長泉寺・下太の常楽寺という末寺を持ち、宝永4年（1707年）と安政元年（1854年）の大地震で堂宇が倒壊しながらそのたびに再建されています。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9332&#34;},{&#34;title&#34;:&#34;卍壽正寺｜静岡県磐田市 - 八百万の神&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;宗派＝曹洞宗、所在地＝磐田市蛭池230を本文で確認。同サイトの磐田市一覧に草崎691-1の同名「壽正寺」が別に掲載されている点も確認。&#34;,&#34;url&#34;:&#34;https://yaokami.jp/1226498/&#34;},{&#34;title&#34;:&#34;『静岡県磐田郡誌』静岡県磐田郡教育会編、大正10年（第13章 寺院各説66「寿正寺」、神社の章366コマに重盛伝承）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション（インターネット公開）。450コマに由緒本文&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680/1/450&#34;},{&#34;title&#34;:&#34;『福田町史』資料編民俗（福田町史編さん委員会編、1999年）寺院の章&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション全文検索のスニペット（156コマ）で松龍山・松秀寺末・『南御厨村誌』引用を確認&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/search/searchResult?fullText=true&#38;keyword=%E5%AF%BF%E6%AD%A3%E5%AF%BA%20%E8%9B%AD%E6%B1%A0&#34;},{&#34;title&#34;:&#34;日本歴史地名大系「蛭池村」（コトバンク）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;「寿正寺領二石・薬師領二石」の記載&#34;,&#34;url&#34;:&#34;https://kotobank.jp/word/蛭池村&#34;},{&#34;title&#34;:&#34;ニッポンの霊場 遠江四十九薬師霊場&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;第44番＝松龍山寿正寺（曹洞宗・磐田市蛭池）を確認。草崎の壽正寺（別寺院）ではなく蛭池の寿正寺であることを住所で確認。&#34;,&#34;url&#34;:&#34;https://nippon-reijo.jimdofree.com/%E6%8E%B2%E8%BC%89%E9%9C%8A%E5%A0%B4%E3%81%AE%E4%B8%80%E8%A6%A7/%E8%96%AC%E5%B8%AB%E9%9C%8A%E5%A0%B4/%E9%81%A0%E6%B1%9F%E5%9B%9B%E5%8D%81%E4%B9%9D%E8%96%AC%E5%B8%AB%E9%9C%8A%E5%A0%B4/&#34;},{&#34;title&#34;:&#34;寿正寺 - Omairi&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;寺院の実在・所在確認のみ。本文はアクセス不可（403）で詳細未取得。&#34;,&#34;url&#34;:&#34;https://omairi.club/spots/121493&#34;},{&#34;title&#34;:&#34;静岡県磐田市蛭池の街情報｜カーセンサー&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;磐田市蛭池230、電話0538-55-4976との記載。地域概要の一部としての言及で、行事・墓地情報なし。&#34;,&#34;url&#34;:&#34;https://www.carsensor.net/usedcar/shizuoka/4711/163/machi.html&#34;},{&#34;title&#34;:&#34;曹洞禅ナビ 寺院検索&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;「寿正寺」名での個別ページを検索したが該当ページを確認できず。&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/&#34;},{&#34;title&#34;:&#34;磐田市(静岡県)の寺院墓地｜寺院墓地.com&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;掲載墓地一覧に寿正寺は含まれず。&#34;,&#34;url&#34;:&#34;https://www.jiin-bochi.com/area/shizuoka-22211.html&#34;},{&#34;title&#34;:&#34;壽正寺 - 曹洞禅ナビ寺院検索&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;名称（壽正寺、既存aliasesの表記と一致）・フリガナ（ジュショウジ）・住所（磐田市蛭池230）一致確認。由緒・本尊・年中行事欄は未記入。&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_221000.html&#34;}],&#34;research_todos&#34;:[&#34;山号の確認（現地の寺号標・本堂扁額など）&#34;,&#34;創建年代・開山・本寺関係を『竜洋町史』『磐田市誌』で確認&#34;,&#34;本尊の確認&#34;,&#34;磐田市草崎691-1の同名寺院「壽正寺」との関係（同名別寺か関連寺院か）の調査・混同防止&#34;,&#34;『福田町史』資料編民俗が引く『南御厨村誌』の寿正寺の項の全文確認&#34;,&#34;境内薬師堂の現存状況と、末寺だった江上庵（蛭池村内）のその後の確認&#34;,&#34;データベース上の地区分類（現在「竜洋」）について、蛭池が旧山名郡蛭池村→南御厨村→福田町域である点を踏まえた見直し&#34;,&#34;公式サイト・SNSの有無を現地または電話で確認&#34;,&#34;施餓鬼会・彼岸会等の年中行事の時期・檀家参列可否を確認&#34;,&#34;永代供養墓・納骨堂の有無を確認&#34;,&#34;護持会・世話人会等の檀家組織の有無を確認&#34;,&#34;蛭池地区の自治会・防災（避難所指定）との関わりを確認（近隣の貴船神社との祭礼上の関係も要確認）&#34;,&#34;法事参列者向け駐車場情報を確認&#34;,&#34;曹洞禅ナビには同名の「壽正寺」（index_220933）が磐田市草崎691-1にも別途登録されている。今回対象の蛭池230番地の寺院とは住所が異なる別寺院と判断し、index_221000（蛭池230）を採用した。&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;所在と宗派&#34;,&#34;body&#34;:&#34;寿正寺は曹洞宗の寺院で、所在地は磐田市蛭池230番地です。寺院情報サイトでは旧字体の「壽正寺」の表記で掲載されています。蛭池村は江戸時代には山名郡に属し、明治22年（1889年）以降は磐田郡南御厨村、昭和の合併で福田町域となりました。『静岡県磐田郡誌』は寺の所在を「南御厨村蛭池字雨垂」と記しています。注意すべき点として、磐田市内には草崎691番地の1にも同名の「壽正寺」（旧長野村草崎、山号は瑞応山）が存在するため、両寺の情報を混同しないよう確認が必要です。当寺（蛭池）は松龍山、草崎の同名寺は瑞応山と山号が異なります。&#34;},{&#34;heading&#34;:&#34;『静岡県磐田郡誌』にみる由緒&#34;,&#34;body&#34;:&#34;大正10年（1921年）刊の『静岡県磐田郡誌』の寺院各説によれば、寿正寺の草創以前、この地には住僧のない一宇の地蔵堂があり、堂宇は荒廃していました。慶長9年（1604年）、西浅羽村松秀寺（現袋井市域）の耕翁盛舜和尚が退位して郡内の中村に隠栖し近隣の教化に努めていることを聞いた村の有志が、旧来の地蔵堂を修理して一寺の再興を図り、盛舜がその求めに応じて興復の開祖となりました。慶長12年（1607年）には諸堂伽藍が建立されています。盛舜は寛永元年（1624年）4月20日に示寂し、盛易が第2世を継ぎました。堂宇は宝永4年（1707年）の宝永地震で倒壊して再建され、安政元年（1854年）の安政東海地震では再び倒壊のうえ火災で灰燼に帰しましたが、後に造営されたものが大正期に存続していました。寺格は法地格に列しています。また境内の薬師堂は、もとは村内の字中曽根にあって武田・徳川両軍の争乱の兵火で荒廃したものを、開山盛舜の志願によって境内に移したと伝えます。『福田町史』資料編民俗も、蛭池の寿正寺について松龍山と号し松秀寺の末寺であることを記し、『南御厨村誌』によれば創立年歴は不明としています。&#34;},{&#34;heading&#34;:&#34;近世の寺領と本末関係&#34;,&#34;body&#34;:&#34;近世の寿正寺は寺領を有する寺院でした。『元禄高帳による元禄期遠江国石高表』（磐田市誌編纂室、1976年）では蛭池村高357石余のうち寿正寺領4石が除かれており、『東海道見付宿の助郷』（清水秀明編著、1990年）も山名郡蛭池村の寺院として「寺領四石の曹洞宗寿正寺・同江上庵」を挙げています。『日本歴史地名大系』の蛭池村の項には「寿正寺領二石・薬師領二石」とみえ、寺領4石の内訳が寺と境内薬師堂の各2石であったことがうかがえます。また『磐田市史』通史編中巻（近世）は、本末制の解説で登場させた寿正寺について貞享3年（1686年）の史料からその経済の一端を紹介しており、『可睡斎史料集』第4巻（僧録司文書）には、蛭池村寿正寺が本寺である戸場野村（西浅羽）松秀寺の代理として僧録司可睡斎へ出頭した記録が残ります。寿正寺自身も末寺を持ち、『静岡県磐田郡誌』によれば福島村中島の長泉寺（瑞光山・薬師如来）と福島村下太の常楽寺（青陽山・阿弥陀如来）がその末寺で、常楽寺は寛永2年（1625年）に第2世盛易を開祖に請じて建てられました。&#34;},{&#34;heading&#34;:&#34;平重盛の寺領寄進伝承&#34;,&#34;body&#34;:&#34;『静岡県磐田郡誌』の神社の章（蛭池の六所神社の項）には、「伝へ云ふ、当村寿正寺は小松内大臣重盛より寺領三百石を賜はりし」という伝承が紹介されています。小松内大臣は平清盛の嫡男平重盛のことで、安元年間（1175〜1177年）に関わる文脈で語られており、寿正寺の前身が平安時代末期にさかのぼるとする言い伝えです。これはあくまで伝承であり、史料で確認できる寿正寺の沿革は慶長9年（1604年）の曹洞宗寺院としての再興以降ですが、再興以前から地蔵堂が存在したという郡誌の記述とあわせて、この地の信仰の場としての古さを示唆する話といえます。&#34;}],&#34;founded_period&#34;:&#34;慶長9年（1604年）中興開山（前身の地蔵堂はそれ以前から存在）&#34;,&#34;cultural_assets&#34;:[],&#34;pilgrimage_note&#34;:&#34;遠江四十九薬師霊場第44番札所&#34;,&#34;danka_info&#34;:{}},{&#34;temple_id&#34;:&#34;iwata-0088&#34;,&#34;slug&#34;:&#34;rengakuji-ryuyonakajima&#34;,&#34;name&#34;:&#34;蓮覚寺&#34;,&#34;name_kana&#34;:&#34;れんがくじ&#34;,&#34;aliases&#34;:[&#34;瑞嶽山蓮覚寺&#34;,&#34;連覚寺（表記）&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市竜洋中島689番地の1&#34;,&#34;district_id&#34;:&#34;ryuyo&#34;,&#34;area&#34;:&#34;竜洋&#34;,&#34;main_deity&#34;:&#34;未確認&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;公開情報調査済み&#34;,&#34;history_summary&#34;:&#34;蓮覚寺は磐田市竜洋中島689番地の1にある曹洞宗の寺院です。寺伝では平清盛の長男・平重盛が創建したと伝えられ、磐田市の文化財解説にも「平清盛の長子・重盛が建てた」と記されています。天保13年（1842年）建造の山門は磐田市指定有形文化財です。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-12&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9334&#34;},{&#34;title&#34;:&#34;市指定文化財｜磐田市公式ウェブサイト&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;蓮覚寺山門＝有形文化財【建造物】、指定年月日 平成17年11月21日、年代 江戸時代、所在地 竜洋中島、所有者 連覚寺、解説「平清盛の長子・重盛が建てた連覚寺の表門。天保13年（1842）建造の薬医門で、竜洋地区最古最大の山門である」を本文で確認。&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/sports_midokoro/bunkazai/bunkazainitsuite/1002039.html&#34;},{&#34;title&#34;:&#34;蓮覚寺 - 曹洞禅ナビ（曹洞宗公式 寺院ポータルサイト）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;曹洞宗公式ポータルで所在地（磐田市竜洋中島689-1）を確認。&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220920.html&#34;},{&#34;title&#34;:&#34;蓮覚寺 山門（花*畑 歳時記）&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;山号 瑞嶽山、本尊 延命地蔵菩薩、安元元年（1175年と推定）平重盛が遠州三連寺の一つとして創建と伝わる、山門の変遷（安政地震倒壊・明治10年移設・明治20年瓦葺替・昭和19年地震・昭和35年頃塀改装）、明治6年西之島学校中島分校開校（竜洋北小前身）の記述を本文で確認。個人サイトのため伝承・沿革は要裏取り。&#34;,&#34;url&#34;:&#34;http://mitchan.ojaru.jp/renkakuji.html&#34;},{&#34;title&#34;:&#34;平重盛について - 曹洞宗 三白山 連城寺（磐田市）公式サイト&#34;,&#34;type&#34;:&#34;寺院公式情報&#34;,&#34;note&#34;:&#34;三連寺の一つ連城寺の公式サイトで、平重盛が父・清盛の恨みが子に及ぶことを恐れて諸国に寺院を建立したという伝承、連城寺が1179年建立と伝わることを確認（蓮覚寺への直接言及はなし）。&#34;,&#34;url&#34;:&#34;https://iwata-renjyoji.com/history1/&#34;},{&#34;title&#34;:&#34;卍蓮覚寺｜静岡県磐田市 - 八百万の神&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;宗派＝曹洞宗、所在地＝磐田市竜洋中島689-1を確認。&#34;,&#34;url&#34;:&#34;https://yaokami.jp/1226572/&#34;},{&#34;title&#34;:&#34;蓮覚寺(静岡県磐田市)の永代供養墓・樹木葬・納骨堂&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;永代供養墓・樹木葬・納骨堂・一般墓の取り扱いありとの記載。民間仲介事業者の情報のため裏取り必要。&#34;,&#34;url&#34;:&#34;https://eitaikuyo.jp/searcht/temple/T-0000037130&#34;},{&#34;title&#34;:&#34;蓮覚寺 - 磐田市/静岡県 | Omairi&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;本文アクセス不可（403）で詳細未取得。&#34;,&#34;url&#34;:&#34;https://omairi.club/spots/116962&#34;}],&#34;research_todos&#34;:[&#34;本尊の公式確認（個人サイトでは延命地蔵菩薩と紹介されているが公式情報未確認）&#34;,&#34;山号「瑞嶽山」の公式表記の確認（民間サイト2件で一致）&#34;,&#34;天台宗系で創建されたのちの曹洞宗への改宗時期の調査&#34;,&#34;西之島学校中島分校（竜洋北小前身）としての利用を学校沿革史・市史で裏取り&#34;,&#34;「蓮覚寺」「連覚寺」の表記の使い分け（正式名称）の確認&#34;,&#34;安政地震・昭和19年（東南海）地震での被災記録の調査&#34;,&#34;要確認（文化財DB照合）: address: 磐田市の文化財台帳では所有者表記が「連覚寺」となっている（宗教法人名簿は「蓮覚寺」）。&#34;,&#34;「蓮覚寺」名のFacebookページ（facebook.com/532510923804327）が検索結果に表示されたが、竜洋中島の当寺院と同一かどうか本文非公開のため確認できず。現地または電話で要確認&#34;,&#34;施餓鬼会・彼岸会等の年中行事の時期・檀家参列可否を確認&#34;,&#34;永代供養墓・樹木葬・納骨堂について、民間仲介サイト情報の正確性を寺院に直接確認&#34;,&#34;護持会・世話人会等の檀家組織の有無を確認&#34;,&#34;指定文化財である山門の公開状況と地域行事（防災訓練・祭礼等）との関わりを確認&#34;,&#34;法事参列者向け駐車場情報を確認&#34;],&#34;founded_period&#34;:&#34;寺伝では安元元年（1175年）頃、平重盛が遠州三連寺の一つとして創建したと伝わる&#34;,&#34;heritage_status&#34;:&#34;磐田市指定文化財あり（蓮覚寺山門・有形文化財【建造物】）&#34;,&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;創建と平重盛の伝承&#34;,&#34;body&#34;:&#34;寺伝では、遠江守であった平重盛（平清盛の長男）が安元元年（1175年）頃に創建したと伝えられ、磐田市二之宮の連福寺、新貝の連城寺とともに「遠州三連寺」の一つに数えられます。磐田市指定文化財の解説にも「平清盛の長子・重盛が建てた連覚寺の表門」と記されており、市の公式資料でも重盛創建の伝承が紹介されています。同じ三連寺の連城寺の公式サイトでは、重盛が父・清盛の専制による恨みが子に及ぶことを恐れて諸国に寺院を建立したという伝承が紹介されています。なお、寺名は「蓮覚寺」と「連覚寺」の両表記が資料に見られます。&#34;},{&#34;heading&#34;:&#34;市指定文化財の山門&#34;,&#34;body&#34;:&#34;山門は天保13年（1842年）建造の薬医門で、平成17年（2005年）11月21日に磐田市指定有形文化財【建造物】に指定されました。磐田市の解説では「竜洋地区最古最大の山門」と記されています。個人の探訪記録によれば、山門は当初本堂正面に向かう位置に建立され、安政の地震で倒れた後に起こし直され、明治10年（1877年）に旧裏門の北へ東向きに移されたと紹介されています。同記録では明治20年（1887年）に瓦を葺き替え、昭和19年（1944年）の地震で西側に大きく傾いたものの持ちこたえ、両袖の塀は昭和35年（1960年）頃に板塀から土塀風に改装されたとされています。&#34;},{&#34;heading&#34;:&#34;近代の学校としての利用&#34;,&#34;body&#34;:&#34;個人の探訪記録によれば、明治6年（1873年）の学制発布に伴い、西之島学校中島分校が本堂を利用して開校したと紹介されています。この分校は現在の磐田市立竜洋北小学校の前身にあたるとされています。寺院が近代初期の地域教育の場となった事例として注目されますが、市史・学校沿革史での裏取りが望まれます。&#34;},{&#34;heading&#34;:&#34;文化財資料からの補足&#34;,&#34;body&#34;:&#34;蓮覚寺の山門は天保13年（1842年）建造の薬医門で、竜洋地区で最古最大の山門です。平成17年（2005年）11月21日に磐田市指定有形文化財（建造物）に指定されました。 磐田市の文化財台帳には、蓮覚寺は平清盛の長子・平重盛が建てた寺と記されています。&#34;},{&#34;heading&#34;:&#34;檀家向け情報の補足&#34;,&#34;body&#34;:&#34;山門は市指定有形文化財（建造物）で、指定年月日は平成17年（2005年）11月21日。磐田市の指定理由には「平清盛の長子・重盛が建てた連覚寺の表門」「竜洋地区最古最大の山門」と記載されている。天保13年（1842年）に本堂前に建立された薬医門で、安政期の地震で倒壊した後、明治10年（1877年）に東向きに移築され、明治20年（1887年）に屋根を葺き替えたと伝えられる。&#34;}],&#34;cultural_assets&#34;:[{&#34;name&#34;:&#34;蓮覚寺山門&#34;,&#34;designation&#34;:&#34;磐田市指定有形文化財【建造物】&#34;,&#34;summary&#34;:&#34;天保13年（1842年）建造の薬医門で、平成17年（2005年）11月21日指定。磐田市の解説では「平清盛の長子・重盛が建てた連覚寺の表門。天保13年（1842）建造の薬医門で、竜洋地区最古最大の山門である」と記されています。&#34;}],&#34;danka_info&#34;:{&#34;cemetery&#34;:&#34;民間の永代供養紹介サイトによれば、一般墓に加え永代供養墓・樹木葬・納骨堂の取り扱いがあるとされる。寺院公式発表ではなく仲介事業者による二次情報であり、内容の裏取りが必要。&#34;}},{&#34;temple_id&#34;:&#34;iwata-0089&#34;,&#34;slug&#34;:&#34;ganjoji-hirama&#34;,&#34;name&#34;:&#34;願成寺&#34;,&#34;name_kana&#34;:&#34;がんじょうじ&#34;,&#34;aliases&#34;:[&#34;福聚山願成寺&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市平間431番地の1&#34;,&#34;district_id&#34;:&#34;ryuyo&#34;,&#34;area&#34;:&#34;竜洋&#34;,&#34;main_deity&#34;:&#34;地蔵菩薩（『静岡県磐田郡誌』大正10年による。現況は要確認）&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;願成寺は磐田市平間431番地の1にある曹洞宗の寺院で、山号は福聚山です。『静岡県磐田郡誌』（大正10年）によれば、天文2年（1533年）に岡（袖浦村）の聖寿寺第5世恵才の徒弟明堂が開基した聖寿寺末の寺院で、本尊は地蔵菩薩と記されています。江戸幕府の寺院本末帳にも遠江国豊田郡平間村の曹洞宗寺院として登載され、幕末から明治初期には寺子屋として子どもたちの学びの場にもなりました。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9336&#34;},{&#34;title&#34;:&#34;願成寺 - 曹洞禅ナビ（曹洞宗公式 寺院ポータルサイト）&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;曹洞宗公式ポータルに磐田市平間431-1の寺院として掲載されていることを本文で確認。由緒の記載はなし。&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220928.html&#34;},{&#34;title&#34;:&#34;卍願成寺｜静岡県磐田市 - 八百万の神&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;宗派＝曹洞宗、所在地＝磐田市平間431-1を確認。&#34;,&#34;url&#34;:&#34;https://yaokami.jp/1226573/&#34;},{&#34;title&#34;:&#34;『静岡県磐田郡誌』静岡県磐田郡教育会編、大正10年（第13章 寺院各説124「願成寺」、254コマに寺子屋の記事）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション（インターネット公開）。458コマの原本画像で由緒本文を確認&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680/1/458&#34;},{&#34;title&#34;:&#34;『江戸幕府寺院本末帳集成』下（寺院本末帳研究会編、雄山閣出版、1981年）索引&#34;,&#34;type&#34;:&#34;学術資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション全文検索のスニペットで遠江国豊田郡平間村・曹洞宗の登載を確認&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/search/searchResult?fullText=true&#38;keyword=%E5%B9%B3%E9%96%93%E6%9D%91%20%E9%A1%98%E6%88%90%E5%AF%BA&#34;},{&#34;title&#34;:&#34;日本歴史地名大系「平間村」（コトバンク）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;河匂庄平間・頭陀寺領の記載&#34;,&#34;url&#34;:&#34;https://kotobank.jp/word/平間村&#34;},{&#34;title&#34;:&#34;ニッポンの霊場 磐田郡三十三観音霊場&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;第6番＝福聚山願成寺（曹洞宗・平間431）を確認。寺名・宗派・住所がDBと一致。&#34;,&#34;url&#34;:&#34;https://nippon-reijo.jimdofree.com/%E6%8E%B2%E8%BC%89%E9%9C%8A%E5%A0%B4%E3%81%AE%E4%B8%80%E8%A6%A7/%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/%E7%A3%90%E7%94%B0%E9%83%A1%E4%B8%89%E5%8D%81%E4%B8%89%E8%A6%B3%E9%9F%B3%E9%9C%8A%E5%A0%B4/&#34;},{&#34;title&#34;:&#34;サーチ寺院（119カ寺）静岡県磐田市の寺院・御堂&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;住所・宗派の確認に使用。&#34;,&#34;url&#34;:&#34;https://www.bukyou.com/BukyBukyou/TBukyou22/C22CNo211Detail.html&#34;}],&#34;research_todos&#34;:[&#34;山号の確認（現地の寺号標・本堂扁額など）&#34;,&#34;創建年代・開山・本寺関係を『竜洋町史』『磐田市誌』で確認&#34;,&#34;本尊の確認&#34;,&#34;全国の同名寺院（いわき市の願成寺など）との混同に注意して資料を精査する&#34;,&#34;平間集落の歴史と寺の関わりの現地調査&#34;,&#34;現在の本尊が郡誌記載どおり地蔵菩薩かどうかの現地確認&#34;,&#34;寺子屋を営んだ「高山師」の詳細（『磐田市教育のあけぼの』等での確認）&#34;,&#34;本寺聖寿寺（磐田市岡）との現在の関係の確認&#34;,&#34;曹洞禅ナビの寺院ページには「公式ホームページ」「Facebook」「Instagram」の項目枠自体はあるが、遷移先は曹洞宗公式の一般アカウントであり、願成寺独自のものではない可能性が高い。要現地確認&#34;,&#34;同名の「願成寺」が全国に127カ寺（京都府東福寺山内の願成寺など）存在するため、以後の調査でも必ず「磐田市平間」で照合すること&#34;,&#34;年中行事（施餓鬼会・彼岸会等）、永代供養墓・納骨堂の有無、護持会等の檀家組織、地域自治会・防災との関わり、駐車場情報のいずれもWeb上で確認できず。電話（0538-66-1020）等で直接確認が必要&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;所在と宗派&#34;,&#34;body&#34;:&#34;願成寺は曹洞宗の寺院で、所在地は磐田市平間431番地の1です。曹洞宗公式の寺院検索サイト「曹洞禅ナビ」に磐田市平間の寺院として登録されていることが確認できます。平間村は『日本歴史地名大系』によれば天竜川下流域東岸に位置し、大永8年（1528年）の文書に河匂庄平間としてみえる集落で、もとは頭陀寺（浜松）領でした。江戸時代は豊田郡に属し、明治22年（1889年）以降は十束村、のち竜洋町域となっています。全国には福島県いわき市の国宝白水阿弥陀堂を有する願成寺をはじめ同名寺院が多数あるため、情報の混同に注意が必要です。&#34;},{&#34;heading&#34;:&#34;『静岡県磐田郡誌』にみる由緒&#34;,&#34;body&#34;:&#34;大正10年（1921年）刊の『静岡県磐田郡誌』の寺院各説には「願成寺（十束村）」として「十束村平間字東脇に在り。福聚山と号す。袖浦村聖寿山の末にして、本尊は地蔵菩薩なり。天文二年、聖寿寺第五世恵才の徒弟明堂の開基なり」と記されています。本寺の聖寿寺は袖浦村岡（現磐田市岡）の天龍山聖寿寺で、文明10年（1478年）に現寺号に改めたと伝え、慶安元年（1648年）に朱印高12石9斗余を受け門末24か寺を有した小本寺でした。願成寺はその門末の一つとして戦国期に開かれた寺院ということになります。江戸幕府が作成させた寺院本末帳の集成（『江戸幕府寺院本末帳集成』下巻）の索引にも、遠江国豊田郡平間村の曹洞宗寺院として願成寺が登載されており、幕府の宗教統制の枠組みの中で存続したことが確認できます。&#34;},{&#34;heading&#34;:&#34;寺子屋と近代の願成寺&#34;,&#34;body&#34;:&#34;『静岡県磐田郡誌』の教育の章には、学制発布以前の教育の場として「平間願成寺高山師の許に若干名」の子弟が学んだことが記されており、幕末から明治初期にかけて願成寺が寺子屋の役割を果たしていたことがわかります。また大正10年（1921年）刊の『曹洞宗大学一覧』の寺院住職名簿にも「静岡県豊田郡平間村願成寺」とみえ、大正期にも宗門の記録に確認できます。&#34;}],&#34;founded_period&#34;:&#34;天文2年（1533年）&#34;,&#34;cultural_assets&#34;:[],&#34;pilgrimage_note&#34;:&#34;磐田郡三十三観音霊場第6番札所&#34;,&#34;danka_info&#34;:{}},{&#34;temple_id&#34;:&#34;iwata-0090&#34;,&#34;slug&#34;:&#34;jikeian-komaba&#34;,&#34;name&#34;:&#34;慈慶庵&#34;,&#34;name_kana&#34;:&#34;じけいあん&#34;,&#34;aliases&#34;:[&#34;福聚山慈慶庵&#34;,&#34;寿慶庵&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市駒場20番地の1&#34;,&#34;district_id&#34;:&#34;ryuyo&#34;,&#34;area&#34;:&#34;竜洋&#34;,&#34;main_deity&#34;:&#34;阿弥陀仏（阿弥陀如来。『静岡県磐田郡誌』大正10年による。現況は要確認）&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;慈慶庵は磐田市駒場20番地の1にある曹洞宗の寺院（庵）で、山号は福聚山、岡（袖浦村）の聖寿寺の末寺です。寛永10年（1633年）ごろ幕府が作成させた諸宗末寺帳に「遠州聖寿寺末寺 慈慶庵 豊田郡駒場村 参石」と登載され、僧録司可睡斎の記録にも駒場村の御朱印3石の寺院としてみえる、江戸時代初期から続く庵寺です。『日本歴史地名大系』の駒場村の項では正保郷帳に関連して「寿慶庵（現曹洞宗慈慶庵）領三石」と記され、近世には寿慶庵とも表記されました。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-12&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9338&#34;},{&#34;title&#34;:&#34;卍慈慶庵｜静岡県磐田市 - 八百万の神&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;宗派＝曹洞宗、所在地＝磐田市駒場20-1を本文で確認。Web上ではこれ以外に沿革を記す資料を発見できなかった。&#34;,&#34;url&#34;:&#34;https://yaokami.jp/1226584/&#34;},{&#34;title&#34;:&#34;市指定文化財｜磐田市公式ウェブサイト&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;市指定文化財一覧の全文を確認し、慈慶庵（駒場）に関わる指定物件がないことを確認。&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/sports_midokoro/bunkazai/bunkazainitsuite/1002039.html&#34;},{&#34;title&#34;:&#34;『静岡県磐田郡誌』静岡県磐田郡教育会編、大正10年（第13章 寺院各説108「慈慶庵」）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション（インターネット公開）。456コマの原本画像で由緒本文を確認&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680/1/456&#34;},{&#34;title&#34;:&#34;『大日本近世史料 諸宗末寺帳』上（東京大学史料編纂所編、東京大学出版会）&#34;,&#34;type&#34;:&#34;学術資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション全文検索のスニペットで「遠州聖寿寺末寺慈慶庵 同国豊田郡駒場村 参石」を確認&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/search/searchResult?fullText=true&#38;keyword=%E6%85%88%E6%85%B6%E5%BA%B5&#34;},{&#34;title&#34;:&#34;日本歴史地名大系「駒場村」（コトバンク）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;「寿慶庵（現曹洞宗慈慶庵）領三石」の記載&#34;,&#34;url&#34;:&#34;https://kotobank.jp/word/駒場村&#34;},{&#34;title&#34;:&#34;サーチ寺院（119カ寺）静岡県磐田市の寺院・御堂&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;住所（磐田市駒場20番地の1、〒438-0233）・宗派（曹洞宗）を確認。&#34;,&#34;url&#34;:&#34;https://www.bukyou.com/BukyBukyou/TBukyou22/C22CNo211Detail.html&#34;},{&#34;title&#34;:&#34;駒場霊園｜磐田市公式ウェブサイト&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;note&#34;:&#34;駒場地区の霊園情報だが慈慶庵とは別の市営施設である点の確認に使用。&#34;,&#34;url&#34;:&#34;https://www.city.iwata.shizuoka.jp/shisetsu_guide/kurashi/bochi/1003192.html&#34;},{&#34;title&#34;:&#34;慈慶庵 - 曹洞禅ナビ寺院検索&#34;,&#34;type&#34;:&#34;宗派公式資料&#34;,&#34;note&#34;:&#34;名称・フリガナ（ジケイアン）・住所（磐田市駒場20-1）一致確認。由緒・本尊・年中行事欄は未記入。&#34;,&#34;url&#34;:&#34;https://sotozen-navi.com/detail/index_220935.html&#34;}],&#34;research_todos&#34;:[&#34;山号の有無と正式名称の確認&#34;,&#34;創建年代・開基・本寺（どの寺の末庵か）を『竜洋町町史』『磐田市誌』で確認&#34;,&#34;本尊の確認&#34;,&#34;住職常駐か兼務（近隣曹洞宗寺院による管理）かの確認&#34;,&#34;駒場集落の歴史と庵の関わりの現地調査&#34;,&#34;「寿慶庵」から「慈慶庵」への呼称変化の時期の特定（正保郷帳・元禄郷帳等の原本確認）&#34;,&#34;『竜洋町史』（未デジタル化）での慈慶庵の記述確認&#34;,&#34;現在の本尊が郡誌記載どおり阿弥陀如来かどうかの現地確認&#34;,&#34;慈慶庵（磐田市駒場20番地の1、〒438-0233、曹洞宗）は、由緒・年中行事・墓地・護持会・地域との関わり・駐車場のいずれについても、Web検索では一切情報が見つからなかった。曹洞禅ナビの個別ページも特定できず&#34;,&#34;駒場地区の自治会資料・地区史等での言及有無を、磐田市立図書館の郷土資料等で追加確認することを推奨&#34;],&#34;historical_sections&#34;:[{&#34;heading&#34;:&#34;所在と宗派&#34;,&#34;body&#34;:&#34;慈慶庵は曹洞宗の寺院で、所在地は磐田市駒場20番地の1です。寺院情報サイトに磐田市の曹洞宗寺院として掲載されていることが確認できます。駒場村は天竜川河口東岸の村で、江戸時代は豊田郡に属し、明治22年（1889年）以降は袖浦村、のち竜洋町域となりました。「庵」を称することから地域の小規模な庵寺として維持されてきたとみられ、磐田市指定文化財の一覧にも慈慶庵に関わる指定物件は確認できませんでした。&#34;},{&#34;heading&#34;:&#34;江戸時代の記録にみる慈慶庵&#34;,&#34;body&#34;:&#34;慈慶庵は江戸時代初期の幕府の宗教統制記録に早くからみえる寺院です。寛永10年（1633年）ごろに作成された諸宗末寺帳（『大日本近世史料 諸宗末寺帳』）には「遠州聖寿寺末寺 慈慶庵 同国豊田郡駒場村 参石」と登載され、岡（袖浦村）の天龍山聖寿寺の末寺で寺領3石を有していたことがわかります。遠州の曹洞宗寺院を統括した僧録司可睡斎の記録（『可睡斎史料集』第5巻 僧録司記録）にも、駒場村の慈慶庵が御朱印3石の寺院として記載されています。また『日本歴史地名大系』の駒場村の項は、村高のうち「寿慶庵（現曹洞宗慈慶庵）領三石」と記しており、近世には「寿慶庵」の表記も用いられました。大正10年（1921年）刊の『静岡県磐田郡誌』の寺院各説には「慈慶庵（袖浦村）」として「袖浦村駒場字屋敷廻にあり。福聚山と号す。当村聖寿寺の末にして、本尊は阿弥陀仏なり」と記されています。創建の年代や開山を伝える記録は、これらの資料には見当たりませんが、遅くとも寛永期（17世紀前半）には聖寿寺末の庵として成立していたことが確かめられます。&#34;}],&#34;founded_period&#34;:&#34;江戸時代初期以前（寛永10年・1633年ごろの幕府の諸宗末寺帳に既に登載）&#34;,&#34;cultural_assets&#34;:[],&#34;danka_info&#34;:{&#34;cemetery&#34;:&#34;駒場地区には磐田市営の駒場霊園（磐田市駒場4916-10）が別途存在するが、慈慶庵の寺院墓地とは別の市営施設であり、混同しないよう注意が必要。&#34;}},{&#34;temple_id&#34;:&#34;iwata-0091&#34;,&#34;slug&#34;:&#34;shingetsuji-ebijima&#34;,&#34;name&#34;:&#34;心月寺&#34;,&#34;name_kana&#34;:&#34;しんげつじ&#34;,&#34;aliases&#34;:[&#34;海松山心月寺&#34;],&#34;record_type&#34;:&#34;temple&#34;,&#34;status&#34;:&#34;existing&#34;,&#34;status_label&#34;:&#34;現存&#34;,&#34;sect&#34;:&#34;曹洞宗&#34;,&#34;address&#34;:&#34;静岡県磐田市海老島200番地の1&#34;,&#34;district_id&#34;:&#34;ryuyo&#34;,&#34;area&#34;:&#34;竜洋&#34;,&#34;main_deity&#34;:&#34;聖観世音菩薩（『静岡県磐田郡誌』大正10年による。現況は要確認）&#34;,&#34;manned_status&#34;:&#34;未確認&#34;,&#34;goshuin_status&#34;:&#34;未確認&#34;,&#34;visit_status&#34;:&#34;未訪問&#34;,&#34;detail_status&#34;:&#34;深掘り調査済み&#34;,&#34;history_summary&#34;:&#34;心月寺は磐田市海老島200番地の1にある曹洞宗の寺院で、山号は海松山、小島（旧長野村）の正眼院の末寺です。『静岡県磐田郡誌』（大正10年）は、伝承として平氏の頃（平安時代末期）の開創で、廃絶ののち天正3年（1575年）に正眼院第2世宗哲を開山として再興されたと記し、江戸時代には除地高2石を有しました。明治6年（1873年）には当寺を仮校舎として海老島小学校（第68番小学校）が開かれ、地域の近代教育の発祥の地ともなっています。&#34;,&#34;last_verified_at&#34;:&#34;2026-07-11&#34;,&#34;sources&#34;:[{&#34;title&#34;:&#34;静岡県知事所轄宗教法人名簿（令和5年3月31日現在）&#34;,&#34;type&#34;:&#34;行政・公的資料&#34;,&#34;url&#34;:&#34;https://www.pref.shizuoka.jp/_res/projects/default_project/_page_/001/011/670/meibo4.pdf&#34;,&#34;note&#34;:&#34;磐田市内の宗教法人として掲載。参照行: L9340&#34;},{&#34;title&#34;:&#34;静岡県磐田市海老島の寺院一覧 - NAVITIME&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;海老島の寺院として心月寺（磐田市海老島200-1）が掲載されていることを本文で確認。同地区の寺院はこの1件のみ。&#34;,&#34;url&#34;:&#34;https://www.navitime.co.jp/category/0705001/22211083000/&#34;},{&#34;title&#34;:&#34;卍心月寺｜静岡県磐田市 - 八百万の神&#34;,&#34;type&#34;:&#34;民間二次情報&#34;,&#34;note&#34;:&#34;宗派＝曹洞宗、所在地＝磐田市海老島200-1を確認。&#34;,&#34;url&#34;:&#34;https://yaokami.jp/1226576/&#34;},{&#34;title&#34;:&#34;『静岡県磐田郡誌』静岡県磐田郡教育会編、大正10年（第13章 寺院各説112「心月寺」、289コマに海老島小学校の記事）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;国立国会図書館デジタルコレクション（インターネット公開）。456コマの原本画像で由緒本文を確認&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/pid/965680/1/456&#34;},{&#34;title&#34;:&#34;内山真龍『遠江国風土記伝』（郁文舎、明治33年刊）&#34;,&#34;type&#34;:&#34;郷土資料&#34;,&#34;note&#34;:&#34;「心月寺、除地高弐石、曹洞宗小島村正眼院末、平僧住」（ログインなしで閲覧可能資料、113コマ）&#34;,&#34;url&#34;:&#34;https://dl.ndl.go.jp/search/searchResult?fullText=true&#38;keyword=%E5%BF%83%E6%9C%88%E5%AF%BA%20%E6%B5%B7
