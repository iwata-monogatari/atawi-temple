<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-label="除夜の鐘と修正会の比べ表"><rect width="960" height="430" rx="24" fill="#f6f1e7"/><text x="480" y="60" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#25382b">除夜の鐘と修正会の比べ表</text><g font-family="sans-serif" font-size="22"><rect x="50" y="86" width="860" height="48" fill="#476642"/><text x="240" y="118" text-anchor="middle" fill="#ffffff" font-weight="700">項目</text><text x="520" y="118" text-anchor="middle" fill="#ffffff" font-weight="700">除夜の鐘</text><text x="790" y="118" text-anchor="middle" fill="#ffffff" font-weight="700">修正会</text><g fill="#25382b"><text x="240" y="170" text-anchor="middle">時期</text><text x="520" y="170" text-anchor="middle">12月31日の深夜</text><text x="790" y="170" text-anchor="middle">1月1日〜7日ごろ</text><text x="240" y="222" text-anchor="middle">内容</text><text x="520" y="222" text-anchor="middle">梵鐘を撞き年を越す</text><text x="790" y="222" text-anchor="middle">年頭の法要・祈祷</text><text x="240" y="274" text-anchor="middle">祈りの向き</text><text x="520" y="274" text-anchor="middle">一年を振り返る</text><text x="790" y="274" text-anchor="middle">新しい年の平安</text><text x="240" y="352" text-anchor="middle" font-weight="700">確かめること</text><text x="520" y="352" text-anchor="middle" font-weight="700">開始時刻・撞ける範囲</text><text x="790" y="352" text-anchor="middle" font-weight="700">日程・対象・申込</text></g><g stroke="#c9bd9f" stroke-width="2"><line x1="50" y1="186" x2="910" y2="186"/><line x1="50" y1="238" x2="910" y2="238"/><line x1="50" y1="290" x2="910" y2="290"/><line x1="380" y1="86" x2="380" y2="394"/><line x1="660" y1="86" x2="660" y2="394"/></g></g></svg>
