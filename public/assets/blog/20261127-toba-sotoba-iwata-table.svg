<svg xmlns="http://www.w3.org/2000/svg" width="960" height="542" viewBox="0 0 960 542" role="img" aria-label="卒塔婆の形と文字"><rect width="960" height="542" rx="24" fill="#f6f1e7"/><text x="480" y="58" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#25382b">卒塔婆の形と文字</text><g font-family="sans-serif" font-size="21"><rect x="40" y="86" width="880" height="48" fill="#476642"/><text x="200" y="118" text-anchor="middle" fill="#ffffff" font-weight="700">項目</text><text x="620" y="118" text-anchor="middle" fill="#ffffff" font-weight="700">内容</text><g fill="#25382b"><text x="200" y="150" text-anchor="middle" font-weight="700">正式名</text><text x="620" y="150" text-anchor="middle" font-size="19">卒塔婆（そとうば）／略して塔婆</text><text x="200" y="202" text-anchor="middle" font-weight="700">語源</text><text x="620" y="202" text-anchor="middle" font-size="19">ストゥーパ＝仏舎利を納める仏塔</text><text x="200" y="254" text-anchor="middle" font-weight="700">頭部の形</text><text x="620" y="254" text-anchor="middle" font-size="19">五輪塔の五大（空・風・火・水・地）</text><text x="200" y="306" text-anchor="middle" font-weight="700">頭部の梵字</text><text x="620" y="306" text-anchor="middle" font-size="19">キャ・カ・ラ・バ・ア（宗派で差あり）</text><text x="200" y="358" text-anchor="middle" font-weight="700">中央〜下部</text><text x="620" y="358" text-anchor="middle" font-size="19">戒名・回忌・施主名／裏面に経文</text><text x="200" y="410" text-anchor="middle" font-weight="700">立てる意味</text><text x="620" y="410" text-anchor="middle" font-size="19">追善供養のしるし（法要ごとに建立）</text><text x="200" y="462" text-anchor="middle" font-weight="700">宗派差</text><text x="620" y="462" text-anchor="middle" font-size="19">浄土真宗系は板塔婆を建てない</text></g><g stroke="#c9bd9f" stroke-width="2"><line x1="40" y1="134" x2="920" y2="134"/><line x1="40" y1="186" x2="920" y2="186"/><line x1="40" y1="238" x2="920" y2="238"/><line x1="40" y1="290" x2="920" y2="290"/><line x1="40" y1="342" x2="920" y2="342"/><line x1="40" y1="394" x2="920" y2="394"/><line x1="40" y1="446" x2="920" y2="446"/><line x1="40" y1="498" x2="920" y2="498"/><line x1="360" y1="86" x2="360" y2="498"/></g></g></svg>
