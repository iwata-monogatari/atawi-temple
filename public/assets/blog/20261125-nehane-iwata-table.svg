<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-label="涅槃会の基本"><rect width="960" height="490" rx="24" fill="#f6f1e7"/><text x="480" y="58" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#25382b">涅槃会の基本</text><g font-family="sans-serif" font-size="21"><rect x="40" y="86" width="880" height="48" fill="#476642"/><text x="200" y="118" text-anchor="middle" fill="#ffffff" font-weight="700">項目</text><text x="620" y="118" text-anchor="middle" fill="#ffffff" font-weight="700">内容</text><g fill="#25382b"><text x="200" y="150" text-anchor="middle" font-weight="700">日付</text><text x="620" y="150" text-anchor="middle" font-size="19">2月15日（地域により月遅れの3月15日）</text><text x="200" y="202" text-anchor="middle" font-weight="700">位置づけ</text><text x="620" y="202" text-anchor="middle" font-size="19">降誕会・成道会と並ぶ釈迦の三大法要</text><text x="200" y="254" text-anchor="middle" font-weight="700">中心の営み</text><text x="620" y="254" text-anchor="middle" font-size="19">涅槃図を掲げて読経し、遺徳を偲ぶ</text><text x="200" y="306" text-anchor="middle" font-weight="700">涅槃図</text><text x="620" y="306" text-anchor="middle" font-size="19">沙羅双樹の下、頭北面西で横たわる釈迦</text><text x="200" y="358" text-anchor="middle" font-weight="700">描かれる者</text><text x="620" y="358" text-anchor="middle" font-size="19">弟子・菩薩・王族と動物たち</text><text x="200" y="410" text-anchor="middle" font-weight="700">供え菓子</text><text x="620" y="410" text-anchor="middle" font-size="19">涅槃団子／長野の「やしょうま」</text></g><g stroke="#c9bd9f" stroke-width="2"><line x1="40" y1="134" x2="920" y2="134"/><line x1="40" y1="186" x2="920" y2="186"/><line x1="40" y1="238" x2="920" y2="238"/><line x1="40" y1="290" x2="920" y2="290"/><line x1="40" y1="342" x2="920" y2="342"/><line x1="40" y1="394" x2="920" y2="394"/><line x1="40" y1="446" x2="920" y2="446"/><line x1="360" y1="86" x2="360" y2="446"/></g></g></svg>
