<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-label="座禅会の当日の流れ"><rect width="960" height="490" rx="24" fill="#f6f1e7"/><text x="480" y="58" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#25382b">座禅会の当日の流れ</text><g font-family="sans-serif" font-size="21"><rect x="40" y="86" width="880" height="48" fill="#476642"/><text x="200" y="118" text-anchor="middle" fill="#ffffff" font-weight="700">場面</text><text x="620" y="118" text-anchor="middle" fill="#ffffff" font-weight="700">すること</text><g fill="#25382b"><text x="200" y="150" text-anchor="middle" font-weight="700">受付・着替え</text><text x="620" y="150" text-anchor="middle" font-size="19">志納を納め、作務衣がある寺では着替える</text><text x="200" y="202" text-anchor="middle" font-weight="700">入堂・問訊</text><text x="620" y="202" text-anchor="middle" font-size="19">左足から入り、合掌低頭で無言の挨拶</text><text x="200" y="254" text-anchor="middle" font-weight="700">坐禅</text><text x="620" y="254" text-anchor="middle" font-size="19">坐蒲に坐り、姿勢と呼吸を整える</text><text x="200" y="306" text-anchor="middle" font-weight="700">経行</text><text x="620" y="306" text-anchor="middle" font-size="19">叉手で半歩ずつ、歩く禅</text><text x="200" y="358" text-anchor="middle" font-weight="700">茶礼・法話</text><text x="620" y="358" text-anchor="middle" font-size="19">お茶と短い話で締める会も</text><text x="200" y="410" text-anchor="middle" font-weight="700">退堂</text><text x="620" y="410" text-anchor="middle" font-size="19">左右揺振をして、ゆっくり立つ</text></g><g stroke="#c9bd9f" stroke-width="2"><line x1="40" y1="134" x2="920" y2="134"/><line x1="40" y1="186" x2="920" y2="186"/><line x1="40" y1="238" x2="920" y2="238"/><line x1="40" y1="290" x2="920" y2="290"/><line x1="40" y1="342" x2="920" y2="342"/><line x1="40" y1="394" x2="920" y2="394"/><line x1="40" y1="446" x2="920" y2="446"/><line x1="360" y1="86" x2="360" y2="446"/></g></g></svg>
