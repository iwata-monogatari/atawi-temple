<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-label="迎える法要の呼び方の対照表"><rect width="960" height="470" rx="24" fill="#f6f1e7"/><text x="480" y="64" text-anchor="middle" font-family="sans-serif" font-size="31" font-weight="700" fill="#25382b">「迎える法要」の呼び方（宗派別）</text><g font-family="sans-serif" font-size="24"><rect x="60" y="92" width="840" height="50" fill="#476642"/><text x="200" y="126" text-anchor="middle" fill="#ffffff" font-weight="700">対象</text><text x="440" y="126" text-anchor="middle" fill="#ffffff" font-weight="700">多くの宗派</text><text x="700" y="126" text-anchor="middle" fill="#ffffff" font-weight="700">浄土真宗</text><g fill="#25382b"><text x="200" y="190" text-anchor="middle">仏壇・ご本尊</text><text x="440" y="190" text-anchor="middle">開眼供養</text><text x="700" y="190" text-anchor="middle">入仏法要／御移徙</text><text x="200" y="248" text-anchor="middle">本位牌</text><text x="440" y="248" text-anchor="middle">開眼供養</text><text x="700" y="248" text-anchor="middle">位牌を用いない</text><text x="200" y="306" text-anchor="middle">墓石</text><text x="440" y="306" text-anchor="middle">開眼供養</text><text x="700" y="306" text-anchor="middle">建碑式・建碑慶讃法要</text></g><g stroke="#c9bd9f" stroke-width="2"><line x1="60" y1="216" x2="900" y2="216"/><line x1="60" y1="274" x2="900" y2="274"/><line x1="320" y1="92" x2="320" y2="332"/><line x1="560" y1="92" x2="560" y2="332"/></g></g><text x="480" y="382" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#66553e">浄土真宗では「お魂入れ」「お性根入れ」とは言いません</text><text x="480" y="420" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#66553e">本願寺派は入仏法要、大谷派は御移徙（おわたまし）が通例です</text></svg>
