<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-label="写経と写仏の道具と進め方の比較表"><rect width="960" height="300" rx="24" fill="#f6f1e7"/><text x="480" y="58" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#25382b">写経と写仏——道具と進め方</text><g font-family="sans-serif" font-size="21"><rect x="40" y="86" width="880" height="48" fill="#476642"/><text x="130" y="118" text-anchor="middle" fill="#ffffff" font-weight="700">行</text><text x="400" y="118" text-anchor="middle" fill="#ffffff" font-weight="700">主な道具</text><text x="660" y="118" text-anchor="middle" fill="#ffffff" font-weight="700">補助の道具</text><text x="850" y="118" text-anchor="middle" fill="#ffffff" font-weight="700">目安</text><g fill="#25382b"><text x="130" y="150" text-anchor="middle" font-weight="700">写経</text><text x="400" y="150" text-anchor="middle" font-size="19">写経用紙（お手本付き）・筆／筆ペン／鉛筆</text><text x="660" y="150" text-anchor="middle" font-size="19">硯と墨・下敷き・文鎮・数珠</text><text x="850" y="150" text-anchor="middle" font-size="17">般若心経266文字／1〜1.5時間</text><text x="130" y="206" text-anchor="middle" font-weight="700">写仏</text><text x="400" y="206" text-anchor="middle" font-size="19">下絵（手本）・透ける紙・ペン／筆ペン</text><text x="660" y="206" text-anchor="middle" font-size="19">下敷き・色鉛筆（彩色用）</text><text x="850" y="206" text-anchor="middle" font-size="17">線の少ない下絵から／目と白毫は最後に</text></g><text x="480" y="252" text-anchor="middle" font-size="19" fill="#5a6b5e">お寺の会では用紙と道具を用意していることが多い（持参は数珠のみの例も）</text><g stroke="#c9bd9f" stroke-width="2"><line x1="40" y1="134" x2="920" y2="134"/><line x1="40" y1="190" x2="920" y2="190"/><line x1="220" y1="86" x2="220" y2="190"/><line x1="580" y1="86" x2="580" y2="190"/><line x1="740" y1="86" x2="740" y2="190"/></g></g></svg>
