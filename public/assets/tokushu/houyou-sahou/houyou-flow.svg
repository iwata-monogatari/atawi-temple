<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">法要・帰省の前に確認する順番</title>
  <desc id="desc">菩提寺、宗派、日時、持ち物、当日の流れを順番に確認する図</desc>
  <rect width="1200" height="640" fill="#f7f3ea"/>
  <rect x="56" y="56" width="1088" height="528" rx="18" fill="#ffffff" stroke="#d8cbb8" stroke-width="3"/>
  <text x="92" y="126" font-family="Yu Gothic, Meiryo, sans-serif" font-size="38" font-weight="700" fill="#25221e">法要・帰省の確認は「寺院名」から順にたどる</text>
  <text x="92" y="170" font-family="Yu Gothic, Meiryo, sans-serif" font-size="22" fill="#665f55">分からない作法を先に調べるより、家と菩提寺の関係を先に確認する。</text>
  <g font-family="Yu Gothic, Meiryo, sans-serif">
    <rect x="92" y="238" width="180" height="122" rx="14" fill="#2f5d62"/>
    <text x="182" y="288" font-size="25" font-weight="700" text-anchor="middle" fill="#ffffff">1 菩提寺</text>
    <text x="182" y="326" font-size="18" text-anchor="middle" fill="#e8f0ee">寺院名・住所</text>
    <path d="M282 299h70" stroke="#6f766f" stroke-width="5" stroke-linecap="round"/>
    <path d="M338 282l22 17-22 17" fill="none" stroke="#6f766f" stroke-width="5" stroke-linecap="round"/>
    <rect x="366" y="238" width="180" height="122" rx="14" fill="#826f38"/>
    <text x="456" y="288" font-size="25" font-weight="700" text-anchor="middle" fill="#ffffff">2 宗派</text>
    <text x="456" y="326" font-size="18" text-anchor="middle" fill="#fff4d6">位牌・過去帳</text>
    <path d="M556 299h70" stroke="#6f766f" stroke-width="5" stroke-linecap="round"/>
    <path d="M612 282l22 17-22 17" fill="none" stroke="#6f766f" stroke-width="5" stroke-linecap="round"/>
    <rect x="640" y="238" width="180" height="122" rx="14" fill="#7c4b43"/>
    <text x="730" y="288" font-size="25" font-weight="700" text-anchor="middle" fill="#ffffff">3 日時</text>
    <text x="730" y="326" font-size="18" text-anchor="middle" fill="#ffe9e4">場所・会食</text>
    <path d="M830 299h70" stroke="#6f766f" stroke-width="5" stroke-linecap="round"/>
    <path d="M886 282l22 17-22 17" fill="none" stroke="#6f766f" stroke-width="5" stroke-linecap="round"/>
    <rect x="914" y="238" width="180" height="122" rx="14" fill="#3f4d71"/>
    <text x="1004" y="288" font-size="25" font-weight="700" text-anchor="middle" fill="#ffffff">4 当日</text>
    <text x="1004" y="326" font-size="18" text-anchor="middle" fill="#e7ebff">服装・持ち物</text>
  </g>
  <g font-family="Yu Gothic, Meiryo, sans-serif" font-size="20" fill="#25221e">
    <text x="92" y="438">最初に必要なのは、焼香の回数ではなく「どの寺に、何を確認するか」。</text>
    <text x="92" y="474">菩提寺が分かれば、宗派、法要場所、持ち物、当日の案内を順番に確認できる。</text>
    <text x="92" y="510">親族の記憶だけに頼らず、封筒、過去帳、寺院ページ、会場案内を一緒に残す。</text>
  </g>
</svg>
