<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">焼香で迷わないための基本動作</title>
  <desc id="desc">一礼、香をつまむ、香炉へ落とす、合掌、一礼の順を示す図</desc>
  <rect width="1200" height="640" fill="#f2f4f7"/>
  <rect x="58" y="54" width="1084" height="532" rx="20" fill="#ffffff" stroke="#c7d0dc" stroke-width="3"/>
  <text x="92" y="122" font-family="Yu Gothic, Meiryo, sans-serif" font-size="38" font-weight="700" fill="#20242b">焼香は「回数」より「落ち着いた所作」</text>
  <text x="92" y="166" font-family="Yu Gothic, Meiryo, sans-serif" font-size="22" fill="#5c6370">宗派差があるため、前の人、導師、会場係の案内を優先する。</text>
  <g font-family="Yu Gothic, Meiryo, sans-serif">
    <rect x="100" y="240" width="166" height="178" rx="14" fill="#eaf2f1" stroke="#9bbab5" stroke-width="3"/>
    <rect x="300" y="240" width="166" height="178" rx="14" fill="#fff2d8" stroke="#d5bd7a" stroke-width="3"/>
    <rect x="500" y="240" width="166" height="178" rx="14" fill="#f8e4e1" stroke="#d3a8a1" stroke-width="3"/>
    <rect x="700" y="240" width="166" height="178" rx="14" fill="#e8edf8" stroke="#abb9da" stroke-width="3"/>
    <rect x="900" y="240" width="166" height="178" rx="14" fill="#eef0e8" stroke="#b8beaa" stroke-width="3"/>
    <g font-size="58" font-weight="700" text-anchor="middle">
      <text x="183" y="330" fill="#2f5d62">礼</text>
      <text x="383" y="330" fill="#826f38">香</text>
      <text x="583" y="330" fill="#7c4b43">炉</text>
      <text x="783" y="330" fill="#3f4d71">掌</text>
      <text x="983" y="330" fill="#59624c">礼</text>
    </g>
    <g font-size="20" font-weight="700" text-anchor="middle" fill="#27231f">
      <text x="183" y="376">一礼</text>
      <text x="383" y="376">香をつまむ</text>
      <text x="583" y="376">香炉へ</text>
      <text x="783" y="376">合掌</text>
      <text x="983" y="376">戻って一礼</text>
    </g>
    <g stroke="#6c7480" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M270 329h24"/><path d="M286 316l14 13-14 13"/>
      <path d="M470 329h24"/><path d="M486 316l14 13-14 13"/>
      <path d="M670 329h24"/><path d="M686 316l14 13-14 13"/>
      <path d="M870 329h24"/><path d="M886 316l14 13-14 13"/>
    </g>
    <text x="100" y="498" font-size="20" fill="#373b42">押しいただくか、何回行うかは宗派・寺院で異なる。迷ったときは「静かに、短く、前の人に合わせる」。</text>
  </g>
</svg>
