34;mushuoji-mushuo&#34;:&#34;虫生寺&#34;,&#34;jokoji-shikiji&#34;:&#34;浄光寺&#34;,&#34;ryounan-shikiji&#34;:&#34;龍雲庵&#34;,&#34;eimeiji-shikiji&#34;:&#34;永明寺&#34;,&#34;eianji-shikiji&#34;:&#34;永安寺&#34;,&#34;seiryo-in-iwamuro&#34;:&#34;清凉院&#34;,&#34;shorinji-kawabukuro&#34;:&#34;松林寺&#34;,&#34;hojuin-jurojima&#34;:&#34;寶珠院&#34;,&#34;senryuji-kawabukuro&#34;:&#34;潜龍寺&#34;,&#34;ryusenji-shiraha&#34;:&#34;竜泉寺&#34;,&#34;koshuji-kaketsuka&#34;:&#34;香集寺&#34;,&#34;jorakuji-horinochi&#34;:&#34;常楽寺&#34;,&#34;daisenji-toyohamanakano&#34;:&#34;大泉寺&#34;,&#34;saifukuji-toyohamanakano&#34;:&#34;西福寺&#34;,&#34;ryuunji-toyohama&#34;:&#34;竜雲寺&#34;,&#34;sojiji-minamijima&#34;:&#34;宗次寺&#34;,&#34;keishoji-fukude&#34;:&#34;慶昌寺&#34;,&#34;chosenji-fukudenakajima&#34;:&#34;長泉寺&#34;,&#34;kannonji-fukude&#34;:&#34;観音寺&#34;,&#34;ryuhoin-ohara&#34;:&#34;龍法院&#34;,&#34;zohonji-ikago&#34;:&#34;蔵本寺&#34;,&#34;jushouji-hiruike&#34;:&#34;寿正寺&#34;,&#34;rengakuji-ryuyonakajima&#34;:&#34;蓮覚寺&#34;,&#34;ganjoji-hirama&#34;:&#34;願成寺&#34;,&#34;jikeian-komaba&#34;:&#34;慈慶庵&#34;,&#34;shingetsuji-ebijima&#34;:&#34;心月寺&#34;,&#34;fukushoji-nishihiramatsu&#34;:&#34;福生寺&#34;,&#34;shojuji-oka&#34;:&#34;聖寿寺&#34;,&#34;kinzoji-toyooka&#34;:&#34;金藏寺&#34;,&#34;yushoji-toyooka&#34;:&#34;雄照寺&#34;,&#34;shuzoji-toyooka&#34;:&#34;守増寺&#34;,&#34;shokoji-miyanoshiki&#34;:&#34;松向寺&#34;,&#34;chionsai-hitokoto&#34;:&#34;智恩齋&#34;,&#34;anrakuji-tateno&#34;:&#34;安楽寺&#34;,&#34;toyodain-kegojima&#34;:&#34;豊田院&#34;,&#34;shoi-ji-shimoban-no&#34;:&#34;正医寺&#34;,&#34;fukuoji-morimoto&#34;:&#34;福王寺&#34;,&#34;rinshoji-kodateno&#34;:&#34;林昌寺&#34;,&#34;kotokuji-morishita&#34;:&#34;興徳寺&#34;,&#34;yofukuji-shimohongo&#34;:&#34;養福寺&#34;,&#34;myohoji-ikeda&#34;:&#34;妙法寺&#34;,&#34;seidoin-ikeda&#34;:&#34;誓渡院&#34;,&#34;daienji-kamo&#34;:&#34;大圓寺&#34;,&#34;daizoji-tomei&#34;:&#34;大蔵寺&#34;,&#34;shokyuin-mitsue&#34;:&#34;松久院&#34;,&#34;hoonan-kaminobe&#34;:&#34;法音庵&#34;,&#34;tenryuin-kaminobe&#34;:&#34;天龍院&#34;,&#34;ichiunsai-shimonobe&#34;:&#34;一雲斉&#34;,&#34;saikoji-matsunokijima&#34;:&#34;最廣寺&#34;,&#34;myofukuji-fukude&#34;:&#34;妙福寺&#34;,&#34;chikyoin-shiraha&#34;:&#34;智教院&#34;,&#34;myomanji-kaminobe&#34;:&#34;妙満寺&#34;,&#34;honmyoin-iwai&#34;:&#34;本妙院&#34;}"> <p class="eyebrow">Administrator</p> <h1>掲示板を管理する</h1> <p>投稿内容と非公開の連絡先を確認し、公開・非公開・対応済みを決定します。</p> <a href="/admin/photos/">写真管理へ</a> </section> <section class="section admin-board-section"> <div class="admin-board-toolbar"> <button type="button" data-filter="pending">確認待ち</button> <button type="button" data-filter="approved">公開中</button> <button type="button" data-filter="resolved">対応済み</button> <button type="button" data-filter="rejected">非公開</button> <button type="button" data-filter="all">すべて</button> </div> <div id="admin-board-list" class="admin-board-list" aria-live="polite">投稿を読み込んでいます。</div> </section> <script>
    // @ts-nocheck
    const templeMap = JSON.parse(document.querySelector("[data-temple-map]").dataset.templeMap || "{}");
    const list = document.querySelector("#admin-board-list");
    const labels = { reading: "読み方", history: "由緒・記憶", heritage: "文化財", location: "場所・参拝", publication: "掲載配慮", other: "その他" };
    let posts = [];
    let currentFilter = "pending";
    const escapeHtml = (value) => String(value || "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;");

    function render() {
      const filtered = currentFilter === "all" ? posts : posts.filter((post) => post.status === currentFilter);
      if (!filtered.length) { list.innerHTML = `<div class="board-empty">該当する投稿はありません。</div>`; return; }
      list.innerHTML = filtered.map((post) => `<article class="admin-board-card" data-id="${post.id}">
        <div class="board-post-meta"><span>${labels[post.category] || post.category}</span><time>${post.created_at.slice(0, 10)}</time></div>
        <h2>${escapeHtml(post.title)}</h2>
        <p><strong>${escapeHtml(templeMap[post.temple_slug] || post.temple_slug)}</strong> / 投稿：${escapeHtml(post.display_name)}</p>
        <p class="admin-board-body">${escapeHtml(post.body).replaceAll("\n", "<br>")}</p>
        ${post.source_info ? `<p class="board-source"><strong>根拠：</strong>${escapeHtml(post.source_info)}</p>` : ""}
        ${post.contact_email ? `<p class="private-contact"><strong>非公開連絡先：</strong>${escapeHtml(post.contact_email)}</p>` : ""}
        <label>編集部からの公開返信<textarea rows="3" data-reply>${escapeHtml(post.public_reply || "")}</textarea></label>
        <div class="admin-board-actions">
          <button type="button" data-status="approved">公開する</button>
          <button type="button" data-status="resolved">対応済みで公開</button>
          <button type="button" class="secondary-button" data-status="rejected">非公開にする</button>
        </div>
        <p class="form-result" data-result hidden></p>
      </article>`).join("");
    }

    async function load() {
      const response = await fetch("/admin/api/board-posts");
      const data = await response.json();
      if (!response.ok || !data.ok) { list.textContent = data.message || "読み込めませんでした。"; return; }
      posts = data.posts || [];
      render();
    }

    document.querySelector(".admin-board-toolbar").addEventListener("click", (event) => {
      const button = event.target.closest("[data-filter]");
      if (!button) return;
      currentFilter = button.dataset.filter;
      render();
    });
    list.addEventListener("click", async (event) => {
      const button = event.target.closest("[data-status]");
      if (!button) return;
      const card = button.closest("[data-id]");
      const result = card.querySelector("[data-result]");
      button.disabled = true;
      result.hidden = false;
      result.textContent = "更新しています。";
      try {
        const response = await fetch("/admin/api/board-posts", {
          method: "PATCH", headers: { "content-type": "application/json" },
          body: JSON.stringify({ id: card.dataset.id, status: button.dataset.status, public_reply: card.querySelector("[data-reply]").value }),
        });
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.message || "更新できませんでした。");
        await load();
      } catch (error) {
        result.classList.add("error");
        result.textContent = error.message;
      } finally { button.disabled = false; }
    });
    load();
  </script>  </main> <footer class="site-footer"> <p>運営：富士ヶ丘サービス</p> <nav aria-label="フッターナビゲーション"> <a href="/about/">運営者情報</a> <a href="/map/">地図</a> <a href="/status/">調査状況</a> <a href="/sects/">宗派・関連法人</a> <a href="/editorial-policy/">編集方針</a> <a href="/correction/">情報提供掲示板</a> <a href="/privacy/">プライバシーポリシー</a> <a href="https://iwata-monogatari.net/">磐田物語</a> </nav> <p class="small">姉妹サイト：磐田物語 ─ 磐田の歴史読み物</p> <p class="small">ATAWI TEMPLEは各寺院の公式サイトではありません。</p> </footer> </body></html>
