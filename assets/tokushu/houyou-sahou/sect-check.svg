<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">宗派を調べる三つの手がかり</title>
  <desc id="desc">家の中、寺院名検索、親族への確認の三方向から宗派を調べる図</desc>
  <rect width="1200" height="640" fill="#f5f6f1"/>
  <rect x="58" y="54" width="1084" height="532" rx="20" fill="#ffffff" stroke="#ccd5c8" stroke-width="3"/>
  <text x="92" y="122" font-family="Yu Gothic, Meiryo, sans-serif" font-size="38" font-weight="700" fill="#24241f">宗派は一つの記憶だけで決めない</text>
  <text x="92" y="166" font-family="Yu Gothic, Meiryo, sans-serif" font-size="22" fill="#5d6257">家の中、寺院名、親族の記憶を重ねると、間違いを減らせる。</text>
  <g font-family="Yu Gothic, Meiryo, sans-serif">
    <circle cx="600" cy="342" r="82" fill="#2f5d62"/>
    <text x="600" y="332" font-size="27" font-weight="700" text-anchor="middle" fill="#ffffff">宗派確認</text>
    <text x="600" y="370" font-size="18" text-anchor="middle" fill="#e9f3f1">断定前に照合</text>
    <rect x="116" y="250" width="250" height="174" rx="16" fill="#efe4d4" stroke="#cdb99d" stroke-width="3"/>
    <text x="241" y="300" font-size="26" font-weight="700" text-anchor="middle" fill="#473726">家の中を見る</text>
    <text x="241" y="340" font-size="19" text-anchor="middle" fill="#473726">位牌・過去帳</text>
    <text x="241" y="374" font-size="19" text-anchor="middle" fill="#473726">仏壇・封筒</text>
    <path d="M368 337h128" stroke="#6b756b" stroke-width="5" stroke-linecap="round"/>
    <path d="M482 320l22 17-22 17" fill="none" stroke="#6b756b" stroke-width="5" stroke-linecap="round"/>
    <rect x="475" y="456" width="250" height="104" rx="16" fill="#e6edf7" stroke="#b4c2d8" stroke-width="3"/>
    <text x="600" y="500" font-size="25" font-weight="700" text-anchor="middle" fill="#293957">寺院名で検索</text>
    <text x="600" y="535" font-size="18" text-anchor="middle" fill="#293957">住所・地区・宗派を確認</text>
    <path d="M600 430v44" stroke="#6b756b" stroke-width="5" stroke-linecap="round"/>
    <path d="M583 458l17 22 17-22" fill="none" stroke="#6b756b" stroke-width="5" stroke-linecap="round"/>
    <rect x="834" y="250" width="250" height="174" rx="16" fill="#f2dddd" stroke="#d5aeaa" stroke-width="3"/>
    <text x="959" y="300" font-size="26" font-weight="700" text-anchor="middle" fill="#5a2e2b">親族に聞く</text>
    <text x="959" y="340" font-size="19" text-anchor="middle" fill="#5a2e2b">喪主経験者</text>
    <text x="959" y="374" font-size="19" text-anchor="middle" fill="#5a2e2b">法要案内の保管者</text>
    <path d="M832 337H704" stroke="#6b756b" stroke-width="5" stroke-linecap="round"/>
    <path d="M718 320l-22 17 22 17" fill="none" stroke="#6b756b" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
