<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#fbfaf7"/>
  <g font-family="'Noto Serif JP','Yu Mincho',serif" fill="#263238">
    <text x="70" y="75" font-size="32" font-weight="700">雄照寺を確認できる記録の年代</text>
    <text x="70" y="112" font-size="18" fill="#667078">伝承の年と刊行・確認の年を同じ尺度上で区別する</text>
  </g>
  <g stroke="#d5d9d7" stroke-width="1">
    <path d="M90 180H1120M90 280H1120M90 380H1120M90 480H1120"/>
  </g>
  <path d="M120 350H1080" stroke="#395f78" stroke-width="5"/>
  <g fill="#d06b42" stroke="#fbfaf7" stroke-width="5">
    <circle cx="165" cy="350" r="14"/><circle cx="570" cy="350" r="14"/><circle cx="625" cy="350" r="14"/>
    <circle cx="700" cy="350" r="14"/><circle cx="955" cy="350" r="14"/><circle cx="1070" cy="350" r="14"/>
  </g>
  <g font-family="'Noto Sans JP','Yu Gothic',sans-serif" text-anchor="middle" fill="#263238">
    <text x="165" y="305" font-size="27" font-weight="700">1645</text><text x="165" y="397" font-size="18">創立伝承</text><text x="165" y="424" font-size="16" fill="#667078">全唐・村民</text>
    <text x="570" y="305" font-size="27" font-weight="700">1913</text><text x="570" y="397" font-size="18">寺院名鑑</text>
    <text x="625" y="455" font-size="27" font-weight="700">1921</text><text x="625" y="490" font-size="18">磐田郡誌</text>
    <text x="700" y="305" font-size="27" font-weight="700">1934</text><text x="700" y="397" font-size="18">国勢総攬</text>
    <text x="955" y="455" font-size="27" font-weight="700">2005</text><text x="955" y="490" font-size="18">磐田市へ合併</text>
    <text x="1070" y="305" font-size="27" font-weight="700">2023</text><text x="1070" y="397" font-size="18">法人名簿</text>
  </g>
  <text x="70" y="610" font-family="'Noto Sans JP','Yu Gothic',sans-serif" font-size="16" fill="#667078">注：1645年は1921年刊『静岡県磐田郡誌』が伝える年であり、同時代史料による直接確認ではない。</text>
</svg>
