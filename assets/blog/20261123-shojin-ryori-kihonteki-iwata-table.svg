<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-label="精進料理で使う食材と避ける食材"><rect width="960" height="490" rx="24" fill="#f6f1e7"/><text x="480" y="58" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#25382b">精進料理の食材の基本</text><g font-family="sans-serif" font-size="21"><rect x="40" y="86" width="880" height="48" fill="#476642"/><text x="200" y="118" text-anchor="middle" fill="#ffffff" font-weight="700">区分</text><text x="620" y="118" text-anchor="middle" fill="#ffffff" font-weight="700">内容</text><g fill="#25382b"><text x="200" y="150" text-anchor="middle" font-weight="700">穀類・野菜・果実</text><text x="620" y="150" text-anchor="middle" font-size="19">米、根菜、葉物、季節の果物</text><text x="200" y="202" text-anchor="middle" font-weight="700">豆類・きのこ・海草</text><text x="620" y="202" text-anchor="middle" font-size="19">豆腐・湯葉、干し椎茸、昆布・わかめ</text><text x="200" y="254" text-anchor="middle" font-weight="700">肉・魚・卵・乳製品</text><text x="620" y="254" text-anchor="middle" font-size="19">不殺生の戒めから使わない</text><text x="200" y="306" text-anchor="middle" font-weight="700">五葷（ごくん）</text><text x="620" y="306" text-anchor="middle" font-size="19">ニンニク・ネギ・ニラ・ラッキョウ・ノビル</text><text x="200" y="358" text-anchor="middle" font-weight="700">出汁</text><text x="620" y="358" text-anchor="middle" font-size="19">昆布と干し椎茸の合わせ出汁</text><text x="200" y="410" text-anchor="middle" font-weight="700">香味づけ</text><text x="620" y="410" text-anchor="middle" font-size="19">生姜・山椒・柚子・胡麻・味噌</text></g><g stroke="#c9bd9f" stroke-width="2"><line x1="40" y1="134" x2="920" y2="134"/><line x1="40" y1="186" x2="920" y2="186"/><line x1="40" y1="238" x2="920" y2="238"/><line x1="40" y1="290" x2="920" y2="290"/><line x1="40" y1="342" x2="920" y2="342"/><line x1="40" y1="394" x2="920" y2="394"/><line x1="40" y1="446" x2="920" y2="446"/><line x1="360" y1="86" x2="360" y2="446"/></g></g></svg>
