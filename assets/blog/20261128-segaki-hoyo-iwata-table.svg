<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-label="施餓鬼法要の要点"><rect width="960" height="490" rx="24" fill="#f6f1e7"/><text x="480" y="58" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#25382b">施餓鬼法要の要点</text><g font-family="sans-serif" font-size="21"><rect x="40" y="86" width="880" height="48" fill="#476642"/><text x="200" y="118" text-anchor="middle" fill="#ffffff" font-weight="700">項目</text><text x="620" y="118" text-anchor="middle" fill="#ffffff" font-weight="700">内容</text><g fill="#25382b"><text x="200" y="150" text-anchor="middle" font-weight="700">供養の相手</text><text x="620" y="150" text-anchor="middle" font-size="19">餓鬼道の霊・供養する人のいない精霊</text><text x="200" y="202" text-anchor="middle" font-weight="700">由来</text><text x="620" y="202" text-anchor="middle" font-size="19">阿難尊者と焔口の物語</text><text x="200" y="254" text-anchor="middle" font-weight="700">依りどころの経典</text><text x="620" y="254" text-anchor="middle" font-size="19">救抜焔口陀羅尼経（不空訳）</text><text x="200" y="306" text-anchor="middle" font-weight="700">法要の中心</text><text x="620" y="306" text-anchor="middle" font-size="19">施餓鬼壇（三界万霊の位牌）</text><text x="200" y="358" text-anchor="middle" font-weight="700">時期</text><text x="620" y="358" text-anchor="middle" font-size="19">定まらず、お盆のころが多い</text><text x="200" y="410" text-anchor="middle" font-weight="700">別の呼び名</text><text x="620" y="410" text-anchor="middle" font-size="19">施食会（せじきえ）</text></g><g stroke="#c9bd9f" stroke-width="2"><line x1="40" y1="134" x2="920" y2="134"/><line x1="40" y1="186" x2="920" y2="186"/><line x1="40" y1="238" x2="920" y2="238"/><line x1="40" y1="290" x2="920" y2="290"/><line x1="40" y1="342" x2="920" y2="342"/><line x1="40" y1="394" x2="920" y2="394"/><line x1="40" y1="446" x2="920" y2="446"/><line x1="360" y1="86" x2="360" y2="446"/></g></g></svg>
