<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-label="施餓鬼会と棚経の比較表"><rect width="960" height="470" rx="24" fill="#f6f1e7"/><text x="480" y="60" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#25382b">施餓鬼会と棚経の違い</text><g font-family="sans-serif" font-size="22"><rect x="50" y="86" width="860" height="48" fill="#476642"/><text x="180" y="118" text-anchor="middle" fill="#ffffff" font-weight="700">項目</text><text x="450" y="118" text-anchor="middle" fill="#ffffff" font-weight="700">施餓鬼会</text><text x="740" y="118" text-anchor="middle" fill="#ffffff" font-weight="700">棚経</text><g fill="#25382b"><text x="180" y="172" text-anchor="middle">場所</text><text x="450" y="172" text-anchor="middle">菩提寺（合同法要）</text><text x="740" y="172" text-anchor="middle">自宅（訪問読経）</text><text x="180" y="232" text-anchor="middle">向け先</text><text x="450" y="232" text-anchor="middle">餓鬼道の霊・無縁の霊</text><text x="740" y="232" text-anchor="middle">その家の先祖</text><text x="180" y="292" text-anchor="middle">中心の設え</text><text x="450" y="292" text-anchor="middle">施餓鬼棚・三界萬霊</text><text x="740" y="292" text-anchor="middle">精霊棚・位牌</text><text x="180" y="352" text-anchor="middle">家の動き</text><text x="450" y="352" text-anchor="middle">寺へ出かけて参列</text><text x="740" y="352" text-anchor="middle">僧侶を迎える</text><text x="180" y="412" text-anchor="middle">時期</text><text x="450" y="412" text-anchor="middle">お盆前後が多い</text><text x="740" y="412" text-anchor="middle">お盆期間（寺が通知）</text></g><g stroke="#c9bd9f" stroke-width="2"><line x1="50" y1="194" x2="910" y2="194"/><line x1="50" y1="254" x2="910" y2="254"/><line x1="50" y1="314" x2="910" y2="314"/><line x1="50" y1="374" x2="910" y2="374"/><line x1="310" y1="86" x2="310" y2="434"/><line x1="600" y1="86" x2="600" y2="434"/></g></g></svg>
