<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="宗派別の本式数珠の表"><rect width="960" height="520" rx="24" fill="#f6f1e7"/><text x="480" y="60" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#25382b">宗派別の本式数珠</text><g font-family="sans-serif" font-size="22"><rect x="50" y="86" width="860" height="48" fill="#476642"/><text x="180" y="118" text-anchor="middle" fill="#ffffff" font-weight="700">宗派</text><text x="430" y="118" text-anchor="middle" fill="#ffffff" font-weight="700">本式数珠の名前</text><text x="700" y="118" text-anchor="middle" fill="#ffffff" font-weight="700">形の特徴</text><g fill="#25382b"><text x="180" y="150" text-anchor="middle">浄土真宗</text><text x="430" y="150" text-anchor="middle">門徒数珠</text><text x="700" y="150" text-anchor="middle" font-size="20">片手（男）・蓮如結びの房（女）</text><text x="180" y="206" text-anchor="middle">浄土宗</text><text x="430" y="206" text-anchor="middle">日課数珠</text><text x="700" y="206" text-anchor="middle" font-size="20">2つの輪／男=三万浄土・女=六万浄土</text><text x="180" y="262" text-anchor="middle">真言宗</text><text x="430" y="262" text-anchor="middle">振分数珠</text><text x="700" y="262" text-anchor="middle" font-size="20">親玉2つ・梵天房（八宗用）</text><text x="180" y="318" text-anchor="middle">天台宗</text><text x="430" y="318" text-anchor="middle">大平天台</text><text x="700" y="318" text-anchor="middle" font-size="20">平玉108玉</text><text x="180" y="374" text-anchor="middle">曹洞宗・臨済宗</text><text x="430" y="374" text-anchor="middle">看経念珠</text><text x="700" y="374" text-anchor="middle" font-size="20">主玉108／曹洞宗のみ銀輪（百八環金）</text><text x="180" y="430" text-anchor="middle">日蓮宗</text><text x="430" y="430" text-anchor="middle">勤行数珠</text><text x="700" y="430" text-anchor="middle" font-size="20">八の字にかけ、房は2本と3本</text></g><text x="480" y="462" text-anchor="middle" fill="#25382b">略式数珠（片手念珠）は宗派を問わず使用可（日蓮宗は本式が正式）</text><text x="480" y="496" text-anchor="middle" font-size="19" fill="#5a6b5e">本式の主玉は108玉が基本（煩悩の数）</text><g stroke="#c9bd9f" stroke-width="2"><line x1="50" y1="134" x2="910" y2="134"/><line x1="50" y1="190" x2="910" y2="190"/><line x1="50" y1="246" x2="910" y2="246"/><line x1="50" y1="302" x2="910" y2="302"/><line x1="50" y1="358" x2="910" y2="358"/><line x1="50" y1="414" x2="910" y2="414"/><line x1="310" y1="86" x2="310" y2="414"/><line x1="550" y1="86" x2="550" y2="414"/></g></g></svg>
