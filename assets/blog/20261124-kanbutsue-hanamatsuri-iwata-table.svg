<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-label="花まつりの基本"><rect width="960" height="490" rx="24" fill="#f6f1e7"/><text x="480" y="58" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#25382b">花まつり（灌仏会）の基本</text><g font-family="sans-serif" font-size="21"><rect x="40" y="86" width="880" height="48" fill="#476642"/><text x="200" y="118" text-anchor="middle" fill="#ffffff" font-weight="700">項目</text><text x="620" y="118" text-anchor="middle" fill="#ffffff" font-weight="700">内容</text><g fill="#25382b"><text x="200" y="150" text-anchor="middle" font-weight="700">日付</text><text x="620" y="150" text-anchor="middle" font-size="19">4月8日（寺により月遅れの5月8日）</text><text x="200" y="202" text-anchor="middle" font-weight="700">正式名称</text><text x="620" y="202" text-anchor="middle" font-size="19">灌仏会（仏生会・浴仏会・降誕会とも）</text><text x="200" y="254" text-anchor="middle" font-weight="700">中心の作法</text><text x="620" y="254" text-anchor="middle" font-size="19">花御堂の誕生仏に柄杓で甘茶をかける</text><text x="200" y="306" text-anchor="middle" font-weight="700">甘茶の由来</text><text x="620" y="306" text-anchor="middle" font-size="19">九竜が清浄の水を注いだ伝説にならう</text><text x="200" y="358" text-anchor="middle" font-weight="700">花御堂</text><text x="620" y="358" text-anchor="middle" font-size="19">藍毘尼園（ルンビニ）をかたどり花で飾る</text><text x="200" y="410" text-anchor="middle" font-weight="700">参拝の用意</text><text x="620" y="410" text-anchor="middle" font-size="19">お賽銭、花の供え（寺の案内を確認）</text></g><g stroke="#c9bd9f" stroke-width="2"><line x1="40" y1="134" x2="920" y2="134"/><line x1="40" y1="186" x2="920" y2="186"/><line x1="40" y1="238" x2="920" y2="238"/><line x1="40" y1="290" x2="920" y2="290"/><line x1="40" y1="342" x2="920" y2="342"/><line x1="40" y1="394" x2="920" y2="394"/><line x1="40" y1="446" x2="920" y2="446"/><line x1="360" y1="86" x2="360" y2="446"/></g></g></svg>
