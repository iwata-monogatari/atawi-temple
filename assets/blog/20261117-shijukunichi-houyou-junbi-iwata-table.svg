<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-label="中陰の7つの節目の表"><rect width="960" height="470" rx="24" fill="#f6f1e7"/><text x="480" y="60" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#25382b">中陰の7つの節目（亡くなった日＝1日目）</text><g font-family="sans-serif" font-size="22"><rect x="50" y="86" width="860" height="48" fill="#476642"/><text x="280" y="118" text-anchor="middle" fill="#ffffff" font-weight="700">節目</text><text x="560" y="118" text-anchor="middle" fill="#ffffff" font-weight="700">日数</text><text x="790" y="118" text-anchor="middle" fill="#ffffff" font-weight="700">備考</text><g fill="#25382b"><text x="280" y="170" text-anchor="middle">初七日</text><text x="560" y="170" text-anchor="middle">7日目</text><text x="790" y="170" text-anchor="middle">葬儀日に繰り上げが多い</text><text x="280" y="222" text-anchor="middle">二七日・三七日・四七日</text><text x="560" y="222" text-anchor="middle">14・21・28日目</text><text x="790" y="222" text-anchor="middle">家族で勤める家が多い</text><text x="280" y="274" text-anchor="middle">五七日</text><text x="560" y="274" text-anchor="middle">35日目</text><text x="790" y="274" text-anchor="middle">三十五日とも呼ぶ</text><text x="280" y="326" text-anchor="middle">六七日</text><text x="560" y="326" text-anchor="middle">42日目</text><text x="790" y="326" text-anchor="middle">—</text><text x="280" y="392" text-anchor="middle" font-weight="700">七七日（四十九日）</text><text x="560" y="392" text-anchor="middle" font-weight="700">49日目</text><text x="790" y="392" text-anchor="middle" font-weight="700">満中陰・忌明け</text></g><g stroke="#c9bd9f" stroke-width="2"><line x1="50" y1="186" x2="910" y2="186"/><line x1="50" y1="238" x2="910" y2="238"/><line x1="50" y1="290" x2="910" y2="290"/><line x1="50" y1="342" x2="910" y2="342"/><line x1="430" y1="86" x2="430" y2="434"/><line x1="690" y1="86" x2="690" y2="434"/></g></g></svg>
