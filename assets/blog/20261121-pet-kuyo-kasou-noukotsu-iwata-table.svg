<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-label="ペットの火葬方式の比較表"><rect width="960" height="330" rx="24" fill="#f6f1e7"/><text x="480" y="58" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#25382b">ペットの火葬方式——返骨の違い</text><g font-family="sans-serif" font-size="21"><rect x="40" y="86" width="880" height="48" fill="#476642"/><text x="130" y="118" text-anchor="middle" fill="#ffffff" font-weight="700">方式</text><text x="400" y="118" text-anchor="middle" fill="#ffffff" font-weight="700">火葬の形</text><text x="660" y="118" text-anchor="middle" fill="#ffffff" font-weight="700">返骨</text><text x="850" y="118" text-anchor="middle" fill="#ffffff" font-weight="700">備考</text><g fill="#25382b"><text x="130" y="150" text-anchor="middle" font-weight="700">合同火葬</text><text x="400" y="150" text-anchor="middle" font-size="19">複数のペットを一緒に火葬</text><text x="660" y="150" text-anchor="middle" font-size="19">なし（慰霊碑へ合祀）</text><text x="850" y="150" text-anchor="middle" font-size="17">霊園に一任</text><text x="130" y="206" text-anchor="middle" font-weight="700">個別火葬</text><text x="400" y="206" text-anchor="middle" font-size="19">1体ずつ火葬</text><text x="660" y="206" text-anchor="middle" font-size="19">あり（骨上げ可）</text><text x="850" y="206" text-anchor="middle" font-size="17">立会い可の施設も</text><text x="130" y="262" text-anchor="middle" font-weight="700">自治体の引き取り</text><text x="400" y="262" text-anchor="middle" font-size="19">自治体の処理として火葬</text><text x="660" y="262" text-anchor="middle" font-size="19">不可のことが多い</text><text x="850" y="262" text-anchor="middle" font-size="17">申込み時に確認</text></g><text x="480" y="282" text-anchor="middle" font-size="19" fill="#5a6b5e">呼び名は業者で違うため「1体だけで焼くか」「骨は返るか」で確かめる</text><g stroke="#c9bd9f" stroke-width="2"><line x1="40" y1="134" x2="920" y2="134"/><line x1="40" y1="190" x2="920" y2="190"/><line x1="40" y1="246" x2="920" y2="246"/><line x1="220" y1="86" x2="220" y2="246"/><line x1="580" y1="86" x2="580" y2="246"/><line x1="740" y1="86" x2="740" y2="246"/></g></g></svg>
