<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="永代供養の個別安置期間の換算表"><rect width="960" height="520" rx="24" fill="#f6f1e7"/><text x="480" y="64" text-anchor="middle" font-family="sans-serif" font-size="31" font-weight="700" fill="#25382b">個別安置の期限（回忌）と満年数</text><g font-family="sans-serif" font-size="24"><rect x="60" y="92" width="840" height="50" fill="#476642"/><text x="280" y="126" text-anchor="middle" fill="#ffffff" font-weight="700">期限の区切り</text><text x="640" y="126" text-anchor="middle" fill="#ffffff" font-weight="700">亡くなってからの年数</text><g fill="#25382b"><text x="280" y="190" text-anchor="middle">七回忌まで</text><text x="640" y="190" text-anchor="middle">満6年</text><text x="280" y="248" text-anchor="middle">十三回忌まで</text><text x="640" y="248" text-anchor="middle">満12年</text><text x="280" y="306" text-anchor="middle">十七回忌まで</text><text x="640" y="306" text-anchor="middle">満16年</text><text x="280" y="364" text-anchor="middle">三十三回忌まで</text><text x="640" y="364" text-anchor="middle">満32年</text><text x="280" y="422" text-anchor="middle">五十回忌まで</text><text x="640" y="422" text-anchor="middle">満49年</text></g><g stroke="#c9bd9f" stroke-width="2"><line x1="60" y1="216" x2="900" y2="216"/><line x1="60" y1="274" x2="900" y2="274"/><line x1="60" y1="332" x2="900" y2="332"/><line x1="60" y1="390" x2="900" y2="390"/><line x1="480" y1="92" x2="480" y2="448"/></g></g><text x="480" y="490" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#66553e">期限を過ぎると合祀へ移ります。年数で区切る寺（例：最後の納骨から50年）もあります</text></svg>
