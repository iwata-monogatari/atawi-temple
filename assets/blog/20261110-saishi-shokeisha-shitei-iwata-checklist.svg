<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" rx="28" fill="#f6f1e7"/><path d="M90 96h780v408H90z" fill="#fff" stroke="#476642" stroke-width="4"/><text x="480" y="64" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#25382b">申し立てる前に確かめる3つ</text><g font-family="sans-serif" text-anchor="middle"><g transform="translate(125 190)"><rect width="230" height="220" rx="18" fill="#e8efe5"/><circle cx="115" cy="52" r="26" fill="#476642"/><text x="115" y="62" font-size="28" fill="#fff">1</text><text x="115" y="118" font-size="25" font-weight="700" fill="#25382b">指定の有無</text><text x="115" y="156" font-size="20" fill="#4c5c50">遺言・ノート・</text><text x="115" y="184" font-size="20" fill="#4c5c50">書付を探す</text></g><g transform="translate(365 190)"><rect width="230" height="220" rx="18" fill="#efe9dd"/><circle cx="115" cy="52" r="26" fill="#8a6b43"/><text x="115" y="62" font-size="28" fill="#fff">2</text><text x="115" y="118" font-size="25" font-weight="700" fill="#3d3021">慣習の確認</text><text x="115" y="156" font-size="20" fill="#66553e">代々の墓守を</text><text x="115" y="184" font-size="20" fill="#66553e">年長者に聞く</text></g><g transform="translate(605 190)"><rect width="230" height="220" rx="18" fill="#e8efe5"/><circle cx="115" cy="52" r="26" fill="#476642"/><text x="115" y="62" font-size="28" fill="#fff">3</text><text x="115" y="118" font-size="25" font-weight="700" fill="#25382b">財産の目録</text><text x="115" y="156" font-size="20" fill="#4c5c50">系譜・祭具・</text><text x="115" y="184" font-size="20" fill="#4c5c50">墳墓を書き出す</text></g></g><text x="480" y="556" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#66553e">3つを確かめても決まらないときは、家庭裁判所の手続案内へ</text></svg>
