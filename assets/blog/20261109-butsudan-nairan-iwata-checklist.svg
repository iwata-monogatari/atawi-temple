<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" rx="28" fill="#f6f1e7"/><path d="M90 96h780v408H90z" fill="#fff" stroke="#476642" stroke-width="4"/><text x="480" y="64" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#25382b">内覧の前に決める3つの確認</text><g font-family="sans-serif" text-anchor="middle"><g transform="translate(125 190)"><rect width="230" height="220" rx="18" fill="#e8efe5"/><circle cx="115" cy="52" r="26" fill="#476642"/><text x="115" y="62" font-size="28" fill="#fff">1</text><text x="115" y="118" font-size="25" font-weight="700" fill="#25382b">撮影範囲</text><text x="115" y="156" font-size="20" fill="#4c5c50">不動産会社と</text><text x="115" y="184" font-size="20" fill="#4c5c50">先に決める</text></g><g transform="translate(365 190)"><rect width="230" height="220" rx="18" fill="#efe9dd"/><circle cx="115" cy="52" r="26" fill="#8a6b43"/><text x="115" y="62" font-size="28" fill="#fff">2</text><text x="115" y="118" font-size="25" font-weight="700" fill="#3d3021">動かし方</text><text x="115" y="156" font-size="20" fill="#66553e">仏壇店へ頼み</text><text x="115" y="184" font-size="20" fill="#66553e">移し先を決める</text></g><g transform="translate(605 190)"><rect width="230" height="220" rx="18" fill="#e8efe5"/><circle cx="115" cy="52" r="26" fill="#476642"/><text x="115" y="62" font-size="28" fill="#fff">3</text><text x="115" y="118" font-size="25" font-weight="700" fill="#25382b">供養の順番</text><text x="115" y="156" font-size="20" fill="#4c5c50">引渡し日から</text><text x="115" y="184" font-size="20" fill="#4c5c50">逆算する</text></g></g><path d="M355 300h10M595 300h10" stroke="#9fa99e" stroke-width="4" stroke-dasharray="10 10"/></svg>
