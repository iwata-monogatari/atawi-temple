<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-label="お彼岸の数え方の表"><rect width="960" height="430" rx="24" fill="#f6f1e7"/><text x="480" y="60" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#25382b">お彼岸の数え方（2027年）</text><g font-family="sans-serif" font-size="22"><rect x="50" y="86" width="860" height="48" fill="#476642"/><text x="180" y="118" text-anchor="middle" fill="#ffffff" font-weight="700">区分</text><text x="420" y="118" text-anchor="middle" fill="#ffffff" font-weight="700">彼岸入り</text><text x="640" y="118" text-anchor="middle" fill="#ffffff" font-weight="700">中日</text><text x="820" y="118" text-anchor="middle" fill="#ffffff" font-weight="700">彼岸明け</text><g fill="#25382b"><text x="180" y="182" text-anchor="middle">春彼岸</text><text x="420" y="182" text-anchor="middle">3月18日</text><text x="640" y="182" text-anchor="middle">3月21日（春分の日）</text><text x="820" y="182" text-anchor="middle">3月24日</text><text x="180" y="252" text-anchor="middle">秋彼岸</text><text x="420" y="252" text-anchor="middle">9月20日</text><text x="640" y="252" text-anchor="middle">9月23日（秋分の日）</text><text x="820" y="252" text-anchor="middle">9月26日</text></g><text x="480" y="330" text-anchor="middle" fill="#25382b">中日をはさんで前後3日ずつ・全部で7日間</text><text x="480" y="372" text-anchor="middle" font-size="19" fill="#5a6b5e">お供えは春＝ぼた餅（牡丹）／秋＝おはぎ（萩）</text><g stroke="#c9bd9f" stroke-width="2"><line x1="50" y1="206" x2="910" y2="206"/><line x1="50" y1="276" x2="910" y2="276"/><line x1="300" y1="86" x2="300" y2="276"/><line x1="540" y1="86" x2="540" y2="276"/><line x1="740" y1="86" x2="740" y2="276"/></g></g></svg>
