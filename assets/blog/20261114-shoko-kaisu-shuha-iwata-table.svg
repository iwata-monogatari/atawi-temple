<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-label="宗派別の焼香の回数表"><rect width="960" height="470" rx="24" fill="#f6f1e7"/><text x="480" y="60" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#25382b">宗派別の焼香の回数</text><g font-family="sans-serif" font-size="22"><rect x="50" y="86" width="860" height="48" fill="#476642"/><text x="230" y="118" text-anchor="middle" fill="#ffffff" font-weight="700">宗派</text><text x="500" y="118" text-anchor="middle" fill="#ffffff" font-weight="700">回数</text><text x="740" y="118" text-anchor="middle" fill="#ffffff" font-weight="700">押しいただく</text><g fill="#25382b"><text x="230" y="172" text-anchor="middle">本願寺派（お西）</text><text x="500" y="172" text-anchor="middle">1回</text><text x="740" y="172" text-anchor="middle">しない</text><text x="230" y="232" text-anchor="middle">真宗大谷派（お東）</text><text x="500" y="232" text-anchor="middle">2回</text><text x="740" y="232" text-anchor="middle">しない</text><text x="230" y="292" text-anchor="middle">曹洞宗</text><text x="500" y="292" text-anchor="middle">2回</text><text x="740" y="292" text-anchor="middle">1回目だけ</text><text x="230" y="352" text-anchor="middle">浄土宗</text><text x="500" y="352" text-anchor="middle">定めなし（1〜3回）</text><text x="740" y="352" text-anchor="middle">眉間の高さに掲げる</text><text x="230" y="412" text-anchor="middle">日蓮宗（参列者）</text><text x="500" y="412" text-anchor="middle">1回</text><text x="740" y="412" text-anchor="middle">する</text></g><g stroke="#c9bd9f" stroke-width="2"><line x1="50" y1="194" x2="910" y2="194"/><line x1="50" y1="254" x2="910" y2="254"/><line x1="50" y1="314" x2="910" y2="314"/><line x1="50" y1="374" x2="910" y2="374"/><line x1="410" y1="86" x2="410" y2="434"/><line x1="600" y1="86" x2="600" y2="434"/></g></g></svg>
