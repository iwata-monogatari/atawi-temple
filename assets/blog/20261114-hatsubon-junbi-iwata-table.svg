<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-label="初盆の判定表"><rect width="960" height="430" rx="24" fill="#f6f1e7"/><text x="480" y="64" text-anchor="middle" font-family="sans-serif" font-size="31" font-weight="700" fill="#25382b">初盆になる年の判定</text><g font-family="sans-serif" font-size="23"><rect x="60" y="92" width="840" height="50" fill="#476642"/><text x="330" y="126" text-anchor="middle" fill="#ffffff" font-weight="700">四十九日と盆の入りの前後</text><text x="720" y="126" text-anchor="middle" fill="#ffffff" font-weight="700">その年のお盆</text><g fill="#25382b"><text x="330" y="196" text-anchor="middle">盆の入りまでに忌明けしている</text><text x="720" y="196" text-anchor="middle">初盆として迎える</text><text x="330" y="268" text-anchor="middle">盆の期間中に四十九日を迎える</text><text x="720" y="268" text-anchor="middle">通常の盆供養（初盆は翌年）</text><text x="330" y="340" text-anchor="middle">盆の後に四十九日を迎える</text><text x="720" y="340" text-anchor="middle">通常の盆供養（初盆は翌年）</text></g><g stroke="#c9bd9f" stroke-width="2"><line x1="60" y1="232" x2="900" y2="232"/><line x1="60" y1="304" x2="900" y2="304"/><line x1="600" y1="92" x2="600" y2="376"/></g></g><text x="480" y="408" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#66553e">盆の入り：8月盆は8月13日、7月盆の地域は7月13日</text></svg>
